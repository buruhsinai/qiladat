ah menjadi pembuluh nadi hasta dan cabangnya yang kecil, pembuluh nadi pengumpil.","a. ulnaris; a. radialis"],["Otot dada kecil menjadi tanda pembagian pembuluh nadi ketiak kita, sehingga ia terbagi.","m. pectoralis minor; a. axillaris"],["Bagian pertama berada sebelum otot itu, dan bagian keduanya berada di belakangnya.","pars prima et pars secunda a. axillaris"],["Bagian ketiga berada sesudahnya, dan itu pasti, yang akan menjelaskan cabang-cabangnya dengan terang.","pars tertia a. axillaris"],["Dari bagian pertama cabangnya tidak banyak: pembuluh dada atas adalah satu-satunya cabangnya.","a. thoracica superior"],["Pembuluh dada-akromion dan pembuluh dada sisi luar berasal dari bagian kedua, yang tertutup oleh otot.","a. thoracoacromialis; a. thoracica lateralis"],["Inilah cabang-cabang bagian ketiga: pembuluh nadi pelingkar lengan atas depan,","a. circumflexa humeri anterior"],["dan yang serupa di belakang, yang melewati ruang segi empat; lintasannya bersama saraf telah ditetapkan.","a. circumflexa humeri posterior; spatium quadrangulare"],["Saraf ketiak ini menjadi temannya, dan pembuluh bawah belikat termasuk cabang-cabangnya.","n. axillaris; a. subscapularis"],["Yang satu, pelingkar belikat, melewati ruang segitiga, sedangkan yang lainnya","a. circumflexa scapulae; spatium trigonum"],["adalah pembuluh dada-punggung; ketahuilah, jangan enggan menghafal dan memahaminya.","a. thoracodorsalis"],["Pembuluh nadi lengan atas berada di sisi dalam lengan, jelas dapat diraba.","a. brachialis"],["Cabangnya ada tiga di salah satu sisinya, maka jangan enggan mempelajari penjelasannya.","rami a. brachialis"],["Pembuluh nadi lengan atas yang dalam termasuk cabang-cabangnya, yang menemani saraf di belakang dalam lintasannya.","a. profunda brachii"],["Saraf pengumpil telah dijelaskan dalam bab tulang, dan di sana disebutkan dengan terang.","n. radialis"],["Cabang-cabangnya ialah cabang deltoid dan cabang depan; tambahkan padanya cabang belakang, dan pastikanlah itu.","a. profunda brachii; ramus deltoideus; ramus anterior; ramus posterior"],["Dua cabang yang terakhir namanya dinisbatkan pada tonjolan di sisi luar yang dilalui.","epicondylus lateralis; a. collateralis radialis"],["Tonjolan sisi dalam telah kujelaskan, dan penjelasan kami di sini bertumpu padanya.","epicondylus medialis"],["Cabang samping hasta yang atas melintas di belakang tonjolan itu,","a. collateralis ulnaris superior; epicondylus medialis"],["dari penghubung pembuluh yang bersama pembuluh balik hasta belakang; ikutilah penjelasannya.","anastomosis; a. recurrens ulnaris posterior"],["Adapun cabang samping hasta yang bawah, ia melintas di depan tonjolan itu.","a. collateralis ulnaris inferior; epicondylus medialis"],["Separuh saraf (saraf median) diletakkan menyertainya, bersambung dengan cabang balik hasta depan.","n. medianus; a. recurrens ulnaris anterior"],["Berilah semua cabang ini haknya berupa hafalan dan pemahaman; jangan remehkan kedudukannya.",""],["Ketahuilah bahwa cabang terkecil dari pembuluh nadi lengan atas pasti dinamai pembuluh nadi pengumpil.","a. brachialis; a. radialis (arteri pengumpil)"],["Dari depan otot pronator bulat, dari kepalanya yang dangkal dekat pengumpil,","m. pronator teres; caput superficiale; radius"],["pembuluh nadi ini lewat di atasnya, mengikuti jalurnya sesudahnya.","a. radialis"],["Di sisi luarnya, saraf pengumpil yang sesuai berjalan menyertainya.","n. radialis (ramus superficialis)"],["Di sisi dalamnya, pada bagian jauhnya, terdapat otot pelentur pergelangan tangan, dan lebih tepatnya,","m. flexor carpi radialis (bagian distal)"],["pembuluh pengumpil yang telah kujelaskan dan kusebut sebelumnya panjang lebar.","a. radialis"],["Kemudian ia melingkar ke belakang hingga berada di cekungan yang dapat diraba tangan ahli.","fossa radialis = anatomical snuffbox (tabatière anatomique)"],["Cabang-cabangnya telah kusajikan dengan adil agar kau mengenalnya lewat isi ucapanku.","rami a. radialis"],["Lengkung telapak dalam berasal dari pembuluh nadi pengumpil, dan inilah kenyataannya.","arcus palmaris profundus"],["Cabang telapak tangan menyebar dari lengkung yang terbentuk ini.","aa. metacarpales palmares"],["Cabang telapak tangan yang dangkal adalah cabang pembuluh pengumpil; waspadalah karena ia bukan lengkung.","ramus palmaris superficialis"],["Dua cabang lain namanya jelas, yaitu cabang pergelangan telapak dan cabang pergelangan punggung.","ramus carpalis palmaris; ramus carpalis dorsalis"],["Bersama cabang-cabang pembuluh hasta yang berhadapan, lengkung-lengkung pergelangan tangan kita terbentuk.","rete carpale palmare; rete carpale dorsale; a. ulnaris"],["Cabang balik pengumpil yang sebenarnya bertemu dengan pembuluh lengan atas yang dalam.","a. recurrens radialis; a. profunda brachii"],["Tambahkan padanya pembuluh asal ibu jari, atau yang utama, nama yang sah.","a. princeps pollicis"],["Juga ada pembuluh pengumpil jari yang bernomor dua (jari telunjuk), agar kau tahu.","a. radialis indicis"],["Ketahuilah bahwa cabang kedua pembuluh nadi lengan atas telah kujelaskan dengan adil tanpa kekurangan.","a. brachialis; a. ulnaris"],["Namanya pembuluh nadi hasta, bagi yang mengikutinya; sudah kujelaskan, maka jangan lengah.","a. ulnaris"],["Ia masuk ke ruang depan yang dangkal, dan yang terakhir itu berjalan di bawahnya.","fossa cubiti"],["Sesudahnya, ia berada di antara dua otot pelentur jari tangan yang sudah dikenal.","m. flexor digitorum superficialis; m. flexor digitorum profundus"],["Di sisi dalamnya, pada bagian jauhnya, terdapat otot pelentur pergelangan tangan, dan lebih tepatnya,","m. flexor carpi ulnaris (bagian distal)"],["itulah pembuluh hasta; penjelasannya terjaga dan perabaan denyutnya dicatat di sini.","a. ulnaris"],["Cabang pembuluh hasta banyak, dan penjelasan kami mendekatkan yang jauh.","rami a. ulnaris"],["Lengkung telapak yang dangkal, dan dari situ keluar cabang-cabang jari telapak.","arcus palmaris superficialis; aa. digitales palmares communes"],["Cabang telapaknya yang dalam menyatu dengan lengkung pengumpil dan terletak di kedalaman.","ramus palmaris profundus; arcus palmaris profundus"],["Dua cabang lain namanya jelas, yaitu cabang pergelangan telapak dan cabang pergelangan punggung.","ramus carpalis palmaris; ramus carpalis dorsalis"],["Bertemu dengan cabang-cabang pembuluh pengumpil, terbentuklah lengkung-lengkung pergelangan tangan; ingatlah.","rete carpale; a. radialis"],["Cabang balik hasta depan telah disebut, dan yang belakang pun datang serupa dan telah dirapikan.","a. recurrens ulnaris anterior; a. recurrens ulnaris posterior"],["Tambahkan padanya pembuluh antartulang bersama; dengan menghafalnya kau menjauh dari jalan gelap.","a. interossea communis"],["Tempat-tempat perabaan yang denyutnya dapat dirasakan akan disebut dengan ujung jari.",""],["Pertama, denyut pembuluh ketiak diraba tepat di cekungan ketiak.","a. axillaris; fossa axillaris"],["Pembuluh lengan atas diraba dari dua tempat; pertama, ia dirasakan di sisi dalam lengan.","a. brachialis; sulcus bicipitalis medialis"],["Selain itu, di cekungan pada siku; cobalah meraba dan yakinlah.","fossa cubiti"],["Di sisi luar kedua otot pelentur pergelangan tangan, pada bagian jauhnya, denyut dapat didengar.","a. radialis; m. flexor carpi radialis"],["Denyut itu kembali ke pembuluh hasta dan pembuluh pengumpil dari lengan bawah manusia.","a. ulnaris; a. radialis"],["Perabaan dari cekungan yang disebut para pembedah itu, atau cekungan yang oleh para penyebutnya dinamai mis'at.","anatomical snuffbox = fossa radialis (tabatière anatomique)"],["Jalinan lengan atas termasuk jalinan-jalinan saraf; telah kusajikan bagi orang-orang yang berpandangan tajam.","plexus brachialis"],["Ia terbagi atas akar dan batang, lalu pembagian dan tali-tali, yang terletak","radices; trunci; divisiones; fasciculi (cords)"],["di segitiga yang berkaitan dengan leher kita dari belakang.","trigonum cervicale posterius (trigonum colli laterale)"],["Persarafannya pada anggota gerak mencakup kulitnya, juga otot-otot yang ada padanya.",""],["Tahap pertama yang dibedah ialah akar, dan di sini telah dijelaskan.","radices"],["Akar terbentuk dari penyatuan cabang-cabang; ketahuilah, saraf-sarafnya perut (depan) dan bernomor.","rami anteriores (ventrales)"],["Dari ruas leher kelima hingga kedelapan, ditambah ruas dada pertama yang menyertainya.","C5–C8; T1"],["Dari situ bercabang saraf dada panjang, tambahkan padanya saraf belikat punggung.","n. thoracicus longus; n. dorsalis scapulae"],["Batang-batang membentuk satu tahap di dalamnya, yang sudah dikenal.","trunci"],["Cabang-cabang batang atasnya datang dari ruas leher kelima dan keenam.","truncus superior; C5–C6"],["Cabangnya berasal dari atas belikat, dan juga dari bawah selangka.","n. suprascapularis; n. subclavius"],["Batang tengahnya mendapat tambahan dari ruas leher ketujuh seorang diri.","truncus medius; C7"],["Batang bawahnya terbentuk dari ruas leher kedelapan dan ruas yang mengikutinya.","truncus inferior; C8–T1"],["Pembagian tiap batang ditetapkan menjadi pembagian depan dan belakang.","divisio anterior; divisio posterior"],["Dari pembagian batang ke bagian perut (depan): yang tengah bersama yang atas dalam urusannya.","divisiones anteriores; truncus medius; truncus superior"],["Dari berkas-berkas serabut itu terbentuklah tali sisi luar (lateral), dan dengan cara yang sama tali sisi dalam (medial) dari bagian bawah; pahamilah demikian.","fasciculus lateralis; fasciculus medialis"],["Dari percabangan batang-batang saraf bagian belakang, terbentuklah tali belakang (posterior) menurut ukurannya.","divisio posterior; fasciculus posterior"],["Adapun cabang-cabangnya yang berada di sisi samping, dan yang terakhir di bagian belakang, terimalah uraiannya, wahai sahabat.","rami terminales plexus brachialis"],["Tali sisi dalam di antara tali-tali itu, cabang-cabangnya telah kujelaskan dalam uraianku.","fasciculus medialis"],["Hafalkanlah ia: dari saraf ulnaris, dan saraf median dengan cabang sisi dalamnya.","n. ulnaris; n. medianus (radix medialis)"],["Adapun cabang-cabang sisi sampingnya dihitung: saraf dada sisi dalam adalah yang dipersarafi dari tali itu.","n. pectoralis medialis"],["Juga saraf kulit lengan bawah sisi dalam, dan saraf kulit lengan atas sisi dalam.","n. cutaneus antebrachii medialis; n. cutaneus brachii medialis"],["Saraf median datang dengan akar lain yang keluar dari tali sisi luarnya.","n. medianus (radix lateralis); fasciculus lateralis"],["Tambahkan padanya saraf otot-kulit; menghafalnya memang memerlukan sedikit usaha.","n. musculocutaneus"],["Saraf dada sisi luar adalah cabang yang naik, terbentuk dari tali sisi luarnya.","n. pectoralis lateralis; fasciculus lateralis"],["Saraf aksilaris dan saraf radialis adalah dua cabang yang keluar dari tali belakangnya.","n. axillaris; n. radialis; fasciculus posterior"],["Saraf bawah belikat dari yang atas, dan yang tengah ditambahkan pada yang bawah.","n. subscapularis superior; n. thoracodorsalis; n. subscapularis inferior"],["Saraf aksilaris, setelah bercabang, melewati ruang berbentuk segi empat.","n. axillaris; spatium quadrilaterum"],["Ia melingkari leher bedah tulang lengan atas; wilayah persarafannya ialah otot segitiga bahu, wahai sahabat.","collum chirurgicum humeri; m. deltoideus"],["Cabang kulitnya diriwayatkan ialah saraf kulit lengan atas sisi luar bagian atas.","n. cutaneus brachii lateralis superior"],["Bila terputus, otot segitiga bahu akan menyusut dan rasa pada kulit di atasnya tak lagi terasa.","atrofi m. deltoideus"],["Saraf radialis, hafalkanlah ia; ia melewati celah segitiga.","n. radialis; spatium triangulare"],["Sesudah itu ia melewati alur di belakang tulang lengan atas.","sulcus nervi radialis"],["Di antara kepala-kepala otot yang berkepala tiga, ia terjepit di antaranya.","m. triceps brachii"],["Ke depan menuju lengan bawah ia berjalan, ke arah tonjolan tulang di sisi luar.","epicondylus lateralis"],["Di sana ia terbagi; ketahuilah, menjadi cabang dalam dan cabang penggerak.","ramus profundus; ramus superficialis"],["Ia melingkari leher tulang pengumpil, mempersarafi seluruh otot peluruh (ekstensor).","collum radii; m. extensores"],["Cabangnya yang dangkal, dan yang depan, mempersarafi kulit kita yang ada di situ.","ramus superficialis n. radialis"],["Dari ibu jari hingga separuh sisi luar jari manis di bagian belakang, kecuali separuh ujungnya; ingatlah itu.","nn. digitales dorsales"],["Cabang-cabang kulitnya yang berakhir di kulit ada tiga, sebagaimana telah tetap.","rami cutanei n. radialis"],["Yaitu saraf kulit lengan atas belakang, dan saraf kulit lengan bawah belakang yang tercatat.","n. cutaneus brachii posterior; n. cutaneus antebrachii posterior"],["Dan saraf kulit lengan atas sisi luar bagian bawah; bila belum hafal sesudahnya, ucapkan hawqalah.","n. cutaneus brachii lateralis inferior"],["Saraf otot-kulit menembus otot korakobrakialis dan dari situ ia keluar.","n. musculocutaneus; m. coracobrachialis"],["Menuju lengan atas ia lewat di antara dua otot di depannya; sebutkanlah keduanya, sudah dijelaskan.","m. biceps brachii; m. brachialis"],["Otot brakialis berada di bawahnya, dan otot berkepala dua berada di atasnya.","m. brachialis; m. biceps brachii"],["Ia mempersarafi semua otot yang disebut tadi, yang dilewatinya di dekatnya.","m. coracobrachialis; m. biceps brachii; m. brachialis"],["Ia mempersarafi kulit sisi luar lengan bawah, dan sama sekali tidak berjalan ke arah tangan.","n. cutaneus antebrachii lateralis"],["Bila terputus, hilang kemampuan menekuk lengan bawah, dan hilang rasa pada sepotong kulitnya.","fleksi antebrachii; n. cutaneus antebrachii lateralis"],["Terjadi kelemahan pada gerak menengadahkan telapak tangan, bukan hilang sama sekali; dan hilangnya rasa kulit sisi luar lengan bawah meluas.","supinasi; n. cutaneus antebrachii lateralis"],["Saraf median, setelah bercabang, berada di depan saraf aksilaris.","n. medianus; n. axillaris"],["Di lengan atas ia menyertai dan berjalan bersama, kadang menyilang.","n. medianus; a. brachialis"],["Ia menyertai pembuluh nadi lengan atas; ia tidak punya cabang, atau paling banyak dua.","a. brachialis"],["Lalu ia melewati lekukan di siku; hal ini tetap menurut uraiannya yang teguh.","fossa cubiti"],["Setelah melewati lekukan itu, ia lewat di antara dua kepala otot pemutar telapak tangan yang bundar.","m. pronator teres"],["Kemudian ia lewat di antara dua otot penekuk jari-jari tangan yang sudah dikenal.","m. flexor digitorum superficialis; m. flexor digitorum profundus"],["Sesudah itu menuju telapak tangan, ia lewat di belakang pengikat otot-otot penekuk.","retinaculum flexorum; canalis carpi"],["Ia mempersarafi otot-otot ibu jari, sebagian besarnya, serta bagian depan dari kompartemen itu.","m. thenaris (otot pangkal ibu jari)"],["Saraf median mengkhususkan persarafannya pada wilayah-wilayah yang telah dijelaskan bagi yang cermat.","n. medianus"],["Dari tiga jari pertama sisi telapaknya dan separuh sisi luar jari keempat.","nn. digitales palmares proprii"],["Sisi punggungnya hanya dari separuh ujungnya, telah dijelaskan dalam uraiannya tanpa berlebihan.","ramus dorsalis; phalanx distalis"],["Saraf ulnaris, menurut kesepakatan, tidak memiliki cabang di lengan bawah.","n. ulnaris"],["Di awalnya ia turun di depannya, lalu ke belakang ia beralih dengan menyilang.","n. ulnaris"],["Ia mengikuti alur yang ada di belakang tonjolan tulang sisi dalam, tempat ia lewat.","sulcus nervi ulnaris; epicondylus medialis"],["Lalu ia lewat di antara dua kepala otot penekuk pergelangan tangan sisi hasta, sesuai namanya.","m. flexor carpi ulnaris"],["Ia berjalan di antara otot itu dan otot yang menekuk jari-jari di lapisan dalam; demikian jalurnya.","m. flexor digitorum profundus"],["Adapun wilayah kulit yang dipersarafinya dan tempat rasa didapat.","area sensoris n. ulnaris"],["Sisi telapak dan satu sisi lagi untuk jari kelingking, sisi punggungnya serta separuh sisi dalam jari manis.","digitus minimus; digitus annularis"],["Jumlah tulangnya pada seorang manusia sama dengan jumlah hari dalam bulan April.","ossa membri inferioris (30 tulang)"],["Berhentilah pada tulang yang dinamai tulang pinggul, dan perhatikan susunannya ketika ia menyatu.","os coxae"],["Di dalamnya ada tiga tulang, dan bentuknya tidak beraturan.","os coxae"],["Yaitu tulang usus, tulang kemaluan, dan tulang duduk, yang pertautannya tampak jelas padanya.","ilium (os ilium); pubis (os pubis); iskium (os ischii)"],["Mangkuk sendi tampak pada sisi luarnya, seperti cawan tempat ketiganya bertemu.","acetabulum"],["Tepi bawahnya tidak utuh, seperti takik yang memberi jalan lewat.","incisura acetabuli"],["Mangkuk sendi memiliki permukaan sendi yang licin, menyerupai tapal yang dikenakan kuda.","facies lunata"],["Dengan permukaan kepala tulang paha yang bulat, tulang panggul memiliki persendian yang mudah bergerak.","caput femoris; articulatio coxae"],["Sebuah lekukan kasar mengelilinginya, menampakkan keterkaitan dengan kepala tulang paha.","fossa acetabuli; caput femoris"],["Di bawah rongga mangkuk sendi kita tampak jelas sebuah lubang yang ditutup oleh selaput,","acetabulum; foramen obturatum; membrana obturatoria"],["kecuali satu saluran untuk lewatnya sebagian unsur (pembuluh dan saraf) yang datang dari rongga panggul.","canalis obturatorius"],["Adapun kekokohannya, tulang panggul terikat kuat dengan tulang belakang,","os coxae; columna vertebralis"],["di belakang melalui sendi sakroiliaka yang paling ideal,","sendi sakroiliaka = articulatio sacroiliaca"],["dan di depan pada pertemuan kedua tulang kemaluan di sambungan tulang kemaluan.","tulang kemaluan = pubis; simfisis pubis (symphysis pubica)"],["Mereka menyerupakan tulang usus yang di atas itu dengan kipas dalam bentuknya,","tulang usus = ilium (os ilium)"],["bagian gagangnya adalah badan tulang, sedangkan selain gagangnya adalah sayap.","corpus ossis ilii; ala ossis ilii"],["Tepi atasnya berupa jengger yang tebal, penanda yang jelas dan baik.","crista iliaca"],["Biopsi sumsum tulang dilakukan darinya, karena mudah diraba pada tubuh.","crista iliaca; sumsum tulang = medulla ossium"],["Tepi itu berakhir di depan dan di belakang dengan dua duri pada setiap manusia.","spina iliaca anterior superior; spina iliaca posterior superior"],["Di belakang duri yang di depan terdapat tonjolan jengger yang tampak,","tuberculum iliacum"],["pada panggul kita di sisi luar kedua tulang usus; dan ada pula dua duri di bawah kedua duri tadi.","spina iliaca anterior inferior; spina iliaca posterior inferior"],["Di bawah duri yang di depan, tulang usus menyatu dengan tulang kemaluan lalu menonjol.","spina iliaca anterior inferior; ilium; pubis"],["Badannya bertemu dengan kedua tulang lainnya di mangkuk sendi, membentuk dua perlimanya.","acetabulum; corpus ossis ilii"],["Adapun permukaannya, bagian-bagiannya memuat tiga garis,","lineae gluteae"],["yang memisahkan wilayah-wilayah tempat berasalnya ketiga bagian besar (otot bokong).","linea glutea anterior; linea glutea posterior; linea glutea inferior; mm. glutei"],["Dan dua hal tampak khas di sisi dalam; yang pertama ialah lekukan yang licin.","fossa iliaca"],["Di belakangnya, melebar, tampak permukaan sakral-panggul,","facies sacropelvica"],["di dalamnya ada permukaan sendi kecil yang berbentuk menyerupai telinga,","facies auricularis"],["terlihat pula tonjolan kasar yang permukaannya menebal.","tuberositas iliaca"],["Pada tepi dalamnya di bagian depan terdapat garis melengkung,","linea arcuata"],["yang memisahkan panggul besar dari panggul mangkuk atau panggul kecil.","pelvis major; pelvis minor"],["Di belakang, ia menjadi batas yang tegas, di atas permukaan yang telah disebut tadi.","facies auricularis; tuberositas iliaca"],["Tulang duduk ialah bagian tulang panggul yang tampak di belakang dan bawah panggul manusia.","tulang duduk = iskium (ischium); os coxae"],["Tulang duduk ini memuat sebuah cabang yang ramping, lalu badan yang lebih tebal.","ramus ossis ischii; corpus ossis ischii"],["Cabang bawah tulang kemaluan menyatu dengan cabangnya (tulang duduk) yang menjulur ke depan.","ramus inferior ossis pubis; ramus ossis ischii"],["Badannya bertemu dengan kedua tulang lainnya di mangkuk sendi, membentuk dua perlimanya.","acetabulum; corpus ossis ischii"],["Tampak di bagian bawah dan belakang sebuah tonjolan besar bagi yang melihatnya,","tuber ischiadicum"],["yang ciri khasnya ialah otot-otot menancap padanya dan kita duduk di atasnya.","tuber ischiadicum"],["Dari tepi belakangnya tampak menonjol sebuah duri berbentuk segitiga,","spina ischiadica"],["yang tampak jelas memisahkan kedua takik tulang duduk;","incisura ischiadica major; incisura ischiadica minor"],["yang besar berada di atas yang kecil, dan keduanya menjadi seperti dua lubang karena dilintasi","foramen ischiadicum majus; foramen ischiadicum minus"],["oleh ligamen sakrospinosum dan ligamen sakrotuberosum.","lig. sacrospinale; lig. sacrotuberale"],["Bagiannya yang kita lihat letaknya di depan, sebutlah ia tulang kemaluan.","tulang kemaluan = pubis (os pubis)"],["Bagian-bagiannya ialah badan, cabang atas, dan satu lagi yang berlawanan arahnya (cabang bawah).","corpus ossis pubis; ramus superior; ramus inferior"],["Badannya pipih, dan kedua cabangnya menjulur ke sisi luar ketika memancar,","corpus ossis pubis; ramus superior; ramus inferior"],["sedangkan dari sisi dalam ia bertemu dengan pasangannya di sambungan tulang kemaluan.","simfisis pubis (symphysis pubica); facies symphysialis"],["Bagian atasnya berupa jengger yang halus dan sampai ke tonjolan kecil di sisi luar.","crista pubica; tuberculum pubicum"],["Cabang atasnya, tanpa dikurangi, ikut membentuk mangkuk sendi kita sebanyak seperlima.","ramus superior ossis pubis; acetabulum"],["Ia dinamai garis sisir, yaitu tepi atasnya, atau tepi tulang kemaluan.","linea pectinea (pecten pubis)"],["Kita jumpai pula alur penyumbat pada permukaan bawahnya yang memanjang.","sulcus obturatorius"],["Cabang bawahnya menyatu tanpa celah dengan cabang tunggal tulang duduk.","ramus inferior ossis pubis; ramus ossis ischii"],["Tulang paha, yang dianggap tulang terkuat di antara tulang-tulang kita, diciptakan oleh Sang Pencipta yang menyempurnakan.","tulang paha = femur"],["Penciptaannya digambarkan paling baik, panjangnya diperkirakan seperempat tinggi tubuh kita.","femur"],["Ia memiliki tonjolan-tonjolan yang muncul di sisi atasnya, jumlahnya empat.","extremitas proximalis femoris"],["Kepalanya yang tampak berbentuk bulat masuk ke mangkuk sendi tulang panggul yang telah disebut.","caput femoris; acetabulum"],["Kepala itu dilapisi tulang rawan, tetapi kenalilah lekukan yang berada dekat pusatnya,","cartilago articularis; fovea capitis femoris"],["karena permukaannya tidak terlapisi; di sana melekat ligamen kepala tulang paha.","fovea capitis femoris; lig. capitis femoris"],["Lehernya yang menghubungkan kepala dan badan tulang adalah bagian yang paling lemah kekuatannya.","collum femoris"],["Ada dua tonjolan besar (trokanter) di antara badan tulang dan leher tulang ini.","trochanter major; trochanter minor"],["Trokanter besar menghadap ke atas, tampak di sisi luar.","trochanter major"],["Pada permukaan dalamnya ada lekukan yang disiapkan bagi apa yang menetap di dalamnya.","fossa trochanterica"],["Trokanter kecil berbentuk seperti kerucut, tampak di sisi dalam tulang.","trochanter minor"],["Di antara kedua trokanter itu, di belakang, terdapat jengger yang memuat tonjolan berbentuk persegi.","crista intertrochanterica; tuberculum quadratum"],["Di depan terdapat garis tempat melekatnya ligamen iliofemoral.","linea intertrochanterica; lig. iliofemorale"],["Garis ini mengikuti nama garis sisir dan mengitari tulang hingga bertemu","linea pectinea femoris"],["dengan tepi garis kasar di sisi dalam; hafalkanlah itu dan tunggulah sebentar.","linea aspera (labium mediale)"],["Ketika hendak dipotong melintang, tampak bahwa bagian tengahnya berbentuk segitiga.","corpus femoris"],["Dua permukaannya berada di belakang, dan satu di depan; perhatikanlah.","facies"],["Ujung jauhnya merapat ke arah garis tengah, dan batangnya melengkung ke depan, kata sang pemerinci.","distal; corpus femoris"],["Sebuah garis kasar tampak menonjol bagi yang memandang dari belakang, dan tertancap di tulang.","linea aspera"],["Pada kedua tepinya melekat otot-otot yang disebut, berguna ketika patah tulang dikembalikan ke tempatnya.","labium mediale; labium laterale"],["Jelas bahwa kedua tepi itu terpisah di sisi bagian jauh dan bagian dekat.","linea aspera"],["Di bagian dekat, tepi dalamnya telah disebut sebelumnya, dan tepi luarnya melebar.","proksimal; labium mediale; labium laterale"],["Tonjolan kasar tempat otot bokong terbesar melekat, dan di bagian jauh perhatikanlah yang berikut.","tuberositas glutea; m. gluteus maximus"],["Keduanya memanjang setelah garis itu berakhir pertemuannya, di atas kondilus yang bersesuaian.","linea supracondylaris medialis; linea supracondylaris lateralis; kondilus (condylus)"],["Garis di sisi dalam, dari arah belakangnya, sampai ke tonjolan kecil tempat otot-otot pendekat melekat.","tuberculum adductorium"],["Banyak tanda dibedakan melalui pemeriksaan ujung bagian jauh.","extremitas distalis"],["Seperti dua kondilus di kedua sisinya, dan di belakang, di antara kedua kondilus itu,","condylus medialis; condylus lateralis"],["terdapat sebuah lekuk, tempat kedua kondilus yang bersambung itu menuju dan menyatu.","fossa intercondylaris"],["Permukaan keduanya membulat, dan di bagian bawah menjadi mendatar.","facies articularis"],["Keduanya berhadapan dengan tulang kering ketika lutut ditekuk dan diluruskan, tanpa terlepas.","tibia; articulatio genus"],["Keduanya menyatu di depan membentuk seperti parit.","facies patellaris"],["Di situ terjadi persendian dengan tempurung lutut, dan di atas tiap kondilus tampak","patela (patella); facies patellaris"],["tonjolan kecil, dan di sisi dalam lebih tinggi lagi sebuah tuberkel, bila tidak terlupakan.","epikondilus (epicondylus); tuberculum adductorium"],["Tempurung lutut lebih besar dari biji wijen, tampak bersudut tiga.","patela (patella)"],["Ia terletak pada tendon otot berkepala empat, dan dengan itu ia terlindungi","m. quadriceps femoris; tendo"],["dari kerusakan di sana; ia adalah penutup bagi setiap lutut.","patela (patella)"],["Dasarnya berada di atas, dan puncaknya yang meruncing di bawah.","basis patellae; apex patellae"],["Di belakangnya ia bersendi dengan kedua kondilus tulang paha kita melalui dua permukaan kecil, saudaraku.","facies articularis; condylus femoris"],["Tulang kering adalah yang terbesar dari dua tulang tungkai bawah kita, yang keberadaannya sangat diperlukan,","tulang kering = tibia"],["karena letaknya di sisi dalam, agar menanggung beban yang sampai kepadanya.","tibia; medial"],["Ujung atasnya berupa dua kondilus, tampak di kedua sisi,","condylus medialis; condylus lateralis tibiae"],["dari atas mendatar, dan bersendi dengan tulang paha yang telah dikenal.","facies articularis superior; femur"],["Di antara permukaan kedua kondilus itu ada daerah pemisah dengan ciri berikut:","area intercondylaris; eminentia intercondylaris"],["pusatnya meninggi seperti tonjolan, terletak di antara kedua permukaannya sebagai pemisah,","eminentia intercondylaris"],["di depan dan di belakangnya, dan di antara keduanya, ada permukaan-permukaan kecil, bagi masing-masing sisi,","area intercondylaris anterior; area intercondylaris posterior"],["tiga banyaknya, agar tertanam dan menetap ujung-ujung kedua meniskus berbentuk bulan sabit.","meniskus (meniscus)"],["Ada pula ligamen bersilang padanya, pada tiap permukaan; perhatikanlah.","ligamentum cruciatum anterius; ligamentum cruciatum posterius"],["Kembalikan pandangan ke tonjolan itu, engkau akan mendapati tuberkel kecil di tiap sisi,","tuberculum intercondylare mediale; tuberculum intercondylare laterale"],["seakan-akan tonjolan tulang kering itu berbentuk segitiga terbalik.","tuberositas tibiae"],["Tonjolan itu tampak di bawah pertautan kedua kondilus, dan dari depan dapat diraba oleh yang berpengalaman.","tuberositas tibiae"],["Bila badan tulang kering dipotong melintang, jika tidak ada cacat,","corpus tibiae"],["engkau mendapatinya berpenampang segitiga; berikut rincian saja yang paling berguna.","corpus tibiae"],["Di depan terdapat tepi yang dikenal, bermula dari tonjolan yang telah disebut.","margo anterior; tuberositas tibiae"],["Permukaan sisi dalamnya beserta kedua tepinya dapat diraba.","facies medialis; margo"],["Pada permukaan belakangnya ada garis berbentuk sandal yang menghubungkan kedua tepinya secara miring,","facies posterior; linea musculi solei (linea solei)"],["dan dari tengah garis ini turun sebuah garis tegak lurus, lalu menghilang.","linea verticalis"],["Demikian pula kita lihat tulang kering melebar di sisi yang paling dekat ke tanah,","extremitas distalis tibiae"],["menyerupai sebuah kotak, tetapi dengan tonjolan menonjol yang terbentuk","extremitas distalis tibiae; malleolus medialis"],["keluar dari sisi dalamnya ke arah bawah; dan seluruhnya bersendi dengan tulang pergelangan kaki.","malleolus medialis; talus (kaki bagian atas)"],["Di sana, di belakangnya, ada alur tegak untuk sebuah tendon yang telah disebut,","sulcus malleolaris; tendo"],["seperti bagian tibia sebelah belakang; dengan ini ia dibedakan dari bagian lainnya.","facies posterior; margo posterior"],["Di sisi luarnya ada takik yang menampung tulang betis.","incisura fibularis; fibula"],["Lalu tulang betis, yang tidak ikut membentuk lutut dan tidak menanggung berat badan kita,","tulang betis = fibula"],["sehingga ia tak mampu untuk itu, karena kecil dan ramping.","fibula"],["Manfaat utamanya adalah menerima otot-otot yang melekat pada permukaannya.","fibula"],["Ia diciptakan di sisi luar, dan dipasang kokoh tanpa banyak goyangan.","fibula; lateral"],["Kepalanya membengkak, dan bagian atas sisi dalamnya hendak bersambung","caput fibulae"],["dengan kondilus luar tulang kering pada ujung yang lain, melalui permukaan sendi yang bundar.","facies articularis capitis fibulae; condylus lateralis tibiae"],["Tonjolan seperti jarum, atau puncaknya, terasa tumpul ketika diraba.","apex capitis fibulae (processus styloideus)"],["Lehernya memisahkan kepala itu dari badannya; cobalah meraba.","collum fibulae; corpus fibulae"],["Perhatikan pula saraf fibularis komunis ketika ia menempuh","n. fibularis communis"],["jalurnya sambil menyentuh tulang itu, dan itu di sisi luar, dari belakang lehernya.","n. fibularis communis; collum fibulae"],["Badannya memiliki tiga permukaan, menurut penjelasan yang terbaik,","corpus fibulae; facies"],["dengan memandang tiap permukaan sebagai terpisah, berhadapan dengan salah satu ruang otot.","kompartemen otot (compartimentum)"],["Permukaan sempit di sisi dalam pada badan tulang itu menghadap ke ruang di bagian depan.","tulang betis = fibula; facies medialis; kompartemen anterior"],["Adapun permukaan yang tampak di belakang, terbagi oleh rusuk yang berada di sisi dalam, sebagaimana lazimnya.","facies posterior; crista medialis"],["Badan tulang betis yang ramping itu berujung, di bagian paling bawahnya, pada suatu pembengkakan pula.","extremitas distalis fibulae"],["Pembengkakan itu disebut mata kaki sisi luar, dan pada permukaan sisi dalamnya tampak","mata kaki luar = malleolus lateralis"],["sebuah bidang sendi kecil yang berhadapan dan sesuai dengan permukaan tulang pergelangan kaki.","facies articularis malleoli lateralis; talus"],["Di atas bidang itu ada permukaan yang berpasangan dengan takik pada tulang kering, permukaannya kasar.","incisura fibularis tibiae; syndesmosis tibiofibularis"],["Pada bagian bawah dan belakangnya ada lekukan mata kaki, yang berperan sebagai asal","fossa malleoli lateralis"],["ikatan antara tulang betis dan tulang pergelangan kaki di belakang; itulah ligamen yang terikat kuat tanpa kelemahan.","lig. talofibulare posterius"],["Di antara dua tepi yang saling bertemu pada kedua tulang tungkai bawah, terbentang sebuah selaput,","membrana interossea cruris"],["untuk mengikat kedua tulang itu satu sama lain dan menjadi tempat tertancapnya otot, sebagaimana telah diketahui.","membrana interossea cruris"],["Pada selaput itu kita temukan dua lubang, di atas dan di bawah, di antara dua ruang.","apertura superior et inferior membranae interosseae"],["Bagian ujung yang menyatu dengan akhir tungkai bawah itu dinamakan kaki.","kaki = pes"],["Sang Mahakuasa membentuknya demikian agar berdiri dan berjalan menjadi baik.",""],["Tulangnya dua puluh ditambah enam, tidak ada tulang lain sama sekali selain itu.","26 tulang"],["Para ahli yang unggul telah menggolongkannya ke dalam beberapa kelompok, semuanya ini:",""],["yaitu pangkal kaki, telapak kaki, dan ruas jari, yang datang berurutan dari belakang.","tulang pangkal kaki = tarsal (tarsus); tulang telapak kaki = metatarsal (metatarsus); ruas jari = falang (phalanges)"],["Tulang yang termasuk pangkal kaki berjumlah tujuh, dan uraian kami tentangnya telah dipaparkan luas.","tarsal (tarsus)"],["Yaitu tulang pergelangan kaki, tumit, tulang perahu, tulang baji yang berada di dekatnya, dan kuboid.","talus; kalkaneus (calcaneus); navikular (os naviculare); kuneiform (ossa cuneiformia); kuboid (os cuboideum)"],["Tulang-tulang itu tersusun dalam dua kelompok; dan sisipkan di antara keduanya sebuah tulang di sisi kaki.","navikular (os naviculare)"],["Kelompok pertama adalah yang dekat; secara hukumnya yang termasuk padanya ialah tulang pergelangan kaki dan tumit.","kelompok proksimal tarsal; talus; kalkaneus (calcaneus)"],["Tulang pergelangan kaki berada di atas semuanya, dan bentuknya menyerupai siput.","talus"],["Mereka melihat bahwa tidak ada otot yang menancap pada permukaan-permukaannya.","talus"],["Bagiannya yang tiga yang dihitung itu ialah kepala dan badan, yang mengapit sebuah leher.","caput tali; corpus tali; collum tali"],["Kepala di depan bersendi dengan tulang perahu setelah berbentuk cembung.","caput tali; navikular (os naviculare)"],["Dan pada bagian bawah kepala itu, tumit bersendi melalui dua bidang kecil.","facies articularis calcanea (anterior et media)"],["Leher yang pendek memuat sebuah alur pada permukaan bawahnya, di tempat ia terikat kokoh,","collum tali; sulcus tali"],["bersama pasangannya pada tumit, membentuk rongga di pangkal kaki; maka buanglah keraguan.","sinus tarsi; sulcus calcanei"],["Di bawah badan tulang terdapat satu bidang kecil, yang berhubungan dengan tumit, wahai pengamat.","facies articularis calcanea posterior"],["Badan itu masuk ke dalam celah yang dibentuk oleh kedua tulang tungkai bawah yang berada di atasnya.","tibia; fibula; mortise pergelangan kaki"],["Namun atapnya berasal dari tulang kering, sedangkan kedua sisinya berasal dari mata kaki.","facies superior (trochlea tali); malleolus medialis et lateralis"],["Tonjolan sisi luar, pada permukaan yang terbesar dari kedua permukaan badan itu, tampak seperti penopang.","processus lateralis tali"],["Tonjolan belakang terlihat ujungnya menjulur ke arah tengkuknya, yakni ke belakang.","processus posterior tali"],["Ia memiliki dua benjolan kecil yang tampak di kedua sisinya, tempat keduanya menonjol","tuberculum mediale et laterale processus posterioris tali"],["ke belakang; dan di antara keduanya terdapat alur yang dilalui sebuah tendon,","sulcus tendinis m. flexoris hallucis longi"],["yaitu otot penekuk ibu jari, yang asli di tungkai kita, maksudku yang panjang.","m. flexor hallucis longus"],["Tulang terbesarnya dinamakan tumit; ia menjaga agar berdiri tidak goyah.","tumit = kalkaneus (calcaneus)"],["Ia memberi bentuk kaki di bagian belakang, dan letaknya di bawah tulang pergelangan kaki yang telah dibahas.","kalkaneus (calcaneus); talus"],["Bentuknya tampak tidak beraturan; ia memiliki enam permukaan yang akan diuraikan.","kalkaneus (calcaneus)"],["Adapun permukaan depan tidak bersendi dengan apa pun selain dengan kuboid.","facies articularis cuboidea; kuboid (os cuboideum)"],["Para ahli bedah anatomi melihat sebuah katrol pada permukaan sisi luarnya, yang dilalui","trochlea fibularis (trochlea peronealis) calcanei"],["dua tendon, di atas dan di bawahnya, milik dua otot fibularis; ketahuilah kedudukannya.","m. fibularis longus; m. fibularis brevis"],["Adapun permukaan belakangnya yang membulat, pada bagian tengahnya tendon itu menancap.","tendon Achilles (tendo calcaneus); facies posterior calcanei"],["Tumit bertumpu pada penopang yang lebih kuat; bagian bawahnya melengkung ke depan,","facies inferior calcanei"],["lalu berlanjut sesudahnya ke telapak, membentuk sebuah benjolan; dan perhatikan","tuber calcanei; planta pedis"],["menonjolnya dua tonjolan darinya, yang berada di kedua sisinya, dan terpisah di antara keduanya","processus medialis et lateralis tuberis calcanei"],["oleh takik yang tampak seperti angka tujuh; dan tonjolan sisi dalam lebih besar.","incisura (takik) pada tuber calcanei; processus medialis"],["Di depan permukaan ini menonjol","tuberculum anterius calcanei"],["sebuah benjolan kecil sebagai tempat menancapnya ligamen tumit-kuboid telapak kaki, yang amat kuat tarikannya.","lig. calcaneocuboideum plantare; tuberculum calcanei"],["Dari sisi dalamnya tumbuh penggantung tulang pergelangan kaki, yang telah tampak mulainya,","sustentaculum tali"],["bagi tendon penekuk ibu jari, dari bawahnya, pada salah satu alur.","m. flexor hallucis longus; sulcus tendinis m. flexoris hallucis longi"],["Penggantung itu menyerupai rak besar dan menopang tulang pergelangan kaki dengan kokoh.","sustentaculum tali"],["Permukaan atasnya bersambung dengan bagian bawah tulang pergelangan kaki melalui","facies superior calcanei; talus"],["tiga bidang kecil saja, dan penggantungnya yang di tengah menjulang tinggi.","facies articularis talaris (anterior, media, posterior); sustentaculum tali"],["Bidang belakang bertemu dengan badan tulang pergelangan kaki, sedangkan dua yang lain bertemu dengan kepalanya pada sendi-sendi.","facies articularis talaris posterior; corpus tali; caput tali"],["Di antara keduanya dan bidang belakang ini terdapat alur yang telah lewat dalam uraianku.","sulcus calcanei"],["Tulang pangkal kaki yang berada di tengah, yaitu tulang perahu, terletak di sisi dalam.","tulang perahu = navikular (os naviculare)"],["Tampak ia berhubungan dengan tulang pergelangan kaki di belakang, dan juga dikelilingi","talus"],["di depan dan di sisi luar oleh tulang-tulang pada sisi yang jauh.","ossa cuneiformia; os cuboideum"],["Benjolannya menonjol bila engkau memeriksa, di sisi dalam permukaan telapak tulang perahu.","tuberositas ossis navicularis"],["Maka rabalah tulang itu di depan, di bawah mata kaki sisi dalam, berupa tonjolan yang keras.","tulang perahu = navikular (os naviculare); tuberositas ossis navicularis; mata kaki dalam = malleolus medialis"],["Kelompok sebelah jauh dari tulang pergelangan kaki dibentuk oleh tiga tulang yang masing-masing berdiri sendiri.","kelompok distal tulang tarsal (ossa tarsi)"],["Yang tampak di antaranya berbentuk seperti pasak, demikian pula tulang dadu yang terlihat jelas.","tulang dadu = kuboid (os cuboideum); tulang baji = kuneiform"],["Tulang-tulang yang menyerupai baji itu berjumlah tiga menurut para ahli anatomi.","tulang baji = kuneiform (ossa cuneiformia)"],["Ketiganya saling menopang satu sama lain, dan di depannya terdapat pangkal-pangkal tulang telapak kaki.","tulang baji = kuneiform; pangkal = basis ossis metatarsalis"],["Hanya yang pertama dari ketiganya itu yang bertemu dengan tulang telapak kaki, dan tulang perahu terikat di belakangnya.","os cuneiforme mediale; tulang perahu = navikular (os naviculare); tulang telapak kaki = metatarsal"],["Tulang dadu pasti bertemu dengan tumit di bagian belakang, dan juga bertemu","tulang dadu = kuboid (os cuboideum); tumit = kalkaneus (calcaneus)"],["dengan dua tulang telapak kaki yang terakhir di depan, sedangkan sisi dalamnya bersendi selaras","tulang telapak kaki = metatarsal IV dan V"],["dengan tulang perahu bagian tengah yang kokoh, dan juga dengan tulang baji yang ketiga.","tulang perahu = navikular (os naviculare); os cuneiforme laterale"],["Pada sisi bawahnya terdapat alur yang membatasi, tempat lewatnya tendon otot fibularis panjang.","alur = sulcus tendinis m. fibularis longi; m. fibularis longus (m. peroneus longus)"],["Bila engkau hendak menghitung tulang telapak kaki, jumlahnya lima dan semuanya terikat","tulang telapak kaki = metatarsal (ossa metatarsi)"],["pada tulang pergelangan kaki yang disebut tadi melalui pangkalnya, sedangkan kepalanya bersambung dengan ruas-ruas jari.","pangkal = basis; kepala = caput; ruas jari = falang (phalanges)"],["Ketahuilah bahwa badan setiap tulang itu terletak di antara kepala dan pangkalnya.","badan = corpus; kepala = caput; pangkal = basis"],["Yang pertama dihitung sebagai yang terbesar, paling ke sisi dalam, dan terpendek.","metatarsal I (os metatarsale I)"],["Di bawah kepalanya tampak dua tulang wijen yang jelas terlihat.","tulang wijen = sesamoid (ossa sesamoidea)"],["Sesudahnya, yang kedua berbadan panjang, dan yang terakhir tanpa ragu memiliki","metatarsal II dan V"],["di sisi luar pangkalnya sebuah tonjolan yang mengarah ke belakang.","tuberositas ossis metatarsalis V"],["Ruas-ruas jari kaki yang sudah dikenal itu jumlahnya empat belas.","ruas jari = falang (phalanges pedis)"],["Tiga ruas untuk setiap jari, kecuali ibu jari yang hanya memiliki dua.","ruas jari = falang (phalanges); ibu jari kaki = hallux"],["Wilayah ini terletak di belakang, di antara lipatan bokong dan puncak tulang usus, tempat bokong tampak.","regio glutealis; lipatan bokong = sulcus gluteus; puncak tulang usus = crista iliaca"],["Setiap suntikan seharusnya dimasukkan ke seperempat bagian luar atas bokong.","kuadran luar atas = quadrans superior lateralis"],["Dengan begitu saraf iskiadikus pada orang dewasa tidak terkena; adapun menyuntik di sana pada anak tidak dianjurkan.","saraf iskiadikus = n. ischiadicus"],["Para ahli menggolongkan otot-otot bokong menurut lapisan permukaan dan lapisan dalamnya.","otot bokong = gluteus; kelompok superfisial dan profunda"],["Pada lapisan permukaan ada empat otot; segeralah dengarkan tentang ketiga otot bokong.","m. gluteus maximus, m. gluteus medius, m. gluteus minimus; m. tensor fasciae latae"],["Yang terbesar di antaranya ialah otot bokong besar, paling besar di seluruh tubuh dan melampaui semua otot dalam bobotnya.","otot bokong besar = m. gluteus maximus"],["Kenalilah asalnya dengan sebenar-benarnya: dari tulang kelangkang, tulang ekor, dan tulang usus.","tulang kelangkang = sakrum (os sacrum); tulang ekor = koksiks (os coccygis); tulang usus = ilium"],["Asalnya berada di belakang garis gluteal belakang, dan juga pada ikatan sendi antara tulang kelangkang dan tonjol tulang duduk.","linea glutea posterior; lig. sacrotuberale"],["Lalu sebagian seratnya melekat pada permukaan tonjolan gluteal pada tulang paha.","tuberositas glutea femoris; tulang paha = femur"],["Melalui sebuah jalur yang tampak berserat dan berikat, otot ini menghubungkan tulang usus dengan tulang kering.","traktus iliotibialis (tractus iliotibialis); tulang kering = tibia"],["Bagian bawahnya bersama-sama meluruskan paha yang tertekuk ketika bekerja.","ekstensi paha pada sendi panggul"],["Otot bokong tengah menutupi yang kecil, dan dengan kontraksi keduanya","m. gluteus medius; m. gluteus minimus"],["pada tungkai yang menapak di tanah, ketika kita berjalan panggul hanya sedikit turun","panggul = pelvis; fase tumpu pada gaya berjalan"],["ke arah sisi tungkai yang terangkat di udara. Adapun asal kedua otot itu pada orang hidup","m. gluteus medius dan minimus"],["ialah tulang usus, dari sisi luarnya; dan ingatlah garis depan pada tulang itu.","ilium; linea glutea anterior"],["Sebab otot yang kecil berasal dari tempat yang terletak di antara garis depan itu dan garis bawah.","m. gluteus minimus; linea glutea anterior dan inferior"],["Dan di antara garis itu dengan garis belakang terdapat asal otot yang tengah, tanpa perselisihan.","m. gluteus medius; linea glutea posterior"],["Keduanya disarafi oleh saraf bokong atas dan melekat pada tonjolan besar di tulang paha.","n. gluteus superior; trokanter besar = trochanter major"],["Yang keempat ialah otot penegang selubung lebar yang terbentang.","m. tensor fasciae latae; fasia lata (fascia lata)"],["Ia terbungkus oleh jalur berikat itu, dan asalnya ialah puncak tulang usus","traktus iliotibialis; crista iliaca"],["dari tempat di antara sebuah tonjolan padanya dan duri yang tinggi di depannya.","tuberculum iliacum; spina iliaca anterior superior"],["Ia menancap pada jalur yang telah disebut tadi, setelah berjalan agak ke belakang dan ke bawah.","traktus iliotibialis"],["Lutut kita ditahan olehnya ketika lurus, dan seperti kedua otot sebelumnya, ia disarafi oleh saraf yang sama.","n. gluteus superior; ekstensi lutut (genu)"],["Dengan selubung dalam, tungkai terbungkus sehingga bentuknya terbatas.","selubung dalam = fasia profunda (fascia profunda); tungkai = ekstremitas inferior"],["Agar otot yang berkontraksi tidak melebar, sehingga pembuluh balik tertekan dan terdorong.","pembuluh balik = vena; pompa otot"],["Bagian selubung yang meliputi paha dan bokong dari segala sisi","fasia (fascia); paha = femur; bokong = regio glutealis"],["dinamai selubung lebar, dan ia turun dari tempat yang tertinggi","selubung lebar = fasia lata (fascia lata)"],["dari tepi atas tungkai, berupa batas yang tebalnya tidak samar.","fasia lata (fascia lata)"],["Di sisi luar ia menebal, lalu membentuk jalur yang kokoh itu.","traktus iliotibialis (tractus iliotibialis)"],["Jalur itu melekat pada tonjolan di puncak tulang usus, lalu terus turun sampai berhenti","tuberculum iliacum; crista iliaca"],["pada sebuah tonjolan bundar di sisi luar tulang kering.","kondilus lateral tibia (condylus lateralis tibiae)"],["Selubung itu membungkus kedua otot yang menyatu dengannya, dan kedua sendi terpaut padanya.","fasia lata (fascia lata); m. gluteus maximus; m. tensor fasciae latae"],["Putaran ke luar pada paha manusia dilakukan oleh lima otot.","rotator lateral paha (musculi rotatores laterales femoris)"],["Letaknya di lapisan dalam dengan ukuran kecil, dan tempat berakhirnya ialah tonjolan besar di tulang paha.","trokanter besar = trochanter major femoris"],["Di atas otot yang menyerupai buah pir, lewat lubang panggul yang besar,","m. piriformis; foramen ischiadicum majus"],["ia memisahkan pembuluh dari saraf; asalnya dari bagian yang berdekatan dengan lubang-lubang tulang kelangkang.","foramina sacralia anteriora; pembuluh = vasa; saraf = nervi"],["Asalnya dari permukaan depan tulang kelangkang, dan sebuah akar saraf menuju ke arahnya.","tulang kelangkang = sakrum (os sacrum); facies pelvica"],["Persarafannya berasal dari dua cabang depan, yakni dari saraf kelangkang pertama dan kedua.","rami anteriores nn. sacralium S1 dan S2"],["Asal kedua otot kembar itu tampak dari tulang duduk, pada dua tempat yang berbeda.","m. gemellus superior; m. gemellus inferior; tulang duduk = iskium (ischium)"],["Asal yang atas ialah duri tulang duduk, dan asal yang bawah ialah tonjolan tulang duduk.","spina ischiadica; tuber ischiadicum"],["Keduanya mengikat sebuah tendon milik otot tersembunyi yang menutup, yang berada di antara keduanya, dan seterusnya.","m. gemellus superior; m. gemellus inferior; m. obturator internus"],["Ketiga tendonnya menyatu menjadi satu, sampai ke tempat lekat yang telah kusebut letaknya.",""],["Otot penutup yang tersembunyi itu berpangkal dari sisi dalam selaput penutup dan dari tepi-tepi yang membatasinya.","m. obturator internus; membrana obturatoria"],["Tampak dengan mata bahwa tendonnya menekuk kira-kira seperempat putaran, di antara","m. obturator internus"],["benjolan dan duri pada tulang duduk, tepatnya di takik kecil yang berlekuk.","benjolan = tuber ischiadicum; duri = spina ischiadica; takik kecil = incisura ischiadica minor"],["Tambahkan pada keempat otot pemutar itu satu otot lagi yang dikenal sebagai otot persegi.","m. quadratus femoris"],["Otot persegi paha itu terletak di bawahnya; ia punya ujung dan pangkal,","m. quadratus femoris"],["pangkalnya berupa benjolan pada tulang duduk yang kaukenal, dan ujung lainnya melekat","tuber ischiadicum"],["pada tonjolan kecil yang bernama sama dengannya di tulang paha bagian atas, sebagaimana lazim disebut.","tuberculus quadratus femoris"],["Mereka membedah paha yang terpisah dari tubuh dan mendapati tiga ruang tempat otot-otot berada.","tiga kompartemen paha"],["Ruang yang berada di depan itu memuat otot penjahit, demikian pula","kompartemen anterior; m. sartorius"],["otot berkepala empat, dan otot iliaka yang menyatu dengannya.","m. quadriceps femoris; m. iliacus"],["Semuanya dipersarafi saraf paha, kecuali otot pinggang besar yang tidak termasuk di dalamnya.","n. femoralis; m. psoas major"],["Otot pinggang itu dipersarafi dari saraf pinggang pertama hingga ketiga, dari cabang depannya.","rami anteriores n. lumbalis L1–L3"],["Otot ini menyatukan otot iliaka bagi yang mengamati, otot pinggang besar, dan sebuah tendon","m. iliopsoas; m. iliacus; m. psoas major"],["bersama yang pasti melekat pada tonjolan kecil tulang paha, di tempat ia menonjol.","trokanter minor (trochanter minor)"],["Namun asal kedua otot itu berbeda, dan setiap asalnya jelas bagi kita.",""],["Asal yang pertama dari tulang usus, dari lekukan yang dikenal para ahli.","fossa iliaca"],["Asal yang lain muncul dari badan seluruh ruas tulang pinggang","corpus vertebrae lumbales"],["dan ruas dada yang terakhir, juga dari bantalan antar-ruas di sana,","vertebra thoracica XII; discus intervertebralis"],["serta dari tonjolan samping ruas-ruas itu; tidak ada asal lain yang perlu kuuraikan.","processus transversus"],["Lalu otot yang berkepala empat, yang berguna meluruskan lutut dengan kuat.","m. quadriceps femoris"],["Keempat bagiannya yang besar ialah tiga otot lebar, lalu satu otot lurus.","m. vastus medialis, lateralis, intermedius; m. rectus femoris"],["Semuanya menyatu dalam satu tendon yang berakhir, dan pusatnya di atas tempurung lutut kita.","tendo quadricipitis; patela (patella)"],["Lalu ligamen tempurung lutut meneruskannya, dari puncak tempurung lutut hingga sampai","ligamentum patellae; apeks patela"],["ke tonjolan tulang kering tempat ia melekat; ada pula struktur yang menahan tempurung lutut tetap pada tempatnya.","tuberositas tibiae; retinaculum patellae"],["Pangkal otot lurus itu memiliki dua kepala, menurut pendapat yang dipegang, pada pinggul.","m. rectus femoris; caput rectum; caput reflexum"],["Kepalanya yang lurus berpangkal dari duri bawah di sisi depan tulang panggul,","spina iliaca anterior inferior (SIAI)"],["sedangkan kepala yang melengkung berpangkal dari tepat di atas mangkuk panggul kita.","caput reflexum; asetabulum (acetabulum)"],["Ketiga otot lebar itu berpangkal dari tulang paha, dan ada yang lain yang tertutup oleh yang lainnya.","m. vastus medialis, lateralis, intermedius; femur"],["Otot lebar sisi dalam berpangkal dari garis antara kedua tonjolan tulang paha dan garis kasar,","m. vastus medialis; linea intertrochanterica; linea aspera"],["tepatnya dari bibir sisi dalamnya, sedangkan yang satunya berpangkal dari garis itu dan dari tonjolan yang besar.","labium mediale lineae asperae; trochanter major"],["Otot-otot lebar kita, yaitu yang sisi luar, berpangkal bersama tonjolan besar tulang paha.","m. vastus lateralis; trokanter mayor (trochanter major)"],["Otot lebar tengah jelas berpangkal dari dua permukaan tulang paha, yaitu depan dan sisi luar, tanpa sisi dalam.","m. vastus intermedius; facies anterior; facies lateralis femoris"],["Otot sendi lutut adalah yang terdalam, kecil, dan awalnya melekat","m. articularis genus"],["pada bagian depan bawah tulang paha, dan ujungnya berada di atas kantong sendi","bursa suprapatellaris; femur"],["tempurung lutut; ia pasti terikat di sana dan menarik kantong itu saat lutut diluruskan agar tidak terjepit.","patela (patella); capsula articularis"],["Otot penjahit bentuknya seperti pita, yang paling dekat dengan permukaan di antara yang kusebut,","m. sartorius"],["dan dihitung sebagai yang terpanjang di antara otot-otot bernama yang diciptakan dalam tubuh.","m. sartorius"],["Bersama pasangannya di seberang, tampak bentuk seperti ketapel milik pemuda.","m. sartorius (kanan dan kiri)"],["Ia berpangkal dari duri panggul bagian atas, yang tampak dari depan.","spina iliaca anterior superior (SIAS)"],["Ia menimbulkan tekukan paha dan tungkai bawah bila berkontraksi tanpa gangguan.","fleksi pada sendi pinggul dan lutut"],["Ukurannya tampak sangat menonjol pada orang yang duduk bersila, seperti penjahit.","m. sartorius"],["Ruang sisi dalam paha memuat, dengan perbedaan pendapat di antara mereka,","kompartemen medial paha"],["lima otot yang memanjang; tambahkanlah padanya otot penutup yang tampak di luar.","m. pectineus; m. adductor longus, brevis, magnus; m. gracilis; m. obturator externus"],["Kelima-limanya mendekatkan paha ke tengah; engkau akan paham sebabnya setelah penjelasannya.","adduksi"],["Otot yang ditambahkan itu memutar paha ke arah sisi luar, maka perhatikanlah.","m. obturator externus; rotasi lateral"],["Otot-otot itu dipersarafi dari saraf penutup, kecuali otot pektineus, lalu saraf paha menyambung.","n. obturatorius; m. pectineus; n. femoralis"],["Bagian otot pendekat terbesar yang menuju belakang lutut dipersarafi","m. adductor magnus (pars ischiocondylaris)"],["oleh saraf ischiadicus dengan cabang-cabangnya yang besar, mempersarafinya dengan segala rujukannya.","n. ischiadicus"],["Otot ramping adalah yang paling banyak berada di sisi dalam, dan turunnya tegak lurus.","m. gracilis"],["Setelah berpangkal dari kemaluan kita, dari badan dan cabang tulangnya yang dekat,","corpus ossis pubis; ramus inferior ossis pubis"],["sebagian ahli menambahkan cabang tulang duduk, dan tempat lekat akhirnya ditetapkan tanpa terlewat.","ramus ossis ischii; insersi (pes anserinus)"],["Otot kemaluan yang berbentuk persegi memanjang dari garisnya pada cabang tulang yang menonjol,","m. pectineus; pecten ossis pubis (ramus superior ossis pubis)"],["berdampingan dengan garisnya yang ada di belakang bagian atas paha.","linea pectinea femoris"],["Otot pendekat panjang tampak di depan kedua saudarinya, dan pangkal","m. adductor longus"],["seratnya ialah permukaan luar badan tulang kemaluan, dan ia melekat pada garis kasar","corpus ossis pubis; linea aspera"],["pada sepertiga tengahnya, dengan dasarnya di sana, sebab bentuknya menyerupai segitiga.","m. adductor longus"],["Di belakangnya, pada tempat yang khas, dan di belakang otot kemaluan, ruang ini (otot pendekat pendek).","m. adductor brevis; m. pectineus"],["Otot adduktor pendek hadir di sini, sebab ia berpangkal dari sisi luar tulang kemaluan.","m. adductor brevis; tulang kemaluan = pubis (os pubis)"],["Ia berasal dari badan tulang kemaluan dan cabang bawahnya, dan melekat di tempat yang dekat (proksimal).","corpus dan ramus inferior ossis pubis; proksimal"],["Pelekatannya di belakang tulang paha, pada sepertiga atas garis kasar yang menonjol.","femur; linea aspera"],["Otot obturator eksternus berpangkal dari sisi luar selaput penutup dan dari tulang yang membatasinya.","m. obturator externus; membrana obturatoria"],["Para ahli mengenal pelekatannya pada lekuk di trokanter besar tulang paha.","fossa trochanterica; trochanter major"],["Adduktor terbesar, secara mutlak, dihitung paling dalam di antara yang telah kusebut.","m. adductor magnus"],["Bentuknya segitiga, dan yang paling dalam dari kedua bagiannya ialah bagian hamstring.","m. adductor magnus; pars ischiocondylaris (bagian hamstring)"],["Ia membentang dari tonjolan tulang duduk hingga ke tonjolan kecil milik tulang paha.","tuber ischiadicum; tuberculum adductorium"],["Letaknya di sisi jauh (distal) tulang paha, dan garis di atas kondilus sisi dalam.","distal; linea supracondylaris medialis; condylus medialis"],["Bagian adduktor yang terkenal itu menyebar dari cabang tulang kemaluan dan cabang tulang duduk.","ramus inferior ossis pubis; ramus ossis ischii"],["Tempat tancap bagian itu, bagi yang menelusurinya, berupa garis dari tonjolan persegi","tuberculum quadratum"],["di paha belakang menuju garis kasar, yakni garis di atas kondilus yang telah dikenal.","linea aspera; linea supracondylaris"],["Di antara kedua bagiannya ada celah tempat pembuluh paha masuk.","hiatus adductorius; a. dan v. femoralis"],["Tampak cekungan berbentuk segitiga di paha bagian atas pada jenazah.","trigonum femorale (segitiga paha)"],["Letaknya di bawah ligamen lipat paha, dan dibatasi dari satu sisi","lig. inguinale"],["oleh otot penjahit di sisi luar, dan di sisi lain oleh otot adduktor panjang.","m. sartorius; m. adductor longus"],["Demikian pula dasarnya dibentuk oleh otot psoas dan otot pektineus.","m. psoas; m. pectineus"],["Atapnya berupa selubung (fasia) dan kulit, dan puncaknya memanjang","fascia lata; cutis; apex"],["ke bawah hingga sepertiga tengah, bagaikan alur di antara otot-otot sekelilingnya.","sepertiga tengah paha"],["Cukuplah engkau menamainya terowongan otot adduktor.","kanalis adduktorius (canalis adductorius)"],["Di belakang paha ada tiga otot panjang.","hamstring"],["Kadang disebut tendon belakang lutut; katakan pada tungkai yang sehat: berkontraksilah,","hamstring; fossa poplitea"],["bila engkau berdiri tegak, atau luruskanlah paha yang tertekuk.","ekstensi paha"],["Ketiganya menerima perintah kerja dari saraf iskiadikus pada bagian tibialisnya.","n. ischiadicus; pars tibialis (n. tibialis)"],["Asal ketiga otot yang banyak itu ialah tonjolan tulang duduk.","tuber ischiadicum"],["Berbeda dari itu, ada satu kepala pendek yang dimiliki otot berkepala dua.","caput breve m. biceps femoris"],["Ia dipersarafi dari saraf iskiadikus yang telah disebut, tetapi dari bagian fibularisnya.","n. ischiadicus; pars fibularis (n. fibularis communis)"],["Asalnya dari bibir sisi luar garis kasar tadi.","labium laterale lineae asperae"],["Adapun yang berkepala dua, tendonnya menancap","m. biceps femoris"],["setelah kedua kepala itu menyatu, terutama pada kepala tulang betis.","caput fibulae"],["Itu di sisi luar, s exa ilium superficialis"],["Lalu dua cabang kemaluan luar, yang pertama dangkal dan yang kedua dalam.","aa. pudendae externae (superficialis dan profunda)"],["Cabang terbesarnya, menurut pendapat yang diterima, adalah pembuluh nadi paha dalam yang terpisah","a. profunda femoris"],["darinya dari sisi luar, di bawah ligamen lipat paha, di dalam segitiga yang telah disebutkan.","lig. inguinale; trigonum femorale"],["Kemudian ia masuk di antara otot pektineus dan otot pendekat panjang,","m. pectineus; m. adductor longus"],["di antara kelompok otot pendekat, lalu berjalan di sana di antara otot panjang itu dan otot pendekat pendek,","m. adductor longus; m. adductor brevis"],["lalu menembus otot pendekat besar; ujung akhirnya menembus seratnya untuk menuju","m. adductor magnus"],["ke belakang tanpa penghalang; karena itu ia dihitung sebagai pembuluh tembus yang keempat.","a. perforans quarta"],["Ketika ia turun mengikuti satu garis di depan otot pendekat pendek, ia akan memberikan","m. adductor brevis"],["tiga cabang tembus yang menembus otot pendekat besar","aa. perforantes; m. adductor magnus"],["di dekat tempat perlekatannya, untuk memasuki kompartemen paha belakang.","compartimentum femoris posterius"],["Semua cabang tembus itu saling bersambung melalui cabang-cabang yang naik atau turun.","anastomosis aa. perforantium"],["Di antara cabang-cabangnya terdapat dua pembuluh nadi paha yang melingkar, satu di sisi dalam dan satu di sisi luar.","a. circumflexa femoris medialis; a. circumflexa femoris lateralis"],["Keduanya muncul dari pembuluh nadi paha atau dari pangkalnya, lalu masing-masing berjalan menempuh jalurnya sendiri.","a. femoralis"],["Yang di sisi dalam melintas di antara dua otot yang berdiri sendiri.","a. circumflexa femoris medialis"],["Kedua otot itu ialah otot pektineus dan yang terbesar dari dua otot pinggang, lalu pembuluh ini menyeberang","m. pectineus; m. psoas major"],["di antara otot penutup yang tampak jelas dan otot pendekat paha yang terpendek."," n tengahnya","calcaneus (tulang tumit)"],["untuk meraba denyutnya tanpa kesulitan, sebab tidak banyak jaringan yang menutupinya,","pulsus a. tibialis posterior"],["di tempat ia bercabang menjadi dua pembuluh nadi telapak kaki yang menyusup","a. plantaris medialis; a. plantaris lateralis"],["di kedua sisi tanpa ragu, tertutup oleh otot penjauh ibu jari kaki.","m. abductor hallucis"],["Di tungkai bawah ia mengaliri bagian-bagian itu dengan darah, kecuali yang telah disebut sebelumnya,","a. tibialis posterior"],["dan tetangga terbesar bagi pembuluh nadi ini; alangkah indahnya berbuat baik kepada tetangga.","a. tibialis posterior"],["Inilah cabang-cabangnya yang menonjol, tanpa memperpanjang uraiannya.","rami a. tibialis posterioris"],["Pembuluh nadi betis yang melingkar berjalan di sisi luar, lalu setelahnya melilit.","a. circumflexa fibularis (a. circumflexa fibulae)"],["Di sana, di sekitar leher tulang betis, cabang ini sampai ke jalinan pembuluh di lutut.","a. circumflexa fibularis; collum fibulae; rete articulare genus"],["Tampak bahwa pembuluh nadi fibularis menyimpang ke sisi luar, lalu berjalan sejajar","a. fibularis (peronea); sisi lateral"],["dengan pembuluh nadi pangkalnya ketika turun, dan di tempat itu ia berada dekat dengan","a. tibialis posterior (arteri pangkal)"],["rabung tulang betis; sesudah itu, di sebelah belakang, ia melintasi pertautan paling ujung kedua tulang tungkai bawah.","crista medialis fibulae; syndesmosis tibiofibularis distalis"],["Ia berakhir dengan cabang-cabang dalam jalinan di sisi luar tumit yang membulat.","rr. calcanei; rete calcaneum"],["Ia mengirim cabang tembus yang bermuara pada pembuluh nadi pendamping asalnya ketika merayap,","ramus perforans; a. tibialis posterior"],["melalui lubang pada selaput di sebelah bawah.","membrana interossea cruris"],["Pembuluh nadi yang dari depan berjalan menuju bagian depan ruang otot, tempat ia mengairi,","a. tibialis anterior; compartimentum anterius"],["menembus selaput di antara kedua tulang tungkai bawahmu, lewat lubang di bagian atasnya.","membrana interossea; tulang kering = tibia; tulang betis = fibula"],["Ia mengeluarkan cabang yang berbalik ke atas, lalu sesudahnya turun di atas selaput.","a. recurrens tibialis anterior"],["Demikian pula ia memberi cabang ke otot di sebelahnya, dan alangkah baik perbuatannya.","rr. musculares"],["Lalu ia berada di ujung tungkai bawah, di antara dua tendon yang dikhususkan bagi","tendo"],["otot tibialis anterior di depan dan otot pelurus ibu jari kaki yang berdampingan dengannya.","m. tibialis anterior; m. extensor hallucis longus"],["Engkau melihat padanya dua cabang mata kaki, di kedua sisi, keduanya ke arah depan,","a. malleolaris anterior medialis; a. malleolaris anterior lateralis"],["yang melintas di belakang kedua tendon sampai ke jalinan mata kaki yang dituju.","rete malleolare"],["Ia meninggalkan tungkai bawah tanpa lelah, di depan ujung tulang kering,","tibia (distal)"],["dan setelah mata kaki ia dinamai pembuluh nadi punggung kaki yang penting.","a. dorsalis pedis; punggung kaki = dorsum pedis"],["Pembuluh telapak kaki yang berjalan di sisi dalam tidak tampak","a. plantaris medialis; planta pedis"],["pada awalnya, kecuali bila engkau menyingkirkan otot penarik ibu jari sepenuhnya.","m. abductor hallucis"],["Di antara otot itu dan otot pelipat jari yang pendek, pembuluh itu tampak menonjol melintang.","m. flexor digitorum brevis"],["Kemudian ia bergabung dengan pembuluh telapak jari yang pertama, yang khusus","a. digitalis plantaris propria"],["bagi sisi dalam ibu jari kaki, dan pangkal tulang telapak kaki menyaksikan","hallux; ossa metatarsalia (basis)"],["keluarnya cabang permukaan darinya, lalu ia memberi tiga cabang agar bergabung","ramus superficialis"],["dengan tiga pembuluh nadi telapak kaki yang pertama di antara tulang telapak kaki.","aa. metatarsales plantares"],["Lebih besar darinya ialah pembuluh nadi telapak kaki sisi luar, yang berjalan di antara dua lapisan otot,","a. plantaris lateralis"],["yaitu otot pelipat jari yang pendek dan otot yang berbentuk persegi.","m. flexor digitorum brevis; m. quadratus plantae"],["Tujuannya ialah tulang telapak kaki kelima, dan di pangkalnya ia melengkung","os metatarsale V"],["ke sisi dalam untuk membentuk lengkung dalam yang membentang di atas","arcus plantaris profundus"],["pangkal tulang-tulang telapak kaki hingga ruang antar-tulang yang pertama,","ossa metatarsalia (bases); spatium interosseum primum"],["tempat pembuluh telapak dalam dari punggung kaki bergabung dengannya.","a. dorsalis pedis (ramus plantaris profundus)"],["Lengkung itu memberi tiga cabang tembus yang naik melintasi jarak (antar tulang),","rr. perforantes"],["yaitu di ruang keempat, ketiga, lalu kedua, di antara tulang-tulang telapak kaki kita yang berdekatan.","spatia interossea IV, III, II"],["Cabang-cabang ini menjadi penghubung dengan pembuluh nadi telapak kaki sisi punggung yang berhadapan.","aa. metatarsales dorsales"],["Demikian pula ia memberi empat cabang pembuluh nadi tulang telapak kaki pada telapak kaki yang terbelah-belah.","aa. metatarsales plantares"],["Keempatnya diikuti oleh cabang-cabang jari yang mengalir","aa. digitales plantares"],["ke sisi-sisi semua jari, kecuali yang satu itu,","aa. digitales plantares propriae"],["yaitu sisi luar kelingking, yang telah didatangi cabang dari lengkung dan itu sudah mencukupinya.","digitus minimus (kelingking kaki); arcus plantaris"],["Pembuluh nadi punggung kaki yang menyusul, berjalan melintasi","a. dorsalis pedis"],["pergelangan kaki di mata kaki, lalu tulang perahu, kemudian tulang baji tengah, tempat ia singgah.","os naviculare; os cuneiforme intermedium"],["Orang yang menekannya di atas bagian itu dapat meraba denyutnya, dan hanya sedikit yang menghalanginya.","pulsus a. dorsalis pedis"],["Letaknya di antara tendon kedua otot pelurus, di dalam ruang depan, bukan dua yang lain.","m. extensor hallucis longus; m. extensor digitorum longus; compartimentum anterius"],["Ketika sampai di awa
