["الشِّرْيَانُ الفَخِذِيُّ Femoral artery", 158, [["اِسْمُ أَهَمِّ نَابِضٍ يُغَذِّيْ", "الطَّرَفَ السُّفْلِيَّ عِنْدَ الفَخِذِ"], ["الفَخِذِيُّ وَالَّذِي قَدْ مُدَّا", "مِنْ حَرْقَفِيٍّ خَارِجِيٍّ عِنْدَا"], ["مُرُورِهِ خَلْفَ الرِّبَاطِ الأُرْبِيْ", "مِنْ تَحْتِهِ يُعْرَفُ نَبْضُ القَلْبِ"], ["أَيْ حِينَمَا يَصِيرُ فِي المُثَلَّثِ", "الفَخِذِيِّ حَيْثُمَا لَمْ يَلْبَثِ"], ["أَنْ صَارَ ضِمْنَ نَفَقِ المُقَرِّبَهْ", "فَاجْتَازَهُ وَقَدْ رَأَوا تَسَرُّبَهْ"], ["مِنْ فُرْجَةٍ لَهَا إِلَى الوَرَاءِ", "فَاخْتَلَفَ اسْمُ ذَلِكَ الوِعَاءِ"]]],
["فُرُوعُ الشِّرْيَانِ الفَخِذِيِّ Branches of the femoral artery", 159, [["فُرُوعُهُ الَّتِي تُرَوِّيْ الجِلْدَا", "عِنْدَ المُثَلَّثِ الَّذِي قَدْ حُدَّا"], ["أَرْبَعَةٌ أَوَّلُهَا شُرْسُوفِيْ", "غَيْرُ عَمِيقٍ بِسُرَّى مَكْشُوفِ"], ["ثَانِي الفُرُوعِ حَرْقَفِيٌّ مُنْعَطِفْ", "غَيْرُ عَمِيقٍ عِنْدَ كُلِّ مَنْ يَصِفْ"], ["وَاثْنَانِ فَرْجِيَّانِ ظَاهِرَانِ", "غَيْرُ عَمِيقٍ وَعَمِيقٌ ثَانِ"]]],
["الشِّرْيَانُ الفَخِذِيُّ العَمِيقُ Deep artery of thigh", 160, [["وَفَرْعُهُ الأَكْبَرُ فِي قَوْلٍ قُبِلْ", "هُوَ العَمِيقُ الفَخِذِيُّ المُنْفَصِلْ"], ["عَنْهُ مِنَ الوَحْشِيِّ تَحْتَ الأُرْبِيْ", "ضِمْنَ المُثَلَّثِ الَّذِي قَدْ أُنْبِيْ"], ["قَدْ رَامَ بَعْدَ ذَلِكَ الدُّخُولَا", "مِنْ بَيْنِ عَانِيَّتِنَا وَالطُّولَى"], ["مِنَ المُقَرِّبَاتِ ثُمَّ مَرَّا", "هُنَاكَ بَيْنَهَا وَبَيْنَ القُصْرَى"], ["ثُمَّ عَلَى الكُبْرَى الَّتِي قَدْ ثَقَبَا", "آخِرُهُ أَلْيَافَهَا لِيَذْهَبَا"], ["إِلَى الوَرَاءِ دُونَ أَيِّ حَاجِبِ", "لِذَا يُعَدُّ رَابِعَ الثُّوَاقِبِ"]]],
["الشَّرَايِينُ الثَّاقِبَةُ Perforating arteries", 161, [["وَعِنْدَمَا يَنْزِلُ ضِمْنَ خَطٍّ", "أَمَامَ قُصْرَاهُنَّ سَوْفَ يُعْطِيْ"], ["ثَلَاثَةً مِنَ الفُرُوعِ الثَّاقِبَهْ", "تَخْتَرِقُ الكَبِيرَةَ المُقَرِّبَهْ"], ["بِالقُرْبِ مِنْ مَكَانِ الِارْتِكَازِ", "لِتَدْخُلَ الخَلْفِيَّ مِنْ أَحْيَازِ"], ["كُلُّ الفُرُوعِ الثَّاقِبَاتِ اتَّصَلَتْ", "عَبْرَ فُرُوعٍ صَعَدَتْ أَوْ نَزَلَتْ"]]],
["الشِّرْيَانَانِ الفَخِذِيَّانِ المُنْعَطِفَانِ الإِنْسِيُّ وَالوَحْشِيُّ Lateral and medial circumflex femoral arteries", 162, [["وَإِنَّ مِنْ فُرُوعِهِ المُنْعَطِفَيْنْ", "الفَخِذِيَّيْنِ لِكِلْتَا الجِهَتَيْنْ"], ["النَّاشِئَيْنِ مِنْهُ أَوْ مِنْ أَصْلِهِ", "وَسَارَ كُلٌّ مِنْهُمَا فِي دَرْبِهِ"]]],
["الشِّرْيَانُ الفَخِذِيُّ المُنْعَطِفُ الإِنْسِيُّ Medial circumflex femoral artery", 163, [["وَمَرَّ إِنْسِيُّهُمَا مِنْ بَيْنِ", "عَضَلَتَيْنِ مُسْتَقِلَّتَيْنِ"], ["إِنَّهُمَا عَانِيَّةٌ وَأَكْبَرُ", "القَطَنِيَّتَيْنِ ثُمَّ يَعْبُرُ"], ["بَيْنَ مُسِدَّةٍ تَكُونُ ظَاهِرَهْ", "وَأَقْصَرِ المُقَرِّبَاتِ الحَاضِرَهْ"], ["وَفَوْقَ كُبْرَاهُنَّ حَيْثُ وَلَدَا", "اِثْنَيْنِ فَالأَوَّلُ مَنْ قَدْ صَعَدَا"], ["لِحُفْرَةٍ فِي المَدْوَرِ الكَبِيرِ", "حَيْثُ التَّفَاغُرَاتُ لِلْبَصِيرِ"], ["مُسْتَعْرِضُ الفَرْعَيْنِ ذُو الدَّبِيبِ", "أَسْهَمَ فِي التَّفَاغُرِ الصَّلِيبِيْ"]]],
["الشِّرْيَانُ الفَخِذِيُّ المُنْعَطِفُ الوَحْشِيُّ Lateral circumflex femoral artery", 164, [["بَيْنَ فُرُوعِ عَصَبٍ قَدْ وُسِمَا", "بِالفَخِذِيِّ مَرَّ وَحْشِيُّهُمَا"], ["فِي عُمْقِ خَيَّاطِيَّةٍ قَدْ سَارَا", "وَعُمْقِ مُسْتَقِيمَةٍ وَصَارَا"], ["مُسْتَعْرِضًا وَنَازِلًا وَصَاعِدَا", "فَذُو الصُّعُودِ لَا يَكُونُ حَائِدَا"]]],
["الفَرْعُ الصَّاعِدُ وَالفَرْعُ النَّازِلُ Ascending branch and descending branch", 165, [["عَنِ المَسِيرِ تَحْتَ مَنْ تُوَتِّرُ", "لِفَافَةً عَرِيضَةً وَيُفْغَرُ"], ["عَلَيْهِ ذَاكَ الآخَرُ المُنْعَطِفُ", "وَشَكَّلَا حَلَقَةً تَلْتَفِفُ"], ["أَحْسَنَ الِالْتِفَافِ حَوْلَ عُنُقِ", "العَظْمِ كَيْ تَجُودَ بِالتَّصَدُّقِ"], ["عَلَيْهِ بِالدِّمَاءِ كَيْ لَا يُنْخَرَا", "كَذَا عَلَى الرَّأْسِ الَّذِي تَكَوَّرَا"], ["وَيَنْفُذُ النَّازِلُ مِنْ مُتَّسِعَهْ", "وَحْشِيَّةٍ لِكُلِّ مَنْ تَتَبَّعَهْ"], ["وَقَبْلَ أَنْ يَبْلُغَ رُكْبَةً رَضِيْ", "حُدُوثَ وَصْلِهِ بِفَرْعٍ مَأْبِضِيْ"]]],
["الفَرْعُ المُسْتَعْرِضُ Transverse branch", 166, [["وَكَانَ مُسْتَعْرِضُهُ مُخْتَرِقَا", "مَا اخْتَرَقَ النَّازِلُ ثُمَّ طَوَّقَا"], ["مِنْ قِسْمِ جِسْمِ الفَخِذِ القَرِيبِ", "شَارَكَ فِي التَّفَاغُرِ الصَّلِيبِيْ"], ["مَعَ الوِعَاءِ الأَلَوِيِّ الأَسْفَلِ", "وَالثَّاقِبِ الَّذِي أَتَى فِي الأَوَّلِ"], ["وَأَضِفِ المُنْعَطِفَ الإِنْسِيَّا", "لَهُنَّ وَلْتَكُنْ بِهِ حَفِيَّا"]]],
["الشِّرْيَانُ السَّدَادِيُّ Obturator artery", 167, [["ثُمَّ السَّدَادِيُّ الَّذِي قَدْ مَاثَلَا", "فِي مُبْتَدَاهُ الأَلَوِيَّ السَّافِلَا"], ["وَقَدْ مَشَى عَلَى الجِدَارِ الجَانِبِيْ", "فِي الحَوْضِ حَيْثُ كَانَ قُرْبَ الحَالِبِ"], ["وَقَدْ عَلَاهُ العَصَبُ المُوَافِقُ", "وَتَحْتَهُ أَيْضًا وَرِيدٌ لَاحِقُ"]]],
["تتمة نظم الشريان السدادي Obturator artery (lanjutan)", 168, [["وَعِنْدَمَا أَبْصَرَ نُورَ النَّفَقِ", "فَوْقَ الغِشَاءِ اجْتَازَهُ وَمَا بَقِيْ"], ["كَمَا عَهِدْتَهُ وِعَاءً فَرْدَا", "فَلَا يَدُومُ الحَالُ مَهْمَا امْتَدَّا"], ["بَلْ يَحْصُلُ انْقِسَامُهُ فَرْعَيْنِ", "فِي الخَلْفِ وَالأَمَامِ كَائِنَيْنِ"], ["وَطَوَّقَا مُحِيطَ حَافَةِ الغِشَا", "وَاتَّحَدَا مِنْ أَسْفَلٍ ضِمْنَ حَشَا"], ["عَضَلَةٍ تَسُدُّهُ مِنْ ظَاهِرِ", "دَمُهُمَا لِلْعَضَلِ المُجَاوِرِ"], ["وَقَوْلُهُمْ يَنْشَأُ فَرْعٌ حُقِّيْ", "مِنْ فَرْعِهِ الخَلْفِيِّ قَوْلُ صِدْقِ"], ["مِنْ ثُلْمَةٍ حُقِّيَّةٍ ذُو نَفَذِ", "لِيُعْطِيَ الدِّمَاءَ رَأْسَ الفَخِذِ"]]],
["الشِّرْيَانُ المَأْبِضِيُّ Popliteal artery", 169, [["إِنَّ الوِعَاءَ الفَخِذِيَّ إِنَّمَا", "يُعْرَفُ بِاسْمِ المَأْبِضِيِّ بَعْدَمَا"], ["يَمُرُّ لِلْوَرَاءِ عَبْرَ فُرْجَهْ", "ذَكَرْتُهَا وَبَعْدَهَا تَوَجَّهْ"], ["لِلْحُفْرَةِ الَّتِي وَرَاءَ الرُّكْبَهْ", "فِيهَا لِهَذَا الشِّرْيَانِ خَيْرُ صُحْبَهْ"], ["قَدْ رَافَقَتْهُ كَوَرِيدِ المَابِضِ⁽¹⁾", "وَعَصَبِ الظُّنْبُوبِ غَيْرِ الغَائِضِ"], ["فِيهَا يَجُسُّ نَبْضَهُ المُرِيدُ", "لَكِنْ إِلَى إِنْسِيِّهَا يَحِيدُ"], ["وَكَانَ جَسُّ ذَاكَ صَعْبَ الفِعْلِ", "لِكَوْنِهِ الأَعْمَقَ مِمَّا أُمْلِيْ"]]], ["فُرُوعُ الشِّرْيَانِ المَأْبِضِيِّ فِي الحُفْرَةِ المَأْبِضِيَّةِ Branches of the popliteal artery in the popliteal fossa", 170, [["إِنَّ فُرُوعَ المَأْبِضِيِّ ضِمْنَا", "حُفْرَتِهِ عَدِيدَةٌ وَهُنَا:"], ["اثْنَانِ رَبْلِيَّانِ نَحْوَ العَضَلِ", "أَمَّا فُرُوعُهُ الَّتِي لِلْمَفْصِلِ"], ["فَاثْنَانِ رُكْبِيَّانِ عُلْوِيَّانِ", "فِي جَانِبَيْ رُكْبَةِ كُلٍّ فَانِ"], ["وَاثْنَانِ رُكْبِيَّانِ سُفْلِيَّانِ", "كَذَاكَ عِنْدَ الجَانِبَيْنِ ذَانِ"], ["وَالأَوْسَطُ الرُّكْبِيُّ لِلْأَمَامِ", "يَسِيرُ نَحْوَ رُكْبَةِ المُقَامِ"]]], ["تَتِمَّةُ مَسِيرِ الشِّرْيَانِ المَأْبِضِيِّ وَفَرْعَاهُ الِانْتِهَائِيَّانِ Popliteal artery (course continued) and its terminal branches", 171, [["هَلْ تَذْكُرُ العَضَلَةَ السَّاقِيَّهْ", "فَبَيْنَهَا وَبَيْنَ مَأْبِضِيَّهْ"], ["يَسِيرُ لِلْخَلْفِيِّ مِنْ حَيَاوِزِ⁽¹⁾", "السَّاقِ ثُمَّ كَانَ ذَا تَجَاوُزِ"], ["لِقَوْسِ نَعْلِيَّتِنَا مِنْ تَحْتِهِ", "أَلَا وَأَعْطَى خَلَفًا مِنْ بَعْدِهِ"], ["فَرْعَيْنِ كُلُّ وَاحِدٍ ظُنْبُوبِيْ", "فِي الخَلْفِ وَالأَمَامِ مِنْ دُرُوبِ"], ["يَشْهَدُ هَذَا الِانْقِسَامَ أَعْمَقُ", "نَاحِيَتَيْهِ أَوْ مَكَانٌ أَسْبَقُ"]]], ["الشِّرْيَانُ الظُّنْبُوبِيُّ الخَلْفِيُّ Posterior tibial artery", 172, [["وَتَابَعَ الخَلْفِيُّ فِي مَسَارِ", "المَأْبِضِيِّ دُونَمَا ازْوِرَارِ⁽¹⁾"], ["يَنْزِلُ فِي النَّاحِيَةِ المَخْفِيَّهْ", "وَرَاءَ ظُنْبُوبِيَّةٍ خَلْفِيَّهْ"], ["ثُمَّ وَرَا قَابِضَةِ الأَصَابِعِ", "عَلَيْهِمَا يَسِيرُ بِالتَّتَابُعِ"], ["ثُمَّ يَمُرُّ مِنْ وَرَا الظُّنْبُوبِ", "وَخَلْفَ إِنْسِيٍّ مِنَ الكُعُوبِ"]]], ["تتمة نظم الشريان الظنبوبي الخلفي Posterior tibial artery (lanjutan)", 173, [["وَبَيْنَهُ وَبَيْنَ عَظْمِ العَقِبِ", "مَسَافَةٌ مِنْ نِصْفِهَا فَاقْتَرِبِ"], ["لِجَسِّ نَبْضِهِ بِغَيْرِ حَرَجِ", "إِذْ لَمْ تُغَطِّهِ كَثِيرُ نُسُجِ"], ["حَيْثُ إِلَى الفَرْعَيْنِ قَدْ تَشَعَّبَا", "الأَخْمَصِيَّيْنِ اللَّذَيْنِ انْسَرَبَا"], ["فِي الجَانِبَيْنِ دُونَمَا إِحْجَامِ", "غَطَّتْهُمَا مُبْعِدَةُ الإِبْهَامِ"]]], ["الفروع Branches of the posterior tibial artery", 174, [["وَكَانَ فِي السَّاقِ مُرَوٍّ بِالدِّمَا", "أَحْيَازَهَا إِلَّا الَّذِي تَقَدَّمَا"], ["وَأَعْظُمَ الجِوَارِ لِلشِّرْيَانِ", "يَا حَبَّذَا الإِحْسَانُ لِلْجِيرَانِ"], ["وَهَاكَ مِنْ فُرُوعِهِ المُمَيَّزَا", "بِدُونِ بَسْطِ شَرْحِهَا تَجَوُّزَا"]]], ["الشِّرْيَانُ الشَّظَوِيُّ المُنْعَطِفُ Circumflex fibular artery", 174, [["إِنَّ الوِعَاءَ الشَّظَوِيَّ المُنْعَطِفْ", "يَسِيرُ وَحْشِيًّا وَبَعْدُ يَلْتَفِفْ"], ["هُنَاكَ حَوْلَ عُنُقِ الشَّظِيَّهْ", "وَيَبْلُغُ الشَّبَكَةَ الرُّكْبِيَّهْ"]]], ["الشِّرْيَانُ الشَّظَوِيُّ Fibular artery", 175, [["يُلْحَظُ أَنَّ الشَّظَوِيَّ انْحَازَا", "لِلْجَانِبِ الوَحْشِيِّ ثُمَّ وَازَى"], ["شِرْيَانَ أَصْلِهِ لَدَى التَّدَلِّي", "وَكَانَ قُرْبَهُ بِهَذَا المَحَلِّ"], ["عُرْفُ شَظِيَّةٍ وَبَعْدَهُ وَرَا", "أَقْصَى ارْتِبَاطِ العَظْمَتَيْنِ عَبَرَا"], ["وَيَنْتَهِيْ بِأَفْرُعٍ فِي شَبَكَهْ", "وَحْشِيِّ عَظْمِ عَقِبٍ مُكَبْكَبَهْ⁽أ⁾"], ["أَرْسَلَ فَرْعًا ثَاقِبًا قَدْ صَبَّا", "عَلَى قَسِيمِ⁽ب⁾ أَصْلِهِ إِذْ دَبَّا"], ["مِنْ فَتْحَةٍ مِنَ الغِشَاءِ سُفْلَى", "فَالبِرُّ عِنْدَ الكُرَمَا لَا يَبْلَى"]]], ["الشِّرْيَانُ الظُّنْبُوبِيُّ الأَمَامِيُّ Anterior tibial artery", 176, [["مَرَّ الَّذِي مِنَ الأَمَامِ نَحْوَا", "مُقَدَّمِ الأَحْيَازِ حَيْثُ رَوَّى"], ["عَبْرَ الغِشَاءِ بَيْنَ عَظْمَيْ سَاقِكَا", "مِنْ فَتْحَةٍ عُلْوِيَّةٍ فِي ذَلِكَا"], ["يُخْرِجُ فَرْعًا رَاجِعًا إِلَى عَلُ", "وَبَعْدَهُ عَلَى الغِشَاءِ يَنْزِلُ"], ["كَذَاكَ أَعْطَى أَفْرُعًا إِلَى عَضَلْ", "مُجَاوِرٍ لَهُ وَنِعْمَ مَا فَعَلْ"], ["ثُمَّ يَكُونُ حَاضِرًا فِي أَقْصَى", "السَّاقِ بَيْنَ وَتَرَيْنِ خُصَّا"], ["عَضَلَةَ الظُّنْبُوبِ فِي الأَمَامِ", "وَالجَارَةَ البَاسِطَةَ الإِبْهَامِ"]]], ["تتمة نظم الشريان الظنبوبي الأمامي Anterior tibial artery (lanjutan)", 177, [["تَرَى لَهُ فَرْعَيْنِ كَعْبِيَّيْنِ", "فِي الجَانِبَيْنِ وَأَمَامِيَّيْنِ"], ["مَرَّا وَرَاءَ الوَتَرَيْنِ حَتَّى", "شَبَكَةِ الكَاحِلِ حَيْثُ تُؤْتَى"], ["وَغَادَرَ السَّاقَ بِلَا لُغُوبِ", "أَمَامَ أَقْصَى عَظْمَةِ الظُّنْبُوبِ"], ["وَصَارَ بَعْدَ كَاحِلٍ يُسَمَّى", "شِرْيَانَ ظَهْرِ القَدَمِ المُهِمَّا"]]], ["الشِّرْيَانُ الأَخْمَصِيُّ الإِنْسِيُّ Medial plantar artery", 178, [["إِنَّ الوِعَاءَ الأَخْمَصِيَّ السَّائِرَا", "فِي الجَانِبِ الإِنْسِيِّ لَيْسَ ظَاهِرَا"], ["فِي بَدْئِهِ إِلَّا إِذَا نَزَعْتَا", "مُبْعِدَةَ الإِبْهَامِ نَزْعًا بَتَّا"], ["وَبَيْنَهَا وَبَيْنَ قُصْرَى تَقْبِضُ", "أَصَابِعًا لَهُ بُرُوزٌ يَعْرِضُ"]]], ["تتمة نظم الشريان الأخمصي الإنسي Medial plantar artery (lanjutan)", 179, [["وَانْضَمَّ بَعْدُ لِلْوِعَاءِ الأَخْمَصِيْ", "الإِصْبِعِيِّ الأَوَّلِ المُخَصَّصِ"], ["لِجَانِبِ الإِبْهَامِ فِي الإِنْسِيِّ", "وَشَهِدَتْ قَاعِدَةُ المِشْطِيِّ"], ["تَفَرُّعَ السَّطْحِيِّ مِنْهُ ثُمَّمَا", "أَعْطَى ثَلَاثَةً لِكَيْ تَنْضَمَّا"], ["إِلَى ثَلَاثَةٍ مِنَ المِشْطِيَّهْ", "الأَخْمَصِيَّةِ الأَوَائِلِيَّهْ"]]], ["الشِّرْيَانُ الأَخْمَصِيُّ الوَحْشِيُّ Lateral plantar artery", 180, [["أَكْبَرُ مِنْهُ الأَخْمَصِيُّ الوَحْشِيْ", "بَيْنَ اثْنَتَيْ طَبَقَتَيْنِ يَمْشِي"], ["إِنَّهُمَا القَصِيرَةُ الَّتِي ثَنَتْ", "أَصَابِعًا كَذَا الَّتِي تَرَبَّعَتْ"], ["وَالخَامِسُ المِشْطِيُّ مُبْتَغَاهُ", "فَعِنْدَ قَاعِدَتِهِ انْحِنَاهُ"], ["لِلْجَانِبِ الإِنْسِيِّ كَيْ يُشَكَّلَا", "قَوْسًا⁽أ⁾ عَمِيقًا ذُا تَمَدُّدٍ عَلَى"], ["قَوَاعِدٍ لِلأَعْظُمِ المِشْطِيَّهْ", "لِأَوَّلِ المَسَاوِفِ⁽ب⁾ البَيْنِيَّهْ"], ["حَيْثُ يَكُونُ مِنْهُ ذَا تَخَلُّصِ", "إِلَيْهِ ذَلِكَ العَمِيقُ الأَخْمَصِيْ"]]], ["فُرُوعُ القَوْسِ الأَخْمَصِيَّةِ العَمِيقَةِ — الفُرُوعُ الثَّاقِبَةُ Perforating branches of the deep plantar arch", 181, [["تُعْطِيْ ثَوَاقِبًا ثَلَاثَةً بَدَا", "لَهَا صُعُودٌ بِاجْتِيَازٍ لِلْمَدَى⁽¹⁾"], ["الرَّابِعِ الثَّالِثِ ثُمَّ الثَّانِيْ", "بَيْنَ عِظَامِ مِشْطِنَا فِي الدَّانِيْ"], ["وَأَصْبَحَتْ هَذِيْ الفُرُوعُ وَاصِلَهْ", "مِشْطِيَّةً ظَهْرِيَّةً مُقَابِلَهْ"]]], ["الشَّرَايِينُ المِشْطِيَّةُ الأَخْمَصِيَّةُ Plantar metatarsal arteries", 182, [["كَذَاكَ تُعْطِيْ أَرْبَعًا مِنْ أَفْرُعِ", "مِشْطِيَّةٍ فِي الأَخْمَصِ المُبَضَّعِ"], ["تَخْلُفُ أَرْبَعَتَهَا الفُرُوعُ", "الإِصْبِعِيَّةُ الَّتِي تَنُوعُ⁽أ⁾"], ["نَيْعًا إِلَى جَوَانِبِ الأَصَابِعِ", "جَمِيعِهَا بِدُونِ ذَاكَ الوَاقِعِ"], ["وَحْشِيَّ خِنْصَرٍ فَقَدْ أَتَاهُ", "فَرْعٌ مِنَ القَوْسِ وَقَدْ كَفَاهُ"]]], ["الشِّرْيَانُ الظَّهْرِيُّ لِلْقَدَمِ Dorsalis pedis artery", 183, [["وَمَا ائْتَلَى⁽أ⁾ شِرْيَانُ ظَهْرِ القَدَمِ", "يَذْرُعُ⁽ب⁾ فَوْقَ الرُّصْغِ المُنْتَظَمِ"], ["بِكَاحِلٍ فَزَوْرَقِيٍّ ثُمَّا", "أَوْسَطِ إِسْفِينِيَّةٍ أَلَمَّا⁽ج⁾"], ["قَدِ اسْتَطَاعَ جَسَّهُ مَنْ يَضْغَطُ", "عَلَيْهِ فَوْقَهَا وَنَزْرًا⁽د⁾ يَحْبَطُ"], ["وَذَاكَ بَيْنَ وَتَرَيْ بَاسِطَتَيْنْ", "ضِمْنَ الأَمَامِيِّ وَلَيْسَ الآخَرَيْنْ⁽هـ⁾"]]], ["تتمة نظم الشريان الظهري للقدم Dorsalis pedis artery (lanjutan)", 184, [["لَدَى وُصُولِهِ لِأَوَّلِ الفُسَحْ⁽أ⁾", "يَنْزِلُ لِلْأَخْمَصِ حَيْثُمَا انْفَتَحْ"], ["فِيهِ عَلَى قَوْسٍ عَمِيقَةٍ يُرِيدْ", "إِكْمَالَهَا وَأَصْبَحَ اسْمُهُ الجَدِيدْ"], ["هُوَ العَمِيقُ الأَخْمَصِيُّ بَعْدَا", "تَغْيِيرِ مَسْرَاهُ بِأَنْ تَرَدَّى⁽ب⁾"], ["فَقَدْ أَرَاكَ بَيْنَ رَأْسَيْ عَضَلَهْ", "ظَهْرِيَّةٍ بَيْنَ العِظَامِ نَزَلَهْ⁽ج⁾"]]], ["فُرُوعُ شِرْيَانِ ظَهْرِ القَدَمِ — الشِّرْيَانُ المِشْطِيُّ الظَّهْرِيُّ الأَوَّلُ First dorsal metatarsal artery", 185, [["وَيَسْتَمِرُّ مِنْهُ فَرْعٌ ظَهْرِيْ", "فِي الفُسْحَةِ الأُولَى لِمِشْطٍ يَسْرِيْ"], ["إِنَّ بِهَا العَضَلَةَ الَّتِي اعْتَلَا⁽أ⁾", "يُعْطِيْ فُرُوعًا إِصْبِعِيَّةً إِلَى"], ["جَانِبَيِ الإِبْهَامِ دُونَمَا شَطَطْ", "وَالجَانِبِ الإِنْسِيِّ لِلثَّانِيْ فَقَطْ"]]], ["الشِّرْيَانُ القَوْسِيُّ Arcuate artery", 186, [["وَأَرْسَلَ القَوْسِيَّ نَحْوَ الوَحْشِيْ", "بِقُرْبِ قَاعِدَاتِ مِشْطٍ يَمْشِيْ"], ["وَقَالَ⁽أ⁾ أَعْطِ أَفْرُعًا مِشْطِيَّهْ", "ظَهْرِيَّةً ثَلَاثَةً عَطِيَّهْ"], ["أَيْضًا فُرُوعًا إِصْبِعِيَّةً إِلَى", "جَانِبِ كُلِّ إِصْبَعٍ قَدْ فَضَلَا"]]], ["الشِّرْيَانَانِ الرُّصْغِيَّانِ Tarsal arteries", 187, [["وَمِنْ فُرُوعِهِ المُرَوِّيَانِ", "الرُّصْغِيَّانِ المُشَارِكَانِ"], ["شَبَكَةَ الكَاحِلِ بِالدِّمَاءِ", "فِي الجَانِبَيْنِ دُونَمَا امْتِرَاءِ"]]]]},

{b:"فصل الأوردة · Veins · Tubuh Bawah",p:[
["الأَوْرِدَةُ Veins",190,[["الدَّمُ ضِمْنَ الطَّرَفِ الفَقِيرُ","يُنْقَلُ فِي أَوْرِدَةٍ تَسِيرُ"],["فِي سَطْحِهِ وَعُمْقِهِ فَالثَّانِيَهْ⁽أ⁾","تَكُونُ عِنْدَ سَيْرِهَا مُرَاعِيَهْ"],["سَيْرَ الشَّرَايِينِ الَّتِي بِقُرْبِهَا","لِأَجْلِ ذَاكَ قَدْ تَسَمَّتْ بِاسْمِهَا"]]],
["الوَرِيدَانِ الصَّافِنَانِ الكَبِيرُ وَالصَّغِيرُ Great and small saphenous veins",191,[["الصَّافِنَانِ مِنْ أَهَمِّ الأُولَى⁽أ⁾","صَبَّا عَلَى الثَّانِيَةِ المَنْقُولَا⁽ب⁾"],["مَبْدَاهُمَا مِنْ قَوْسِ ظَهْرِ القَدَمِ","تَعْلُو رُؤُوسَ المِشْطِ مِثْلَ العَلَمِ"],["يَنْشَأُ مِنْ إِنْسِيِّهَا الكَبِيرُ","أَمَّا مِنَ الوَحْشِيِّ فَالصَّغِيرُ"]]],
["الوَرِيدُ الصَّافِنُ الكَبِيرُ Great saphenous vein",192,[["إِنَّ الكَبِيرَ نِعْمَةُ العَلِيمِ","عَلَّمَنَا أَخْذَهُ لِلتَّطْعِيمِ"],["وَمِنْ أَمَامِ كَعْبِنَا المَوْجُودِ","فِي الجَانِبِ الإِنْسِيِّ ذُو صُعُودِ"],["وَبَعْدُ فِي الإِنْسِيِّ مِنْ سَاقِينَا","ثُمَّ انْحَنَى لِخَلْفِ رُكْبَتَيْنَا"],["وَبَاءُ⁽أ⁾ لِلإِنْسِيِّ عِنْدَ الفَخِذِ","حَتَّى الوُلُوجِ مِنْ خِلَالِ نَفَذِ"],["ضِمْنَ لِفَافَةٍ عَرِيضَةٍ دُعِيْ","بِفَتْحَةِ الصَّافِنِ عِنْدَ مَوْضِعِ"],["أَسْفَلَ إِنْسِيِّ الرِّبَاطِ الأُرْبِيْ","عَلَى الوَرِيدِ الفَخِذِيْ لِلصَّبِّ"]]],
["الوَرِيدُ الصَّافِنُ الصَّغِيرُ Small saphenous vein",193,[["أَمَّا الصَّغِيرُ رَافَقَ الرَّبْلِيَّا","وَرَاءَ كَعْبٍ كَائِنٍ وَحْشِيَّا"],["وَكَانَ فِي السَّاقِينِ ذَا ارْتِقَاءِ","إِلَى عَلٍ فِي وَسَطِ الوَرَاءِ"],["وَمِنْ لِفَافَةٍ عَمِيقَةٍ وَلَجْ","وَفِي وَرِيدٍ مَأْبِضِيٍّ انْدَمَجْ"]]]]},
{b:"فصل الأعصاب · Nerves · Tubuh Bawah",p:[
["تَعْصِيبُ الطَّرَفِ السُّفْلِيِّ Nerves of lower limb",196,[["الطَّرَفُ السُّفْلِيُّ عِنْدَ الحُكَمَا","عُصِّبَ مِنْ ضَفِيرَتَيْنِ وَهُمَا"],["القَطَنِيَّةُ الَّتِي بِبَطْنِكُمْ","وَالعَجُزِيَّةُ الَّتِي بِحَوْضِكُمْ"],["عَلَى جِدَارِ ذَيْنِكُمْ وَرَاءُ","وَقَدْ أُمِيطَ عَنْهُمَا الغِشَاءُ"]]],
["الضَّفِيرَةُ القَطَنِيَّةُ Lumbar plexus",197,[["أُولَاهُمَا قَدْ شَكَّلَتْهَا الأَفْرُعُ","الخَارِجَاتُ لِلأَمَامِ الأَرْبَعُ"],["القَطَنِيَّةُ الَّتِي مِنْ أَوَّلِ","بِدَاخِلِ العَضَلَةِ الَّتِي تَلِيْ"],["القَطَنِيَّةُ الكَبِيرَةُ الَّتِي","لَنْ تَأْتِ بَعْدُ إِلَّا بِالإِشَارَةِ"],["انْبَثَقَتْ مِنْهَا الفُرُوعُ كُلُّهَا","مِنَ الجِهَاتِ التَّالِيَاتِ ذِكْرُهَا"],["تَنَاسُلِيٌّ فَخِذِيٌّ لَا سِوَاهْ","يَخْرُجُ مِنْ أَمَامِهَا لِذِي انْتِبَاهْ"],["أَمَّا مِنَ الإِنْسِيِّ فَالسِّدَادِيْ","وَالجَانِبُ الآخَرُ مِنْهَا البَادِيْ"],["فَالحَرْقَفِيَّانِ بِنَفْسِ اللُّبِّ⁽أ⁾","الخَثَلِيُّ وَكَذَاكَ الأُرْبِيْ"],["كَذَا الَّذِي مُعَصِّبٌ لِجِلْدِ","الفَخِذِ الوَحْشِيِّ عِنْدَ الفَرْدِ"],["وَالفَخِذِيُّ أَطْوَلُ الأَقْرَانِ","إِذْ يَبْلُغُ الأَقْدَامَ فِي الأَبْدَانِ"]]],
["العَصَبُ الجِلْدِيُّ الوَحْشِيُّ لِلْفَخِذِ Lateral cutaneous nerve of thigh",200,[["وَكَانَ جِلْدُ فَخِذِيٍّ وَحْشِيْ","مُعَصَّبًا مِنْ عَصَبٍ قَدْ أُفْشِيْ"],["مَنْشَؤُهُ عِنْدَ أُولِي العِرْفَانِ","مِنْ قَطَنِيٍّ ثَالِثٍ وَثَانِ"],["مُصَالِبٌ بَعْدَ انْبِثَاقٍ حَاصِلِ","لِحَرْقَفِيَّةٍ بِشَكْلٍ مَائِلِ"],["يَسِيرُ نَحْوَ شَوْكَةٍ قَدْ رُبِطَا","بِسَطْحِهَا الأُرْبِيُّ ثُمَّ انْخَرَطَا"],["بِالسَّيْرِ خَلْفَهُ إِلَى بُلُوغِ","مَقْصِدِهِ وَدُونَمَا صُدُوغِ⁽أ⁾"]]],
["العَصَبُ التَّنَاسُلِيُّ الفَخِذِيُّ Genitofemoral nerve",201,[["أَلَا نُشُوءُ العَصَبِ التَّنَاسُلِيْ","الفَخِذِيْ مِنْ قَطَنِيٍّ أَوَّلِ"],["كَذَلِكَ الثَّانِيْ إِلَيْهِ انْضَمَّا","يَنْزِلُ ضِمْنَ تِلْكَ ثُمَّ انْقَسَمَا"],["فَرْعَيْنِ كَيْ يُتَابِعَا مِنْ بَعْدِهِ","أَعْطَى لِكُلٍّ مِنْهُمَا جُزْءَ اسْمِهِ"]]],
["الفَرْعُ التَّنَاسُلِيُّ⁽1⁾ Genital branch",202,[["فِي النَّفَقِ الأُرْبِيِّ ذُو مُرُورِ","أَوَّلُ فَرْعَيْهِ⁽أ⁾، وَفِي الذُّكُورِ"],["يُعَصِّبُ العَضَلَةَ المُشَمِّرَهْ","فِي الصَّفَنِ الَّتِي لَهَا أَنْ تَحْسِرَهْ⁽ب⁾"],["وَجِلْدَهُ العَالِيْ مِنَ الأَمَامِ","وَفِي الإِنَاثِ غَيْرُ ذِي الأَحْكَامِ"],["فَلَمْ يَكُنَّ كَالذُّكُورِ خَلْقَا","فَإِنَّهُ عَصَّبَ جِلْدًا فَوْقَا"],["الجَبَلِ العَانِيِّ وَالشُّفْرِ الكَبِيرْ","بَعْدَ اصْطِحَابٍ لِلرِّبَاطِ المُسْتَدِيرْ"]]],
["الفَرْعُ الفَخِذِيُّ Femoral branch",203,[["ثَانِيهِمَا لَدَى المَسِيرِ جَدًّا⁽أ⁾","مِنْ خَلْفِ أُرْبِيٍّ وَزَارَ الغِمْدَا"],["إِنَّ الوِعَاءَ الفَخِذِيَّ كَانَا","إِنْسِيَّةً ثُمَّ الرَّحِيلُ حَانَا"],["يَخْرُجُ مِنْهُ عَبْرَ ثَقْبِ الغِمْدِ","يُرِيدُ أَنْ يَذْهَبَ نَحْوَ جِلْدِ"],["الفَخِذِ العُلْوِيِّ وَالأَمَامِيْ","مُعَصِّبًا لَهُ عَلَى الدَّوَامِ"]]],
["العَصَبُ السِّدَادِيُّ Obturator nerve",204,[["وَالآنَ هَاكَ مَنْشَأَ السِّدَادِيْ","مِنَ الفُرُوعِ كُلِّهَا لَا الحَادِيْ⁽أ⁾"],["يَنْزِلُ فِي العَضَلَةِ المُنْبَثِقِ","مِنْهَا إِزَاءَ حَرْفِ حَوْضٍ يَلْتَقِيْ"],["وَكَانَ فِي مَسِيرِهِ قَدِ انْهَمَكْ","خَلْفَ الوِعَاءِ الحَرْقَفِيِّ المُشْتَرَكْ"],["يَسْرِي عَلَى جِدَارِ جَوْفِ الحَوْضِ","الجَانِبِيِّ ثُمَّ عِنْدَ الخَوْضِ"],["فِي السَّيْرِ ضِمْنَ النَّفَقِ السِّدَادِيْ","مَدَّ القَضَا لِقِسْمِهِ أَيَادِ"],["إِلَى الوَرَائِيِّ وَمَنْ تَقَدَّمَا","فِي الحَيِّزِ الإِنْسِيِّ حَرَّرَتْهُمَا⁽أ⁾"],["وَلَا يُعَصِّبَانِ فِيهِ الكُلَّا","وَتَفْصِلَاهُمَا اثْنَتَيْنِ فَصْلَا:"],["مُسِدَّةٍ ظَاهِرَةٍ وَقُصْرَى","مُقَرِّبَاتِنَا وَلَيْسَ الأُخْرَى"],["قَدْ أَرْسَلَا لِرُكْبَةٍ وَوَرِكِ","عِدَّةَ أَفْرُعٍ كَمَا لَمْ يَتْرُكِ"],["ذَاكَ الأَمَامِيُّ بِدُونِ حِسٍّ","جِلْدَةَ كُلِّ فَخِذٍ فِي الإِنْسِيْ"]]],
["العَصَبُ الفَخِذِيُّ Femoral nerve",207,[["وَالفَخِذِيُّ أَكْبَرُ الأَفْرَادِ","أَشْبَهَ فِي نُشُوئِهِ السِّدَادِيْ"],["وَبَيْنَ حَرْقَفِيَّةٍ وَأُخْرَى","مُنْبَثِقٍ مِنْهَا يَسِيرُ حُرَّا"],["مُعَصِّبًا أُولَاهُمَا⁽أ⁾ وَأَعْطَى","عَانِيَّةً فَرْعًا إِلَيْهَا مُطَّا"],["وَبَعْدَمَا يَمُرُّ مِنْ وَرَاءِ","رِبَاطِ بُوبَارٍ لِكُلِّ رَائِيْ"],["يَصِيرُ فِي الوَحْشِيِّ مِنْ شِرْيَانِ","الفَخِذِ المَعْدُودِ مِنْ سُكَّانِ"],["الغِمْدِ مَعْ وَرِيدِهِ المُصْطَحَبِ","وَلَا يُرَى فِيهِ دُخُولُ العَصَبِ"],["وَإِنَّهُ مَا كَانَ غَيْرَ فَائِزِ","بِهِ سِوَى مُقَدَّمِ الحَيَائِزِ"],["فَإِنَّهُ عَصَّبَ مِنْهُ العَضَلَا","عَبْرَ انْقِسَامَيْهِ اللَّذَيْنِ عُقِلَا"]]],
["الانْقِسَامُ الأَمَامِيُّ Anterior division لِلعَصَبِ الفَخِذِيِّ",208,[["إِنَّ أَمَامِيَّهُمَا قَدْ زَوَّدَا","بِاثْنَيْنِ جِلْدَ الفَخِذِ المُمَدَّدَا"],["إِنْسِيَّهُ بِعَصَبٍ مُسَلَّط","وَفِي الأَمَامِ عَبْرَ فَرْعٍ أَوْسَطِ"]]],
["الانْقِسَامُ الخَلْفِيُّ Posterior division لِلعَصَبِ الفَخِذِيِّ",209,[["وَإِنَّ خَلْفِيَّهُمَا قَدْ أَحْسَنَا","لِلْجِلْدِ إِذْ أَخْرَجَ فَرْعًا صَافِنَا"],["يَدْخُلُ هَذَا وَالَّذِي مَا افْتَرَقَا","عَنِ الوِعَاءِ الفَخِذِيِّ النَّفَقَا"],["نَرَاهُ فِي الوَحْشِيِّ مِنْهُ قَبْلَهُ","وَالعَكْسُ ضِمْنَهُ، وَرَامَ تَرْكَهُ"],["مِنْ بَعْدِ أَنْ رَافَقَهُ طَوِيلَا","وَأَيُّ خِلٍّ يَتْرُكُ الخَلِيلَا!"],["وَبَانَ بَعْدَ ثَقْبِهِ لِلْحَائِلَهْ","مِنْ بَيْنِ خَيَّاطِيَّةٍ وَنَاحِلَهْ"],["ثُمَّ الْتِقَاءُ الصَّاحِبِ الأَخِيرُ","وَهْوَ الوَرِيدُ الصَّافِنُ الكَبِيرُ"],["قَدْ نَزَلَا مَعًا بِلَا افْتِرَاقِ","أَعْطَى لِجِلْدِ رُكْبَةٍ وَسَاقِ"],["وَقَدَّمَ مِنْ جَانِبٍ يُوَاجِهُ","الطَّرَفَ الآخَرَ⁽أ⁾ مَا⁽ب⁾ يَحْتَاجُهُ"]]],
["الغِمْدُ الفَخِذِيُّ Femoral sheath",211,[["وَهَلْ أَتَاكُمْ نَبَأُ الغِمْدِ الَّذِي","غَلَّفَ ذَلِكَ الوِعَاءَ الفَخِذِيْ"],["مَعَ الوِعَاءَاتِ الَّتِي لِلَّمْفِ","وَبَيْنَ ذَيْنِكُمْ وَرِيدٌ أُلْفِيْ"],["ضِمْنَ المُثَلَّثِ الَّذِي فِي الحَدِّ","وَلَمْ يَسِرْ عَصَبُهُ فِي الغِمْدِ"]]],
["الضَّفِيرَةُ العَجُزِيَّةُ Sacral plexus",212,[["أَمَّا وَقَدْ تَشَكَّلَتْ ضَفِيرَهْ","العَجُزِ الَّتِي بَدَتْ قَرِيرَهْ"],["أَمَامَ كُمَّثْرِيَّةٍ مِنْ أَفْرُعِ","تَكُونُ قُدَّامِيَّةً لِلأَرْبَعِ"],["العَجُزِيَّاتِ اللَّوَاتِي مِنْ عُلُوْ","وَالقَطَنِيَّيْنِ اللَّذَيْنِ مِنْ دُنُوْ"],["فُرُوعُ هَذِي المُحْسِنَاتُ صُنْعَا","فِي الطَّرَفِ السُّفْلِيِّ كُنَّ سَبْعَا"],["الثَّاقِبُ الجِلْدِيُّ لَيْسَ يَمْضِيْ","مِنْ ثُقْبَةٍ كَبِيرَةٍ فِي الحَوْضِ"],["كَحَالِ سَائِرِ الفُرُوعِ الأُخْرَى","مِنْ تَحْتِ كُمَّثْرِيَّةٍ قَدْ مَرَّا"],["جَمِيعُهَا بِدُونِ ذَاكَ المَرْوِيْ","وَقَدْ عَلَاهَا الأَلْوِيُّ العُلْوِيْ"]]],
["العَصَبُ الأَلْوِيُّ العُلْوِيُّ Superior gluteal nerve",216,[["كَانَ نُشُوءُ الأَلْوِيِّ العُلْوِيْ","مِنْ قَطَنِيٍّ رَابِعٍ وَقُوِّيْ"],["بِتَالِيَيْهِ عِنْدَمَا تَحَرَّرَا","عَبْرَ انْقِسَامَاتٍ لَهَا مِنَ الوَرَا"],["وَقَدْ بَدَا مَسِيرُهُ مِنْ بَيْنِ","صُغْرَى وَوُسْطَى الأَلْوِيَّتَيْنِ"],["مُعَصِّبًا بِأَفْرُعٍ مُحَرَّرَهْ","كِلْتَيْهِمَا وَتِلْكُمُ المُوَتِّرَهْ"]]],["العَصَبُ الأَلْوِيُّ السُّفْلِيُّ Inferior gluteal nerve",217,[["بَدَا نُشُوءُ الأَلْوِيِّ السُّفْلِيْ","مِنَ انْقِسَامٍ فِي الوَرَا لِكُلِّ"],["مِنْ عَجُزِيٍّ أَوَّلٍ وَثَانِيْ","وَقَطَنِيٍّ خَامِسٍ تَحْتَانِيْ"],["عَصَّبَ بَيْنَ العَضَلَاتِ كُبْرَى","مَا فِي الأَلَايَا فَلْتَزِدْهَا ذِكْرَا"]]],["العَصَبُ الجِلْدِيُّ الفَخِذِيُّ الخَلْفِيُّ Posterior femoral cutaneous nerve",218,[["العَصَبُ الذَّاهِبُ نَحْوَ جِلْدِ","الفَخِذِ الخَلْفِيِّ عِنْدَ الفَرْدِ"],["مَنْشَؤُهُ مِنِ انْقِسَامٍ بَطْنِيْ","لِعَجُزِيٍّ ثَالِثٍ وَثُنِّيْ"],["ثَانٍ عَلَيْهِ وَانْقِسَامٍ ظَهْرِيْ","لَهُ وَلِلأَوَّلِ أَيْضًا فَادْرِ"],["يُعَصِّبُ الجِلْدَ عَلَى نِطَاقِ","مُتَّسِعٍ كَخَلْفِ أَعْلَى السَّاقِ"],["وَالفَخِذِ الإِنْسِيِّ عِنْدَ الأَعْلَى","فِي طَيَّةِ الأَلْيَةِ أَيْضًا حَلَّا"]]],["عَصَبُ المُسِدَّةِ الغَائِرَةِ Nerve to obturator internus",219,[["وَعَصَبُ المُسِدَّةِ الغَائِرَهْ","نَشْأَتُهُ مِنِ اجْتِمَاعٍ مُثْبَتِ"],["لِعَجُزِيٍّ أَوَّلٍ وَلَاحِقِ","لَهُ بِبَطْنِيَّاتِهَا وَسَابِقِ"],["تَمُدُّ أَعْلَى تَوْءَمِيَّةٍ بِهِ","إِضَافَةً لِمَنْ تَسَمَّى بِاسْمِهِ"]]],["عَصَبُ العَضَلَةِ المُرَبَّعَةِ الفَخِذِيَّةِ Nerve to quadratus femoris",220,[["وَعَصَبُ العَضَلَةِ المُرَبَّعَهْ","الفَخِذِيَّةِ اعْرِفَنْ تَجَمُّعَهْ"],["مِنِ اتِّحَادِ الانْقِسَامِ البَطْنِيْ","لِهَذِهِ الأَفْرُعِ فَاحْفَظِ عَنِّيْ:"],["القَطَنِيَّانِ الأَخِيرَانِ كَمَا","يُزَادُ مَنْ تَلَاهُمَا إِلَيْهِمَا"],["عَصَّبَ غَيْرَ هَذِهِ بِالطَّبْعِ","أَخْفَضَ تَوْءَمِيَّةٍ بِفَرْعِ"]]],["العَصَبُ الجِلْدِيُّ الثَّاقِبُ Perforating cutaneous nerve",221,[["وَالثَّاقِبُ الجِلْدِيُّ ذُو تَأَصُّلِ","مِنْ عَجُزِيَّيْنِ بُعَيْدَ الأَوَّلِ"],["مِنَ انْقِسَامِ العَصَبَيْنِ البَطْنِيْ","وَقَالَ إِنَّهُ يُمَرُّ مِنِّيْ"],["ذَاكَ الرِّبَاطُ العَجُزِيُّ الحَدَبِيْ","أَلَا لَدَى وُصُولِ هَذَا العَصَبِ"],["لِحَافَةٍ سُفْلِيَّةٍ بَدَتْ لَنَا","لِلأَلْوِيَّةِ الكَبِيرَةِ انْحَنَى"],["إِلَى عَلٍ كَجَالِبٍ لِحِسٍّ","طَيَّةِ أَلْيَتَيْكَ عِنْدَ الإِنْسِيْ"]]],
["العَصَبُ الوَرِكِيُّ Sciatic nerve",222,[["الوَرِكِيُّ يَا أُولِي الأَلْبَابِ","أَكْبَرُ مَا فِي الجِسْمِ مِنْ أَعْصَابِ"],["يَكُونُ فِيهِ⁽أ⁾ ذَا نُشُوءِ سَائِدِ","مِنَ انْقِسَامَيْنِ لِكُلِّ وَاحِدِ"],["مِنْ قَطَنِيٍّ رَابِعٍ وَالمَاكِثِ","مِنْ تَحْتِهِ لِلْعَجُزِيِّ الثَّالِثِ"],["مِنْ عَصَبِ الشَّظِيَّةِ المُشْتَرَكِ","وَعَصَبِ الظُّنْبُوبِ كَانَ الوَرِكِيْ"],["مُؤَلَّفًا بِأَفْضَلِ اجْتِمَاعِ","حَتَّى تَحِينَ لَحْظَةُ الوَدَاعِ"],["كَانَ نَصِيبُ الأَوَّلِ الظَّهْرِيَّةْ","لَا ثَالِثًا وَالآخَرِ البَطْنِيَّةْ"],["يَنْزِلُ فِي أَلْيَتِهِ⁽أ⁾ مِنْ بَيْنِ","مَجْمُوعَتَيْهَا العَضَلِيَّتَيْنِ"],["وَكَانَ فِي أَلْيَتِهِ⁽ب⁾ شَحِيحَا","لَمْ يُعْطِ فَرْعًا وَاحِدًا سَرِيحَا"],["وَصَارَ فِي الحَيِّزِ خَلْفَ الفَخِذِ","ذِي العَضَلِ الطَّوِيلِ مِنْهُ المُغْتَذِيْ⁽أ⁾"],["أَمَامَهُ الكَبِيرَةُ المُقَرِّبَهْ","وَخَلْفَهُ رَأْسٌ طَوِيلٌ صَالَبَهْ"],["يَمْتَازُ مِنْ صَاحِبَةِ الرَّأْسَيْنِ","ثُمَّ انْقِسَامُهُ إِلَى الفَرْعَيْنِ"],["وَلَاحِظَنْ شِدَّةَ التَّنَوُّعِ","بَيْنَهُمُ فِي مُسْتَوَى التَّفَرُّعِ"],["لَكِنَّ قُرْبَ رُكْبَتَيْكَ الأَشْهَرَا","وَضِمْنَ جَوْفِ الحَوْضِ أَحْيَانًا يُرَى"],["فِي حُفْرَةِ المَأْبِضِ يَنْزِلَانِ","مِنْ أَسْفَلِ الَّتِي لَهَا رَأْسَانِ"]]],["العَصَبُ الشَّظَوِيُّ الأَصْلِيُّ (المُشْتَرَكُ) Common fibular nerve",225,[["وَعَصَبُ الشَّظِيَّةِ المُشْتَرَكُ","يَمِيلُ فِي الحُفْرَةِ إِذْ يَحْتَكِكُ"],["بِحَافَةٍ إِنْسِيَّةٍ مِنْ وَتَرِ","لِذَاتِ رَأْسَيْنِ الَّتِي فِي الخَبَرِ"],["مَاشٍ عَلَى العَضَلَةِ السَّاقِيَّةْ","مِنْ فَوْقِ رَأْسِ الجِهَةِ الوَحْشِيَّةْ"],["جَرَى الْتِفَافُهُ حَوَالَيْ عُنُقِ","شَظِيَّةٍ فَجُسَّهُ وَأَقْلِقِ"],["بَيْنَ مَكَانَيِ ارْتِبَاطِ أَطْوَلِ","الشَّظَوِيَّتَيْنِ ذُو تَسَلُّلِ"],["لِأَجْلِ أَنْ يَبِيتَ عِنْدَ مَسْكَنِ","السَّاقِ فِي الوَحْشِيِّ خَيْرِ مَرْكَنِ"],["كَمَا تَطَالُهُ يَدُ التَّفْلِيقِ","فِيهِ إِلَى السَّطْحِيِّ وَالعَمِيقِ"]]],["فَرْعَا العَصَبِ الشَّظَوِيِّ الأَصْلِيِّ الجِلْدِيَّانِ Cutaneous branches of common fibular nerve",227,[["فَرْعَاهُ كُلُّ وَاحِدٍ جِلْدِيُّ","فَالأَوَّلُ المُوَصِّلُ الرَّبْلِيُّ"],["أَحْسِنْ بِهِ مِنْ عَصَبٍ ذَهُوبِ","يَنْضَمُّ لِلرَّبْلِيِّ مِنْ ظُنْبُوبِيْ"],["وَعَصَّبَ الثَّانِي مِنَ السِّيقَانِ","مِنْ جِلْدِهَا الوَحْشِيَّ وَالفَوْقَانِيْ"]]],["العَصَبُ الشَّظَوِيُّ العَمِيقُ Deep fibular nerve",228,[["إِنَّ العَمِيقَ الشَّظَوِيَّ رَغِبَا","عَنْ حَيِّزِ المَنْشَإِ حَيْثُ ذَهَبَا"],["نَحْوَ الَّذِي مِنَ الأَمَامِ بَعْدَمَا","يَثْقُبُ حَاجِزًا بَدَا بَيْنَهُمَا"],["فَلَمْ يَكُنْ فِي وَجْهِهِ مُعَوَّقَا","بَلْ جَدَّ فِي السَّيْرِ وَصَارَ أَعْمَقَا"],["بَاسِطَةِ⁽أ⁾ الأَصَابِعِ الطَّوِيلَهْ","وَإِنَّهُ بَعْدَ خُطًى قَلِيلَهْ"],["يَلْقَى وِعَا الظُّنْبُوبِ فِي الأَمَامِ","وَهَبَطَا عَلَى الغِشَاءِ النَّامِيْ"],["وَكَانَ فِي وَحْشِيِّ نَاقِلِ الدَّمِ","تَكْمِلَةِ الوِعَا⁽أ⁾ بِظَهْرِ القَدَمِ"],["وَفَلْحُهَا⁽ب⁾ الأَوَّلُ ذُو نَصِيبِ","وَظَهْرُ إِصْبَعَيْهِ⁽ج⁾ بِالتَّعْصِيبِ"]]],
["العَصَبُ الشَّظَوِيُّ السَّطْحِيُّ Superficial fibular nerve",230,[["فَإِنَّمَا السَّطْحِيُّ مَا قَدْ هَدَأَا","فِي الحَيِّزِ الَّذِي بِهِ قَدْ نَشَأَا"],["وَبَعْدَ أَنْ يَنْزِلَ فِيهِ بَيْنَا","الشَّظَوِيَّتَيْنِ قَدْ رَأَيْنَا"],["قِيَامُهُ بِالفِعْلِ بِاخْتِرَاقِ","لِفَافَةٍ عَمِيقَةٍ لِلسَّاقِ"],["فِي الثُّلْثِ السُّفْلِيِّ ثُمَّ انْقَسَمَا","فَرْعَيْنِ سَوْفَ يَدْخُلَانِ القَدَمَا"],["مُعَصِّبَيْنِ ظَهْرَهَا بِاسْتِثْنَا","مَا عَصَّبَاهُ عَصَبَيْنِ هِنَّا⁽أ⁾"]]],["العَصَبُ الظُّنْبُوبِيُّ Tibial nerve",231,[["وَعَصَبُ الظُّنْبُوبِ ضِمْنَ الجِسْمِ","أَكْبَرُ مِنْ قَسِيمِهِ فِي الحَجْمِ"],["يَنْزِلُ ضِمْنَ حَيِّزٍ قَدْ رَحَّبَا","بِهِ وَرَاءَ السَّاقِ كَيْ يُعَصِّبَا"],["ثُمَّ يَمُرُّ مِنْ أَمَامِ قَوْسِ","نَعْلِيَّةٍ مُهِمَّةٍ فِي الدُّوسِ"],["مِثْلُ الوِعَا الخَلْفِيِّ لِلظُّنْبُوبِ","فِي السَّيْرِ وَالتَّفَرُّعِ المَكْتُوبِ"],["يُضْفِي عَلَى أَمْكِنَةٍ مَحْصُورَهْ","فِي الجِلْدِ تَعْصِيبِيَّةُ أَيْ شُعُورَهْ"],["بِالعَصَبَيْنِ العَقِبِيِّ الإِنْسِيْ","وَالآخَرِ الرَّبْلِيِّ دُونَ وَكْسِ⁽أ⁾"]]],["العَصَبُ الرَّبْلِيُّ Sural nerve",234,[["يَنْشَأُ بَيْنَ رَأْسَيِ السَّاقِيَّهْ","العَصَبُ الرَّبْلِيُّ فِي العِلِّيَّهْ"],["يَنْزِلُ فَوْقَ بَطْنِهَا وَاخْتَرَقَا","لِفَافَةً عَمِيقَةً وَانْطَلَقَا"],["إِلَيْهِ رَبْلِيٌّ مُوَصِّلٌ شَبَكْ","بِهِ أَتَى مِنْ شَظَوِيٍّ مُشْتَرَكْ"],["وَخَلْفَ وَحْشِيٍّ مِنَ الكِعَابِ","يُتَابِعُ النُّزُولَ بِاصْطِحَابِ"],["ذَاكَ الوَرِيدِ الصَّافِنِ الصَّغِيرِ","إِلَى بُلُوغِ مَوْضِعِ التَّأْثِيرِ"],["فِي جِلْدَةٍ عَلَى امْتِدَادِ حَافَهْ","وَحْشِيَّةٍ مِنْ رِجْلِنَا إِضَافَهْ"],["لِلإِصْبَعِ الأَخِيرِ مِنْ ذَا الجَانِبِ⁽أ⁾","وَيَجْعَلُ الإِحْسَاسَ غَيْرَ غَائِبِ"],["أَيْضًا عَنِ الجِلْدِ الَّذِي مِنَ البَعِيدْ","وَالخَلْفِ وَالوَحْشِيِّ مِنْ سَاقِ العَبِيدْ"]]],["العَصَبُ العَقِبِيُّ الإِنْسِيُّ Medial calcaneal nerve",236,[["أَمَّا نُشُوءُ العَقِبِيِّ الإِنْسِيْ","فَقُرْبَ كَاحِلٍ وَجَلْبُ الحِسِّ"],["لِجِلْدَةٍ إِنْسِيَّةٍ لِلْعَقِبِ","وَأَخْمَصِيَّةٍ فَعَّالُ العَصَبِ"]]],["العَصَبَانِ الأَخْمَصِيَّانِ الإِنْسِيُّ وَالوَحْشِيُّ Medial and lateral plantar nerves",237,[["خُذْ أَخْمَصِيَّيْهِ المُوَضَّعَيْنِ","بَيْنَ الوِعَائَيْنِ المُوَافِقَيْنِ"],["فِي الاِسْمِ وَالمَسِيرِ دُونَ الأَفْرُعِ","أَخْذَ الفَتَى الحَرِيصِ لَا المُضَيِّعِ"],["قَدْ أَطْلَقَا إِلَى أَصَابِيعِ الطَّرَفْ","مَا أَطْلَقَا وَكُلُّ فَرْعٍ انْعَرَفْ"],["بِالأَخْمَصِيِّ الإِصْبَعِيِّ المَجْلِيْ","وَمِنْهُ مَخْصُوصٌ وَمِنْهُ أَصْلِيْ"]]],

 pertama ialah kepala (hasta), bersama takik untuk tulang pengumpil.","caput ulnae"],["Membentuk sendi bawah yang jauh, di antara keduanya; pahamilah maksudku.","art. radioulnaris distalis"],["Tonjolan \"jarum\" tampak di sisi dalam.","processus styloideus ulnae"],["Tulang pengumpil terletak di sisi luar hasta, hadir di lengan bawah.","pengumpil = radius (os radius)"],["Ia yang terpendek dari kedua tulang; badannya di antara dua ujung.",""],["Pada ujung atasnya ada ciri-ciri yang akan dijelaskan.","epiphysis proximalis"],["Ketahuilah, kepalanya tersusun dari tepi bulat sebagai ujungnya.","caput radii; circumferentia articularis"],["Bersendi dengan takik pada hasta.","incisura radialis ulnae"],["Permukaan atasnya cekung dan berhubungan dengan kepala kecil lengan atas.","fovea articularis"],["Leher pengumpil menyempit di bawah kepalanya.","collum radii"],["Di bawahnya ada benjolan kokoh; keberadaannya pada tulang kita tak terelakkan.","tuberositas radii"],["Namanya yang masyhur \"tuberositas radii\"; menonjol dan tak tersembunyi.",""],["Badannya melebar ke bawah, kebalikan hasta.",""],["Tiga permukaan badan pengumpil; tepinya pun tiga.",""],["Permukaannya: belakang, depan, dan luar; hafalkan ucapanku.","facies posterior, anterior, lateralis"],["Di permukaan luar ada tempat lekat yang kasar,","tuberositas pronatoria"],["bagi otot pemutar telapak ke bawah; akan dirinci dalam penjelasan.","m. pronator teres"],["Permukaan depan cekung dan tampak selaras.",""],["Di tengahnya ada lubang gizi, serupa dengan yang ada pada hasta.","foramen nutricium"],["Tepi di belakang dan depan; tambahkan tepi dalam, lengkap.","margo"],["Tepi depan itu memanjang dari benjolan di bagian atas","margo anterior"],["sampai ujung bawah yang menyerupai jarum; adapun tepi dalam,","processus styloideus radii"],["bermula dari benjolan yang tinggi hingga ujung yang dekat.","margo interosseus"],["Ada pula tepi belakang, yang permukaannya tampak membulat.","margo posterior"],["Ujung bawahnya tersusun dari lima permukaan yang telah dikenal.","facies (5 permukaan ujung distal radius)"],["Padanya terdapat tanda-tanda yang dijelaskan di sini: sebuah benjolan di sisi punggung yang tampak","tuberculum dorsale (Lister)"],["pada permukaan belakangnya, serta alur-alur yang dapat diraba dengan sentuhan pada tubuh.","facies posterior; sulci tendinum"],["Ada pula lekuk untuk hasta yang cekung, tampak menonjol di permukaan dalamnya.","incisura ulnaris"],["Pada permukaan luarnya tampak tonjolan seperti jarum yang memanjang","facies lateralis; processus styloideus radii"],["ke bawah; ada pula alur-alur, dan bila engkau lihat dari depan, permukaannya cekung.","facies anterior"],["Permukaan bawahnya bersendi dengan tulang perahu dan tulang bulan sabit.","facies articularis carpea; os scaphoideum; os lunatum"],["Pergelangan tangan kita terdiri dari delapan tulang, tersusun di belakang dan depan.","ossa carpi"],["Tulang-tulangnya tersusun dalam dua baris, dan ikut membentuk kerangka kedua tangan.","series proximalis; series distalis"],["Jumlahnya pada tiap baris empat, dan menghafalnya dalam rajaz di sini bermanfaat.",""],["Urutannya, dilihat dari sisi telapak, dari baris atasnya menuju sisi dalam (medial).","facies palmaris; series proximalis"],["Tulang perahu dan tulang bulan sabit datang di sisi tulang segitiga yang telah disebut.","os scaphoideum; os lunatum; os triquetrum"],["Tulang kacang: permukaan belakangnya bersendi dengan tulang segitiga.","tulang kacang = pisiformis (os pisiforme); os triquetrum"],["Bagian tengah permukaan ini cekung, sedangkan permukaan lainnya cembung bagi yang mengamati.",""],["Adapun tulang-tulang barisnya yang bawah datang dari sisi luar ke sisi dalam,","series distalis"],["yaitu tulang belah ketupat besar, lalu belah ketupat kecil, tulang kepala, dan tulang berkait; kenalilah.","os trapezium; os trapezoideum; os capitatum; os hamatum"],["Bersama tulang, tubuh kita memuat penggeraknya, yaitu otot.","musculi"],["Dengan otot, tubuh kita memperoleh bentuk dan batas-batasnya, dan sebagian otot menggerakkan kulit.",""],["Ada pula otot di wajah kita yang mengungkapkan setiap perasaan yang kita rasakan.","musculi faciei"],["Wilayah dada memuat empat otot yang diperinci di dalamnya.","regio pectoralis"],["Otot dada besar memiliki asal-asal yang banyak.","m. pectoralis major"],["Yaitu tulang rawan iga pertama hingga keenam, tulang dada kita, dan bagian pangkal dada.","cartilago costalis; sternum"],["Tambahkan selubung (aponeurosis) otot miring luar, yang seratnya menurun.","aponeurosis m. obliqui externi abdominis"],["Adapun tempat lekatnya yang tercatat ialah rigi tuberkel besar pada lengan atas.","crista tuberculi majoris humeri"],["Dipersarafi oleh saraf dada sisi dalam dan sisi luar, tanpa kekeliruan.","n. pectoralis medialis; n. pectoralis lateralis"],["Otot dada besar menutupi otot dada kecil, yang berpangkal","m. pectoralis major; m. pectoralis minor"],["dari iga ketiga hingga kelima, dari sisi depan, diuraikan bagi para pelajar.","costa III-V"],["Perutnya pipih dan menyempit mendekati tempat lekatnya, yang berupa tonjolan berbentuk paruh gagak.","processus coracoideus"],["Saraf dada sisi dalam mempersarafinya; kenalilah, ia tertutup oleh sebuah otot.","n. pectoralis medialis; m. pectoralis major"],["Otot lain bernama otot bawah selangka; perlu kujelaskan.","m. subclavius"],["Ia membentang dari tulang rawan iga pertama menuju alurnya yang terletak di sisi bawah","cartilago costae I; sulcus m. subclavii"],["selangka; telah kujelaskan, maka rujuklah bab tulang dan telaah uraiannya.","selangka = klavikula (clavicula)"],["Persarafannya dari saraf yang namanya sama dengan otot itu, jelas diketahui oleh orang berakal.","n. subclavius"],["Otot lain menyerupai gergaji, atau otot petinju yang bertanding.","m. serratus anterior"],["Dari permukaan-permukaan luar iga ia dibaca; asalnya mulai dari iga pertama","facies lateralis costarum"],["sampai iga kesembilan, semuanya ikut serta; seratnya saling menjalin pada asalnya,","costa I-IX"],["bersama gerigi-gerigi otot miring luar yang berhadapan dengannya.","m. obliquus externus abdominis"],["Saraf dada yang panjang mempersarafinya, menyusup di antara seratnya.","n. thoracicus longus"],["Seratnya turun dan melekat pada belikat, tertambat di tepi dalamnya.","belikat = skapula (scapula); margo medialis"],["Inilah uraian otot-otot yang tersambung ke tulang belakang seluruhnya.","columna vertebralis"],["Otot-otot ini terdapat di punggung dan tersusun dalam dua kelompok; ketahuilah.","musculi dorsi"],["Kelompok permukaan terdiri dari otot yang menyerupai trapesium.","m. trapezius"],["Berasal dari bagian luar tulang kepala belakang yang menonjol, dan dari garis yang tinggi,","os occipitale; linea nuchae superior"],["serta tonjolan duri ruas-ruas tulang leher dan dada di punggung.","processus spinosus; vertebrae cervicales; vertebrae thoracicae"],["Perutnya berbentuk segitiga, terbagi menjadi tiga berkas.","venter m. trapezii"],["Berkas atas berakhir tanpa terputus pada sepertiga luar selangka.","pars descendens; clavicula"],["Berkas tengah menambat pada duri belikat dan tonjolan bahu (akromion).","pars transversa; spina scapulae; akromion (acromion)"],["Berkas bawah menambat pada sebagian duri, dan pada sebuah tonjolan kecil yang dinamai menurut namanya.","pars ascendens; spina scapulae"],["Persarafannya datang dari saraf tambahan; kenalilah, seratnya melekat pada tengkorak.","n. accessorius (N. XI)"],["Otot lebar punggung ini terletak di punggung kita pada bidang yang luas.","m. latissimus dorsi"],["Seratnya banyak asalnya, telah kujelaskan, seperti duri-duri tonjolan tulang belakang,","processus spinosus"],["Pada ruas-ruas pinggang yang besar dan enam ruas dada yang terakhir,","vertebrae lumbales; vertebrae thoracicae"],["serta empat iga bawah, dari sisi luarnya.","costae IX-XII"],["Sudut bawah belikat dan sepertiga belakang rigi tulang usus.","angulus inferior scapulae; crista iliaca"],["Adapun tempat lekatnya ialah dasar alur di antara dua tonjolan, tanpa terputus.","sulcus intertubercularis humeri"],["Dipersarafi saraf torakodorsal; kenalilah, otot ini terdapat di punggung kita.","n. thoracodorsalis"],["Kelompok dalam di punggung; persarafannya dari saraf belikat belakang.","n. dorsalis scapulae"],["Jumlahnya tiga seluruhnya; perhatikanlah gambar yang terperinci.",""],["Dua otot belah ketupat terdapat di punggung kita, keduanya dinamai","m. rhomboideus major; m. rhomboideus minor"],["Otot belah ketupat kecil terletak di atas, dan otot belah ketupat besar tampak di bawahnya.","m. rhomboideus minor; m. rhomboideus major"],["Rinciannya telah dihadirkan dalam penjelasanku, kusajikan secara sederhana dan mudah.",""],["Berasal dari tulang punggung ruas dada kedua hingga kelima, karena ia menuju ke tonjolan duri ruas-ruas itu.","processus spinosus vertebrae thoracicae II-V"],["Inilah asal otot yang besar sebagaimana telah dikenal; adapun yang kecil, perhatikan perbedaannya.","origo m. rhomboideus major"],["Yang kecil berasal dari ruas leher ketujuh dan ruas dada pertama.","vertebra cervicalis VII; vertebra thoracica I"],["Keduanya melekat pada tepi dalam belikat; inilah tempat lekat keduanya, maka kenalilah.","margo medialis scapulae"],["Dinamai otot pengangkat belikat, karena tugasnya mengangkat tulang belikat.","m. levator scapulae"],["Namun bagi leher, otot ini justru menurunkannya; asalnya dari tonjolan samping tulang leher.","processus transversus vertebrae cervicalis"],["Yaitu dari ruas-ruas leher yang bernomor, dari yang pertama sampai yang keempat, agar engkau tahu.","vertebra cervicalis I-IV"],["Tempat lekatnya sampai pada tepi dalam di antara tepi-tepi belikat.","margo medialis scapulae"],["Ketahuilah bahwa otot-otot ketiak jumlahnya tepat enam.","regio axillaris"],["Semuanya menghubungkan belikat dengan lengan atas, dan kita harus menjelaskannya.","scapula; humerus"],["Otot segitiga bahu terdiri atas beberapa berkas, tiga jumlahnya menurut penjelasan kita.","m. deltoideus"],["Berkas selangka berada di depan, berasal dari sepertiga luar selangka.","pars clavicularis; clavicula"],["Berkas tengah berasal dari akromion sebagaimana telah diuraikan, dan berkas belikat dari bawah duri belikat.","pars acromialis; acromion; pars spinalis; spina scapulae"],["Ia melekat pada benjolan segitiga bahu; tendon dan perutnya tampak berbentuk delta.","tuberositas deltoidea"],["Saraf ketiak mempersarafi otot segitiga bahu; hafalkan, dan engkau menjadi orang yang cakap.","n. axillaris"],["Suntiklah pada bagian atasnya, dan hindari mencederai saraf ketiak.","n. axillaris"],["Turunlah kira-kira dua jari dari ujung bahunya; di situ engkau aman.","acromion"],["Di ketiak kita ada pula otot bulat besar, yang telah dirinci dalam penjelasan kita.","m. teres major"],["Ketahuilah bahwa tempat lekatnya pada rigi tonjolan kecil lengan atas.","crista tuberculi minoris humeri"],["Persarafannya menurut para dokter berasal dari saraf bawah belikat.","n. subscapularis"],["Otot-otot bulat berasal dari belikat, dari tepi luarnya.","margo lateralis scapulae"],["Saudaranya terletak di atasnya, dan namanya otot bulat kecil.","m. teres minor"],["Persarafannya mirip dengan otot segitiga bahu, dan penjelasan kita telah menyingkap yang tersembunyi.","n. axillaris"],["Otot-otot bulat berasal dari belikat, dari tepi luarnya.","margo lateralis scapulae"],["Dua cekungan itu berada di atas dan di bawah duri belikat; kenalilah keduanya dari namanya.","fossa supraspinata; fossa infraspinata"],["Keduanya menjadi tempat asal bagi dua otot yang dikenal itu, di atas dan di bawah duri belikat.","m. supraspinatus; m. infraspinatus"],["Saraf atas belikat mempersarafi keduanya; hafalkan secara berurutan.","n. suprascapularis"],["Hafalkan bahwa otot bulat terkecil bersama kedua otot duri itu menyatu dalam tempat lekatnya.","m. teres minor; m. supraspinatus; m. infraspinatus"],["Ketiganya melekat pada benjolan besar; dengan menghafal bait-bait ini engkau terhindar dari kekeliruan.","tuberculum majus humeri"],["Otot keenam datang dengan pasti, rinciannya sudah jelas.","m. subscapularis"],["Namanya otot bawah belikat; adapun persarafannya, perhatikanlah dengan saksama.","m. subscapularis"],["Dipersarafi saraf bawah belikat yang bawah, dan juga yang atas; perhatikanlah.","n. subscapularis inferior; n. subscapularis superior"],["Asalnya dari cekungan yang sesuai namanya, tempatnya di dasar cekungan itu.","fossa subscapularis"],["Melekat pada benjolan kecil; perutnya berbentuk segitiga bagi yang melihatnya.","tuberculum minus humeri"],["Otot-otot di sisi depan lengan atas berjumlah tiga, lengkap.","musculi compartimenti anterioris brachii"],["Persarafannya berasal dari saraf otot-kulit.","n. musculocutaneus"],["Yang pertama adalah otot berparuh gagak menuju lengan atas.","m. coracobrachialis"],["Rinciannya kita ketahui dari namanya; karena itu kita susulkan dengan otot lengan atas.","m. coracobrachialis; m. brachialis"],["Otot lengan atas, yang uraiannya telah kurinci, serat-seratnya berasal dari lengan atas,","m. brachialis"],["dari separuh bawahnya, dari permukaan luar dan permukaan dalamnya.","humerus; facies lateralis et medialis"],["Tendonnya melekat pada benjolan di hasta; penjelasan kita pun berirama.","tuberositas ulnae"],["Otot berkepala dua telah ditetapkan dalam penjelasan, kutuliskan di sini sebagaimana telah disusun.","m. biceps brachii"],["Kepala yang pendek berasal dari tonjolan paruh gagak pada belikat.","caput breve; processus coracoideus"],["Bila engkau ingat benjolan yang berada di atas rongga sendi belikat, dari situlah ia datang.","tuberculum supraglenoidale; cavitas glenoidalis"],["Serat kepalanya yang panjang berasal darinya; hindarilah menyimpang darinya, semoga engkau terbimbing.","caput longum m. biceps brachii"],["Ketahuilah bahwa tempat lekatnya ditetapkan pada benjolan di pengumpil.","tuberositas radii"],["Satu otot di sisi belakang, kepalanya tiga dalam uraiannya.","m. triceps brachii"],["Wahai yang mengingat lengan atas, alur telah disebut, ada di sisi belakangnya; adakah yang mau mengingat?","sulcus nervi radialis"],["Dari bawah alur ini berasal kepala dalam, dan di atasnya berasal kepala luar.","caput mediale; caput laterale"],["Kepala panjang berasal dari benjolan di bawah rongga sendi belikat, tanpa ragu.","caput longum; tuberculum infraglenoidale"],["Persarafannya berasal dari saraf pengumpil, yang dapat engkau tunjuk dari alurnya.","n. radialis"],["Tendonnya melekat pada ujung hasta, dan tanpa pembagian itu engkau akan kewalahan.","olecranon"],["Otot-otot di sisi depan lengan bawah tersusun dalam tiga lapisan.","compartimentum anterius antebrachii"],["Lapisan permukaan, lapisan tengah, dan lapisan dalam yang berada di belakangnya.","stratum superficiale, medium, profundum"],["Persarafannya terbagi dua sama, kecuali dua otot yang dipersarafi saraf hasta.","n. medianus; n. ulnaris"],["Nama-namanya akan disebut, maka dengarkanlah: otot pelentur pergelangan tangan sisi hasta.","m. flexor carpi ulnaris"],["Satu lagi di sisi dalam melenturkan jari-jari, terletak di lapisan dalam.","m. flexor digitorum profundus"],["Lapisan permukaan di sisi depan memuat empat otot; agar tempatnya mudah diingat, letakkan",""],["ibu jari kalian di belakang lengan bawah; adapun sisanya di bagian depan akan tampak jelas.","antebrachium"],["Nama-namanya kusebutkan dengan isyarat sandi, demi hafalan dan agar mudah dibedakan.",""],["Betapa sering sang pelukis bertemu gempa yang terjadi, dengan telapak tangan yang panjang dan jari yang bersinar. (kalimat sandi penghafal nama otot)",""],["Otot pronator teres memiliki dua kepala, dan tempat lekatnya di sisi luar tulang pengumpil.","m. pronator teres; pengumpil = radius"],["Kepala dalamnya yang terkenal itu berasal dari tonjolan berbentuk paruh,","caput profundum; processus coronoideus ulnae"],["sedangkan asal kepala permukaannya, sebagaimana disebutkan, adalah tonjolan kecil di sisi dalam,","caput humerale; epicondylus medialis humeri"],["dan di antara kedua kepalanya lewat saraf median; pendapat selain ini bertentangan.","n. medianus"],["Otot pelentur pergelangan tangan sisi pengumpil; asalnya tonjolan kecil di sisi dalam,","m. flexor carpi radialis; epicondylus medialis humeri"],["dan tempat lekatnya pada tulang telapak tangan ketiga, ditambah yang kedua tanpa terputus.","os metacarpi III; os metacarpi II"],["Asal otot telapak tangan yang panjang itu juga dari tonjolan kecil di sisi dalam,","m. palmaris longus; epicondylus medialis humeri"],["sedangkan tempat lekatnya pada selaput lebar telapak tangan, yang dapat dihafal dari uraiannya.","aponeurosis palmaris"],["Otot pelentur pergelangan tangan sisi hasta kita ini jelas, telah kuterangkan dalam uraian kita.","m. flexor carpi ulnaris; hasta = ulna"],["Asal kedua kepalanya telah kusebutkan, berurutan kutempatkan di sini:","caput humerale; caput ulnare"],["tonjolan kecil di sisi dalam lengan atas, dan dua pertiga bagian atas di belakang hasta.","epicondylus medialis humeri; olecranon dan margo posterior ulnae"],["Di antara kedua kepalanya lewat saraf hasta, dan tempat lekatnya","n. ulnaris"],["pada tulang kait, tulang kacang, dan tulang telapak tangan, yang kelima menurut hitungannya.","os hamatum; os pisiforme; os metacarpi V"],["Ketahuilah bahwa lapisan tengah hanya memiliki satu otot permukaan, yaitu otot yang melenturkan","lapisan tengah; m. flexor digitorum superficialis"],["jari-jari; asal kedua kepalanya dari tiga tulang tanpa keraguan.","caput humeroulnare; caput radiale"],["Kepala lengan atas-hasta, dan kepala pengumpil; di antara keduanya ada lengkung.","caput humeroulnare; caput radiale; arcus tendineus"],["Di antaranya lewat saraf median, dan menurut mereka juga saraf hasta serta pembuluh nadi.","n. medianus; n. ulnaris; a. ulnaris"],["Asal kedua kepala ini bagi yang memahami telah kusebutkan berurutan sebagaimana adanya:","caput humeroulnare; caput radiale"],["tonjolan kecil di sisi dalam dan tonjolan berparuh, serta tepi depan pengumpil.","epicondylus medialis humeri; processus coronoideus il sisi luar,","stratum superficiale; epicondylus lateralis humeri"],["telah kusebutkan secara ringkas; jangan lupa bahwa saraf pengumpil menjadi persarafannya.","n. radialis"],["Agar mudah, kuberi isyarat sandi; kusisipkan dalam kata-kata bait ini.",""],["Si tuli melewati betis dengan takut, endapan Zahi tekun berdoa. (kalimat sandi penghafal nama otot)",""],["Tempat lekat otot pelurus jari-jari adalah ruas-ruas keempat jari.","m. extensor digitorum; phalanges"],["Adapun otot yang khusus meluruskan jari kelingking, di situ terjadi percampuran,","m. extensor digiti minimi"],["karena seratnya menyatu dengan tendon otot pelurus jari-jari.","tendo m. extensoris digitorum"],["Otot pelurus pergelangan tangan sisi hasta; ia melekat pada tulang telapak tangan kelima, maka dengarkanlah.","m. extensor carpi ulnaris; os metacarpi V"],["Tempat lekatnya, tugasnya sudah terbaca dari namanya, tanpa dipanjangkan sehingga membosankan.","insertio"],["Asalnya tonjolan kecil sisi luar, dan bersama itu dari belakang hasta.","epicondylus lateralis humeri; ulna"],["Otot anconeus termasuk otot-otot ini, dan bentuknya segitiga.","m. anconeus"],["Ia melekat pada hasta dan ujung siku; seratnya ada di permukaan belakangnya.","ulna; olecranon; facies posterior"],["Yang kedua adalah kelompok dalam; akan kuberitahu isinya, ambillah kebenarannya.","stratum profundum"],["Nama-namanya pun telah kuberi isyarat sandi, kusisipkan dalam kata-kata bait ini.",""],["Abu Tuni tampak menceritakan sebabnya, sambil tersenyum Abu Tuni mencela. (kalimat sandi penghafal nama otot)",""],["Otot penjauh ibu jari yang panjang; hafalkan asalnya tanpa cela:","m. abductor pollicis longus"],["pengumpil, hasta, dan selaput di antaranya, pada permukaan belakangnya, tanpa keraguan.","radius; ulna; membrana interossea"],["Ia melekat di sisi luar tulang telapak tangan, di tempat yang pertama, sedangkan perutnya berbentuk seperti kumparan.","os metacarpi I; venter fusiformis"],["Otot pelurus ibu jari yang pendek; bacalah asalnya tanpa bingung:","m. extensor pollicis brevis"],["pengumpil, dan dari selaput penghubung yang berada di antara tulang-tulang, sebagai pengikat dan penyambung.","radius; membrana interossea"],["Ia dimaksudkan berada di sisi belakang (punggung) tangan; qiyaskan saja pada bagian lain yang akan menyusul.","facies posterior"],["Tempat lekatnya pada ruas jari yang dekat, sedangkan selebihnya tetap berlaku sebagaimana yang datang dalam syarah.","phalanx proximalis pollicis"],["Ia pembentang ibu jari yang panjang, dan asalnya sebagaimana yang telah dinukil.","m. extensor pollicis longus"],["Asalnya dari hasta dan selaput di antara tulang-tulang, sedangkan tempat lekatnya pada ruas jari yang jauh.","hasta = ulna; selaput antartulang = membrana interossea; phalanx distalis pollicis"],["Ia pembentang jari kedua (telunjuk), dengan peran tambahan yang menguatkan pembentangannya.","telunjuk = digitus secundus (index); m. extensor indicis"],["Asalnya dari selaput penghubung dan dari hasta di sisi belakang, pada bagian yang lebih bawah.","membrana interossea; ulna"],["Tendonnya menyatu dengan tendon otot pembentang jari-jari.","tendo m. extensor digitorum"],["Kelompok sisi luar bagian belakang ini beranggotakan empat otot.","grup posterior lateral (lapisan otot ekstensor lengan bawah)"],["Yang pertama adalah otot pembentang, kerjanya menengadahkan lengan bawah (telapak ke atas), bukan menelungkupkannya.","m. supinator; supinasi (bukan pronasi)"],["Asalnya dari dua kepala, dan kedua kepala itu berasal dari dua tulang.","caput superficiale et caput profundum"],["Kepala permukaannya berasal dari benjolan di sisi luar lengan atas.","epicondylus lateralis humeri"],["Adapun kepala yang dalam datang dari lekukan pada hasta, ditambah rigi miliknya.","fossa supinatoria; crista supinatoria ulnae"],["Kedua kepala itu melekat pada sisi depan pengumpil; jangan sampai kembali dengan tangan hampa.","pengumpil = radius (facies anterior)"],["Kepala yang dalam, ketahuilah, berhenti pada leher pengumpil dengan pelekatan yang kokoh.","collum radii"],["Adapun kepala permukaannya melekat pada sebuah tepi di sebelah depan.","margo anterior radii"],["Sesudahnya ada dua otot yang membentangkan pergelangan tangan, keduanya bersisi pengumpil.","m. extensor carpi radialis"],["Keduanya digolongkan menurut panjangnya: yang panjang dan yang pendek.","m. extensor carpi radialis longus; m. extensor carpi radialis brevis"],["Kerjanya menjauhkan (ke sisi pengumpil) dan membentangkan; inilah penjelasan yang panjang, hafalkanlah.","abduksi (deviasi radial); ekstensi"],["Dari sisi luar lengan atas ia bermula, dari rigi di atas benjolan.","humerus; crista supracondylaris lateralis; epicondylus lateralis"],["Dasar tulang telapak tangan yang kedua adalah tempat lekat tendonnya, dengan kesepakatan.","tulang telapak tangan kedua = os metacarpale II (basis)"],["Ketahuilah bahwa asal yang pendek pasti dari benjolan sisi luar.","epicondylus lateralis humeri; m. extensor carpi radialis brevis"],["Lekatnya di belakang dasar tulang telapak tangan yang ketiga, ke sanalah ia kembali.","tulang telapak tangan ketiga = os metacarpale III (basis)"],["Ambillah namanya 'lengan atas', lalu gabungkan dengan separuh nama 'pengumpil'.","m. brachioradialis (brachium + radius)"],["Dari sisi luar lengan atas ia bermula, dari rigi di atas benjolan.","humerus; crista supracondylaris lateralis; epicondylus lateralis"],["Asalnya berada di atas asal yang telah disebut, dan lekatnya pada tonjolan yang runcing.","processus styloideus radii"],["Otot ibu jari, atau pangkal ibu jari (bantalan tenar); persarafannya berasal dari separuh (saraf) yang berlainan.","otot tenar = thenar muscles; eminentia thenaris"],["Persarafan otot yang mendekatkan ibu jari itu diperoleh dari seratnya yang berasal dari saraf hasta.","n. ulnaris; m. adductor pollicis"],["Ada penjauh pendek bagi ibu jari, yang menggerakkan ibu jari ke depan.","m. abductor pollicis brevis"],["Ada pendekat yang menarik ke belakang, dan penentang untuk me
