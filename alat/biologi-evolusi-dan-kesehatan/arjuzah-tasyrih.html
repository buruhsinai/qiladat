<header><h1>أُرْجُوزَةُ التَّشْرِيحِ</h1><p>Syair Anatomi Modern · Juz 1 Tubuh Atas + Juz 2 Tubuh Bawah · prototipe cepat</p><p id="st"></p></header>

<script>
// Format: bab -> pasal [judul, hlm_buku, [[syatr1,syatr2],...]] ; bait kosong = belum dikerjakan. Nomor bait global berlanjut.
const D=[
{b:"المقدمة",p:[["مُقَدِّمَةُ النَّظْمِ",5,[
["بِاسْمِ الإِلَـهِ الخَـالِقِ المَنَّـانِ","قَـدْ أَحْسَـنَ التَّقْـوِيمَ فِي الأَبْـدَانِ"],
["وَكَرَّمَ الإِنْسَـانَ أَعْلَـى شَـأْنَهُ","مُفَضِّـلًا بِـأَنْ حَبَـاهُ عَقْلَـهُ"],
["وَجَاعِـلِ التَّفْكِيـرِ فِي آيَاتِـهِ","سَـبِيلَ وَصْـلِ الحَـقِّ فِي اعْتِقَـادِهِ"],
["مِنْ أَجْلِ ذَا نَصَّ الكِتَابُ المُحْكَمُ","اللهُ لَا يَخْشَـاهُ إِلَّا عَـالِـمُ"],
["وَإِنَّ أَوْلَـى مَـا بِـهِ نُـفَـكِّـرُ","بِكُـلِّ مَـا فِي جِسْـمِنَـا مُقَـدَّرُ"],
["فَإِنَّ آيَاتِ الجُسُومِ نَاطِقَـاتْ","أَدِلَّـةُ التَّوْحِيـدِ فِيهَـا قَائِمَـاتْ"],
["لَا يَعْقِلُ الآيَاتِ إِلَّا العَالِمُونْ","وَفِـي نُـفُوسِـكُمْ أَلَا تُبْصِـرُونْ؟"],
["ثُمَّ الصَّلَاةُ وَالسَّلَامُ دَائِمَا","عَلَى رَسُولِ الحَقِّ جَاءَ خَاتِمَا"],
["مُحَمَّدٍ وَآلِـهِ وَصَحْبِـهِ","وَكُلِّ تَابِعٍ أَتَى مِنْ بَعْدِهِ"],
["وَبَعْدُ فَالتَّشْرِيحُ عِلْمٌ نَافِعُ","لِكُلِّ شَيْءٍ فِي الجُسُومِ وَاقِعُ"],
["فَإِنَّـهُ الأَسَـاسُ فِي الجِرَاحَةِ","وَأَوَّلُ العُلُومِ فِي الدِّرَاسَةِ"],
["لِأَجْلِ ذَا نَظَمْتُ فِي التَّشْرِيحِ","أُرْجُوزَةً فِي غَايَـةِ التَّوْضِيحِ"],
["ضَمَّنْتُهَا مَا جَاءَ فِي الأَجْسَامِ","مِنْ كُلِّ عَضَلَاتٍ وَمِنْ عِظَامِ"],
["أَوْعِيَةً أَضِفْ وَمِنْ أَعْصَابِ","فَصُغْتُهَا إِلَى أُولِي الأَلْبَابِ"],
["بِوَاضِحِ المَعْنَى وَقُرْبِ اللَّفْظِ","حَتَّى تَكُونَ سَهْلَةً فِي الحِفْظِ"],
["أَرْجُو بِهَا أَنْ تَنْفَعَ الطُّلَّابَا","وَالأَجْرَ وَالقَبُولَ وَالثَّوَابَا"]]]]},
{b:"فصل العظام · Bones · Tubuh Atas",p:[
["مُقَدِّمَةُ الفَصْلِ",9,[
["الحَمْدُ لِلهِ العَظِيمِ الشَّانِ","قَدْ قَدَّرَ العِظَامَ فِي الأَبْدَانِ"],
["أَعْطَى بِهَا لِجِسْمِنَا القَوَامَا","قَوَّى بِهَا الثَّبَاتَ وَالدِّعَامَا"],
["حَتَّى تَصِيرَ كَائِنًا مُحَرَّكَا","وَبَيْنَ ذِي قَدْ أَوْجَدَ المَشَابِكَا"],
["عِظَامَنَا وَهَذِهِ قَدْ سَهَّلَتْ","أَيِ المَفَاصِلَ الَّتِي قَدْ رَبَطَتْ"],
["تَحَرُّكَ الأَطْرَافِ فِي الأَجْسَامِ","أَكْرِمْ بِهَا مِنْ هَيْكَلٍ دِعَامِي"]]],
["التَّرْقُوَة Clavicle",10,[
["تَرْقُوَةٌ أَوْلَى العِظَامِ الحَاضِرَهْ","فِي طَرَفٍ وَسَمِّهَا بِالنَّاحِرَهْ"],
["طَوِيلَةٌ، وَبَادِئٌ تَعَظُّمُ","بِهَا وَجُسُّهَا بِحَيٍّ مُمْكِنُ"],
["تَأَلَّفَتْ مِنَ النِّهَايَتَيْنِ","وَقَدْ أَتَى تَفْصِيلُنَا لِتَيْنِ"],
["نِهَايَةٌ وَحْشِيَّةٌ مَعْ أَخْرَمِ","تَمَفْصَلَتْ وَسُطِّحَتْ كَمَا نُمِي"],
["نِهَايَةٌ إِنْسِيَّةٌ تَمَفْصَلَتْ","مَعْ قَبْضَةٍ لِقَصِّنَا وَدُوِّرَتْ"],
["أَضِفْ لِذِي غُضْرُوفَ ضِلْعٍ أَوَّلِ","وَإِنْ هَذِهِ سُطُوحُ المَفْصِلِ"],
["وَثُلْثُهَا الوَحْشِيُّ قَدْ تَقَعَّرَا","إِلَى الأَمَامِ فَاحْفَظَنْ وَاسْتَحْضِرَا"],
["ثُلْثَانِ إِنْسِيَّانِ قَدْ تَحَدَّبَا","مَجْسُوسَةٌ فِي جِسْمِنَا فَجَرِّبَا"],
["وَوَجْهُهَا مِنْ أَسْفَلٍ فَقَدْ حَوَى","مَعَالِمًا شَرَحْتُهَا لِمَنْ وَعَى"],
["مِنْ جَانِبٍ إِنْسِيٍّ فَقَدْ ذَكَرْتُهَا","فَلْتَحْفَظَنَّهَا كَمَا أَوْرَدْتُهَا"],
["الانْطِبَاعُ لِلرِّبَاطِ الضِّلْعِي","التَّرْقُوِيُّ أَوَّلًا بِالوَضْعِ"],
["ثَلْمٌ لَهُ فِي وَجْهِهِ ذُو حَظْوَةْ","إِنَّ اسْمَهُ المَعْرُوفُ تَحْتَ التَّرْقُوَةْ"],
["ثُمَّ أَتَتْ حُدَيْبَةٌ المَخْرُوطِي","مَكَانُهَا فِي المَوْضِعِ المَضْبُوطِ"],
["وَآخِرًا فِي وَجْهِهِ خَطٌّ عُرِفْ","مِنْ اسْمُهُ قَدْ جَاءَ شِبْهُ المُنْحَرِفْ"]]],
["العَظْمُ الكَتِفِيّ Scapula",12,[
["أَمَّا الثَّانِيْ مِنْ عِظَامِ الطَّرَفِ","الكَتِفِيْ اسْمٌ لِلَّوْحِ الكَتِفِ"],
["أَقْسَامُهُ ثَلَاثَةٌ تُوَضَّحُ","فَالأَوَّلُ (الجِسْمِ) الَّذِي يُسَطَّحُ"],
["مُثَلَّثِيٌّ شَكْلُهُ إِذَا لَهُ","ثَلَاثَةٌ مِنَ الزَّوَايَا، خُصَّهُ"],
["الزَّاوِيَةْ الَّتِيْ مِنَ الأَعْلَى بَدَتْ","لِضِلْعِنَا الثَّانِيْ فَقَدْ حَذَتْ"],
["وَالزَّاوِيَةْ السُّفْلَى تَكُونُ وَاقِعَةْ","بِمُسْتَوَى ضِلْعٍ تَكُونُ سَابِعَةْ"],
["زَاوِيَةٌ وَحْشِيَّةٌ أَوْ رَأْسُهُ","وَالعُنُقُ الَّذِي لِذَاكَ قَبْلَهُ"],
["وَالحَافَةُ العُلْيَا بِهَا قَدْ ظَهَرَا","مِنْ ثُلْمَةٍ كَتِفِيَّةٍ قَدْ مَرَّرَا"],
["أَوْعِيَةٌ أَضِفْ لَهَا المُعَصَّبَا","وَذَا بِفَوْقِ الكَتِفِيِّ لُقِّبَا"],
["وَاحْفَظْ بِأَنَّ (النَّاتِئَ الغُرَابِيْ)","بِشَكْلِ مِنْقَارٍ بِلَا ارْتِيَابِ"],
["لِفَوْقِ لِلْوَحْشِيِّ بَعْدُ يَنْحَنِيْ","مُشَابِهًا لِإِصْبَعٍ سَبَّابَتِيْ"],
["وُجُوهُهُ ضِلْعِيٌّ وَظَهْرِيْ","وَشَرْحُنَا مِنْ مَصْدَرٍ مُعْتَبَرِ"],
["فَأَلْقِ نَحْوَ مَا أَقُولُ السَّمْعَا","وَاجْمَعْ شَتَاتَ مَا شَرَحْتُ جَمْعَا"],
["فَوَجْهُهُ الضِّلْعِيُّ قَدْ تَقَعَّرَا","وَحُفْرَةٌ مَوْجُودَةٌ بِهِ تُرَى"],
["بِتَحْتِ كِتْفٍ سُمِّيَتْ وَعُرِفَا","مَكَانُهَا مِنَ الأَمَامِ أُلْفِيَا"],
["وَوَجْهُهُ الظَّهْرِيُّ - فَاذْرِ - قَدْ قُسِمْ","بِـ (شَوْكَةٍ لِلكَتِفِيِّ) قَدْ عُلِمْ"],
["تَشَكَّلَ مِنْ فَوْقِهَا وَتَحْتِهَا","لِحُفْرَتَيْنِ أَعْلِمْهُمَا مِنْ اسْمِهَا"],
["مِنْ شَوْكَةٍ مَذْكُورَةٍ بِالأَخْرَمِ","فِي الجَانِبِ الوَحْشِيِّ تَمَادَتْ فَافْهَمِ"],
["فِي جَانِبِ الكَتِفِيِّ بِالإِعْلَانِ","مُصَرَّحٌ عَنْ جَوْفِهِ الحِقَّانِيْ"],
["حُدَيْبَةٌ فَوْقَ وَتَحْتَ الجُوفِ","بِعَظْمِنَا وَاضِحَةٌ بِالشُّوفِ"]]],["عَظْمُ العَضُدِ Humerus",16,[
["وَبَعْدَهُ فَقَدْ أَتَى عَظْمُ العَضُدْ","هُوَ الوَحِيدُ فِي الذِّرَاعِ دُونَ لُدْ"],
["مُؤَلَّفٌ مِنَ النِّهَايَتَيْنِ","وَجِسْمُهُ يَكُونُ بَيْنَ تَيْنِ"],
["نِهَايَةٌ عُلْوِيَّةٌ لِلْعَضُدِ","تَحْوِي بَوَارِزَ اسْتَمِعْ لِلْمَقْصِدِ"],
["(فَرَأْسُهُ) يَكُونُ بِاقْتِرَانِ","مَعْ كَتِفِيٍّ جَوْفِهِ الحِقَّانِيْ"],
["(حُدَيْبَةٌ صَغِيرَةٌ) قَدْ جَاءَتْ","بِعُرْفِهَا لِأَسْفَلٍ تَمَادَتْ"],
["(حُدَيْبَةٌ كَبِيرَةٌ) فِي الوَحْشِي","بَيْنَ الحُدَيْبَتَيْنِ ثُلْمٌ يَمْشِي"],
["رَأْسٌ طَوِيلٌ عَائِدٌ لِمَنْ لَهَا","رَأْسَانِ فِي الأَمَامِ رَاجِعْ شَرْحَهَا"],
["بَيْنَ الحُدَيْبَتَيْنِ بِالتَّصْرِيحِ","وَرَأْسِهِ جَا عُنُقٌ تَشْرِيحِيْ"],
["وَبَيْنَ أَعْلَاهُ وَبَيْنَ الجِسْمِ","عُنُقٌ جِرَاحِيٌّ بِهَذَا سُمِّي"],
["لِأَنَّهُ بِهِ أَشَعْنَا كَسْرَا","ذَا شَرْحُهُ لَا تَخْلِطَنَّ أُخْرَى"],
["أَمَّا حَوَافُ جِسْمِهِ ثَلَاثَةٌ","وَشَرْحُنَا هُ إِبَانَةٌ"],
["حَوَافُهُ مَعْرُوفَةٌ عِنْدَ الأَنَامْ","وَحْشِيَّةٌ إِنْسِيَّةٌ وَفِي الأَمَامْ"],
["عُرْفُ الحُدَيْبَةِ الصَّغِيرَةْ شَكَّلَا","إِنْسِيَّةٌ وَقَدْ تَمَادَتْ أَسْفَلَا"],
["إِلَى لُقَيْمَةٍ أَتَتْ فِي الإِنْسِيْ","فَأَمْكِنَنَّ الحِفْظَ دُونَ قَعْسِ"],
["وَالأُخْرَى مِنَ الأَمَامِ شُكِّلَتْ","مِنْ عُرْفِ الكَبِيرَةِ الَّتِي بَدَتْ"],
["أَضِفْ إِلَى حَوَافِهِ وَحْشِيَّةْ","بِقِسْمِهِ العُلْوِيِّ لَا مِرْيَةْ"],
["وَهَذِهِ أَيْضًا تَمَادَتْ لِتَصِلْ","لُقَيْمَةٌ وَحْشِيَّةٌ كَذَا نُقِلْ"],
["وُجُوهُهُ تَعْدَادُهَا ثَلَاثَةٌ","وَحْشِيَّةٌ إِنْسِيَّةٌ خَلْفِيَّةٌ"],
["بِوَجْهِهِ الخَلْفِيِّ ثُلْمُ العَصَبِ","الكُعْبُرِيْ فَاعْلَمْ بِهَذَا تُصِبِ"],
["أُحْدُوبَةٌ دَالِيَّةٌ فِي الوَحْشِي","ظَاهِرَةٌ بِسَطْحِهَا المُخَشَّشِ"],
["نِهَايَةٌ سُفْلِيَّةٌ تَحْوِيْ عَلَى","مَعَالِمٍ قَدْ بُرِّزَتْ لِمَنْ يَرَى"],
["مِنَ الأَمَامِ جَاءَ لُقْمَتَانِ","وَفَوْقَ مَفْصَلَيْهِمَا قَعْرَانِ"],
["فَلُقْمَةٌ وَحْشِيَّةٌ تَشْتَمِلُ","عَلَى لُقَيْمَةٍ رُؤَيْسٍ نَقَلُوا"],
["وَقَدْ تَمَفْصَلَ الرُّؤَيْسُ وَاتَّصَلْ","مَعْ رَأْسِ الكُعْبُرَةِ الَّذِيْ وَصَلْ"],
["وَحُفْرَةٌ فَوْقَ الرُّؤَيْسِ مُظْهَرَهْ","قَدْ خُصِّصَتْ مِنْ أَجْلِ رَأْسِ الكُعْبُرَهْ"],
["وَلُقْمَةٌ إِنْسِيَّةٌ قَدْ ظَهَرَهْ","بِهَا لُقَيْمَةٌ تُرَى وَبَكَرَهْ"],
["تَمَفْصَلَتْ مَعْ ثُلْمَةٍ بِكْرِيَّةْ","بِالمُسْتَوَى الوَحِيدِ فِي الحُرِّيَّةْ"],
["وَحُفْرَةُ المِنْقَارِيْ فِيْ الإِنْسِيْ","بِقَعْرِهَا المِنْقَارِيْ قَدْ أُرْسِيْ"],
["قَدْ جَا مِنَ الأَمَامِ لُقْمَتَانِ","أَمَّا مِنَ الخَلْفِ فَقُولُ ثَانِيْ"],
["جَا حُفْرَةٌ زَجِّيَّةٌ لِلْعَضُدِ","النَّاتِئُ الزَّجِّيْ بِهَا لِلزَّنْدِ"],
["وَرَا لُقَيْمَةٌ أَتَتْ فِي الإِنْسِيْ","ثُلْمٌ يُؤَدِّي مِثْلَ دَوْرِ الحَبْسِ"],
["لِلْعَصَبِ الزَّنْدِيِّ ذَا مُقَامُ","{فَاحْفَظْ فَكُلُّ حَافِظٍ إِمَامُ}"]]],["عَظْمُ الزَّنْدِ Ulna",20,[
["فِي سَاعِدٍ مَجِيءُ عَظْمِ الزَّنْدِ","فِي الجَانِبِ الإِنْسِيِّ لِكُلِّ فَرْدِ"],
["نِهَايَةٌ قَرِيبَةٌ وَفِيهَا","مَعَالِمٌ عَدِيدَةٌ نَحْكِيهَا"],
["(النَّاتِئُ الزَّجِّيُّ) نَاتِئٌ بَرَزْ","خَلْفًا عَمُودِيًّا وَفِيهِ مُرْتَكَزْ"],
["لِلْعَضْلَةِ الثَّلَاثَةِ الرُّؤُوسِ","حَطَّتْ بِهِ بِالوَتَرِ المَغْرُوسِ"],
["وَ(نَاتِئٌ جَاءَ اسْمُهُ مِنْقَارِيْ)","وَشَرْحُهُ يَأْتِيكَ بِاخْتِصَارِ"],
["ذُو أَرْبَعٍ مِنَ الوُجُوهِ تَحْضُرُ","وَذُرْوَةٍ إِلَى الأَمَامِ تَنْظُرُ"],
["فِي وَجْهِهِ الوَحْشِيِّ ثُمَّ الثُّلْمَةُ","الكُعْبُرِيَّةُ الَّتِي قَدْ أُحْكِمَةْ"],
["تَمَفْصُلٌ لَهَا بِعَظْمِ الكُعْبُرَةْ","بِمَفْصَلٍ وَإِنَّهَا مُقَعَّرَةْ"],
["أَيْضًا بِهِ العُرْفُ الَّذِي لِلْبَاسِطَةْ","لِلْعَضْلَةِ الَّتِي بِذَاكَ رَابِطَةْ"],
["وَوَجْهُهُ السُّفْلِيْ بِهِ أُحْدُوبَةْ","زَنْدِيَّةٌ وَلَمْ تَكُنْ مَحْجُوبَةْ"],
["وَثُلْمَةٌ بِكْرِيَّةٌ مَحْفُورَةْ","مِنْ بَيْنِ ذِي النَّوَاتِئِ المَذْكُورَةْ"],
["وَعَرْضُ جِسْمِهِ فَفِي نُقْصَانِ","وَرُبْعُهُ السُّفْلِيُّ أُسْطُوَانِيْ"],
["وَمَا يَبْقَيْ مِنْ جِسْمِهِ مَوْشُورُ","مِنَ الأَمَامِ وَجْهُهُ المَنْظُورُ"],
["مُقَعَّرٌ، وَثُقْبَةٌ مُغَذِّيَةْ","بَانَتْ بِهِ لِجَوْفِهِ مُؤَدِّيَةْ"],
["وَوَجْهُهُ الخَلْفِيُّ قَدْ تَحَدَّبَا","وَجُسَّ فِي الإِنْسِيِّ أَنْ تُجَرِّبَا"],
["مِنَ الأَمَامِ حَافَةٌ تُنُبِّأُ","مِنْ تَحْتِ مِنْقَارِيِّهِ سَتَبْدَأُ"],
["وَحْشِيَّةٌ تَمَيَّزَتْ بِاسْمَيْنِ","قَدْ سُمِّيَتْ ذِي (بَيْنَ العَظْمَيْنِ)"],
["وَحَافَةٌ أَيْضًا مِنَ الوَرَاءِ","بَارِزَةٌ حَقًّا بِلَا امْتِرَاءِ"],
["فَجُسَّهَا إِنْ لَمْ تَكُنْ مُقَبَّبَةْ","وَمَنْ أَرَادَ حِفْظَ شَيْءٍ جَرَّبَهْ"],
["جَا فِي نِهَايَةٍ لَهُ فِي الأَسْفَلِ","ثِنْتَانِ مِنْ بَوَارِزِ العَظْمِ الجَلِيْ"],
["فَالأَوَّلُ الرَّأْسُ الَّذِي قَدْ حُشِرَهْ","مَعْ ثُلْمَةٍ زَنْدِيَّةٍ لِلْكُعْبُرَهْ"],
["مُشَكِّلًا لِلْمِفْصَلِ السُّفْلِيِّ البَعِيدْ","بَيْنَهُمَا فَلْتَسْتَفْهِمَنْ مَا أُرِيدْ"],
["وَالنَّاتِئُ الإِبْرِيُّ جَاءَ ظَاهِرَا","فِي الجَانِبِ الإِنْسِيِّ جَاءَ حَاضِرَا"]]],["عَظْمُ الكَبِيرَةِ (الكُعْبُرَة) Radius",24,[
["وَعَظْمَةٌ وَحْشِيُّ زَنْدٍ مُحْضَرَهْ","بِسَاعِدٍ، وَسُمِّيَتْ بِالكُعْبُرَهْ"],
["وَإِنَّهَا مِنْ أَقْصَرِ العَظْمَيْنِ","وَجِسْمُهَا بَيْنَ النِّهَايَتَيْنِ"],
["وَفِي نِهَايَةٍ لَهَا فِي الأَعْلَى","بِهَا مَعَالِمٌ هُنَا تُجَلَّى"],
["وَاعْلَمْ بِأَنَّ الرَّأْسَ قَدْ تَأَلَّفَا","مِنَ المُحِيطِ الدَّائِرِيْ تَطَرُّفَا"],
["مُمَفْصَلٌ مَعْ ثُلْمَةٍ فِي الزَّنْدِ","الكُعْبُرِيَّةُ اسْمُهَا فِي الفَرْدِ"],
["وَسَطْحِهِ العُلْوِيْ الَّذِيْ تَقَعَّرَا","مَعَ الرُّؤَيْسِ بِارْتِبَاطٍ قُدِّرَا"],
["وَالعُنُقُ الَّذِي لَهَا تَضَيَّقَا","قَدْ جَاءَ تَحْتَ رَأْسِهَا فَحَدَّقَا"],
["وَتَحْتَهَا أُحْدُوبَةٌ قَدِ انْحَكَمْ","وَجُودُهَا بِعَظْمِنَا قَدِ انْحَتَمْ"],
["إِنَّ اسْمَهَا المَشْهُورَ كُعْبُرِيَّةْ","بَارِزَةٌ وَلَمْ تَكُنْ خَفِيَّةْ"],
["وَجِسْمُهَا لِأَسْفَلٍ قَدْ سُرْهِدَا","وَزَنْدُنَا بِعَكْسِ ذَا قَدْ عُهِدَا"],
["ثَلَاثَةٌ وُجُوهُ جِسْمِ الكُعْبُرَهْ","حَوَافُهَا فِي عَدِّنَا مُنَاظِرَهْ"],
["وُجُوهُهَا الخَلْفِيُّ وَالأَمَامِيْ","وَالوَحْشِيُّ فَاحْفَظَنْ كَلَامِيْ"],
["فِي وَجْهِهَا الوَحْشِيِّ مَوْجُودٌ زُكِنْ","هُوَ ارْتِكَازٌ انْطِبَاعُهُ خَشِنْ"],
["لِكَابَّةٍ مُدِيرَةٍ تُفَصَّلُ","بِشَرْحِنَا وَكُلُّهُ مُؤَوَّلُ"],
["وَاعْلَمْ بِأَنَّ وَجْهَهَا الأَمَامِيْ","مُقَعَّرٌ تَرَاهُ بِانْسِجَامِ"],
["فِي نِصْفِهِ جَا ثُقْبَةٌ مُغَذِّيَهْ","وَثُقْبَةٌ فِي زَنْدِنَا مُحَاكِيَهْ"],
["حَوَافُهَا فِي الخَلْفِ وَالأَمَامِ","أَضِفْ لَهَا الإِنْسِيَّ بِالتَّمَامِ"],
["تِلْكَ الَّتِي مِنَ الأَمَامِ تُجْلَى","تَمْتَدُّ مِنْ أُحْدُوبَةٍ فِي الأَعْلَى"],
["لِلنَّاتِئِ الإِبْرِيِّ فِي السُّفْلِيَّةْ","أَمَّا امْتِدَادُ الحَافَةِ الإِنْسِيَّةْ"],
["يَكُونُ مِنْ أُحْدُوبَةٍ عَلَتْ","حَتَّى النِّهَايَةِ الَّتِي دَنَتْ"],
["وَحَافَةٌ أَيْضًا أَتَتْ مِنَ الوَرَا","بَدَتْ بِسَطْحِهَا الَّذِي تَدَوَّرَا"],["نِهَايَةٌ سُفْلِيَّةٌ مُؤَلَّفَهْ","مِنَ الوُجُوهِ الخَمْسَةِ المُعَرَّفَهْ"],["بِهَا مَعَالِمٌ هُنَا تُحَرَّرُ","حُدَيْبَةٌ ظَهْرِيَّةٌ وَتَظْهَرُ"],["فِي وَجْهِهِ الخَلْفِيِّ وَالثُّلْمَانِ","مَحْسُوسَةٌ بِالجَسِّ فِي الأَبْدَانِ"],["وَثُلْمَةٌ زَنْدِيَّةٌ تَقَعَّرَتْ","بِوَجْهِهِ الإِنْسِيِّ قَدْ تَبَرَّزَتْ"],["وَوَجْهُهُ الوَحْشِيُّ فِيهِ يَبْدُو","النَّاتِئُ الإِبْرِيْ الَّذِي يَمْتَدُّ"],["لِأَسْفَلٍ ثِلْمَانِ أَيْضًا، إِنْ تَرَى","مِنَ الأَمَامِ وَجْهُهُ تَقَعَّرَا"],["وَوَجْهُهُ السُّفْلِيُّ قَدْ تَوَضَّعَا","مَعْ زَوْرَقِيٍّ وَالهِلَالِيِّ مَعَا"]]],["عَظْمُ الرُّسْغِ Carpals",28,[["نَصِيبُ رُسْغِنَا مِنَ العِظَامِ","ثَمَانِيَةْ فِي الخَلْفِ وَالأَمَامِ"],["قَدْ رُتِّبَتْ عِظَامُهَا صَفَّيْنِ","وَسَاهَمَتْ فِي هَيْكَلِ اليَدَيْنِ"],["تَعْدَادُهَا فِي كُلِّ صَفٍّ أَرْبَعُ","وَحِفْظُهَا رَجَزًا هُنَا قَدْ يَنْفَعُ"],["تَرْتِيبُهَا مِنْ وَجْهِهَا الرَّاحِيِّ","مِنْ صَفِّهَا العُلْوِيِّ لِلْإِنْسِيِّ"],["(فَالزَّوْرَقِيُّ) (وَالهِلَالِيُّ) أَتَى","فِي جَانِبِ (المُثَلَّثِيِّ) نُبِّئَا"],["(وَالحِمَّصِيُّ) وَجْهُهُ الخَلْفِيُّ","مُمَفْصَلٌ بِهِ المُثَلَّثِيُّ"],["وَسَطْحُ هَذَا الوَجْهِ قَدْ تَقَعَّرَا","وَآخَرٌ مُحَدَّبٌ لِمَنْ يَرَى"],["أَمَّا عِظَامُ صَفِّهَا السُّفْلِيِّ","أَتَتْ مِنَ الوَحْشِيِّ لِلْإِنْسِيِّ"],["(مُرَبَّعِيْ) وَبَعْدَهُ (المُنْحَرِفِي)","(كَبِيرُ) (كُلَّابِيْ وَشَصِّيْ) فَاعْرِفِ"]]]]},
{b:"فصل العضلات · Muscles · Tubuh Atas",p:[["مُقَدِّمَةُ فَصْلِ العَضَلَاتِ",32,[["مَعَ العِظَامِ جِسْمُنَا قَدِ اشْتَمَلْ","عَلَى مُحَرِّكَاتِهَا هِيَ العَضَلْ"],["وَجِسْمُنَا يُعْطَى بِهَا حُدُودَهْ","وَبَعْضُهَا يُحَرِّكُ الجُلُودَهْ"],["مَوْجُودَةٌ فِي وَجْهِنَا تُعَبِّرُ","عَنْ كُلِّ إِحْسَاسٍ بِهِ قَدْ نَشْعُرُ"]]],["عَضَلَاتُ النَّاحِيَةِ الصَّدْرِيَّةِ",32,[["نَاحِيَةٌ صَدْرِيَّةٌ قَدْ ضُمِّنَتْ","أَرْبَعَ عَضْلَاتٍ بِهَا قَدْ فُصِّلَتْ"]]],["العَضَلَةُ الصَّدْرِيَّةُ الكَبِيرَةُ Musculus pectoralis major",33,[["وَجَاءَ لِلصَّدْرِيَّةِ الكَبِيرَةْ","مَنَاشِئٌ عَدِيدَةٌ كَثِيرَةْ"],["غُضْرُوفُ ضِلْعٍ أَوَّلٍ هِيَ حَاضِرَةْ","لِسَادِسٍ وَقُصُّنَا وَنَاحِرَةْ"],["أَضِفْ سِفَاقَ الخَارِجِيَّةِ المَائِلَةْ","هِيَ الَّتِي الأَلْيَافُ فِيهَا نَازِلَةْ"],["أَمَّا ارْتِكَازُهَا الَّذِي قَدْ سُجِّلَا","عُرْفُ الحُدَيْبَةِ الكَبِيرَةِ انْقُلَا"],["قَدْ عُصِّبَتْ مِنْ صَدْرَوِيٍّ إِنْسِيْ","وَحْشِيْ إِضَافَةً بِغَيْرِ لَبْسِ"]]],["العَضَلَةُ الصَّدْرِيَّةُ الصَّغِيرَةُ Musculus pectoralis minor",35,[["صَدْرِيَّةٌ كَبِيرَةٌ تُخَبِّئُ","صَدْرِيَّةٌ صَغِيرَةٌ وَتَنْشَأُ"],["مِنْ ثَالِثِ الأَضْلَاعِ حَتَّى الخَامِسِ","مِنَ الأَمَامِ فُصِّلَتْ لِلدَّارِسِ"],["وَالبَطْنُ لِلتَّسْطِيحِ ذُو اقْتِرَابِ","وَالِارْتِكَازُ نَاتِئٌ غُرَابِيْ"],["صَدْرِيُّهَا الإِنْسِيُّ مِنْهُ عُصِّبَتْ","مِزْهَا فَهِيَ بِعَضْلَةٍ قَدْ غُطِّيَتْ"]]],["العَضَلَةُ تَحْتَ التَّرْقُوَةِ Musculus subclavius",36,[["أُخْرَى اسْمُهَا يَكُونُ تَحْتَ التَّرْقُوَةْ","لَا بُدَّ مِنْ شَرْحٍ لَهَا أَنْ أَجْلُوَهْ"],["تَمْتَدُّ مِنْ غُضْرُوفِ ضِلْعٍ أَوَّلِ","لِثُلْمِهَا الَّذِي أَتَى بِأَسْفَلِ"],["تَرْقُوَةٍ، بَيَّنْتُهُ فَرَاجِعِ","فَصْلَ العِظَامِ شَرْحَهُ فَطَالِعِ"],["تَعْصِيبُهَا مِنْ عَصَبٍ لَهُ اسْمُهَا","ذَا وَاضِحٌ عَرَفَهُ أُولُو النُّهَى"]]],["العَضَلَةُ المِنْشَارِيَّةُ الأَمَامِيَّةُ Musculus serratus anterior",37,[["أُخْرَى أَتَتْ شَبِيهَةَ المِنْشَارِ","أَوْ عَضْلَةَ المُلَاكِمِ المُبَارِي"],["مِنْ أَوْجُهٍ وَحْشِيَّةٍ تُسْتَقْرَأُ","مِنْ أَوَّلِ الأَضْلَاعِ جَاءَ المَنْشَأُ"],["لِتَاسِعِ الأَضْلَاعِ كُلٌّ يَشْتَرِكْ","أَلْيَافُهَا عِنْدَ النُّشُوءِ تَشْتَبِكْ"],["مَعَ اللُّسَيْنَاتِ الَّتِي لِلْمَائِلَةْ","الظَّاهِرَةْ الَّتِي لَهَا مُقَابِلَةْ"],["وَقَدْ أَتَى صَدْرِيُّهَا الطَّوِيلُ","مُعَصَّبًا، فِي لِيفِهَا خَلِيلُ"],["أَلْيَافُهَا تَحُطُّ فِي الكَتِفِيِّ","قَدْ ثُبِّتَتْ فِي حَرْفِهِ الإِنْسِيِّ"]]],["عَضَلَاتُ الظَّهْرِ",39,[["وَهَاكَ شَرْحَ العَضَلَاتِ الوَاصِلَهْ","إِلَى العَمُودِ الفَقَرِيِّ كَامِلَهْ"],["فَهَذِهِ قَدْ وُجِدَتْ فِي الظَّهْرِ","وَرُتِّبَتْ مَجْمُوعَتَيْنِ فَادْرِ"]]],["المَجْمُوعَةُ السَّطْحِيَّةُ — العَضَلَةُ شِبْهُ المُنْحَرِفَةِ Musculus trapezius",40,[["مَجْمُوعَةٌ سَطْحِيَّةٌ مُؤَلَّفَهْ","مِنْ عَضْلَةٍ شَبِيهَةِ المُنْحَرِفَهْ"],["نَاشِئَةٌ مِنْ ظَاهِرِ القَذَالِي","نَاشِزَةٍ مِنْهُ وَخَطٍّ عَالِي"],["نَوَاتِئٍ شَوْكِيَّةٍ لِفَقْرِ","صَدْرِيَّةٍ رَقَبِيَّةٍ بِظَهْرِ"],["وَبَطْنُهَا مُثَلَّثِيٌّ لَا جَرَمْ","مُقَسَّمٌ ثَلَاثَةً مِنَ الحُزَمْ"],["عُلْوِيَّةٌ حَطَّتْ بِلَا شِقَاقِ","فِي الثُّلُثِ الوَحْشِيِّ لِلتَّرَاقِي"],["وَالحُزْمَةُ الوُسْطَى لَهَا تَرْتَكِزُ","فِي شَوْكَةٍ وَأَخْرَمٍ فَمَيِّزُوا"],["سُفْلِيَّةٌ فِي شَوْكَةٍ بِبَعْضِهَا","وَفِي حُدَيْبَةٍ تُسَمَّى بِاسْمِهَا"],["تَعْصِيبُهَا قَدْ جَاءَهَا مِنْ لَاحِقِ","مِزْهُ فَلِيفُهَا بِقَحْفٍ عَالِقِ"]]],["العَضَلَةُ العَرِيضَةُ الظَّهْرِيَّةُ Musculus latissimus dorsi",42,[["عَرِيضَةٌ ظَهْرِيَّةٌ ذِي وَاقِعَهْ","بِظَهْرِنَا عَلَى مَسَاحَةٍ وَاسِعَهْ"],["أَلْيَافُهَا عَدِيدَةُ المَنَاشِئِ","بَيَّنْتُهَا كَشَوْكَةِ النَّوَاتِئِ"],["لِلْفَقَرِ القَطْنِيَّةِ الكَبِيرَهْ","وَالسِّتَّةِ الصَّدْرِيَّةِ الأَخِيرَهْ"],["وَأَرْبَعٍ مِنْ أَضْلُعٍ سُفْلِيَّهْ","مِنْهَا مِنَ النَّاحِيَةِ الوَحْشِيَّهْ"],["وَالزَّاوِيَةُ السُّفْلَى لِعَظْمِ الكَتِفِيْ","وَالثُّلْثُ الخَلْفِيْ لِعُرْفِ الحُرْقُفِيْ"],["أَمَّا ارْتِكَازُهَا بِقَاعِ ثِلْمِ","بَيْنَ الحُدَيْبَتَيْنِ دُونَ فَصْمِ"],["صَدْرِيُّهَا الظَّهْرِيُّ مِنْهُ عُصِّبَتْ","مِزْهُ فَذِي بِظَهْرِنَا قَدْ أُلْفِيَتْ"]]],["المَجْمُوعَةُ العَمِيقَةُ",44,[["مَجْمُوعَةٌ عَمِيقَةٌ فِي الظَّهْرِ","تَعْصِيبُهَا مِنْ كَتِفِيٍّ ظَهْرِيْ"],["ثَلَاثَةٌ تَكُونُ بِالمُحَصَّلَهْ","وَلْتَنْظُرَنَّ الصُّورَةَ المُفَصَّلَهْ"]]],["العَضَلَةُ المُعَيَّنِيَّةُ الكَبِيرَةُ والصَّغِيرَةُ Musculus rhomboideus major & minor",45,[["مُعَيَّنِيَّتَانِ تُوجَدَانِ","بِظَهْرِنَا، تَيْنِ تُسَمَّيَانِ"],["مُعَيَّنِيَّةٌ صَغِيرَةٌ عَلَتْ","مُعَيَّنِيَّةٌ كَبِيرَةٌ بَدَتْ"],["تَفْصِيلُهَا بِشَرْحِنَا قَدْ أُحْضِرَا","أَوْرَدْتُهُ مُبَسَّطًا مُيَسَّرَا"],["مِنْ ثَانِي لِخَامِسِ صَدْرِيَّهْ","إِذْ تَقْصِدُ النَّوَاتِئَ الشَّوْكِيَّهْ"],["ذَا مَنْشَأُ الكَبِيرَةِ الَّذِي أُلِفْ","أَمَّا الصَّغِيرَةُ انْتَبِهْ لِمَا اخْتُلِفْ"],["مِنْ فَقْرَةٍ سَابِعَةٍ رَقَبِيَّهْ","وَفَقْرَةٍ أُولَى مِنَ الصَّدْرِيَّهْ"],["فِي حَافَةٍ إِنْسِيَّةٍ لِلْكَتِفِيْ","هَذَا ارْتِكَازُ تَيْنِ، هَذَا فَاعْرِفِ"]]],["العَضَلَةُ رَافِعَةُ الكَتِفِ Musculus levator scapulae",46,[["رَافِعَةٌ لِلْكَتِفِيِّ سُمِّيَتْ","لِرَفْعِ لَوْحِ الكَتِفِيِّ سُخِّرَتْ"],["لَكِنَّهَا لِعُنْقِهِ فَمُخْفِضَهْ","وَبَدْؤُهَا النَّوَاتِئُ المُسْتَعْرِضَهْ"],["لِلْفِقَرِ الرَّقَبِيَّةِ المُرَقَّمَهْ","مِنْ أَوَّلٍ لِرَابِعٍ لِتَعْلَمَهْ"],["أَمَّا ارْتِكَازُهَا أَتَى يُوَافِي","لِحَرْفِهِ الإِنْسِيْ مِنَ الحَوَافِ"]]],["عَضَلَاتُ الإِبْطِ",47,[["وَاعْلَمْ بِأَنَّ عَضَلَاتِ الإِبْطِ","بَالِغَةٌ لِسِتَّةٍ فِي الضَّبْطِ"],["وَاصِلَةٌ لِلْكَتِفِيِّ بِالعُضُدِ","وَمَا لَنَا عَنْ شَرْحِهَا مِنْ بُدِّ"]]],["العَضَلَةُ الدَّالِيَّةُ Musculus deltoideus",48,[["دَالِيَّةٌ حُزْمَاتُهَا تُعَدَّدُ","ثَلَاثَةٌ بِشَرْحِنَا تُحَدُّ"],["تَرْقُوِيَّةٌ مِنَ الأَمَامِ حَاضِرَهْ","وَبَدْؤُهَا مِنْ ثُلْثٍ وَحْشِيِّ النَّاحِرَهْ"],["وَسِيطَةٌ مِنْ أَخْرَمٍ كَمَا وُصِفْ","كَتِفِيَّةٌ مِنْ تَحْتِ شَوْكَةِ الكَتِفْ"],["أُحْدُوبَةٌ دَالِيَّةٌ بِهَا ارْتَكَزْ","وَتَرُهَا وَبَطْنُهَا دِلْتَا بَرَزْ"],["وَعَصَّبَ الدَّالِيَّةَ الإِبْطِيُّ","إِحْفَظْ فَأَنْتَ الحَاذِقُ الذَّكِيُّ"],["وَاحْقِنْ بِهَا فِي قِسْمِهَا العُلْوِيِّ","وَلْتَتَّقِ الإِضْرَارَ بِالإِبْطِيِّ"],["وَلْتَخْفِضَنْ وَالقَدْرُ إِصْبَعَانِ","مِنْ رَأْسِهِ تَكُونُ فِي أَمَانِ"]]],["العَضَلَةُ المُدَوَّرَةُ الكَبِيرَةُ Musculus teres major",50,[["وَقَدْ أَتَتْ فِي إِبْطِنَا (مُدَوَّرَهْ","كَبِيرَةٌ) فِي شَرْحِنَا مُحَرَّرَهْ"],["وَاعْلَمْ بِأَنَّ الارْتِكَازَ جَاءَ فِيْ","عُرْفِ الحُدَيْبَةِ الصَّغِيرَةِ اقْتُفِيْ"],["نَصِيبُهَا فِي مَذْهَبِ الطَّبِيبِ","مِنْ (تَحْتِ كِتْفِيٍّ) مِنَ التَّعْصِيبِ"],["إِنَّ المُدَوَّرَاتِ مِنْ كِتْفِيٍّ","جَا بَدْؤُهَا مِنْ حَرْفِهِ الوَحْشِيِّ"]]],["العَضَلَةُ المُدَوَّرَةُ الصَّغِيرَةُ Musculus teres minor",51,[["وَأُخْتُهَا مِنْ فَوْقِهَا مُقَرَّرَهْ","وَاسْمُهَا الصَّغِيرَةُ المُدَوَّرَهْ"],["تَعْصِيبُهَا قَدْ أَشْبَهَ الدَّالِيَّةْ","وَشَرْحُنَا قَدْ كَشَفَ الخَفِيَّةْ"],["إِنَّ المُدَوَّرَاتِ مِنْ كِتْفِيٍّ","جَا بَدْؤُهَا مِنْ حَرْفِهِ الوَحْشِيِّ"]]],["العَضَلَتَانِ فَوْقَ الشَّوْكَةِ وَتَحْتَهَا Musculus supraspinatus & infraspinatus",52,[["مِنْ فَوْقِ شَوْكَةٍ أَتَتْ وَتَحْتِهَا","الحُفْرَتَانِ أَعْلِمْهُمَا مِنْ اسْمِهَا"],["قَدْ مَثَّلَا مَنَاشِئًا لِلعَضَلَتَيْنِ","فَوْقَ وَتَحْتَ الشَّوْكَةِ المَعْرُوفَتَيْنْ"],["وَإِنَّ (فَوْقَ الكَتِفِيِّ) عَصَّبَهْ","هَاتَيْنِ فَاحْفَظْنَهَا مُرَتَّبَهْ"]]],["ارْتِكَازُ المُدَوَّرَةِ الصَّغِيرَةِ وَفَوْقَ وَتَحْتَ الشَّوْكَةِ",53,[["وَاحْفَظْ بِأَنَّ أَصْغَرَ المُدَوَّرَاتْ","أَضِفْ لَهَا شَوْكِيَّتَيْنِ وَارِدَاتْ"],["عَلَى الحُدَيْبَةِ الكَبِيرَةْ تَرْتَكِزْ","بِحِفْظِكَ الأَبْيَاتَ هَذِي تَحْتَرِزْ"]]],["العَضَلَةُ تَحْتَ الكَتِفِيَّةِ Musculus subscapularis",54,[["وَسَادِسُ العَضْلَاتِ جَا يَقِينَا","مُوَضَّحًا تَفْصِيلُهَا مُبِينَا"],["إِنَّ اسْمَهَا جَا تَحْتَ الكَتِفِيَّةْ","أَمَّا المُعَصَّبُ انْتُبِهْ عَلَيَّةْ"],["تَحْتَ الكَتِفِيِّ السُّفْلِيِّ وَمِنْ","عُلْوِيٍّ إِضَافَةً فَكُنْ فَطِنْ"],["مِنْ حُفْرَةٍ لَهَا اسْمُهَا ذَا المَنْشَأُ","فِي قَعْرِهَا مَكَانُهَا المُبَوَّأُ"],["حُدَيْبَةٌ صَغِيرَةٌ بِهَا تَقَرْ","وَبَطْنُهَا مُثَلَّثِي لِمَنْ نَظَرْ"]]],["عَضَلَاتُ العَضُدِ",55,[["وَالعَضَلُ الَّذِي مِنَ الأَمَامِ","لِلعَضُدِ الثَّلَاثُ فِي التَّمَامِ"],["تَعْصِيبُهَا مِنْ عَضَلِيٍّ جِلْدِيْ","- - - - - - - -"]]],["العَضَلَةُ الغُرَابِيَّةُ العَضُدِيَّةُ Musculus coracobrachialis",56,[["- - - - - - - -","أُولَى غُرَابِوِيَّةٌ لِلْعَضُدِ"],["تَفْصِيلُهَا مِنْ اسْمِهَا ذَا نَعْرِفُ","مِنْ أَجْلِ ذَا بِالعَضُدِيَّةْ نُرْدِفُ"]]],["العَضَلَةُ العَضُدِيَّةُ Musculus brachialis",57,[["العَضُدِيَّةُ الَّتِي بَيَانُهَا","فَصَّلْتُهُ فَقَدْ أَتَتْ أَلْيَافُهَا"],["مِنْ عَضُدٍ مِنْ نِصْفِهِ السُّفْلِيِّ","مِنْ وَجْهِهِ الوَحْشِيِّ وَالإِنْسِيِّ"],["أُحْدُوبَةٌ وَتَرُهَا بِهِ رُكِزْ","زَنْدِيَّةٌ وَشَرْحُنَا رُجِزْ"]]],["العَضَلَةُ ذَاتُ الرَّأْسَيْنِ العَضُدِيَّةُ Musculus biceps brachii",58,[["وَذَاتُ رَأْسَيْنِ بِشَرْحٍ قُرِّرَا","أَوْرَدْتُهُ هُنَا كَمَا قَدْ حُرِّرَا"],["رَأْسٌ قَصِيرٌ قَدْ أَتَى مِنْ مَنْشَأِ","مِنْ زَنْدِنَا مِنَ الغُرَابِيِّ النَّاتِئِ"],["إِنْ تَذْكُرِ الحُدَيْبَةَ الَّتِي عَلَتْ","حِقَّانِيَّ الكَتِفِيِّ قَدْ أَتَتْ"],["أَلْيَافُ رَأْسِهَا الطَّوِيلِ مِنْهَا","وَاحْذَرْ هُدِيتَ أَنْ تَزِيغَ عَنْهَا"],["وَاعْلَمْ بِأَنَّ الارْتِكَازَ قُدِّرَهْ","قَدْ جَاءَ فِي أُحْدُوبَةٍ لِلْكُعْبُرَهْ"]]],["العَضَلَةُ ثُلَاثِيَّةُ الرُّؤُوسِ العَضُدِيَّةُ Musculus triceps brachii",59,[["وَعَضْلَةٌ وَحِيدَةٌ فِي الخَلْفِ","رُؤُوسُهَا ثَلَاثَةٌ فِي الوَصْفِ"],["يَا ذَاكِرًا لِلعَضُدِ الثِّلْمُ ذُكِرْ","مِنْ خَلْفِهِ قَدْ جَا (فَهَلْ مِنْ مُدَّكِرْ)"],["مِنْ تَحْتِ هَذَا يَنْشَأُ الإِنْسِيُّ","وَفَوْقَهُ قَدْ نَشَأَ الوَحْشِيُّ"],["وَيَنْشَأُ الطَّوِيلُ مِنْ حُدَيْبَةْ","مِنْ تَحْتِ حِقَّانِيِّهِ لَا رَيْبَةْ"],["مِنْ كُعْبُرِيْ لَهَا أَتَى التَّعْصِيبُ","مُسْتَدْلِلًا مِنْ ثِلْمِهِ تُصِيبُ"],["جَاوَتَرٌ فِي زَجِّهِ يَرْتَكِزُ","وَقِسْمَةٌ مِنْ دُونِهَا فَتُعْجِزُ"]]],["عَضَلَاتُ المَسْكَنِ الأَمَامِيِّ لِلسَّاعِدِ",61,[["وَفِي أَمَامِ سَاعِدٍ فَالعَضَلَاتْ","تَوَضَّعَتْ فِي ثَالِثِ المُسْتَوَيَاتْ"],["المُسْتَوَى السَّطْحِيِّ وَالَّذِي وَسَطْ","وَالمُسْتَوَى العَمِيقُ خَلْفَهَا فَقَطْ"],["تَعْصِيبُ كُلٍّ نَاصِفٌ بِالرَّصْدِ","إِلَّا اثْنَتَيْنِ عُصِّبَتْ مِنْ زَنْدِيْ"],["وَارِدَةٌ أَسْمَاؤُهَا فَأَصْغِ","قَابِضَةٌ زَنْدِيَّةٌ لِلرُّسْغِ"],["إِنْسِيٌّ أُخْرَى تَقْبِضُ الأَصَابِعَهْ","فِي المُسْتَوَى العَمِيقِ جَاءَتْ وَاقِعَهْ"]]],["المُسْتَوَى الأَمَامِيُّ السَّطْحِيُّ",62,[["المُسْتَوَى السَّطْحِيُّ فِيهِ أَرْبَعُ","مِنْ أَجْلِ حِفْظٍ لِلْمَكَانِ أَوْقِعُوا"],["إِبْهَامَكُمْ خَلْفَ الذِّرَاعِ أَسْفَلَا","أَمَّا البَقِيَّةُ فِي الأَمَامِ تُجْتَلَى"],["أَسْمَاءَهَا أَوْرَدْتُ بِالتَّرْمِيزِ","مِنْ أَجْلِ حِفْظِهَا وَلِلتَّمْيِيزِ"],["كَمْ قَابَلَ الرَّسَّامُ زِلْزَالًا وَقَعْ","بِرَاحَةٍ طَالَتْ وَإِصْبَعٍ سَطَعْ"]]],["العَضَلَةُ الكَابَّةُ المُدَوَّرَةُ Musculus pronator teres",63,[["رَأْسَانِ جَا لِلْكَابَّةِ المُدَوَّرَةْ","وَالِارْتِكَازُ جَاءَ وَحْشِيْ الكُعْبُرَةْ"],["فَرَأْسُهَا العَمِيقُ بِاشْتِهَارِ","نُشُوؤُهُ مِنْ نَاتِئٍ مِنْقَارِيْ"],["وَمَنْشَأُ السَّطْحِيِّ حَسْبَمَا ذُكِرْ","لُقَيْمَةٌ إِنْسِيَّةٌ كَذَا اعْتُبِرْ"],["وَبَيْنَ رَأْسَيْهَا يَمُرُّ النَّاصِفُ","وَالقَوْلُ غَيْرُ ذَا هُوَ المُخَالِفُ"]]],["العَضَلَةُ قَابِضَةُ الرُّسْغِ الكُعْبُرِيَّةُ Musculus flexor carpi radialis",64,[["قَابِضَةٌ لِلرُّسْغِ كُعْبُرِيَّةْ","وَالمَنْشَأُ اللُّقَيْمَةُ الإِنْسِيَّةْ"],["وَالِارْتِكَازُ ثَالِثُ الأَسْنَاعِ","وَثَانِيٌ أَضِفْ بِلَا انْقِطَاعِ"]]],["العَضَلَةُ الرَّاحِيَّةُ الطَّوِيلَةُ Musculus palmaris longus",65,[["جَا مَنْشَأُ الطَّوِيلَةِ الرَّاحِيَّةْ","أَيْضًا مِنَ اللُّقَيْمَةِ الإِنْسِيَّةْ"],["أَمَّا ارْتِكَازُهَا عَلَى السِّفَاقِ","لِرَاحَةٍ يُحْفَظْ مِنَ السِّيَاقِ"]]],["العَضَلَةُ قَابِضَةُ الرُّسْغِ الزَّنْدِيَّةُ Musculus flexor carpi ulnaris",66,[["قَابِضَةٌ زَنْدِيَّةٌ لِرُسْغِنَا","وَاضِحَةٌ بَيَّنْتُهَا بِشَرْحِنَا"],["مَنَاشِئُ الرَّأْسَيْنِ هَا قَدْ سُقْتُهَا","عَلَى التَّوَالِي هَاهُنَا ضَمَّنْتُهَا"],["لُقَيْمَةٌ إِنْسِيَّةٌ لِلْعَضُدِ","ثُلْثَانِ مِنْ أَعْلَى بِخَلْفِ الزَّنْدِ"],["وَبَيْنَ رَأْسَيْهَا أَتَى مُجْتَازَا","زَنْدِيٌّ وَإِنَّ الارْتِكَازَا"],["فِي الكُلَّابِيِّ الحِمَّصِيِّ وَالسِّنْعِ","ذُو تَرْتِيبٍ خَامِسٍ بِالجَمْعِ"]]],["الطَّبَقَةُ الأَمَامِيَّةُ المُتَوَسِّطَةُ — قَابِضَةُ الأَصَابِعِ السَّطْحِيَّةُ Musculus flexor digitorum superficialis",67,[["وَاعْلَمْ بِأَنَّ الوُسْطَى قَدْ تَفَرَّدَتْ","بِالعَضَلَةِ السَّطْحِيَّةِ الَّتِي ثَنَتْ"],["أَصَابِعًا، جَا مَنْشَأُ الرَّأْسَيْنِ","مِنْ أَعْظُمٍ ثَلَاثَةٍ لَا مَيْنِ"],["العَضُدِيُّ الزَّنْدِيُّ رَأْسُ","وَالكُعْبُرِيُّ بَيْنَ ذَيْنِ قَوْسُ"],["قَدْ مَرَّ فِيهِ نَاصِفٌ ذَا عَصَبُ","زَنْدِيْ مِنَ الشَّرْيَانِ أَيْضًا حَسَبُوا"],["مَنَاشِئُ الرَّأْسَيْنِ ذِي لِمَنْ وَعَى","كَمَا أَتَتْ أَوْرَدْتُهَا تَتَابُعَا"],["(لُقَيْمَةٌ إِنْسِيَّةٌ وَمِنْقَرِيْ)","(مِنْ حَافَةِ الأَمَامِ) جَاءَ الكُعْبُرِيْ"],["فِي وُسْطَى السُّلَامَيَاتِ تَرْتَكِزْ","لِأَنَّهَا فِي طَبَقَةٍ وُسْطَى فَمِزْ"]]],["الطَّبَقَةُ الأَمَامِيَّةُ العَمِيقَةُ",69,[["فِي المُسْتَوَى العَمِيقِ قَابِضَاتُ","ثَلَاثَةٌ بِالشَّرْحِ بَيِّنَاتُ"],["رَمَزْتُهَا لِلْحِفْظِ وَالتَّسْهِيلِ","حَتَّى تَصِيرَ سَهْلَةَ التَّحْصِيلِ"],["كَالمَرْءِ قَاسَى أَصْرَمَ الأَعْمَالِ","يَأْبَى طَوِيلَ العَوْزِ وَالإِذْلَالِ"]]],["العَضَلَةُ قَابِضَةُ الأَصَابِعِ العَمِيقَةُ Musculus flexor digitorum profundus",70,[["أُخْرَى أَتَتْ مُخْتَصَّةً بِقَبْضِ","أَصَابِعِ اليَدِ أَتَتْ بِعُمْقِ"],["وَالمَنْشَأُ الزَّنْدُ مِنَ العِظَامِ","مِنْ وَجْهِهِ الإِنْسِيِّ وَالأَمَامِيْ"],["قَدْ ثُبِّتَتْ فِي أَرْبَعِ الأَصَابِعِ","فِي أَبْعَدِ السُّلَامَيَاتِ فَلْتَتَّبِعْ"]]],["العَضَلَةُ قَابِضَةُ الإِبْهَامِ الطَّوِيلَةُ Musculus flexor pollicis longus",71,[["قَابِضَةٌ إِبْهَامَنَا الطَّوِيلَةْ","مَنْشَؤُهَا احْفَظْهُ بِأَيِّ حِيلَةْ"],["كُعْبُرَةٌ مِنْ وَجْهِهَا الأَمَامِيْ","وَمِنْ غِشَاءٍ وَاصِلِ العِظَامِ"],["وَالِارْتِكَازُ أَبْعَدُ السُّلَامَيَاتْ","لِتَحْفَظَنَّ شَرْحَهَا قَبْلَ الفَوَاتْ"]]],["العَضَلَةُ الكَابَّةُ المُرَبَّعَةُ Musculus pronator quadratus",72,[["أَمَّا مَكَانُ الكَابَّةِ المُرَبَّعَةْ","فَبَيْنَ عَظْمَيْ سَاعِدٍ مُوَضَّعَةْ"],["وَتَنْشَأُ الأَلْيَافُ مِنْ زَنْدٍ جَلِيْ","أَمَامُهُ مِنْ رُبْعِهِ فِي الأَسْفَلِ"],["وَإِنَّ فِي الكُعْبُرَةِ ارْتِكَازَهَا","أَمَامَهَا مِنْ رُبْعِهَا أَسْفَلَهَا"]]],["عَضَلَاتُ المَسْكَنِ الخَلْفِيِّ لِلسَّاعِدِ",73,[["وَالبَاسِطَاتُ كُلُّهَا مُعَصَّبَةْ","مِنْ كُعْبُرِيٍّ، قَدْ أَتَتْ مُرَتَّبَةْ"],["مَجْمُوعَتَيْنِ هَكَذَا قَدْ صُنِّفَتْ","خَلْفِيَّةٌ وَحْشِيَّةٌ، وَقُسِّمَتْ"],["خَلْفِيَّةٌ لِلْمُسْتَوَى العَمِيقِ","وَالمُسْتَوَى السَّطْحِيِّ يَا صَدِيقِي"]]],["المَجْمُوعَةُ الخَلْفِيَّةُ — المُسْتَوَى السَّطْحِيُّ",74,[["وَكُلُّ مَا فِي المُسْتَوَى السَّطْحِيِّ","خَلْفًا فَمِنْ لُقَيْمَةِ الوَحْشِيِّ"],["نُشُوؤُهُ، ذَكَرْتُ ذَا مُقَرَّبَا","لَا تَنْسَ أَنَّ الكُعْبُرِيْ مُعَصَّبَا"],["حَتَّى تَصِيرَ سَهْلَةً رَمَزْتُهَا","فِي كَلِمِ هَذَا البَيْتِ قَدْ ضَمَّنْتُهَا"],["قَدْ مَرَّ بِالسُّوقِ الأَصَمُّ خَائِفَا","رُسُوبَ زَاهِي بِالدُّعَاءِ عَاكِفَا"]]],["العَضَلَةُ بَاسِطَةُ الأَصَابِعِ Musculus extensor digitorum",75,[["مُرْتَكَزُ البَاسِطَةِ الأَصَابِعِ","سُلَامَيَاتُ الأَرْبَعِ الأَصَابِعِ"]]],["العَضَلَةُ بَاسِطَةُ الخِنْصَرِ Musculus extensor digiti minimi",76,[["أَمَّا الَّتِي اخْتِصَاصُهَا بِالبَسْطِ","لِخِنْصَرٍ بِهَا حُصُولُ خَلْطِ"],["لِلِيفِهَا بِالاتِّحَادِ الوَاقِعِ","مَعْ وَتَرِ البَاسِطَةِ الأَصَابِعِ"]]],["العَضَلَةُ بَاسِطَةُ الرُّسْغِ الزَّنْدِيَّةُ Musculus extensor carpi ulnaris",77,[["بَاسِطَةٌ زَنْدِيَّةٌ لِلرُّسْغِ","فِي خَامِسِ الأَسْنَاعِ جَا فَأَصْغِ"],["مُرْتَكَزٌ، مِنْ اسْمِهَا جَاءَ العَمَلْ","مِنْ دُونِ تَطْوِيلٍ يَجِيءُ بِالمَلَلْ"],["وَالمَنْشَأُ اللُّقَيْمَةُ الوَحْشِيَّةْ","وَخَلْفَ زَنْدٍ جَاءَ بِالمَعِيَّةْ"]]],["العَضَلَةُ المِرْفَقِيَّةُ Musculus anconeus",78,[["وَمِرْفَقِيَّةٌ مِنَ العَضْلَاتِ","وَشَكْلُهَا مُثَلَّثِيٌّ آتِي"],["قَدْ ثُبِّتَتْ فِي الزَّنْدِ وَالزَّجِّيِّ","أَلْيَافُهَا فِي وَجْهِهَا الخَلْفِيِّ"]]],["المَجْمُوعَةُ الخَلْفِيَّةُ العَمِيقَةُ",79,[["ثَانِيهِمَا المَجْمُوعَةُ العَمِيقَةْ","أُنَبِّيكَ مَا فِيهَا خُذِ الحَقِيقَةْ"],["أَسْمَاؤُهَا أَيْضًا فَقَدْ رَمَزْتُهَا","فِي كَلِمِ هَذَا البَيْتِ قَدْ ضَمَّنْتُهَا"],["بَانَ أَبُو طَوْنِي يَقُصُّ السَّبَبَا","مُبْتَسِمًا أَبُو طَوْنِي شَجَبَا"]]],["العَضَلَةُ مُبْعِدَةُ الإِبْهَامِ الطَّوِيلَةُ Musculus abductor pollicis longus",80,[["مُبْعِدَةٌ طُولَى لِلْإِبْهَامِ","مَنْشَؤُهَا احْفَظْهُ بِلَا انْثِلَامِ"],["كُعْبُرَةٌ زَنْدٌ غِشَاءٌ بَيْنِيْ","مِنْ وَجْهِهَا الخَلْفِيِّ دُونَ مَيْنِ"],["وَحْشِيُّ سِنْعٍ فِي المَكَانِ الأَوَّلِ","حَطَّتْ بِهِ وَالبَطْنُ شِبْهُ المِغْزَلِ"]]],["العَضَلَةُ بَاسِطَةُ الإِبْهَامِ القَصِيرَةُ Musculus extensor pollicis brevis",81,[["بَاسِطَةٌ إِبْهَامَنَا القَصِيرَهْ","مَنْشَؤُهَا اقْرَأْهُ بِدُونِ حِيرَهْ"],["كُعْبُرَةٌ وَمِنْ غِشَاءٍ مَاثِلِ","بَيْنَ العِظَامِ رَابِطٍ وَوَاصِلِ"],["مِنْ وَجْهِهِ الخَلْفِيِّ ذَاكَ قَدْ قُصِدْ","وَقِسْ عَلَى البَقِيَّةِ الَّتِي تَرِدْ"],["وَالِارْتِكَازُ فِي السُّلَامَى الدَّانِيَةْ","وَمَا أَتَى فِي الشَّرْحِ بَعْدُ بَاقِيَةْ"]]],["العَضَلَةُ بَاسِطَةُ الإِبْهَامِ الطَّوِيلَةُ Musculus extensor pollicis longus",82,[["بَاسِطَةٌ لِلْإِبْهَامِ طُولَى","مَنْشَؤُهَا كَمَا أَتَى مَنْقُولَا"],["زَنْدٌ غِشَا بَيْنَ العِظَامِ الوَارِدَهْ","وَالِارْتِكَازُ فِي السُّلَامَى البَاعِدَهْ"]]],["العَضَلَةُ بَاسِطَةُ السَّبَّابَةِ Musculus extensor indicis",83,[["بَاسِطَةٌ لِلْإِصْبَعِ الثَّانِي لَهَا","دَوْرٌ إِضَافِيٌّ يُقَوِّي بَسْطَهَا"],["بِمَنْشَأٍ مِنَ الغِشَاءِ الوَاصِلِ","وَالزَّنْدِ خَلْفًا مِنْ مَكَانٍ سَافِلِ"],["وَتَرُهَا جَا بِاتِّحَادٍ وَاقِعِ","بِوَتَرِ البَاسِطَةِ الأَصَابِعِ"]]],["المَجْمُوعَةُ الخَلْفِيَّةُ الوَحْشِيَّةُ",84,[["مَجْمُوعَةٌ وَحْشِيَّةٌ بِهَا دَخَلْ","فِي عَدِّهَا أَرْبَعَةٌ مِنَ العَضَلْ"]]],["العَضَلَةُ البَاسِطَةُ (الِاسْتِلْقَائِيَّةُ) Musculus supinator",85,[["أُولَاهَا بَاسِطَةٌ وَالفِعْلُ هُوْ","اسْتِلْقَاءُ سَاعِدٍ لَا كَبُّهُ"],["نُشُوؤُهَا يَكُونُ مِنْ رَأْسَيْنِ","وَيَنْشَأُ الرَّأْسَانِ مِنْ عَظْمَيْنِ"],["فَرَأْسُهَا السَّطْحِيُّ مِنْ لُقَيْمَهْ","فِي الجَانِبِ الوَحْشِيِّ ذِي مُقِيمَهْ"],["أَمَّا العَمِيقُ جَا مِنْ حُفْرَةٍ لَهَا","فِي زَنْدِنَا أَضِفْ إِلَيْهِ عُرْفَهَا"],["وَفِي أَمَامِ الكُعْبُرَةِ ارْتِكَازُ ذَيْنْ","لَا تَرْجِعَنَّ بَعْدُ مَعْ خُفَّيْ حُنَيْنْ"],["فَرَأْسُهَا العَمِيقُ حَطَّ فَاعْلَمِ","فِي عُنُقِهَا بِالِارْتِكَازِ المُحْكَمِ"],["وَرَأْسُهَا السَّطْحِيُّ بِانْجِزَامِ","فِي حَافَّةٍ لَهَا مِنَ الأَمَامِ"]]],["العَضَلَةُ بَاسِطَةُ الرُّسْغِ الكُعْبُرِيَّةُ الطَّوِيلَةُ Musculus extensor carpi radialis longus",87,[["وَبَعْدَهَا اللَّتَانِ تَبْسُطَانِ","بِالرُّسْغِ تَيْنِ كُعْبُرِيَّتَانِ"],["تِبْعًا لِأَطْوَالٍ لَهَا تُصَنَّفُ","طَوِيلَةٌ قَصِيرَةٌ تُعَرَّفُ"],["وَالفِعْلُ تَبْعِيدٌ وَبَسْطٌ فَالْحَظَا","وَهَاكَ ذَا شَرْحُ الطَّوِيلَةِ احْفَظَا"],["مِنْ وَحْشِيِّ عَضُدٍ سَتَبْدَأُ","مِنْ عُرْفِ أَعْلَى اللُّقَيْمَةِ تَنْشَأُ"],["قَاعِدَةُ الثَّانِي مِنَ الأَسْنَاعِ","بِهَا ارْتِكَازُ الوَتْرِ بِالإِجْمَاعِ"]]],["العَضَلَةُ بَاسِطَةُ الرُّسْغِ الكُعْبُرِيَّةُ القَصِيرَةُ Musculus extensor carpi radialis brevis",88,[["وَاعْلَمْ بِأَنَّ مَنْشَأَ القَصِيرَةِ","حَتْمًا مِنَ اللُّقَيْمَةِ الوَحْشِيَّةِ"],["وَالِارْتِكَازُ جَاءَ خَلْفَ القَاعِدَهْ","لِثَالِثِ الأَسْنَاعِ فَهْيَ عَائِدَهْ"]]],["العَضَلَةُ العَضُدِيَّةُ الكُعْبُرِيَّةُ Musculus brachioradialis",89,[["(العُضْدِيَّةُ) اسْمُهَا أَضِفْ لَهُ","(الكُعْبُرِيَّةُ) اجْمَعَنَّ نِصْفَهُ"],["مِنْ وَحْشِيِّ عَضُدٍ سَتَبْدَأُ","مِنْ عُرْفِ أَعْلَى اللُّقَيْمَةِ تَنْشَأُ"],["مِنْ فَوْقِ مَنْشَأٍ أَتَى بِالذِّكْرِ","وَالِارْتِكَازُ فِي النُّتُوءِ الإِبْرِيِّ"]]],["عَضَلَاتُ الإِبْهَامِ (الرَّانِفَةُ أَوْ أَلْيَةُ اليَدِ) Thenar muscles",90,[["عَضَلَاتُ إِبْهَامٍ لَنَا أَوْ رَانِفَهْ","تَعْصِيبُهَا مِنْ نَاصِفٍ مُخَالِفَهْ"],["تَعْصِيبَ مَنْ تُقَرِّبُ الإِبْهَامَا","بِلِيفِهَا الزَّنْدِيُّ قَدْ أَقَامَا"],["مُبْعِدَةٌ قَصِيرَةٌ لِلْإِبْهَامِ","تُحَرِّكُ الإِبْهَامَ لِلْأَمَامِ"],["مُقَرِّبَةٌ تُرْجِعُ لِلْوَرَاءِ","مُقَابِلَةٌ لِلَقْطِ الأَشْيَاءِ"],["أَضِفْ لَهَا مَنْ تَقْبِضُ الإِبْهَامَا","تَثْنِيهِ بَيْنَ السِّنْعِ وَالسُّلَامَى"]]],["عَضَلَاتُ الخِنْصَرِ (ضُرَّةُ اليَدِ) Hypothenar muscles",91,[["أَمَّا الَّذِي لِلْإِصْبَعِ الصَّغِيرِ","أَوْ ضُرَّةٍ شَرَحْتُ لِلنِّحْرِيرِ"],["تَعْدَادُهَا ثَلَاثَةٌ بِالعَدَدِ","تَعْصِيبُهَا جَمِيعِهَا مِنْ زَنْدِي"],["قَابِضَةٌ لِخِنْصَرٍ، مُبَاعِدَهْ","مُقَابِلَةٌ لَهُ عَلَيْهَا زَائِدَهْ"]]]]},
{b:"فصل الأوعية · Vessels · Tubuh Atas",p:[["مُقَدِّمَةُ فَصْلِ الأَوْعِيَةِ",94,[["حَتَّى يُمَدَّ جِسْمُنَا بِالتَّرْوِيَهْ","لَا بُدَّ مِنْ قَلْبٍ لَهُ وَأَوْعِيَهْ"],["تَفَرَّعَتْ فِي الجِسْمِ كَالْأَغْصَانِ","وَبَدْؤُهَا مِنْ أَوْحَدِ الشِّرْيَانِ"],["وَذَا الوِعَاءُ سَمِّهِ بِالْأَبْهَرِ","مُنْبَثِقٌ مِنَ البُطَيْنِ الْأَيْسَرِ"],["وَبَعْدَ ذَا لِقَوْسِهِ يُشَكَّلُ","أَقْسَامُهُ ثَلَاثَةٌ وَتَشْمُلُ"],["العَضُدِيُّ الرَّأْسِيُّ الجِذْعُ","مِنَ اليَمِينِ جَاءَ مِنْهُ الوَقْعُ"],["وَبَعْدُ تَحْتَ التَّرْقُوَةِ اليَسَارِي","ثُمَّ السُّبَاتِيِّ الأَصْلِيِّ الجَارِي"],["وَقَدْ أَتَى لِجِذْعِهِ فَرْعَانِ","مُنَاظِرٌ أَسْمَاءَهَا القِسْمَانِ"],["وَهِيَ تَحْتَ التَّرْقُوَةِ اليَمِينِي","حَذْوَ السُّبَاتِيِّ الأَصْلِيِّ المُبِينِ"]]],["تَفْصِيلٌ بَسِيطٌ عَنْ شَرَايِينِ الطَّرَفِ العُلْوِيِّ",95,[["مِنْ تَحْتِ تَرْقُوَةٍ هُنَا سَنَبْدَأُ","وَذِكْرُ تَفْصِيلِ الفُرُوعِ يُرْجَأُ"],["فَبَعْدَ ضِلْعٍ أَوَّلٍ صَارَ اسْمُهُ","إِبْطِيًّا وَبَعْدَهُ جَا قِسْمُهُ"],["العُضْدِيْ مِنْ آخِرِ المُدَوَّرَهْ","الكُبْرَى وَعِنْدَ عُنُقِ الكُعْبُرَهْ"],["يُسْرَى انْقِسَامُهُ إِلَى زَنْدِيِّ","وَفَرْعِهِ الصَّغِيرِ كُعْبُرِيِّ"]]],["الشَّرْيَانُ الإِبْطِيُّ Arteria axillaris",96,[["صَدْرِيَّةٌ صُغْرَى بِهَا تَوَسَّمَا","شَرْيَانُنَا الإِبْطِيُّ، قَدْ تَقَسَّمَا"],["فَأَوَّلُ الأَقْسَامِ جَاءَ قَبْلَهَا","وَقِسْمُهُ الثَّانِي يَكُونُ خَلْفَهَا"],["وَثَالِثٌ مِنْ بَعْدِهَا يَقِينَا","مُوَضِّحٌ فُرُوعَهَا مُبِينَا"],["مِنْ أَوَّلِ الأَقْسَامِ فَرْعٌ لَا عَدِيدْ","صَدْرِيَّةُ العُلْوِيُّ فَرْعُهُ الوَحِيدْ"],["صَدْرِيَّةٌ مِنْ أَخْرَمِيٍّ وَحْشِيْ","مِنْ ثَانِي بِعَضَلَةٍ قَدْ غُشِّيْ"],["هَاكَ فُرُوعَ ثَالِثِ الأَقْسَامِ","(العَضُدِيْ المُنْعَطِفِ الأَمَامِيْ)"],["وَ(مِثْلُهُ الخَلْفِيْ) فِي المُرَبَّعَهْ","مُرُورُهُ بِهَا مُقَدَّرٌ مَعَهْ"],["العَصَبُ الإِبْطِيُّ ذَا رَفِيقُهُ","وَ(تَحْتَ كَتِفِيٍّ) أَتَتْ فُرُوعُهُ"],["مُنْعَطَفٌ لِلْكَتِفِيِّ مَارِرُ","بِفُسْحَةٍ مُثَلَّثَةٍ وَالآخَرُ"],["صَدْرِيَّةُ الظَّهْرِيُّ جَاءَ فَاعْلَمِ","عَنْ حِفْظِهَا وَفَهْمِهَا لَا تُحْجِمِ"]]],["الشَّرْيَانُ العَضُدِيُّ Arteria brachialis",99,[["وَالعَضُدِيُّ وَاقِعٌ لِلإِنْسِيْ","مِنَ الذِّرَاعِ وَاضِحٌ بِالجَسِّ"],["فُرُوعُهُ ثَلَاثَةٌ فِي الجَانِبِ","فَلَا تَكُنْ عَنْ شَرْحِهَا بِرَاغِبِ"],["(العَضُدِيْ العَمِيقُ) مِنْ فُرُوعِهِ","مُرَافِقٌ فِي الخَلْفِ فِي مُرُورِهِ"],["الكُعْبُرِيُّ العَصَبُ المُوَضَّحُ","فِي فَصْلِ العِظَامِ ذَا مُصَرَّحُ"],["فُرُوعُهُ الدَّالِيُّ وَالأَمَامِيْ","أَضِفْ لَهَا الخَلْفِيَّ بِانْجِزَامِ"],["وَآخِرُ اثْنَيْنِ اسْمُهَا لِنِسْبَةِ","مَنْ مَرَّ مِنْ لُقَيْمَةٍ وَحْشِيَّةِ"],["لُقَيْمَةٌ إِنْسِيَّةٌ شَرَحْتُهَا","وَشَرْحُنَا هُنَا مُعَلَّقٌ بِهَا"],["(فَالجَانِبِيُّ الزَّنْدِيُّ العَالِيْ)","مِنْ خَلْفِهَا مُرُورُهُ بِحَالِ"],["مِنَ التَّفَاغُرِ الَّذِي مَعْ رَاجِعِ","زَنْدِيٍّ خَلْفِيٍّ، الشُّرُوحَ تَابِعْ"],["(وَالجَانِبِيُّ الزَّنْدِيُّ السَّافِلُ)","إِذْ مِنْ أَمَامِهَا المُرُورُ حَاصِلُ"],["وَنَاصِفُ الأَعْصَابِ مَعْهُ قَدْ جُعِلْ","مَعْ رَاجِعٍ زَنْدِيْ أَمَامِيْ يَتَّصِلْ"],["وَامْنَحْ جَمِيعَ ذِي الفُرُوعِ حَظَّهَا","حِفْظًا وَفَهْمًا لَا تُقَلِّلْ شَأْنَهَا"]]],["الشَّرْيَانُ الكُعْبُرِيُّ Arteria radialis",103,[["وَاعْلَمْ بِفَرْعِ العَضُدِيِّ الأَصْغَرِي","وَاجْزِمْ بِأَنَّهُ يُسَمَّى كُعْبُرِي"],["وَمِنْ أَمَامِ الكَابَّةِ المُدَوَّرَهْ","مِنْ رَأْسِهَا السَّطْحِيِّ قُرْبَ الكُعْبُرَهْ"],["شَرْيَانُنَا ذَا مَارِرٌ مِنْ فَوْقِهِ","مُتَابِعٌ مَسِيرَهُ مِنْ بَعْدِهِ"],["وَجَاءَ فِي وَحْشِيِّهِ مُرَافِقَا","الكُعْبُرِيَّ العَصَبَ المُوَافِقَا"],["إِنْسِيُّهُ فِي قِسْمِهِ البَعِيدِ","مَنْ تَقْبِضُ الرُّسْغَ وَبِالتَّحْدِيدِ"],["الكُعْبُرِيَّةُ الَّتِي شَرَحْتُ","وَذِكْرُهَا مَضَى وَقَدْ أَفَضْتُ"],["يَلْتَفُّ بَعْدُ لِلْوَرَا حَتَّى يَصِيرْ","فِي مِسْعَطٍ تَجُسُّهُ يَدُ الخَبِيرْ"]]],["فُرُوعُ الشَّرْيَانِ الكُعْبُرِيِّ",104,[["فُرُوعُهُ قَدْ سُقْتُهَا بِالْعَدْلِ","لِتَعْرِفَنَّهَا بِلَحْنِ قَوْلِي"],["(فَقَوْسُهُ الرَّاحِيَّةُ العَمِيقَهْ)","مِنْ كُعْبُرِيْ وَهَذِهِ الحَقِيقَهْ"],["سِنْعِيَّةٌ رَاحِيَّةٌ تَفَرَّعَتْ","مِنْ هَذِهِ القَوْسِ الَّتِي تَشَكَّلَتْ"],["(رَاحِيُّهُ السَّطْحِيُّ) فَرْعُ الكُعْبُرِيْ","وَلْتَنْتَبِهْ إِذْ لَيْسَ قَوْسًا فَاحْذَرِ"],["وَاثْنَانِ جَاءَ اسْمُهُمَا الجَلِيُّ","رُسْغِيُّهُ (الرَّاحِيُّ) وَ(الظَّهْرِيُّ)"],["مَعْ أَفْرُعِ الزَّنْدِيْ الَّتِي تُقَابِلُ","أَقْوَاسُ رُسْغِنَا بِهَا تُشَكَّلُ"],["وَ(كُعْبُرِيٌّ رَاجِعٌ) حَقِيقِيْ","قَدِ الْتَقَى بِالعَضُدِيْ العَمِيقِ"],["أَضِفْ لَهَا (الأَصْلِيَّ لِلإِبْهَامِ)","أَوِ الرَّئِيسِيْ صَحَّ مِنْ أَسَامِيْ"],["وَ(كُعْبُرِيُّ الإِصْبَعِ المُرَقَّمِ","بِثَانِي) أَيْضًا أَتَى لِتَعْلَمِ"]]],["الشَّرْيَانُ الزَّنْدِيُّ Arteria ulnaris",106,[["وَاعْلَمْ بِفَرْعِ العَضُدِيِّ الثَّانِيْ","وَضَّحْتُهُ عَدْلًا بِلَا نُقْصَانِ"],["زَنْدِيٌّ هُوَ اسْمُهُ لِلْمُقْتَفِينْ","بَيَّنْتُهُ فَلَا تَكُونُوا سَامِدِينْ"],["فِيْ المَسْكَنِ السَّطْحِيْ الأَمَامِيْ غَارَا","مِنْ تَحْتِهَا هَذَا الأَخِيرُ سَارَا"],["وَبَعْدَهُ بَيْنَ اللَّتَيْنِ تَقْبِضَانْ","أَصَابِعَ اليَدِ هُمَا مَعْرُوفَتَانِ"],["إِنْسِيُّهُ فِي قِسْمِهِ البَعِيدِ","مَنْ تَقْبِضُ الرُّسْغَ وَبِالتَّحْدِيدِ"],["زَنْدِيَّةٌ وَشَرْحُهَا مَحْفُوظُ","وَجَسُّ نَبْضِهِ هُنَا مَلْحُوظُ"]]],["فُرُوعُ الشَّرْيَانِ الزَّنْدِيِّ",107,[["زَنْدِيُّنَا فُرُوعُهُ عَدِيدَهْ","وَشَرْحُنَا قَدْ قَرَّبَ البَعِيدَهْ"],["(القَوْسُ الرَّاحِيَّةُ السَّطْحِيَّةْ)","مِنْهَا الأُصْبُعِيَّةُ الرَّاحِيَّهْ"],["(رَاحِيُّهُ العَمِيقُ) قَدْ تَفَاغَرَهْ","مَعْ قَوْسِ كُعْبُرِي تَكُونُ غَائِرَهْ"],["وَاثْنَانِ جَاءَ اسْمُهُمَا الجَلِيُّ","رُسْغِيُّهُ (الرَّاحِيُّ) وَ(الظَّهْرِيُّ)"],["تَقَابَلَتْ مَعْ أَفْرُعٍ لِلْكُعْبُرِيْ","تَشَكَّلَتْ أَقْوَاسُ رُسْغٍ فَاذْكُرِ"],["(الرَّاجِعُ الزَّنْدِيْ الأَمَامِيْ) قَدْ ذُكِرْ","وَ(مِثْلُهُ الخَلْفِيْ) جَا وَقَدْ حُبِرْ"],["أَضِفْ لَهَا (بَيْنَ العِظَامِ المُشْتَرَكْ)","بِحِفْظِهَا تَحِيدُ عَنْ دَرْبِ الحَلَكْ"]]],["أَمَاكِنُ جَسِّ النَّبْضِ فِي الطَّرَفِ العُلْوِيِّ",109,[["أَمَاكِنُ الجَسِّ الَّتِي قَدْ يُشْعَرُ", "بِنَبْضِهَا عِنْدَ الأَنَامِ تُذْكَرُ"], ["بِدَايَةً يُجَسُّ نَبْضُ الإِبْطِيْ", "مِنْ (حُفْرَةٍ إِبْطِيَّةٍ) بِالضَّبْطِ"], ["وَالعَضُدِيُّ مِنْ مَكَانَيْنِ يُجَسْ", "(إِنْسِيْ الذِّرَاعِ) أَوَّلًا مِنْهُ يُحَسْ"], ["إِضَافَةً (لِحُفْرَةٍ فِيْ المِرْفَقِ)", "فَجَرِّبَنَّ جَسَّهُ وَلْتَثِقِ"], ["((وَحْشِيْ اللَّتَيْنِ تَقْبِضَانِ الرُّسْغَا", "فِيْ قِسْمِهَا البَعِيدِ)) نَبْضٌ يُصْغَى"], ["يَعُودُ لِلزَّنْدِيْ مِنَ الشَّرْيَانِ", "وَالكُعْبُرِيْ مِنْ سَاعِدِ الإِنْسَانِ"], ["وَالجَسُّ مِنْ (مَنْشَقَّةِ المُشَرِّحِينْ)", "أَوْ مِسْعَطٍ هُوَ اسْمُهُ لِلذَّاكِرِينْ"]]]]},
{b:"فصل الأعصاب · Nerves · Tubuh Atas",p:[["الضَّفِيرَةُ العَضُدِيَّةُ Brachial plexus", 112, [["العَضُدِيَّةُ مِنَ الضَّفَائِرِ", "أَوْرَدْتُهَا إِلَى أُولِي البَصَائِرِ"], ["قَدْ قُسِّمَتْ إِلَى الجُذُورِ وَالجُذُوعْ", "إِلَى انْقِسَامَاتِ حِبَالٍ وَالوُقُوعْ"], ["جَا فِي المُثَلَّثِ الَّذِي يَعُودُ", "لِعُنُقِنَا مِنَ الوَرَا مَوْجُودُ"], ["تَعْصِيبُهَا فِي طَرَفٍ لِجِلْدِهِ", "إِضَافَةً لِلْعَضَلِ الَّذِي بِهِ"]]],["مَرْحَلَةُ الجُذُورِ", 113, [["وَأَوَّلُ المَرَاحِلِ المُشَرَّحَهْ", "هِيَ الجُذُورُ هَا هُنَا مُوَضَّحَهْ"], ["مِنَ اتِّحَادٍ لِلفُرُوعِ فَاعْلَمُوا", "بَطْنِيَّةٌ أَعْصَابُهَا تُرَقَّمُ"], ["مِنْ خَامِسٍ رَقَبِيْ وَحَتَّى الثَّامِنِ", "وَأَوَّلٌ صَدْرِيْ لَهَا مُضَامِنِ"], ["مِنْهَا تَفَرَّعَ الطَّوِيلُ الصَّدْرِيْ", "أَضِفْ إِلَيْهِ الكَتِفِيَّ الظَّهْرِيْ"]]],["مَرْحَلَةُ الجُذُوعِ", 114, [["تُشَكِّلُ الجُذُوعُ فِيهَا مَرْحَلَهْ", "مَعْرُوفَةً {وَالمُنْكِرُ انْصُرْ عَاذِلَهْ}"], ["أَتَى فُرُوعُ (جِذْعِهَا العُلْوِيِّ)", "مِنْ خَامِسٍ وَسَادِسٍ رَقَبِيِّ"], ["فُرُوعُهُ مِنْ فَوْقِ الكَتِفِيِّ", "إِضَافَةً لِتَحْتِ التَّرْقُوِيِّ"], ["(وَجِذْعُهَا الوَسِيطُ) فِيهَا رُفِدَا", "مِنْ رَقَبِيٍّ سَابِعٍ مُنْفَرِدَا"], ["وَ(جِذْعُهَا السُّفْلِيُّ) قَدْ تَشَكَّلَا", "مِنْ رَقَبِيٍّ ثَامِنٍ وَمَنْ تَلَا"]]],["مَرْحَلَةُ الانْقِسَامَاتِ وَالحِبَالِ", 115, [["إِنَّ انْقِسَامَ كُلِّ جِذْعٍ قُدِّرَا", "إِلَى انْقِسَامٍ فِي الأَمَامِ وَالوَرَا"], ["مِنَ انْقِسَامٍ لِلْجُذُوعِ بَطْنِيْ", "الأَوْسَطُ العُلْوِيْ مَعًا فِي الشَّأْنِ"], ["فَشَكَّلَا (وَحْشِيَّةً) مِنَ الحُزَمْ", "وَالسُّفْلِيْ (إِنْسِيَّةً)⁽¹⁾ بِذَا احْكَمْ"], ["مِنَ انْقِسَامٍ لِلْجُذُوعِ ظَهْرِيْ", "تَشَكَّلَتْ (خَلْفِيَّةً) بِقَدْرِ"]]],["مَرْحَلَةُ الفُرُوعِ النِّهَائِيَّةِ", 116, [["أَمَّا فُرُوعُهَا الَّتِي فِي الجَانِبِ", "وَفِي الأَخِيرِ هَاكَهَا يَا صَاحِبِي"], ["(فَحَبْلُهَا الإِنْسِيْ) مِنَ الحِبَالِ", "فُرُوعَهُ بَيَّنْتُ فِي مَقَالِيْ"], ["لِتَحْفَظَنَّهَا مِنَ الزَّنْدِيِّ", "وَنَاصِفٌ بِفَرْعِهِ الإِنْسِيِّ"], ["أَمَّا الفُرُوعُ الجَانِبِيَّةُ تُحْسَبُ", "صَدْرِيُّهُ الإِنْسِيْ هُوَ ا ["الرُّصْغُ Tarsus", 61, [["الأَعْظُمُ الَّتِي تَخُصُّ الرُّصْغَا", "سَبْعٌ وَشَرْحُنَا لَهَا قَدْ سَبُغَا⁽¹⁾"], ["كَكَاحِلٍ وَعَقِبٍ وَقَارِبِيْ", "وَقُرْبَ إِسْفِينِيَّةٍ مُكَعَّبِيْ"], ["انْتَظَمَتْ مَجْمُوعَتَيْنِ، وَاقْتَحِمْ", "بَيْنَهُمَا عَظْمٌ بِجَانِبِ القَدَمْ"]]],

["الكَاحِلُ (القَعْبُ) Talus", 62, [["فَعَظْمَةُ الكَاحِلِ تَعْلُو الكُلَّا", "وَاتَّخَذَتْ كَالحَلَزُونِ شَكْلَا"], ["وَقَدْ رَأَوْا أَنَّ ارْتِكَازَ العَضَلِ", "عَلَى سُطُوحِ هَذِهِ لَمْ يَحْصُلِ"], ["أَجْزَاؤُهَا الثَّلَاثَةُ المُحْتَسَبَهْ", "رَأْسٌ وَجِسْمٌ يَحْصُرَانِ رَقَبَهْ"], ["فَالرَّأْسُ فِي الأَمَامِ قَدْ تَرَكَّبَا", "بِالزَّوْرَقِيِّ بَعْدَمَا تَقَبَّبَا"], ["وَالعَقِبُ المَعْرُوفُ ذُو تَمَفْصُلِ", "عَبْرَ وُجَيْهَيْنِ بِهِ فِي الأَسْفَلِ"], ["وَالعُنُقُ القَصِيرُ يَحْوِي تَلَمَا", "فِي وَجْهِهِ السُّفْلِيِّ حَيْثُ بَرَمَا⁽أ⁾"], ["مَعَ النَّظِيرِ العَقِبِيِّ الجَيْبَا", "الرُّصْغِيَّ فَاطْرَحَنَّ الرَّيْبَا"], ["وَالجِسْمُ تَحْتَهُ وُجَيْهٌ وَاحِدُ", "بِالعَقِبِ اتِّصَالُهُ يَا رَاصِدُ"], ["وَدَخَلَ الجَيْبَ الَّذِي قَدْ شَكَّلَتْهْ", "قَصَبَتَا السَّاقِ⁽أ⁾ اللَّتَانِ قَدْ عَلَتْهْ"], ["لَكِنَّ⁽ب⁾ سَقْفَهُ مِنَ الظُّنْبُوبِ", "وَجَانِبَيْهِ هَذَا مِنَ الكُعُوبِ"], ["وَالنَّاتِئُ الوَحْشِيُّ عِنْدَ أَجْسَمِ", "سَطْحَيْهِ بَانَ فِيهِ كَالمُدَعَّمِ"], ["وَالنَّاتِئُ الخَلْفِيُّ قَدْ رَآهُ", "مُسْقِطُ طَرْفِهِ إِلَى قَفَاهُ"], ["لَهُ حُدَيْبَتَانِ تَظْهَرَانِ", "بِجَانِبَيْهِ حَيْثُ تَبْرُزَانِ"], ["إِلَى الوَرَا وَبَيْنَ تَيْنِ انْحَصَرَا", "التَّلْمُ الَّذِي يُمِرُّ وَتَرَا"], ["مُثْنِيَةِ الإِبْهَامِ وَالأَصِيلَهْ", "بِسَاقِنَا⁽أ⁾ وَأَقْصِدُ الطَّوِيلَهْ"]]],
["العَقِبُ أَوِ العَقِبِيُّ Calcaneus", 67, [["أَكْبَرُ عَظْمِهَا يُسَمَّى العَقِبَا", "قَدْ حَفِظَ الوُقُوفَ أَنْ يَضْطَرِبَا"], ["أَعْطَى مِنَ الوَرَاءِ شَكْلَ القَدَمِ", "وَجَاءَ تَحْتَ الكَاحِلِ المُنْصَرِمِ"], ["وَمَا بَدَا لِشَكْلِهِ اتِّسَاقُ", "لَهُ سُطُوحٌ سِتَّةٌ تُسَاقُ"], ["أَمَّا الأَمَامِيُّ فَلَمْ يُرَكَّبِ", "بِمَفْصِلٍ بِهِ سِوَى المُكَعَّبِيْ"], ["وَقَدْ رَأَى المُشَرِّحُونَ البَكَرَهْ", "فِي سَطْحِهِ الوَحْشِيِّ وَالمُمَرَّرَهْ"], ["الوَتَرَيْنِ فَوْقَهَا وَتَحْتَهَا", "لِلشَّظَوِيَّيْنِ فَاعْرِفْ قَدْرَهَا"], ["وَلَلَّذِي⁽أ⁾ مِنْ خَلْفِهِ مُدَوَّرُ", "يَحُطُّ فِي الأَوْسَطِ مِنْهُ الوَتَرُ"], ["العَقِبِيُّ بِارْتِكَازِ أَمْتَنِ", "أَسْفَلُهُ إِلَى الأَمَامِ يَنْحَنِيْ"], ["فَيَسْتَمِرُّ بَعْدَهُ فِي الأَخْمَصِيْ", "مُشَكِّلًا أُحْدُوبَةً، وَشَخِّصِ⁽ب⁾"], ["بُرُوزَ نَاتِئَيْنِ مِنْهَا وَهُمَا", "فِي جَانِبَيْهَا، فَصَلَتْ بَيْنَهُمَا"], ["الثُّلْمَةُ الَّتِي كَسَبْعَةٍ تُرَى", "وَالنَّاتِئُ الإِنْسِيُّ كَانَ أَكْبَرَا"], ["وَمِنْ أَمَامِ الوَجْهِ هَذَا بَرَزَا", "حُدَيْبَةٌ مِنْ أَجْلِ أَنْ يَرْتَكِزَا"], ["بِهَا الرِّبَاطُ العَقِبِيُّ النَّرْدِيْ", "الأَخْمَصِيُّ وَالقَوِيُّ الشَّدِّ"],
["يَنْشُؤُ مِنْ إِنْسِيِّهِ مِعْلَاقُ", "الكَاحِلِ الَّذِي بَدَا انْطِلَاقُ"],
["لِوَتَرِ المُثْنِيَةِ الإِبْهَامِ", "مِنْ تَحْتِهِ بِأَحَدِ الأَتْلَامِ"],
["وَإِنَّهُ يُشْبِهُ رَفًّا⁽¹⁾ ضَخْمَا", "وَيَدْعَمُ الكَاحِلَ دَعْمًا"],
["وَسَطْحُهُ الأَعْلَى عَلَى اتِّصَالِ", "مَعَ أَسْفَلِ الكَاحِلِ مِنْ خِلَالِ"],
["ثَلَاثَةٍ مِنَ الوُجَيْهَاتِ فَقَطْ", "وَقَدْ عَلَا مِعْلَاقُهُ الَّذِي وَسَطْ"],
["وَيَلْتَقِي الخَلْفِيُّ جِسْمَ الكَاحِلِ", "وَالبَاقِيَانِ الرَّأْسَ فِي مَفَاصِلِ"],
["بَيْنَهُمَا وَبَيْنَ هَذَا الخَلْفِيْ", "التَّلَمُ الَّذِي مَضَى فِي وَصْفِيْ"]]],
["العَظْمُ الزَّوْرَقِيُّ (القَارِبِيُّ) Navicular", 71, [["وَإِنَّ عَظْمَ الرُّصْغِ البَيْنِيَّا", "الزَّوْرَقِيَّ وَاقِعٌ إِنْسِيَّا"], ["بَدَا لَهُ بِالكَاحِلِ ارْتِبَاطُ", "مِنَ الوَرَاءِ، وَكَذَا يُحَاطُ"], ["مِنَ الأَمَامِ وَمِنَ الوَحْشِيِّ", "بِأَعْظُمٍ لِلجَانِبِ القَصِيِّ"], ["تَبْرُزُ أُحْدُوبَتُهُ إِنْ تَفْحَصِ", "إِنْسِيَّ وَجْهِ الزَّوْرَقِيِّ الأَخْمَصِيْ"], ["فَجُسَّهَا أَمَامَ تَحْتَ الكَعْبِ", "الدَّاخِلِيِّ كَنُتُوءِ صُلْبِ"]]],
["المَجْمُوعَةُ البَعِيدَةُ مِنْ عِظَامِ الرُّصْغِ Distal group of tarsal bones", 72, [["وَكَوَّنَ المَجْمُوعَةَ البَعِيدَهْ", "الأَعْظُمُ الثَّلَاثَةُ الفَرِيدَهْ"], ["الظَّاهِرَاتُ فِيهَا كَالأَوْتَادِ", "كَذَلِكَ المُكَعَّبِيُّ البَادِي"]]],
["العِظَامُ الإِسْفِينِيَّةُ (الوَتَدِيَّةُ) Cuneiforms", 72, [["الأَعْظُمُ المُشْبِهَةُ الإِسْفِينَا", "ثَلَاثَةٌ لَدَى المُشَرِّحِينَا"], ["وَإِنَّهَا لِبَعْضِهَا تُسَانِدُ", "وَحَضَرَتْ أَمَامَهَا قَوَاعِدُ"], ["أُولَى ثَلَاثَةٍ فَقَطْ لِلْمِشْطِ", "وَالزَّوْرَقِيُّ خَلْفَهَا ذُو رَبْطِ"]]],
["العَظْمُ المُكَعَّبِيُّ (النَّرْدِيُّ) Cuboid", 73, [["إِنَّ المُكَعَّبِيَّ حَتْمًا يَلْتَقِيْ", "بِالعَقِبِيِّ فِي الوَرَاءِ وَلَقِيْ"], ["آخِرَ مِشْطَيْنِ فِي الأَمَامِ", "وَإِنَّ إِنْسِيَّةً فِي انْسِجَامِ"], ["بِالزَّوْرَقِيِّ الأَوْسَطِ المَتِينِ", "إِضَافَةً لِلثَّالِثِ الإِسْفِينِيْ"], ["وَتَلْمٌ أَسْفَلُهُ بِهِ انْحَصَرْ", "لِشَظَوِيَّةٍ طَوِيلَةٍ وَتَرْ"]]],
["عِظَامُ المِشْطِ Metatarsal bones", 74, [["وَإِنْ تُرِدْ عَدًّا عِظَامَ المِشْطِ", "فَخَمْسَةٌ تَكُونُ ذَاتَ رَبْطِ"], ["بِالرُّصْغِ السَّابِقِ عَبْرَ القَاعِدَاتْ", "وَوَصَلَتْ رُؤُوسُهَا السُّلَامَيَاتْ"], ["وَاعْلَمْ بِأَنَّ جِسْمَ كُلِّ وَاحِدَهْ", "يُوجَدُ بَيْنَ رَأْسِهَا وَالقَاعِدَهْ"], ["يُعَدُّ أَوَّلُ العِظَامِ الأَكْبَرَا", "أَكْثَرَهَا إِنْسِيَّةً وَالأَقْصَرَا"], ["وَبَانَ تَحْتَ رَأْسِهِ العَظْمَانِ", "السِّمْسِمَانِيَّانِ لِلْعِيَانِ"], ["وَبَعْدَهُ الثَّانِي طَوِيلُ الجِسْمِ", "وَيَمْلِكُ الأَخِيرُ دُونَ ثَأْمِ"], ["فِي الجَانِبِ الوَحْشِيِّ مِنْ قَاعِدَتِهْ", "أُحْدُوبَةً إِلَى الوَرَاءِ تَتَّجِهْ"]]],
["السُّلَامَيَاتُ Phalanges", 75, [["سُلَامَيَاتُ القَدَمِ المُشْتَهَرَهْ", "تَعْدَادُهَا أَرْبَعَةٌ وَعَشَرَهْ"], ["ثَلَاثَةٌ لِكُلِّ إِصْبَعٍ سِوَى", "إِبْهَامِهَا فَذَا اثْنَتَيْنِ قَدْ حَوَى"]]],
]},
{b:"فصل العضلات · Muscles · Tubuh Bawah",p:[
["عَضَلَاتُ النَّاحِيَةِ الأَلَوِيَّةِ Muscles of gluteal region", 78, [["كَانَتْ مِنَ الوَرَاءِ بَيْنَ طَيَّهْ", "تَبْدُو وَعُرْفٍ حَرْقَفِيٍّ أَلْيَهْ"], ["وَحَقُّ كُلِّ إِبْرَةٍ أَنْ تُدْخَلَا", "فِي الرُّبُعِ الوَحْشِيِّ وَالَّذِي عَلَا"], ["فَلَا يُصَابُ وِرِكِيُّ البَالِغِ", "وَحَقْنُهَا فِي الطِّفْلِ غَيْرُ سَائِغِ"]]],
["المَجْمُوعَةُ السَّطْحِيَّةُ Superficial group", 79, [["قَدْ صَنَّفُوا ضِمْنَ الأَلَايَا⁽أ⁾ العَضَلَا", "فِي سَطْحِهَا وَعُمْقِهَا وَاشْتَمَلَا"], ["السَّطْحُ فِيهَا أَرْبَعًا⁽ب⁾ وَأُسْرِعُ", "بِالأَلْوِيَّاتِ الثَّلَاثِ فَاسْمَعُوا"]]],
["الأَلَوِيَّةُ الكُبْرَى Gluteus maximus", 80, [["أَضْخَمُ مَا فِي الجِسْمِ كُبْرَاهُنَّا", "فَاقَتْ جَمِيعَ العَضَلَاتِ وَزْنَا"], ["اِعْرِفْ نُشُوءَ هَذِي حَقَّ المَعْرِفَهْ", "مِنْ عَجُزٍ وَعُصْعُصٍ وَحَرْقَفَهْ"], ["وَرَاءَ خَطٍّ أَلَوِيٍّ خَلْفِيْ", "وَعَجُزِيٍّ حَدَبِيٍّ أُلْفِيْ⁽أ⁾"], ["ثُمَّ ارْتِكَازُ بَعْضِهَا بَعْدَئِذِ", "فِي سَطْحِ أُحْدُوبَتِهَا بِالفَخِذِ"], ["وَفِي سَبِيلٍ قَدْ بَدَا مَعْصُوبَا⁽ب⁾", "يَرْبِطُ بِالحَرْقَفَةِ الظُّنْبُوبَا"], ["قَدْ بَسَطَتْ بِالأَلَوِيِّ السُّفْلِيْ", "الفَخِذَ المَعْطُوفَ عِنْدَ الفِعْلِ"]]],

["العَضَلَةُ العَانِيَّةُ (المِشْطِيَّةُ) Pectineal muscle", 101, [["وَامْتَدَّتِ العَانِيَّةُ المُرَبَّعَهْ", "مِنْ خَطِّهَا فِي الشُّعْبَةِ⁽أ⁾ المُرْتَفِعَهْ⁽ب⁾"], ["مَعَ الجِوَارِ نَحْوَ خَطِّهَا الَّذِي", "يُوجَدُ مِنْ وَرَاءِ أَعْلَى الفَخِذِ"]]],
["المُقَرِّبَةُ الطَّوِيلَةُ Adductor longus", 102, [["طَوِيلَةُ المُقَرِّبَاتِ تَظْهَرُ", "أَمَامَ أُخْتَيْهَا، وَكَانَ مَصْدَرُ"], ["أَلْيَافِهَا ظَاهِرَ جِسْمِ العَانَهْ", "وَالْتَصَقَتْ بِالخَطِّ ذِي الخَشَانَهْ⁽أ⁾"], ["فِي ثُلْثِهِ الأَوْسَطِ قَاعِدَتُهَا⁽ب⁾", "إِذْ أَشْبَهَتْ مُثَلَّثًا هَيْأَتُهَا"]]],
["المُقَرِّبَةُ القَصِيرَةُ Adductor brevis", 103, [["وَخَلْفَهَا فِي مَوْضِعٍ مُمَيَّزِ", "وَخَلْفَ عَانِيَّةٍ هَذَا الحَيِّزِ"], ["قَدْ حَضَرَتْ قُصْرَى المُقَرِّبَاتِ", "إِذْ نَشَأَتْ مِنْ ظَاهِرِ العَانَاتِ"], ["مِنْ جِسْمِهَا وَفَرْعِهَا التَّحْتَانِي", "وَالارْتِكَازُ فِي مَكَانٍ دَانِ"], ["وَرَاءَ عَظْمِ الفَخِذِ المُوَضَّعِ", "فِي ثُلْثِ خَطٍّ خَشِنٍ مُرْتَفِعِ"]]],
["المُسِدَّةُ الظَّاهِرَةُ (السِّدَادِيَّةُ الخَارِجِيَّةُ) Obturator externus", 104, [["وَتَنْشَأُ الظَّاهِرَةُ المُسِدَّهْ", "مِنْ ظَاهِرِ الغِشَا وَمِمَّا حَدَّهْ⁽أ⁾"], ["وَيَعْرِفُ ارْتِكَازَهَا فِي حُفْرَهْ", "المَدْوَرِ الكَبِيرِ أَهْلُ الخِبْرَهْ"]]],
["المُقَرِّبَةُ الكَبِيرَةُ Adductor magnus", 105, [["وَأَكْبَرُ المُقَرِّبَاتِ مُطْلَقَا", "تُعَدُّ مِمَّا قَدْ ذَكَرْتُ الأَعْمَقَا"], ["مُثَلَّثِيٌّ شَكْلُهَا الَّذِي ارْتُضِيْ", "وَأَدْخَلُ الجُزْأَيْنِ مِنْهَا المَأْبِضِيْ"], ["يَمْتَدُّ مِنْ أُحْدُوبَةٍ لِلْإِسْكِ", "إِلَى حُدَيْبَةٍ لَهَا فِي مِلْكِ"], ["جَانِبِ عَظْمِ الفَخِذِ القَصِيِّ", "وَالخَطِّ فَوْقَ اللُّقْمَةِ الإِنْسِيِّ"], ["وَجُزْؤُهَا المُقَرِّبُ الَّذِي اشْتَهَرْ", "مِنْ فَرْعَيِ العَانَةِ وَالإِسْكِ انْتَشَرْ"], ["وَمَغْرَسُ الجُزْءِ لِمَنْ تَتَبَّعَهْ", "خَطٌّ مِنَ الحُدَيْبَةِ المُرَبَّعَهْ"], ["فِي الفَخِذِ الخَلْفِيِّ لِلْخَطِّ الخَشِنْ", "لِلْخَطِّ فَوْقَ اللُّقْمَةِ الَّذِي زُكِنْ⁽أ⁾"], ["وَبَيْنَ جُزْأَيْهَا مَكَانٌ فُرِجَا", "مِنْهُ المُرَوِّي الفَخِذِيُّ وَلَجَا"]]],
["المُثَلَّثُ الفَخِذِيُّ Femoral triangle", 107, [["يَبْدُو انْخِفَاضٌ شَكْلُهُ مُثَلَّثِيْ", "فِي الفَخِذِ العُلْوِيِّ ضِمْنَ الجُثَثِ"], ["يُوجَدُ أَسْفَلَ الرِّبَاطِ الأُرْبِيْ", "هَذَا كَمَا تَحُدُّهُ مِنْ جَنْبِ"], ["عَضَلَةُ الخَيَّاطِ لِلْمُنْقَبَةْ⁽أ⁾", "وَجَنْبِ الطَّوِيلَةُ المُقَرِّبَةْ"], ["كَذَلِكُمْ كَانَتْ لَهُ أَرْضِيَّهْ", "مَعْ قَطَنِيَّةٍ وَمَعْ عَانِيَّهْ"], ["وَسَقْفُهُ لِفَافَةٌ وَجِلْدُ", "وَالذُّرْوَةُ الَّتِي لَهُ تَمْتَدُّ"], ["لِأَسْفَلٍ فِي الثُّلْثِ الوَسِيطِ", "كَالفَلْحِ بَيْنَ العَضَلِ المُحِيطِ"], ["وَإِنَّمَا عَلَيْكَ أَنْ تُلَقِّبَهْ", "بِنَفَقِ العَضَلَةِ المُقَرِّبَهْ"]]],
["الحَيِّزُ الخَلْفِيُّ لِلْفَخِذِ Posterior compartment of the thigh", 109, [["وَمِنْ وَرَاءِ الفَخِذِ المِثَالِيْ", "ثَلَاثَةٌ مِنْ عَضَلٍ طِوَالِ"], ["وَقَدْ تُسَمَّى بِوِتَارِ المَأْبِضِ", "تَقُولُ لِلسَّاقِ السَّلِيمِ انْقَبِضِ"], ["إِنْ كُنْتَ مَبْسُوطًا لَدَى الوُقُوفِ", "أَوِ انْبَسِطْ لِلْفَخِذِ المَعْطُوفِ"], ["تَأْخُذُ أَمْرَ العَمَلِ المَطْلُوبِ", "مِنْ وَرِكِيٍّ قِسْمِهِ الظُّنْبُوبِيْ"], ["مَنَاشِئُ الثَّلَاثَةِ العَدِيدَهْ⁽أ⁾", "أُحْدُوبَةٌ إِسْكِيَّةٌ عَتِيدَهْ"], ["خَالَفَهَا رَأْسٌ قَصِيرٌ يُنْسَبُ", "لِمَنْ لَهَا رَأْسَانِ إِذْ يُعَصَّبُ"], ["مِنْ وَرِكِيٍّ وَارِدٍ مِنْ قَبْلُ", "لَكِنْ بِقِسْمِ الشَّظَوِيِّ الأَصْلِيْ"], ["مَنْشَؤُهُ مِنْ شَفَةٍ وَحْشِيَّةِ", "عَائِدَةٍ لِذَلِكَ الخَطِّ الخَشِنْ"]]],
["ذَاتُ الرَّأْسَيْنِ الفَخِذِيَّةُ Biceps femoris", 111, [["أَمَّا الَّتِي لَهَا مِنَ الرُّؤُوسِ", "اثْنَانِ ذَاتُ وَتَرٍ مَغْرُوسِ"], ["بَعْدَ اتِّحَادٍ لَهُمَا فِي رَاسِ⁽أ⁾", "شَظِيَّةٍ أَكْثَرَ الِانْغِرَاسِ"], ["وَذَاكَ فِي وَحْشِيِّهِ المُبَيَّنِ", "فَإِنَّهَا وَحْشِيَّةٌ فِي المَسْكَنِ"]]],

["ارْتِكَازُ العَضَلَاتِ الثَّلَاثِ الخَيَّاطِيَّةِ وَالنَّاحِلَةِ وَوَتَرِيَّةِ النِّصْفِ Pes anserinus", 113, [["وَإِنَّ خَيَّاطِيَّةً وَنَاحِلَهْ", "وَوَتَرِيَّةَ النَّصِيفِ المَائِلَهْ"], ["أَوْتَارُهَا كَقَدَمِ الإِوَزِّ", "عِنْدَ اجْتِمَاعِهَا قُبَيْلَ الغَرْزِ"], ["فِي عَظْمَةِ الظُّنْبُوبِ مِنْ أَعْلَاهَا", "فِي وَجْهِهَا الإِنْسِيِّ لَا تَنْسَاهَا"]]],
["غِشَائِيَّةُ النِّصْفِ Semimembranous", 114, [["أَمَّا الَّتِي أَعْمَقُ مِنْهَا سَمِّهَا", "نِصْفَ الغِشَائِيَّةِ وَاعْرِفْ أَنَّهَا"], ["فِي لُقْمَةِ الظُّنْبُوبِ⁽أ⁾ كَانَتْ تَرْتَكِزْ", "فِي الخَلْفِ وَالإِنْسِيِّ مِنْهَا فَلْتَمِزْ"]]],
["عَضَلَاتُ السَّاقِ Muscles of the leg", 115, [["وَتُقْسَمُ السَّاقُ إِلَى أَحْيَازِ", "ثَلَاثَةٍ وَذَاكَ بِارْتِكَازِ"], ["لِفَافَةٍ عَمِيقَةٍ لَهَا عَلَى", "ظُنْبُوبِهَا ، وَحَاجِزَيْنِ وَصَلَا"], ["شَظِيَّةً مِنْ أَعْمَقِ اللِّفَافَتَيْنْ", "كَذَلِكَ الغِشَاءُ بَيْنَ العَظْمَتَيْنْ"]]],
["الحَيِّزُ الأَمَامِيُّ لِلسَّاقِ Anterior compartment of the leg", 116, [["الحَيِّزُ الَّذِي مِنَ الأَمَامِ أَوْ", "الحَيِّزُ البَاسِطُ مِثْلَمَا دَعَوْا"], ["بَدَا بِهِ تَعْصِيبُ مَا قَدْ يَحْتَوِيْ", "مِنْ عَضَلَاتٍ أَرْبَعٍ بِالشَّظَوِيْ"], ["بِفَرْعِهِ العَمِيقِ لَا بِالثَّانِيْ", "بِهَا انْثِنَاءُ القَدَمِ الظَّهْرَانِيْ"]]],
["الظُّنْبُوبِيَّةُ الأَمَامِيَّةُ Tibialis anterior", 117, [["تَسْكُنُ هَذَا الحَيِّزَ المُقَدَّمَا", "لِلسَّاقِ ظُنْبُوبِيَّةٌ كَيْ تَدْعَمَا"], ["قَوْسًا مِنَ الإِنْسِيِّ فِي الأَقْدَامِ", "أَلْيَافُهَا إِنْسِيَّةُ المَكَانِ"], ["مَنْشَؤُهَا الوَحْشِيُّ مِنْ ظُنْبُوبِ", "وَمِنْ غِشًا مُجَاوِرٍ مَنْصُوبِ"], ["أَمَّا ارْتِكَازُ الوَتَرِ المُبِينِ", "فَتَحْتَ عَظْمٍ أَوَّلِ إِسْفِينِيْ"], ["كَذَاكَ فِي إِنْسِيِّهِ وَزَائِدْ", "قَاعِدَةُ المِشْطِيِّ رَقْمِ وَاحِدْ"]]],
["البَاسِطَةُ الطَّوِيلَةُ لِإِبْهَامِ القَدَمِ Extensor hallucis longus", 118, [["بِقُرْبِهَا البَاسِطَةُ الطَّوِيلَهْ", "لِإِصْبَعِ الإِبْهَامِ كَالخَلِيلَهْ"], ["مَنْشَؤُهَا شَظِيَّةٌ مِنْ نِصْفِ", "إِنْسِيِّهَا وَمِنْ غِشَاءِ أُلْفِيْ"], ["مَغْرَسُهَا أَقْصَى سُلَامَى عَائِدَهْ", "لِهَذِهِ الإِصْبَعِ أَعْلَى القَاعِدَهْ"]]],

["الْبَاسِطَةُ القَصِيرَةُ لِلأَصَابِعِ Extensor digitorum brevis", 135, [["أُولَاهُمَا بَاسِطَةُ الأَصَابِعِ", "فِي القَدَمِ الثَّانِيْ وَحَتَّى الرَّابِعِ"], ["وَمُنْتَهَى أَوْتَارِ ذِي العَضَلَةِ", "أَوْتَارُ أُخْتِهَا الطَّوِيلَةِ الَّتِيْ"], ["سَرَتْ عَلَيْهَا قَبْلَ الِانْغِرَاسِ", "وَثُبِّتَتْ كَذَاكَ فِي القَلَاسِيْ⁽¹⁾"]]],
["الْبَاسِطَةُ القَصِيرَةُ لِإِبْهَامِ القَدَمِ Extensor hallucis brevis", 136, [["ثَانِيهِمَا بَاسِطَةُ الإِبْهَامِ", "قَصِيرَةُ الأَلْيَافِ فِي الأَقْدَامِ"], ["تُغْرَسُ عَبْرَ وَتَرٍ مَا انْفَكَّا", "بِمَوْضِعٍ أَدْنَى سُلَامَى تِلْكَا"]]],
["عَضَلَاتُ أَخْمَصِ القَدَمِ Muscles in the sole of the foot", 137, [["وَعَضَلَاتُ الأَخْمَصِ المَوْصُوفَهْ", "فِي طَبَقَاتٍ أَرْبَعٍ مَرْصُوفَهْ"]]],
["الطَّبَقَةُ الأُولَى First layer", 138, [["نَبْدَأُ مِنْ أَوَّلِهَا بِالشَّرْحِ", "فَإِنَّهَا أَقْرَبُهَا لِلسَّطْحِ"], ["لَهَا ثَلَاثَةٌ لَدَى التَّفَحُّصِ", "آتِيَةٌ فَوْقَ السِّفَاقِ الأَخْمَصِيْ"], ["لِذَا يَرَى إِمْكَانَ أَنْ يَكُونَا", "نُشُوؤُهَا مِنْهُ المُشَرِّحُونَا"], ["جَمِيعُهَا فِي نَظْمِنَا قَدْ بَدَأَتْ", "عِنْدَ افْتِتَاحِ شَرْحِهَا بِ«اتَّخَذَتْ»"]]],
["المُبَعِّدَةُ لِإِبْهَامِ القَدَمِ Abductor hallucis", 139, [["اتَّخَذَتْ مُبْعِدَةُ الإِبْهَامِ", "فِي القَدَمِ الإِنْسِيِّ لِلْمُقَامِ"], ["تَنْشَأُ مِنْ أُحْدُوبَةٍ لِلْعَقِبِ", "نَاتِئِهَا الإِنْسِيِّ وَالمُقْتَرِبِ"], ["مِنْهُ كَقَيْدِ القَابِضَاتِ الجَامِعِ", "وَكَالسِّفَاقِ الأَخْمَصِيِّ المَانِعِ"], ["ثُمَّ انْتَهَى وَتَرُهَا فِي قَاعِدَهْ", "أَدْنَى سُلَامِيَاتِهِ المُشَاهَدَهْ"], ["فِي الجَانِبِ الإِنْسِيِّ مِنْهَا يُمْسِيْ", "وَالسِّمْسِمَانِيِّ الَّذِي فِي الإِنْسِيْ"]]],
["المُثْنِيَةُ القَصِيرَةُ لِلْأَصَابِعِ Flexor digitorum brevis", 140, [["وَاتَّخَذَتْ مُثْنِيَةُ الأَصَابِعِ", "فِي قَدَمِ الحَيِّ مِنَ المَوَاضِعِ"], ["أَوْسَطَ أُخْتَيْهَا مَكَانًا بَيِّنَا", "وَارْتَبَطَتْ بِنَاتِئٍ قَدْ عُيِّنَا"], ["إِنْسِيَّ أُحْدُوبَةِ عَظْمِ العَقِبِ", "وَانْظُرْ إِلَى أَوْتَارِهَا عَنْ كَثَبِ"], ["كَيْفَ انْبِثَاقُهَا مِنَ العَضَلَةِ", "لِآخِرِ الأَصَابِعِ الأَرْبَعَةِ"], ["إِذْ كُلُّ وَاحِدٍ مِنَ الأَوْتَارِ", "لَا بُدَّ أَنْ يُصَابَ بِانْشِطَارِ"], ["وَبَيْنَ شَطْرَيْهِ يَمُرُّ وَتَرُ", "أُخْرَى تُضَاهِيهَا بِسَاقٍ تَحْضُرُ"], ["وَارْتَكَزَتْ أَوْتَارُهَا المُنْشَطِرَاتْ", "فِي حَافَتَيْ أَوَاسِطِ السُّلَامِيَاتْ"]]],
["المُبَعِّدَةُ لِخِنْصَرِ القَدَمِ Abductor digiti minimi", 141, [["وَاتَّخَذَتْ مُبْعِدَةُ الأَخِيرِ", "فِي قَدَمِ الكَبِيرِ وَالصَّغِيرِ"], ["مِنْ حَافَةٍ وَحْشِيَّةٍ مَكَانَا", "تَمْلِكُ مَنْشَأً عَرِيضًا بَانَا"], ["لَدَيْكَ عِنْدَ رَفْعِ كُلِّ الحُجُبِ", "مِنْ نَاتِئَيْ أُحْدُوبَةٍ لِلْعَقِبِ"], ["وَمِنْ شَرِيطٍ مُدَّ بَيْنَ عَقِبِهْ", "وَالخَامِسِ المِشْطِيِّ مِنْ قَاعِدَتِهْ"], ["وَارْتَكَزَتْ بِوَتَرٍ فِي أَقْرَبِ", "سُلَامِيَاتِ الخِنْصَرِ المُرَكَّبِ"], ["وَحْشِيَّ قَاعِدَتِهَا كَيْ تُبْعِدَا", "فَذَلِكَ الَّذِي إِلَيْهَا أُسْنِدَا"]]],
["الطَّبَقَةُ الثَّانِيَةُ Second layer", 142, [["وَفَوْقَهَا الثَّانِيَةُ المُنْدَسُّ", "فِيهَا بِأَوْتَارٍ لِأُخْرَى خَمْسُ"]]],
["المُرَبَّعَةُ الأَخْمَصِيَّةُ Quadratus plantae", 143, [["الأَخْمَصِيَّةُ الَّتِي تَمْتَلِكُ", "أَرْبَعَةً مِنَ الزَّوَايَا تُدْرَكُ"], ["مِنْ سَطْحِ عَظْمِ العَقِبِ التَّحْتَانِيْ", "وَالدَّاخِلِيِّ يَنْشَأُ الرَّأْسَانِ"], ["أَمَّا ارْتِكَازُهَا الَّذِي قَدْ طَابَا", "عِنْدَ الجَمِيعِ فَاسْمَعِ الصَّوَابَا"], ["فِي وَتَرِ القَابِضَةِ السَّاقِيَّةْ", "أَصَابِعًا أَرْبَعَةً وَحْشِيَّةْ"], ["فِي الجَانِبِ الوَحْشِيِّ مِنْهُ وَالغَرَضْ", "تَقْدِيمُ عَوْنِهَا لَهُ إِذَا انْقَبَضْ"]]],
["الخَرَاطِينِيَّاتُ Lumbricals", 144, [["كَذَا الخَرَاطِينِيَّةُ الَّتِي وَجَدْ", "أَرْبَعَةٌ مِنْهَا جَمِيعُ مَنْ عَدَدْ"], ["مَنْشَؤُهَا القَابِضَةُ السَّاقِيَّةْ", "أَصَابِعًا أَرْبَعَةً وَحْشِيَّةْ"], ["مِنْ جَانِبَيْ أَوْتَارِهَا المُلْتَقِيَيْنْ", "فَلَيْسَ لِلْأُولَى وُجُودُ مَنْشَأَيْنْ"], ["وَكَانَ فِي الإِنْسِيِّ مِنْ قَلَاسِيْ", "البَاسِطَاتِ كُلُّ الِانْغِرَاسِ"], ["فَقَاوَمَتْ بِذَاكَ فَرْطَ البَسْطِ", "بَيْنَ سُلَامِيَاتِنَا وَالمِشْطِ"], ["وَعَكَسَتْ⁽أ⁾ بَيْنَ السُّلَامِيَاتِ", "عِنْدَ المَسِيرِ بُغْيَةَ الثَّبَاتِ"]]],
["الطَّبَقَةُ الثَّالِثَةُ Third layer", 145, [["تَضُمُّ ثَالِثَتُهَا لِحَاصِرِ", "ثَلَاثَةً لِأَوَّلٍ وَآخِرِ"]]],
["القَابِضَةُ القَصِيرَةُ لِإِبْهَامِ القَدَمِ Flexor hallucis brevis", 146, [["أَوَّلُهَا قَابِضَةٌ لِلأُولَى⁽أ⁾", "قَصِيرَةٌ أَلْيَافُهَا لَا طُولَى"], ["لَهَا بِرَأْسَيْنِ نُشُوءٌ حُرِّرَا", "وَمَا أُرِيكَ مِنْهُ إِلَّا مَا أَرَى"], ["رَأْسٌ مِنَ النَّرْدِيِّ وَالإِسْفِينِيْ", "الثَّالِثِ المُجَاوِرِ القَرِينِ"], ["وَآخَرٌ مِنْ وَتَرٍ مَشَّاءِ", "يَخُصُّ ظُنْبُوبِيَّةَ الوَرَاءِ"], ["فِي أَخْمَصٍ وَبَعْدَ ذَاكَ التَحَمَا⁽ب⁾", "مُشَكِّلَانِ بَطْنَهَا المُنْقَسِمَا"], ["مُجَدَّدًا قِسْمَيْنِ ثُمَّ خَرَجَا", "مِنْ كُلِّ قِسْمٍ وَتَرٌ وَانْدَمَجَا⁽ب⁾"], ["فِي جَانِبَيْ قَاعِدَةِ السُّلَامَى", "الأَقْرَبِ السَّاكِنَةِ الإِبْهَامَا"]]],

["المُقَرِّبَةُ لِإِبْهَامِ القَدَمِ Adductor hallucis", 147, [["جَارَتُهَا فِي الأَخْمَصِ المُقَرِّبَهْ", "لِذَلِكَ الأَوَّلِ كَيْمَا تَسْحَبَهْ"], ["بِلِيفِ رَأْسَيْهَا إِذَا يَنْقَبِضُ", "وَيَنْشَأُ المَائِلُ لَا المُسْتَعْرِضُ"], ["مِنْ غِمْدِ طُولَى الشَّظَوِيَّتَيْنِ", "وَالثَّالِثِ المِشْطِيِّ وَالجَارَيْنِ"], ["مِنْ وَجْهِ قَاعِدَاتِهَا المُنْخَفِضِ", "وَرَأْسُهَا المَعْرُوفُ بِالمُسْتَعْرِضِ"], ["مِنْ رُبُطٍ⁽¹⁾ المَفَاصِلِ اللَّوَاتِي", "مِنْ بَيْنِ مِشْطٍ وَسُلَامِيَاتِ"], ["لِآخِرِ الأَصَابِعِ الثَّلَاثَهْ", "مِنْهَا يَرَى المُشَرِّحُ انْبِثَاثَهْ"], ["وَبَعْدَ ذَا الرَّأْسَانِ يُجْمَعَانِ", "فِي الوَتَرِ الَّذِي بِسِمْسِمَانِيْ"], ["الجَانِبِ الوَحْشِيِّ قَدْ تَعَلَّقَا", "وَأَقْرَبُ السُّلَامِيَاتِ أُلْحِقَا"]]],

["القَابِضَةُ القَصِيرَةُ لِخِنْصَرِ القَدَمِ Flexor digiti minimi brevis", 148, [["ثَالِثُهَا القَابِضَةُ القَصِيرَهْ", "أَلْيَافُهَا لِلإِصْبَعِ الأَخِيرَهْ"], ["مَنْشَؤُهَا المِشْطِيُّ رَقْمُ خَمْسَهْ", "أَسْفَلَ قَاعِدَتِهِ لَا تَنْسَهْ"], ["مَغْرَسُهَا الوَحْشِيُّ مِنْ قَاعِدَةِ", "أَدْنَى سُلَامَى الخِنْصَرِ البَائِنَةِ"]]],

["الطَّبَقَةُ الرَّابِعَةُ Fourth layer", 149, [["وَالعَضَلُ الَّذِي احْتَوَتْهُ أَعْمَقُ", "الطَّبَقَاتِ سَبْعَةٌ مُفَرَّقُ"], ["مَجْمُوعَتَيْنِ دُونَ أَيِّ خَلْطِ", "مَوْجُودَةٌ بَيْنَ عِظَامِ المِشْطِ"]]],

["العَضَلَاتُ بَيْنَ العَظْمَيْنِ الظَّهْرِيَّةُ Dorsal interossei", 150, [["أُولَاهُمَا ظَهْرِيَّةٌ مُوَزَّعَهْ", "كَمَا يَلِيْ جَمِيعُ هَذِي الأَرْبَعَهْ"], ["فَإِنَّ لِلثَّانِي اثْنَتَيْنِ مِنْهُمَا", "عَنِ اليَمِينِ وَالشِّمَالِ بَيْنَمَا"], ["لِلتَّالِيَيْنِ لَيْسَ إِلَّا وَاحِدَهْ", "تَكُونُ فِي وَحْشِيِّهَا لِفَائِدَهْ"], ["تَحُطُّ فِي قَوَاعِدِ السُّلَامِيَاتْ", "أَقْرَبِهَا وَفِي قَلَاسِيْ البَاسِطَاتْ"]]],

["العَضَلَاتُ بَيْنَ العَظْمَيْنِ الأَخْمَصِيَّةُ Plantar interossei", 151, [["وَأَخْمَصِيَّةٌ تَضُمُّ البَاقِيْ", "عَضَلُهَا يَكُونُ بِالتِصَاقِ"], ["بِالجَانِبِ الإِنْسِيِّ مِمَّا رُقِّمَا", "بِثَالِثٍ لِخَامِسٍ قَدْ خُتِّمَا"], ["تَحُطُّ فِي قَوَاعِدِ السُّلَامِيَاتْ", "أَقْرَبِهَا وَفِي قَلَاسِيْ البَاسِطَاتْ"]]],

["تَعْصِيبُ عَضَلَاتِ أَخْمَصِ القَدَمِ Innervation of plantar muscles", 152, [["وَذَا هُوَ التَّعْصِيبُ غَيْرُ مَنْسِيْ", "قَدْ عُصِّبَتْ مِنْ أَخْمَصِيٍّ إِنْسِيْ"], ["مُبْعِدَةُ الإِبْهَامِ وَالقَابِضَتَانْ", "لَهُ وَلِلأَصَابِعِ القَصِيرَتَانْ"], ["كَذَلِكُمْ أُولَى المُشَابِهَاتِ", "شَكْلَ الخَرَاطِينِ الدُّوَيْدِيَّاتِ"], ["وَعُصِّبَتْ مِنْ أَخْمَصِيٍّ وَحْشِيْ", "البَاقِيَاتُ السَّابِقَاتُ الفَرْشِ"]]]]},

{b:"فصل الشرايين · Arteries · Tubuh Bawah",p:[["شَرَايِينُ النَّاحِيَةِ الأَلَوِيَّةِ Arteries of gluteal region", 154, [["وَمَا يُغَذِّي أَلْيَةَ الأَحْيَاءِ", "وَالفَخِذَ الخَلْفِيَّ بِالدِّمَاءِ"], ["إِذَا يَضِنُّ الأَلْوِيَّانِ اللَّذَانْ", "مِنْ حَرْقَفِيٍّ بَاطِنٍ يَبْتَدِئَانْ؟"]]],
["الشِّرْيَانُ الأَلَوِيُّ العُلْوِيُّ Superior gluteal artery", 155, [["وَكَانَ عُلْوِيُّهُمَا اسْتِمْرَارَا", "لِجِذْعِهِ الخَلْفِيِّ ثُمَّ سَارَا"], ["نَحْوَ الوَرَاءِ بِدُخُولِ حَيِّزِ", "مِنْ بَيْنِ جِذْعٍ قَطَنِيٍّ عَجُزِيْ"], ["وَعَجُزِيٍّ أَوَّلِ أَمَامِيْ", "وَغَادَرَ الحَوْضَ بِلَا مَلَامِ"]]],
["تتمة نظم الشريان الألوي العلوي Superior gluteal artery (lanjutan)", 156, [["مِنْ ثُقْبَةٍ كَبِيرَةٍ لِيَطْلُعَا", "مِنْ فَوْقِ كُمَّثْرِيَّةٍ تَفَرَّعَا"], ["فَرْعَيْنِ بَيْنَ الأَلَوِيَّاتِ الثَّلَاثْ", "سَيْرُهُمَا عِنْدَ الذُّكُورِ وَالإِنَاثْ"], ["لَمْ يُظْهِرِ السَّطْحِيَّ إِلَّا رَفْعُ", "كَبِيرَةِ الأَلْيَةِ أَمَّا الفَرْعُ"], ["الآخَرُ العَمِيقُ كَانَ بَيْنَا", "الأُخْرَيَيْنِ قَدْ مَشَى الهُوَيْنَا"]]],
