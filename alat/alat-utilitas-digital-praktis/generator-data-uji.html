<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Data Uji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0D1117;--panel:#161B22;--deep:#010409;--text:#C9D1D9;--soft:#8B949E;--blue:#58A6FF;--green:#3FB950;--line:#30363D;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.6;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{max-width:820px;margin:0 auto;padding:36px 20px 80px;}
  h1{font-size:1.7rem;margin:0 0 8px;color:#fff;}
  h2{font-size:1.05rem;margin:0 0 10px;color:#fff;}
  p{color:var(--soft);font-size:0.92rem;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:22px;}
  .row{margin-bottom:16px;}
  label{display:flex;justify-content:space-between;font-size:0.85rem;color:var(--soft);margin-bottom:8px;}
  input[type=range]{width:100%;}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:6px;}
  .field-chip{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--deep);border:1px solid var(--line);border-radius:6px;font-size:0.84rem;cursor:pointer;}
  .field-chip input{margin:0;}
  .fmt-row{display:flex;gap:8px;margin-top:6px;}
  .fmt-btn{padding:7px 16px;border-radius:6px;border:1px solid var(--line);background:var(--deep);color:var(--soft);cursor:pointer;font-size:0.85rem;}
  .fmt-btn.active{background:var(--blue);color:#0D1117;border-color:var(--blue);font-weight:600;}
  button.act{padding:9px 16px;border-radius:6px;border:1px solid var(--blue);background:var(--blue);color:#0D1117;font-weight:700;font-size:0.86rem;cursor:pointer;}
  button.sec{padding:9px 16px;border-radius:6px;border:1px solid var(--line);background:var(--deep);color:var(--text);font-size:0.86rem;cursor:pointer;margin-left:8px;}
  textarea{width:100%;min-height:280px;background:var(--deep);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:12px;font-family:'JetBrains Mono',monospace;font-size:0.82rem;margin-top:14px;}
  .foot{font-size:0.8rem;color:#565D66;margin-top:20px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Generator Data Uji</h1>
  <p>Pasangan dari Data Analyzer &amp; Visualizer — kalau tool itu membongkar data, ini membuat data contoh untuk dicoba di sana. Geser jumlah baris, pilih kolomnya, pilih formatnya.</p>

  <div class="panel">
    <div class="row">
      <label>Jumlah baris <span id="rowsPos">10</span></label>
      <input type="range" id="rowsSlider" min="1" max="50" value="10">
    </div>

    <div class="row">
      <label>Kolom yang disertakan</label>
      <div class="fields" id="fieldPicker"></div>
    </div>

    <div class="row">
      <label>Format keluaran</label>
      <div class="fmt-row">
        <button class="fmt-btn active" data-fmt="json">JSON</button>
        <button class="fmt-btn" data-fmt="csv">CSV</button>
      </div>
    </div>

    <button class="act" id="btnGen">Buat Data</button>
    <button class="sec" id="btnCopy">Salin</button>
    <button class="sec" id="btnDownload">Unduh</button>

    <textarea id="output" readonly></textarea>
  </div>

  <p class="foot">Nama, kota, dan email di sini murni acak untuk keperluan uji coba tool — bukan data orang sungguhan.</p>
</div>

<script>
  const FIELD_DEFS = {
    nama: { gen: () => rand(['Ayu','Budi','Citra','Dedi','Eko','Fitri','Gita','Hadi','Indah','Joko']) + ' ' + rand(['Santoso','Wijaya','Pratama','Lestari','Kurnia']) },
    email: { gen: (row) => (row.nama||'user'+Math.floor(Math.random()*999)).toLowerCase().replace(/\s+/g,'.') + '@mail.com', needs:['nama'] },
    umur: { gen: () => 18 + Math.floor(Math.random()*45) },
    kota: { gen: () => rand(['Bandung','Jakarta','Surabaya','Medan','Yogyakarta','Makassar','Semarang']) },
    status: { gen: () => rand(['aktif','nonaktif','pending']) },
    tanggal_daftar: { gen: () => randDate('2023-01-01','2026-09-01') },
    harga: { gen: () => (Math.floor(Math.random()*50)+1) * 5000 },
    rating: { gen: () => (Math.round((1+Math.random()*4)*10)/10) },
  };

  function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function randDate(a,b){
    const start = new Date(a).getTime(), end = new Date(b).getTime();
    const d = new Date(start + Math.random()*(end-start));
    return d.toISOString().slice(0,10);
  }

  const fieldPicker = document.getElementById('fieldPicker');
  const defaultOn = ['nama','email','umur','kota','status'];
  Object.keys(FIELD_DEFS).forEach(key => {
    const chip = document.createElement('label');
    chip.className = 'field-chip';
    chip.innerHTML = `<input type="checkbox" value="${key}" ${defaultOn.includes(key)?'checked':''}> ${key}`;
    fieldPicker.appendChild(chip);
  });

  let currentFmt = 'json';
  document.querySelectorAll('.fmt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.fmt-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentFmt = btn.dataset.fmt;
    });
  });

  const rowsSlider = document.getElementById('rowsSlider');
  const rowsPos = document.getElementById('rowsPos');
  rowsSlider.addEventListener('input', () => rowsPos.textContent = rowsSlider.value);

  function getSelectedFields(){
    return Array.from(fieldPicker.querySelectorAll('input:checked')).map(i => i.value);
  }

  function generateRows(n, fields){
    const rows = [];
    for(let i=0;i<n;i++){
      const row = { id: i+1 };
      fields.forEach(f => { row[f] = FIELD_DEFS[f].gen(row); });
      rows.push(row);
    }
    return rows;
  }

  function toCSV(rows){
    if(!rows.length) return '';
    const headers = Object.keys(rows[0]);
    const esc = v => /[",\n]/.test(String(v)) ? '"'+String(v).replace(/"/g,'""')+'"' : v;
    const lines = [headers.join(',')];
    rows.forEach(r => lines.push(headers.map(h=>esc(r[h])).join(',')));
    return lines.join('\n');
  }

  function generate(){
    const n = +rowsSlider.value;
    const fields = getSelectedFields();
    const rows = generateRows(n, fields);
    const output = currentFmt === 'json' ? JSON.stringify(rows, null, 2) : toCSV(rows);
    document.getElementById('output').value = output;
  }

  document.getElementById('btnGen').addEventListener('click', generate);
  document.getElementById('btnCopy').addEventListener('click', () => {
    const ta = document.getElementById('output');
    ta.select();
    document.execCommand('copy');
  });
  document.getElementById('btnDownload').addEventListener('click', () => {
    const blob = new Blob([document.getElementById('output').value], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'data-uji.' + currentFmt;
    a.click();
  });

  generate();
</script>
</body>
</html>
