<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skala pH — JAZMI</title>
<style>
body{margin:0;background:#0a0b12;color:#e6e6f0;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;line-height:1.6;}
.wrap{max-width:620px;margin:0 auto;padding:32px 20px 60px;}
h1{font-family:Georgia,serif;font-weight:normal;font-size:24px;margin:0 0 8px;}
p{color:#9494ac;font-size:14px;}
input[type=range]{width:100%;}
.bar{height:22px;border-radius:11px;margin:14px 0 6px;background:linear-gradient(90deg,#e34a4a 0%,#e3a84a 25%,#e3d84a 50%,#4ae3a0 60%,#4a9ee3 80%,#7a4ae3 100%);position:relative;}
.marker{position:absolute;top:-6px;width:4px;height:34px;background:#fff;border-radius:2px;}
.val{font-size:22px;color:#eecc80;font-weight:600;margin:12px 0 4px;}
.sub{font-size:13px;color:#8f8fa8;}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.btnrow button{background:#1a1c2b;border:1px solid #262838;color:#e6e6f0;padding:6px 10px;border-radius:12px;font-size:11px;cursor:pointer;}
.note{font-size:12px;color:#8f8fa8;margin-top:16px;border-top:1px solid #262838;padding-top:12px;}
</style></head>
<body><div class="wrap">
<p style="color:#eecc80;font-size:11px;letter-spacing:1px;text-transform:uppercase;">JAZMI</p>
<h1>Skala pH</h1>
<p>Skala logaritmik keempat dalam seri ini (Kelvin, desibel, Richter, sekarang pH) — tiap turun 1 angka pH, konsentrasi ion H⁺ naik 10×. pH 3 bukan "sedikit lebih asam" dari pH 6, tapi 1.000× lebih asam.</p>
<div class="bar"><div class="marker" id="marker"></div></div>
<input type="range" id="phSlider" min="0" max="14" value="7" step="0.1">
<p class="val" id="phOut"></p>
<p class="sub" id="ratioOut"></p>
<div class="btnrow" id="btns"></div>
<p class="note">[H⁺] relatif = 10^(7−pH), dibandingkan air murni (pH 7). pH &lt;7 asam, &gt;7 basa.</p>
</div>
<script>
const refs=[{n:'Asam lambung',p:1.5},{n:'Jeruk nipis',p:2},{n:'Cuka',p:2.5},{n:'Kopi',p:5},{n:'Air murni',p:7},{n:'Darah',p:7.4},{n:'Sabun',p:10},{n:'Pemutih',p:13}];
const s=document.getElementById('phSlider');
function u(){
  const p=parseFloat(s.value);
  const ratio=Math.pow(10,7-p);
  document.getElementById('phOut').textContent='pH '+p.toFixed(1);
  document.getElementById('ratioOut').textContent = ratio>=1
    ? '[H⁺] '+ratio.toLocaleString('id-ID',{maximumFractionDigits:0})+'× lebih pekat dari air murni (lebih asam)'
    : (1/ratio).toLocaleString('id-ID',{maximumFractionDigits:0})+'× lebih encer dari air murni (lebih basa)';
  document.getElementById('marker').style.left=(p/14*100)+'%';
}
s.addEventListener('input',u); u();
const b=document.getElementById('btns');
refs.forEach(r=>{
  const btn=document.createElement('button');
  btn.textContent=r.n+' (pH'+r.p+')';
  btn.onclick=()=>{s.value=r.p;u();};
  b.appendChild(btn);
});
</script>
</body></html>
