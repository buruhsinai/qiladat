{g:'Pembuka',ok:1,id:'muq',ar:'المقدمة',id:'muq',idn:'Mukadimah',
 note:'Pengarang: Abu ‘Ali bin Abil-Husain ash-Shufi, ditulis untuk Fakhr ad-Dawlah (gelar “Falak al-Ummah”, dilantik 374 H, wafat 387 H) sehingga kitab ditulis antara 374–387 H. Ia menadzamkan prosa ayahnya, <i>Kitab Suwar al-Kawakib ats-Tsabitah</i> (353 H), yang bersumber dari Almagest Ptolemeus. Riwayat 1 = naskah Istanbul (718 H, disalin dari naskah 519 H); 474 bait. «العادل الموحَّد» = Tuhan yang ditauhidkan orang beriman (muwahhad, bentuk pasif; harakat dicocokkan pada PDF hal. 73). Lafal «لفلك الأمة» ada di naskah Istanbul (yang paling asli) dan Dar al-Kutub no. 163; banyak naskah lain mentashhifnya «لملك الأمة»; sebagian memuat «أخي المعالي» sebagai ganti «أبي المعالي». Penerima menurut pensyarah yang paling kuat: Fakhr ad-Dawlah Abu al-Hasan ‘Ali bin Rukn ad-Dawlah bin Buwaih (Falak al-Ummah sejak 374 H) — bukan Fakhr Dinillah Syahansyah bin Majd ad-Dawlah, dan bukan tokoh Fatimiyah/Artuqiyah/Ayyubiyah yang diusulkan peneliti lain (syarah hal. 115–116). «الكواكب» di sini = bintang tetap, bukan planet: Arab dahulu memakai «النجم» dan «الكوكب» bermakna sama, dan membedakan planet sebagai «الكواكب السيارة/المتحيرة» (hal. 117).',

{g:'Utara',id:'dasg',ok:1,ar:'الدب الأصغر',idn:'Dubb Ashghar (Beruang Kecil / Ursa Minor)',
 note:'Rasi terdekat dengan kutub langit utara. 7 bintang di dalam gambar (+1 di luar gambar, magnitudo 4). Orang Arab menyebutnya <b>Banat Na‘sy ash-Shughra</b>; penomoran: 1–3 = <b>Banat</b> (ekor), 4–7 = <b>Na‘sy</b> (badan); 6 dan 7 = <b>al-Farqadan</b>, berjarak ±2 syibr (±7,5°) (syarah hal. 120, 125). «على صورة دب» bukan beruang utuh: rasi ini tak berkepala dan berkaki, hanya diserupakan dengan tujuh bintang pada tubuh dan ekor Dubb Akbar (3 di ekor, 4 di badan); disebut “Ashghar” karena bentuk dan jumlahnya sama tetapi lebih kecil (hal. 120, 124). «القطب الظاهر» = kutub utara langit yang tampak; kutub selatan tak tampak bagi pengamat di utara, dan keduanya titik, bukan bintang. <b>al-Jady</b> = Polaris, penunjuk kiblat. <b>Fa’s ar-Rahā</b> bukan hanya satu bintang kecil di bait 5: menurut Ash-Shufi dan Ibn Qutaibah ia gugus dua busur bintang yang saling berhadapan (disebut juga «قوس القطب») dengan kutub di tengahnya, diserupakan dengan pasak (fa’s) pada batu penggilingan; bintang kecil di bait itu hanya salah satu penyusunnya (hal. 137–140). Naskah Doha membaca syatr 1 bait 1 «أقربهن فاعلمن إلى القطب»; Istanbul: «أقربهن موضعاً من القطب».',

  4:'Pensyarah: Fa’s ar-Rahā bukan hanya satu bintang kecil ini. Menurut prosa Ash-Shufi dan Ibn Qutaibah, ia adalah gugus bintang: dua busur bintang yang saling berhadapan (disebut juga «قوس القطب»), dengan kutub di tengahnya — diserupakan dengan pasak (fa’s) pada batu penggilingan. Bintang kecil di bait ini (bintang pertama di luar gambar, magnitudo 4) hanya salah satu penyusunnya. Kutub sendiri bukan bintang melainkan titik; bintang terdekat dengannya adalah yang redup di dekat al-Jady. Syarah hal. 137–140.',

{g:'Utara',id:'dakb',ok:1,ar:'الدب الأكبر',idn:'Dubb Akbar (Beruang Besar / Ursa Major)',
 note:'Rasi Ursa Major (syarah cetak 152–175 = PDF 182–205; 34 bait). «Ar-Rūm» di sini = Yunani, yang menamainya Dubb Akbar. Menurut Ṣūfī: 27 bintang di dalam gambar + 8 di luar (bait tambahan dari naskah Museum Seni Islam, Doha, memuat jumlah ini). Tujuh bintang terangnya = <b>Banāt Na‘sy al-Kubrā</b>: tiga melengkung di ekor, empat berbentuk segi empat di badan, serupa Dubb Ashghar. <b>an-Na‘sy</b> pada bait 5 hanya empat bintang persegi (disebut juga «sarīr Banāt Na‘sy»); tujuh bintang seluruhnya = 4 Na‘sy + 3 Banāt (riwayat 2: «قد لقبتها النعش أهل البادية»). KOREKSI NAMA: bintang ke-5 dari tujuh bernama <b>al-Jaun</b> (bukan «al-Ḥūr»; «al-Ḥūr» muncul di naskah Gotha dan catatan pinggir Princeton, juga Lisān al-‘Arab/Jamharah, sedangkan «al-Jawzā’» pada Anwā’ Ibn Qutaibah tashhif dari «al-Jaun»); pelaut kemudian menamainya «al-Khāfī». <b>al-‘Anāq</b> (dengan fathah ‘ain; Mizar) = bintang ke-6, tengah dari tiga Banāt, «memeluk» <b>as-Suhā</b> (bintang kecil redup tepat di atasnya; juga as-Sitā, an-Nu‘aisy, ash-Shaidaq; tidak disebut Ptolemeus) — dari sinilah perumpamaan «أريها السها وتريني القمر» (menawarkan sesuatu tetapi dijawab dengan hal yang berlawanan). <b>al-Qā’id</b> = bintang ke-7 (ujung ekor; ke-27 Dubb Akbar); Ibn Qutaibah menghitung Banāt dari ujung ekor sehingga nomornya terbalik terhadap Ṣūfī, namanya sama. «Taḥta» (bait 18) menunjuk letak pada gambar Beruang (tangan kanan dan kedua kaki), bukan letak di langit. <b>al-Qafazāt</b> (juga an-Nawāfiz, an-Nafazāt, al-Qahīzāt, ats-Tsu‘ailibāt; naskah Istanbul «النواقز») = enam bintang yang berpasangan (muqtaranān; Ibn Qutaibah menyebut empat); «mā’in» = pendusta. <b>al-Hawdh</b> (bait 26) dalam kenyataan tidak kecil (lebih besar dari segi empat Na‘sy) dan bukan «mengikuti» Na‘sy melainkan mendahuluinya saat terbit; lingkarannya kosong tak berbintang. Bait 28–34 (kisah kijang yang lari dari Singa lalu tiba di al-Hawdh; Kabid al-Asad) dicatat dari matan; syarahnya belum dibaca ulang untuk bagian ini. Rinci per bait di kotak catatan pensyarah.',

  ['berada di ujung-ujung beruang ini,','dekat dengan Banat dan as-Suhā.'],
  ['Dan telah datang tentang mereka (sebutan) al-Qarā’in (“pasangan-pasangan”)','dari seorang perawi Badui yang tidak berdusta,'],
  ['dan kadang engkau menamainya an-Nawāfiz,','sebab ia jejak-jejak kijang-kijang yang melompat.'],
  ['Dan an-Nafazāt adalah nama bagi bintang-bintang berkilat itu,','dan al-Qahīzāt adalah nama yang diberikan orang Arab kepadanya.'],
  ['Dan menurut kebanyakan perawi,','ia juga dikenal dengan ats-Tsu‘ailibāt (“rubah-rubah kecil”).'],
  ['Mendahuluinya bintang-bintang kecil,','banyak, tak berbentuk (tak membentuk gambar),'],
  ['amat tersembunyi (sangat samar),','dikenal orang Arab dengan adh-Dzibā’ (“kijang-kijang”).'],
  ['Mendahuluinya sebidang kecil (ruang),','mengikuti Na‘sy, berbentuk bundar,'],
  ['kosong, tidak memuat satu bintang pun,','dinamai al-Hawdh (“kolam”) oleh orang-orang terdahulu.'],
  ['Itu karena para ulama menyebutkan','bahwa pada suatu hari kijang-kijang itu terkejut ketakutan'],
  ['oleh rupa Singa yang berada di dekat','bintang-bintang Beruang yang telah kami sebut,'],
  ['dan bahwa mereka, karena takut, melompat,','lalu beroleh bagian keselamatan dalam apa yang mereka capai;'],
  ['kemudian mereka mendatangi al-Hawdh dalam keadaan aman,','selamat dari kejahatan singa hutan.'],
  ['Maka tinggallah jejak-jejak mereka di atas tanah (lembap),','itulah al-Qafazāt, lompatan-lompatan kijang.'],
  ['Dan mengikuti rupa (Singa itu) sebuah bintang bercahaya,','yang dalam gelap malam kaulihat berkedip,'],
  ['yang oleh orang Arab dijadikan “hati” bagi Singa,','karena ia dekat dengan bentuk Singa itu.']],
 ck:{2:'Pensyarah: «الروم» di sini = Yunani (Rum); mereka menamai rasi ini Dubb Akbar (Beruang Besar). Tujuh bintang terangnya serupa susunan Dubb Ashghar: tiga melengkung di ekor, empat berbentuk segi empat di badan. Prosa Ash-Shufi mencatat 27 bintang di dalam gambar + 8 di luar. Syarah hal. 153.',
  4:'Pensyarah: «النعش» di bait ini hanya empat bintang persegi; dalam prosa Ash-Shufi disebut juga «سرير بنات نعش». Tujuh bintang seluruhnya = Banat Na‘sy al-Kubra (4 Na‘sy + 3 Banat). Riwayat kedua membacanya: «قد لقبتها النعش أهل البادية». Syarah hal. 153–154.',
  8:'KOREKSI NAMA — Pensyarah: nama bintang ini «الجون» (bukan «الحور»). «الحور» muncul di naskah Gotha dan catatan pinggir naskah Princeton (juga di Lisan al-‘Arab/Jamharah), sedangkan «الجوزاء» dalam Al-Anwa’ Ibn Qutaibah adalah tashhif dari «الجون». Pensyarah menguatkan «الجون» karena dipakai kebanyakan naskah Urjuzah dan Shuwar al-Kawakib, serta Marzuqi dan al-Mahri; Ash-Shufi teliti memilih nama dan menimbang kitab-kitab Anwa’. Bintang ke-5 dari tujuh, paling dekat dengan segi empat; kemudian juga dinamai «الخافي» oleh pelaut. Syarah hal. 158–162.',
  10:'Pensyarah: «عناق» (dengan fathah ‘ain) = bintang ke-6, yang tengah dari tiga Banat (Mizar), bernama demikian karena “memeluk” as-Suhā. Syarah hal. 162–163.',
  11:'Pensyarah: as-Suhā = bintang kecil redup tepat di atas ‘Anāq; nama lain: as-Sitā, an-Nu‘aisy, ash-Shaidaq. Ptolemeus tidak menyebutnya. Syarah hal. 163–164.',
  15:'Pensyarah: ini bunyi perumpamaan «أريها السها وتريني القمر» — dipakai untuk orang yang menawarkan sesuatu tetapi dijawab dengan hal yang berlawanan dengan maksudnya. Syarah hal. 164.',
  16:'Pensyarah: al-Qā’id = bintang ke-7 (ujung ekor), bintang ke-27 Dubb Akbar; Ibn Qutaibah menghitung Banat dari ujung ekor sehingga urutan nomornya terbalik terhadap Ash-Shufi, namanya sama. Syarah hal. 165.',
  17:'Pensyarah: «تحت» di sini menunjuk letak pada gambar Beruang (di tangan kanan dan kedua kakinya), bukan letak di langit terhadap bintang-bintang Na‘sy dan Banat. Naskah menggambarnya secara beragam; yang dipentingkan hanya agar pembaca tahu bentuknya. Syarah hal. 169.',
  19:'Pensyarah: «القرائن» = pasangan: al-Qafazāt ada enam bintang, tiap dua berpasangan (muqtaranān); Ibn Qutaibah menyebutnya empat bintang. «مائن» = pendusta (al-main = dusta). Syarah hal. 169–171.',
  25:'Pensyarah: «بقيعة صغيرة تالية للنعش» — dalam kenyataan al-Hawdh tidak kecil (lebih besar dari segi empat Na‘sy) dan bukan «mengikuti» Na‘sy, melainkan mendahuluinya saat terbit. Lingkaran itu kosong tak berbintang. Syarah hal. 175.'},

  gl:{21:'Pembacaan diperbaiki dari PDF 76 (200 dpi): «لتلكم» (HTML lama: «لتلك»).',22:'Pembacaan diperbaiki dari PDF 75 (200 dpi); syarah hal. 152 juga membaca «بالثعيلبات» (HTML lama: «بالغيليلات»).',28:'Urutan syatr diperbaiki dari PDF 76: syatr 1 «من صورة الليث الذي بالقرب», syatr 2 «ما ذكرنا من نجوم الدب» (HTML lama terbalik). Syarah hal. 152 mengutip varian «من صولة الليث».',1:'Bait tambahan dari naskah Museum Seni Islam (Doha): jumlah bintang 27 (+ 8 di luar gambar).',20:'Qafazat/nafazat/qahazat = nama2 “lompatan”. Naskah Istanbul membaca «النواقز» (catatan kaki hal. cetak 45, PDF 75).'}},
{g:'Utara',id:'tin',ok:1,ar:'التنين',idn:'Tinnin (Naga / Draco)',
 note:'Rasi <b>at-Tinnīn</b>: 30 bintang + 1 bintang terang (bait 2). Bintang pertama di lidah = <b>ar-Rāqish</b> (unta yang berlari kencang; dikutip syair Hassān); «الأيم» = ular (al-ḥayyah), yakni Tinnin sendiri (syarah hal. 187). <b>al-‘Awā’idz</b> = unta betina yang baru melahirkan: empat bintang dibayangkan sebagai induk-induk unta yang melindungi anaknya, <b>ar-Rubba‘</b> (anak unta yang lahir di awal musim semi; bintang kecil di tengah) (hal. 188). Nama «ar-Rifd» di bait 6 tidak ditemukan pensyarah pada Ibn ash-Shufi, al-Marzūqī, maupun Ibn Qutaibah; arti «rifd» (mangkuk besar) tak cocok, mungkin tashhif penyalin (hal. 188). Ancaman bagi ar-Rubba‘: <b>adz-Dzi’bān</b> (serigala), yang juga disebut <b>al-Harrān</b> (al-Harr = shaqr/elang) dan <b>al-‘Awhaqān</b> (al-‘Awhaq = gagak hitam atau burung lain; nama bagi dua bintang yang sama) (hal. 195–196). «an-Nasr» di bait 12 = an-Nasr al-Wāqi‘ (Vega), dekat di antara al-Farqadān dan al-‘Awā’idz, ikut melindungi ar-Rubba‘ (hal. 191). <b>ats-Tsāfī</b> = tiga bintang samar (bait 14; arti kata: batu penyangga periuk). <b>adz-Dzikh</b> = ḍab‘ jantan (hyena), bintang terang dekat Dzi’bān; bersama mereka “mengincar” ar-Rubba‘ tetapi dihalangi al-‘Awā’idz dan an-Nasr (hal. 197).',
 tbl:[["الراقص","≈ μ Dra (Alrakis); bintang di lidah Tinnin","Raqish"],["العوائذ","≈ ν, β, ξ, γ Dra (4 bintang)","‘Awā’idz"],["الربع","bintang kecil di tengah ‘Awā’idz (anak unta); «الرفد» di bait 6 kemungkinan tashhif","Rubba‘"],["الأثافي","3 bintang samar (≈ δ,ε,χ Dra)","Atsāfī"],["الذئبان / الحران / العوهقان","dua bintang yang sama; ≈ ζ & η Dra","Dzi’ban"],["أظفار الذئب","2 bintang gelap menyusul Atsāfī (≈ f & ω Dra)","Azhfār"],["الذيخ","hyena jantan; bintang terang dekat Dzi’ban (≈ ι Dra, Edasich)","Dzikh"]],
 tr:[
  ['Dan sesudahnya (datang) bintang-bintang Tinnin (Naga),','yang menguraikannya orang yang tuturnya kokoh.'],
  ['Jumlahnya tiga puluh bagi yang hendak menghitung,','dan satu lagi yang gemilang, bercahaya menyala.'],
  ['Yang pertama darinya sebuah bintang samar cahayanya,','tidak bersinar dan tidak pula besar.'],
  ['Ia dikenal dengan ar-Rāqish di kalangan kaum itu,','dan ia berada di ujung lidah sang Ular (al-Ayyim).'],
  ['Mengikutinya bintang-bintang yang berhimpun,','jumlahnya bila dihitung ada empat,'],
  ['mengelilingi sebuah bintang samar','yang dapat dilihat oleh orang bermata tajam lagi cerdas.'],
  ['Dan ar-Rifd pun tentangnya terdengar dari mereka,','ia dikenal di kalangan ulama dengan nama ar-Rubba‘.'],
  ['Dan keempat bintang besar itu,','telah sampai kepada kami kabar dari mereka'],
  ['bahwa mereka menyangkanya unta-unta betina yang baru beranak (‘awā’idz),','dan menyangka ar-Rifd berlindung kepada mereka,'],
  ['karena takut pada sebuah bintang yang mereka namai adz-Dzi’b (serigala),','yang kaulihat letaknya dekat dengannya.'],
  ['Mereka mengira ia mengincar ar-Rubba‘,','padahal dalam merampasnya tak ada harapan baginya,'],
  ['sebab bintang-bintang yang terang itu','menolak gangguan darinya sekuat tenaga.'],
  ['Dan an-Nasr (Burung Nasar) pun menaruh iba kepadanya,','maka sang serigala tak dapat mencapainya.'],
  ['Mengikutinya tiga bintang samar,','bukan yang cemerlang dan bukan yang bersinar,'],
  ['seperti bunga aqhuwan yang mulai mengering,','dikenal orang Arab dengan al-Atsāfī (“batu tungku”).'],
  ['Sesudahnya dua bintang gelap,','keduanya berdekatan satu sama lain.'],
  ['Keduanya, kata mereka, kuku-kuku sang serigala,','demikianlah kabar yang sampai dari mereka.'],
  ['Dan serigala itu bintang yang telah kami sebut kabarnya,','seakan kuku-kuku itu menyusuri jejaknya.'],
  ['Dan sesudah serigala ini ada pula serigala (lain),','wujudnya dekat dengan wujud (yang pertama).'],
  ['Orang Arab menamai kedua bintang itu semuanya,','ketahuilah, dengan adz-Dzi’bān (dua serigala) dan al-Harrān,'],
  ['dan al-‘Awhaqān pula telah kami dengar','dari setiap orang berilmu yang menguraikan panjang lebar.'],
  ['Menyusul keduanya sebuah bintang berkas cahayanya lebat,','menerangi orang yang memandang dalam kegelapan.'],
  ['Ia dikenal dengan adz-Dzikh di kalangan orang Arab,','kaulihat ia dekat dengan para serigala.']],
 ck:{
  3:'Pensyarah: «الأيم» = ular (al-ḥayyah), yakni Tinnin sendiri; bintang ini terletak di lidah Tinnin. ar-Rāqish = unta yang berlari kencang (dikutip syair Hassān). Syarah hal. 187.',
  6:'Pensyarah: ar-Rubba‘ = anak unta yang lahir di awal musim semi. Nama «الرفد» tidak ia temukan pada Ibn ash-Shufi (kitabnya), al-Marzuqi, maupun Ibn Qutaibah; arti «rifd» (mangkuk besar) tak cocok dengan bintang ini, mungkin tashhif dari penyalin. Syarah hal. 188.',
  8:'Pensyarah: «العوائذ» = unta betina yang baru melahirkan; keempat bintang dibayangkan sebagai induk-induk unta yang melindungi anaknya (ar-Rubba‘, bintang kecil di tengahnya). Syarah hal. 188.',
  12:'Pensyarah: «النسر» yang dimaksud = an-Nasr al-Wāqi‘ (Vega), yang letaknya dekat di antara al-Farqadān dan al-‘Awā’idz; ia digambarkan ikut melindungi ar-Rubba‘ dari serigala. Syarah hal. 191.',
  19:'Pensyarah: «الحرين» (al-Harr) = shaqr (elang); «العوهقين» (al-‘Awhaq) = gagak hitam, atau burung lain (nama al-akhayyil). Nama-nama itu bagi dua bintang yang sama. Syarah hal. 195–196.',
  22:'Pensyarah: «الذيخ» = ḍab‘ jantan (hyena), bintang terang di dekat Dzi’bān; bersama mereka ia “mengincar” ar-Rubba‘, tetapi dihalangi oleh al-‘Awā’idz dan an-Nasr. Syarah hal. 197.'},
 v:[

  gl:{3:'“Raqish” = yang berjalan cepat; unta yang berlari.'}},
{g:'Utara',id:'qay',ok:1,ar:'قيقاوس (الملتهب)',idn:'Qiqāwus / Mulhtahib (Cepheus)',
 note:'Rasi <b>Qiqāwus</b>: 8 + 3 = 11 bintang (bait 2). Nama yang benar menurut Ibn aṣ-Ṣalāḥ ialah «قيفاوس» (Kepheus, raja Etiopia); «قيقاوس» adalah tashhif yang masyhur. Orang Arab sebenarnya tidak menamainya «al-Multahib»: bagi mereka ia petak langit yang bintang-bintang sampingnya disebut ash-Shā’; redaksi riwayat kedua dinilai lebih tepat (syarah hal. 207–208). <b>ar-Rā‘ī</b> = bintang paling terang (γ Cep). <b>Kalb ar-Rā‘ī</b> = bintang kecil menyendiri dekat kaki kiri, terpisah dari ar-Rā‘ī; pensyarah condong pada bintang yang dilingkari di gambar (hal. 208–209, 214). <b>ash-Shā’ / al-Aghnām</b> = bintang-bintang redup di badan Qiqāwus dan antaranya dengan al-Jady; ar-Rā‘ī berbeda karena lebih terang (hal. 209). <b>al-Farq</b>: bacaan benar «الفرق» (belahan rambut di puncak kepala), bukan «القرن» (tanduk); Ibn ash-Shufi menolak «القرن» karena jarak kedua bintang itu seperti belahan rambut (hal. 211–212). <b>al-Qurhah</b> = belang putih di dahi kuda di antara kedua telinga; bintangnya amat kecil, dekat dua bintang al-Farq (hal. 212–213). <b>al-Qidr</b> = gugus bintang kecil redup berbentuk lingkaran, di atas dua bintang al-Farq (hal. 215).',
 tbl:[["الراعي","bintang paling terang (≈ γ Cep, Errai)","Rā‘ī"],["كلب الراعي","bintang kecil menyendiri dekat kaki kiri (≈ ρ / π Cep, identifikasi lama)","Kalb ar-Rā‘ī"],["الشاء / الأغنام","bintang-bintang redup di bawah Kalb ar-Rā‘ī dan di badan Qiqāwus","Shā’"],["كوكبا الفرق","dua bintang berkilau (≈ β Alfirk, α Alderamin Cep); «belahan rambut»","Farq"],["القرحة","bintang amat kecil di atas Farq; belang putih di dahi kuda (≈ ξ Cep)","Qurhah"],["القدر","gugus kecil redup berbentuk lingkaran di atas Farq","Qidr"]],
 tr:[
  ['Menyusul bintang-bintang yang telah berlalu,','bintang-bintang yang dinamai oleh bangsa Rum'],
  ['Qiqāwus, tetapi di kalangan Arab','ia dikenal di antara mereka dengan al-Multahib (“yang menyala”).'],
  ['Jumlahnya sebelas bintang,','yang terbit di kegelapan malam yang pekat.'],
  ['Yang pertama darinya sebuah bintang kecil,','tak punya cahaya di antara bintang-bintang.'],
  ['Menyusulnya bintang yang gemerlap sinarnya,','jarak antara keduanya sejarak satu depa.'],
  ['Dan di antara bintang ini dan yang pertama','ada bintang kecil wujudnya, tak tampak jelas,'],
  ['jarak antara keduanya kira-kira sehasta,','orang Arab mengenalnya sebagai Kalb ar-Rā‘ī (anjing sang penggembala).'],
  ['Kaulihat ia menyendiri dari yang serupa dengannya,','dan yang paling terang dikenal sebagai ar-Rā‘ī, dan'],
  ['para perawi berselisih tentang bintang-bintang selebihnya,','sehingga mereka tak sepakat mengenainya.'],
  ['Namun aku akan menyebut yang sahih','dan meninggalkan yang diperselisihkan lagi tertolak:'],
  ['(yaitu) sebuah bintang yang diikuti bintang-bintang kecil,','terlihat di bahu rupa ini,'],
  ['dan sebuah bintang gemilang di atas ikat pinggang,','didahului bintang-bintang yang tersusun rapi:'],

  ['di atas keduanya sebuah bintang amat kecil,','yang terhitung dalam gambar bagaimanapun dihitung,'],

  ['Kemudian kaulihat di bawah Kalb ar-Rā‘ī','bintang-bintang yang redup cahayanya,'],
  ['banyak dan kecil wujudnya,','dikenal dengan ash-Shā’ (domba) dan al-Aghnām (kambing-kambing).'],
  ['Kemudian kaulihat di tangan al-Multahib','dua bintang berkilau seperti nyala api,'],

 ck:{
  1:'Pensyarah: nama yang benar menurut Ibn aṣ-Ṣalāḥ ialah «قيفاوس» (Kepheus, raja Etiopia), bukan «قيقاوس» (tashhif yang masyhur). Orang Arab sebenarnya tidak menamai rasi ini «الملتهب»; bagi mereka ia petak langit yang bintang-bintang sampingnya disebut ash-Shā’; redaksi riwayat kedua dinilai lebih tepat. Syarah hal. 207–208.',
  6:'Pensyarah: Kalb ar-Rā‘ī = bintang kecil menyendiri dekat kaki kiri, terpisah dari ar-Rā‘ī yang lebih terang (al-Marzuqi juga membedakannya). Ia lebih condong pada bintang yang dilingkari di gambar. Syarah hal. 208–209, 214.',
  12:'Pensyarah: bacaan yang benar «الفرق» (belahan rambut di puncak kepala), bukan «القرن» (tanduk) seperti pada sebagian perawi; Ibn ash-Shufi menolak «القرن» karena jarak kedua bintang itu seperti belahan rambut. Syarah hal. 211–212.',
  14:'Pensyarah: «القرحة» = belang putih di dahi kuda di antara kedua telinga; bintangnya amat kecil, dekat dengan dua bintang al-Farq. Syarah hal. 212–213.',
  16:'Pensyarah: ash-Shā’ = bintang-bintang redup di badan Qiqāwus dan antaranya dengan al-Jady; ar-Rā‘ī berbeda darinya karena lebih terang. Syarah hal. 209.',
  19:'Pensyarah: al-Qidr = gugus bintang kecil redup yang membentuk lingkaran, di atas dua bintang al-Farq. Syarah hal. 215.'},

{g:'Utara',id:'awa',ok:1,ar:'العواء',idn:'‘Awwā’ (Penggembala / Boötes)',
 note:'Rasi Bootes (syarah cetak 224–236 = PDF 254–266; 12 bait). Bait pembuka punya tiga redaksi antarnaskah («حارس السماء» / «حارث السماء» dll.); pensyarah memilih «Hāris as-Samā’» (terjemah Yunani Arctophylax, “penjaga”) dan menganggap «Hāris» dan «Hāris as-Simāk» sebagai tashhif. <b>aṣ-Ṣannāj, aṣ-Ṣayyāḥ, an-Na‘‘ār, al-Baqqār</b> = terjemah dari Boōtēs (“yang berteriak”, “penggiring sapi”), bukan nama Arab asli; al-Baqqār boleh jadi karena Dubb Akbar dahulu dibayangkan sebagai pedati sapi. <b>adh-Dhibā‘</b> = hyena; tiga bintang samar di telapak tangan, bersama bintang kecil di kepala, bahu, dan tongkat (11 bintang); Ibn Qutaibah menempatkannya di bawah Banāt Na‘sy. <b>as-Simāk ar-Rāmih</b> = Arcturus, bintang ke-4 terterang di langit; «Rāmih» (penombak) untuk membedakannya dari as-Simāk al-A‘zal (Spica), karena dua bintang di sekelilingnya bagaikan tombak baginya; bintang samar di sekitarnya = <b>as-Silāh</b>; al-Marzūqī menyebutnya pula «dzū as-silāh». Dua bintang gelap di dekatnya = <b>Rāyat as-Simāk</b> (hanya terlihat oleh mata sangat tajam). Dua bintang di tumit (bersama bintang ke-16 di ujung tombak) = <b>Rāyat al-Fakkah</b> dan Tābi‘ as-Simāk; dalam Almagest mereka termasuk bintang gambar ‘Awwā’. Dalam kutipan pengarang, bintang ke-20 di betis kiri = <b>ar-Rumh</b> dan dua bintang penyertanya = as-Silāh; <b>‘adzabah</b> = secarik kain pada kepala tombak, tiap pasang bintang samar di ujung tombak disebut ‘adzabah, dan dua yang terang = ramh as-Simāk. Jangan tertukar dengan manzilah al-‘Awwā’. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['السماك الرامح','Arcturus α Boo','Simak Rāmih'],['تابع السماك / الرمح','Izar ε Boo','Tābi‘'],['الرمح','η Boo (Muphrid)','Rumh'],['راية السماك','η,τ,υ Boo','Rāyah Simāk'],['راية الفكة','ε,σ,ρ Boo','Rāyah Fakkah'],['الضباع / أولاد الضباع','bintang redup (κ2, ι, θ, λ)','Dhibā‘']],
 tr:[
  ['Kami mulai membahas bintang-bintang al-‘Awwā’,','yang dinamai Hāris as-Samā’ (Penjaga Langit).'],

  ['Dan ada pula sebuah bintang bagaikan meteor yang berkilau,','mereka menamainya as-Simāk ar-Rāmih (si “penombak”),'],
  ['bagi dua bintang di tengah rupa itu,','di sekeliling keduanya ada bintang-bintang kecil.'],
  ['Mendahuluinya sebuah bintang dari kedua itu,','dekat dengan dua bintang yang gelap;'],

 ck:{
  0:'Pensyarah: bait pembuka ini punya tiga redaksi antarnaskah («حارس السماء» / «حارث السماء» dll.); ia memilih «حارس السماء» (terjemah Yunani Arctophylax, “penjaga”) dan menganggap «حارث» dan «حارس السماك» sebagai tashhif. Nama-nama ini terjemahan Yunani, bukan nama Arab asli. Syarah hal. 224–228.',
  3:'Pensyarah: aṣ-Ṣannāj, aṣ-Ṣayyāḥ, an-Na‘‘ār, dan al-Baqqār adalah terjemah dari nama Yunani Boōtēs (“yang berteriak”, “penggiring sapi”), bukan nama Arab asli; al-Baqqār boleh jadi karena Dubb Akbar dahulu dibayangkan sebagai pedati sapi. Syarah hal. 226–227.',
  5:'Pensyarah: adh-Dhibā‘ = hyena; tiga bintang samar di telapak tangan, bersama bintang-bintang kecil di kepala, bahu, dan tongkat (11 bintang). Ibn Qutaibah menempatkannya di bawah Banat Na‘sy. Syarah hal. 231–232.',
  6:'Pensyarah: as-Simāk ar-Rāmih = Arcturus, bintang ke-4 terterang di langit; disebut «Rāmih» (penombak) untuk membedakannya dari as-Simāk al-A‘zal (Spica), karena dua bintang di sekelilingnya bagaikan tombak baginya; bintang-bintang samar di sekitarnya = as-Silāh. Syarah hal. 228, 232.',
  8:'Pensyarah: dua bintang gelap di dekat bintang itu dinamai Rāyat as-Simāk (“bendera as-Simāk”), hanya terlihat oleh orang bermata sangat tajam; al-Marzuqi juga menyebut as-Simāk ar-Rāmih dengan nama «ذو السلاح». Syarah hal. 234.',
  10:'Pensyarah: dua bintang di tumit (bersama bintang ke-16 di ujung tombak) disebut Rāyat al-Fakkah (“bendera Fakkah”) dan Tābi‘ as-Simāk; dalam Almagest mereka termasuk bintang gambar ‘Awwā’. Syarah hal. 235.',
  11:'Pensyarah: dalam kutipan Ibn ash-Shufi, bintang ke-20 di betis kiri disebut ar-Rumh (tombak) dan dua bintang yang menyertainya as-Silāh; dua bintang berdekatan di ikat pinggang (ke-17 dan 18) diserupakan dengan tombak, sedangkan «‘adzabah» = secarik kain yang diikat di kepala tombak; tiap pasang bintang samar di ujung tombak itu disebut ‘adzabah, dan dua yang terang = ramh as-Simāk. Syarah hal. 233, 236.'},

{g:'Utara',id:'fak',ok:1,ar:'الفكة',idn:'Fakkah / Iklil Syamali (Mahkota Utara / Corona Borealis)',
 note:'Rasi <b>al-Fakkah</b> (Mahkota Utara), disebut sesudah al-‘Awwā’ (bait 1): bintang-bintangnya samar membentuk lingkaran bercelah yang dikenal anak kecil maupun dewasa («seperti lingkaran jangka», bait 6). Orang awam menyebutnya <b>Qash‘at al-Aytām / al-Masākīn</b> (mangkuk anak yatim/orang miskin), sebab lingkaran bintangnya bercelah (gompal) seperti mangkuk pecah yang tak laku dijual (syarah hal. 245). Bintang terang di dalamnya = <b>Munīr al-Fakkah</b> (Alphecca), bintang kedua dari al-Fakkah, magnitudo kedua (hal. 244–245). «Iklīl» di bait 4 = al-Iklīl asy-Syamālī, untuk membedakannya dari al-Iklīl al-Janūbī (hal. 245). Ibn ash-Shufi mengaku tak punya kabar dari Arab tentang nama bintang-bintang ini, tetapi Ibn Qutaibah dan al-Marzūqī menyebut al-Fakkah (di belakang as-Simāk ar-Rāmiḥ) sebagai bintang melingkar bercelah (hal. 244).',
 tbl:[["منير الفكة","Alphecca α CrB; bintang kedua al-Fakkah, magnitudo 2","Munir"],["قصعة الأيتام / المساكين","lingkaran bintang bercelah (≈ Corona Borealis); nama awam; = al-Fakkah","Qash‘ah"]],
 tr:[

  ['sedang di kalangan ahli ilmu bintang','mereka dinamai al-Iklīl, begitu pula di kalangan bangsa Rum,'],

 ck:{
  1:'Pensyarah: bintang terang itu = Munir al-Fakkah (Alphecca), bintang kedua dari al-Fakkah, magnitudo kedua; kata Ibn ash-Shufi, bentuk lingkarannya dikenal anak kecil dan orang dewasa. Syarah hal. 244–245.',
  2:'Pensyarah: «قصعة الأيتام / المساكين» = mangkuk anak yatim/orang miskin; disebut demikian karena lingkaran bintang itu bercelah (gompal), seperti mangkuk yang pecah sehingga tak laku dijual. Syarah hal. 245.',
  3:'Pensyarah: «إكليل» di sini = al-Iklīl asy-Syamālī (Mahkota Utara), dinamai demikian untuk membedakannya dari al-Iklīl al-Janūbī. Syarah hal. 245.',
  4:'Pensyarah: meski Ibn ash-Shufi mengaku tak punya kabar dari Arab, Ibn Qutaibah dan al-Marzuqi menyebut al-Fakkah (di belakang as-Simāk ar-Rāmih) sebagai bintang melingkar bercelah. Syarah hal. 244.'},

{g:'Utara',id:'jat',ok:1,ar:'الجاثي على ركبته',idn:'Jāthī ‘alā Rukbatih (Herkules / Hercules)',
 note:'Rasi <b>al-Jāthī ‘alā Rukbatih</b> (Herkules). Bintang pertama di dahi/alis = <b>Kalb ar-Rā‘ī</b> (≈ Rasalgethi α Her), dekat bintang terang <b>ar-Rā‘ī</b>; ar-Rā‘ī lebih terang daripada Kalb ar-Rā‘ī tetapi termasuk rasi lain, al-Hawwā’, yang bersebelahan dengan Jāthī, di atas dahi al-Hawwā’; ia dibahas lagi pada rasi al-Hawwā’ (syarah hal. 252). Bintang-bintang yang berderet sesudahnya, redup dan ringan cahayanya, dinamai <b>an-Nasaq asy-Syāmī</b>: deretan dari tangan Jāthī melintasi dadanya ke tangan satunya; disebut Syāmī karena terbenam di sisi Syam (utara), berbeda dari an-Nasaq al-Yamānī yang terbenam di sisi Yaman (selatan). Deretan itu menyusul <b>Qash‘at al-Aytām</b> (= al-Fakkah) (hal. 255).',
 tbl:[["كلب الراعي","≈ Rasalgethi α Her; bintang pertama di dahi/alis Jāthī","Kalb Rā‘ī"],["الراعي","bintang lebih terang; milik rasi al-Hawwā’, bukan Jāthī","Rā‘ī"],["النسق الشامي","deretan bintang redup dari tangan Jāthī melintasi dada ke tangan satunya (≈ τ Ser, β,γ,κ,δ,λ,μ,ο,ν,ξ Her)","Nasaq Syāmī"]],
 tr:[['Kami sebutkan pula Jāthī yang bertumpu di atas lututnya','dan segala yang dihafal (dicatat) dalam rupanya'],['Yang pertama kami sebut dari bintang-bintangnya','ialah sebuah bintang di dahinya atau di alisnya'],['Orang Arab menjulukinya Kalb ar-Rā‘ī (Anjing Gembala)','di dekat sebuah bintang yang bersinar berkilau'],['(Bintang itu) dikenal dengan nama ar-Rā‘ī (Sang Gembala), dan ini lebih terang','letaknya di atas dahi al-Hawwā’'],['Penyebutannya akan datang nanti','apabila hitungan sampai kepada al-Hawwā’'],['Mengikutinya bintang-bintang yang berbaris','cahayanya sedikit dan redup'],['Bintang-bintang itu dijuluki an-Nasaq asy-Syāmī','dan ia menyusul Qash‘ah al-Aytām (Mangkuk Anak Yatim)'],['Bintang-bintang yang disebut ini','terletak pada kedua tangan dan dada gambar ini'],['seakan berbaris dalam satu deretan (nasaq)','tampak bagi pengamat apabila malam telah gelap']],
 ck:{3:'Syarah hal. 252: bintang kedua ini bernama ar-Rā‘ī, lebih terang daripada Kalb ar-Rā‘ī, tetapi termasuk rasi lain (al-Hawwā’) yang bersebelahan dengan Jāthī, di atas dahi al-Hawwā’; dibahas lagi pada rasi al-Hawwā’ karena bukan bagian bintang rasi ini.',6:'Syarah hal. 255: an-Nasaq asy-Syāmī = deretan bintang dari tangan Jāthī melintasi dadanya ke tangan satunya; disebut Syāmī karena terbenam di sisi Syam (utara), berbeda dari an-Nasaq al-Yamānī yang terbenam di sisi Yaman (selatan). Qash‘ah al-Aytām = al-Fakkah.'},

{g:'Utara',id:'sal',ok:1,ar:'السلياق',idn:'Saliyāq / Lūrā (Lira / Lyra)',
 note:'Rasi <b>as-Saliyāq</b> (Lira), dengan banyak nama: as-Saliyāq, al-Awz, al-Mi‘zafah, ash-Shanj, as-Sulahfāh, al-Lūrā’ (bait 1–3). Semuanya bukan Arab dan tak ada dalam kitab anwā’ Arab, melainkan dipinjam dari tradisi Yunani: Saliyāq dari <i>sambuke</i> (harpa), Lūrā dari <i>Lyra</i>, Sulahfāh (penyu) dari mitos cangkang penyu sebagai badan alat musik ini; asal nama al-Awz tak diketahui pensyarah (rasi terdekat bergambar angsa/ayam ialah ath-Thā’ir) (syarah hal. 265–267). Tiga bintangnya disebut an-Nasr; yang terang = <b>an-Nasr al-Wāqi‘</b> (Vega): dua bintang di sisinya dan bintang itu membentuk segitiga bak dua sayap terlipat, berbeda dengan an-Nasr ath-Thā’ir (Altair) yang sayapnya terbentang. Orang awam menyebut Wāqi‘ ini al-Ātsāfī; astronom Yunani menyebutnya al-Awzah (hal. 268–269). Bait 8–17 memuat kisah pengarang: seorang yang berlagak ahli dipermalukan di hadapan Taj al-Millah Abu Shuja‘ bin Rukn ad-Dawlah ketika ditanya tentang bintang ini dan menduganya al-‘Ayyūq.',
 tbl:[["النسر الواقع","Vega α Lyr; segitiga dengan dua bintang di sisinya (sayap terlipat) — beda dengan Nasr Thā’ir/Altair yang sayapnya terbentang","Nasr Wāqi‘"],["السلياق / الأوز / المعزفة / الصنج / السلحفاة / اللوراء","nama-nama non-Arab, dipinjam dari tradisi Yunani","Saliyāq"]],
 tr:[['Kini kami sebutkan, dalam satu deretan,','bintang-bintang yang dikenal dengan nama as-Saliyāq'],['Juga dengan al-Awz — ketahuilah — dan al-Mi‘zafah','ia dikenal dengan ash-Shanj oleh ahli pengetahuan'],['Dan dengan as-Sulahfāh (penyu) dan dengan al-Lūrā’','demikianlah dikabarkan oleh kitab-kitab anwā’'],['Bintang-bintang yang kau lihat cemerlang','tiga di antaranya dinamai an-Nasr (Rajawali)'],['Di antaranya ada sebuah bintang bersinar, termasyhur','cahayanya gemilang dan terang'],['Ia menyambar mata dengan cahayanya yang berkilau','orang Arab mengenalnya dengan nama Nasr Wāqi‘ (Rajawali yang Jatuh)'],['Dialah yang mempermalukan seorang pemuda beserta reputasinya','dan menyingkap orang malang itu dalam kejelekannya'],['Di hadapan sang tokoh agung, Tāj al-Millah','Abū Syujā‘ putra Rukn ad-Dawlah'],['Serta sekelompok ahli ilmu ini','semuanya berpandangan tajam dan paham'],['Ketika sang raja hendak mengujinya','sedang ia senantiasa menunggangi kehinaan'],['Bintang ini kala itu bersinar terang','nyaris menyambar pandangan mata'],['Pada malam yang hitamnya pekat laksana kelam','jejak-jejak (bintang) terhapus dari bola langit'],['Tak awan menutupinya, tak pula kabut','seakan ia api yang menyala-nyala'],['Maka (sang raja) bertanya kepada si bodoh: bintang apakah ini?','ia pun tetap dalam kebingungannya, gelisah'],['Ia menjawab: kukira itu al-‘Ayyūq','padahal ia selalu terlambat, didahului (dalam terbit)'],['Hampir saja sang raja mati tertawa','dan si malang itu malu karenanya, lalu menangis'],['Setiap orang yang menampakkan apa yang tak dikuasainya','akan dipermalukan di tengah khalayak oleh orang yang mengujinya']],
 ck:{0:'Syarah hal. 265–267: nama-nama ini (as-Saliyāq, al-Awz, al-Mi‘zafah, ash-Shanj, as-Sulahfāh, al-Lūrā’) bukan Arab dan tidak ada dalam kitab anwā’ Arab; semuanya dipinjam dari tradisi Yunani — Saliyāq dari sambuke (harpa), Lūrā dari Lyra, Sulahfāh (penyu) dari mitos cangkang penyu sebagai badan alat musik ini. Asal nama al-Awz tidak diketahui pensyarah; rasi terdekat bergambar angsa/ayam (ath-Thā’ir).',5:'Syarah hal. 268–269: disebut Nasr Wāqi‘ karena dua bintang di sisinya dan tiga bintang itu membentuk segitiga yang seakan dua sayapnya terlipat; berbeda dengan an-Nasr ath-Thā’ir (Altair) yang sayapnya terbentang. Orang awam menyebut Wāqi‘ ini al-Ātsāfī; para astronom Yunani menyebutnya al-Awzah.'},

{g:'Utara',id:'taa',ok:1,ar:'الطائر (الدجاجة)',idn:'Thā’ir / Dajājah (Angsa / Cygnus)',
 note:'Rasi <b>ath-Thā’ir</b> (Angsa), dalam matan «صورة تعرف بالدجاجة» (ad-Dajājah) (bait 2). Bintang-bintangnya terbit bersama Bima Sakti, dekat bintang-bintang Lūrā dan an-Nasr al-Wāqi‘ (bait 5–6). Jumlah <b>al-Fawāris</b> berbeda antarsumber: Ibn Qutaibah menyebut lima bintang berbaris di belakang Nasr Wāqi‘ dengan ar-Radf di belakangnya; al-Marzūqī dan Ṣūfī (Suwar al-Kawākib) menyebut empat, dan sebagian menambahkan bintang ke-9 pada sayap kanan sehingga lima. Matan ini mengikuti hitungan empat dan menjadikan <b>ar-Radf</b> bintang kelima; tabel syarah (hal. 278) mencantumkan lima bintang Fawāris terpisah dari Radf (Deneb) (hal. 276–277).',
 tbl:[["الردف","bintang terang besar; kelima di belakang empat Fawāris menurut matan (≈ Deneb α Cyg)","Radf"],["الفوارس","4 bintang menurut matan (Ṣūfī, al-Marzūqī); 5 menurut Ibn Qutaibah dan tabel syarah (≈ γ,δ,ε,ζ,κ Cyg)","Fawāris"]],

 ck:{2:'Syarah hal. 276–277: jumlah al-Fawāris berbeda antarsumber. Ibn Qutaibah menyebut lima bintang berbaris di belakang Nasr Wāqi‘ dengan ar-Radf di belakangnya; al-Marzūqī dan aṣ-Ṣūfī (Suwar al-Kawākib) menyebut empat, dan sebagian menambahkan bintang ke-9 pada sayap kanan sehingga lima, dengan ar-Radf di belakang. Matan ini mengikuti hitungan empat dan menjadikan ar-Radf yang kelima. Tabel syarah (hal. 278) mencantumkan lima bintang Fawāris terpisah dari Radf (Deneb).'},

{g:'Utara',id:'kur',ok:1,ar:'ذات الكرسي',idn:'Dzāt al-Kursī (Kasiopeia / Cassiopeia)',
 note:'Rasi <b>Dzāt al-Kursī</b> (Kasiopeia), diserupakan dengan ‘ans (unta betina yang kuat) (bait 1). Kelompok ini terbit sesudah an-Nasr ath-Thā’ir (Altair) terbit, dan lima bintang terangnya tampak jelas di Bima Sakti (syarah hal. 282). Lima bintang terang itu dipakai bersama oleh dua gambaran Arab: <b>Sanām an-Nāqah</b> (punuk unta betina) dan <b>al-Kaff al-Khadhīb</b> (telapak tangan berhenna Tsurayyā); kata Ibn Qutaibah, bagi yang mau ia telapak Tsurayyā, bagi yang mau ia punuk unta (hal. 285–287). Bintang-bintang di bawahnya tersebar di pelana, paha, dan ekor; bintang-bintang gelap yang bermula dari al-Kaff al-Khadhīb membentuk <b>‘Unuq an-Nāqah</b> (leher) (bait 6–8). Bait 9: kelompok naskah keempat membaca «بالكف» (bukan «بالعنق») dan pensyarah menilai maknanya lebih tepat — kepala unta ialah bintang-bintang yang bersambung dengan telapak (kaff) pada gambar al-Mar’ah al-Musalsalah, lalu bersambung dengan leher unta (hal. 299).',
 tbl:[["الكف الخضيب / سنام الناقة","5 bintang terang (≈ β + α,γ,δ,ε Cas); dua gambaran Arab untuk bintang yang sama","Kaff Khadhīb"],["عنق الناقة","deretan bintang gelap yang bermula dari al-Kaff (≈ π,ο,ξ,σ,ρ Cas)","‘Unuq"],["المسلسلة","rasi berikutnya; kepala unta bersambung ke telapaknya pada gambar al-Mar’ah al-Musalsalah","Musalsalah"]],
 tr:[['Setelahnya kami sebut Dzāt al-Kursī (Wanita Berkursi)','bintang-bintang yang diserupakan dengan seekor unta betina tangguh (‘ans)'],['Engkau melihatnya berkilau lagi gemerlap','salah satunya berada di punuk unta betina'],['Ia besar tubuhnya, bercahaya putih bersih','mengikuti an-Nasr apabila rajawali itu terbit'],['Ia dikenal di kalangan Arab dengan nama al-Kaff al-Khadhīb (Telapak Tangan Berhenna)','disebut dalam syair dan khotbah mereka'],['Di bawahnya ada bintang-bintang yang bercahaya','semuanya berada dalam (bentuk) gambar itu'],['Sebagian jatuh pada al-Qatab (pelana unta)','sebagian lagi di kedua paha dan di ekor'],['Mulai dari al-Khadhīb ada bintang-bintang','berderet teratur, semuanya redup'],['Bukan bintang gemerlap bila mereka terbit','mereka menjadikannya leher bagi unta betina'],['Kepalanya adalah bintang-bintang yang bersambung','dengan leher, dari bintang-bintang al-Musalsalah']],
 ck:{2:'Syarah hal. 282: an-Nasr di sini ialah an-Nasr ath-Thā’ir (Altair); kelompok ini terbit sesudah rajawali itu terbit, dan lima bintang terangnya terlihat jelas di Bima Sakti.',3:'Syarah hal. 285–287: lima bintang terang ini dipakai bersama oleh dua gambaran Arab — sebagai punuk unta betina (Sanām an-Nāqah) dan sebagai telapak tangan berhenna Tsurayyā (al-Kaff al-Khadhīb). Kata Ibn Qutaibah: bagi yang mau ia telapak Tsurayyā, bagi yang mau ia punuk unta.',8:'Syarah hal. 299: kelompok naskah keempat membaca «بالكف» (bukan «بالعنق») dan pensyarah menilainya lebih tepat maknanya — kepala unta betina adalah bintang-bintang yang bersambung dengan telapak (kaff) pada gambar al-Mar’ah al-Musalsalah; bintang-bintang itu lalu bersambung dengan leher unta.'},

{g:'Utara',id:'per',ok:1,ar:'برشاوش (حامل رأس الغول)',idn:'Birsyāwsy / Hāmil Ra’s al-Ghūl (Perseus)',
 note:'Rasi Perseus (syarah cetak 311–320 = PDF 341–350; 15 bait; bait 14 = tambahan Museum Seni Islam, Doha). Birsyāwsy adalah nama dan gambar Yunani; orang Arab tidak mengenal rasi ini dan memakai sebagian bintangnya sebagai <b>Yad ats-Tsurayyā</b> (tangan Tsurayyā) yang terentang. Bintang pertama sebenarnya bukan bintang tunggal: <b>as-Saḥābī</b> (<i>al-laṭkhah as-saḥābiyyah</i>) = sadīm (nebula), yaitu gugus ganda NGC 869 & 884 yang tampak seperti awan tipis; pada gambar Arab ia <b>Ma‘shim ats-Tsurayyā</b> (pergelangan) sekaligus <b>wasm an-nāqah</b> (cap pada paha unta; bersama Dzāt al-Kursī). Karena Birsyāwsy tak dikenal, bintang terang di siku dijadikan <b>Mirfaq ats-Tsurayyā</b> (mirfaq = sendi antara lengan bawah dan lengan atas, ‘adhud). <b>Ra’s al-Ghūl</b> (Algol) adalah nama Yunani yang dinisbahkan kepada ahli falak Yunani; pensyarah membedakannya dari <b>‘Unāq al-Ardh</b> — bintang lain di antara Qalb al-Hūt dan Mirfaq ats-Tsurayyā; ahli terdahulu (Ibn Qutaibah, al-Marzūqī) berselisih apakah keduanya sama. «An-Najm» (bait 15) = Tsurayyā, sehingga ‘ātiq an-najm = ‘ātiq Tsurayyā (bagian antara mankib/bahu dan leher). Bait 6 dibaca «شَتِيّا» (bukan «شيّا»). Rinci per bait di kotak catatan pensyarah.',
 tbl:[['المعصم (السحابي)','NGC 869/884','Ma‘shim'],['الساعد','η & γ Per','Sā‘id'],['المرفق','Mirphak α Per','Mirfaq'],['المأبض','σ Per','Ma’bidh'],['إبرة المرفق','ψ Per','Ibrah'],['العضد','δ,ν,ε Per','‘Adhud'],['المنكب','ξ Per','Mankib'],['العاتق','ο & ζ Per','‘Ātiq'],['عناق الأرض','bintang lain di antara Qalb al-Hūt dan Mirfaq ats-Tsurayyā; ahli terdahulu berselisih (Algol atau γ And); dibedakan pensyarah dari Ra’s al-Ghūl','‘Unāq Ardh'],['رأس الغول','Algol (β Per); nama Yunani','Ra’s al-Ghūl']],
 tr:[['Setelahnya (ada) Pembawa Kepala Ghul','gambar sesosok orang yang berdiri tegak lagi jangkung'],['menyerupai manusia yang tinggi perawakannya','di tangannya ada seekor ghul berkepala besar'],['Bintang-bintang ini di antara gugusan bintang','disebut Birsyāwsy oleh bangsa Rum (Yunani)'],['Yang pertama di antaranya sebuah bintang yang cahayanya samar','luput dari pencarinya di angkasa'],['Ia dikenal pada bangsa Rum sebagai as-Saḥābī (Berawan)','dan itulah yang disebut oleh orang Arab'],['sebagaimana kami dengar: Ma‘shim ats-Tsurayyā (Pergelangan Tsurayyā)','tak kuhafal apa pun tentangnya selain ini'],['Ia terletak pada lengan bawah gambar ini','diikuti bintang-bintang yang terang'],['Di antaranya ada sebuah bintang gemilang berkilau','yang memancarkan sinar bila engkau melihatnya'],['Ia berada pada lambung Birsyāwsy','tetapi bagi orang Arab ia dijadikan'],['siku bagi Tsurayyā, sebagaimana kami dengar','diikuti sebuah bintang apabila ia terbit'],['Menyamainya dalam tampak besar','bernama Ra’s al-Ghūl menurut bangsa Rum'],['Setelah bintang ini ada dua bintang','keduanya bagian dari Ghul, saling berdekatan'],['Keduanya adalah kaki gambar ini','di sekeliling keduanya banyak bintang'],['terang, dan sebagian redup','dari antara semuanya ada bintang-bintang yang bersinar'],['Dari antara semuanya, dua inilah yang dikenal','dijuluki dengan ‘Ātiq an-Najm']],
 ck:{2:'Syarah hal. 311–312, 316–317: Birsyāwsy (Perseus) adalah nama dan gambar Yunani; orang Arab tidak mengenal rasi ini dan memakai sebagian bintangnya sebagai Yad ats-Tsurayyā (tangan Tsurayyā) yang terentang.',3:'Syarah hal. 315: bintang pertama ini sebenarnya bukan bintang tunggal — as-Saḥābī / al-laṭkhah as-saḥābiyyah ialah sadīm (nebula), yakni gugus ganda NGC 869 & 884 yang tampak seperti awan tipis. Pada gambar Arab ia adalah Ma‘shim ats-Tsurayyā (pergelangan) sekaligus wasm an-nāqah (cap pada paha unta; bersama Dzāt al-Kursī).',9:'Syarah hal. 316–317: karena orang Arab tidak mengenal Birsyāwsy, bintang terang ini mereka jadikan Mirfaq ats-Tsurayyā (siku); mirfaq = sendi antara lengan bawah dan lengan atas (‘adhud).',10:'Syarah hal. 317–318: Ra’s al-Ghūl (Algol) adalah nama Yunani yang dinisbahkan kepada ahli falak Yunani; pensyarah menegaskan ia dibedakan dari ‘Unāq al-Ardh — bintang lain di antara Qalb al-Hūt dan Mirfaq ats-Tsurayyā; ahli sebelumnya berselisih apakah ‘Unāq al-Ardh itu Ra’s al-Ghūl atau bintang lain (Ibn Qutaibah, al-Marzūqī).',14:'Syarah hal. 320: «an-Najm» di sini ialah Tsurayyā (orang Arab menyebut Tsurayyā «an-Najm»), jadi ‘ātiq an-najm = ‘ātiq Tsurayyā; ‘ātiq = bagian antara mankib (bahu) dan leher.'},

{g:'Utara',id:'mam',ok:1,ar:'ممسك الأعنة',idn:'Mumsik al-A‘innah / ‘Innāz (Auriga)',
 note:'Rasi Auriga (syarah cetak 329–344 = PDF 359–374; 13 bait). «Al-‘Innāz/al-‘Attāz» adalah sebutan para munajjim pengikut Yunani, bukan nama Arab asli: pria pemegang kambing dan dua anak kambing; «Mumsik al-A‘innah» (pemegang tali kekang) = «qā’id», «al-Ghāyah» = panji. «يفرين نورا حجب الدجنة» = cahaya bintang-bintang ini menyingkap tirai kegelapan. <b>al-Fanīq</b> = ad-Dabarān. <b>al-‘Ayyūq</b> (Capella; bintang keenam paling terang, di utara Jazirah Arab) terbit sebelum Dabarān dan menjadi tanda terbitnya Tsurayyā; juga <b>Raqīb an-Najm</b> («an-Najm» = Tsurayyā; raqīb = bintang yang tenggelam ketika pasangannya terbit; as-Simāk ar-Rāmih pun disebut Raqīb). Penyair Khuwailid bin Khālid = Abū Dzu’ayb al-Hudzalī (bait «فوردن والعيوق مقعد رابئ الضرباء…»; riwayat «فوق النظم» dinilai lebih tepat karena sesuai pemandangan langit). Syarah mencetak «ذا الشمال» (Istanbul «ذا التمثال»): al-‘Ayyūq di bahu kiri sosok Mumsik al-A‘innah. <b>al-‘Inz</b> dan <b>al-Jadyān</b> (Capella dan Haedi) bukan nama Arab asli melainkan terjemahan Yunani (Kunitzsch; Ibn aṣ-Ṣalāḥ). <b>al-A‘lām/at-Tawābi‘</b> = nama pada bintang-bintang Mumsik al-A‘innah (Ibn Qutaibah: tiga bintang di belakang al-‘Ayyūq); syarah mengaitkan penamaan Yunani dengan Aratus (<i>Phaenomena</i>). Syarah mengutip matan versi lain (bait pembuka «والشرق يبدي بعدهن أنجما…» dan baris al-Khibā’) yang bukan riwayat 1. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['العيوق / رقيب الثريا','Capella (α Aur); bintang keenam paling terang','‘Ayyūq'],['العنز / الجديان','Capella dan Haedi; terjemahan Yunani, bukan nama Arab asli','‘Inz / Jadyān'],['الفنيق','nama lain ad-Dabarān','Fanīq'],['الأعلام / التوابع','bintang pengikut al-‘Ayyūq (tiga bintang di belakangnya menurut Ibn Qutaibah)','A‘lām']],
 tr:[['Menyertainya bintang-bintang al-‘Innāz','yang dikenal dengan (nama) al-Ḥijāz'],['Dengan (nama) Pemegang Panji dan Tali Kekang','mereka menyibak, dengan cahaya, tirai-tirai kegelapan'],['Di antaranya ada sebuah bintang bersinar, besar','bintang-bintang (lain) tampak kecil dibanding ukurannya'],['Ia terbit sebelum terbitnya al-Fanīq','orang Arab mengenalnya dengan nama al-‘Ayyūq'],['Ia juga kadang dinamai Raqīb an-Najm (Pengawas an-Najm)','demikian dikabarkan oleh ahli ilmu'],['Dialah yang telah kami dahului menyebutnya','Khuwailid bin Khālid dalam syairnya'],['Selain dia juga menyebutnya dalam perumpamaan-perumpamaan','dan ia berada pada bahu pemilik gambar ini'],['Menyusulnya sebuah bintang yang lebih kecil darinya dalam besarnya','tetapi ia tidak samar dan tidak gelap'],['Setelahnya ada dua bintang yang mengikutinya','dalam limpahan cahaya keduanya menyerupainya'],['Ketiganya membentuk segitiga yang panjang','terbit setelah terbitnya al-Ghūl'],['Yang tunggal di antaranya dikenal dengan nama al-‘Inz (kambing betina)','oleh penduduk pedalaman, dan aku pun mendengar tentangnya'],['Julukan bagi keduanya — ketahuilah — masing-masing','dari dua yang mengikuti al-‘Inz itu, ialah al-Jadyān (dua anak kambing)'],['Dan semua bintang cemerlang ini','dikenal dengan nama al-A‘lām (Panji-panji) dan at-Tawābi‘ (Pengikut)']],
 ck:{0:'Syarah hal. 329–333: «al-‘Innāz/al-‘Attāz» adalah sebutan para munajjim (ahli hisab yang mengikuti Yunani), bukan nama Arab asli; ia sosok pria pemegang kambing dan kambing kecil. «Mumsik al-A‘innah» (pemegang tali kekang) = «qā’id», dan «al-Ghāyah» = panji. Syarah mengutip matan versi lain (bait pembuka «والشرق يبدي بعدهن أنجما…» dan baris al-Khibā’) — bukan riwayat 1.',1:'Syarah hal. 333: «يفرين نورا حجب الدجنة» = cahaya bintang-bintang ini menyingkap/merobek tirai kegelapan.',3:'Syarah hal. 337–338: al-Fanīq = ad-Dabarān. Al-‘Ayyūq bintang keenam paling terang, terbit sebelum Dabarān, dan menjadi tanda terbitnya Tsurayyā (Capella; di utara Jazirah Arab).',4:'Syarah hal. 338–339: «an-Najm» di sini ialah Tsurayyā (orang Arab menyebut Tsurayyā «an-Najm»). «Raqīb» adalah nama diri sekaligus sifat: dalam siklus manzilah, raqīb ialah bintang yang tenggelam ketika pasangannya terbit; as-Simāk ar-Rāmih juga disebut Raqīb.',5:'Syarah hal. 340–341: Khuwailid bin Khālid = Abū Dzu’ayb al-Hudzalī; yang dikutip ialah bait «فوردن والعيوق مقعد رابئ الضرباء…» (an-najm = Tsurayyā; riwayat «فوق النظم» dinilai lebih tepat karena sesuai pemandangan langit).',6:'Syarah hal. 341–342: syarah mencetak «ذا الشمال» (riwayat 1 Istanbul: «ذا التمثال») dan menafsirkannya: al-‘Ayyūq terletak pada bahu kiri sosok Mumsik al-A‘innah.',12:'Syarah hal. 344: al-A‘lām/at-Tawābi‘ = nama yang diberikan orang Arab pada bintang-bintang Mumsik al-A‘innah (menurut Ibn Qutaibah: tiga bintang di belakang al-‘Ayyūq). Syarah mengaitkan penamaan Yunani dengan Aratus (Phaenomena).',10:'Syarah hal. 342–343: «al-‘Inz» dan «al-Jadyān» bukan nama Arab asli melainkan terjemahan nama Yunani (Capella dan Haedi); Ibn Qutaibah dan al-Marzūqī tidak menyebutnya dari orang Arab (Paul Kunitzsch; Ibn ash-Shalāh). Gambar Yunani: pria memegang tali kekang, membawa seekor kambing dan dua anak kambing.'},

{g:'Utara',id:'haw',ok:1,ar:'الحواء والحية',idn:'Hawwā’ wal-Hayyah (Ophiuchus & Serpens)',
 note:'Rasi Ophiuchus dan Serpens (syarah cetak 352–364 = PDF 382–394; 13 bait). Hawwā’ = pria berdiri yang menggenggam ular (<b>al-Ḥayyah</b>; «ar-raqshā’» = ular bergaris-bintik); «mumsik al-ḥubāb» = Hawwā’ yang memegang ular. Kedua rasi saling berkait; «جملته» (bait 2) merujuk keterangan di rasi al-Jātsī. Bagi Arab seluruh kawasan Jātsī–Hawwā’–Ḥayyah itu satu bidang: <b>an-Nasaqān</b> (asy-Syāmī & al-Yamānī; an-Nasaq al-Yamānī = satu baris bintang dari dekat pergelangan al-Jātsī/Fakkah ke Majarrah dekat Syaulah dan an-Na‘ām), <b>ar-Rā‘ī</b> dan dua <b>Kalb ar-Rā‘ī</b> (satu di dahi al-Jātsī, satu di bahu Hawwā’), <b>al-Aghnām</b> (bintang di antara dua nasaq, selain ar-Rā‘ī dan kedua kalb) dan <b>ar-Rawdhah</b> (kawasannya). Arab mengenal dua «ar-Rā‘ī» (kawasan Hawwā’ dan al-Multahib/Bootes); ar-Rā‘ī di sini terletak pada wajah gambar Hawwā’, sedangkan di rasi al-Jātsī dikatakan «فوق جبين الحوّا» — perbedaan penggambaran antarnaskah, kecil. Ar-Rā‘ī bersama Nasr Wāqi‘ dan Nasr Thā’ir membentuk «segitiga musim panas» (<i>mutsallats ash-shayf</i>). <b>an-Naqad/an-Nuqqad</b> = domba kecil (bintang redup dinamai hewan kecil); arti «الكُنْدُر» tidak ditemukan di halaman yang dibaca. Bait 9: «على الحية» benar (Istanbul «على الجبهة» = tashhif). Rinci per bait di kotak catatan pensyarah.',
 tbl:[['الراعي','bintang di kawasan Hawwā’ (≈ Rasalhague, α Oph); Arab mengenal dua ar-Rā‘ī','Rā‘ī'],['كلب الراعي','dua: satu di dahi al-Jātsī, satu di bahu Hawwā’ (≈ Cebalrai, β Oph)','Kalb ar-Rā‘ī'],['النسق اليماني','satu baris bintang dari dekat pergelangan al-Jātsī/Fakkah ke Majarrah (≈ δ, ε, υ, η, ζ, ξ Oph; α, ε, ν Ser)','Nasaq Yamānī'],['الأغنام / الروضة','bintang di antara dua nasaq; kawasannya','Aghnām / Rawdhah'],['النقد','domba kecil (bintang redup)','Naqad']],
 tr:[['Menyertainya bintang-bintang al-Hawwā’','dan seekor ular berbelang-belang di tangannya'],['Telah berlalu kabar tentang gugusannya','dalam gambar Sang Berlutut pada lututnya'],['Yang pertama kami sebut dari bintang-bintangnya','sebuah bintang pada lubang hidungnya atau mulutnya'],['Ia bersama kedua Nasr berada di hamparan yang datar','seperti bentuk segitiga yang bergaris'],['Ia dikenal sebagai ar-Rā‘ī (Gembala) oleh orang Arab','diikuti (bintang) dari Pemegang Ular (Mumsik al-Ḥubāb)'],['Sebuah bintang bersinar pada bahu','dikenal orang Arab sebagai Kalb ar-Rā‘ī (Anjing Gembala)'],['Dan mulai dari pergelangan Sang Berlutut pada','lututnya, bintang-bintang yang bercahaya'],['Menyambung menjadi satu garis dari bintang-bintang gemerlap','berkilau, tubuh-tubuhnya menyilaukan'],['Sebagian di atas ular, dan sebagian lagi di','ujung-ujung jari Hawwā’, dan semuanya bersinar'],['Memenuhi mata si pengamat di kegelapan','mereka menamainya an-Nasaq al-Yamānī (Barisan Yaman)'],['Sebagian orang berkata bahwa ia menamai','semua yang kaulihat dari bintang-bintang'],['yang ada di antara dirinya dan an-Nasaq asy-Syāmī','selain yang telah kujelaskan sebagai al-Aghnām (domba-domba)'],['Dan kawasan itu dikenal sebagai ar-Rawdh (taman), dan telah','kudengar bintang-bintangnya disebut al-Kundur an-Nuqqad']],
 ck:{0:'Syarah hal. 352: Hawwā’ (Ophiuchus) = pria berdiri yang menggenggam ular (al-Ḥayyah/Serpens); ar-raqshā’ = ular yang bergaris dan berbintik. Kedua rasi saling berkait.',1:'Syarah hal. 352–353: «جملته» merujuk pada keterangan di rasi al-Jātsī. Bagi orang Arab seluruh kawasan langit Jātsī–Hawwā’–Ḥayyah itu satu bidang: an-Nasaqān (asy-Syāmī & al-Yamānī), ar-Rā‘ī dan kedua kalb-nya, ar-Rawdhah dan al-Aghnām.',3:'Syarah hal. 354: ar-Rā‘ī bersama Nasr Wāqi‘ dan Nasr Thā’ir membentuk segitiga besar (orang Arab: “segitiga musim panas”, mutsallats ash-shayf).',4:'Syarah hal. 355: «ممسك الحُباب» = Hawwā’ yang memegang ular (al-ḥubāb = al-ḥayyah). Syarah hal. 363–364: orang Arab mengenal dua «ar-Rā‘ī» (satu di kawasan Hawwā’, satu di al-Multahib/Bootes, masing-masing dengan kalb dan domba-dombanya). Pensyarah mencatat ar-Rā‘ī di sini terletak pada wajah gambar Hawwā’, sedangkan di rasi al-Jātsī dikatakan «فوق جبين الحوّا» — perbedaan penggambaran antarnaskah, kecil.',5:'Syarah hal. 355: bintang pada bahu ini ialah Kalb ar-Rā‘ī kedua; Kalb ar-Rā‘ī lainnya berada pada dahi al-Jātsī.',8:'Syarah hal. 356 (nota kaki 1): naskah Istanbul dan kelompok 1–2 membaca «على الجبهة» — keliru; yang benar «على الحية» (kelompok 3–4; juga Princeton 2259 dan Gotha).',9:'Syarah hal. 356–357: an-Nasaq al-Yamānī = satu baris bintang yang mulai dekat pergelangan al-Jātsī / dekat Fakkah dan berakhir di Majarrah dekat Syaulah dan bintang-bintang an-Na‘ām.',10:'Syarah hal. 356, 359: sebagian orang Arab menyebut semua bintang di antara kedua nasaq (selain ar-Rā‘ī dan kedua kalb) sebagai al-Aghnām; kawasannya ar-Rawdhah (ar-Rawdh).',12:'Syarah hal. 356: an-Naqad/an-Nuqqad = domba kecil (orang Arab menamai bintang redup dengan hewan kecil). Arti «الكُنْدُر» tidak dijelaskan di halaman yang dibaca (PDF 382–390).'},

{g:'Utara',id:'sah',ok:1,ar:'السهم',idn:'Sahm (Panah / Sagitta)',
 note:'Rasi Sagitta (syarah cetak 369–370 = PDF 399–400; 3 bait). Lima bintang di antara paruh Dajājah dan Nasr Thā’ir, di jalur Bima Sakti; orang Arab tidak punya nama untuk bintang-bintangnya. Yang paling terang (di mata panah) kira-kira magnitudo 3,5 — sebanding bintang uji penglihatan as-Suhā. «تكاد تنكرها الأبصار» = mata nyaris luput melihatnya karena kecil dan redup. Syarah mengutip dua baris tambahan («كأنما النسر عليه قد قبض…» / «موقعها في حافة المجرة…») yang tidak ada di riwayat 1. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['السهم','lima bintang kecil di antara paruh Dajājah dan Nasr Thā’ir (≈ α, β, γ, δ, ζ Sge); tak bernama Arab','Sahm']],

 ck:{0:'Syarah hal. 369–370: as-Sahm = 5 bintang di antara paruh Dajājah dan Nasr Thā’ir, di jalur Bimasakti; orang Arab tidak punya nama untuk bintang-bintangnya. Yang paling terang (di mata panah) kira-kira magnitudo 3,5 — sebanding bintang uji penglihatan as-Suhā. Syarah mengutip dua baris tambahan («كأنما النسر عليه قد قبض…» / «موقعها في حافة المجرة تحت نجوم النسر مستقرة») — bukan di riwayat 1.',1:'Syarah hal. 369: «تكاد تنكرها الأبصار» = mata nyaris luput melihatnya karena kecil dan redup cahayanya.'},

{g:'Utara',id:'uqa',ok:1,ar:'العقاب',idn:'‘Uqāb (Elang / Aquila)',
 note:'Rasi Aquila (syarah cetak 378–386 = PDF 408–416; 6 bait). <b>an-Nasr ath-Thā’ir</b> = tiga bintang berbaris lurus (Altair dan dua bintang di sisinya); Thā’ir (terbang) karena sayapnya terbentang, berbeda dari an-Nasr al-Wāqi‘ (Lyra) yang sayapnya terlipat; kedua bintang di sisi = «sayap». Kaum awam menamai ketiganya <b>al-Mīzān</b> (neraca) karena berbaris lurus dan yang tengah seimbang di antara dua lainnya (al-Marzūqī, Ṣūfī); nama ini tidak disebut Ṣūfī dalam urjūzahnya. <b>aẓ-Ẓilmān</b> = burung unta jantan; menurut pensyarah di sini mencakup keenam bintang di luar gambar, sedangkan dalam kitab Ṣūfī hanya dua bintang kecil disebut «aẓ-Ẓalīmān». Paul Kunitzsch menduga penamaan ι & λ Aql «aẓ-Ẓalīmān» (Ṣūfī) keliru karena Ibn Qutaibah dan al-Marzūqī memaksudkan dua bintang lain (cetak 386). Syarah mencetak dua bait pengganti dari naskah kelompok ke-3 («وخلفه كواكب كثيرة… / فيهن نجمان منوران…») yang tidak ada di riwayat 1. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['النسر الطائر','Altair (α Aql) dan dua bintang di sisinya','Nasr Thā’ir'],['الجناحان','β & γ Aql; «sayap» yang terbentang','Janāhān'],['الميزان (العامة)','tiga bintang berbaris lurus menurut kaum awam','Mīzān'],['الظليمان','ι & λ Aql menurut Ṣūfī; Kunitzsch meragukan','Ẓalīmān']],
 tr:[['Menyertainya bintang-bintang al-‘Uqāb (Elang)','yaitu yang dinamai oleh orang Arab'],['Dengan (nama) an-Nasr ath-Thā’ir, dan ia bintang-bintang','bercahaya, sedangkan sebagiannya redup'],['Di antaranya ada sebuah bintang bercahaya menyilaukan','dialah yang dinamai an-Nasr ath-Thā’ir (Rajawali Terbang)'],['Ia diikuti sebuah bintang, dan sebuah bintang mendahuluinya','keduanya sayapnya, sepanjang yang kami ketahui'],['Menyertainya bintang-bintang yang banyak','berada di luar bentuk gambar ini'],['Mereka berada di dekat sang Rajawali, berdekatan','orang Arab mengenalnya dengan nama aẓ-Ẓilmān (burung unta jantan)']],
 ck:{2:'Syarah hal. 378–380: «an-Nasr ath-Thā’ir» = tiga bintang berbaris lurus (Altair dan dua bintang di sisinya); disebut Thā’ir (terbang) karena sayapnya terbentang, berbeda dari an-Nasr al-Wāqi‘ (Lyra) yang sayapnya terlipat.',3:'Syarah hal. 378, 380–383: kedua bintang di sisi = “sayap”. Kaum awam menamai tiga bintang itu al-Mīzān (neraca) karena berbaris lurus dan yang tengah seimbang di antara dua lainnya (al-Marzūqī, aṣ-Ṣūfī); nama ini tidak disebut aṣ-Ṣūfī dalam urjūzahnya.',5:'Syarah hal. 383–384: «aẓ-Ẓilmān» = burung unta jantan; menurut pensyarah, di sini mencakup keenam bintang di luar gambar, sedangkan dalam kitab aṣ-Ṣūfī hanya dua bintang kecil disebut «aẓ-Ẓalīmān». Paul Kunitzsch menduga penamaan ι & λ Aql «aẓ-Ẓalīmān» (aṣ-Ṣūfī) keliru, karena sumber lain (Ibn Qutaibah, al-Marzūqī) memaksudkan dua bintang lain (cetak 386). Syarah mencetak dua bait pengganti dari naskah kelompok ke-3 («وخلفه كواكب كثيرة… / فيهن نجمان منوران…») — bukan di riwayat 1; cek di riwayat 2.'},

{g:'Utara',id:'dul',ok:1,ar:'الدلفين',idn:'Dulfīn (Lumba-lumba / Delphinus)',
 note:'Rasi Delphinus (syarah cetak 392–396 = PDF 422–426; 8 bait). «Yanjum» = terbit dan tampak; ad-Dulfīn muncul setelah an-Nasr ath-Thā’ir naik di ufuk. Sepuluh bintang di antara Nasr Thā’ir dan Dajājah; empat yang paling terang membentuk pola khas. <b>aṣ-Ṣalīb</b> / <b>Ṣalīb ath-Thā’ir</b> = sebutan kaum awam (Ṣūfī, al-Marzūqī) karena dekat Nasr Thā’ir; orang Arab menamainya <b>al-Qa‘ūd</b> (unta jantan muda; Ibn Qutaibah dan al-Marzūqī: keempat bintang itu terbenam ketika Suhail terbit dan terbit ketika asy-Sya‘rā terbenam; varian «al-‘Uqūd» pada cetakan Ibn Qutaibah, yang lebih sahih al-Qa‘ūd). <b>‘Amūd aṣ-Ṣalīb</b> = bintang kecil terpisah dari keempat bintang al-Qa‘ūd, bagaikan tiang bagi salibnya (ε Del), di pangkal ekor; «الكرين» = jamak «kurah» (bola langit), letaknya dikenal dari gambar pada bola langit dan kitab. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['القعود / الصليب','empat bintang paling terang dengan pola khas (≈ α, β, γ, δ Del)','Qa‘ūd'],['عمود الصليب','bintang kecil terpisah di pangkal ekor (ε Del)','‘Amūd']],
 tr:[['Setelahnya ada ad-Dulfīn (Lumba-lumba), berupa bintang-bintang','semuanya tampak terbit apabila an-Nasr muncul'],['Jumlahnya sepuluh, berhimpun','dari antaranya empat bintang bercahaya'],['Keempat bintang terang ini','semuanya dikenal dan termasyhur'],['Mereka bersinar di kegelapan bagi para pengamat','dan dinamai Shalīb ath-Thā’ir (Salib Sang Burung)'],['Orang Arab juga menamainya al-Qa‘ūd','demikian dikabarkan para perawi dan kitab-kitab'],['Di bawah al-Qa‘ūd ada sebuah bintang kecil','tetapi berkilau dan terang'],['Ia dinamai ‘Amūd (tiang) bagi Shalīb an-Nasr (Salib Sang Rajawali)','demikian dikabarkan kepada kami oleh ahli kabar'],['Ia termasuk ad-Dulfīn, di pangkal ekornya','sebagaimana kaulihat pada bola-bola langit dan kitab-kitab']],
 ck:{0:'Syarah hal. 392: «ينجم» = terbit dan tampak; ad-Dulfīn muncul setelah an-Nasr ath-Thā’ir naik di ufuk. Ada 10 bintang di antara Nasr Thā’ir dan Dajājah; empat yang paling terang membentuk pola khas.',3:'Syarah hal. 392–394: «Shalīb» (Salib) / «Shalīb ath-Thā’ir» adalah sebutan kaum awam (disebut aṣ-Ṣūfī dan al-Marzūqī), karena letaknya dekat Nasr Thā’ir; orang Arab sendiri menamainya al-Qa‘ūd.',4:'Syarah hal. 395: al-Qa‘ūd = unta jantan muda; Ibn Qutaibah & al-Marzūqī: keempat bintang itu terbenam ketika Suhail terbit dan terbit ketika asy-Sya‘rā terbenam. Syarah mencatat varian «al-‘Uqūd» dalam cetakan Ibn Qutaibah; yang lebih sahih al-Qa‘ūd.',6:'Syarah hal. 395–396: «‘Amūd ash-Shalīb» = bintang kecil yang terpisah dari keempat bintang al-Qa‘ūd, bagaikan tiang bagi salibnya (ε Del).',7:'Syarah hal. 396: «الكرين» = jamak «kurah» (bola langit); letak bintang ini di pangkal ekor Dulfīn dikenal dari gambar pada bola langit dan kitab.'},

{g:'Utara',id:'qit',ok:1,ar:'قطعة الفرس',idn:'Qith‘at al-Faras (Kuda Kecil / Equuleus)',
 note:'Rasi Equuleus (syarah cetak 399–400 = PDF 429–430; 3 bait). Hanya memuat bagian kepala kuda (dari gambar Pegasus) sehingga disebut «potongan kuda»; empat bintangnya nyaris tak terlihat karena redup, seperti tulisan lama yang pudar. Karena redup dan bukan bintang penunjuk maupun manzilah bulan, orang Arab tidak menamainya. Rasi ini dekat ε Peg yang disebut Jahfalat al-Faras («bibir kuda»; dari letaknya pada mulut kuda, bukan nama Arab); Ṣūfī menyebut Sa‘d an-Nuhā sebagai bintang terdekat. Syarah mencetak baris tambahan (salah satunya hanya di naskah Princeton 2259) yang tidak ada di riwayat 1. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['—','α,β,γ,δ Equ','tak bernama Arab']],
 tr:[['Menyusulnya bintang-bintang kecil','samar, tak memiliki cahaya'],['Bagaikan bekas tulisan yang telah terhapus','orang Romawi mengenalnya dengan nama Qith‘at al-Faras (Potongan Kuda)'],['Tidak sampai kepada kami dari orang Arab','sesuatu pun berupa nama maupun julukan tentangnya']],
 ck:{1:'Syarah hal. 399: rasi ini hanya memuat bagian kepala kuda (dari gambar Pegasus), sehingga disebut “potongan kuda”; empat bintangnya nyaris tak terlihat karena redup, seperti tulisan lama yang pudar. Baris tambahan «جملتها أربعة قد عدوا / من الظلام لا تكاد تبدو» hanya ada di naskah Princeton 2259 — bukan di riwayat 1.',2:'Syarah hal. 399–400: karena redup dan tidak termasuk bintang penunjuk maupun manzilah bulan, orang Arab tidak menamainya. Baris «أنجمها أصغر من نجم السها / موقعها يقرب من سعد النهى» (dikutip syarah) bukan di riwayat 1. Rasi ini dekat bintang terang ε Peg yang disebut Jahfalat al-Faras (“bibir kuda”) — nama itu dari letaknya pada mulut kuda, bukan nama Arab; al-Ṣūfī menyebut Sa‘d an-Nuhā sebagai bintang terdekat.'},

{g:'Utara',id:'far',ok:1,ar:'الفرس الأعظم',idn:'Faras A‘zham (Kuda Terbang / Pegasus)',
 note:'Rasi Pegasus (syarah cetak 406–424 = PDF 436–454; 17 bait; bait 4 = tambahan naskah Munich). Rasi ini hanya separuh depan kuda: dua kaki belakang, ‘asīb, qathāh, dan kafal tidak ada pada gambarnya. «Yarbū» (bait 4) = napas terengah karena takut dari musuh: bila Singa naik di timur, Pegasus terbenam dan menjauh di barat. <b>Sa‘d al-Buhām</b> (al-Bahā’im; bukan Sa‘d al-Hammām) = dua bintang di kepala; syarah mencetak «قد سميا سعد البهام والنهى / كما حكاه ذو علوم ونهى»; Ibn Qutaibah dan al-Marzūqī tidak menyebut Sa‘d an-Nuhā; <b>al-Jahfalah</b> («bibir kuda») bukan nama Arab asli. «المعرفة» = tempat tumbuh bulu leher kuda, «الطِرف» = kuda mulia: dua bintang pada leher kuda = <b>Sa‘d al-Hammām</b> (Ṣūfī: bintang ke-11 dan ke-12). «لَبان» = dada kuda; dua bintang itu dekat salah satu bintang terang Farg al-Muqaddam. <b>Sa‘d Muthar</b> = dua bintang pada lutut kanan kuda; satu redup nyaris tak terlihat, satunya dekat dan bercahaya seperti bara. «Ad-Dalw» di sini BUKAN Dalw (Aquarius), melainkan ad-Dalw Arab = persegi besar empat bintang; keempatnya dinamai Farg pertama/kedua dan ‘Arqūwah atas/bawah (dua al-Farg = manzilah ke-26 dan ke-27). <b>al-Farghān</b> = dua dari empat bintang itu; <b>Nāhiz ad-Dalw/al-‘Arqūwah</b> nama lain. Syarah mengutip dua baris tambahan tentang <b>Baladat ath-Tha‘lab</b> yang bukan di riwayat 1; bait 15 «ما بين العرب» dikoreksi dari «العزب». <b>al-Karab</b> = tali yang melilit kedua ‘arqūwah dan tersambung ke tali timba; dua bintang di tengah (τ, υ) juga disebut an-Na‘ām; «مَرْكَل» = tempat penunggang menendangkan kakinya ke badan kuda. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['الفرغ المقدم','Markab α & Scheat β Peg','Farg 1'],['الفرغ المؤخر','Algenib γ Peg & Alpheratz α And','Farg 2'],['سعد البهام','θ & ν Peg','Sa‘d Buhām'],['سعد النهى','Enif ε Peg (usulan)','Sa‘d Nuhā'],['سعد الهمام','ζ & ξ Peg','Hammām'],['سعد البارع','λ & μ Peg','Bāri‘'],['سعد مطر','η & ο Peg','Muthar'],['الكرب / النعام','τ & υ Peg','Karab'],['بلدة الثعلب','ruang kosong','Baladah']],
 tr:[['Menyusul mereka sebuah rupa yang dinamai al-Faras (Kuda)','bintang-bintang yang kebanyakannya bagaikan bara api'],['Para ahli hikmah Romawi telah menyerupakannya','dengan seekor kuda berperawakan agung'],['Ia bersayap dan memiliki dua kaki depan','dua kaki belakang kurang dari wujudnya'],['Bersama ‘asīb (pangkal ekor), qathāh (punggung bawah), dan kafal (bokong)','ia terengah-engah karena takut kepada Singa apabila Singa telah naik'],['Di atas kepalanya engkau lihat dua bintang','jarak keduanya kira-kira dua jengkal'],['Orang Arab menamai keduanya Sa‘d al-Buhām','keduanya diikuti, apabila sebuah bintang tersembunyi'],['Sesudahnya ada dua bintang gelap','keduanya dari Sa‘d, saling berdekatan'],['Keduanya berada pada ma‘rafah sang kuda mulia','kabar dari orang yang tak diragukan pengetahuannya'],['Bahwa di kalangan orang Arab pedalaman Yaman','keduanya dijuluki Sa‘d al-Hammām, maka ketahuilah'],['Terbit setelah keduanya dua bintang','di dada sang kuda, gelap'],['Orang Arab menamai keduanya Sa‘d Bāri‘','di dekat sebuah bintang besar lagi cemerlang'],['Terbit setelah keduanya Sa‘d Muthar','sebuah bintang yang karena kecilnya lolos dari pandangan mata'],['Dan sebuah bintang di dekatnya bagaikan bara','keduanya terletak pada lutut kuda ini'],['Engkau melihatnya berbentuk persegi yang lapang','pada rupa sang kuda ada empat bintang'],['Dikenal dengan nama al-Farghain di kalangan orang Arab','dan Nāhiz ad-Dalw juga julukan baginya'],['Di tengah al-Farghain ada dua bintang','keduanya pada marakil (tempat tendangan) sang kuda jantan'],['Sebagian perawi dari orang Arab mengabarkan','bahwa keduanya dinamai al-Karab']],
 ck:{3:'Syarah hal. 406–409: baris ini tambahan naskah Munich (nota kaki 15). «يربو» = napasnya terengah karena takut dari musuh; maksudnya bila Singa (Leo) naik di timur, Pegasus terbenam dan menjauh di barat. Naskah lain membaca «يبدو من الشرق/الغرب إذا الليث استقل». Syarah juga mencatat rasi ini hanya separuh depan kuda: dua kaki belakang, ‘asīb, qathāh, dan kafal tidak ada pada gambarnya.',5:'Syarah hal. 409–410: dikutip dengan lafal lain «قد سميا سعد البهام والنهى / كما حكاه ذو علوم ونهى». Nama dua bintang kepala = Sa‘d al-Buhām/al-Bahā’im (bukan Sa‘d al-Hammām); Ibn Qutaibah dan al-Marzūqī tidak menyebut Sa‘d an-Nuhā. Al-Jahfalah («bibir kuda») bukan nama Arab asli (hal. 414).',7:'Syarah hal. 415–416: «المعرفة» = tempat tumbuh bulu leher kuda; «الطِرف» = kuda mulia. Maksudnya: dua bintang ini pada leher sang kuda.',8:'Syarah hal. 416: nama keduanya di sisi Arab ialah Sa‘d al-Hammām (bukan al-Buhām); al-Ṣūfī menyebutnya bintang ke-11 dan ke-12, di leher.',10:'Syarah hal. 416: «لَبان» = dada kuda; dua bintang ini dekat salah satu bintang terang Farg al-Muqaddam.',11:'Syarah hal. 416–417: Sa‘d Muthar = dua bintang pada lutut kanan kuda; satu redup nyaris tak terlihat, satunya dekat dan bercahaya seperti bara.',13:'Syarah hal. 413 dan 417: «الدلو» di sini BUKAN burung Dalw (Aquarius), melainkan «ad-Dalw» Arab = persegi besar empat bintang; keempat bintangnya dinamai Farg pertama/kedua dan ‘Arqūwah atas/bawah.',14:'Syarah hal. 417–423: al-Farghān = dua bintang dari empat penyusun ad-Dalw; Nāhiz ad-Dalw/al-‘Arqūwah juga nama lain. Syarah mengutip dua baris tambahan tentang Baladat ath-Tha‘lab «يبرزه الأفق إذا الفرغ أضا / بينهما وأنجم الحوت فضا // ببلدة الثعلب تدعوه العرب / يعرفها أهل النجوم والأدب» — bukan di riwayat 1.',16:'Syarah hal. 424: «الكَرَب» = tali yang melilit kedua ‘arqūwah dan tersambung ke tali timba; dua bintang di tengah (τ, υ) juga disebut an-Na‘ām. «مَرْكَل» = tempat penunggang menendangkan kakinya ke badan kuda.'},

{g:'Utara',id:'mus',ok:1,ar:'المرأة المسلسلة',idn:'Mar’ah Musalsalah (Andromeda)',
 note:'Rasi Andromeda (al-Mar’ah al-Musalsalah; syarah cetak 430–442 = PDF 460–472; 9 bait; bait 7–8 = tambahan Museum Seni Islam). «Al-Faras ats-Tsānī» = Pegasus besar (bukan Qith‘at al-Faras); Farg al-Mu’akhkhar milik bersama Pegasus dan Musalsalah. «Ar-Risyā’» = tali timba, dinamai karena dekat al-Farghain dan al-Karab; <b>Bathn al-Hūt</b> = ar-Risyā’ (juga «Qalb al-Hūt»): menurut Ibn Qutaibah dan al-Marzūqī as-Samakah/al-Hūt adalah banyak bintang, dan bintang terang di dalamnya itulah perut/jantung ikan (manzilah ke-28). «Ikan Arab» menurut Ṣūfī = dua baris bintang berbentuk ikan besar, sebagian dari Musalsalah, sebagian dari ikan utara rasi Hūt. «Al-‘Anāq» = anak kambing betina, «‘Anāq al-Ardh» = karakal; keduanya bukan satu nama bagi satu bintang. Ṣūfī tidak menemukan penamaan ini dari orang Arab; Ibn Qutaibah dan al-Marzūqī menyebut ‘Anāq al-Ardh untuk dua bintang (satu di sini, satu di Ra’s al-Ghūl) dan berbeda dalam menentukannya; pensyarah menilai penyair keliru bila menjadikan keduanya dua nama bagi satu bintang. Bintang pada telapak (bait 7–8) sebenarnya bukan bintang terang; «نيرة براقة» dipakai demi bersajak dengan «الناقة». «Andromīdā» = nama Yunani, al-Musalsalah nama Arabnya. Syarah mencetak baris tambahan «من النجوم النيرات الزهر…» yang tidak ada di riwayat 1. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['الرشا / بطن الحوت','bintang terang pada tali al-Hūt = perut/jantung ikan (Bathn/Qalb al-Hūt), manzilah ke-28 (matan bait 3–4; syarah hal. 430–437); ≈ β And (Mirach) — identifikasi dari tabel lama, bukan dari syarah','Risyā’'],['عناق الأرض','bukan satu nama bagi satu bintang; Ibn Qutaibah/al-Marzūqī: dua bintang (satu di sini, satu di Ra’s al-Ghūl)','‘Unāq'],['رأس الناقة','ι,κ,λ,ψ And','Ra’s Nāqah'],['يدا الناقة','φ Per, 51 And','Yadā Nāqah'],['الحوت العربي','π,δ,ε,ζ,η,ν,μ And + ψ1,χ,ρ Psc','Hūt']],
 tr:[['Menyusulnya bintang-bintang al-Musalsalah (Perempuan Terantai)','semuanya bintang yang saling bersambung'],['Dengan al-Faras ats-Tsānī (Kuda Kedua), dan di antaranya sebuah bintang','bercahaya, dijuluki «ar-Risyā’» (tali timba)'],['Ia, ketahuilah, adalah manzilah yang terakhir','demikian pula kami kabarkan dari para pendahulu'],['Dialah yang dinamai Bathn al-Hūt (Perut Ikan)','sebagai pengetahuan yang pasti, tanpa kusimpangkan'],['Ada pula sebuah bintang darinya di bawah betis','yang dikenal orang Arab dengan nama al-‘Anāq'],['Ia juga dinamai ‘Anāq al-Ardh','demikian diriwayatkan sebagian mereka dari sebagian lainnya'],['Lalu pada telapak (tangan)nya engkau dapati','tiga bintang dan satu yang menyendiri'],['Bintang-bintangnya cemerlang lagi berkilau','dan itulah yang dinamai Ra’s an-Nāqah (Kepala Unta Betina)'],['Dan Andrumīdā bagi rupa ini','adalah nama yang telah masyhur baginya']],
 ck:{1:'Syarah hal. 430: «الفرس الثاني» = Pegasus besar (bukan Qith‘at al-Faras); Farg al-Mu’akhkhar menjadi milik bersama Pegasus dan Musalsalah. «الرشا» = tali timba; dinamai demikian karena dekat al-Farghain dan al-Karab. Syarah mengutip baris tambahan «من النجوم النيرات الزهر / وهو من المرأة شكل الخصر» — bukan di riwayat 1.',3:'Syarah hal. 430–437: «بطن الحوت» = ar-Risyā’ (juga «قلب الحوت»). Menurut Ibn Qutaibah dan al-Marzūqī, as-Samakah/al-Hūt adalah banyak bintang, bukan satu; bintang terang di dalamnya itulah perut/jantung ikan. «Ikan Arab» menurut al-Ṣūfī = dua baris bintang berbentuk ikan besar, sebagian dari Musalsalah, sebagian dari ikan utara rasi Hūt.',5:'Syarah hal. 437–438: «العَناق» = anak kambing betina; «عناق الأرض» = karakal (hewan), dan keduanya bukan satu nama bagi satu bintang. Al-Ṣūfī tidak menemukan penamaan ini dari orang Arab; Ibn Qutaibah dan al-Marzūqī menyebut ‘Anāq al-Ardh untuk dua bintang (satu di sini, satu di Ra’s al-Ghūl) dan berbeda dalam menentukannya. Syarah menilai penyair keliru memahami ucapan al-Ṣūfī bila menjadikan keduanya dua nama bagi satu bintang.',7:'Syarah hal. 441: bintang-bintang pada telapak ini sebenarnya bukan bintang-bintang terang; «نيرة براقة» dipakai demi bersajak dengan «الناقة». Bait 7–8 adalah tambahan naskah Museum Seni Islam.',8:'Syarah hal. 442: «أندروميدا» = nama Yunani bagi rasi ini; al-Musalsalah adalah nama Arabnya.'},

{g:'Utara',id:'tha',ok:1,ar:'المثلث',idn:'Mutsallats (Segitiga / Triangulum)',
 note:'Rasi <b>al-Mutsallats</b> (Segitiga), rasi kecil yang terbit tak lama setelah al-‘Anāq (‘Anāq al-Ardh), sejajar dengan al-Kabsy, yaitu rasi Hamal/Aries (syarah hal. 456). Empat bintang: dua terang, dua samar. <b>al-Unaisān</b> = nama dua bintang terang menurut Arab: menurut Ṣūfī yang pertama di atas kepala (segitiga) dan yang kedua di utaranya, dari tiga bintang pada alas; nama dua bintang samar tak diketahui pengarang (bait 4). Istanbul membaca «الأبيسان» (tashhif); Vatikan Ross 1033, Museum Seni Islam, dan Ibn Qutaibah «الأنيسان»; pensyarah menguatkan «الأنيسان» (hal. 456–459). Dengan al-Mutsallats berakhirlah 21 rasi utara, dimulai dari ad-Dubb al-Ashghar (hal. 459).',
 tbl:[["الأنيسان","dua bintang terang: di atas kepala segitiga dan di utaranya (≈ α & β Tri, identifikasi lama)","Unaisān"]],
 tr:[['Sesudahnya kembalilah ke al-Mutsallats (Segitiga)','begitu al-‘Anāq terbit, ia tak berselang lama'],['Sejajar dengan bintang al-Kabsy (Domba), carilah tempat terbitnya','bintangnya, bila dihitung, ada empat'],['Dua bintang di antaranya cemerlang','dan dua sisanya dari keduanya samar'],['Maka al-Unaisān adalah nama bagi dua yang paling terang','dan aku tak tahu nama dua yang lebih kecil'],['Maka telah berlalu bintang-bintang utara','terurai dalam ucapan yang paling ringkas']],
 ck:{0:'Syarah hal. 456: al-Mutsallats rasi kecil yang terbit tak lama setelah al-‘Anāq (‘Anāq al-Ardh), sejajar dengan al-Kabsy, yaitu rasi Hamal (Aries).',3:'Syarah hal. 456–459 dan nota kaki 2: naskah Istanbul membaca «الأبيسان» (tashhif), sedangkan Vatikan Ross 1033, Museum Seni Islam, dan Ibn Qutaibah «الأنيسان»; pensyarah menguatkan «الأنيسان». Menurut al-Ṣūfī, bangsa Arab menamai al-Unaisān dua bintang terang: yang pertama di atas kepala (segitiga) dan yang kedua di utaranya, dari tiga bintang pada alas.',4:'Syarah hal. 459: dengan al-Mutsallats berakhirlah rasi-rasi utara — 21 rasi, dimulai dari ad-Dubb al-Ashghar.'},

{g:'Burūj',id:'buruj',ok:1,ar:'الصور الاثنا عشر (الأبراج)',idn:'Pembuka 12 Buruj (Zodiak)',
 note:'«صور البروج» = dua belas rasi yang dilalui lingkaran yang melintas di tengah-tengah burūj pada falak yang miring (ekliptika), yaitu lintasan Matahari, Bulan, dan lima planet. Tiap burūj dinamai dengan nama rasi yang menempatinya pada masa pengamatan; Ṣūfī menyebut jumlah bintang, letak, dan nama-namanya menurut mazhab Arab maupun mazhab para ahli astronomi (syarah hal. 467). Urutan matan: 21 rasi utara, 12 burūj, lalu 15 rasi selatan. Riwayat 2 menyisipkan bagian Manāzil al-Qamar (28 manzilah).',
 tbl:[["Rasi Utara","21 rasi (dari Dubb Ashghar s.d. Mutsallats)",""],["Burūj","12 rasi",""],["Selatan","15 rasi",""]],
 tr:[['Maka marilah kita sebutkan sekarang, secara berurutan,','bintang-bintang dari rasi-rasi burūj (zodiak)']],
