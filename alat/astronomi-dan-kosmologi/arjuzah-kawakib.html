{g:'Burūj',id:'r2_aqr',ok:1,ar:'العقرب',idn:'Aqrab (riwayat 2)',
 note:'Rasi Scorpius (PDF 126, cetak 96; 14 bait). Nama kuno rasi ini «<b>aṣ-Ṣūrah</b>» (dipakai pula untuk asy-Syawlah). Bintang-bintangnya terang di kegelapan; disebut <b>asad asy-syitā’</b> karena terbitnya bertepatan datangnya dingin — bukan bintang rasi Asad. <b>Qalb al-‘Aqrab</b> (Antares; merah, manzilah ke-18) diapit dua bintang jelas <b>an-Niyāṭ</b> («urat penggantung jantung»; bintang ke-7 di depan, ke-9 di belakang menurut Ṣūfī). Pengarang keliru bahwa bintang di depan asy-Syawlah kecil dan gelap: <b>asy-Syawlah</b> (manzilah ke-19; dari «syāla», mengangkat ekor) = dua bintang berdekatan yang keduanya terang; bintang samar yang dimaksud ialah <b>at-Tābi‘</b> (di luar gambar). Dua bintang kecil di ekor = <b>al-Ibrah</b> dan <b>al-Hamah</b> (≈ M7 dekat M6; Ibn Qutaibah memisahkannya dari asy-Syawlah). Bulan tidak melintasi asy-Syawlah, hanya lewat di sisinya. Kepercayaan «manhūs» (sial) terhadap Qalb/Syawlah ialah keyakinan jahiliah yang dibatalkan Islam. <b>al-Harrārān</b> = al-Qalb dan an-Nasr al-Wāqi‘ (dari «harīr», lolongan dingin). Pensyarah menolak koreksi Ṣūfī atas al-Iklīl (hal. 638). Rinci per bait di kotak catatan pensyarah.',
 tbl:[['قلب العقرب','Antares (α Sco); manzilah ke-18','Qalb'],['النياط','dua bintang yang mengapit al-Qalb (σ, τ Sco)','Niyāṭ'],['الشولة','dua bintang berdekatan di ekor (λ, υ Sco); manzilah ke-19','Syawlah'],['الإبرة / الهمة','dua bintang kecil di ekor (≈ M7, M6)','Ibrah / Hamah'],['التابع','bintang samar di luar gambar','Tābi‘'],['الحرّاران','al-Qalb dan an-Nasr al-Wāqi‘','Harrārān']],
 tr:[['Sesudahnya datanglah bintang-bintang al-‘Aqrab,','bintang-bintang bercahaya di kegelapan malam,'],['Bintang-bintangnya berkilau dan bercahaya,','yang oleh orang-orang dahulu dijuluki aṣ-Ṣūrah'],['Ia juga disebut Asad asy-Syitā’ (Singa Musim Dingin)','di kebanyakan negeri dan permukiman'],['dikenal oleh orang Arab seluruhnya dan orang non-Arab,','di antaranya sebuah bintang bagai obor yang menyala-nyala,'],['di atasnya cahaya yang gemilang dan warna kemerahan,','seakan-akan ia, bila bersinar, bara api.'],['Orang Arab menamainya Qalb al-‘Aqrab (Jantung Kalajengking),','ia hadir dalam syair dan khutbah mereka.'],['Ia diikuti sebuah bintang dan sendiri mengikuti bintang lain,','keduanya berkilau indah, disebut'],['oleh orang Arab badui an-Niyāṭ, ketahuilah kalian,','dan diikuti sebuah bintang kecil yang gelap,'],['yang mendahului sebuah bintang cemerlang yang bernasib sial,','jarak antara keduanya sejengkal bila diukur.'],['Telah mengabarkan kepadaku orang yang ucapannya tak kutolak','bahwa keduanya disebut asy-Syawlah,'],['yang dijadikan oleh bangsa Yunani dan para ahli','dari gambar kalajengking sebagai bentuk jarum (ibrah).'],['Dan al-Qalb bersama sebuah bintang terang berkilau,','yang dikenal orang Arab sebagai an-Nasr al-Wāqi‘,'],['keduanya bersama-sama disebut al-Harrārān','dalam kebanyakan kabar dan negeri.'],['Telah kami sebut sebelumnya keadaan al-Jabhah','secara ringkas, sehingga tak kami tinggalkan keraguan.']],
 ck:{1:'Syarah hal. 625–626 (PDF 656): mencetak «أجرامها زاهرة منيرة / قد لقبتها القدماء الصورة» setelah bait pembuka — baris ini ada di riwayat 2, tidak di riwayat 1. «aṣ-Ṣūrah» = nama kuno rasi al-‘Aqrab di antara nama dua belas burūj (kutipan al-Marzūqī, Ibn Qutaibah, Ṣūfī: «al-‘Aqrab: aṣ-Ṣūrah»); pensyarah menjelaskan bahwa al-‘Aqrab «bintang-bintang yang berkilau di malam hari» dari kelompok bintang yang namanya sesuai gambarnya. Nama ini dipakai pula untuk asy-Syawlah («Syawlat aṣ-Ṣūrah»).',2:'Syarah hal. 627: baris «وقد تسمى أسد الشتاء / في أكثر البلدان والأحياء» ada di riwayat 2, tidak di riwayat 1. Asad asy-Syitā’ di sini = bintang-bintang al-‘Aqrab, BUKAN bintang rasi Asad (Singa); disebut demikian karena terbitnya bertepatan dengan datangnya dingin.',5:'Syarah hal. 631: Qalb al-‘Aqrab = bintang merah yang sangat terang (Antares), manzilah ke-18; disebut Ibn Qutaibah, al-Marzūqī, dan Ṣūfī; bait Aswad bin Ya‘fur dikutip sebagai syahidnya.',6:'Syarah hal. 631: an-Niyāṭ = dua bintang jelas yang mengapit al-Qalb (satu mendahului, satu menyusul); «niyāṭ» = urat tebal tempat jantung digantungkan, dinamai demikian karena letaknya terhadap al-Qalb. Ṣūfī: yang ke-7 (di depan al-Qalb) dan ke-9 (di belakangnya).',7:'Syarah hal. 632: ucapan pengarang bahwa bintang yang mendahului asy-Syawlah «kecil dan gelap» TIDAK benar — asy-Syawlah dua bintang berdekatan yang keduanya terang (yang kedua lebih terang). Bintang kecil samar yang dimaksud bait ini adalah at-Tābi‘ (di luar gambar kalajengking).',8:'Syarah hal. 632: kepercayaan «manhūs» (bernasib sial) terhadap asy-Syawlah, seperti al-Qalb, termasuk keyakinan jahiliah yang dibatalkan Islam, yang mengembalikan baik-buruk kepada sebab-sebabnya.',9:'Syarah hal. 632–634: asy-Syawlah = dua bintang berdekatan di ekor kalajengking, dinamai dari «syāla» (mengangkat ekor); disebut pula Ibrat al-‘Aqrab. Ibn Qutaibah memisahkan asy-Syawlah dan al-Ibrah («seperti noda mendung»); al-Marzūqī menukil bahwa orang Syam menyebut asy-Syawlah = Ibrah, orang Hijaz sebaliknya. Al-Qalqasyandī: asy-Syawlah = seluruh gugus melengkung (manzilah ke-19). Bulan tidak pernah melintasinya, hanya lewat di sisinya (hal. 634–637).',10:'Syarah hal. 632–633: menurut Ibn Qutaibah al-Ibrah berbeda dari asy-Syawlah (di belakangnya; ≈ M7, dekat M6); al-Marzūqī dan al-Qalqasyandī menyebut dua bintang kecil «al-Ibrah dan al-Hamah» di ekor, di belakangnya at-Tābi‘ (menurut Ṣūfī bintang pertama di luar gambar).',12:'Syarah hal. 637–639: al-Harrārān = al-Qalb dan an-Nasr al-Wāqi‘ (dua bintang terang, selatan dan utara), dinamai dari «harīr» (lolongan dingin) karena terbitnya bertepatan datangnya dingin. Bait ini sama dengan syarah: «بهرّارين» (ر bersyaddah). Terbit bersama hanya di lintang tengah Jazirah Arab (kotak hal. 639).',13:'Syarah hal. 638 (juga hal. 621): pensyarah menolak koreksi Ṣūfī atas «al-Iklīl»; riwayat dari orang Arab tidak patut ditolak hanya karena letak bintangnya tak tepat di tengah antara az-Zubānā dan al-Qalb (Arab mengandalkan tanda-tanda jelas).'},

{g:'Burūj',id:'r2_qws',ok:1,ar:'القوس',idn:'Qaws / Rāmī (riwayat 2)',
 note:'Rasi Sagittarius (PDF 126–127, cetak 96–97; 20 bait). Ar-Rāmī = al-Qaus, salah satu dari 12 burūj, gambar makhluk khayali separuh manusia pemanah separuh kuda; menurut Ṣūfī 31 bintang, terletak di belakang rasi Aqrab. <b>as-Sakhāb</b> (bukan «saḥāb», awan) = untaian kalung tanpa permata; dalam gambar Yunani menjadi ikat kepala (‘iṣābah) Sang Pemanah. <b>al-Adzhī</b> (tempat telur burung unta) = <b>al-Qilādah</b> = <b>al-Qalā’iṣ</b>, enam bintang kecil melengkung di atas mata Sang Pemanah. <b>an-Na‘ām aṣ-Ṣādir</b> (empat bintang di luar Bima Sakti; burung unta yang telah minum dan menjauh) dan <b>an-Na‘ām al-Wārid</b> (empat bintang di dalam Bima Sakti; yang mulai masuk sungai) bersama = <b>an-Na‘ā’im</b>; ruang di antaranya = <b>al-Waṣl</b> (manzilah ke-20). Dua bintang di atas al-Waṣl = <b>aẓ-Ẓalīmān</b> (bait 8–9 khas riwayat 2; «sīyat al-qaws» = ujung busur). <b>aṣ-Ṣaradān</b>, <b>al-Yamāmatān</b>, <b>al-Maksī</b>, <b>al-Qaṭā</b>, dan <b>aḍ-Ḍifda‘</b> dianggap Arab sebagai kumpulan burung. <b>al-Baldah</b> (manzilah ke-21) = bidang tanpa bintang di bawah al-Qilādah (bukan bintang, koreksi Ṣūfī atas al-Battānī). Rinci per bait di kotak catatan pensyarah.',
 tbl:[['النعائم الصادرة','empat bintang jajaran genjang miring di luar Bima Sakti','Na‘ām Shādir'],['النعائم الواردة','empat bintang di dalam Bima Sakti','Na‘ām Wārid'],['الوصل','ruang antara dua na‘ām; manzilah ke-20','Waṣl'],['الظليمان','dua bintang di atas al-Waṣl (di ujung busur)','Zhalīmān'],['القلادة / الأذحي / القلائص','enam bintang kecil melengkung','Qilādah'],['البلدة','bidang langit tanpa bintang; manzilah ke-21','Baldah']],
 tr:[['Sesudahnya al-Qaus, yang disebut pula ar-Rāmī (Pemanah),','bintang-bintang yang terbit di kegelapan,'],['di antaranya bintang-bintang bagai untaian kalung yang tersusun,','yang dijadikan bangsa Yunani sebagai ikat kepala (‘iṣābah) Sang Pemanah,'],['dikenal dengan al-Adzhī dan al-Qilādah (kalung),','dan di bawahnya bintang-bintang yang berkilau,'],['empat bintang yang menyambar pandangan,','mereka menamainya an-Na‘ām aṣ-Ṣādir,'],['Mendahului keempatnya bintang-bintang terang','yang menyerupai mereka dalam gambar,'],['paling mirip dengan burung unta yang lari,','mereka menamainya an-Na‘ām al-Wārid,'],['Engkau lihat di antara kedua na‘ām itu sebuah ruang lapang,','dikenal dengan nama al-Waṣl oleh orang Arab padang pasir.'],['Engkau lihat pada ujung lengkung (sīyah) busur Sang Pemanah','dua bintang seperti bintang-bintang an-Na‘ām,'],['keduanya berada di atas al-Waṣl,','dan dinamai aẓ-Ẓalīmayn (dua burung unta jantan)'],['Dan di antara bintang-bintang al-Qaus ada dua bintang,','keduanya di paha si kuda,'],['orang Arab menyebut keduanya aṣ-Ṣardān,','begitulah kitab-kitab mengabarkan tentangnya,'],['Di atas keduanya bintang-bintang yang berkumpul,','kecil-kecil, jumlahnya empat,'],['dari dekatnya hingga ujungnya tumbuh ekor (adz-Dzanab),','dijuluki oleh orang Arab al-Yamāmatayn,'],['dan di antara mereka dan bintang aḍ-Ḍifda‘ (Katak),','yaitu bintang bagi air Dalw pada titik tepi,'],['bintang-bintang tersusun saling bertaut,','dan sebagiannya dari bintang-bintang as-Samakah (Ikan),'],['di sisinya, di dadanya, dan di punggungnya (al-maṭā),','dikenal seluruhnya oleh orang Arab sebagai al-Qaṭā,'],['Engkau lihat di sisi bintang-bintang al-Adzhī','dan lingkaran (falak) yang menyerupai al-Farnī,'],['di sebuah lapangan bagai padang tandus yang gundul,','yang dinamai para ulama al-Baldah.'],['Dan bintang-bintang yang tersusun menjulang,','dinamai oleh mereka al-Qalā’iṣ.'],['yakni (bintang-bintang) yang dijadikan ikat kepala,','terikat dan terjulur berjumbai.']],
 ck:{0:'Syarah hal. 647–648: ar-Rāmī = al-Qaus, salah satu dari 12 burūj, digambar makhluk khayali separuh manusia pemanah separuh kuda. Menurut Ṣūfī (hal. 649) rasi ini 31 bintang, terletak di belakang rasi Aqrab, dan tak ada bintang teramati lain di sekitarnya.',1:'Syarah hal. 648, 651: «as-sakhāb» (bukan «as-sahāb») = kalung dari untaian tanpa permata; menurut Yunani gugus ini ‘iṣābah (ikat kepala) di kepala Sang Pemanah dengan dua jumbai. Naskah ini membaca «عصابة» (riwayat 1: «عذبة»), sesuai pembacaan syarah.',2:'Syarah hal. 651–652: al-Adzhī = tempat telur burung unta di pasir; al-Qilādah = enam bintang kecil samar melengkung di belakang as-Sahābī, di atas mata Sang Pemanah (Ṣūfī: bintang ke-9–14), disebut pula al-Qalā’iṣ dan al-Qaus. Abū Ḥanīfah ad-Dīnawarī menyatakan nama al-Qaus berasal dari bentuk busur ini.',3:'Syarah hal. 652–653: an-Na‘ām aṣ-Ṣādir = empat bintang pada jajaran genjang miring (di luar Bima Sakti), dinamai demikian karena Arab menyerupakan Bima Sakti dengan sungai; burung unta yang telah minum lalu menjauh (Ṣādir).',5:'Syarah hal. 653–654: an-Na‘ām al-Wārid = empat bintang di dalam Bima Sakti, seakan burung unta yang mulai masuk ke sungai (Wārid). Gabungan keduanya (8 bintang) disebut an-Na‘ā’im (juga an-Na‘āmatān = kayu penopang katrol timba); nama itu tidak disebut Ṣūfī dalam arjuzah ini.',6:'Syarah hal. 655–656: al-Waṣl = ruang antara an-Na‘ām al-Wārid dan aṣ-Ṣādir; Ṣūfī menyebutnya manzilah ke-20, al-Marzūqī: tempat an-Na‘ā’im disebut al-Waṣl. Di naskah tertentu tertulis «الرمل» (tashhif; lihat gl).',7:'Syarah hal. 656 (PDF 686): mencetak «ترى على سية قوس الرامي / نجمين مثل أنجم النعام / هما على الوصل معليان / وبالظليمين مسميان» — bait 8–9 hanya ada di riwayat 2, tidak di riwayat 1. Naskah ini menulis «ستّة»; pensyarah memaknainya «sīyat al-qaws» = ujung lengkung busur (busur punya dua sīyah). Terjemah mengikuti «sīyah».',8:'Syarah hal. 656–657: dua bintang itu berada di atas celah (al-Waṣl) antara dua na‘ām, dan orang Arab menamainya aẓ-Ẓalīmān. Ṣūfī: bintang ke-4 di ujung utara busur (kini berada di antara dua na‘ām di utara, dan keduanya tampak seperti kubah) dan ke-5 di sīyah utara = aẓ-Ẓalīmān; Ibn Qutaibah dan al-Marzūqī menyebut salah satunya tanpa menamai.',9:'Syarah hal. 658–659: pada Ibn Qutaibah, di belakang al-Qubbah ada dua bintang aṣ-Ṣardān — satu mendekati ufuk, satu di atasnya. Penentuan Ṣūfī (dua bintang di belakang al-Qubbah, yang bawah tinggi >8° di atas ufuk) tidak cocok dengan deskripsi Arab bahwa ia dekat ufuk.',10:'Syarah hal. 659–660: di atas aṣ-Ṣarad al-a‘lā ada al-Yamāmatān (dua bintang), lalu al-Maksī dan al-Qaṭā; wilayah ini dianggap Arab sebagai kumpulan burung (na‘ām, yamām, ṣarad, qaṭā, makkā’ī).',11:'Bait 12–16 khas riwayat 2. Syarah hal. 659–660 (PDF 689–690; dibaca ulang) hanya mengutip Ibn Qutaibah dan al-Marzūqī: di belakang aṣ-Ṣard al-A‘lā ada al-Yamāmatān (dua bintang), dan di atas al-Makkā’ī ada al-Qaṭā — bintang-bintang rapat seperti burung qaṭā yang terbang berkelompok, tidak terang, kebanyakan dua bintang. Pensyarah menyimpulkan nama-nama itu bintang-bintang kecil kumpulan burung. Itu mendukung bait 12 (al-Yamāmatayn) dan bait 15 (al-Qaṭā). Syarah di halaman itu TIDAK membahas adz-Dzanab, «نجم الضفدع / ماء الدلو» (bait 13–14), «مستبكة», maupun «المطا» — bagian ini tetap diterjemah dari matan (tentatif). Ejaan «اليامتين» (syarah «اليمامتين»).',17:'Syarah hal. 651, 654: al-Baldah = bidang langit tanpa bintang di antara an-Na‘ā’im dan Sa‘d adz-Dzābih (Ibn Qutaibah); Ṣūfī mengoreksi al-Battānī yang menyebutnya bintang: ia hanya ruang kosong, dan Arab menjadikan ruang antara dua na‘ām sebagai manzilah. Hal. 670: «baldah» dari «bald» = jarak di antara dua alis yang tak bertaut; manzilah ke-21, bidang di bawah al-Qilādah tanpa bintang.',18:'Syarah hal. 650–651: al-Qalā’iṣ = nama lain al-Qilādah/al-Adzhī (enam bintang melengkung). Keterangan gambar (hal. 650): penentuan bintang menurut Ṣūfī tak sepenuhnya cocok dengan deskripsi Arab.'},

 gl:{0:'Bait 1 ada di dasar PDF 126, di bawah header «القوس».',7:'Dicek 150 dpi pada PDF 127: «ستّة» dan «قوس الرامي» terbaca jelas (⚠ dihapus); syarah mencetak «سية».',12:'«اليامتين» (naskah ini) vs «اليمامتين» (syarah).',16:'Dicek 150 dpi pada PDF 127: «والفلك المشتبه للفرني» dan urutan syatr cocok (⚠ dihapus); arti «الفرني» belum ditemukan (lihat catatan riwayat 1).'}},
{g:'Burūj',id:'r2_jdy',ok:1,ar:'الجدي',idn:'Jadyy (riwayat 2)',
 note:'Rasi Capricornus (PDF 128, cetak 98; 9 bait). «Al-Jady» adalah nama Yunani untuk rasi ini; orang Arab tidak mengenal burūj dan punya nama sendiri, jadi klaim bahwa «semua bangsa» menamainya begitu tidak tepat. Hanya 4 dari 28 bintangnya terang (magnitudo 3). Bukan al-Jady = Polaris (Dubb Ashghar). <b>Sa‘d adz-Dzābiḥ</b> (manzilah ke-22; pertama dari empat as-Su‘ūd) = dua bintang tidak terlalu terang di tanduk Jady (±sehasta; satu ke utara, satu ke selatan); bintang kecil berselaput cahaya yang hampir menyatu dengan yang atas dianggap «syāh» (kambing) yang disembelih, dan ketiganya diserupakan mulut bergigi («syanab»). <b>Sa‘d Nāsyirah</b> hanya DUA bintang di ekor — bukan bintang-bintang di sekitarnya (pembacaan riwayat 2 «نجمان» sejalan dengan ini). Pensyarah menduga «asy-Syarathān» pada Ibn Qutaibah/al-Marzūqī tashhif dari «aṣ-Ṣardān», dan membela riwayat Arab bahwa bulan kadang singgah di Nāsyirah (jalur bulan), sedangkan as-Su‘ūd di luarnya. <b>al-Muḥibbān</b> = nama lain kedua bintang Nāsyirah (γ, δ Cap). Rinci per bait di kotak catatan pensyarah.',
 tbl:[['سعد الذابح','dua bintang di tanduk Jady (α, β Cap); manzilah ke-22','Sa‘d adz-Dzābiḥ'],['سعد ناشرة','dua bintang di ekor (γ, δ Cap)','Sa‘d Nāsyirah'],['المحبّان','nama lain kedua bintang Nāsyirah','Muḥibbān']],
 tr:[['Sesudah penyebutanku bintang-bintang ar-Rāmī,','kugambarkan bentuk al-Jady dalam tuturku,'],['bintang-bintang gemerlap dalam kegelapan,','yang dikenal semua bangsa dengan nama al-Jady,'],['engkau lihat pada kedua tanduknya dua bintang,','tampak tepat di bawah yang lebih terang dari keduanya'],['sebuah bintang kecil yang cahayanya berselaput kabur,','nyaris menempel pada yang lebih besar,'],['seakan-akan ketiganya mulut bergigi yang berkilau,','dinamai orang Arab Sa‘d adz-Dzābiḥ.'],['Dalam keseluruhan gambar ada dua bintang,','yang tampak bila adz-Dzābiḥ telah terbit,'],['keduanya sangat cemerlang, berkilat berpendar,','dihiasi tubuh (bintang) yang bercahaya putih bersih,'],['di sekitar keduanya dua bintang yang gemerlap,','keduanya dinamai orang Arab Sa‘d Nāsyirah,'],['Kabar dari sebagian perawi dari orang Arab','bahwa al-Muḥibbān adalah sebutan bagi keduanya.']],
 ck:{1:'Syarah hal. 678: «al-Jady» (Capricornus) adalah nama Yunani untuk rasi ini; klaim bahwa «semua bangsa» menamainya begitu tidak tepat — orang Arab tidak mengenal burūj dan punya nama sendiri. Juga hanya 4 dari 28 bintangnya yang terang (magnitudo 3); sisanya samar. Bukan al-Jady = Polaris (Dubb Ashghar).',2:'Syarah hal. 678–681: Sa‘d adz-Dzābiḥ = dua bintang tidak terlalu terang di tanduk al-Jady, berjarak ±sehasta (menurut Ibn Qutaibah dan al-Marzūqī: satu naik ke utara, satu turun ke selatan); Ṣūfī menyebutnya bintang pertama dan ketiga pada tanduk berikutnya.',3:'Syarah hal. 678: pensyarah memahami bait ini sebagai bintang kecil samar yang cahayanya berselaput (ghasyāwah), hampir menyatu dengan bintang atas; bintang kecil inilah «syāh» (kambing) yang disembelih.',4:'Syarah hal. 678–681: «syanab» = kilau/kesejukan gigi; ketiga bintang diserupakan dengan mulut bergigi demikian. Dinamai adz-Dzābiḥ karena bintang kecil di dekatnya dianggap kambing yang disembelih (atau karena bintang kecil itu terletak di tempat sembelihan); manzilah ke-22, pertama dari empat as-Su‘ūd.',7:'Syarah hal. 682–687: yang dinamai Sa‘d Nāsyirah hanya DUA bintang di ekor, bukan bintang-bintang di sekitarnya. Pensyarah menilai kata «asy-Syarathān» dalam riwayat Ibn Qutaibah/al-Marzūqī («terbit bersama asy-Syarathān») kemungkinan tashhif dari «aṣ-Ṣardān» (hal. 683); dan membela riwayat Arab bahwa bulan kadang singgah di Sa‘d Nāsyirah (Ṣūfī menyalahkannya): Nāsyirah berada di jalur bulan, sedangkan as-Su‘ūd di luarnya (hal. 683–687). Naskah riwayat 2 membaca «حولهما نجمان وهي زاهرة» (dua bintang), riwayat 1 «حولهما تبدو نجوم زاهرة»; pembacaan riwayat 2 sejalan dengan penegasan pensyarah bahwa Nāsyirah hanya dua bintang.',8:'Syarah hal. 683, 688: al-Muḥibbān = nama lain kedua bintang Nāsyirah (γ,δ Cap) di ekor; Ṣūfī: keduanya agak menyimpang dari jalur matahari, yang terdepan ±2°10′ ke selatan.'},

{g:'Burūj',id:'r2_dlw',ok:1,ar:'الدلو',idn:'Dalw (riwayat 2)',
 note:'Rasi Aquarius (PDF 128–129, cetak 98–99; 20 bait). «Ad-Dalw» dan «Sākib al-Mā’» adalah dua nama gambar Yunani (penuang air; timba = <i>dzanūb</i>/<i>jarrah</i>); pada Arab «ad-Dalw» justru bintang-bintang al-Farghān dan al-Karab di rasi Faras bersama ar-Risyā’, jadi klaim «orang Arab menamainya ad-Dalw» tidak tepat. Air mengalir ke selatan berujung di <b>adh-Dhifda‘ al-Awwal</b> (Fomalhaut, α Piscis Austrini; ±mag 1,15) — kadang <b>aẓ-Ẓalīm</b> menurut Ṣūfī (tak ditemukan pada Ibn Qutaibah/al-Marzūqī) — yang oleh ahli nujum Yunani juga jadi mulut Hūt Janūbī (bait 6–7 khas riwayat 2). <b>Sa‘d Bula‘</b> (manzilah ke-23): tiga bintang kecil di telapak tangan menurut Ṣūfī, dua menurut Ibn Qutaibah/al-Marzūqī; «bula‘» dari «menelan». <b>Sa‘d as-Su‘ūd</b> (manzilah ke-24; tiga atau dua bintang) dinamai karena orang Arab bergembira atas terbitnya (hangat, hilangnya dingin ekstrem). <b>Sa‘d al-Malik</b> (dua bintang di bahu kanan) <u>bukan</u> salah satu dari 28 manzilah. <b>Sa‘d al-Akhbiyah</b> (manzilah ke-25) = empat bintang (tiga segitiga + satu di tengah); dinamai karena saat terbit udara menghangat dan makhluk keluar dari persembunyian. <b>al-Jirrah</b> (kendi, dengan ر; naskah Istanbul memang «الجِرّة») bukan nama Arab. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['الضفدع الأول / الظليم','Fomalhaut (α PsA), mulut Hūt Janūbī','Dhifda‘ Awwal'],['سعد بلع','tiga bintang kecil di telapak tangan (menurut Ṣūfī); manzilah ke-23','Sa‘d Bula‘'],['سعد السعود','dua atau tiga bintang (β Aqr dkk); manzilah ke-24','Sa‘d as-Su‘ūd'],['سعد الملك','dua bintang di bahu kanan; bukan manzilah','Sa‘d al-Malik'],['سعد الأخبية','empat bintang (tiga segitiga + satu di tengah); manzilah ke-25','Sa‘d al-Akhbiyah']],
 tr:[['Sesudahnya kusebutkan bentuk ad-Dālī (si penimba),','diringkas dengan tutur yang paling singkat.'],['Itulah yang oleh orang Arab dinamai ad-Dalw (timba),','dan Sākib al-Mā’ (penuang air) juga menjadi gelarnya,'],['bintang-bintang yang diserupakan dengan seorang lelaki,','di tangan kanannya ada ember (dzanūb) yang telah penuh,'],['ia menuangkan air dari ember itu,','memanjang bagai sungai ke arah selatan.'],['Ujung (aliran) mereka berada pada sebuah bintang cemerlang,','dihiasi cahaya yang memukau pandangan,'],['bersinar bagai bulan purnama bila purnama telah terbenam,','orang Arab menamainya adh-Dhifda‘ al-Awwal (Katak Pertama).'],['Dan kadang ia disebut aẓ-Ẓalīm (burung unta jantan),','yaitu (bintang) yang dijadikan oleh orang Rūm'],['bagi rupa al-Hūt al-Janūbī (Ikan Selatan), maka (ketahuilah),','demikianlah yang diklaim orang yang berilmu nujum.'],['Ya, dan dalam keseluruhan gambar ini','ada bintang-bintang samar yang kecil,'],['pada gambar itu berada di telapak tangan,','dijadikan orang Arab sebagai bagian dari as-Su‘ūd,'],['tampak dari ufuk ketika al-Jady terbit,','itulah yang dinamai Sa‘d Bula‘.'],['Mengikuti mereka dua bintang,','keduanya bertanda di bahu,'],['Yang teratas dari keduanya bagai bara yang menyala,','keduanya dinamai orang Arab Sa‘d as-Su‘ūd.'],['beserta sebuah bintang yang lebih kecil, yang di dekatnya ada bintang lain,','ia termasuk (bintang) al-Jady di atas ekor (adz-Dzanab),'],['Mengikutinya dua bintang lain,','jarak keduanya dua syibr atau dua fitr (jengkal).'],['Orang yang ilmunya tak diragukan mengabarkan','bahwa keduanya dinamai Sa‘d al-Malik,'],['keduanya berada di bahu gambar ini,','diikuti bintang-bintang yang bercahaya,'],['tiga bintang yang mengelilingi sebuah bintang,','semuanya bintang yang bertubuh besar;'],['terbitnya pertanda udara yang sedap,','orang Arab menamainya Sa‘d al-Akhbiyah.'],['Bintang-bintang itu jauh dari Majarrah (Bimasakti),','dan itulah yang disebut bintang-bintang al-Jirrah (kendi).']],
 ck:{1:'Syarah hal. 692–695: «ad-Dalw» dan «Sākib al-Mā’» di sini adalah dua nama untuk gambar Yunani. Pada orang Arab, «ad-Dalw» ialah bintang-bintang al-Farghān dan al-Karab dalam rasi al-Faras al-A‘ẓam bersama bintang-bintang ar-Risyā’, bukan rasi ini; jadi klaim «orang Arab menamainya ad-Dalw» tidak tepat.',5:'Syarah hal. 693–697: adh-Dhifda‘ al-Awwal = bintang paling terang rasi ini (α Piscis Austrini, Fomalhaut; magnitudo ±1,15), di ujung aliran air dan juga di mulut al-Hūt al-Janūbī. Ṣūfī menyebutnya juga «aẓ-Ẓalīm»; pensyarah tidak menemukan penamaan itu pada Ibn Qutaibah/al-Marzūqī (hal. 696) dan menilai aẓ-Ẓalīmān mereka lebih mungkin = dua adh-Dhifda‘ menurut Ṣūfī (hal. 697), bukan dua bintang di atas al-Yamāmatān.',6:'Baris «وربما سمي بالظليم / وهو الذي يجعل عند الروم لصورة الحوت الجنوبي فما» khas riwayat 2 (dikutip syarah sebagai versi lain bait 6–7; tidak ada di riwayat 1). Yang dimaksud aẓ-Ẓalīm = adh-Dhifda‘ al-Awwal (bintang ujung aliran air). Rincian adh-Dhifda‘ al-Awwal dan aẓ-Ẓalīm: lihat catatan bait 6 (indeks 5) di atas.',7:'Syarah hal. 695: bintang ini berada pada rasi ini di ujung aliran air, dan sekaligus di mulut rasi al-Hūt al-Janūbī menurut para ahli nujum pengikut mazhab Yunani — itulah maksud «mereka menjadikannya bagian dari al-Hūt».',10:'Syarah hal. 697–701: Sa‘d Bula‘ (manzilah ke-23) = tiga bintang kecil di telapak tangan menurut Ṣūfī (bintang ke-6, 7, 8). Ibn Qutaibah dan al-Marzūqī hanya menyebut DUA bintang, salah satunya samar; «bula‘» dari «menelan» (yang samar seolah menelan/ditelan). Ada beberapa pembacaan atas bintang mana yang termasuk, sesuai ciri dalam sumber.',12:'Syarah hal. 701–703: Sa‘d as-Su‘ūd (manzilah ke-24) menurut Ibn Qutaibah = tiga bintang (satu terang, dua di bawahnya); menurut al-Marzūqī dua bintang. Dinamai demikian karena orang Arab bergembira atas terbitnya (melunaknya udara, hilangnya dingin ekstrem, suburnya padang).',13:'Dua baris «هو من الجدي فويق الذنب / مع كوكب أصغر به من كوكب» khas riwayat 2 (tidak ada di riwayat 1). Catatan lama menyebut syarah hal. 706 mengutipnya, tetapi hal. 706 (PDF 736) sudah dibaca ulang dan TIDAK memuat baris ini: halaman itu hanya mencetak «قد جاء سعد موعدا بشرّه / مخبرة جنوده بحرّه» (tambahan riwayat 1, yang tidak ada di riwayat 2) lalu uraian Sa‘d al-Akhbiyah (Ibn Qutaibah, al-Marzūqī, Ṣūfī). Lokasi kutipan baris ini di syarah belum ditemukan. Terjemah dari matan, tentatif: «bintang yang lebih kecil, yang bersamanya ada bintang lain», yang termasuk al-Jady di atas ekornya; rujukan «ه/ها» tidak dijelaskan.',15:'Syarah hal. 704–705: Sa‘d al-Malik = dua bintang di bahu kanan gambar (jarak ±dua syibr), tetapi BUKAN termasuk dua puluh delapan manzilah; ia hanya satu dari as-Su‘ūd yang bersambung dengan manzilah-manzilah (Ibn Qutaibah, ats-Tsaqafī).',18:'Syarah hal. 705–706: Sa‘d al-Akhbiyah (manzilah ke-25) = empat bintang: tiga membentuk segitiga dan satu di tengah (Ṣūfī: nomor 9, 10, 12 dan 11); dinamai «akhbiyah» karena ketika terbit udara menghangat dan keluarlah makhluk yang bersembunyi dari dingin.',19:'Syarah hal. 705: «al-Jirrah» (kendi/guci, dengan ر) — kendi tempat air dituang oleh Sākib al-Mā’; orang Arab tidak mengenal bintang-bintang ini dengan nama itu. Matan naskah Istanbul memang «الجِرّة» (bukan «الجزّة»).'},

{g:'Burūj',id:'r2_hwt',ok:1,ar:'الحوت',idn:'Hūt / Samakah (riwayat 2)',
 note:'Rasi Pisces (PDF 129, cetak 99; 6 bait). Al-Hūt (as-Samaktān, «dua ikan») = rasi terakhir dari 12 burūj; bintang-bintangnya dua baris yang bertemu pada simpul dua tali (‘uqdat al-khaythayn); menurut Ṣūfī 34 bintang di dalam gambar dan 4 di luar. Satu ikan berada di selatan al-Mar’ah al-Musalsalah, ikan lainnya dekat Sa‘d al-Hammām di selatan leher al-Faras al-A‘ẓam. <b>ar-Rabaq</b> = bintang-bintang kecil melingkar di bawah Sa‘d al-Hammām (Ibn Qutaibah); <b>Mubriq/Mirbaq al-Buhām</b> = Sa‘d al-Buhām (al-Marzūqī), bukan bintang as-Samakah al-Muqaddamah; Ṣūfī menjadikan ar-Rabaq baris pertama bintang yang menjulur ke ‘uqdat al-khaythayn (bintang 8–19). Bait 4–5 (nūn kedua, Mirbaq al-Buhām, ar-Rabaq) khas riwayat 2. <b>as-Sakhāb</b> = kalung; <b>al-Waṣl</b> = dua baris bintang yang menghubungkan kedua ikan, di antara al-Farg al-Mu’akhkhar dan ar-Risyā’ — nama ini tidak ada dalam Ṣuwar al-Kawākib maupun Ibn Qutaibah dan al-Marzūqī. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['الرباق','bintang-bintang kecil melingkar di bawah Sa‘d al-Hammām','Rabaq'],['مربق البهام','Sa‘d al-Buhām (bukan as-Samakah al-Muqaddamah)','Mirbaq al-Buhām'],['الوصل','dua baris bintang yang menghubungkan kedua ikan','Waṣl'],['الرشاء','tali; juga jantung al-Hūt (hal. 712–713) = Bathn/Qalb al-Hūt, manzilah ke-28 (lihat al-Musalsalah)','Risyā’']],
 tr:[['Menyusulnya al-Hūt (Ikan), yang juga disebut as-Samakah,','bintang-bintang yang melilit, saling bersilangan,'],['Orang Rūm menyerupakannya dengan dua nūn (ikan),','yang dilihat mata tampak kecil-kecil;'],['salah satunya mendekati al-Musalsalah,','di antara keduanya ada bintang-bintang yang bersambung,'],['dan seekor ikan lagi mendekati al-Hammām,','dinamai Mirbaq al-Buhām (tali pengikat anak domba),'],['tampak dari ufuk ketika pandangan menyingsing,','dikenal seluruh orang Arab dengan nama ar-Rabaq,'],['tersusun menyerupai bentuk sakhāb (kalung),','dikenal dengan nama al-Waṣl di kalangan orang Arab.']],
 ck:{0:'Syarah hal. 711–713: al-Hūt (as-Samaktān, «dua ikan») = rasi terakhir dari dua belas burūj; bintang-bintangnya berupa dua baris yang saling bertemu pada simpul kedua tali (‘uqdat al-khaythayn). Ṣūfī: 34 bintang di dalam gambar dan 4 di luar.',2:'Syarah hal. 712–713: satu ikan berada di selatan rasi al-Mar’ah al-Musalsalah, ikan lainnya dekat Sa‘d al-Hammām di selatan leher al-Faras al-A‘ẓam; di antara keduanya bintang-bintang berurutan seperti dua tali. «Kecil» (bait 2) dapat berarti dua ikan itu tampak kecil, atau merujuk ar-Risyā’ (jantung al-Hūt) dan bintang-bintang samarnya.',3:'Bait 4–5 (nūn kedua, Mirbaq al-Buhām, ar-Rabaq) khas riwayat 2; ada di syarah hal. 715–717 (PDF 745–748) sebagai bait tambahan setelah bait 4 riwayat 1. Syarah: ar-Rabaq = bintang-bintang kecil melingkar di bawah Sa‘d al-Hammām (Ibn Qutaibah); Mubriq/Mirbaq al-Buhām = Sa‘d al-Buhām (al-Marzūqī), bukan bintang as-Samakah al-Muqaddamah; Ṣūfī menjadikan ar-Rabaq baris pertama bintang yang menjulur ke ‘uqdat al-khaythayn (bintang 8–19). Keterangan dari catatan sesi sebelumnya; halaman syarah tidak dibaca ulang.',4:'Syatr 1 bait 5 «تبدو من الأفق إذا الطرف شرق» (idiom «إذا الطرف شرق» — arti ketepatan «aṭ-ṭarf» di sini tidak dijelaskan syarah; terjemah tentatif «pandangan menyingsing»).',5:'Syarah hal. 714–715: «sakhāb» = kalung (Lisān al-‘Arab); al-Waṣl = dua baris bintang yang menghubungkan kedua ikan, terletak antara al-Farg al-Mu’akhkhar dan ar-Risyā’. Nama «al-Waṣl» tidak dikenal dalam Ṣuwar al-Kawākib maupun Ibn Qutaibah dan al-Marzūqī (al-Marzūqī hanya menyebut celah antara dua manzilah kadang disebut al-Waṣl).'},

{g:'Janūb',id:'r2_jan',ok:1,ar:'الصور الجنوبية',idn:'Pembuka Rasi Selatan (riwayat 2)',
 note:'Pembuka rasi selatan (PDF 130, cetak 100; 2 bait). Rasi selatan = rasi di selatan jalur Matahari (al-khaṭṭ al-burūjī, ekliptika) yang membagi langit menjadi kubah utara dan kubah selatan. Ṣūfī: 15 gambar selatan, dimulai dari Qaythus lalu berurutan menurut susunan Ptolemeus. Syarah mencetak bait 1 dengan «وإذ… فهاهنا»; riwayat 1 «فقد… وهاهنا». Rinci di kotak catatan pensyarah.',
 tbl:null,
 tr:[['Telah kami sebut rasi-rasi burūj,','dan di sini kami mulai keluar (dari zodiak)'],['menuju bintang-bintang rasi selatan,','lalu kami sebut semuanya menurut urutan.']],
 ck:{0:'Syarah hal. 721: rasi selatan = rasi yang berada di selatan jalur Matahari (al-khaṭṭ al-burūjī / ekliptika), yang membagi langit menjadi kubah utara dan kubah selatan. Ṣūfī: 15 gambar selatan, dimulai dari Qaythus lalu berurutan menurut susunan Ptolemeus. Syarah mencetak bait 1 dengan «وإذ… فهاهنا», riwayat 1 «فقد… وهاهنا».'},

{g:'Janūb',id:'r2_qyt',ok:1,ar:'قيطس',idn:'Qaythus (riwayat 2)',
 note:'Rasi Cetus (PDF 130, cetak 100; 12 bait). Qaythus = makhluk laut khayali (kepala singa, ekor lumba-lumba) dari Yunani; di selatan Hamal; menurut Ṣūfī 22 bintang di dalam gambar, ±8 di antaranya magnitudo ≥3. <b>al-Khathm</b> = moncong. <b>al-Kaff al-Jadzmā’</b> (telapak buntung, karena pendek dibanding al-Kaff al-Khadhīb dari Tsurayyā ke utara) = bintang pertama–keenam pada kepala Qaythus (Ṣūfī); menurut Ibn Qutaibah/al-Marzūqī di bawah asy-Syarathān. <b>an-Na‘āmāt</b> (an-Na‘ām) = lima bintang pada tubuh Qaythus (nomor 12–16 Ṣūfī), terbit mengikuti al-Kaff al-Jadzmā’ (±5 qāmah ≈ 6,5° per qāmah); sesuai Ibn Qutaibah (lima bintang pada tarbī‘ an-na‘sh, mengikuti ar-Ri’āl). <b>al-Baqar</b>: Ṣūfī menolak bahwa seluruh Qaythus bernama itu; menurut Ibn Qutaibah hanya bintang tersebar antara al-Kaff al-Jadzmā’, Tsurayyā, dan Dabarān (bait 5 khas riwayat 2). Bait 11–12 (an-Nazhām, empat bintang redup) khas riwayat 2 dan tak ditemukan di syarah yang dibaca. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['الكف الجذماء','bintang pertama–keenam pada kepala Qaythus (Ṣūfī); dianggap tangan Tsurayyā','Kaff al-Jadzmā’'],['النعامات','lima bintang pada tubuh Qaythus (nomor 12–16)','Na‘āmāt'],['البقر','bintang tersebar antara Kaff al-Jadzmā’, Tsurayyā, Dabarān','Baqar'],['النظام','empat bintang redup (khas riwayat 2)','Nazhām']],
 tr:[['Yang pertama dari mereka ialah hewan laut,','berbentuk seperti bentuk singa (hazabr),'],['wajahnya seperti singa sarang,','dan ekornya seperti ekor lumba-lumba.'],['Orang Rūm menamainya Qaythus,','dan segala yang dinisbatkan kepada bintang-bintang.'],['Bintang-bintangnya berada di selatan al-Hamal (Aries),','bercahaya pada setiap malam yang pekat.'],['Dan bintang-bintang ini, beserta sebagian (bintang) an-Nahr (sungai),','dikenal seluruh orang Arab dengan nama al-Baqar (sapi),'],['Pada moncongnya terlihat sebuah bintang,','orang Arab menamainya al-Kaff al-Jadzmā’ (telapak buntung),'],['cahayanya nyaris tak pernah tersembunyi,','mereka menjadikannya telapak bagi ats-Tsurayyā.'],['Mendahuluinya bintang-bintang bercahaya,','yang berada pada tulang-tulang rusuk gambar ini,'],['empat bintang membentuk bidang segi empat,','luas dan lapang bidangnya.'],['Ia (mereka) menjauh darinya sekitar lima qāmah,','dikenal orang Arab sebagai an-Na‘āmāt (burung-burung unta).'],['Di antara an-Na‘āmāt dan aḍ-Ḍifda‘ (Katak)','ada bintang-bintang yang bila tampak tidak berkilau,'],['empat bintang, tubuhnya samar,','dikenal orang Arab dengan nama an-Nazhām (untaian).']],
 ck:{0:'Syarah hal. 723–724: Qaythus = makhluk laut khayali (kepala singa, ekor lumba-lumba) yang dikenal Yunani dan pengikutnya; terletak di selatan al-Hamal, bintangnya bercahaya di timur. Ṣūfī: 22 bintang di dalam gambar, dan sekitar delapan di antaranya magnitudo 3 atau lebih besar.',4:'Syarah hal. 723, 727–728: bait «وهذه الأنجم مع بعض النهر / تعرفها الأعراب بالبقر» ada di riwayat 2 (bait 5), tidak di riwayat 1. Ṣūfī menolak (ruwiya… «dikatakan») bahwa seluruh Qaythus disebut al-Baqar; menurut Ibn Qutaibah al-Baqar hanyalah bintang-bintang tersebar antara al-Kaff al-Jadzmā’, ats-Tsurayyā, dan ad-Dabarān.',5:'Syarah hal. 728–731: al-Khathm = moncong/ujung hidung. al-Kaff al-Jadzmā’ (telapak buntung) dinamai demikian karena dianggap pendek, tidak panjang seperti al-Kaff al-Khadhīb (rangkaian bintang dari ats-Tsurayyā ke utara). Ṣūfī memakai nama ini untuk bintang pertama hingga keenam pada kepala Qaythus. Ibn Qutaibah dan al-Marzūqī: ats-Tsurayyā punya dua telapak; al-Jadzmā’ di bawah asy-Syarathān.',9:'Syarah hal. 731–732: an-Na‘āmāt (juga an-Na‘ām) = lima bintang pada tubuh Qaythus, terbit mengikuti al-Kaff al-Jadzmā’; satu qāmah menurut Ṣūfī ≈ 6,5 derajat, jadi jarak ±lima qāmah. Ṣūfī menyebut lima bintang itu (nomor 12–16 pada gambarnya) an-Na‘ām atau an-Na‘āmāt; ini sesuai dengan Ibn Qutaibah (lima bintang pada tarbī‘ an-na‘sh, mengikuti ar-Ri’āl).',10:'Bait 11–12 («بين النعامات وبين الضفدع / كواكب إذا بدت لم تلمع», «أربعة خفية الأجرام / تعرفها الأعراب بالنظام») khas riwayat 2; tidak ditemukan dalam bagian syarah yang dibaca (PDF 753–762). Riwayat 2 tidak memuat bait r1 tentang adh-Dhifda‘ ats-Tsānī/Rā‘ī an-Na‘āmāt. Terjemah dari matan; arti «an-Nazhām» (untaian) dan rujukan «aḍ-Ḍifda‘» tentatif.'},

{g:'Janūb',id:'r2_jbr',ok:1,ar:'الجبار',idn:'Jabbār (riwayat 2)',
 note:'Rasi Orion (PDF 130–131, cetak 100–101; 18 bait), «al-Jawzā’» pada Arab. Awam menamainya «al-Mīzān» hanya menurut Sulaimān al-Mahrī (tidak disebut Ibn Qutaibah, al-Marzūqī, Ṣūfī; Arab memakai «al-Mīzān» untuk tiga bintang an-Nasr aṭ-Ṭā’ir). <b>al-Haq‘ah</b> (manzilah ke-5) = tiga bintang kecil di kepala Jawzā’ seperti awan; juga <b>al-Athāfī</b> (batu penyangga periuk). <b>at-Taḥāyā/at-Taḥiyyāt/at-Tahā’ī</b> = tashhif atau nama lain <u>al-Han‘ah</u>, bukan al-Haq‘ah (bait 5–8 khas riwayat 2). <b>at-Tāj/adz-Dzawā’ib</b> = bintang kecil melingkar di atas kepala; <b>al-Fanīq</b> adalah nama lain ad-Dabarān (bukan bintang Jabbār). <b>an-Nājidz</b> menurut Arab = kaki kiri Jawzā’ (Rigel); yang merah bersinar = bahu kanan (<b>al-Mirzam</b>/<b>Rā‘ī al-Jawzā’</b>, Betelgeuse) — pensyarah mengkritik pencampuran nama pada riwayat ath-Thaqafī. <b>an-Niẓām/an-Niṭāq/al-Minṭaqah/al-Fiqār</b> = tiga bintang sabuk (Ṣūfī no. 26–28). <b>al-La‘ṭ</b> = garis hitam di wajah; <b>al-Hawārī/al-Jawāzī</b> = bintang-bintang pucat di bawah sabuk. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['الهقعة / الأثافي','tiga bintang kecil di kepala Jawzā’ (λ Ori dkk); manzilah ke-5','Haq‘ah / Athāfī'],['التحايا / التحائي','nama lain al-Han‘ah (bukan al-Haq‘ah)','Tahā’ī'],['التاج / الذوائب','bintang kecil melingkar di atas kepala','Tāj / Dzawā’ib'],['الناجذ','Rigel (β Ori), kaki kiri Jawzā’ menurut Arab','Nājidz'],['المرزم / راعي الجوزاء','Betelgeuse (α Ori), bahu kanan','Mirzam'],['النظام / النطاق / الفقار','tiga bintang sabuk (δ, ε, ζ Ori)','Niẓām / Niṭāq'],['الحواري / الجوازي','bintang pucat di bawah sabuk','Hawārī']],
 tr:[['Mengikutinya gugusan bintang al-Jabbār','yang dikenal di berbagai negeri'],['Dan kadang kelompok ini disebut al-Jawzā’,','bintang-bintang yang terbit dalam kegelapan,'],['Bintang-bintang bercahaya lagi termasyhur','di sela-selanya ada bintang-bintang kecil'],['Di antaranya ada bintang-bintang yang terhimpun di satu bidang','tiga bintang yang dijuluki al-Haq‘ah'],['Telah mengabarkan kepadaku orang yang tidak dituduh berdusta','bahwa ia bersama bintang (itu) bagaikan dua bintang,'],['bintang-bintang bagai mutiara-mutiara jernih,','dikenal orang Arab dengan nama al-Athāfī (tiga batu tungku),'],['Dan dengan nama at-Taḥiyyāt mereka disebut bersama,','dan berkata sebagian orang yang memahami (tutur) kaum itu'],['bahwa at-Tahā’ī, mereka dan at-Taḥiyyah,','didahului oleh bintang-bintang samar,'],['Rangkaian dari bintang-bintang ini','dikenal sebagai at-Tāj dan adz-Dzawā’ib'],['Tampak dekat bintang yang berkilau itu','itulah yang dikenal sebagai al-Fanīq'],['Mengikutinya an-Nājidz, yaitu al-Mirzam','bintang yang cahayanya terang, memukau'],['Ia dihiasi kemerahan dan cahaya,','dan disebut Rā‘ī al-Jawzā’ (penggembala al-Jawzā’).'],['Di bawahnya ada bintang-bintang bercahaya','dianggap termasuk bintang-bintang rasi ini'],['tiga bintang yang berjajar teratur,','dikenal sebagai an-Naẓm dan an-Niṭāq.'],['Dan dengan nama al-Fiqār pula kadang orang Arab menamainya,','demikianlah para ahli adab menyebutnya,'],['Sering pula ketiganya disebut bersama al-Minṭaqah','di belakangnya mengikuti bintang-bintang yang berderet'],['Tegak berdiri, itulah pedang al-Jabbār,','dikenal sebagai al-La‘ṭ oleh para ahli kabar,'],['semuanya redup cahayanya,','dikenal orang Arab dengan nama al-Hawārī (yang pucat),']],
 ck:{1:'Riwayat 2 tidak memuat bait riwayat 1 «بين العوام أنها الميزان»; gantinya «وربما سمّين بالجوزاء / كواكب تشرق في الظلماء» (dikutip syarah setelah bait 2, tidak ada di riwayat 1). Syarah (cetak 740–743) mencatat bahwa nama «al-Mīzān» di kalangan awam tidak disebut Ibn Qutaibah, al-Marzūqī, maupun Ṣūfī (hanya Sulaimān al-Mahrī); Arab memakai «al-Mīzān» untuk tiga bintang an-Nasr aṭ-Ṭā’ir.',3:'Syarah (cetak 744–745): al-Haq‘ah = tiga bintang kecil di kepala Jawzā’, mirip awan (Ṣūfī); disebut juga al-Athāfī; manzilah ke-5. Naskah riwayat 2 mencetak «بالهقعة» (dikoreksi di teks HTML dari «المقعة»).',4:'Bait 5–8 khas riwayat 2 («خبرني من لم يُدَن بالمين…», «كواكب كالدرر الصوافي…», «وبالتحيات…», «أن التحائي…»); dikutip syarah (cetak 744–747). «لم يُدَن بالمين» = tidak dituduh berdusta (al-mayn = dusta). Bait 5 syatr 2 «بأنها والنجم كالنجمين» tentatif; tidak ditemukan penjelasan khusus.',5:'Syarah (cetak 744–745): al-Athāfī (jamak «uthfiyyah», batu penyangga periuk) = nama lain tiga bintang kecil al-Haq‘ah di kepala Jawzā’ (Ṣūfī: mirip awan).',6:'Syarah (cetak 745–747): at-Taḥāyā/at-Taḥiyyāt/at-Tahā’ī = tashhif atau nama lain al-Han‘ah, BUKAN al-Haq‘ah. Dikutip syarah sebagai bait tambahan («وقال بعض من عن القوم وعى …»).',8:'Syarah (cetak 747–748): at-Tāj/adz-Dzawā’ib = bintang-bintang kecil melingkar di atas kepala (Ibn Qutaibah, al-Marzūqī); Ṣūfī membatasi pada bintang ke-17 s.d. 25 yang melengkung.',9:'Syarah (cetak 747–748): «al-Fanīq» adalah salah satu nama ad-Dabarān (bukan bintang rasi Jabbār) — «ذي البريق» ialah ad-Dabarān yang dekat at-Tāj.',10:'Syarah (cetak 748–752): nama «an-Nājidz» menurut Arab ialah kaki kiri Jawzā’ (Rigel); yang merah dan bersinar = bahu kanan (al-Mirzam/Rā‘ī al-Jawzā’). Bait ini sesuai hanya bila dibaca «ثمّ المرزم»; pensyarah mengkritik pencampuran nama dalam riwayat ‘Abdullāh ath-Thaqafī.',11:'Syarah (cetak 748–752): «Rā‘ī al-Jawzā’» = al-Mirzam (bahu kanan Jawzā’, merah dan bersinar); an-Nājidz menurut Arab = kaki kiri (Rigel). Bait 12 syarah ditulis «وهو يسمى راعي الجوزاء» sama dengan naskah ini.',13:'Syarah (cetak 755–756): an-Niẓām/an-Niṭāq/al-Minṭaqah = tiga bintang sabuk (Ṣūfī: no. 26–28); orang Arab juga menyebutnya al-Fiqār.',14:'Syarah (cetak 755–756): baris «وبالفقار قد يسميها العرب» dikutip syarah (tidak ada di riwayat 1). al-Fiqār = nama lain tiga bintang sabuk (an-Naẓm/an-Niṭāq/al-Minṭaqah; Ṣūfī no. 26–28).',16:'Syarah (cetak 756–757): al-La‘ṭ = garis (hitam) di wajah; al-Hawārī/al-Jawāzī = bintang-bintang pucat di bawah sabuk, «tidak sempurna cahayanya»; naskah ini membaca «منتصبات» (riwayat 1 «منتضيات»).',17:'Syarah (cetak 756–757): bait 12–13 versi syarah «جميعها خامله الأنوار / يعرفها الأعراب بالحواري»; al-Hawārī/al-Jawāzī = bintang-bintang pucat di bawah sabuk, «tidak sempurna cahayanya». Catatan kaki naskah (2) hal. 101: di sebagian kitab al-anwā’ «الجواري» dan «الجوازي».'},

{g:'Janūb',id:'r2_nhr',ok:1,ar:'النهر',idn:'Nahr (riwayat 2)',
 note:'Rasi Eridanus, riwayat 2 (12 bait; matan PDF 131–132 = cetak 101–102; syarah cetak 761–766 = PDF 791–796). Syarah mencetak bait pembuka dengan lafal riwayat 1 «يتبعه النهر نجومٌ تبتدي», sedangkan riwayat 2 «تتبعه كوكبة تدعى النهر». Bintang awal sungai = yang paling terang di Jawzā’: orang Yunani menyebutnya kaki al-Jabbār, orang Arab <b>Rijl al-Jawzā’</b>, <b>Rā‘ī al-Jawzā’</b>, atau <b>an-Nājidz</b>; naskah Princeton 2259 keliru menaruh baris «وهو ناجذ أو راعي…» di bagian Kalb Akbar. Lengkungan melingkar (bait 5) = <b>Udhiyy an-Nu‘ām</b> (sarang burung unta, dekat an-Na‘āmāt di rasi Qaythus); bintang di sekelilingnya = <b>al-Bayḍ</b> (telur) dan <b>al-Qayḍ</b> (pecahan kulit telur), diserupakan dengan sarang yang telurnya sebagian telah pecah. <b>Ākhir an-Nahr</b> (bait 10) = nama Yunani rasi ini (Acamar); Achernar kini dipakai untuk bintang lain yang lebih selatan. Orang Arab menamainya <b>al-Ẓalīm</b> (Ibn Qutaibah, Ṣūfī); Ṣūfī menggolongkannya magnitudo 1, padahal sebenarnya magnitudo 3. <b>ar-Ri’āl</b> (bait 12) = anak-anak burung unta (farākh an-Na‘ām): banyak bintang, sebagian redup sebagian terang, antara an-Nahr dan sebuah bintang berkelip di mulut Hūt Janūbī, dekat ujung aliran air Dalw; dinamai demikian karena berada di antara dua bintang aẓ-Ẓalīmān (Ibn Qutaibah: jaraknya kira-kira seratus hasta). Pensyarah menimbang aẓ-Ẓalīmān = dua Ḍifda‘ (lihat Rāmī). Rinci per bait di kotak catatan pensyarah.',
 tbl:[["الأدحي","lengkungan empat bintang membentuk persegi di atas dada «hewan laut» (Qaythus) (bait 3–5)","Adhāhī"],["البيض والقيض","bintang-bintang yang melingkari lengkungan itu (bait 6)","Bayḍ wa Qayḍ"],["الظليم","bintang tunggal menyala di ujung selatan sungai = Ākhir an-Nahr (Acamar), nama Yunani; Ṣūfī menggolongkannya magnitudo 1, sebenarnya 3; nama Achernar kini dipakai untuk bintang lain (bait 8–10)","Ẓalīm"],["الرئال","bintang-bintang banyak (sebagian redup, sebagian terang) antara an-Nahr dan bintang berkelip di mulut Hūt Janūbī; «anak burung unta» (bait 11–12)","Ri’āl"]],

ck:{0:'Syarah (cetak 761–762) mencetak bait pembuka dengan lafal riwayat 1 «يتبعه النهر نجومٌ تبتدي» — riwayat 2 ini «تتبعه كوكبة تدعى النهر». Bintang awal sungai = yang paling terang di Jawzā’: orang Yunani menyebutnya kaki al-Jabbār, orang Arab Rijl al-Jawzā’, Rā‘ī al-Jawzā’, atau an-Nājidz. Naskah Princeton 2259 keliru menaruh baris «وهو ناجذ أو راعي…» di bagian Kalb Akbar.',4:'Syarah (cetak 762, 765): lengkungan melingkar itu disebut orang Arab Udhiyy an-Nu‘ām (sarang burung unta, tempat bertelur); bintang-bintang di sekelilingnya disebut al-Bayḍ (telur) dan al-Qayḍ (pecahan kulit telur) — diserupakan dengan sarang yang telurnya sebagian telah pecah dan anaknya keluar. Udhiyy ini dekat an-Na‘āmāt di rasi Qaythus.',9:'Syarah (cetak 763, 765): «Ākhir an-Nahr» = nama Yunani rasi ini (Acamar); nama modern Achernar kini dipakai untuk bintang lain yang lebih selatan. Orang Arab menamainya al-Ẓalīm (Ibn Qutaibah, Ṣūfī); Ṣūfī menggolongkannya magnitudo 1, padahal sebenarnya magnitudo 3.',11:'Syarah (cetak 766): ar-Ri’āl = anak-anak burung unta (farākh an-Na‘ām); bintang-bintang banyak, sebagian redup sebagian terang, terletak antara an-Nahr dan sebuah bintang berkelip di mulut Hūt Janūbī, dekat ujung aliran air Dalw. Dinamai demikian karena berada di antara dua bintang yang disebut aẓ-Ẓalīmān (Ibn Qutaibah: jaraknya kira-kira seratus hasta). Pensyarah menimbang aẓ-Ẓalīmān = dua Ḍifda‘ (lihat Rāmī).'},

{g:'Janūb',id:'r2_arn',ok:1,ar:'الأرنب',idn:'Arnab (riwayat 2)',
 note:'Rasi Lepus, riwayat 2 (5 bait; matan PDF 132 = cetak 102; syarah cetak 772–776 = PDF 802–806). Bintang-bintang kecil tepat di bawah kedua kaki Jabbār. Syarah menilai sebutan «redup» tidak sehalus kenyataan: kebanyakan cukup jelas; Ṣūfī: 12 bintang bergambar, tak ada bintang lain di sekelilingnya. <b>‘Arsy al-Jabbār / ‘Arsy al-Jawzā’</b> (bait 3) = empat bintang berbentuk segi empat di badan al-Arnab (ke-7, 8, 9, 10 menurut Ṣūfī), disebut juga Kursī al-Jawzā’ al-Mu’akhkhar karena terbit setelah Kursī al-Jawzā’ al-Muqaddam (di rasi an-Nahr); letaknya di bawah kedua kaki al-Jawzā’. <b>an-Nihāl</b> (bait 4) = unta-unta haus yang datang ke air, dari dekatnya dengan Nahr al-Majarrah (Bimasakti) atau dari kerlipannya (Marzūqī: Kursī al-Jawzā’ = at-Tahl). <b>al-Makhā’il</b> (bait 5) = jamak mukhīlah, «awan yang tampak akan menurunkan hujan»; nama ini tidak ada pada Ṣūfī, Ibn Qutaibah, maupun al-Marzūqī, dan bait ini hanya ada di riwayat 2. Rinci per bait di kotak catatan pensyarah.',

ck:{0:'Syarah (cetak 772): bintang-bintang al-Arnab disebut «redup», tetapi pensyarah menilai kenyataannya kebanyakan cukup jelas dan tidak sehalus yang dinyatakan. Ṣūfī: 12 bintang bergambar, tak ada bintang lain di sekelilingnya.',2:'Syarah (cetak 772, 775): «‘Arsy al-Jawzā’» = empat bintang berbentuk segi empat di badan al-Arnab (ke-7, 8, 9, 10 menurut Ṣūfī), disebut juga Kursī al-Jawzā’ al-Mu’akhkhar karena terbit setelah Kursī al-Jawzā’ al-Muqaddam (di rasi an-Nahr); letaknya di bawah kedua kaki al-Jawzā’.',3:'Syarah (cetak 775): an-Nihāl = unta-unta haus yang datang ke air; nama ini muncul karena dekatnya dengan Nahr al-Majarrah (Bimasakti), atau karena kerlipannya (Marzūqī: Kursī al-Jawzā’ = at-Tahl).',4:'Syarah (cetak 776): al-Makhā’il = jamak mukhīlah, «awan yang tampak akan menurunkan hujan». Nama ini tidak ada pada Ṣūfī, Ibn Qutaibah, maupun al-Marzūqī, dan bait ini hanya ada dalam riwayat kedua.'},

{g:'Janūb',id:'r2_kb1',ok:1,ar:'الكلب الأكبر',idn:'Kalb Akbar (riwayat 2)',
 note:'Rasi Canis Major, riwayat 2 (10 bait; matan PDF 132–133 = cetak 102–103; syarah cetak 780–788 = PDF 810–818). Bintang yang mendahului Safīnah dan dahulu disembah orang = <b>asy-Syi‘rā al-Yamāniyah</b> = <b>al-‘Abūr</b> (Sirius), juga al-Kalb dan al-Murzim; disebut «Yamāniyah» karena terbit ke arah Yaman/selatan, dan «al-‘Abūr» karena konon menyeberangi Majarrah menyusul Suhail; inilah «asy-Syi‘rā» yang disembah di masa jahiliah (QS an-Najm: 49; Abū Kabsyah). Saudaranya al-Ghumaiṣā’ = asy-Syi‘rā asy-Syāmiyah (Procyon, di rasi lain). <b>Kaff al-Kalb</b> = Mirzam al-‘Abūr (Ṣūfī: bintang ke-9; juga «Mirzam asy-Syi‘rā»), bukan Mirzam Dzirā‘ (al-Ghumaiṣā’) maupun Mirzam al-Jawzā’; Mirzam al-‘Abūr tidak termasuk manzilah bulan. <b>al-‘Adzārā</b> (= ‘Udzrat al-Jawzā’; al-‘Udzrah tunggal): 5 bintang putih menurut Ibn Qutaibah, 3 menurut al-Marzūqī dan ath-Thaqafī (jadi 5 bila digabung), 4 menurut Ṣūfī (no. 12, 14, 15, 18 di ekor); dua bintang terangnya di Jazirah Arab dikenal sebagai al-Kalbain. Menurut ath-Thaqafī al-‘Udzrah terbit hampir bersamaan dengan Ṭarf, dan bagi pensyarah hampir bersamaan an-Natsrah. <b>al-Qurūd</b> (bait 9): naskah-naskah arjuzah dan sebagian naskah Anwā’ Ibn Qutaibah menulis «القرود» (kera), tetapi al-Marzūqī, ath-Thaqafī, dan kamus «الفرود» (bintang kecil yang menyendiri di dekat Ḥaḍār). <b>al-Aghribah</b> = jamak ghurāb (gagak), nama lain bagi bintang-bintang yang mengikuti al-‘Adzārā; syarah mencetak baris «هن والعذارى كلها مقتربة». Rinci per bait di kotak catatan pensyarah.',
 tbl:[["الشعرى العبور","Sirius α CMa; bintang cemerlang yang mendahului Safīnah (bait 2–3)","Sya‘rā ‘Abūr"],["الكلب / المرزم","nama bagi bentuk kaki depan Kalb (bait 4; ≈ β CMa)","Mirzam"],["العذارى / العذرة","bintang-bintang cemerlang menyusul Sirius, kaki dan ekor Kalb (bait 5–7; ≈ ε,δ,η CMa)","‘Adzārā"],["القرود","bintang-bintang cemerlang tanpa gambar di belakang al-‘Adzārā (bait 8–9; dari matan)","Qurūd"],["الأغربة","nama untuk kelompok yang dekat al-‘Adzārā (bait 10; dari matan)","Aghribah"]],

ck:{2:'Syarah (cetak 780–784): «asy-Syi‘rā al-Yamāniyah» = al-‘Abūr (Sirius), disebut «Yamāniyah» karena terbit ke arah Yaman/selatan, dan «al-‘Abūr» karena konon menyeberangi Majarrah menyusul Suhail; inilah «asy-Syi‘rā» yang disembah di masa jahiliah (QS an-Najm: 49; Abū Kabsyah). Saudaranya al-Ghumaiṣā’ = asy-Syi‘rā asy-Syāmiyah (Procyon, di rasi lain).',3:'Syarah (cetak 784–785): «Kaff al-Kalb» = Mirzam al-‘Abūr (Ṣūfī: bintang ke-9; juga «Mirzam asy-Syi‘rā»), bukan Mirzam Dzirā‘ (al-Ghumaiṣā’) maupun Mirzam al-Jawzā’; Mirzam al-‘Abūr tidak termasuk manzilah bulan.',5:'Syarah (cetak 786–787): al-‘Adzārā = ‘Udzrat al-Jawzā’; jumlahnya 5 bintang putih menurut Ibn Qutaibah, 3 menurut al-Marzūqī dan ath-Thaqafī (jadi 5 bila digabung), 4 menurut Ṣūfī (no. 12, 14, 15, 18 di ekor). Di Jazirah Arab dua bintang terangnya dikenal sebagai al-Kalbain.',6:'Syarah (cetak 787): al-‘Udzrah (tunggal) = nama lain al-‘Adzārā; menurut ath-Thaqafī ia terbit hampir bersamaan dengan Ṭarf, dan bagi pensyarah terbitnya hampir bersamaan an-Natsrah.',8:'Syarah (cetak 787–788): «القرود» (kera) dibahas: pada naskah-naskah arjuzah dan sebagian naskah Anwā’ Ibn Qutaibah tertulis «القرود», tetapi al-Marzūqī, ath-Thaqafī, dan kamus menulis «الفرود» (bintang-bintang kecil yang menyendiri di dekat Ḥaḍār).',9:'Syarah (cetak 787): al-Aghribah = jamak ghurāb (gagak), nama lain bagi bintang-bintang yang mengikuti al-‘Adzārā tadi; syarah mencetak baris ini «هن والعذارى كلها مقتربة».'},

{g:'Janūb',id:'r2_kb2',ok:1,ar:'الكلب الأصغر',idn:'Kalb Ashghar (riwayat 2)',
 note:'Rasi Canis Minor, riwayat 2 (5 bait; matan PDF 133 = cetak 103; syarah cetak 794–798 = PDF 824–828; lafal sama dengan riwayat 1). Dua bintang, satu redup dan satu terang; «yatba‘uhu» tidak berarti terbit sesudah al-Akbar — keduanya terbit hampir bersamaan, dan Ṣūfī menyebutnya «al-Kalb al-Muqaddam» dalam tabelnya. Yang terang (magnitudo 1) = <b>asy-Syi‘rā asy-Syāmiyah</b> (Procyon) = <b>al-Ghumūṣ / al-Ghumaiṣā’</b> (juga al-Ghamṣā’, Abū ‘Amr), dipandang pasangan asy-Syi‘rā al-‘Abūr dengan Majarrah di antaranya; yang satunya ±2 hasta di sebelah utaranya (magnitudo 4). «Adz-Dzirā‘» (bait 2) = adz-Dzirā‘ al-Maqbūḍah (lengan Asad), sedangkan adz-Dzirā‘ al-Mabsūṭah = dua bintang di kepala Tau’amān; pensyarah menandai kerancuan letak antara Ibn Qutaibah (al-Maqbūḍah ke utara) dan ath-Thaqafī serta al-Marzūqī (al-Maqbūḍah ke selatan, tempat bulan turun), dan syarah mencetak matan dengan celah «[ ]» pada syatr ini. «Al-Mirzam» yang lebih redup = <b>Mirzam adz-Dzirā‘</b> (bintang merah kecil), berbeda dari Mirzam al-Jawzā’ dan Mirzam al-‘Abūr; ia kadang disinggahi bulan (al-Marzūqī), Mirzam al-‘Abūr tidak. «‘Abrā» = menangis: menurut riwayat Arab al-Ghumaiṣā’ menangis karena kehilangan Suhail hingga matanya «ghamiṣat» (kabur). Rinci per bait di kotak catatan pensyarah.',
 tbl:[["الذراع","nama bagi kedua bintang rasi ini (bait 2)","Dzirā‘"],["الغميصاء / الغموص","bintang paling terang (≈ Procyon α CMi); Arab menyebutnya asy-Syi‘rā al-Ghumayṣā’, bintang yang «menangis» (bait 3–5)","Ghumayṣā’"],["المرزم","bintang yang lebih redup (≈ β CMi) (bait 4)","Mirzam"]],
 tr:[['Mengikutinya seekor anjing yang disebut al-Aṣghar','sebuah bintang tanpa cahaya dan sebuah bintang yang gemilang'],['Keduanya dikenal sebagai adz-Dzirā‘','dan yang lebih bercahaya dan gemilang itu berpendar sinar'],['Dikenal sebagai al-Ghamūṣ dan al-Ghumaiṣā’','dan para penyusun kitab anwā’ mengira'],['bahwa namanya adalah al-Ghumaiṣā’, ketahuilah','dan bintang yang lebih redup dinamai al-Mirzam'],['Orang Arab menamai al-Ghumaiṣā’ asy-Syi‘rā','dan mengiranya bermata menangis (‘abrā)']],
ck:{0:'Syarah (cetak 794): al-Kalb al-Aṣghar terdiri dari dua bintang, satu redup dan satu terang. «Yatba‘uhu» tidak berarti terbit sesudah al-Akbar: keduanya terbit hampir bersamaan, dan Ṣūfī dalam tabelnya menyebutnya «al-Kalb al-Muqaddam». Ṣūfī: yang terang (magnitudo 1) = asy-Syi‘rā asy-Syāmiyah, yang satunya ±2 hasta di sebelah utaranya (magnitudo 4).',1:'Syarah (cetak 794–798): «adz-Dzirā‘» di sini = adz-Dzirā‘ al-Maqbūḍah (salah satu lengan Asad), sedangkan adz-Dzirā‘ al-Mabsūṭah = dua bintang di kepala Tau’amān. Pensyarah menandai kerancuan: Ibn Qutaibah menyebut al-Maqbūḍah ke utara, ath-Thaqafī dan al-Marzūqī menyebutnya selatan (tempat bulan turun) dan al-Mabsūṭah ke utara; yang cocok dengan kenyataan: al-Mabsūṭah lebih tinggi. Syarah mencetak matan dengan celah «[ ]» pada syatr ini.',2:'Syarah (cetak 797–798): al-Ghumaiṣā’ = al-Ghamūṣ = al-Ghamṣā’ (Abū ‘Amr), yaitu asy-Syi‘rā asy-Syāmiyah (Procyon); ia dipandang sebagai pasangan asy-Syi‘rā al-‘Abūr dengan Majarrah di antaranya.',3:'Syarah (cetak 797–798): «al-Mirzam» yang lebih redup = Mirzam adz-Dzirā‘ (bintang merah kecil), berbeda dari Mirzam al-Jawzā’ dan Mirzam al-‘Abūr; Mirzam adz-Dzirā‘ kadang disinggahi bulan (al-Marzūqī), Mirzam al-‘Abūr tidak.',4:'Syarah (cetak 783, 797): «‘abrā» = menangis; menurut riwayat Arab, al-Ghumaiṣā’ menangis karena kehilangan Suhail hingga matanya «ghamiṣat» (kabur), sedangkan al-‘Abūr menyeberangi Majarrah (lihat Kalb Akbar).'},

{g:'Janūb',id:'r2_sfn',ok:1,ar:'السفينة',idn:'Safīnah (riwayat 2)',
 note:'Rasi Argo Navis, riwayat 2 (8 bait; matan PDF 133–134 = cetak 103–104; syarah cetak 806–810 = PDF 836–840). Rasi ini berisi 45 bintang; karena dekat kutub selatan, gerak hariannya hanya busur rendah yang tidak naik tinggi di atas ufuk. Terbit sesudah «al-Furūd» di Kalb Akbar (syarah mencetak «الفرود», naskah ini «القرود»). <b>Suhail</b> (Canopus; «Suhail al-Yaman») = bintang merah-putih tunggal di dekat ufuk; klaim bahwa sinarnya «melampaui cahaya Musytari» tidak tepat — Musytari lebih terang, hanya Zuhrah yang melebihinya, dan Suhail bintang tercerlang kedua setelah asy-Syi‘rā al-Yamāniyah. Ibn Qutaibah menyebut pula Suhail Bulqayn, Ḥaḍār, dan al-Wazn sebagai bintang lain bernama sama; Ṣūfī: riwayat Arab tentang nama bintang-bintang as-Safīnah beragam. <b>Kaukab al-Khurqā’</b> (bait 6): al-Khurqā’ = perempuan ceroboh yang menyia-nyiakan musim panas tanpa memintal untuk musim dingin; ketika Suhail terbit di waktu fajar ia sadar waktu sudah sempit lalu meminjam pintalan tetangganya — kisah yang menjelaskan nama itu. «Madā’in al-Jibāl» (bait 7) = kota-kota di wilayah al-Jibāl (Irak ‘Ajam: Azerbaijan, Daylam, Qazwīn, dsb., menurut Abū al-Fidā’); syarah mencetak syatr 1 «في جهة الشمال», varian atas «في صقع» di naskah ini. Rinci per bait di kotak catatan pensyarah.',
 tbl:[["سهيل","Canopus α Car; bintang indah lebih terang daripada Musytari; juga «كوكب الخرقاء»; tak tampak di utara (bait 4–8)","Suhail"]],
 tr:[['Sesudahnya bintang-bintang as-Safīnah','bintang-bintang yang bersinar lagi jelas'],['Mereka terbit setelah terbitnya al-Qurūd','dan mereka tak terlalu jauh darinya'],['Bintang-bintangnya banyak dan berjalinan rapat','geraknya mengitari kutub selatan'],['Di antaranya ada bintang yang indah kilauannya','sinarnya melampaui cahaya Musytari'],['Cahayanya menaklukkan malam','orang-orang Arab padang pasir menyebutnya Suhail'],['Ia kadang dinamai pula Kaukab al-Khurqā’','seperti dikisahkan para penyusun kitab anwā’'],['Ia tak terlihat di kawasan utara','dan di sebagian kota-kota pegunungan'],['Ia tampak jelas bagi penghuni selatan','karena dekatnya dari kutubnya yang tersembunyi']],
ck:{1:'Syarah (cetak 806): bintang-bintang as-Safīnah terbit sesudah «al-Furūd» di rasi Kalb Akbar; syarah mencetak «الفرود», sedangkan naskah ini «القرود» (lihat catatan Kalb Akbar).',2:'Syarah (cetak 806, 808): rasi ini berisi 45 bintang; karena dekat kutub selatan, gerak hariannya hanya berupa busur rendah dan tidak naik tinggi di atas ufuk.',3:'Syarah (cetak 806): klaim bahwa sinar Suhail «melampaui cahaya Musytari» tidak tepat — Musytari lebih terang, hanya Zuhrah yang melebihinya; Suhail ialah bintang tercerlang kedua di langit setelah asy-Syi‘rā al-Yamāniyah.',4:'Syarah (cetak 809): «Suhail al-Yaman» = Canopus, bintang merah-putih tunggal di dekat ufuk; Ibn Qutaibah menyebut pula Suhail Bulqayn, Ḥaḍār, dan al-Wazn sebagai bintang lain yang bernama sama; Ṣūfī menyatakan riwayat Arab tentang nama bintang-bintang as-Safīnah beragam.',5:'Syarah (cetak 809): «al-Khurqā’» = perempuan ceroboh yang menyia-nyiakan waktunya di musim panas dan tidak memintal untuk musim dingin; ketika Suhail terbit di waktu fajar ia sadar waktu sudah sempit, lalu meminta tetangganya meminjamkan pintalan — kisah yang menjelaskan nama «Kaukab al-Khurqā’» bagi Suhail.',6:'Syarah (cetak 810): «مدائن الجبال» = kota-kota di wilayah al-Jibāl (Irak ‘Ajam: Azerbaijan, Daylam, Qazwīn, dsb., menurut Abū al-Fidā’); syarah mencetak syatr 1 «في جهة الشمال», varian atas «في صقع» di naskah ini.'},

{g:'Janūb',id:'r2_shj',ok:1,ar:'الشجاع',idn:'Syujā‘ (riwayat 2)',
 note:'Rasi Hydra, riwayat 2 (9 bait; matan PDF 134 = cetak 104; syarah cetak 824–834 = PDF 854–864). Empat bintang pembuka di kepala Syujā‘ terletak di antara Qalb al-Asad (Regulus) dan adz-Dzirā‘ al-Maqbūḍah, sejajar bintang-bintang Saratān; sisanya mengikuti di leher dan punggung, terbit ketika Qalb al-Asad terbit. Ṣūfī menghitung 25 bintang, dua di luar gambar; menurutnya empat bintang itu menyerupai wajah kuda, berkumpul antara asy-Syi‘rā al-Ghumaiṣā’ dan Qalb al-Asad, agak condong ke selatan; al-Marzūqī menyebutnya «ra’s al-ḥayyah». Catatan kaki naskah (bait 3): «إذا الليث شرق» (Singa terbit) dipilih atas «الليل سرق/شرق» (Tehran, Gotha, Quds), karena Syujā‘ terbit bersama Asad; riwayat 1 membaca «إذا القلب شرق». <b>al-Fard</b> (Alphard) = bintang yang menyendiri; «al-haql» = burung unta jantan muda yang warnanya berubah antara hitam dan abu-abu (Lisān al-‘Arab). «Ra’s/badan/‘unuq/fiqār al-ḥayyah» (al-Marzūqī) BUKAN nama Arab asli, melainkan sebutan bagi gambar Yunani. Abū Ḥanīfah: lintasan al-Fard dekat garis pemisah antara bintang Syām dan Yaman; syarah mencetak syatr 2 «القدماء» (naskah ini «العلما»). <b>al-Ḥubāb</b> = al-ḥayyah; <b>al-Khayl</b> = bintang yang agak terang, dan <b>al-Aflā’</b> = bintang kecil di sela-selanya (anak-anak kuda). Ṣūfī menempatkannya di antara Syujā‘, Asad, dan ‘Adzrā’, tetapi Ibn Qutaibah, Abū Ḥanīfah, dan ath-Thaqafī menempatkannya dekat Aqrab dan al-Majarrah (kawasan Qanthūrus–Sab‘–Syawlah); pensyarah: penentuan Ṣūfī tidak cocok dengan uraian Arab itu. <b>asy-Syarāsīf</b> (bait 9) = pangkal/ujung tulang rusuk (atau unta yang terikat), bintang memanjang seperti tali di antara al-Fard dan al-Khabā’ (Ghurāb); al-Khabā’ ini berbeda dari al-Khabā’ di Hawdh Asad (Ibn Qutaibah); tabel syarah: Hya no. 13–23 dan β Crt. Rinci per bait di kotak catatan pensyarah.',
 tbl:[["الفرد","Alphard (α Hya), bintang yang menyendiri","Fard"],["الخيل / الأفلاء","bintang agak terang / bintang kecil di sela-selanya; menurut Arab dekat Aqrab–Majarrah","Khayl / Aflā’"],["الشراسيف","bintang Hya no. 13–23 dan β Crt (tabel pensyarah)","Syarāsīf"],["الحباب","al-ḥayyah (ular; rasi Syujā‘, ck6); sisa bintang al-Ḥubāb dikenal al-Khayl di kalangan Arab (bait 7; matan)","Ḥubāb"]],
 tr:[['Mengikutinya bintang-bintang asy-Syujā‘','di antara Jantung Singa dan adz-Dzirā‘'],['Empat bintang yang bercahaya','diikuti bintang-bintang yang samar'],['Mereka berada di kepala dan leher Syujā‘','tampak bagi mata ketika Singa terbit'],['Mengikutinya, dari bintang-bintang Syujā‘,','sebuah bintang besar yang bersinar'],['Ia berkilau di suatu bidang langit','yang di situ tak ada bintang lain yang tampak oleh pengamat'],['Seakan-akan ia al-Haql bila warnanya menggelap keabu-abuan','para ulama menamainya al-Fard'],['Dan sisa bintang-bintang al-Ḥubāb','dikenal dengan nama al-Khayl di kalangan orang Arab'],['Sebagian lainnya redup cahayanya','orang Arab mengenalnya sebagai al-Aflā’'],['Orang Arab juga menamainya asy-Syarāsīf','tak sampai kepada kami tentangnya selain julukan ini']],
ck:{0:'Syarah (cetak 824–825): empat bintang pembuka di kepala Syujā‘ terletak di antara Qalb al-Asad dan adz-Dzirā‘ al-Maqbūḍah, sejajar dengan bintang-bintang Saratān; sisanya mengikuti di leher dan punggungnya, terbit ketika Qalb al-Asad terbit. Ṣūfī menghitung 25 bintang, dua di antaranya di luar gambar.',1:'Syarah (cetak 824, 826–827): menurut Ṣūfī, empat bintang ini menyerupai wajah kuda, berkumpul antara asy-Syi‘rā al-Ghumaisā’ dan Qalb al-Asad, agak condong ke selatan; al-Marzūqī menyebutnya «ra’s al-ḥayyah» (kepala ular).',2:'Catatan kaki naskah: «إذا الليث شرق» (Singa terbit) dipilih atas «الليل سرق/شرق» (Tehran, Gotha, Quds), karena Syujā‘ terbit bersama Asad; riwayat 1 membaca «إذا القلب شرق».',5:'Syarah (cetak 826–828): al-Fard = bintang yang menyendiri (Alphard α Hya; cetak 834); «al-haql» = burung unta jantan muda yang warnanya berubah antara hitam dan abu-abu (Lisān al-‘Arab). Nama-nama «ra’s al-ḥayyah», «badan al-ḥayyah», «‘unuq al-ḥayyah», «fiqār al-ḥayyah» (al-Marzūqī) BUKAN nama Arab asli, melainkan sebutan bagi gambar Yunani. Abū Ḥanīfah: lintasan al-Fard dekat garis pemisah antara bintang-bintang Syām dan Yaman; syarah mencetak syatr 2 «القدماء» (naskah ini «العلما»).',6:'Syarah (cetak 828–832): al-Ḥubāb = al-ḥayyah; al-Khayl = bintang-bintang yang agak terang, dan al-Aflā’ = bintang-bintang kecil di sela-selanya (anak-anak kuda). Ṣūfī menempatkannya di antara Syujā‘, Asad, dan ‘Adzrā’, tetapi nas Ibn Qutaibah, Abū Ḥanīfah, dan ath-Thaqafī menempatkannya dekat Aqrab dan al-Majarrah (kawasan Qanthūrus–Sab‘–Syawlah). Pensyarah: penentuan Ṣūfī tidak cocok dengan uraian Arab itu.',8:'Syarah (cetak 833–834): asy-Syarāsīf = pangkal tulang rusuk/ujung rusuk (atau unta yang terikat), bintang-bintang memanjang seperti tali di antara al-Fard dan al-Khabā’ (Ghurāb); al-Khabā’ ini berbeda dari al-Khabā’ di Hawdh Asad (Ibn Qutaibah). Tabel (cetak 834): asy-Syarāsīf = bintang-bintang Hya no. 13–23 dan β Crt.'},

{g:'Janūb',id:'r2_btt',ok:1,ar:'الباطية',idn:'Bāthiyah (riwayat 2)',
 note:'Rasi Crater, riwayat 2 (4 bait; matan PDF 134–135 = cetak 104–105; syarah cetak 838–841 = PDF 868–871; lafal sama dengan riwayat 1). «Maṭā al-ḥayyah» = punggung ular, yakni punggung Syujā‘: bintang-bintang samar tersusun melingkar di atasnya, antara Syujā‘ dan al-‘Adzrā’. <b>al-Mi‘laf</b> (palung pakan; dari «‘alaf») dilukiskan Ibn Qutaibah dan al-Marzūqī terletak di antara asy-Syarāsīf dan al-Khabā’ al-Yamānī, tersebar tak beraturan; bukan al-Khabā’ itu sendiri, hanya bintang di dekatnya; tabel syarah: γ, δ, η, θ, ζ, ε Crt (enam bintang). <b>al-Bāthiyah</b> (bejana besar tempat menciduk minuman) dan <b>al-Ka’s</b> (piala) adalah nama menurut ahli falak/nujum aliran Yunani, bukan nama Arab; bintangnya tak jauh dari as-Simāk al-A‘zal. Rinci per bait di kotak catatan pensyarah.',
 tbl:[["المعلف","enam bintang melingkar (γ, δ, η, θ, ζ, ε Crt)","Mi‘laf"],["الباطية / الكأس","nama Yunani (bukan nama Arab): bejana besar / piala","Bāthiyah / Ka’s"]],
 tr:[['Mengikutinya bintang-bintang kecil','di atas punggung Ular, berbentuk melingkar'],['Orang Arab mengenalnya dengan nama al-Mi‘laf','yaitu yang diikuti oleh al-Ghurāb'],['Para ahli nujum menamainya al-Bāthiyah','dan ia dekat dengan bintang as-Simāk'],['Juga al-Ka’s (cawan) namanya di kalangan Romawi','dan di kalangan setiap ahli ilmu nujum']],
ck:{0:'Syarah (cetak 838–839): «maṭā al-ḥayyah» = punggung ular, yakni punggung Syujā‘; bintang-bintang samar ini tersusun melingkar di atasnya, terletak di antara Syujā‘ dan al-‘Adzrā’. Mi‘laf berasal dari «‘alaf» (tempat pakan ternak), sebagai perumpamaan.',1:'Syarah (cetak 838–841): al-Mi‘laf = bintang-bintang melingkar yang oleh Ibn Qutaibah dan al-Marzūqī dilukiskan terletak di antara asy-Syarāsīf dan al-Khabā’ al-Yamānī, tersebar tidak beraturan; bukan al-Khabā’ itu sendiri, hanya bintang-bintang di dekatnya. Tabel (cetak 841): al-Mi‘laf = γ, δ, η, θ, ζ, ε Crt (enam bintang). Syarah mencetak «المَعْلَف» dengan harakat.',2:'Syarah (cetak 841): «al-Bāthiyah» dan «al-Ka’s» adalah nama menurut ahli falak/ahli nujum aliran Yunani, bukan nama Arab; al-Bāthiyah = bejana besar tempat menciduk minuman. Bintang-bintangnya tidak jauh dari as-Simāk al-A‘zal.'},

{g:'Janūb',id:'r2_ghr',ok:1,ar:'الغراب',idn:'Ghurāb (riwayat 2)',
 note:'Rasi Corvus, riwayat 2 (8 bait; matan PDF 135 = cetak 105; syarah cetak 844–849 = PDF 874–879; lafal nyaris sama dengan riwayat 1). Berisi tujuh bintang, empat di antaranya terang, di atas punggung <b>al-Ḥubāb</b>; al-Ḥubāb dan Syujā‘ = ular (satu rasi). «Janāḥ al-Ghurāb» (sayap kanan; bait 4) BUKAN nama Arab, melainkan dari tradisi astrolab Yunani yang bertumpu pada tabel koordinat gambar Yunani; Ṣūfī menyebutnya bintang ke-4 di sayap kanan yang paling terang (γ Crv; pada zamannya bujur 26°12′ sesudah burj kelima [Asad], lintang 14°50′). Bait 5: syarah mencetaknya dengan syatr 1 kosong «[ ]»; <b>al-Ajmāl</b> (jamak jamal) ditetapkan dalam kitab-kitab, sebagian naskah menulis «al-Aḥmāl»; pensyarah menilai «al-Ajmāl» lebih kuat karena bintang-bintang ini dekat al-Mi‘laf dan asy-Syarāsīf (tempat pakan ternak dan unta terikat). Bait 6: <b>al-Khabā’ al-Yamāniyah</b> = bintang-bintang al-Ghurāb; ada «al-Khabā’» lain (asy-Syāmiyah) di antara Hawdh, Jady, dan al-‘Ayyūq (lihat Mumsik al-A‘innah). Ibn Qutaibah dan al-Marzūqī (Abū Ḥanīfah): «khabā’» = «‘arsy as-simāk», sebab bintang-bintang ini dekat as-Simāk al-A‘zal. Bait 7: al-Ghurāb dinamai <b>‘Arsy as-Simāk al-A‘zal</b> karena dekat dengannya dan berbentuk persegi empat; as-Simāk al-A‘zal termasuk rasi as-Sunbulah (al-‘Adzrā’). Bait 8: <b>‘Ajz al-Asad</b> (pantat Singa) karena Singa Arab digambarkan besar memanjang hingga as-Simāk, sedangkan as-Simāk al-A‘zal = betis Singa, sehingga bintang-bintang ini = pantat di dekat betis. Ibn Kunāsah: empat bintang antara kedua tangan as-Simāk, miring, bersegi empat seperti an-Na‘sy; kadang bulan singgah di sini. Syarah mencetak «عجزاً للأسد» (naskah ini «عجز الأسد»); baris kedua r2 «لم أع» = «tak kuketahui». Rinci per bait di kotak catatan pensyarah.',
 tbl:[["جناح الغراب","γ Crv","Janāh"],["الأجمال / الخبا / عرش الأعزل / عجز الأسد","nama-nama lain bagi bintang-bintang Ghurāb (bait 5–8; dari matan)","Ajmāl"]],

ck:{0:'Syarah (cetak 844): rasi al-Ghurāb berisi tujuh bintang, empat di antaranya terang, terletak di atas punggung al-Ḥubāb; al-Ḥubāb dan Syujā‘ = ular (satu rasi).',3:'Syarah (cetak 844): «Janāḥ al-Ghurāb» (sayap kanan) BUKAN nama Arab, melainkan nama dari tradisi astrolab Yunani yang bertumpu pada tabel koordinat gambar Yunani; Ṣūfī menyebutnya bintang ke-4 di sayap kanan yang paling terang (γ Crv; pada zamannya bujur 26°12′ sesudah burj kelima [Asad], lintang 14°50′).',4:'Syarah (cetak 847): bait ini dicetak syarah dengan syatr 1 kosong «[ ]». Nama «al-Ajmāl» (jamak jamal) ditetapkan dalam kitab-kitab, sedangkan sebagian naskah menulis «al-Aḥmāl» (tanpa titik); pensyarah menilai «al-Ajmāl» lebih kuat karena bintang-bintang ini berdekatan dengan al-Mi‘laf dan asy-Syarāsīf (tempat pakan ternak dan unta terikat).',5:'Syarah (cetak 847–848): al-Khabā’ al-Yamāniyah = bintang-bintang al-Ghurāb; ada «al-Khabā’» lain (asy-Syāmiyah) di antara Hawdh, Jady, dan al-‘Ayyūq (dijelaskan pada Mumsik al-A‘innah). Ibn Qutaibah dan al-Marzūqī (Abū Ḥanīfah): «khabā’» = «‘arsy as-simāk»; bintang-bintang ini dekat as-Simāk al-A‘zal.',6:'Syarah (cetak 847–848): al-Ghurāb dinamai «‘Arsy as-Simāk al-A‘zal» karena dekat dengannya dan berbentuk persegi empat; as-Simāk al-A‘zal termasuk rasi as-Sunbulah (al-‘Adzrā’).',7:'Syarah (cetak 847–849): «‘Ajz al-Asad» (pantat Singa) karena Singa Arab digambarkan besar memanjang hingga as-Simāk; as-Simāk al-A‘zal = betis Singa, maka letak bintang-bintang ini = pantat di dekat betis. Ibn Kunāsah: empat bintang antara kedua tangan as-Simāk, miring, bersegi empat seperti an-Na‘sy; kadang bulan singgah di sini. Syarah mencetak «عجزاً للأسد» (naskah ini «عجز الأسد»; baris kedua r2 «لم أع» — «tak kuketahui»).'},

{g:'Janūb',id:'r2_qnt',ok:1,ar:'قنطورس والسبع',idn:'Qanthūrus & Sab‘ (riwayat 2)',
 note:'Rasi Centaurus & Lupus, riwayat 2 (10 bait; matan PDF 135–136 = cetak 105–106; syarah cetak 852–862 = PDF 882–892). Gambar ini terdiri dari dua rasi yang bertumpang tindih: <b>Qanthūrus</b> (manusia separuh kuda) dan <b>as-Sab‘</b> (binatang buas yang digenggamnya), di selatan al-‘Aqrab dan Syujā‘; Ṣūfī: 37 bintang Qanthūrus (Ptolemeus 37) dan 18 bintang as-Sab‘ (Ptolemeus 19). «Singa/binatang buas» (bait 3) = as-Sab‘; nama-nama ini dari gambar Yunani, bukan penamaan Arab. Qanthūrus = manusia dari kepala hingga pinggang, bagian belakang seperti kuda berakhir di ekor, di selatan al-Mīzān dengan wajah menghadap timur (Ṣūfī); «mī‘at al-ḥiṣān» (bait 4) = awal larinya dan kegesitannya. <b>asy-Syamārīkh</b> (bait 6; jamak syumrūkh/syimrākh) = tandan kurma tempat buahnya, karena cahaya bintangnya saling berdekatan; letaknya jauh di selatan, dekat kutub selatan yang tersembunyi dan tidak naik tinggi dari ufuk. Ibn Qutaibah dan al-Marzūqī: bintang-bintang banyak di depan dan bawah al-‘Aqrab, antara az-Zubānayayn dan ‘Arsy as-Simāk, sesudah al-Mi‘laf; Ṣūfī menjadikannya seluruh bintang kedua rasi, sedangkan pensyarah: riwayat Arab hanya menunjuk sebagian. Riwayat 2 tidak memuat baris «وكلها قريبة من القطب» maupun «وبالشماريخ تسميها العرب». Bait 8–9: dua bintang yang paling selatan di kedua rasi, hampir tak terlihat dari lintang utara seperti Irak dan al-Jabal (wilayah Qazwīn); «asy-syawā» = kaki kuda, «as-sābiḥ ar-rafn» = kuda berekor panjang; dalam gambar keduanya kaki depan Qanthūrus. <b>al-Muḥlifān / al-Muḥnisyān</b> (bait 10) dinamai begitu karena orang yang melihat salah satunya mengira itu Suhail lalu bersumpah, kemudian ketahuan keliru lalu melanggar sumpah. Penentuan Ṣūfī (Ḥaḍār = β Cen, al-Wazn = α Cen) hanyalah ijtihad tanpa riwayat Arab yang menentukan; Ṣūfī menolak pendapat bahwa keduanya dua bintang terang di luar gambar Kalb Akbar padahal dalil lain tidak memastikan; ath-Thaqafī menyebut Ḥaḍār terlihat di Andalusia, sehingga mungkin keduanya bintang lain (α Eri dan α Phe). Rinci per bait di kotak catatan pensyarah.',
 tbl:[["حضار / الوزن","β & α Cen menurut penentuan Ṣūfī (ijtihad, bukan riwayat Arab)","Hadār, Wazn"],["الشماريخ","tandan; bintang-bintang jauh di selatan dekat kutub tersembunyi","Syamārīkh"],["المحلفان / المحنشان","dua bintang paling selatan (kaki depan Qanthūrus)","Muḥlifān"]],
 tr:[['Mengikutinya bintang-bintang yang berkelindan','semuanya mengelilingi al-Muḥlifayn'],['Engkau melihatnya di selatan al-‘Aqrab','di antaranya dan ufuk barat'],['Kebanyakan dari mereka gemilang dan bercahaya','ia diserupakan dengan singa yang garang'],['dan makhluk yang separuhnya manusia','dan separuhnya lagi kuda yang lincah'],['Bintang-bintangnya termasuk yang tergemilang','ia disebut Qanthūrus di kalangan Romawi'],['Telah mengabariku orang yang tak berdusta','bahwa asy-Syamārīkh namanya di kalangan Arab'],['Dalam rangkaian gambar itu ada dua bintang','berpasangan, keduanya berkilau'],['Keduanya bagaikan api yang menyala','tidak tampak di Irak dan al-Jabal'],['Keduanya adalah kaki bagi kuda pelari berekor panjang','dan dijuluki Ḥaḍār dan al-Wazn'],['Al-Muḥlifān nama keduanya di kalangan Arab','dan al-Muḥnithān juga julukan bagi keduanya']],
ck:{0:'Syarah (cetak 852–853): gambar ini terdiri dari dua rasi yang bertumpang tindih: Qanthūrus (manusia separuh kuda) dan as-Sab‘ (binatang buas yang digenggamnya), di selatan al-‘Aqrab dan Syujā‘. Ṣūfī: 37 bintang Qanthūrus (Ptolemeus 37) dan 18 bintang as-Sab‘ (Ptolemeus 19). Dua bintang di antaranya disebut al-Muḥlifān.',2:'Syarah (cetak 852): «singa/binatang buas» di sini = as-Sab‘, gambar binatang buas yang dipegang oleh makhluk lain (Qanthūrus); nama-nama ini berasal dari gambar Yunani, bukan dari penamaan Arab.',3:'Syarah (cetak 852, 855): Qanthūrus = manusia dari kepala hingga pinggang, bagian belakang tubuh seperti kuda yang berakhir di ekor, terletak di selatan al-Mīzān dengan wajah menghadap timur (Ṣūfī). «Mī‘at al-ḥiṣān» = awal larinya dan kegesitannya.',5:'Syarah (cetak 855–857): asy-Syamārīkh (jamak syumrūkh/syimrākh) = tandan kurma tempat buahnya, dinamai demikian karena cahaya bintang-bintangnya saling berdekatan; letaknya jauh di selatan, dekat kutub selatan yang tersembunyi dan tidak naik tinggi dari ufuk. Ibn Qutaibah dan al-Marzūqī: bintang-bintang banyak berjalan di depan dan bawah al-‘Aqrab, antara az-Zubānayayn dan ‘Arsy as-Simāk, sesudah al-Mi‘laf; sedangkan Ṣūfī menjadikannya seluruh bintang kedua rasi. Pensyarah: riwayat Arab hanya menunjuk sebagian, bukan seluruh bintang Qanthūrus dan as-Sab‘. Riwayat 2 tidak memuat baris «وكلها قريبة من القطب» maupun «وبالشماريخ تسميها العرب».',7:'Syarah (cetak 859): dua bintang ini adalah yang paling selatan di antara bintang-bintang kedua rasi, hampir tak terlihat dari lintang utara seperti Irak dan al-Jabal (wilayah Qazwīn).',8:'Syarah (cetak 859): «asy-syawā» = kaki-kaki kuda; «as-sābiḥ ar-rafn» = kuda yang berekor panjang; al-Khayl = «sawābiḥ». Dalam gambar, kedua bintang ini ialah kaki depan Qanthūrus.',9:'Syarah (cetak 859–862): al-Muḥlifān/al-Muḥnithān dinamai begitu karena orang yang melihat salah satunya mengira itu Suhail lalu bersumpah, kemudian ketahuan keliru lalu melanggar sumpah. Menurut pensyarah, penentuan Ṣūfī (Ḥaḍār = β Cen, al-Wazn = α Cen) hanyalah ijtihad, tanpa riwayat Arab yang menentukan; Ṣūfī menolak pendapat yang menjadikan keduanya dua bintang terang di luar gambar Kalb Akbar, padahal dalil-dalil lain tidak memastikan; ath-Thaqafī menyebut Ḥaḍār terlihat di Andalusia, sehingga ada kemungkinan keduanya ialah bintang lain (α Eri dan α Phe).'},

ck:{0:'Syarah (cetak 871): setelah Qanthūrus wa-Sab‘ terbit sekumpulan bintang samar; Yunani menamainya al-Mujmirah, yakni wadah tempat kayu gaharu (‘ūd) diletakkan di atas bara untuk dibakar.',1:'Syarah (cetak 871): klaim «tak ada nama dalam kitab Anwā’» dikoreksi — yang benar, bintang-bintang al-Mujmirah termasuk bintang yang oleh Arab disebut al-Khayl dan Aflā’ al-Khayl, hamparan dekat al-‘Aqrab dan asy-Syawlah ke arah kiblat Irak, di depan asy-Syawlah dan di atas al-Majarrah (kutipan al-Marzūqī). Uraian al-Khayl ada pada bagian Syujā‘.'},

{g:'Janūb',id:'r2_ikj',ok:1,ar:'الإكليل الجنوبي',idn:'Iklīl Janūbī (riwayat 2)',
 note:'Rasi Corona Australis (PDF 136, cetak 106; 4 bait). Bintang-bintang kecil berbentuk <b>shanawbarah</b> (kerucut cemara), terletak di bawah <b>wazhīf ar-Rāmī</b> (kaki Sagittarius) dekat bintang-bintang an-Na‘ām. Perawi terpercaya menyebutnya <b>al-Qubbah</b> dan <b>al-Adhāhī</b>; Romawi menamainya <b>Iklīl</b>; tak ada keterangan selain itu. Syarah dibaca (cetak 875–876); bait 3–4 sesuai lafal yang dicetak syarah.',
 tbl:[["القبة / الأدحي","bintang-bintang kecil berbentuk kerucut cemara di bawah kaki Sagittarius, dekat bintang an-Na‘ām (bait 1–3)","Qubbah"],["إكليل","nama Romawi (bait 4)","Iklīl"]],
 tr:[['Menyusulnya bintang-bintang kecil','engkau melihatnya berbentuk buah pinus'],['Letaknya di bawah waẓīf (tulang kaki bawah) si Pemanah','dekat dengan bintang-bintang an-Na‘ām'],['Orang tepercaya yang diridai telah mengabarkan tentangnya','bahwa ia al-Qubbah dan al-Udhiyy'],['Bagi bangsa Romawi mereka adalah «Iklīl» (mahkota), dan tak','sampai kepada kami tentangnya selain kata ini']],
ck:{0:'Syarah (cetak 875): Yunani menamainya al-Iklīl al-Janūbī untuk membedakannya dari al-Iklīl asy-Syamālī (= al-Fakkah); letaknya dekat an-Na‘ām al-Wārid dan aṣ-Ṣādir, di bawah waẓīf ar-Rāmī (Sagittarius). Waẓīf = bagian kaki antara pergelangan dan betis.',2:'Syarah (cetak 875–876): bait ini dicetak syarah dari Ibn Qutaibah — orang tepercaya mengabarkan bahwa Arab menamai bintang-bintang ini al-Qubbah dan al-Udhiyy. Riwayat berbeda (cetak 876): ada yang menamai «al-Qubbah» karena bentuknya melingkar, di bawah asy-Syawlah; sebagian: di belakang al-Qubbah ada aṣ-Ṣardān; sebagian lain: al-Udhiyy an-Na‘ām (tempat bertelur burung unta) karena di selatan an-Na‘āmayn.'},

{g:'Penutup',id:'r2_kht',ok:1,ar:'الخاتمة',idn:'Khātimah (riwayat 2)',
 note:'Penutup (PDF 136–137, cetak 106–107; 7 bait). Rasi-rasi yang disebut berasal dari kitab para perawi: nama-namanya tertulis, dikenal, diambil dari ulama Kufah, sebagian dari ulama Syam dan lainnya. Ada bintang-bintang lain yang gelarnya tidak diriwayatkan; para ulama menamainya <b>al-A‘lāth</b> dan mengabaikannya, sedangkan orang Arab menyebutnya <b>al-Maskhūlah</b> (yang ditinggalkan dan tercela). Bait 7: «<b>syaykhunā</b> menyebutnya dalam kitab-kitabnya» — riwayat 2 membaca <b>شيخنا</b>, sedangkan riwayat 1 (Istanbul) membaca <b>والدنا</b>. Syarah dibaca (cetak 888–892).',
 tbl:[["الأعلاط / المسخولة","bintang-bintang tanpa gelar riwayat: ulama menamainya al-A‘lāth dan mengabaikannya; Arab menyebutnya al-Maskhūlah (bait 4–6)","A‘lāth"]],
 tr:[['Maka bintang-bintang ini, yang','kami temukan dalam kitab-kitab para perawi'],['tertulis nama-namanya, dikenal','diambil dari para ulama Kufah'],['dan sebagiannya dari para ulama Syam','serta dari selain mereka, orang-orang yang berpemahaman'],['Dan di langit ada bintang-bintang lain selain mereka','yang tak kudengar nama-namanya dari mereka'],['Para ulama menamainya al-A‘lāṭ','dan mengabaikannya sama sekali'],['Orang Arab mengenalinya dengan sebutan al-Maskhūlah','maksud mereka: yang ditinggalkan lagi tercela'],['Guru kami menyebutkannya dalam kitab-kitabnya','maka hendaklah mencarinya siapa pun yang berhajat kepadanya']],
ck:{0:'Syarah (cetak 888): bintang-bintang yang disebut dalam arjuzah ini = yang namanya tercatat dalam kitab para perawi (Ibn Kunāsah, Ibn al-A‘rābī, dan yang menukil dari mereka seperti Abū Ḥanīfah ad-Dīnawarī dan Ibn Qutaibah), bersumber dari ulama Kufah, Syam, dan lainnya.',4:'Syarah (cetak 888–889): al-A‘lāṭ = bintang-bintang tanpa nama (seperti unta betina «‘uluṭ» yang tak bertanda dan tak berkekang; az-Zamakhsyarī, az-Zabīdī). Bait ini ada di riwayat 2 dan dicetak syarah, tetapi tidak ada di riwayat 1.',5:'Syarah (cetak 889–890): al-Maskhūlah (juga dibaca «al-Maḥsūlah») = bintang-bintang yang diabaikan/tak diketahui, majhūlah dan mardzūlah (Tāj al-‘Arūs).',6:'Riwayat 2 membaca «شيخنا» (guru kami), sedangkan riwayat 1 «والدنا» (ayah kami) dan syarah (cetak 892) mencetak «والدنا». Syarah menafsirkannya sebagai Abū al-Ḥusayn ‘Abd ar-Raḥmān b. ‘Umar ar-Rāzī aṣ-Ṣūfī, dalam Ṣuwar al-Kawākib ath-Thābitah; siapa menginginkan ilmu lebih silakan merujuk ke sana.'},
