{g:'Burūj',id:'ham',ok:1,ar:'الحمل',idn:'Hamal (Kambing / Aries)',
 note:'Rasi Aries (Hamal), burj pertama (syarah cetak 480–493 = PDF 510–523; 12 bait). Terbit ketika bintang al-Ghafr (manzilah ke-15, milik Sunbulah) terbenam; al-Ghafr adalah raqīb bagi asy-Syarathān, dan terbitnya asy-Syarathān menjadi awal terbitnya al-Hamal. <b>13 bintang</b> («ثلاثة وعشره») membentuk gambar, ditambah 5 di luar gambar; domba digambarkan berlari sambil menoleh ke belakang, seakan penjualnya (<i>al-Bā’i‘</i>) mengejar dari belakang. Bintang terang pertama ditempatkan Barkhus (Hipparkhos, abad ke-2 SM) pada moncong (<i>al-khathm</i>). <b>asy-Syarathān</b> (manzilah ke-1; juga an-Nath‘, an-Nāthih): dua pendapat (cetak 486–488) — (1) an-Nāthih (bintang luar gambar) + bintang ke-2, dan al-Asyrāṭ = ditambah bintang ke-1; (2) bintang ke-2 + ke-1, dan al-Asyrāṭ = ditambah bintang ke-5. Pensyarah menguatkan (1), sejalan dengan Ibn Qutaibah dan al-Marzūqī (jarak keduanya ±sebusur menurut Ibn Qutaibah, ±sehasta menurut al-Marzūqī). Bait 8 «بإنسانين» tertulis begitu di semua naskah, padahal Ṣūfī dan pengarang lain tidak mengenal nama al-Insānān; syarah mengutipnya «بالشرطين». <b>al-Buthain</b> (manzilah ke-2) = tiga bintang samar pada perut Hamal Arab (seperti titik huruf ثاء menurut al-Marzūqī, di antara asy-Syarathān dan ats-Tsurayyā). Ṣūfī memilih tiga bintang di paha dan ekor Hamal Yunani dan menyalahkan penulis Anwā’, tetapi menurut pensyarah tuduhan itu keliru tempat: Hamal Arab membentang dari asy-Syarathān di tanduk hingga ats-Tsurayyā di ekor, sedangkan Yunani menaruh Tsurayyā di punggung Tsaur. Bintang-bintang kecil di atasnya bukan bagian gambar, melainkan empat bintang di belakang an-Nāthih (luar gambar; tiga yang terang = al-Buthain menurut kitab Anwā’); nama «<b>Rijl al-Ghūl</b>» tidak ditemukan dalam riwayat Arab maupun Ṣūfī (al-Ghūl Yunani tidak berkaki; mungkin perajaz keliru, karena bintang-bintang ini dekat bahu Tsurayyā, yaitu kaki Birsyāwisy). Rinci per bait di kotak catatan pensyarah.',
 tbl:[['الشرطان / الناطح','an-Nāthih (α Ari, luar gambar) + bintang ke-2 (β Ari); manzilah ke-1','Syarathān'],['الأشراط','Syarathān + bintang ke-1 (γ Ari)','Asyrāṭ'],['البطين','tiga bintang samar di perut Hamal Arab (≈ ε, δ, ρ Ari); manzilah ke-2','Buthain'],['رجل الغول','empat bintang di luar gambar di belakang an-Nāthih (nama dipertanyakan)','Rijl al-Ghūl']],
 tr:[['Yang pertama darinya adalah al-Kabsy (domba jantan) yang disebut al-Hamal,','tampak dari ufuk apabila al-Ghafr telah terbenam'],['Seakan-akan sang penjual mengikuti jejaknya;','bintang-bintangnya ada tiga belas'],['Yang pertama darinya sebuah bintang berukuran besar','yang oleh Barkhus dijadikan (terletak) pada bentuk moncong'],['Menyusulnya sebuah bintang dari bintang-bintang al-Hamal','cahayanya di bawah cahaya yang pertama'],['Orang Arab menamai keduanya asy-Syarathān,','dan yang paling terang dari keduanya kadang dijuluki'],['an-Nāthih; dan di antara mereka ada yang menyertakan','sebuah bintang pada kedua tanduk yang bersinar dari sisinya'],['pada asy-Syarathān, maka engkau menamai (ketiganya) ketika itu','an-Nath‘ dan al-Asyrāṭ juga — ketahuilah'],['Dan kadang mereka menamai dua yang paling terang darinya','dengan al-Insānain — maka ketahuilah, dan riwayatkanlah dari mereka'],['Mengikuti mereka bintang-bintang al-Buthain,','tiga bintang yang luput dari tangkapan mata'],['Samar mereka, di perut al-Hamal,','seakan bersembunyi karena malu'],['Dan di atas mereka bintang-bintang kecil','yang dikeluarkan dari bintang-bintang rasi ini'],['Disebut Rijl al-Ghūl (Kaki Hantu) oleh orang Arab,','dan mereka dekat dengan Birsyāwisy']],
 ck:{0:'Syarah hal. 480: al-Hamal adalah burj pertama. Ia mulai terbit ketika bintang-bintang al-Ghafr (milik Sunbulah, manzilah ke-15) terbenam; al-Ghafr adalah raqīb (pasangan yang terbenam saat ia terbit) bagi asy-Syarathān, dan terbitnya asy-Syarathān menjadi awal terbitnya al-Hamal.',1:'Syarah hal. 483–484: «ثلاثة وعشره» = 13 bintang yang membentuk gambar al-Hamal; kelompok ini memuat pula 5 bintang di luar gambar. Domba digambarkan berlari sambil menoleh ke belakang, seakan penjualnya mengejar dari belakang.',2:'Syarah hal. 484: Barkhus = Hipparkhos, ahli falak Yunani abad ke-2 SM; al-khathm = bagian depan hidung dan mulut hewan. Ptolemeus meriwayatkan darinya bahwa ia menempatkan bintang terang ini pada moncong.',4:'Syarah hal. 486–488: pendapat tentang asy-Syarathān dan al-Asyrāṭ berbeda. (1) an-Nāthih (bintang luar gambar) dan bintang ke-2 = asy-Syarathān, ditambah bintang ke-1 = al-Asyrāṭ; (2) bintang ke-2 dan ke-1 = asy-Syarathān, ditambah bintang ke-5 = al-Asyrāṭ. Pensyarah menguatkan pendapat pertama: an-Nāthih dan bintang ke-2 itulah asy-Syarathān (sejalan dengan Ibn Qutaibah dan al-Marzūqī), sedangkan al-Asyrāṭ terjadi dengan menambahkan bintang ke-1, karena jelas terlihat di langit dan letaknya hampir di kawasan yang sama dengan pendapat-pendapat lain. Ibn Qutaibah: asy-Syarathān dua bintang yang disebut juga an-Nath‘, an-Nāthih, an-Nathīh, berjarak sekitar sebusur (qāb qaws) menurut pandangan mata; al-Marzūqī: sekitar sehasta, dan ada bintang kecil di sisi utara salah satunya sehingga ia dinamai al-Asyrāṭ; kata al-Marzūqī, dari orang Arab diriwayatkan pula «شَرْط» (sukun).',7:'Syarah hal. 487: bait ini tertulis «بإنسانين» di semua naskah, tetapi Ṣūfī maupun pengarang lain tidak mengetahui bahwa orang Arab menamai bintang-bintang ini al-Insānān. Yang diriwayatkan Ṣūfī: dua bintang terang di tanduk disebut asy-Syarathān (syarah mengutip bait ini dengan «بالشرطين»).',8:'Syarah hal. 489–492: al-Buthain = tiga bintang samar pada perut al-Hamal (manzilah ke-2). Ṣūfī memilih tiga bintang di paha dan ekor (al-alyah) al-Hamal Yunani dan menyalahkan penulis kitab-kitab Anwā’ yang menjadikan al-Buthain tiga bintang terang dari empat bintang di luar gambar di belakang an-Nāthih. Pensyarah: tuduhan itu keliru tempat, sebab al-Hamal Arab berbeda dengan al-Hamal Yunani: Hamal Arab membentang dari asy-Syarathān di tanduk hingga ats-Tsurayyā di ekor, sedangkan orang Yunani menaruh ats-Tsurayyā di punggung Tsaur. Tiga bintang samar yang dilukiskan al-Marzūqī seperti titik-titik huruf ثاء di tengah antara asy-Syarathān dan ats-Tsurayyā lebih mungkin benar, dan bintang-bintang pilihan Ṣūfī saling berjauhan.',10:'Syarah hal. 493: bintang-bintang samar ini bukan bagian gambar al-Hamal, melainkan empat bintang di belakang an-Nāthih (di luar gambar); tiga yang terang dari keempatnya adalah al-Buthain menurut kitab-kitab Anwā’.',11:'Syarah hal. 493: nama «Rijl al-Ghūl» tidak ditemukan dalam riwayat Arab dan tidak disebut Ṣūfī; dalam gambar Yunani al-Ghūl tidak berkaki, yang ada ialah Birsyāwisy pembawa kepala al-Ghūl yang terpenggal. Mungkin perajaz keliru, karena Ṣūfī mengatakan bintang-bintang ini dekat bahu ats-Tsurayyā, yaitu bintang pada kaki pemegang kepala al-Ghūl.'},

{g:'Burūj',id:'tsr',ok:1,ar:'الثور',idn:'Tsaur (Banteng / Taurus)',
 note:'Gugusan di <i>ghārib</i> (bagian depan punuk, <i>sanām</i>) banteng. Bangsa Rum menjadikannya punuk Tsaur; orang Arab menempatkannya di <i>alyah</i> (ekor gemuk) Hamal Arab, berbeda dengan Yunani. <b>ats-Tsurayyā</b> (Pleiades; «an-Najm» tanpa sandaran; tashghīr dari tsarwah, kelimpahan; enam bintang tampak; Ṣūfī: bintang ke-29–32 rasi ini) = manzilah ke-3, awal manāzil karena terbit fajarnya menandai awal musim panas. <b>ad-Dabarān</b> (Aldebaran, α Tau; bintang ke-14 di mata selatan banteng; manzilah ke-4) — dari «dubūr»: membelakangi/mengikuti Tsurayyā; juga <b>al-Fanīq</b> (pejantan unta), <b>al-Mijdah</b> (tongkat bercabang tiga), <b>Tābi‘/Tālī an-Najm</b>, <b>al-Ḥādī</b> (penggiring unta), dan <b>at-Tawbī‘</b> (al-Azharī). <b>al-Qilāsh</b> = bintang-bintang kecil «unta betina muda» di antaranya dan Tsurayyā. <b>ad-Dayqah</b> = dua bintang berdekatan yang mendahului ad-Dabarān (jarak ≈ diameter Bulan); juga nama celah antara Tsurayyā dan Dabarān yang dihindari Bulan; Ṣūfī menyebut dua bintang di telinga utara banteng (ke-21, 22) al-Kalbān. Orang Arab jahiliah menganggap nau’ ad-Dabarān sial (tiga malam); Islam membatalkan khurafat itu. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['الثريا','Pleiades (M45); manzilah ke-3','Tsurayyā'],['الدبران','Aldebaran (α Tau); manzilah ke-4','Dabarān'],['الفنيق / المجدح / الهادي','nama lain ad-Dabarān','Fanīq / Mijdah / Hādī'],['القلاص','bintang kecil «unta betina muda» di antara Tsurayyā dan Dabarān','Qilāsh'],['الدايقة / الكلبان','dua bintang berdempet di telinga utara banteng','Dayqah / Kalbān']],
 tr:[['Mengikutinya al-Tsaur (Banteng), dan di antara bintang-bintangnya','ada bintang-bintang yang terbit di atas gārib-nya'],['Bangsa Rum menjadikannya punuk bagi banteng itu,','sedangkan orang Arab banyak bicara tentangnya'],['Di sisi mereka kelompok itu dinamai ats-Tsurayyā,','dan kadang mereka menamainya seluruhnya «an-Najm» (Bintang)'],['Dan ia juga termasuk manzilah-manzilah Bulan,','dikenal oleh penghuni gurun maupun kota'],['Menyusulnya sebuah bintang besar lagi cemerlang,','dihiasi cahaya dan warna merah'],['Menawan, berpemandangan elok,','dikenal dengan al-Mijdah dan al-Fanīq'],['Dan «Tābi‘ an-Najm» juga menjadi julukan baginya,','dan ad-Dabarān adalah namanya di kalangan Arab'],['Dan kadang engkau menamainya «Tālī an-Najm»,','seperti yang kami dengar; dan kadang mereka menamai'],['bintang ini «al-Mijdah» dan «al-Ḥādī», dan telah','disebutkannya dalam syairnya setiap orang'],['Baginya ia bintang pembawa sial,','dan nau’-nya dibenci lagi tercela'],['Menyusulnya dua bintang cemerlang,','di antara keduanya sejengkal; keduanya dinamai'],['«ad-Dayqah» oleh orang-orang Arab dusun; dan engkau','akan melihat di sekitarnya bintang-bintang yang menyala'],['(bintang-bintang itu) dikenal sebagai al-Qilāsh di kalangan Badui;','aku tidak ragu akan hal ini — ketahuilah'],['Dan orang Arab kadang menamai dua bintang yang saling berdempetan','dengan al-Kalbain']],
 ck:{0:'Syarah hal. 498: al-ghārib = bagian depan punuk (as-sanām). Gugusan itu digambarkan terletak di ghārib banteng; syarah mencetak bait ini dalam versi gabungan dengan baris tambahan yang tidak ada di riwayat 1 (lihat bait 4, 5, 11).',1:'Syarah hal. 498: bangsa Rum menjadikan gugusan ini punuk (sanām) di punggung banteng; orang Arab memberi perhatian besar dan banyak berbicara tentangnya, dan hampir tak ada bintang lain yang sebanyak itu disebut dalam syair dan kitab anwā’ (Ibn Qutaibah).',2:'Syarah hal. 498–503: «an-Najm» tanpa disandarkan kepada apa pun = ats-Tsurayyā (Ibn Qutaibah, al-Marzūqī; juga tafsir surah an-Najm menurut Ibn Katsir). Nama Tsurayyā adalah tashghīr dari tsarwah (kelimpahan) karena bintangnya rapat; enam bintang tampak jelas. Menurut Ṣūfī, bintang ke-29, 30, 31, dan 32 dari rasi ini dinamai Tsurayyā. Semua pengarang Arab menempatkannya di alyah (ekor gemuk) al-Hamal Arab, berbeda dengan Yunani.',3:'Syarah hal. 503: ats-Tsurayyā manzilah ke-3 Bulan; orang Arab menjadikannya awal manazil karena terbitnya di waktu fajar menandai awal musim panas (al-qaiz).',4:'Syarah hal. 511 (mengutip Ṣūfī): bintang ke-14 rasi Tsaur, di mata selatan banteng, merah terang; manzilah ke-4 Bulan. Syarah mencetak di sini baris tambahan sebelum bait ini («وحولهن أنجم كثيرة …» dan «أربعة منهن عند القطع …» — hal. 503–505) yang tidak ada di riwayat 1.',5:'Syarah hal. 504, 507–508: al-Mijdah (dibaca juga al-Mujdah) = tongkat kayu bercabang tiga; jamaknya majādīh dipakai untuk anwā’ (istisqā’ Umar r.a.); dan sebagai tanda cap unta bentuknya seperti angka 8/huruf dāl. Al-Fanīq = pejantan unta yang dimuliakan; mungkin karena bintang di sekitarnya dinamai al-Qilāsh (unta betina muda).',6:'Syarah hal. 508–511: ad-Dabarān dari dubūr — ia «membelakangi»/mengikuti ats-Tsurayyā; karena itu juga Tābi‘ dan Tālī an-Najm, ada pula at-Tawbī‘ (riwayat al-Azharī, hal. 511).',8:'Syarah hal. 509: al-Ḥādī = penggiring unta; dinamai demikian mungkin karena ia di belakang al-Qilāsh (bintang-bintang «unta betina»), yang berada di antaranya dan ats-Tsurayyā; juga «Ḥādī an-Najm».',9:'Syarah hal. 511–512: orang Arab jahiliah menganggap ad-Dabarān pembawa sial dan membenci nau’-nya; nau’-nya tiga malam (ada yang berkata semalam), tidak terpuji. Pensyarah menyebut Islam datang membatalkan khurafat dan ketergantungan pada bintang.',10:'Syarah hal. 512: syarah mencetak «يقدمه نجمان أزهران» (mendahuluinya), sedangkan riwayat 1 «يتبعه»; menurut syarah kedua bintang itu terbit mendahului ad-Dabarān. Keduanya berdekatan (jarak antarkeduanya mendekati diameter Bulan) dan dinamai ad-Dayqah.',11:'Syarah hal. 512–514: «ad-Dayqah» juga nama celah antara ats-Tsurayyā dan ad-Dabarān yang dihindari Bulan (ia lebih suka singgah di celah antarmanzilah selain ini). Menurut Ṣūfī, dua bintang berdekatan di telinga utara banteng (bintang ke-21 dan ke-22) disebut al-Kalbain (anjing-anjing ad-Dabarān) dan banyak orang Arab menamainya ad-Dayqah.',13:'Syarah hal. 498, 513: Abū Ziyād: ad-Dayqah dua bintang berdempet, kecil, di antara an-Najm dan ad-Dabarān, dinamai juga al-Kalbain.'},

{g:'Burūj',id:'tau',ok:1,ar:'التوأمان',idn:'Tau’amān (Gemini)',
 note:'Rasi <b>at-Tau’amān</b> (Si Kembar); pengarang juga menyebutnya <b>al-Jauzā’</b> — nama yang membingungkan karena al-Jabbār (Orion) pun disebut al-Jauzā’ (syarah hal. 525–526). Dua bintang di kepala = <b>adz-Dzirā‘</b>: adz-Dzirā‘ al-mabsūṭah (utara) menurut Ṣūfī dan al-Marzūqī, sebaliknya menurut Ibn Qutaibah; pensyarah menguatkan bahwa manzilah ke-7 ialah adz-Dzirā‘ al-janūbiyyah (al-maqbūḍah) karena tidak terbit mendahului dan selisih terbitnya dengan al-Hanʿah (≈ 6 hari) lebih cocok (hal. 528–535). Bintang yang lebih terang dinamai <b>Muqaddam adz-Dzirā‘ayn</b>, tetapi itu nama astrolab, bukan nama Arab; pensyarah: yang lebih terang sebenarnya bintang satunya (hal. 536). Jaraknya «lima jengkal» ≈ 5°50′ menurut Ṣūfī (modern ≈ 4°40′). Sesudahnya <b>al-Hanʿah</b> (manzilah ke-6; naskah bervariasi «الهقعة»/«الهنعة», yang dimaksud al-Hanʿah), juga disebut az-Zirr dan al-Mīsān tanpa riwayat mana yang mana; menurut Ṣūfī bintang ke-17 dan 18 pada kedua kaki si kembar. Jarak «dua jengkal» versi perajaz kurang tepat (kurang dari 4°40′; modern ≈ 4°) (hal. 536–538). Bintang-bintang kecil di sekitar adz-Dzirā‘ disebut al-Azhfār.',
 tbl:[["الذراع","dua bintang di kepala Si Kembar (Castor & Pollux); manzilah ke-7 = yang selatan menurut pensyarah","Dzirā‘"],["مقدم الذراعين","bintang yang lebih terang; nama astrolab, bukan nama Arab","Muqaddam Dzirā‘ayn"],["الهنعة","dua bintang terang pada kaki Si Kembar (bintang ke-17 & 18 menurut Ṣūfī); manzilah ke-6","Hanʿah"],["الأظفار","bintang-bintang kecil di sekitar adz-Dzirā‘","Azhfār"]],
 tr:[['Mengikutinya bintang-bintang al-Jauzā’,','bintang-bintang yang bersinar dalam kegelapan'],['Bangsa Rum menyerupakannya dengan dua anak kembar,','engkau lihat di kepala keduanya dua bintang'],['Keduanya dikenal sebagai adz-Dzirā‘,','dan yang paling terang lagi cemerlang, berpancar sinar,'],['dijuluki Muqaddam adz-Dzirā‘ayn; jarak antara keduanya','— ketahuilah — menurut penglihatan mata'],['lima jengkal; dan andai kami cari','di hadapannya al-Hanʿah, niscaya kami temukan'],['dua bintang dari bintang-bintang rasi ini,','diikuti bintang-bintang yang bercahaya'],['dua di antaranya dinamai','az-Zirr, al-Hanʿah, dan al-Mīsān'],['keduanya adalah dua kaki bagi salah satu si kembar,','jarak keduanya, bila kauperkirakan, dua jengkal'],['Di sekitar adz-Dzirā‘ bintang-bintang kecil,','yang di kalangan mereka berjulukan al-Aẓfār']],
 ck:{0:'Syarah hal. 525–526: syarah mencetak bait ini dalam versi gabungan («وبعدها كواكب الجوزاء»). Rasi ini bernama at-Tau’amān; pengarang menyebutnya juga al-Jauzā’ (dan «jauzah» di nazham urutan burūj). Nama itu membingungkan, sebab al-Jabbār (Orion) juga disebut al-Jauzā’, dan «gambar al-Jauzā’» menurut orang Arab mencakup bintang al-Jabbār serta al-Hanʿah di at-Tau’amān.',2:'Syarah hal. 528–535: adz-Dzirā‘ = dua lengan al-Asad (Singa) menurut Arab: al-maqbūḍah dan al-mabsūṭah. Dua bintang di kepala at-Tau’amān = adz-Dzirā‘ al-mabsūṭah (utara) menurut Ṣūfī dan al-Marzūqī; Ibn Qutaibah sebaliknya. Penentuan manzilah ke-7 pun diperselisihkan: Ṣūfī dan Ibn Qutaibah: yang utara; al-Marzūqī: yang selatan (asy-Syi‘rā al-Ghumaisā’ dan Marzamnya). Pensyarah menguatkan bahwa manzilah ialah adz-Dzirā‘ al-janūbiyyah (al-maqbūḍah), karena ia tidak mendahului terbit dan tidak sebegitu tinggi seperti yang utara, serta selisih terbitnya dengan al-Hanʿah (≈ 6 hari) lebih cocok dengan jarak antarmanzilah.',3:'Syarah hal. 536: Ṣūfī menyebut bintang yang lebih terang bernama Muqaddam adz-Dzirā‘ayn; pensyarah: yang lebih terang sebenarnya bintang yang satunya, dan andai separuh bait berbunyi «والأول الأزهر ذو الشعاع» maknanya lebih tepat, karena kedua bintang itu terang. «Muqaddam adz-Dzirā‘ayn» adalah nama bintang yang dipakai pada astrolab, bukan nama Arab.',4:'Syarah hal. 536–538: «lima jengkal» menurut Ṣūfī (satu jengkal = setengah dzirā‘; satu dzirā‘ ≈ 2°22′) ≈ 5°50′; ukuran modern antara dua bintang itu ≈ 4°40′ (sekitar dua dzirā‘). Naskah-naskah bervariasi «الهقعة»/«الهنعة»; yang dimaksud al-Hanʿah (manzilah ke-6), bukan al-Haq‘ah. Dua bintang al-Hanʿah mirip bintang adz-Dzirā‘ dalam arah miringnya, tetapi lebih redup.',6:'Syarah hal. 537–538: al-Hanʿah = dua bintang terang yang menyusul adz-Dzirā‘; nama lain az-Zirr dan al-Mīsān, namun tidak diriwayatkan dari Arab mana di antara dua bintang itu yang az-Zirr dan mana al-Mīsān. Menurut Ṣūfī: bintang ke-17 dan ke-18 pada kedua kaki si kembar yang menyusul. Ibn Qutaibah: dua bintang putih yang di belakang al-Haq‘ah di dalam Majarrah; Bulan singgah di at-Tahābī (tiga bintang di depan al-Hanʿah).',7:'Syarah hal. 537: jarak «dua jengkal» menurut perajaz tidak tepat; Ṣūfī menyebutnya kurang dari dua dzirā‘ (kurang dari empat jengkal), yaitu kurang dari 4°40′; menurut ukuran modern sekitar 4°.'},

{g:'Burūj',id:'srt',ok:1,ar:'السرطان',idn:'Saratan (Kepiting / Cancer)',
 note:'Rasi <b>as-Saratān</b> (Kepiting): 9 bintang di dalam gambar + 4 di luar gambar (kutipan Ṣūfī; syarah hal. 554, 562). «al-Jauzā’» di bait 1 = nama lain at-Tau’amān, bukan Orion. <b>as-Saḥābī</b> bukan bintang melainkan sadīm (gugusan seperti awan tipis); dinamai <b>al-Ma‘laf</b> karena dua bintang di sekelilingnya dinamai <b>al-Himārān</b> — keduanya nama Yunani (dari al-Majisṭī, juga Aratus) yang tak ditemukan Ṣūfī dalam kitab Anwā’ Arab (hal. 554–557). Nama Arabnya <b>an-Natsrah</b> (ujung hidung Singa; manzilah ke-8 menurut Ṣūfī) dan <b>al-Lahāh</b> (langit-langit mulut Singa) (hal. 557–561). Dua bintang gelap yang mengikutinya = <b>al-Manākhir</b> (dua lubang hidung Singa; jarak ≈ 3°20′) (hal. 558). <b>ath-Tharf</b> (dua bintang sangat samar, «dua mata Singa»): Ṣūfī memilih dua bintang gelap di antara an-Natsrah dan al-Jabhah, sedangkan pensyarah lebih condong ke dua bintang terang di dekat al-Jabhah (Ibn Qutaibah, al-Marzūqī) (hal. 561–564). <b>al-Asyfār</b> (jamak «syufr», bulu mata) = bintang-bintang kecil di sekitar ath-Tharf (hal. 564–565).',
 tbl:[["المعلف / السحابي","gugus Praesepe (M44), bukan satu bintang; nama Yunani","Ma‘laf"],["الحماران","dua bintang di sekeliling M44 (≈ γ,δ Cnc); nama Yunani, bukan sebutan Arab","Himārān"],["النثرة","ujung hidung Singa = bintik awan M44 (nama Arab); manzilah ke-8","Natsrah"],["المناخر","dua bintang gelap menyusul an-Natsrah; jarak ≈ 3°20′","Manākhir"],["الطرف","dua bintang sangat samar; «dua mata Singa»","Tharf"],["الأشفار","bintang-bintang kecil di sekitar ath-Tharf","Asyfār"]],
 tr:[['As-Saratān mengikuti al-Jauzā’,','ia bintang-bintang yang kehilangan cahaya'],['Jumlahnya, bila engkau hitung, sembilan,','semuanya berkumpul dalam satu petak'],['di sekitar sebuah bintik awan yang dinamai al-Ma‘laf,','dan dengan nama al-Lahāh — ketahuilah — ia pun dikenal'],['Dialah yang dikenal dengan nama an-Natsrah','oleh semua orang Arab dan para ahli'],['Mengikutinya dua bintang gelap,','keduanya dinamai al-Himārān'],['Ath-Tharf adalah dua bintang, bila dihitung,','keduanya bintang yang sangat samar'],['satu bintang di lubang hidung gambar Singa,','dan satu bintang lagi dijadikan oleh para pengamat'],['termasuk bintang-bintang yang tak punya gambar,','namun tercatat dan disebut dalam pengamatan'],['Keduanya bersambung dengan bintang-bintang kecil','yang oleh orang Arab dikenal sebagai al-Asyfār']],
 ck:{0:'Syarah hal. 554: «al-Jauzā’» di sini ialah nama lain kawkabah at-Tau’amān (bukan al-Jabbār/Orion). Rasi as-Saratān sendiri: 9 bintang di dalam gambar dan 4 di luar gambar (kutipan Ṣūfī, hal. 554 dan 562).',2:'Syarah hal. 554–557: «as-saḥābī» bukan bintang, melainkan sadīm (kabut/gugusan) yang tampak seperti awan putih tipis; ia dinamai al-Ma‘laf (tempat pakan ternak) karena dua bintang di sekelilingnya dinamai al-Himārān. Ṣūfī mengaku tak menemukan nama al-Ma‘laf/al-Himārān dalam kitab Anwā’ orang Arab; Ibn aṣ-Ṣalāḥ menjelaskan sebabnya: itu nama-nama Yunani (dari al-Majisṭī; juga ada dalam Ẓāhirāt karya Aratus), bukan sebutan Arab.',3:'Syarah hal. 557–561: an-Natsrah = ujung hidung Singa (nama Arab untuk bintik awan itu, sebab ia seperti pecahan awan yang terburai); al-Lahāh = langit-langit lunak di atap tenggorokan, mulut Singa. Ibn Qutaibah dan al-Marzūqī menyebut an-Natsrah tiga bintang berdekatan, salah satunya seperti bintik; Ṣūfī menyebutnya manzilah ke-8.',4:'Syarah hal. 558: yang oleh Arab dinamai al-Manākhir («dua lubang hidung Singa») ialah dua bintang gelap yang mengikuti an-Natsrah; jaraknya dari satu sama lain sekitar 3°20′ menurut ukuran modern. «al-Himārān» bukan sebutan Arab (nama dari Yunani; lihat catatan bait 3).',5:'Syarah hal. 561–564: dua bintang ath-Tharf sangat samar. Menurut Arab ath-Tharf = «dua mata Singa»; Ṣūfī menunjuk satu di lubang hidung Singa dan satu di luar gambar (dari al-Majisṭī), lalu memilih dua bintang gelap di antara an-Natsrah dan al-Jabhah. Pensyarah menilai pilihan itu kemungkinan kesimpulan Ṣūfī sendiri, dan lebih condong bahwa ath-Tharf = dua bintang terang di dekat al-Jabhah, sesuai uraian Ibn Qutaibah dan al-Marzūqī («dua bintang di depan dahi»).',8:'Syarah hal. 564–565: al-Asyfār (jamak «syufr», bulu mata) = bintang-bintang kecil di sekitar ath-Tharf, bagai bulu mata di tepi kelopak. Ṣūfī: bintang kecil yang bertanda lingkaran; Ibn Qutaibah dan ats-Tsaqafī: bintang-bintang kecil di depan/di atas ath-Tharf yang terbit lebih dulu.'},

{g:'Burūj',id:'asd',ok:1,ar:'الأسد',idn:'Asad (Singa / Leo)',
 note:'Rasi <b>al-Asad</b>. <b>al-Malikī</b> (Regulus) bukan nama Arab: menurut Ibn aṣ-Ṣalāḥ itu nama Yunani, dan di kalangan Arab ia hanya bintang keempat (paling selatan) dari al-Jabhah (syarah hal. 572–575). «Jantung Singa» juga penamaan Yunani; Arab membayangkan Singa lain (keempat bintang ini di dahi/punggung), jadi gambar Singa Arab tak boleh dicampur dengan Singa Yunani (hal. 575–577). <b>al-Jabhah</b> (manzilah ke-10) = al-Malikī + tiga bintang terang yang mengikutinya dalam garis agak melengkung; «sakhāb» = untaian kalung (bukan «saḥāb», awan) (hal. 576–577). <b>az-Zubrah</b> (manzilah ke-11; juga al-Kharatān, «dua lubang») = rambut tengkuk/pundak Singa yang berdiri saat marah; al-Kāhil = bagian depan punggung; pensyarah menolak kaitannya dengan pangkal belakang Singa (hal. 577–579). Bintang samar di sekelilingnya = «rambut yang berdiri» (Ibn Qutaibah, Ṣūfī, al-Qalqasyandī; hal. 579). Ṣūfī menamainya <b>Qanab al-Asad</b>, padahal menurut Ibn Qutaibah dan al-Marzūqī itu nama lain ash-Sharfah (hal. 579–581). <b>ash-Sharfah</b> (manzilah ke-12) = satu bintang terang menyusul az-Zubrah, dinamai karena panas berbalik saat ia terbit fajar dan dingin berbalik saat ia terbenam; «as-Safr» = para musafir (hal. 579–580). <b>al-Hulbah</b> = adh-Dhafīrah (Ptolemeus: Coma Berenices), bintang kecil berkumpul seperti Tsurayyā di ujung ekor Singa; orang awam menyebutnya as-Sunbulah (hal. 581–583).',
 tbl:[["الملكي (قلب الأسد)","Regulus α Leo; nama Yunani — bagi Arab hanya bintang ke-4 al-Jabhah","Malikī"],["الجبهة","al-Malikī + 3 bintang terang yang mengikutinya; manzilah ke-10","Jabhah"],["الزبرة / الخرتان","dua bintang; manzilah ke-11 (≈ δ,θ Leo)","Zubrah"],["الصرفة","satu bintang terang menyusul az-Zubrah; manzilah ke-12 (≈ β Leo)","Sharfah"],["الهلبة / الضفيرة","Coma Berenices; gugus kecil di ujung ekor Singa","Hulbah"]],
 tr:[['Sesudah as-Saratān datanglah rasi al-Asad,','bintang-bintang cemerlang yang jumlahnya banyak'],['Di antaranya ada sebuah bintang yang dinamai al-Malikī,','engkau lihat ia termasuk bintang-bintang falak yang paling terang'],['Bangsa Rum menjadikannya jantung bagi Singa,','ia mengikuti bintang-bintang bagai mutiara yang menyala'],['tersusun beruntun seakan-akan seuntai kalung,','orang Arab menamainya al-Jabhah'],['Mengikutinya az-Zubrah, dua buah bintang,','yang di kalangan mereka dinamai al-Kharatān'],['Keduanya dihitung termasuk manzilah-manzilah,','dan termasuk bintang-bintang Singa di atas pundak'],['Di sekeliling keduanya ada bintang-bintang samar,','tidak berpendar dan tidak jelas'],['yang oleh orang Arab dikenal sebagai Qanab al-Asad;','mengikutinya sebuah bintang terang yang dijadikan petunjuk'],['dengan cahayanya para musafir mendapat petunjuk, dan ia dinamai ash-Sharfah,','di atasnya bintang-bintang yang saling berlilitan'],['gelap, bendanya kecil-kecil,','dikenal dengan nama al-Hulbah dan adh-Dhafīrah']],
 ck:{1:'Syarah hal. 572–575: «al-Malikī» dan «Qalb al-Asad» bukan nama Arab. Ibn aṣ-Ṣalāḥ: bintang ini dinamai al-Malikī dalam bahasa Yunani. Di kalangan Arab ia hanya bintang keempat (paling selatan) dari al-Jabhah.',2:'Syarah hal. 575–577: «jantung bagi Singa» adalah penamaan Yunani, dari letaknya pada gambar Singa Yunani; Arab membayangkan Singa yang lain (empat bintang ini berada di dahi/punggung, bukan di leher dan jantung). Karena itu pensyarah mengingatkan agar tidak mencampur gambar Singa Arab dengan gambar Singa Yunani.',3:'Syarah hal. 576–577: yang dimaksud bait ini empat bintang: al-Malikī + tiga bintang terang yang mengikutinya dalam satu garis agak melengkung; semuanya oleh Arab dinamai al-Jabhah, manzilah ke-10. «Sakhāb» = untaian kalung (bukan «saḥāb», awan).',4:'Syarah hal. 577–579: az-Zubrah = rambut tengkuk/pundak Singa yang berdiri ketika marah, dinamai juga al-Kharatān («dua lubang»); manzilah ke-11. al-Kāhil = bagian depan punggung. Pensyarah menolak pendapat yang mengaitkannya dengan pangkal belakang Singa («‘ajz al-asad»).',6:'Syarah hal. 579: bintang-bintang samar di sekeliling az-Zubrah, menurut Ibn Qutaibah, Ṣūfī dan al-Qalqasyandī, ialah «rambut yang berdiri» di pundak Singa.',7:'Syarah hal. 579–581: di sini Ṣūfī memakai «Qanab al-Asad» untuk bintang-bintang samar di sekitar az-Zubrah; padahal menurut Ibn Qutaibah dan al-Marzūqī «Qanab al-Asad» (juga «wi‘ā’ al-qadhīb») adalah nama lain ash-Sharfah, dan Ṣūfī sendiri di bagian al-Asad menyebutnya begitu.',8:'Syarah hal. 579–580: ash-Sharfah = satu bintang terang yang mengikuti az-Zubrah, manzilah ke-12. Dinamai demikian karena panas berbalik ketika ia terbit fajar dan dingin berbalik ketika ia terbenam. «as-Safr» = para musafir yang berpedoman pada cahayanya.',9:'Syarah hal. 581–583: al-Hulbah = adh-Dhafīrah (Ptolemeus: Coma Berenices), bintang-bintang kecil berkumpul seperti Tsurayyā, dinamai «hulbah» (rambut lebat di ujung ekor) karena letaknya di ujung ekor Singa. Orang awam menyebut gugus ini as-Sunbulah.'},

{g:'Burūj',id:'adz',ok:1,ar:'العذراء (السنبلة)',idn:'‘Adzrā’ / Sunbulah (Perawan / Virgo)',
 note:'Rasi <b>al-‘Adzrā’</b>. <b>as-Sunbulah</b> punya dua arti: bagi ahli hisab/astronom ia nama Simāk al-A‘zal (bulir di tangan sang perawan; istilah Yunani, bukan nama Arab), bagi orang awam ia gugus al-Hulbah di rasi Asad (syarah hal. 592–595, 601–603). <b>al-‘Awwā’</b> di sini = bintang-bintang pada rasi al-‘Adzrā’ (manzilah ke-13; 4–5 bintang), BUKAN rasi al-‘Awwā’ (Boötes) di utara; juga dinamai ‘awwā’ al-bard / ṭāridat al-bard; bentuknya seperti huruf lām (Ṣūfī), kāf tak terbelah (Ibn Qutaibah), atau alif melengkung — satu lengkungan bintang (hal. 595–598). <b>as-Simāk al-A‘zal</b> = Spica, bintang ke-14 pada gambar, kelas pertama, manzilah ke-14, terbit sesudah al-‘Awwā’ (hal. 601–603). «A‘zal» (tak bersenjata) karena tak ada apa-apa di depannya, berbeda dengan <b>as-Simāk ar-Rāmiḥ</b> (Arcturus, di rasi al-‘Awwā’ utara) yang di depannya ada bintang kecil (rāyat as-simāk) (hal. 601–602). Menurut Arab, dua Simāk = dua betis Singa; al-A‘zal betis selatan, ar-Rāmiḥ betis utara (hal. 602). <b>al-Ghafr</b> (manzilah ke-15; 3 bintang samar berbentuk busur): menurut Ṣūfī bintang ke-22, 23, dan 25 gambar al-‘Adzrā’, dinamai dari «ghafrah» (rambut ujung ekor Singa) atau «ghufira» (tertutup); Ibn Qutaibah: di antara Simāk al-A‘zal dan dua az-Zubānā; al-Marzūqī: serupa lengkung al-‘Awwā’ hanya dalam bentuk, tidak dalam ukuran (hal. 599, 606–607).',
 tbl:[["العواء (المنزلة)","4–5 bintang berbentuk lengkung seperti huruf lām (≈ β,η,γ,δ,ε Vir); manzilah ke-13","‘Awwā’"],["السماك الأعزل","Spica α Vir; bintang ke-14 gambar; manzilah ke-14","Simāk A‘zal"],["السماك الرامح","Arcturus — di rasi al-‘Awwā’ utara, bukan di ‘Adzrā’","Simāk Rāmiḥ"],["الغفر","3 bintang samar berbentuk busur (≈ ι,κ,λ Vir); manzilah ke-15","Ghafr"]],
 tr:[['Mengikutinya al-‘Adzrā’, yakni as-Sunbulah,','bintang-bintangnya bertaut dengan rupa (Singa) itu'],['Di antaranya bintang-bintang yang penuh cahaya,','yang oleh orang-orang dahulu dijuluki al-‘Awwā’'],['Bentuknya seperti huruf lām,','bersinar bagi penglihatan dalam kegelapan'],['Mengikutinya sebuah bintang besar yang terang benderang,','yang mereka juluki as-Simāk al-A‘zal'],['ia berada di telapak tangan al-‘Adzrā’,','terbit setelah terbitnya al-‘Awwā’'],['Orang-orang dahulu menjadikannya manzilah,','dan ia dinamai al-A‘zal hanyalah karena'],['ia tanpa senjata, berbeda dengan bintang yang','dijadikan bertombak sebagai penandanya (ar-Rāmiḥ)'],['Orang Arab telah menjadikan kedua Simāk','sebagai dua betis bagi gambar Singa yang perkasa'],['Mengikutinya bintang-bintang yang tampak kecil,','di ujung-ujung pakaian perempuan ini'],['tiga jumlahnya, berbentuk busur,','bagaikan titik-titik hias pengantin'],['Semuanya mereka juluki al-Ghafr,','dan mereka jadikan manzilah bagi penaburan benih']],
 ck:{0:'Syarah hal. 592–595: as-Sunbulah punya dua arti. Bagi ahli hisab/astronom, as-Sunbulah adalah nama bintang Simāk al-A‘zal (bulir di tangan perempuan itu); bagi orang awam, as-Sunbulah adalah gugus kecil al-Hulbah di rasi Asad.',1:'Syarah hal. 595–598: «al-‘Awwā’» di sini = bintang-bintang di rasi al-‘Adzrā’ (manzilah ke-13), BUKAN rasi al-‘Awwā’ (Boötes) di bagian utara. Ibn Qutaibah menyebut empat bintang, al-Marzūqī: empat atau lima. Nama «‘awwā’» dari makna melengkung/melingkar; juga dinamai ‘awwā’ al-bard / ṭāridat al-bard («pengusir dingin»), dan sebagian menyebutnya anjing-anjing yang melolong di belakang Singa.',2:'Syarah hal. 595–598: bentuknya menurut Ṣūfī seperti huruf lām, menurut Ibn Qutaibah seperti kāf yang tak terbelah, sebagian lain seperti alif melengkung ke bawah; semua menunjuk satu lengkungan bintang-bintang.',3:'Syarah hal. 601–603: as-Simāk al-A‘zal = Spica, bintang ke-14 pada gambar al-‘Adzrā’, bintang bercahaya (kelas pertama), manzilah ke-14, dan «as-Sunbulah» juga nama untuknya di kalangan ahli hisab; ia terbit setelah al-‘Awwā’. Pensyarah: penamaan bintang ini «as-Sunbulah» ialah istilah ahli hisab dan astronom pengikut jalan Yunani, bukan nama Arab.',6:'Syarah hal. 601–602: «ar-Rāmiḥ» = as-Simāk ar-Rāmiḥ (Arcturus), bintang di rasi al-‘Awwā’ utara, bukan di rasi al-‘Adzrā’. Dinamai «bertombak» karena ada bintang kecil di depannya (rāyat as-simāk), sedangkan al-A‘zal tak punya apa-apa di depannya (Ibn Qutaibah, al-Marzūqī). Pensyarah menekankan agar rasi Yunani tidak dicampur dengan manzilah/bintang Arab.',7:'Syarah hal. 602: al-Marzūqī dan Ibn Qutaibah: dua Simāk adalah dua betis Singa menurut Arab; al-A‘zal betis selatan, ar-Rāmiḥ betis utara. Sebagian ahli hisab menyebut al-A‘zal «sāq al-asad».',9:'Syarah hal. 599 (keterangan gambar): al-Ghafr = tiga bintang samar yang berbentuk busur seperti bintang-bintang al-‘Awwā’ (Ibn Qutaibah, al-Marzūqī), manzilah ke-15.',10:'Syarah hal. 606–607: Ṣūfī: al-Ghafr (manzilah ke-15; menurut Arab konon yang terbaik di antara manzilah) = bintang ke-22, 23, dan 25 pada gambar al-‘Adzrā’ (dua di ujung ekor/kaki, satu di kaki kiri), dinamai dari «ghafrah» (rambut di ujung ekor Singa) atau dari «ghufira» (tertutup, karena cahayanya redup). Ibn Qutaibah: tiga bintang samar di antara as-Simāk al-A‘zal dan dua az-Zubānā, kira-kira berbentuk seperti lengkungan al-‘Awwā’; al-Marzūqī menambahkan bahwa keserupaan itu hanya dalam bentuk lengkung, tidak dalam ukuran.'},

{g:'Burūj',id:'miz',ok:1,ar:'الميزان',idn:'Mīzān (Timbangan / Libra)',
 note:'Rasi <b>al-Mīzān</b>. <b>az-Zubānā</b> (az-Zubāniyān) = dua bintang berkilau; menurut Arab dua «tanduk/capit» kalajengking (dari «az-zabn», menolak, sebab saling menjauh); pada gambar Yunani keduanya dua daun timbangan, pada gambar Arab dua capit (yadā al-‘aqrab); manzilah ke-16, juga disebut Zubānā aṣ-Ṣayf karena terbenam di musim panas (syarah hal. 611–615). Jarak «qaid rumḥ» ≈ 14° menurut perajaz, sebenarnya ≈ 10° (hal. 612). <b>al-Iklīl</b> (manzilah ke-17) = tiga bintang samar yang menyusul keduanya: yang pertama bintang ke-8 gambar al-Mīzān (al-Majisṭī), yang kedua di luar gambar, yang ketiga belum diamati Ptolemeus (≈ HR 5824) (hal. 616). Perawi berselisih: banyak yang mengira al-Iklīl = tiga bintang di <b>al-Jabhah</b> al-‘Aqrab. Ṣūfī (mengikuti ayahnya) menolak: al-Iklīl bukan di dahi melainkan di atas kepala kalajengking, dan bulan berjalan az-Zubānā → al-Iklīl → al-Qalb, sehingga al-Iklīl harus di tengah, yakni tiga bintang samar dekat al-Qalb (hal. 619–620). Pensyarah menilai tuduhan «menyesatkan» itu tidak pada tempatnya: Ṣūfī ahli hisab yang menuntut ketepatan, sedangkan Arab badui memakai tanda yang jelas (hal. 621, 638). Syarah mencetak lafal «az-Zubānī» dan satu baris tambahan setelah bait 3 (lihat berkas status).',
 tbl:[["الزبانان","α,β Lib; dua capit kalajengking (Arab) / dua daun timbangan (Yunani); manzilah ke-16","Zubānā"],["الإكليل","3 bintang samar menyusul Zubānā, dekat al-Qalb; manzilah ke-17 — BUKAN tiga bintang al-Jabhah","Iklīl"],["جبهة العقرب","tiga bintang terang (β,δ,π Sco) yang oleh sebagian perawi keliru dikira al-Iklīl","Jabhah ‘Aqrab"]],
 tr:[['Mengikutinya bintang-bintang al-Mīzān,','di antaranya az-Zubānā, keduanya dua bintang,'],['keduanya berkilau dan berpendar,','jarak antara keduanya sepanjang jarak sebatang tombak'],['Keduanya sekaligus dua daun timbangan al-Mīzān,','dan keduanya dikenal sebagai dua capit kalajengking'],['Mengikuti keduanya al-Iklīl, yaitu beberapa bintang,','tiga jumlahnya, semuanya gelap'],['Salah satunya termasuk bintang-bintang al-Mīzān,','jauh dari tempat tertanamnya lidah (timbangan)'],['Sebuah bintang lagi termasuk yang dikeluarkan','dari gambar al-Mīzān ketika diamati'],['dan sebuah bintang di atas keduanya yang belum diamati,','tidak jauh dari dua bintang yang telah diamati itu'],['Para perawi berselisih tentang al-Iklīl,','dan kebanyakan mereka keliru dalam kesesatan,'],['karena mengira ia bintang-bintang yang','dikenal oleh kebanyakan perawi'],['sebagai al-Jabhah al-‘Aqrab, tiga bintang','bagai bunga api yang menyala.'],['Bodohlah orang yang mengira hal itu jelas,','sebab az-Zubānā jauh dari bintang-bintang itu,'],['sedangkan al-Qalb dekat dengannya; maka bulan,','bila meninggalkan daun timbangan dalam perjalanannya, kurang'],['jalannya sehingga tak sampai singgah di al-Jabhah;','begitu pula bila ia berjalan dan memalingkan wajahnya'],['dari al-Jabhah al-‘Aqrab menuju jantungnya,','ia melewatinya, sebab engkau lihat dekatnya'],['dari bintang al-Qalb yang telah kami sebut;','maka al-Iklīl bukanlah selain yang kami katakan']],
 ck:{0:'Syarah hal. 611–615: «az-Zubānā» (az-Zubāniyān) = dua «tanduk/capit» kalajengking menurut Arab; nama dari «az-zabn» (menolak), sebab keduanya saling menjauh. Rasi kalajengking Arab lebih luas dari Yunani: mencakup az-Zubānā, bintang-bintang al-Mīzān, dan al-‘Aqrab. Syarah mencetak lafal «az-Zubānī» dan satu baris tambahan setelah bait 3 («وزباني الصيف…»), lihat catatan di berkas status.',1:'Syarah hal. 612: «qaid rumḥ» sekitar 14° pada ukuran langit, sedangkan jarak sebenarnya kedua bintang itu ≈ 10° (kurang dari qaid rumḥ).',2:'Syarah hal. 612–615: pada gambar Yunani keduanya dua daun timbangan al-Mīzān; pada gambar Arab keduanya dua capit kalajengking (yadā al-‘aqrab), manzilah ke-16, dan dinamai pula Zubānā aṣ-Ṣayf karena terbenamnya di musim panas.',3:'Syarah hal. 616: al-Iklīl (manzilah ke-17) = tiga bintang samar yang mengikuti kedua Zubānā.',4:'Syarah hal. 616: bintang pertama = bintang ke-8 dalam gambar al-Mīzān (al-Majisṭī), di ujung penopang daun timbangan utara, jauh dari lidah timbangan.',5:'Syarah hal. 616: bintang kedua termasuk kawkabah al-Mīzān tetapi di luar gambar (bintang ke-6 di luar gambar menurut al-Majisṭī).',6:'Syarah hal. 616: bintang ketiga tidak disebut Ptolemeus («belum diamati»); ia setara HR 5824. Syarah mencetak baris ini dengan «من تحتها» (bukan «فوقهما» seperti riwayat 1).',7:'Syarah hal. 619–620: perawi berselisih tentang al-Iklīl. Ṣūfī: yang menyebutnya tiga bintang di al-Jabhah al-‘Aqrab keliru dalam dua hal — al-Iklīl bukan di dahi tetapi di atas kepala (kalajengking), dan jarak/lintang bintang-bintangnya tidak cocok dengan perjalanan bulan. Pensyarah (hal. 621, juga hal. 638 di bagian Aqrab) menilai tuduhan Ṣūfī dan ayahnya itu tidak pada tempatnya: Ṣūfī ahli hisab yang menuntut ketepatan, sedangkan Arab badui memakai tanda-tanda yang jelas.',10:'Syarah hal. 619: alasan pensyarah/Ṣūfī: bulan melintasi az-Zubānā, lalu al-Iklīl, lalu al-Qalb. Az-Zubānā jauh dari al-Jabhah, sedangkan al-Qalb dekat dengannya; bila bulan meninggalkan dua daun timbangan, ia tak sampai ke al-Jabhah dalam sehari semalam, dan bila meninggalkan al-Jabhah menuju al-Qalb ia melewatinya. Karena itu al-Iklīl harus berada di tengah antara az-Zubānā dan al-Qalb, yakni tiga bintang samar yang dekat al-Qalb (bukan al-Jabhah). Ṣūfī mengikuti pendapat ayahnya.'},

{g:'Burūj',id:'aqr',ok:1,ar:'العقرب',idn:'‘Aqrab (Kalajengking / Scorpius)',
 note:'Rasi Scorpius (syarah cetak 625–646 = PDF 655–675; 12 bait). Bintang-bintangnya terang di kegelapan. <b>Qalb al-‘Aqrab</b> (Antares; merah, manzilah ke-18) disebut Ibn Qutaibah, al-Marzūqī, dan Ṣūfī; syahidnya bait Aswad bin Ya‘fur. Ia diapit dua bintang jelas <b>an-Niyāṭ</b> («urat penggantung jantung»; yang ke-7 di depan, ke-9 di belakang menurut Ṣūfī). Pengarang keliru bahwa bintang di depan asy-Syawlah «kecil dan gelap»: <b>asy-Syawlah</b> (manzilah ke-19; dari «syāla», mengangkat ekor; disebut pula Ibrat al-‘Aqrab) = dua bintang berdekatan yang keduanya terang; bintang samar yang dimaksud ialah <b>at-Tābi‘</b> (di luar gambar). Ibn Qutaibah memisahkan asy-Syawlah dari <b>al-Ibrah</b> (≈ M7 dekat M6); al-Marzūqī menukil bahwa orang Syam dan Hijaz saling berlawanan dalam menamai keduanya. Bulan tidak melintasi asy-Syawlah, hanya lewat di sisinya. Kepercayaan «manhūs» (sial) terhadap Qalb/Syawlah ialah keyakinan jahiliah yang dibatalkan Islam. <b>al-Harrārān</b> = al-Qalb dan an-Nasr al-Wāqi‘ (dari «harīr», lolongan dingin; terbit bersama hanya di lintang tengah Jazirah Arab). Pensyarah menolak koreksi Ṣūfī atas «al-Iklīl» (hal. 638). Rinci per bait di kotak catatan pensyarah.',
 tbl:[['قلب العقرب','Antares (α Sco); manzilah ke-18','Qalb'],['النياط','dua bintang yang mengapit al-Qalb (σ, τ Sco)','Niyāṭ'],['الشولة','dua bintang berdekatan di ekor (λ, υ Sco); manzilah ke-19','Syawlah'],['الإبرة / الهمة','dua bintang kecil di ekor (≈ M7, M6)','Ibrah / Hamah'],['التابع','bintang samar di luar gambar','Tābi‘'],['الحرّاران','al-Qalb dan an-Nasr al-Wāqi‘','Harrārān']],
 tr:[["Sesudahnya datanglah bintang-bintang al-‘Aqrab,", "bintang-bintang bercahaya di kegelapan malam,"], ["dikenal oleh orang Arab seluruhnya dan orang non-Arab,", "di antaranya sebuah bintang bagai obor yang menyala-nyala,"], ["di atasnya cahaya yang gemilang dan warna kemerahan,", "seakan-akan ia, bila bersinar, bara api."], ["Orang Arab menamainya Qalb al-‘Aqrab (Jantung Kalajengking),", "ia hadir dalam syair dan khutbah mereka."], ["Ia diikuti sebuah bintang dan sendiri mengikuti bintang lain,", "keduanya berkilau indah, disebut"], ["oleh orang Arab badui an-Niyāṭ, ketahuilah,", "dan diikuti sebuah bintang kecil yang gelap,"], ["yang mendahului sebuah bintang cemerlang yang bernasib sial,", "jarak antara keduanya sejengkal bila diukur."], ["Telah mengabarkan kepadaku orang yang ucapannya tak kutolak", "bahwa keduanya disebut asy-Syawlah,"], ["yang dijadikan oleh bangsa Yunani dan para ahli", "dari gambar kalajengking sebagai bentuk jarum (ibrah)."], ["Dan al-Qalb bersama sebuah bintang terang berkilau,", "yang dikenal orang Arab sebagai an-Nasr al-Wāqi‘,"], ["keduanya bersama-sama disebut al-Harrārān", "dalam kebanyakan kabar dan negeri."], ["Telah kami sebut sebelumnya keadaan al-Jabhah", "secara ringkas, sehingga tak kami tinggalkan keraguan."]],
 ck:{3:"Syarah hal. 631: Qalb al-‘Aqrab = bintang merah yang sangat terang (Antares), manzilah ke-18; disebut Ibn Qutaibah, al-Marzūqī, dan Ṣūfī; bait Aswad bin Ya‘fur dikutip sebagai syahidnya.",4:"Syarah hal. 631: an-Niyāṭ = dua bintang jelas yang mengapit al-Qalb (satu mendahului, satu menyusul); «niyāṭ» = urat tebal tempat jantung digantungkan, dinamai demikian karena letaknya terhadap al-Qalb. Ṣūfī: yang ke-7 (di depan al-Qalb) dan ke-9 (di belakangnya).",5:"Syarah hal. 632: ucapan pengarang bahwa bintang yang mendahului asy-Syawlah «kecil dan gelap» TIDAK benar — asy-Syawlah dua bintang berdekatan yang keduanya terang (yang kedua lebih terang). Bintang kecil samar yang dimaksud bait ini adalah at-Tābi‘ (di luar gambar kalajengking).",6:"Syarah hal. 632: kepercayaan «manhūs» (bernasib sial) terhadap asy-Syawlah, seperti al-Qalb, termasuk keyakinan jahiliah yang dibatalkan Islam, yang mengembalikan baik-buruk kepada sebab-sebabnya.",7:"Syarah hal. 632–634: asy-Syawlah = dua bintang berdekatan di ekor kalajengking, dinamai dari «syāla» (mengangkat ekor); disebut pula Ibrat al-‘Aqrab. Ibn Qutaibah memisahkan asy-Syawlah dan al-Ibrah («seperti noda mendung»); al-Marzūqī menukil bahwa orang Syam menyebut asy-Syawlah = Ibrah, orang Hijaz sebaliknya. Al-Qalqasyandī: asy-Syawlah = seluruh gugus melengkung (manzilah ke-19). Bulan tidak pernah melintasinya, hanya lewat di sisinya (hal. 634–637).",8:"Syarah hal. 632–633: menurut Ibn Qutaibah al-Ibrah berbeda dari asy-Syawlah (di belakangnya; ≈ M7, dekat M6); al-Marzūqī dan al-Qalqasyandī menyebut dua bintang kecil «al-Ibrah dan al-Hamah» di ekor, di belakangnya at-Tābi‘ (menurut Ṣūfī bintang pertama di luar gambar).",10:"Syarah hal. 637–639: al-Harrārān = al-Qalb dan an-Nasr al-Wāqi‘ (dua bintang terang, selatan dan utara), dinamai dari «harīr» (lolongan dingin) karena terbitnya bertepatan datangnya dingin. Bait ini sama dengan syarah: «بهرّارين» (ر bersyaddah). Terbit bersama hanya di lintang tengah Jazirah Arab (kotak hal. 639).",11:"Syarah hal. 638 (juga hal. 621): pensyarah menolak koreksi Ṣūfī atas «al-Iklīl»; riwayat dari orang Arab tidak patut ditolak hanya karena letak bintangnya tak tepat di tengah antara az-Zubānā dan al-Qalb (Arab mengandalkan tanda-tanda jelas)."},

{g:'Burūj',id:'rmy',ok:1,ar:'الرامي (القوس)',idn:'Rāmī / Qaus (Pemanah / Sagittarius)',
 note:'Rasi Sagittarius (syarah cetak 647–676 = PDF 677–706; 13 bait). Ar-Rāmī = al-Qaus, salah satu dari 12 burūj, gambar makhluk khayali separuh manusia pemanah separuh kuda; menurut Ṣūfī 31 bintang, terletak di belakang rasi Aqrab. <b>as-Sakhāb</b> (bukan «saḥāb», awan) = untaian kalung tanpa permata; dalam gambar Yunani menjadi ikat kepala (‘iṣābah) Sang Pemanah dengan dua jumbai. <b>al-Adzhī</b> (tempat telur burung unta) = <b>al-Qilādah</b> = <b>al-Qalā’iṣ</b>, enam bintang kecil melengkung di atas mata Sang Pemanah (Ṣūfī: nomor 9–14). <b>an-Na‘ām aṣ-Ṣādir</b> (empat bintang jajaran genjang miring di luar Bima Sakti; burung unta yang telah minum dan menjauh) dan <b>an-Na‘ām al-Wārid</b> (empat bintang di dalam Bima Sakti; yang mulai masuk sungai) bersama = <b>an-Na‘ā’im</b>; ruang di antaranya = <b>al-Waṣl</b> (manzilah ke-20; sebagian naskah «ar-Raml», tashhif). <b>aṣ-Ṣardān</b> = dua bintang di belakang al-Qubbah (Ibn Qutaibah; satu dekat ufuk, satu di atasnya) — penentuan Ṣūfī tidak cocok dengan deskripsi Arab; di atasnya <b>al-Yamāmatān</b>, al-Maksī, dan al-Qaṭā, wilayah yang oleh Arab dianggap kumpulan burung. <b>al-Bayḍ</b> (telur) dan <b>al-Qayḍ</b> (kulitnya). <b>al-Baldah</b> (manzilah ke-21) = bidang tanpa bintang di bawah al-Qilādah (bukan bintang; koreksi Ṣūfī atas al-Battānī). Arti «al-Farnī» (bait 11) belum ditemukan. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['النعائم','delapan bintang (≈ γ, δ, ε, η, σ, φ, λ, μ Sgr); manzilah ke-20','Na‘ā’im'],['النعائم الصادرة','empat bintang jajaran genjang miring di luar Bima Sakti','Na‘ām Shādir'],['النعائم الواردة','empat bintang di dalam Bima Sakti','Na‘ām Wārid'],['الوصل','ruang antara dua na‘ām','Waṣl'],['القلادة / الأذحي / القلائص','enam bintang kecil melengkung','Qilādah'],['الصردان','dua bintang di belakang al-Qubbah (menurut Ibn Qutaibah)','Ṣardān'],['البلدة','bidang langit tanpa bintang; manzilah ke-21','Baldah']],
 tr:[["Sesudahnya al-Qaus, yang disebut pula ar-Rāmī (Pemanah),", "bintang-bintang yang terbit di kegelapan,"], ["di antaranya bintang-bintang bagai untaian kalung yang tersusun,", "yang dijadikan bangsa Yunani sebagai jumbai ikat kepala Sang Pemanah,"], ["dikenal dengan al-Adzhī dan al-Qilādah (kalung),", "dan di bawahnya bintang-bintang yang berkilau,"], ["empat bintang yang menyambar pandangan,", "mereka menamainya an-Na‘ām aṣ-Ṣādir,"], ["Mendahului keempatnya bintang-bintang terang", "yang menyerupai mereka dalam gambar,"], ["paling mirip dengan burung unta yang lari,", "mereka menamainya an-Na‘ām al-Wārid,"], ["Engkau lihat di antara kedua na‘ām itu sebuah ruang lapang,", "dikenal dengan nama al-Waṣl oleh orang Arab padang pasir."], ["Dan di antara bintang-bintang al-Qaus ada dua bintang,", "keduanya di paha si kuda,"], ["orang Arab menyebut keduanya aṣ-Ṣardān,", "di sekitar keduanya bintang-bintang yang menyala,"], ["yang dinamai para ulama al-Bayḍ,", "dan kami pernah mendengar pula al-Qayḍ untuknya,"], ["di sisi bintang-bintang al-Bayḍ dan al-Adzhī,", "dan lingkaran (falak) yang menyerupai al-Farnī,"], ["di sebuah lapangan bagai padang tandus yang gundul,", "yang dinamai para ulama al-Baldah."], ["Dan bintang-bintang yang tersusun menjulang,", "dinamai oleh mereka al-Qalā’iṣ."]],
 ck:{0:"Syarah hal. 647–648: ar-Rāmī = al-Qaus, salah satu dari 12 burūj, digambar makhluk khayali separuh manusia pemanah separuh kuda. Menurut Ṣūfī (hal. 649) rasi ini 31 bintang, terletak di belakang rasi Aqrab, dan tak ada bintang teramati lain di sekitarnya.",1:"Syarah hal. 648, 651: «as-sakhāb» (bukan «as-sahāb») = kalung dari untaian tanpa permata; menurut Yunani gugus ini ‘iṣābah (ikat kepala) di kepala Sang Pemanah dengan dua jumbai.",2:"Syarah hal. 651–652: al-Adzhī = tempat telur burung unta di pasir; al-Qilādah = enam bintang kecil samar melengkung di belakang as-Sahābī, di atas mata Sang Pemanah (Ṣūfī: bintang ke-9–14), disebut pula al-Qalā’iṣ dan al-Qaus. Abū Ḥanīfah ad-Dīnawarī menyatakan nama al-Qaus berasal dari bentuk busur ini.",3:"Syarah hal. 652–653: an-Na‘ām aṣ-Ṣādir = empat bintang pada jajaran genjang miring (di luar Bima Sakti), dinamai demikian karena Arab menyerupakan Bima Sakti dengan sungai; burung unta yang telah minum lalu menjauh (Ṣādir).",5:"Syarah hal. 653–654: an-Na‘ām al-Wārid = empat bintang di dalam Bima Sakti, seakan burung unta yang mulai masuk ke sungai (Wārid). Gabungan keduanya (8 bintang) disebut an-Na‘ā’im (juga an-Na‘āmatān = kayu penopang katrol timba); nama itu tidak disebut Ṣūfī dalam arjuzah ini.",6:"Syarah hal. 655–656: al-Waṣl = ruang antara an-Na‘ām al-Wārid dan aṣ-Ṣādir; Ṣūfī menyebutnya manzilah ke-20, al-Marzūqī: tempat an-Na‘ā’im disebut al-Waṣl. Di naskah tertentu tertulis «الرمل» (tashhif; lihat gl).",7:"Syarah hal. 658–659: pada Ibn Qutaibah, di belakang al-Qubbah ada dua bintang aṣ-Ṣardān — satu mendekati ufuk, satu di atasnya. Penentuan Ṣūfī (dua bintang di belakang al-Qubbah, yang bawah tinggi >8° di atas ufuk) tidak cocok dengan deskripsi Arab bahwa ia dekat ufuk.",8:"Syarah hal. 659–660: di atas aṣ-Ṣarad al-a‘lā ada al-Yamāmatān (dua bintang), lalu al-Maksī dan al-Qaṭā; wilayah ini dianggap Arab sebagai kumpulan burung (na‘ām, yamām, ṣarad, qaṭā, makkā’ī).",9:"Syarah hal. 661–662: al-Bayḍ = telur burung unta, al-Qayḍ = kulitnya (hubungannya dengan al-Adzhī).",11:"Syarah hal. 651, 654: al-Baldah = bidang langit tanpa bintang di antara an-Na‘ā’im dan Sa‘d adz-Dzābih (Ibn Qutaibah); Ṣūfī mengoreksi al-Battānī yang menyebutnya bintang: ia hanya ruang kosong, dan Arab menjadikan ruang antara dua na‘ām sebagai manzilah. Hal. 670: «baldah» dari «bald» = jarak di antara dua alis yang tak bertaut; manzilah ke-21, bidang di bawah al-Qilādah tanpa bintang.",12:"Syarah hal. 650–651: al-Qalā’iṣ = nama lain al-Qilādah/al-Adzhī (enam bintang melengkung). Keterangan gambar (hal. 650): penentuan bintang menurut Ṣūfī tak sepenuhnya cocok dengan deskripsi Arab."},

{g:'Burūj',id:'jdy',ok:1,ar:'الجدي',idn:'Jady (Kambing / Capricornus)',
 note:'Rasi Capricornus (syarah cetak 677–688 = PDF 707–718; 9 bait). «Al-Jady» adalah nama Yunani untuk rasi ini; orang Arab tidak mengenal burūj dan punya nama sendiri, jadi klaim bahwa «semua bangsa» menamainya begitu tidak tepat. Hanya 4 dari 28 bintangnya terang (magnitudo 3). Bukan al-Jady = Polaris (Dubb Ashghar). <b>Sa‘d adz-Dzābiḥ</b> (manzilah ke-22; pertama dari empat as-Su‘ūd) = dua bintang tidak terlalu terang di tanduk Jady (±sehasta; satu ke utara, satu ke selatan); bintang kecil berselaput cahaya yang hampir menyatu dengan yang atas dianggap «syāh» (kambing) yang disembelih, dan ketiganya diserupakan mulut bergigi («syanab»). <b>Sa‘d Nāsyirah</b> hanya DUA bintang di ekor — bukan bintang-bintang di sekitarnya. Pensyarah menduga «asy-Syarathān» pada Ibn Qutaibah/al-Marzūqī tashhif dari «aṣ-Ṣardān», dan membela riwayat Arab bahwa bulan kadang singgah di Nāsyirah (jalur bulan), sedangkan as-Su‘ūd di luarnya. <b>al-Muḥibbān</b> = nama lain kedua bintang Nāsyirah (γ, δ Cap; yang terdepan ±2°10′ di selatan jalur matahari menurut Ṣūfī). Rinci per bait di kotak catatan pensyarah.',
 tbl:[['سعد الذابح','dua bintang di tanduk Jady (α, β Cap); manzilah ke-22','Sa‘d adz-Dzābiḥ'],['سعد ناشرة','dua bintang di ekor (γ, δ Cap)','Sa‘d Nāsyirah'],['المحبّان','nama lain kedua bintang Nāsyirah','Muḥibbān']],
 tr:[["Sesudah penyebutanku bintang-bintang ar-Rāmī,", "kugambarkan bentuk al-Jady dalam tuturku,"], ["bintang-bintang gemerlap di kegelapan,", "yang dikenal semua bangsa dengan nama al-Jady,"], ["engkau lihat pada kedua tanduknya dua bintang,", "tampak tepat di bawah yang lebih terang dari keduanya"], ["sebuah bintang kecil yang cahayanya berselaput kabur,", "nyaris menempel pada yang lebih besar,"], ["seakan-akan ketiganya mulut bergigi yang berkilau,", "dinamai orang Arab Sa‘d adz-Dzābiḥ."], ["Dalam keseluruhan gambar ada dua bintang,", "yang tampak bila adz-Dzābiḥ telah terbit,"], ["keduanya sangat cemerlang, berkilat berpendar,", "dihiasi tubuh (bintang) yang bercahaya putih bersih,"], ["di sekitar keduanya tampak bintang-bintang gemerlap,", "keduanya dinamai orang Arab Sa‘d Nāsyirah,"], ["Kabar dari sebagian perawi dari orang Arab", "bahwa al-Muḥibbān adalah sebutan bagi keduanya."]],
 ck:{1:"Syarah hal. 678: «al-Jady» (Capricornus) adalah nama Yunani untuk rasi ini; klaim bahwa «semua bangsa» menamainya begitu tidak tepat — orang Arab tidak mengenal burūj dan punya nama sendiri. Juga hanya 4 dari 28 bintangnya yang terang (magnitudo 3); sisanya samar. Bukan al-Jady = Polaris (Dubb Ashghar).",2:"Syarah hal. 678–681: Sa‘d adz-Dzābiḥ = dua bintang tidak terlalu terang di tanduk al-Jady, berjarak ±sehasta (menurut Ibn Qutaibah dan al-Marzūqī: satu naik ke utara, satu turun ke selatan); Ṣūfī menyebutnya bintang pertama dan ketiga pada tanduk berikutnya.",3:"Syarah hal. 678: pensyarah memahami bait ini sebagai bintang kecil samar yang cahayanya berselaput (ghasyāwah), hampir menyatu dengan bintang atas; bintang kecil inilah «syāh» (kambing) yang disembelih.",4:"Syarah hal. 678–681: «syanab» = kilau/kesejukan gigi; ketiga bintang diserupakan dengan mulut bergigi demikian. Dinamai adz-Dzābiḥ karena bintang kecil di dekatnya dianggap kambing yang disembelih (atau karena bintang kecil itu terletak di tempat sembelihan); manzilah ke-22, pertama dari empat as-Su‘ūd.",7:"Syarah hal. 682–687: yang dinamai Sa‘d Nāsyirah hanya DUA bintang di ekor, bukan bintang-bintang di sekitarnya. Pensyarah menilai kata «asy-Syarathān» dalam riwayat Ibn Qutaibah/al-Marzūqī («terbit bersama asy-Syarathān») kemungkinan tashhif dari «aṣ-Ṣardān» (hal. 683); dan membela riwayat Arab bahwa bulan kadang singgah di Sa‘d Nāsyirah (Ṣūfī menyalahkannya): Nāsyirah berada di jalur bulan, sedangkan as-Su‘ūd di luarnya (hal. 683–687).",8:"Syarah hal. 683, 688: al-Muḥibbān = nama lain kedua bintang Nāsyirah (γ,δ Cap) di ekor; Ṣūfī: keduanya agak menyimpang dari jalur matahari, yang terdepan ±2°10′ ke selatan."},

{g:'Burūj',id:'dlw',ok:1,ar:'الدلو (ساكب الماء)',idn:'Dalw / Sākib al-Mā’ (Pembawa Air / Aquarius)',
 note:'Rasi Aquarius (syarah cetak 691–707 = PDF 721–737; 18 bait). «Ad-Dalw» dan «Sākib al-Mā’» adalah dua nama gambar Yunani (penuang air; timba = <i>dzanūb</i>/<i>jirrah</i>); pada Arab «ad-Dalw» justru bintang-bintang al-Farghān dan al-Karab di rasi Faras bersama ar-Risyā’, jadi klaim «orang Arab menamainya ad-Dalw» tidak tepat. Air mengalir ke selatan berujung di <b>adh-Dhifda‘ al-Awwal</b> (Fomalhaut, α Piscis Austrini; ±mag 1,15) — kadang <b>aẓ-Ẓalīm</b> menurut Ṣūfī (tak ditemukan pada Ibn Qutaibah/al-Marzūqī) — yang oleh ahli nujum Yunani juga jadi mulut Hūt Janūbī (maksud bait 7). <b>Sa‘d Bula‘</b> (manzilah ke-23): tiga bintang kecil di telapak tangan menurut Ṣūfī, dua menurut Ibn Qutaibah/al-Marzūqī; «bula‘» dari «menelan». <b>Sa‘d as-Su‘ūd</b> (manzilah ke-24; tiga atau dua bintang) dinamai karena orang Arab bergembira atas terbitnya (hangat, hilangnya dingin ekstrem). <b>Sa‘d al-Malik</b> (dua bintang di bahu kanan) <u>bukan</u> salah satu dari 28 manzilah. <b>Sa‘d al-Akhbiyah</b> (manzilah ke-25) = empat bintang (tiga segitiga + satu di tengah); dinamai karena saat terbit udara menghangat dan makhluk keluar dari persembunyian. <b>al-Jirrah</b> (kendi, dengan ر; naskah Istanbul memang «الجِرّة») bukan nama Arab. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['الضفدع الأول','Fomalhaut (α PsA), juga mulut Hūt Janūbī','Dhifda‘ Awwal'],['سعد بلع','tiga bintang kecil di telapak tangan menurut Ṣūfī (≈ ε, μ, ν Aqr); manzilah ke-23','Sa‘d Bula‘'],['سعد السعود','dua atau tiga bintang (≈ β, ξ Aqr); manzilah ke-24','Sa‘d as-Su‘ūd'],['سعد الملك','dua bintang di bahu kanan; bukan manzilah','Sa‘d al-Malik'],['سعد الأخبية','empat bintang: tiga segitiga + satu di tengah (≈ γ, π, ζ, η Aqr); manzilah ke-25','Sa‘d al-Akhbiyah']],
 tr:[["Sesudahnya kujelaskan bentuk ad-Dālī (si penimba),", "diringkas dengan tutur yang paling singkat."], ["Dialah yang oleh orang Arab dinamai ad-Dalw (timba),", "dan Sākib al-Mā’ (penuang air) juga menjadi gelarnya,"], ["bintang-bintang yang diserupakan dengan seorang lelaki,", "di tangan kanannya ada ember (dzanūb) yang telah penuh,"], ["ia menuangkan air dari ember itu,", "memanjang bagai sungai ke arah selatan."], ["Ujung (aliran) mereka berada pada sebuah bintang cemerlang,", "dihiasi cahaya yang memukau pandangan,"], ["bersinar bagai bulan purnama bila purnama telah terbenam,", "orang Arab menamainya adh-Dhifda‘ al-Awwal (Katak Pertama)."], ["Mereka (orang Rūm) menjadikannya bagian dari al-Hūt (Ikan), maka ketahuilah,", "para pendahulu Yunani dan siapa pun yang berilmu nujum."], ["Ya, dan dalam keseluruhan gambar ini", "ada tiga bintang kecil,"], ["pada gambar itu berada di telapak tangan,", "dijadikan orang Arab sebagai bagian dari as-Su‘ūd,"], ["tampak dari ufuk ketika al-Jady terbit,", "itulah yang dinamai Sa‘d Bula‘."], ["Mengikuti mereka dua bintang,", "keduanya berdekatan dengan (ketiga bintang) itu."], ["Yang teratas dari keduanya bagai bara yang menyala,", "keduanya dinamai orang Arab Sa‘d as-Su‘ūd."], ["Mengikuti keduanya dua bintang lain,", "jarak keduanya dua syibr atau dua fitr (jengkal)."], ["Orang yang ilmunya tak diragukan mengabarkan", "bahwa keduanya dinamai Sa‘d al-Malik,"], ["keduanya berada di bahu gambar ini,", "diikuti bintang-bintang yang bercahaya,"], ["tiga bintang yang mengelilingi sebuah bintang,", "semuanya bintang yang bertubuh besar;"], ["terbitnya pertanda udara yang sedap,", "orang Arab menamainya Sa‘d al-Akhbiyah."], ["Bintang-bintang itu jauh dari Majarrah (Bimasakti),", "dan itulah yang disebut bintang-bintang al-Jirrah (kendi)."]],
 ck:{1:"Syarah hal. 692–695: «ad-Dalw» dan «Sākib al-Mā’» di sini adalah dua nama untuk gambar Yunani. Pada orang Arab, «ad-Dalw» ialah bintang-bintang al-Farghān dan al-Karab dalam rasi al-Faras al-A‘ẓam bersama bintang-bintang ar-Risyā’, bukan rasi ini; jadi klaim «orang Arab menamainya ad-Dalw» tidak tepat.",5:"Syarah hal. 693–697: adh-Dhifda‘ al-Awwal = bintang paling terang rasi ini (α Piscis Austrini, Fomalhaut; magnitudo ±1,15), di ujung aliran air dan juga di mulut al-Hūt al-Janūbī. Ṣūfī menyebutnya juga «aẓ-Ẓalīm»; pensyarah tidak menemukan penamaan itu pada Ibn Qutaibah/al-Marzūqī (hal. 696) dan menilai aẓ-Ẓalīmān mereka lebih mungkin = dua adh-Dhifda‘ menurut Ṣūfī (hal. 697), bukan dua bintang di atas al-Yamāmatān.",6:"Syarah hal. 695: bintang ini berada pada rasi ini di ujung aliran air, dan sekaligus di mulut rasi al-Hūt al-Janūbī menurut para ahli nujum pengikut mazhab Yunani — itulah maksud «mereka menjadikannya bagian dari al-Hūt».",9:"Syarah hal. 697–701: Sa‘d Bula‘ (manzilah ke-23) = tiga bintang kecil di telapak tangan menurut Ṣūfī (bintang ke-6, 7, 8). Ibn Qutaibah dan al-Marzūqī hanya menyebut DUA bintang, salah satunya samar; «bula‘» dari «menelan» (yang samar seolah menelan/ditelan). Ada beberapa pembacaan atas bintang mana yang termasuk, sesuai ciri dalam sumber.",11:"Syarah hal. 701–703: Sa‘d as-Su‘ūd (manzilah ke-24) menurut Ibn Qutaibah = tiga bintang (satu terang, dua di bawahnya); menurut al-Marzūqī dua bintang. Dinamai demikian karena orang Arab bergembira atas terbitnya (melunaknya udara, hilangnya dingin ekstrem, suburnya padang).",13:"Syarah hal. 704–705: Sa‘d al-Malik = dua bintang di bahu kanan gambar (jarak ±dua syibr), tetapi BUKAN termasuk dua puluh delapan manzilah; ia hanya satu dari as-Su‘ūd yang bersambung dengan manzilah-manzilah (Ibn Qutaibah, ats-Tsaqafī).",16:"Syarah hal. 705–706: Sa‘d al-Akhbiyah (manzilah ke-25) = empat bintang: tiga membentuk segitiga dan satu di tengah (Ṣūfī: nomor 9, 10, 12 dan 11); dinamai «akhbiyah» karena ketika terbit udara menghangat dan keluarlah makhluk yang bersembunyi dari dingin.",17:"Syarah hal. 705: «al-Jirrah» (kendi/guci, dengan ر) — kendi tempat air dituang oleh Sākib al-Mā’; orang Arab tidak mengenal bintang-bintang ini dengan nama itu. Matan naskah Istanbul memang «الجِرّة» (bukan «الجزّة»)."},

{g:'Burūj',id:'hwt',ok:1,ar:'الحوت',idn:'Hūt / Samakatān (Ikan / Pisces)',
 note:'Rasi Pisces (syarah cetak 711–718 = PDF 741–748; 4 bait). Al-Hūt (as-Samaktān, «dua ikan») = rasi terakhir dari 12 burūj; bintang-bintangnya dua baris yang bertemu pada simpul dua tali (‘uqdat al-khaythayn); menurut Ṣūfī 34 bintang di dalam gambar dan 4 di luar. Satu ikan berada di selatan al-Mar’ah al-Musalsalah, ikan lainnya dekat Sa‘d al-Hammām di selatan leher al-Faras al-A‘ẓam; di antara keduanya bintang-bintang berurutan seperti dua tali. «Kecil» (bait 2) dapat berarti kedua ikan tampak kecil, atau merujuk <b>ar-Risyā’</b> (jantung al-Hūt) dan bintang-bintang samarnya. <b>as-Sakhāb</b> (bukan «saḥāb») = kalung (Lisān al-‘Arab); <b>al-Waṣl</b> = dua baris bintang yang menghubungkan kedua ikan, di antara al-Farg al-Mu’akhkhar dan ar-Risyā’ — nama ini tidak dikenal dalam Ṣuwar al-Kawākib maupun pada Ibn Qutaibah dan al-Marzūqī (al-Marzūqī hanya menyebut celah antara dua manzilah kadang disebut al-Waṣl). Rinci per bait di kotak catatan pensyarah.',
 tbl:[['الرشاء','tali; juga jantung al-Hūt (penjelasan pensyarah, hal. 712–713) = Bathn/Qalb al-Hūt, manzilah ke-28 (lihat al-Musalsalah)','Risyā’'],['الوصل','dua baris bintang yang menghubungkan kedua ikan','Waṣl']],
 tr:[["Menyusulnya al-Hūt (Ikan), yang juga disebut as-Samakah,", "bintang-bintang yang melilit, saling bersilangan,"], ["Orang Rūm menyerupakannya dengan dua nūn (ikan),", "yang dilihat mata tampak kecil-kecil;"], ["salah satunya mendekati al-Musalsalah,", "di antara keduanya ada bintang-bintang yang bersambung,"], ["tersusun menyerupai bentuk sakhāb (kalung),", "dikenal dengan nama al-Waṣl di kalangan orang Arab."]],
 ck:{0:"Syarah hal. 711–713: al-Hūt (as-Samaktān, «dua ikan») = rasi terakhir dari dua belas burūj; bintang-bintangnya berupa dua baris yang saling bertemu pada simpul kedua tali (‘uqdat al-khaythayn). Ṣūfī: 34 bintang di dalam gambar dan 4 di luar.",2:"Syarah hal. 712–713: satu ikan berada di selatan rasi al-Mar’ah al-Musalsalah, ikan lainnya dekat Sa‘d al-Hammām di selatan leher al-Faras al-A‘ẓam; di antara keduanya bintang-bintang berurutan seperti dua tali. «Kecil» (bait 2) dapat berarti dua ikan itu tampak kecil, atau merujuk ar-Risyā’ (jantung al-Hūt) dan bintang-bintang samarnya.",3:"Syarah hal. 714–715: «sakhāb» = kalung (Lisān al-‘Arab); al-Waṣl = dua baris bintang yang menghubungkan kedua ikan, terletak antara al-Farg al-Mu’akhkhar dan ar-Risyā’. Nama «al-Waṣl» tidak dikenal dalam Ṣuwar al-Kawākib maupun Ibn Qutaibah dan al-Marzūqī (al-Marzūqī hanya menyebut celah antara dua manzilah kadang disebut al-Waṣl)."},

{g:'Janūb',id:'jan',ok:1,ar:'الصور الجنوبية',idn:'Pembuka Rasi Selatan (15 rasi)',
 note:'Pembuka rasi selatan (syarah cetak 721 = PDF 751; 2 bait). Rasi selatan = rasi yang berada di selatan jalur Matahari (al-khaṭṭ al-burūjī, ekliptika), yang membagi langit menjadi kubah utara dan kubah selatan. Ṣūfī: 15 gambar selatan, dimulai dari Qaythus lalu berurutan menurut susunan Ptolemeus: Qaythus, Jabbār (Orion), Nahr, Arnab, Kalb Akbar, Kalb Ashghar, Safīnah, Syujā‘ (+ Sulahfāh), Bāthiyah, Ghurāb, Qanthūrus & Sab‘, Mujmirah, Iklīl Janūbī, Hūt Janūbī. Syarah mencetak bait 1 dengan «وإذ… فهاهنا»; riwayat 1 «فقد… وهاهنا». Rinci di kotak catatan pensyarah.',
 tbl:null,
 tr:[["Telah kami sebut rasi-rasi burūj,", "dan di sini kami mulai keluar (dari zodiak)"], ["menuju bintang-bintang rasi selatan,", "lalu kami sebut semuanya menurut urutan."]],
 ck:{0:"Syarah hal. 721: rasi selatan = rasi yang berada di selatan jalur Matahari (al-khaṭṭ al-burūjī / ekliptika), yang membagi langit menjadi kubah utara dan kubah selatan. Ṣūfī: 15 gambar selatan, dimulai dari Qaythus lalu berurutan menurut susunan Ptolemeus. Syarah mencetak bait 1 dengan «وإذ… فهاهنا», riwayat 1 «فقد… وهاهنا»."},

{g:'Janūb',id:'qyt',ok:1,ar:'قيطس',idn:'Qaythus (Paus / Cetus)',
 note:'Rasi Cetus (syarah cetak 723–732 = PDF 753–762; 11 bait). Qaythus = makhluk laut khayali (kepala singa, ekor lumba-lumba) dari Yunani; di selatan Hamal; menurut Ṣūfī 22 bintang di dalam gambar, ±8 di antaranya magnitudo ≥3. <b>al-Khathm</b> = moncong (naskah Istanbul «al-Malṭam», Museum Seni Islam «al-Mukhṭam»). <b>al-Kaff al-Jadzmā’</b> (telapak buntung, karena pendek dibanding al-Kaff al-Khadhīb dari Tsurayyā ke utara) = bintang pertama–keenam pada kepala Qaythus (Ṣūfī); menurut Ibn Qutaibah/al-Marzūqī di bawah asy-Syarathān. <b>an-Na‘āmāt</b> (an-Na‘ām) = lima bintang pada tubuh Qaythus (nomor 12–16 Ṣūfī), terbit mengikuti al-Kaff al-Jadzmā’ (±5 qāmah, ≈ 6,5° per qāmah); sesuai Ibn Qutaibah (lima bintang pada tarbī‘ an-na‘sh, mengikuti ar-Ri’āl). <b>adh-Dhifda‘ ats-Tsānī</b> = bintang terang di salah satu cabang ekor, disebut pula <b>Rā‘ī an-Na‘āmāt</b> (bait 11 = tambahan Princeton 2259); adh-Dhifda‘ān menurut Ṣūfī = aẓ-Ẓalīmān menurut Ibn Qutaibah. Syarah mencetak bait tambahan tentang <b>al-Baqar</b> (tidak ada di riwayat 1): Ṣūfī menolak bahwa seluruh Qaythus bernama itu; menurut Ibn Qutaibah hanya bintang tersebar antara al-Kaff al-Jadzmā’, Tsurayyā, dan Dabarān. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['الكف الجذماء','bintang pertama–keenam pada kepala Qaythus (Ṣūfī); dianggap tangan Tsurayyā','Kaff al-Jadzmā’'],['النعامات','lima bintang pada tubuh Qaythus (nomor 12–16)','Na‘āmāt'],['الضفدع الثاني','bintang terang di cabang ekor; juga Rā‘ī an-Na‘āmāt','Dhifda‘ Tsānī']],
 tr:[["Yang pertama dari mereka ialah hewan laut,", "berbentuk seperti bentuk singa (hazabr),"], ["wajahnya seperti singa sarang,", "dan ekornya seperti ekor lumba-lumba."], ["Orang Rūm menamainya Qaythus,", "dan segala yang dinisbatkan kepada bintang-bintang."], ["Bintang-bintangnya berada di selatan al-Hamal (Aries),", "bercahaya pada setiap malam yang pekat."], ["Pada moncongnya terlihat sebuah bintang,", "orang Arab menamainya al-Kaff al-Jadzmā’ (telapak buntung),"], ["cahayanya nyaris tak pernah tersembunyi,", "mereka menjadikannya telapak bagi ats-Tsurayyā."], ["Mendahuluinya bintang-bintang bercahaya,", "yang berada pada tulang rusuk gambar ini,"], ["empat bintang membentuk bidang segi empat,", "luas dan lapang bidangnya."], ["Mereka menjauh darinya sekitar lima qāmah,", "dikenal orang Arab sebagai an-Na‘āmāt (burung-burung unta)."], ["Di depannya ada sebuah bintang di pangkal ekor,", "orang Arab menamainya adh-Dhifda‘ ats-Tsānī (Katak Kedua)."], ["Ia juga dikenal sebagai Rā‘ī an-Na‘āmāt (penggembala unta),", "dan dengan ciri itu pula ia digambarkan."]],
 ck:{0:"Syarah hal. 723–724: Qaythus = makhluk laut khayali (kepala singa, ekor lumba-lumba) yang dikenal Yunani dan pengikutnya; terletak di selatan al-Hamal, bintangnya bercahaya di timur. Ṣūfī: 22 bintang di dalam gambar, dan sekitar delapan di antaranya magnitudo 3 atau lebih besar.",3:"Syarah hal. 723, 727–728: naskah syarah mencetak bait tambahan «وهذه الأنجم مع بعض النهر / تعرفها الأعراب بالبقر» (tidak ada di riwayat 1). Ṣūfī menolak (ruwiya… «dikatakan») bahwa seluruh Qaythus disebut al-Baqar; menurut Ibn Qutaibah al-Baqar hanyalah bintang-bintang tersebar antara al-Kaff al-Jadzmā’, ats-Tsurayyā, dan ad-Dabarān.",4:"Syarah hal. 728–731: al-Khathm = moncong/ujung hidung. al-Kaff al-Jadzmā’ (telapak buntung) dinamai demikian karena dianggap pendek, tidak panjang seperti al-Kaff al-Khadhīb (rangkaian bintang dari ats-Tsurayyā ke utara). Ṣūfī memakai nama ini untuk bintang pertama hingga keenam pada kepala Qaythus. Ibn Qutaibah dan al-Marzūqī: ats-Tsurayyā punya dua telapak; al-Jadzmā’ di bawah asy-Syarathān.",8:"Syarah hal. 731–732: an-Na‘āmāt (juga an-Na‘ām) = lima bintang pada tubuh Qaythus, terbit mengikuti al-Kaff al-Jadzmā’; satu qāmah menurut Ṣūfī ≈ 6,5 derajat, jadi jarak ±lima qāmah. Ṣūfī menyebut lima bintang itu (nomor 12–16 pada gambarnya) an-Na‘ām atau an-Na‘āmāt; ini sesuai dengan Ibn Qutaibah (lima bintang pada tarbī‘ an-na‘sh, mengikuti ar-Ri’āl).",9:"Syarah hal. 730, 732: adh-Dhifda‘ ats-Tsānī = bintang terang di salah satu cabang ekor; juga disebut Rā‘ī an-Na‘āmāt. Pensyarah menyimpulkan adh-Dhifda‘ān menurut Ṣūfī = aẓ-Ẓalīmān menurut Ibn Qutaibah, dan menilai kedua Dhifda‘ itu berdekatan dengan bintang-bintang ar-Rabaq."},

{g:'Janūb',id:'jbr',ok:1,ar:'الجبار',idn:'Jabbār (Orion)',
 note:'Rasi Orion (syarah cetak 739–757 = PDF 769–787; 12 bait), «al-Jabbār»/«al-Jawzā’» pada Arab. Nama «al-Mīzān» di kalangan awam tidak disebut Ibn Qutaibah, al-Marzūqī, maupun Ṣūfī (hanya Sulaimān al-Mahrī); Arab memakai «al-Mīzān» untuk tiga bintang an-Nasr aṭ-Ṭā’ir. <b>al-Haq‘ah</b> (manzilah ke-5) = tiga bintang kecil di kepala Jawzā’ seperti awan; disebut juga <b>al-Athāfī</b> (naskah ini dikoreksi ke «بالهقعة»). <b>at-Tāj/adz-Dzawā’ib</b> = bintang-bintang kecil melingkar di atas kepala (Ṣūfī membatasi pada no. 17–25). <b>al-Fanīq</b> adalah nama lain ad-Dabarān, bukan bintang Jabbār. <b>an-Nājidz</b> menurut Arab = kaki kiri Jawzā’ (Rigel); yang merah dan bersinar = bahu kanan (<b>al-Mirzam</b>/<b>Rā‘ī al-Jawzā’</b>); bait 8 sesuai hanya bila dibaca «ثمّ المرزم», dan pensyarah mengkritik pencampuran nama pada riwayat ‘Abdullāh ath-Thaqafī. <b>an-Niẓām/an-Niṭāq/al-Minṭaqah/al-Fiqār</b> = tiga bintang sabuk (Ṣūfī no. 26–28). <b>al-La‘ṭ</b> = garis hitam di wajah; <b>al-Hawārī/al-Jawāzī</b> = bintang-bintang pucat di bawah sabuk, «tidak sempurna cahayanya». Rinci per bait di kotak catatan pensyarah.',
 tbl:[['الهقعة / الأثافي','tiga bintang kecil di kepala Jawzā’ (λ Ori dkk); manzilah ke-5','Haq‘ah / Athāfī'],['التاج / الذوائب','bintang kecil melingkar di atas kepala','Tāj / Dzawā’ib'],['الناجذ','Rigel (β Ori), kaki kiri Jawzā’ menurut Arab','Nājidz'],['المرزم / راعي الجوزاء','Betelgeuse (α Ori), bahu kanan','Mirzam'],['النظام / النطاق / الفقار','tiga bintang sabuk (Ṣūfī no. 26–28)','Niẓām / Niṭāq'],['السيف','pedang al-Jabbār (bait 12)','Sayf'],['الحواري / الجوازي','bintang pucat di bawah sabuk','Hawārī']],
 tr:[['Mengikutinya gugusan bintang al-Jabbār','yang dikenal di berbagai negeri'],['Di kalangan awam ia disebut al-Mīzān (timbangan)','dikenal oleh para lelaki dan anak-anak'],['Bintang-bintang bercahaya lagi termasyhur','di sela-selanya ada bintang-bintang kecil'],['Di antaranya ada bintang-bintang yang terhimpun di satu bidang','tiga bintang yang dijuluki al-Haq‘ah'],['Tak terlihat tandingannya di langit','mereka terbit mengikuti, dan di belakangnya ada bintang-bintang lain'],['Rangkaian dari bintang-bintang ini','dikenal sebagai at-Tāj dan adz-Dzawā’ib'],['Tampak dekat bintang yang berkilau itu','itulah yang dikenal sebagai al-Fanīq'],['Mengikutinya an-Nājidz, yaitu al-Mirzam','bintang yang cahayanya terang, memukau'],['Di bawahnya ada bintang-bintang bercahaya','dianggap termasuk bintang-bintang rasi ini'],['Tiga bintang yang berjajar teratur','dikenal sebagai an-Niẓām dan an-Niṭāq'],['Sering pula ketiganya disebut bersama al-Minṭaqah','di belakangnya mengikuti bintang-bintang yang berderet'],['Bagaikan pedang terhunus, itulah pedang al-Jabbār','dikenal sebagai al-La‘ṭ oleh para ahli kabar']],
ck:{1:'Syarah (cetak 740–743): nama «al-Mīzān» di kalangan awam tidak disebut Ibn Qutaibah, al-Marzūqī, maupun Ṣūfī; hanya Sulaimān al-Mahrī yang mencatatnya. Orang Arab justru memakai «al-Mīzān» untuk tiga bintang an-Nasr aṭ-Ṭā’ir (al-Marzūqī, Ṣūfī).',3:'Syarah (cetak 744–745): al-Haq‘ah = tiga bintang kecil di kepala Jawzā’, mirip awan (Ṣūfī); disebut juga al-Athāfī; manzilah ke-5. Naskah ini dikoreksi ke «بالهقعة» (lihat gl).',5:'Syarah (cetak 747–748): at-Tāj/adz-Dzawā’ib = bintang-bintang kecil melingkar di atas kepala (Ibn Qutaibah, al-Marzūqī); Ṣūfī membatasi pada bintang ke-17 s.d. 25 yang melengkung.',6:'Syarah (cetak 747–748): «al-Fanīq» adalah salah satu nama ad-Dabarān (bukan bintang rasi Jabbār) — «ذي البريق» ialah ad-Dabarān yang dekat at-Tāj.',7:'Syarah (cetak 748–752): nama «an-Nājidz» menurut Arab ialah kaki kiri Jawzā’ (Rigel); yang merah dan bersinar = bahu kanan (al-Mirzam/Rā‘ī al-Jawzā’). Bait ini sesuai hanya bila dibaca «ثمّ المرزم»; pensyarah mengkritik pencampuran nama dalam riwayat ‘Abdullāh ath-Thaqafī.',9:'Syarah (cetak 755–756): an-Niẓām/an-Niṭāq/al-Minṭaqah = tiga bintang sabuk (Ṣūfī: no. 26–28); orang Arab juga menyebutnya al-Fiqār.',11:'Syarah (cetak 756–757): al-La‘ṭ = garis (hitam) di wajah; al-Hawārī/al-Jawāzī = bintang-bintang pucat di bawah sabuk, «tidak sempurna cahayanya»; lafal «منتصبات/مضيئات» ada di naskah lain.'},

{g:'Janūb',id:'nhr',ok:1,ar:'النهر',idn:'Nahr (Sungai / Eridanus)',
 note:'Rasi Eridanus (syarah cetak 761–766 = PDF 791–797; 8 bait). Sungai yang bermula dari bintang paling terang di Jawzā’: Yunani menyebutnya kaki al-Jabbār; Arab: Rijl al-Jawzā’, Rā‘ī al-Jawzā’, atau an-Nājidz (baris «وهو ناجذ أو راعي…» pada naskah Princeton 2259 salah ditaruh di Kalb Akbar). Empat bintang di dada «hewan laut» (Qaythus) = lengkungan yang oleh Arab disebut <b>Udhiyy an-Na‘ām</b> (sarang burung unta), dengan bintang di sekelilingnya <b>al-Bayḍ wa al-Qayḍ</b>; syarah mencetak bait tambahan tentang ini yang tidak ada di riwayat 1. <b>Ākhir an-Nahr</b> = nama Yunani (Acamar); nama modern Achernar kini dipakai untuk bintang lain yang lebih selatan. Arab menamainya <b>al-Ẓalīm</b> (Ibn Qutaibah, Ṣūfī); Ṣūfī menggolongkannya magnitudo 1 padahal sebenarnya magnitudo 3. Pensyarah mengusulkan «aẓ-Ẓalīmān» pada Ibn Qutaibah = dua Dhifda‘ (lihat Rāmī). Rinci per bait di kotak catatan pensyarah.',
 tbl:[['أدحي النعام','lengkungan empat bintang di dada Qaythus','Udhiyy an-Na‘ām'],['البيض والقيض','bintang di sekeliling lengkungan itu','Bayḍ wa Qayḍ'],['الظليم','Ākhir an-Nahr (Acamar); magnitudo sebenarnya 3','Ẓalīm']],
 tr:[['Mengikutinya an-Nahr, bintang-bintang yang bermula','dari sebuah bintang yang gemilang lagi menyala'],['Bangsa Rūm mengenalnya sebagai kaki al-Jabbār','lalu bintang-bintang itu berkelok seperti kelokan sungai'],['Hingga sampai pada bintang-bintang yang berhimpun','empat bintang yang membentuk segi empat'],['Termasuk bintang-bintang terang hewan laut itu','letaknya di atas dadanya'],['Kemudian mereka berbelok ke arah selatan','lalu memanjang cukup jauh'],['Hingga sampai pada sebuah bintang yang menyendiri','cahayanya tak akan hilang di antara bintang-bintang'],['Seakan-akan ia bara yang menyala','tak terlihat dekat dengannya bintang lain'],['Orang Arab menjulukinya al-Ẓalīm','dan ujung an-Nahr namanya dalam bahasa Rūm']],
ck:{0:'Syarah (cetak 762): bintang awal sungai ialah yang paling terang di Jawzā’ — orang Yunani menyebutnya kaki al-Jabbār, orang Arab: Rijl al-Jawzā’, Rā‘ī al-Jawzā’, atau an-Nājidz. Naskah Princeton 2259 salah menaruh baris «وهو ناجذ أو راعي…» di bagian Kalb Akbar, padahal cocok di sini.',3:'Syarah (cetak 762–765): empat bintang di dada «hewan laut» (Qaythus) — Arab menyebut lengkungan itu Udhiyy an-Na‘ām (sarang burung unta), dan bintang di sekelilingnya al-Bayḍ wa al-Qayḍ. Syarah memuat bait tambahan tentang itu yang tidak ada di riwayat ini.',7:'Syarah (cetak 763, 765–766): «Ākhir an-Nahr» = nama Yunani (Acamar); nama modern Achernar kini dipakai untuk bintang lain yang lebih selatan. Orang Arab menamainya al-Ẓalīm (Ibn Qutaibah dan Ṣūfī); Ṣūfī menggolongkannya magnitudo 1 padahal sebenarnya magnitudo 3. Pensyarah mengusulkan «aẓ-Ẓalīmān» pada Ibn Qutaibah = dua Dhifda‘ (lihat Rāmī).'},

{g:'Janūb',id:'arn',ok:1,ar:'الأرنب',idn:'Arnab (Kelinci / Lepus)',
 note:'Rasi Lepus (syarah cetak 771–775 = PDF 801–805; 4 bait). Di bawah kedua kaki Jawzā’. Bintang-bintangnya disebut «redup», tetapi pensyarah menilai kebanyakan cukup jelas dan tidak sehalus yang dinyatakan; Ṣūfī: 12 bintang bergambar, tak ada bintang lain di sekelilingnya. <b>‘Arsy al-Jawzā’</b> = empat bintang berbentuk segi empat di badan al-Arnab (Ṣūfī no. 7–10), disebut juga <b>Kursī al-Jawzā’ al-Mu’akhkhar</b> karena terbit setelah Kursī al-Jawzā’ al-Muqaddam (di rasi an-Nahr). <b>an-Nihāl</b> = unta-unta haus yang datang ke air; nama ini muncul karena dekat Nahr al-Majarrah (Bimasakti) atau karena kerlipannya (al-Marzūqī: Kursī al-Jawzā’ = at-Tahl). Rinci per bait di kotak catatan pensyarah.',
 tbl:null,
 tr:[['Sesudahnya al-Arnab, yaitu bintang-bintang','kecil, kebanyakannya redup'],['Bila dipandang dengan mata','ia berada di bawah kedua kaki rasi al-Jabbār'],['Orang Arab menjulukinya «Singgasana al-Jabbār»','demikian pula disebutkan para ahli kabar'],['Orang Arab juga menamainya an-Nihāl','demikian yang diberitakan kitab-kitab tentangnya']],
ck:{0:'Syarah (cetak 772): bintang-bintang al-Arnab disebut «redup», tetapi pensyarah menilai kenyataannya kebanyakan cukup jelas dan tidak sehalus yang dinyatakan. Ṣūfī: 12 bintang bergambar, tak ada bintang lain di sekelilingnya.',2:'Syarah (cetak 772, 775): «‘Arsy al-Jawzā’» = empat bintang berbentuk segi empat di badan al-Arnab (ke-7, 8, 9, 10 menurut Ṣūfī), disebut juga Kursī al-Jawzā’ al-Mu’akhkhar karena terbit setelah Kursī al-Jawzā’ al-Muqaddam (di rasi an-Nahr); letaknya di bawah kedua kaki al-Jawzā’.',3:'Syarah (cetak 775): an-Nihāl = unta-unta haus yang datang ke air; nama ini muncul karena dekatnya dengan Nahr al-Majarrah (Bimasakti), atau karena kerlipannya (Marzūqī: Kursī al-Jawzā’ = at-Tahl).'},

{g:'Janūb',id:'kb1',ok:1,ar:'الكلب الأكبر',idn:'Kalb Akbar (Anjing Besar / Canis Major)',
 note:'Rasi Canis Major (syarah cetak 779–788 = PDF 809–818; 9 bait). <b>asy-Syi‘rā al-Yamāniyah</b> = <b>al-‘Abūr</b> (Sirius): «Yamāniyah» karena terbit ke arah Yaman/selatan, «al-‘Abūr» karena konon menyeberangi Majarrah menyusul Suhail; inilah «asy-Syi‘rā» yang disembah di masa jahiliah (QS an-Najm: 49; Abū Kabsyah). Saudaranya al-Ghumaiṣā’ = asy-Syi‘rā asy-Syāmiyah (Procyon, rasi lain). «Kaff al-Kalb» di sini = <b>Mirzam al-‘Abūr</b> (Ṣūfī: bintang ke-9; juga «Mirzam asy-Syi‘rā»), bukan Mirzam Dzirā‘ maupun Mirzam al-Jawzā’; ia tidak termasuk manzilah bulan. <b>al-‘Adzārā</b> = ‘Udzrat al-Jawzā’: 5 bintang putih (Ibn Qutaibah), 3 (al-Marzūqī, ath-Thaqafī), 4 (Ṣūfī: no. 12, 14, 15, 18 di ekor); dua yang terang dikenal di Jazirah Arab sebagai al-Kalbain. <b>al-Qurūd</b>: naskah ini «القرود», sedangkan al-Marzūqī, ath-Thaqafī, dan kamus menulis «الفرود» (bintang kecil menyendiri dekat Ḥaḍār); syarah menyebut pula «al-Aghribah» (gagak) sebagai nama lain. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['الشعرى العبور','Sirius α CMa','Sya‘rā ‘Abūr'],['المرزم','β CMa','Mirzam'],['العذارى','ε,δ,η CMa','‘Adzārā']],
 tr:[['Mengikutinya seekor anjing yang disebut al-Akbar','bintang-bintang yang cahayanya berkilau'],['Mereka menyobek tirai-tirai kegelapan dengan cahaya','dan terbit setelah terbitnya al-Jawzā’'],['Di antaranya ada bintang yang mendahului as-Safīnah','yang telah mereka sembah sebelum kita selama bertahun-tahun'],['Amat terang, berkilau, gemilang cahayanya','dikenal sebagai asy-Syi‘rā dan al-‘Abūr'],['Ia diikuti sebuah bintang, yaitu telapak anjing itu','dikenal sebagai al-Mirzam di kalangan Arab'],['Asy-Syi‘rā diikuti bintang-bintang yang bersinar','berkilau, dikabarkan kepada kami oleh orang terpercaya'],['Al-‘Adzārā adalah nama bagi mereka di kalangan Arab','mereka (berada pada) kaki anjing itu, ketahuilah, dan ekornya'],['Mengikuti mereka bintang-bintang yang terang','berkilau, tanpa rupa bergambar bagi mereka'],['Menembus tirai-tirai malam yang hitam','orang Arab mengenalnya sebagai al-Qurūd']],
ck:{3:'Syarah (cetak 780–784): «asy-Syi‘rā al-Yamāniyah» = al-‘Abūr (Sirius), disebut «Yamāniyah» karena terbit ke arah Yaman/selatan, dan «al-‘Abūr» karena konon menyeberangi Majarrah menyusul Suhail; inilah «asy-Syi‘rā» yang disembah di masa jahiliah (QS an-Najm: 49; Abū Kabsyah). Saudaranya al-Ghumaiṣā’ = asy-Syi‘rā asy-Syāmiyah (Procyon, di rasi lain).',4:'Syarah (cetak 784–785): «Kaff al-Kalb» di sini = Mirzam al-‘Abūr (Ṣūfī: bintang ke-9; juga «Mirzam asy-Syi‘rā»), bukan Mirzam Dzirā‘ (al-Ghumaiṣā’) maupun Mirzam al-Jawzā’; Mirzam al-‘Abūr tidak termasuk manzilah bulan.',6:'Syarah (cetak 786–787): al-‘Adzārā = ‘Udzrat al-Jawzā’; jumlahnya 5 bintang putih menurut Ibn Qutaibah, 3 menurut al-Marzūqī dan ath-Thaqafī (jadi 5 bila digabung), 4 menurut Ṣūfī (no. 12, 14, 15, 18 di ekor). Di Jazirah Arab dua bintang terangnya dikenal sebagai al-Kalbain.',8:'Syarah (cetak 787–788): pembacaan «القرود» (kera) dibahas: pada naskah-naskah arjuzah dan sebagian naskah Anwā’ Ibn Qutaibah tertulis «القرود», tetapi al-Marzūqī, ath-Thaqafī, dan kamus menulis «الفرود» (bintang-bintang kecil yang menyendiri di dekat Ḥaḍār). Syarah juga menyebut «al-Aghribah» (gagak) sebagai nama lain.'},
