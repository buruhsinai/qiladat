const VM={"muq#3":"Riwayat 1 «لفلك الأمة» (naskah Istanbul dan Dar al-Kutub 163) = «poros/bulatan umat»; riwayat 2 «لملك الأمة» = «raja umat». Catatan kerja: «لملك» dijumpai di banyak naskah dan dinilai tashhif; urutan dua syatr juga tertukar antarriwayat.","dakb#29":"Riwayat 1 «فحزن فيا حزنا» = «maka ia bersedih, wahai dukanya»; riwayat 2 «فخزن فيها خزنا» dibaca tentatif («disimpan… simpanan»), maknanya belum jelas. Ejaan riwayat 2 masih perlu diperiksa.","dakb#31":"Riwayat 1 menyebut nama «al-Qafazāt» (bintang-bintang pelompat); riwayat 2 hanya «bintang-bintang» secara umum — nama khusus itu tidak ada di riwayat 2.","qay#1":"Riwayat 1: orang Arab menamai rasi ini «al-Multahib»; riwayat 2: nama itu hanya «kadang» dipakai, dan bintang-bintangnya dikenal Arab sebagai «asy-Syā’» (kambing). Catatan kerja: pensyarah menilai Arab tidak menamai rasi ini «al-Multahib», sehingga redaksi riwayat 2 lebih hati-hati.","awa#3":"Riwayat 1 hanya menyebut «aṣ-Ṣannāj dan al-Baqqār»; riwayat 2 menambah «an-Nā‘ūr», «aṣ-Ṣayyāḥ» dan «al-Baqqār» — nama-nama lain bagi rasi yang sama (aṣ-Ṣannāj/al-Baqqār = terjemah Yunani Boōtēs menurut catatan syarah).","ham#2":"Riwayat 1: «yang pertama dari mereka» (urutan bintang dari awal); riwayat 2: «mengikutinya» (menyusul bintang sebelumnya). Syarah mencetak redaksi ketiga («بينها نجم عظيم الجرم»); urutan bintang pembuka Hamal karenanya bergantung riwayat.","ham#11":"Riwayat 1 «عند العزب» vs riwayat 2 «عند العرب»: «العزب» (orang lajang) tampak tidak bermakna di sini — dugaan salah baca/tulis dari «العرب»; terjemah riwayat 1 sudah mengikuti makna «orang Arab».","tsr#10":"Riwayat 1 «يتبعه» (menyusul) vs riwayat 2 «يقدمه» (mendahului). Catatan kerja: syarah mencetak «يقدمه», dan nota kaki naskah menyebut «يقدمه» sebagai bacaan yang benar; arah posisi kedua bintang berbalik antarriwayat.","adz#10":"Riwayat 1 «للبَذْر» = «untuk penaburan benih»; riwayat 2 «للبدر» = «untuk bulan purnama». Catatan kerja: syarah hal. 606 mencetak «للبدر».","miz#6":"Riwayat 1 «فوقهما» (bintang tak teramati berada DI ATAS dua bintang) vs riwayat 2 «من تحتها» (DI BAWAHNYA). Catatan kerja: syarah mencetak «من تحتها», yaitu bacaan riwayat 2.","shj#2":"Riwayat 1: bintang-bintang itu di «punggung» Syujā‘ dan tampak «ketika al-Qalb terbit»; riwayat 2: di «kepala» Syujā‘ dan tampak «ketika al-Layts (Singa) terbit». Dua perbedaan sekaligus: bagian tubuh dan penanda waktu terbit.","jat#7":"Riwayat 1 «على يدي وصدر» (kedua tangan dan DADA) vs riwayat 2 «على يدي ورجل» (kedua tangan dan KAKI) — bagian tubuh gambar yang ditempati bintang-bintang berbeda.","ikj#2":"Riwayat 1 «عند وظيف الرامي» (dekat waẓīf) vs riwayat 2 «تحت وظيف الرامي» (di bawah waẓīf).","dlw#10":"Baris kedua berbeda: riwayat 1 «keduanya berdekatan dengan (ketiga bintang) itu»; riwayat 2 «keduanya bertanda di bahu» — riwayat 2 menyebut letak (bahu) yang tidak ada di riwayat 1.","qnt#6":"Riwayat 1: dua bintang «di bawahnya» (di bawah bintang-bintang sebelumnya), gemilang; riwayat 2: dua bintang «dalam rangkaian gambar», berpasangan — penentuan letak berbeda.","mam#0":"Riwayat 1: «mengikutinya bintang-bintang al-‘Annāz yang dikenal (di Hijaz)»; riwayat 2 (juga dicetak syarah): «timur menampakkan sesudahnya bintang-bintang yang dijuluki al-‘Annāz». Redaksi pembuka bagian ini berbeda total, bukan sekadar lafal.","haw#9":"Riwayat 1 «عين لقبوها النسق» vs riwayat 2 «طرف سميت بالنسق» (cf. «طرف الراني» yang dikutip syarah): bagian bintang yang disebut an-Nasaq berbeda («mata» vs «ujung/tepi»).","haw#12":"Riwayat 1 «الروضة … الكُنْدُر النُّقَّد» vs riwayat 2 «البقعة … الكُدْر النَّقَد»; syarah mencetak «البقعة». Arti «الكُنْدُر» belum ditemukan di syarah.","sah#2":"Riwayat 2 menambahkan keterangan letak «di bawah bintang-bintang an-Nasr» (kalimat yang tidak ada di riwayat 1); riwayat 1 hanya menyebut «di tepi Via Lactea (al-Majarrah)».","far#5":"Riwayat 1: Sa‘d al-Buhām saja («tadʿūhumā Sa‘d al-Buhām»); riwayat 2 (juga dicetak syarah): dua nama, «Sa‘d al-Buhām dan Sa‘d an-Nuhā». Jumlah nama/manzilah yang disebut berbeda.","far#3":"Baris kedua berlawanan: riwayat 1 «naik/terengah-engah ketika Singa naik (istaqalla)» vs riwayat 2 «tampak dari timur ketika Singa terbenam (afala)». Waktu tampaknya bintang relatif terhadap Singa berbalik.","kur#2":"Riwayat 1 mengaitkan terbitnya dengan «an-Nasr» («mengikuti an-Nasr ketika an-Nasr terbit»); riwayat 2 dengan «ar-Radf» («tampak dari ufuk ketika ar-Radf terbit»). Bintang patokan waktu terbitnya berbeda.","per#6":"Riwayat 1: bintang itu «di lengan (sā‘id) gambar ini, diikuti bintang-bintang cemerlang»; riwayat 2: «diikuti bintang-bintang cemerlang yang dihitung termasuk bentuk gambar ini» — keterangan letak «di lengan» hanya ada di riwayat 1.","rmy#1":"Riwayat 1 «عذبة الرامي» (‘adzabah = kuncir/ujung kain di kepala si Pemanah) vs riwayat 2 «عصابة للرامي» (‘ishābah = ikat kepala). Dua benda berbeda sebagai perumpamaan bagi bintang-bintang itu.","kht#5":"Riwayat 1 «والدنا» = ayah penulis (Abū al-Ḥusayn ‘Abd ar-Raḥmān b. ‘Umar ar-Rāzī aṣ-Ṣūfī, penulis Ṣuwar al-Kawākib; syarah cetak 892); riwayat 2 «شيخنا» = guru kami. Perbedaan antarriwayat, bukan salah baca; keduanya dibiarkan sesuai naskah masing-masing."};

const cmpBox=(d,i)=>{const pr=PR[d.id];if(!pr)return `<div class="cmp only"><div class="cl">⇄ Pembanding: bagian ini tidak punya padanan di riwayat ${R==1?2:1}</div></div>`;
 const od=ALL().find(x=>x.id===pr.o),m=pr.m[i],oR=R==1?2:1;
 if(m===null)return `<div class="cmp only"><div class="cl">◇ Khas riwayat ${R} — tidak ada padanannya di riwayat ${oR} (bagian «${od.idn.split('(')[0].trim()}»)</div></div>`;
 const a=d.v[i],b=od.v[m],na=norm(a.join(' ')).split(/\s+/),nb=norm(b.join(' ')).split(/\s+/);
 const ja=na.join(' '),jb=nb.join(' ');let lab,body='';
 const lk=`riwayat ${oR} bait ${m+1} (bagian ${od.idn.split('(')[0].trim()})`;
 if(ja===jb)return `<div class="cmp"><div class="cl">≡ Lafal sama dengan ${lk} (harakat/ejaan kecil diabaikan)</div></div>`;
 if(norm(a[1]+' '+a[0])===jb)return `<div class="cmp"><div class="cl">↕ Kata-kata sama dengan ${lk}, hanya urutan syatr terbalik</div></div>`;
 const set=new Set(na),hl=(t)=>t.split(/\s+/).map(w=>set.has(norm(w))?w:`<mark>${w}</mark>`).join(' ');
 const vm=VM[R==1?d.id+'#'+i:pr.o+'#'+m];
 return `<div class="cmp"><div class="cl">≠ Varian lafal — ${lk}; kata yang berbeda ditandai</div><div class="row"><span>${hl(b[0])}</span><span>${hl(b[1])}</span></div>${vm?`<div class="cl vm">💡 <b>Makna varian:</b> ${vm}</div>`:''}</div>`};
function render(q){
 buildNav();
 const sy=window.scrollY,d=A().find(x=>x.id===cur),O=offs(),tot=A().reduce((a,x)=>a+x.v.length,0);
 let h=`<div class="bar"><button id="bp">◀</button><button id="bn">▶</button><button id="b1">A−</button><button id="b2">A+</button><button id="b3">🌙 Mode</button><button id="b5">🌐 Terjemah</button><button id="b6">${all?'📖 Tampilan: semua bait':'📖 Tampilan: per bagian'}</button><button id="b9">${cmp?'⇄ Banding riwayat: tampil':'⇄ Banding riwayat: sembunyi'}</button><button id="b7">${num=='cont'?'№ Nomor: berlanjut':'№ Nomor: per bagian'}</button>${all?`<button id="b8">${sn?'📝 Catatan bagian: tampil':'📝 Catatan bagian: sembunyi'}</button>`:''}<button id="b4">⭐ Bait bertanda (${Object.keys(marks).length})</button></div>`;
 const vb=(d,i)=>{const k=d.id+'#'+i,nn=num=='cont'?`${O[d.id]+i+1}<small> (${i+1})</small>`:`${i+1}`;
  return `<div class="v ${marks[k]?'mark':''}" data-k="${k}"><span class="n">${nn}</span><div class="row"><span>${d.v[i][0]}</span><span>${d.v[i][1]}</span></div>${d.tr&&d.tr[i]?`<div class="tr"><span>${d.tr[i][0]}</span><span>${d.tr[i][1]}</span></div>`:''}${cmp?cmpBox(d,i):''}${d.ck&&d.ck[i]?`<div class="ck"><b>⚠ Catatan pensyarah:</b> ${d.ck[i]}</div>`:''}${d.gl[i]?`<div class="gl">📝 ${d.gl[i]}</div>`:''}</div>`};
 const rng=d=>num=='cont'?`bait ${O[d.id]+1}–${O[d.id]+d.v.length} dari ${tot}`:`${d.v.length} bait`;
 if(all){
  h+=`<h2>Seluruh matan — riwayat ${R} · ${tot} bait · ${A().length} bagian</h2>`;
  for(const x of A()){
   h+=`<h2 id="sec-${x.id}" style="margin-top:26px;border-top:2px solid var(--bd);padding-top:10px">${x.idn}<span class="ar">${x.ar}</span></h2>`;
   if(sn)h+=`<div class="note">${x.note}</div>`;
   h+=`<h3>Matan — ${rng(x)} (riwayat ${R}) · ${x.ok?'✔ dicocokkan dengan PDF':'⚠ belum diverifikasi'}</h3>`;
   x.v.forEach((b,i)=>h+=vb(x,i));
  }
 }else{
  h+=`<h2>${d.idn}<span class="ar">${d.ar}</span></h2><div class="note">${d.note}</div>`;
  if(d.tbl){h+=`<table><tr><th>Nama Arab</th><th>Bintang modern</th><th>Translit</th></tr>`+d.tbl.map(r=>`<tr><td class="ar">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')+`</table>`}
  h+=`<h3>Matan — ${rng(d)} (riwayat ${R}) · ${d.ok?'✔ dicocokkan dengan PDF':'⚠ belum diverifikasi'}</h3>`;
  d.v.forEach((b,i)=>h+=vb(d,i));
 }
 main.innerHTML=h;main.style.setProperty('--fs',fs);if(all&&!jumping)window.scrollTo(0,sy);jumping=false;
 main.querySelectorAll('.v').forEach(e=>{e.onclick=()=>e.classList.toggle('open');e.ondblclick=()=>{const k=e.dataset.k;marks[k]?delete marks[k]:marks[k]=1;localStorage.setItem('ak_marks',JSON.stringify(marks));render()}});
 $('#b1').onclick=()=>{fs=Math.max(.6,fs-.1);render()};$('#b2').onclick=()=>{fs+=.1;render()};
 $('#bp').onclick=()=>{const i=A().findIndex(x=>x.id===cur);if(i>0){cur=curs[R]=A()[i-1].id;jumping=true;render();go()}};$('#bn').onclick=()=>{const i=A().findIndex(x=>x.id===cur);if(i<A().length-1){cur=curs[R]=A()[i+1].id;jumping=true;render();go()}};
 $('#b9').onclick=()=>{cmp=!cmp;savePf();render()};$('#b6').onclick=()=>{all=!all;savePf();jumping=true;render();go()};$('#b7').onclick=()=>{num=num=='cont'?'sec':'cont';savePf();render()};if($('#b8'))$('#b8').onclick=()=>{sn=!sn;render()};$('#mt').textContent='☰ '+d.idn.split('(')[0]+' — daftar bagian';$('#mt').onclick=()=>document.body.classList.toggle('sopen');$('#b3').onclick=()=>document.body.classList.toggle('dark');$('#b5').onclick=()=>document.body.classList.toggle('notr');
 $('#b4').onclick=()=>{let h='<h2>Bait bertanda</h2>';Object.keys(marks).forEach(k=>{const [id,i]=k.split('#');const d=ALL().find(x=>x.id===id);const b=d.v[i];h+=`<div class="v"><div class="row"><span>${b[0]}</span><span>${b[1]}</span></div><div class="gl" style="display:block">${d.idn}</div></div>`});main.innerHTML=h};
 $('#stat').textContent=A().reduce((a,x)=>a+x.v.length,0)+' bait tercakup / '+(R==1?488:553)+' · '+A().length+' bagian · terjemah: '+A().reduce((a,x)=>a+(x.tr?x.tr.length:0),0)+' bait';
}
$('#q').oninput=e=>{
 const t=norm(e.target.value.trim());if(!t){render();return}
 let h=`<h2>Hasil: ${e.target.value}</h2>`,n=0;
 for(const d of A()){
  const hit=norm(d.ar+' '+d.idn+' '+d.note.replace(/<[^>]+>/g,'')+' '+(d.tbl||[]).flat().join(' ')).includes(t);
  const vs=d.v.map((b,i)=>[b,i]).filter(([b])=>norm(b.join(' ')).includes(t));
  if(hit||vs.length){n++;h+=`<div class="note"><b><a href="#" data-go="${d.id}">${d.idn}</a></b> — ${hit?'cocok di catatan/tabel':''} ${vs.length?vs.length+' bait cocok':''}</div>`;
   vs.slice(0,3).forEach(([b])=>h+=`<div class="v"><div class="row"><span>${b[0]}</span><span>${b[1]}</span></div></div>`)}
 }
 main.innerHTML=h+(n?'':'<p>Tidak ada hasil.</p>');
 main.querySelectorAll('[data-go]').forEach(a=>a.onclick=ev=>{ev.preventDefault();cur=a.dataset.go;render()});
};
render();
</script>
</body>
</html>
