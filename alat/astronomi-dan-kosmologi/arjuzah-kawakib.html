{g:'Utara',id:'r2_haw',ok:1,ar:'الحوّاء والحيّة',idn:'al-Hawwā’ wal-Hayyah (riwayat 2)',
 note:'Rasi Ophiuchus dan Serpens, PDF 116 (13 bait). Hawwā’ = pria berdiri yang menggenggam ular (<b>al-Ḥayyah</b>; «ar-raqshā’» = ular bergaris-bintik); «mumsik al-ḥubāb» = Hawwā’ yang memegang ular (al-ḥubāb = al-ḥayyah). Kedua rasi saling berkait. Bagi Arab seluruh kawasan Jātsī–Hawwā’–Ḥayyah itu satu bidang: <b>an-Nasaqān</b> (asy-Syāmī &amp; al-Yamānī; an-Nasaq al-Yamānī = satu baris bintang dari dekat pergelangan al-Jātsī/Fakkah ke Majarrah dekat Syaulah dan an-Na‘ām), <b>ar-Rā‘ī</b> dan dua <b>Kalb ar-Rā‘ī</b> (satu di dahi al-Jātsī, satu di bahu Hawwā’), <b>al-Aghnām</b> (bintang di antara dua nasaq) dan <b>ar-Rawdhah</b>. Arab mengenal dua «ar-Rā‘ī» (kawasan Hawwā’ dan Bootes). Ar-Rā‘ī bersama Nasr Wāqi‘ dan Nasr Thā’ir membentuk «segitiga musim panas». <b>an-Naqad/an-Nuqqad</b> = domba kecil (bintang redup dinamai hewan kecil). Bait 9 «على الحية» benar (bukan «على الجبهة»). Rinci per bait di kotak catatan pensyarah.',
 tbl:[['الراعي','bintang di kawasan Hawwā’; ada dua ar-Rā‘ī pada Arab','Rā‘ī'],['كلب الراعي','Kalb ar-Rā‘ī kedua di bahu Hawwā’ (Rasalhague)','Kalb ar-Rā‘ī'],['النسق اليماني / الشامي','dua baris bintang pada kawasan ular','Nasaq'],['الأغنام / الروضة','bintang di antara dua nasaq; kawasannya','Aghnām / Rawdhah'],['النقد','domba kecil (bintang redup)','Naqad']],
 tr:[['Menyertainya bintang-bintang al-Hawwā’','dan seekor ular berbelang-belang di tangannya'],['Telah berlalu kabar tentang gugusannya','dalam gambar Sang Berlutut pada lututnya'],['Yang pertama kami sebut dari bintang-bintangnya','sebuah bintang pada lubang hidungnya atau mulutnya'],['Ia bersama kedua Nasr berada di hamparan yang datar','seperti bentuk segitiga yang bergaris'],['Ia dikenal sebagai ar-Rā‘ī (Gembala) oleh orang Arab','diikuti (bintang) dari Pemegang Ular (Mumsik al-Ḥubāb)'],['Sebuah bintang bersinar pada bahu','dikenal orang Arab sebagai Kalb ar-Rā‘ī (Anjing Gembala)'],['Dan mulai dari pergelangan Sang Berlutut pada','lututnya, bintang-bintang yang bercahaya'],['Menyambung menjadi satu garis dari bintang-bintang gemerlap','berkilau, tubuh-tubuhnya menyilaukan'],['Sebagian di atas ular, dan sebagian lagi di','ujung-ujung jari Hawwā’, dan semuanya bersinar'],['Memenuhi, di kegelapan, pandangan si pengamat','dinamai an-Nasaq al-Yamānī (Barisan Yaman)'],['Sebagian orang berkata bahwa ia menamai','semua yang kaulihat dari bintang-bintang'],['yang ada di antara dirinya dan an-Nasaq asy-Syāmī','selain yang telah kujelaskan sebagai al-Aghnām (domba-domba)'],['Kawasan itu dikenal sebagai ar-Rawdh (taman), dan telah','kudengar pada bintang-bintangnya al-Kudr an-Naqad']],
 ck:{0:'Syarah hal. 352: Hawwā’ (Ophiuchus) = pria berdiri yang menggenggam ular (al-Ḥayyah/Serpens); ar-raqshā’ = ular yang bergaris dan berbintik. Kedua rasi saling berkait.',1:'Syarah hal. 352–353: «جملته» merujuk pada keterangan di rasi al-Jātsī. Bagi orang Arab seluruh kawasan langit Jātsī–Hawwā’–Ḥayyah itu satu bidang: an-Nasaqān (asy-Syāmī & al-Yamānī), ar-Rā‘ī dan kedua kalb-nya, ar-Rawdhah dan al-Aghnām.',3:'Syarah hal. 354: ar-Rā‘ī bersama Nasr Wāqi‘ dan Nasr Thā’ir membentuk segitiga besar (orang Arab: “segitiga musim panas”, mutsallats ash-shayf).',4:'Syarah hal. 355: «ممسك الحُباب» = Hawwā’ yang memegang ular (al-ḥubāb = al-ḥayyah). Syarah hal. 363–364: orang Arab mengenal dua «ar-Rā‘ī» (satu di kawasan Hawwā’, satu di al-Multahib/Bootes, masing-masing dengan kalb dan domba-dombanya). Pensyarah mencatat ar-Rā‘ī di sini terletak pada wajah gambar Hawwā’, sedangkan di rasi al-Jātsī dikatakan «فوق جبين الحوّا» — perbedaan penggambaran antarnaskah, kecil.',5:'Syarah hal. 355: bintang pada bahu ini ialah Kalb ar-Rā‘ī kedua; Kalb ar-Rā‘ī lainnya berada pada dahi al-Jātsī.',8:'Syarah hal. 356 (nota kaki 1; dipindah dari riwayat 1): naskah Istanbul dan kelompok 1–2 membaca «على الجبهة» — keliru; yang benar «على الحية» (kelompok 3–4; juga Princeton 2259 dan Gotha). Riwayat 2 naskah ini sudah membaca «على الحية».',9:'Syarah hal. 356–357: an-Nasaq al-Yamānī = satu baris bintang yang mulai dekat pergelangan al-Jātsī / dekat Fakkah dan berakhir di Majarrah dekat Syaulah dan bintang-bintang an-Na‘ām.',10:'Syarah hal. 356, 359: sebagian orang Arab menyebut semua bintang di antara kedua nasaq (selain ar-Rā‘ī dan kedua kalb) sebagai al-Aghnām; kawasannya ar-Rawdhah (ar-Rawdh). Riwayat 2 naskah ini membaca «تسمّي», sama dengan riwayat 1 (dicek pada PDF 116; bacaan «تسقي» sebelumnya keliru).',12:'Syarah hal. 356 (dipindah dari riwayat 1): an-Naqad/an-Nuqqad = domba kecil (orang Arab menamai bintang redup dengan hewan kecil). Riwayat 2 naskah ini membaca «الكُدْر النَّقَد» (riwayat 1: «الكُنْدُر النُّقَّد»); arti «الكُنْدُر/الكُدْر» tidak dijelaskan di halaman syarah yang dibaca (PDF 382–390).'},

{g:'Utara',id:'r2_sah',ok:1,ar:'السهم',idn:'as-Sahm (riwayat 2)',
 note:'Rasi Sagitta (anak panah), riwayat 2 (4 bait; syarah cetak 369–370 = PDF 399–400). Lima bintang di antara paruh Dajājah dan Nasr Thā’ir, di jalur Bimasakti; orang Arab tidak punya nama untuk bintang-bintangnya. Yang paling terang (di mata panah) kira-kira magnitudo 3,5 — sebanding bintang uji penglihatan as-Suhā. «Takādu tunkiruhā al-abṣār» = mata nyaris luput melihatnya karena kecil dan redup cahayanya. Dua baris «كأنما النسر عليه قد قبض…» dan «موقعها في حافة المجرة…» (bait 2–3), dikutip syarah, ada di riwayat 2 (tidak di riwayat 1): digambarkan seperti dicengkeram cakar elang, di tepi al-Majarrah di bawah bintang an-Nasr. Rinci per bait di kotak catatan pensyarah.',
 tbl:[["السهم","lima bintang kecil di antara paruh Dajājah dan Nasr Thā’ir (≈ α, β, γ, δ, ζ Sge); tak bernama Arab","Sahm"]],
 tr:[['Menyusul keduanya bintang-bintang as-Sahm (Panah), dan tidak','diberi orang Arab satu nama pun yang dikenal'],['Bintang-bintangnya samar lagi kecil','hampir tak dikenali oleh pandangan mata'],['Seakan-akan an-Nasr (elang) telah mencengkeramnya','dengan cakar-cakarnya yang melengkung, lalu bangkit terbang'],['Letaknya di tepi Bimasakti','di bawah bintang-bintang an-Nasr, menetap']],
 ck:{0:'Syarah hal. 369–370: as-Sahm = 5 bintang di antara paruh Dajājah dan Nasr Thā’ir, di jalur Bimasakti; orang Arab tidak punya nama untuk bintang-bintangnya. Yang paling terang (di mata panah) kira-kira magnitudo 3,5 — sebanding bintang uji penglihatan as-Suhā. Dua baris «كأنما النسر عليه قد قبض…» dan «موقعها في حافة المجرة…» (bait 2–3) dikutip syarah dan ada di riwayat 2 (tidak di riwayat 1).',1:'Syarah hal. 369 (dipindah dari riwayat 1): «تكاد تنكرها الأبصار» = mata nyaris luput melihatnya karena kecil dan redup cahayanya.'},

{g:'Utara',id:'r2_uqb',ok:1,ar:'العقاب',idn:'al-‘Uqāb (riwayat 2)',
 note:'Rasi Aquila, riwayat 2 (7 bait; syarah cetak 378–386 = PDF 408–416). <b>an-Nasr ath-Thā’ir</b> (Altair) = tiga bintang berbaris lurus, yang tengah terang dan dua di sisinya = «sayap» (janāḥān); disebut Thā’ir (terbang) karena sayapnya terbentang, berbeda dari an-Nasr al-Wāqi‘ (Lyra) yang sayapnya terlipat. Kaum awam menamai ketiganya <b>al-Mīzān</b> (neraca) karena yang tengah seimbang di antara dua lainnya (al-Marzūqī, Ṣūfī); nama ini tidak disebut Ṣūfī dalam urjūzahnya. Bait 4–5 riwayat ini sama dengan dua bait pengganti dari naskah kelompok ke-3 yang dicetak syarah («وخلفه كواكب كثيرة …»); riwayat 1 membaca «تتبعه كواكب كثيرة … تعرفها الأعراب بالظلمان». <b>aẓ-Ẓilmān</b> = burung unta jantan: menurut pensyarah, pada riwayat 1 istilah itu mencakup keenam bintang di luar gambar, sedangkan dalam kitab Ṣūfī hanya dua bintang kecil yang disebut «aẓ-Ẓalīmān»; Kunitzsch menduga penamaan ι & λ Aql sebagai «aẓ-Ẓalīmān» oleh Ṣūfī keliru, karena sumber lain (Ibn Qutaibah, al-Marzūqī) memaksudkan dua bintang lain (cetak 386). Bait 7 berakhir menggantung («هما»). Rinci per bait di kotak catatan pensyarah.',
 tbl:[["النسر الطائر","Altair (α Aql) dan dua bintang di sisinya","Nasr Thā’ir"],["الجناحان","β & γ Aql; «sayap» yang terbentang","Janāhān"],["الظليمان","ι & λ Aql menurut Ṣūfī; Kunitzsch meragukan (bait 7 menggantung di naskah)","Ẓalīmān"]],
 tr:[['Menyertainya bintang-bintang al-‘Uqāb (Elang)','yaitu yang dinamai oleh orang Arab'],['Dengan (nama) an-Nasr ath-Thā’ir, dan ia bintang-bintang','bercahaya, sedangkan sebagiannya redup'],['Di antaranya ada sebuah bintang bercahaya menyilaukan','dialah yang dinamai an-Nasr ath-Thā’ir (Rajawali Terbang)'],['Ia diikuti sebuah bintang, dan sebuah bintang mendahuluinya','keduanya sayapnya, sepanjang yang kami ketahui'],['Di belakangnya bintang-bintang yang banyak','keluar dari bentuk gambar ini'],['Di antaranya dua bintang bercahaya','di sebelah selatan an-Nasr, bersinar'],['Telah sampai kepada kami dari para ulama terpercaya','bahwa dua aẓ-Ẓalīm (burung unta jantan) kecil itu ialah keduanya (kalimat menggantung)']],
 ck:{2:'Syarah hal. 378–380 (dipindah dari riwayat 1): «an-Nasr ath-Thā’ir» = tiga bintang berbaris lurus (Altair dan dua bintang di sisinya); disebut Thā’ir (terbang) karena sayapnya terbentang, berbeda dari an-Nasr al-Wāqi‘ (Lyra) yang sayapnya terlipat.',3:'Syarah hal. 378, 380–383 (dipindah dari riwayat 1): kedua bintang di sisi = “sayap”. Kaum awam menamai tiga bintang itu al-Mīzān (neraca) karena berbaris lurus dan yang tengah seimbang di antara dua lainnya (al-Marzūqī, aṣ-Ṣūfī); nama ini tidak disebut aṣ-Ṣūfī dalam urjūzahnya.',4:'Syarah hal. 383–384: syarah mencetak dua bait pengganti dari naskah kelompok ke-3 («وخلفه كواكب كثيرة… / فيهن نجمان منوران…»); itulah bait 4–5 riwayat 2 ini. Riwayat 1 membaca «تتبعه كواكب كثيرة … / هنّ من النسر على تداني / تعرفها الأعراب بالظلمان».',6:'Syarah hal. 383–384, 386 (dipindah dari riwayat 1): «aẓ-Ẓilmān» = burung unta jantan; menurut pensyarah, pada riwayat 1 istilah itu mencakup keenam bintang di luar gambar, sedangkan dalam kitab aṣ-Ṣūfī hanya dua bintang kecil disebut «aẓ-Ẓalīmān». Paul Kunitzsch menduga penamaan ι & λ Aql «aẓ-Ẓalīmān» (aṣ-Ṣūfī) keliru, karena sumber lain (Ibn Qutaibah, al-Marzūqī) memaksudkan dua bintang lain (cetak 386).'},

{g:'Utara',id:'r2_dlf',ok:1,ar:'الدلفين',idn:'ad-Dulfīn (riwayat 2)',
 note:'Rasi Delphinus, riwayat 2 (7 bait; syarah cetak 392–396 = PDF 422–426). Ad-Dulfīn muncul («yanjum») setelah an-Nasr ath-Thā’ir naik di ufuk; ada 10 bintang antara Nasr Thā’ir dan Dajājah, empat yang paling terang membentuk pola khas. <b>Shalīb</b> / <b>Shalīb ath-Thā’ir</b> adalah sebutan kaum awam (Ṣūfī dan al-Marzūqī) karena dekat Nasr Thā’ir; orang Arab sendiri menamainya <b>al-Qa‘ūd</b> (unta jantan muda). Ibn Qutaibah dan al-Marzūqī: keempat bintang terbenam ketika Suhail terbit dan terbit ketika asy-Syi‘rā terbenam; cetakan Ibn Qutaibah memuat varian «al-‘Uqūd», yang lebih sahih al-Qa‘ūd. <b>‘Amūd ash-Shalīb</b> = bintang kecil yang terpisah dari keempat bintang al-Qa‘ūd, bagaikan tiang bagi salibnya (ε Del). «الكرين» (bait 7) = jamak «kurah» (bola langit): letak bintang ini di pangkal ekor Dulfīn dikenal dari gambar pada bola langit dan kitab. Rinci per bait di kotak catatan pensyarah.',
 tbl:[["القعود / الصليب","empat bintang paling terang dengan pola khas (≈ α, β, γ, δ Del)","Qa‘ūd"],["عمود الصليب","bintang kecil terpisah di pangkal ekor (ε Del)","‘Amūd"]],
 tr:[['Setelahnya ada ad-Dulfīn (Lumba-lumba), berupa bintang-bintang','semuanya tampak terbit apabila an-Nasr muncul'],['Jumlahnya sepuluh, berhimpun','bersinar dari antaranya empat bintang'],['Mereka bersinar di kegelapan bagi para pengamat','dan dinamai Shalīb ath-Thā’ir (Salib Sang Burung)'],['Orang Arab juga menamainya al-Qa‘ūd','demikian dikabarkan para perawi dan kitab-kitab'],['Di bawah al-Qa‘ūd ada sebuah bintang kecil','tetapi paling berkilau lagi terang'],['Ia dinamai ‘Amūd (tiang) bagi Shalīb an-Nasr (Salib Sang Rajawali)','demikian dikabarkan kepada kami oleh ahli kabar'],['Ia termasuk ad-Dulfīn, di pangkal ekornya','sebagaimana kaulihat pada bola-bola langit dan kitab-kitab']],
 ck:{0:'Syarah hal. 392 (dipindah dari riwayat 1): «ينجم» = terbit dan tampak; ad-Dulfīn muncul setelah an-Nasr ath-Thā’ir naik di ufuk. Ada 10 bintang di antara Nasr Thā’ir dan Dajājah; empat yang paling terang membentuk pola khas.',2:'Syarah hal. 392–394 (dipindah dari riwayat 1): «Shalīb» (Salib) / «Shalīb ath-Thā’ir» adalah sebutan kaum awam (disebut aṣ-Ṣūfī dan al-Marzūqī), karena letaknya dekat Nasr Thā’ir; orang Arab sendiri menamainya al-Qa‘ūd.',3:'Syarah hal. 395 (dipindah dari riwayat 1): al-Qa‘ūd = unta jantan muda; Ibn Qutaibah & al-Marzūqī: keempat bintang itu terbenam ketika Suhail terbit dan terbit ketika asy-Sya‘rā terbenam. Syarah mencatat varian «al-‘Uqūd» dalam cetakan Ibn Qutaibah; yang lebih sahih al-Qa‘ūd.',5:'Syarah hal. 395–396 (dipindah dari riwayat 1): «‘Amūd ash-Shalīb» = bintang kecil yang terpisah dari keempat bintang al-Qa‘ūd, bagaikan tiang bagi salibnya (ε Del).',6:'Syarah hal. 396 (dipindah dari riwayat 1): «الكرين» = jamak «kurah» (bola langit); letak bintang ini di pangkal ekor Dulfīn dikenal dari gambar pada bola langit dan kitab.'},

{g:'Utara',id:'r2_qtf',ok:1,ar:'قطعة الفرس',idn:'Qith‘at al-Faras (riwayat 2)',
 note:'Rasi Equuleus (potongan kuda), riwayat 2 (4 bait; syarah cetak 399–400 = PDF 429–430). Hanya memuat bagian kepala kuda (dari gambar Pegasus), sehingga disebut «Qith‘at al-Faras» (potongan kuda); empat bintangnya nyaris tak terlihat karena redup, seperti tulisan lama yang pudar. Baris tambahan «جملتها أربعة قد عدوا …» hanya ada di naskah Princeton 2259, tidak di riwayat 2 ini; baris «أنجمها أصغر من نجم السها / موقعها يقرب من سعد النهى» dikutip syarah dan ada di riwayat 2 (tidak di riwayat 1). Rasi ini dekat bintang terang ε Peg yang disebut Jahfalat al-Faras («bibir kuda»), nama dari letaknya pada mulut kuda, bukan nama Arab; Ṣūfī menyebut Sa‘d an-Nuhā sebagai bintang terdekat. Karena redup dan tidak termasuk bintang penunjuk maupun manzilah bulan, orang Arab tidak menamainya. Rinci per bait di kotak catatan pensyarah.',
 tbl:[["—","α,β,γ,δ Equ","tak bernama Arab"]],
 tr:[['Menyusulnya bintang-bintang kecil','samar, tak memiliki cahaya'],['Bagaikan bekas tulisan yang telah terhapus','orang Romawi mengenalnya dengan nama Qith‘at al-Faras (Potongan Kuda)'],['Bintang-bintangnya lebih kecil daripada bintang as-Suhā','letaknya dekat dengan Sa‘d an-Nuhā'],['Tidak sampai kepada kami dari orang Arab','sesuatu pun berupa nama maupun julukan tentangnya']],
 ck:{1:'Syarah hal. 399 (dipindah dari riwayat 1): rasi ini hanya memuat bagian kepala kuda (dari gambar Pegasus), sehingga disebut “potongan kuda”; empat bintangnya nyaris tak terlihat karena redup, seperti tulisan lama yang pudar. Baris tambahan «جملتها أربعة قد عدوا / من الظلام لا تكاد تبدو» hanya ada di naskah Princeton 2259 — tidak ada di riwayat 2 ini.',2:'Syarah hal. 399–400: baris «أنجمها أصغر من نجم السها / موقعها يقرب من سعد النهى» dikutip syarah dan ada di riwayat 2 (tidak di riwayat 1). Rasi ini dekat bintang terang ε Peg yang disebut Jahfalat al-Faras (“bibir kuda”) — nama itu dari letaknya pada mulut kuda, bukan nama Arab; al-Ṣūfī menyebut Sa‘d an-Nuhā sebagai bintang terdekat.',3:'Syarah hal. 399–400 (dipindah dari riwayat 1): karena redup dan tidak termasuk bintang penunjuk maupun manzilah bulan, orang Arab tidak menamainya.'},

{g:'Utara',id:'r2_frs',ok:1,ar:'الفرس الأعظم',idn:'al-Faras al-A‘zham (riwayat 2)',
 note:'Rasi Pegasus, riwayat 2 (20 bait; syarah cetak 406–424 = PDF 436–454). Hanya separuh depan kuda bersayap: dua kaki belakang, <b>al-‘Asīb</b>, <b>al-Qathāh</b>, dan <b>al-Kafal</b> tidak ada pada gambarnya. Syatr 2 bait 4 di riwayat ini berbunyi «يبدو من الشرق إذا الليث أفل»; syarah mencatat varian «يبدو من الشرق/الغرب إذا الليث استقل» dan naskah Munich «يربو من الليث إذا الليث استقل» («yarbū» = napas terengah karena takut). Dua bintang di kepala (bait 6): <b>Sa‘d al-Buhām</b> (bukan Sa‘d al-Hammām) dan <b>an-Nuhā</b>; Ibn Qutaibah dan al-Marzūqī tidak menyebut Sa‘d an-Nuhā. <b>al-Jahfalah</b> («bibir kuda», bait 7) bukan nama Arab asli. Dua bintang di leher (bait 8–10; «al-ma‘rifah» = tempat tumbuh bulu leher, «aṭ-ṭirf» = kuda mulia): menurut Arab Yaman <b>Sa‘d al-Hammām</b>, bintang ke-11 dan ke-12 menurut Ṣūfī. Dua bintang gelap di «labān» (dada kuda; bait 11–12) = <b>Sa‘d Bāri‘</b>, dekat salah satu bintang terang al-Farg al-Muqaddam. <b>Sa‘d Muthar</b> (bait 13–14) = dua bintang pada lutut kanan, satu hampir tak terlihat dan satunya dekat dan bercahaya seperti bara. «Ad-Dalw» (bait 15–16) BUKAN burung Dalw (Aquarius), melainkan ad-Dalw Arab = persegi besar empat bintang yang dinamai Farg pertama/kedua dan ‘Arqūwah atas/bawah; <b>al-Farghān</b> = dua dari empatnya, <b>Nāhiz ad-Dalw</b>/al-‘Arqūwah nama lain. Dua baris tentang Baladat ath-Tha‘lab (bait 17–18) hanya ada di riwayat 2. <b>al-Karb</b> (bait 19–20) = tali yang melilit kedua ‘arqūwah dan tersambung ke tali timba; dua bintang tengah (τ, υ) juga disebut an-Na‘ām; «markil» = tempat penunggang menendangkan kaki ke badan kuda. Rinci per bait di kotak catatan pensyarah.',
 tbl:[["الفرغ المقدم","Markab α & Scheat β Peg","Farg 1"],["الفرغ المؤخر","Algenib γ Peg & Alpheratz α And","Farg 2"],["سعد البهام","θ & ν Peg","Sa‘d Buhām"],["سعد النهى","Enif ε Peg (usulan)","Sa‘d Nuhā"],["سعد الهمام","ζ & ξ Peg","Hammām"],["سعد البارع","λ & μ Peg","Bāri‘"],["سعد مطر","η & ο Peg","Muthar"],["الكرب / النعام","τ & υ Peg","Karab"],["بلدة الثعلب","ruang kosong","Baladah"],["الجحفلة","bintang di atas dua bintang kepala (bait 7; dari matan)","Jahfalah"],["العسيب / القطاة / الكفل","bagian tubuh kuda: ekor, pinggul, bokong (bait 4; dari matan)","‘Asīb"]],
 tr:[['Menyusul mereka sebuah rupa yang dinamai al-Faras (Kuda)','bintang-bintang yang kebanyakannya bagaikan bara api'],['Para ahli hikmah Romawi telah menyerupakannya','dengan seekor kuda berperawakan agung'],['Ia bersayap dan memiliki dua kaki depan','dua kaki belakang kurang dari wujudnya'],['Bersama ‘asīb (pangkal ekor), qathāh (punggung bawah), dan kafal (bokong)','tampak dari timur apabila Singa telah terbenam'],['Di atas kepalanya engkau lihat dua bintang','jarak keduanya kira-kira dua jengkal'],['Keduanya dinamai Sa‘d al-Buhām dan an-Nuhā','sebagaimana dikabarkan oleh orang yang berilmu lagi berakal'],['Di atas keduanya ada sebuah bintang bernama al-Jahfalah','yang bersinar di angkasa bagi yang memperhatikannya'],['Di antara keduanya ada dua bintang lain','di antara keduanya dua jengkal, keduanya terang'],['Keduanya berada pada ma‘rafah sang kuda mulia','kabar dari orang yang tak diragukan pengetahuannya'],['Bahwa di kalangan orang Arab pedalaman Yaman','keduanya dijuluki Sa‘d al-Hammām, maka ketahuilah'],['Terbit setelah keduanya dua bintang','di dada sang kuda, gelap'],['Orang Arab menamai keduanya Sa‘d Bāri‘','di dekat sebuah bintang terang lagi cemerlang'],['Terbit setelah keduanya Sa‘d Muthar','sebuah bintang yang karena kecilnya lolos dari pandangan mata'],['Dan sebuah bintang di dekatnya bagaikan bara','keduanya terletak pada lutut kuda ini'],['Pada rupa sang kuda ada empat bintang','yang engkau lihat berbentuk persegi yang lapang'],['Dikenal dengan nama al-Farghain di kalangan orang Arab','dan Nāhiz ad-Dalw juga julukan baginya'],['Di antara keduanya dan bintang-bintang al-Hūt ada ruang lapang','dinampakkan oleh ufuk apabila al-Farg bersinar'],['Dikenal oleh para ahli bintang dan adab','di Baladat ats-Tsa‘lab (Negeri Rubah), orang Arab menamainya'],['Di tengah al-Farghain ada dua bintang','keduanya pada marakil (tempat tendangan) sang kuda jantan'],['Sebagian perawi dari orang Arab mengabarkan','bahwa keduanya dinamai al-Karab']],
 ck:{3:'Syarah hal. 406–409: pada riwayat 2 baris ini berbunyi «يبدو من الشرق إذا الليث أفل»; syarah mencatat varian «يبدو من الشرق/الغرب إذا الليث استقل» (riwayat 1 / naskah Munich: «يربو من الليث إذا الليث استقل», «يربو» = napas terengah karena takut). Syarah juga mencatat rasi ini hanya separuh depan kuda: dua kaki belakang, ‘asīb, qathāh, dan kafal tidak ada pada gambarnya.',5:'Syarah hal. 409–410: syarah mengutip bait ini dengan lafal «قد سميا سعد البهام والنهى / كما حكاه ذو علوم ونهى» — sama dengan riwayat 2 ini. Nama dua bintang kepala = Sa‘d al-Buhām/al-Bahā’im (bukan Sa‘d al-Hammām); Ibn Qutaibah dan al-Marzūqī tidak menyebut Sa‘d an-Nuhā.',6:'Syarah hal. 414: al-Jahfalah («bibir kuda») bukan nama Arab asli.',8:'Syarah hal. 415–416 (dipindah dari riwayat 1): «المعرفة» = tempat tumbuh bulu leher kuda; «الطِرف» = kuda mulia. Maksudnya: dua bintang ini pada leher sang kuda.',9:'Syarah hal. 416 (dipindah dari riwayat 1): nama keduanya di sisi Arab ialah Sa‘d al-Hammām (bukan al-Buhām); al-Ṣūfī menyebutnya bintang ke-11 dan ke-12, di leher.',11:'Syarah hal. 416 (dipindah dari riwayat 1): «لَبان» = dada kuda; dua bintang ini dekat salah satu bintang terang Farg al-Muqaddam.',12:'Syarah hal. 416–417 (dipindah dari riwayat 1): Sa‘d Muthar = dua bintang pada lutut kanan kuda; satu redup nyaris tak terlihat, satunya dekat dan bercahaya seperti bara.',14:'Syarah hal. 413 dan 417 (dipindah dari riwayat 1): «الدلو» di sini BUKAN burung Dalw (Aquarius), melainkan «ad-Dalw» Arab = persegi besar empat bintang; keempat bintangnya dinamai Farg pertama/kedua dan ‘Arqūwah atas/bawah.',15:'Syarah hal. 417–423: al-Farghān = dua bintang dari empat penyusun ad-Dalw; Nāhiz ad-Dalw/al-‘Arqūwah juga nama lain. Syarah mengutip dua baris tentang Baladat ath-Tha‘lab «يبرزه الأفق إذا الفرغ أضا / بينهما وأنجم الحوت فضا // ببلدة الثعلب تدعوه العرب / يعرفها أهل النجوم والأدب» — itulah bait 17–18 riwayat 2 (tidak di riwayat 1).',19:'Syarah hal. 424 (dipindah dari riwayat 1): «الكَرَب» = tali yang melilit kedua ‘arqūwah dan tersambung ke tali timba; dua bintang di tengah (τ, υ) juga disebut an-Na‘ām. «مَرْكَل» = tempat penunggang menendangkan kakinya ke badan kuda.'},

{g:'Utara',id:'r2_msl',ok:1,ar:'المسلسلة',idn:'al-Musalsalah (riwayat 2)',
 note:'Rasi Andromeda (perempuan yang dirantai), riwayat 2 (8 bait; syarah cetak 430–442 = PDF 460–472). «Al-Faras ats-Tsānī» (bait 1) = Pegasus besar (bukan Qith‘at al-Faras); al-Farg al-Mu’akhkhar milik bersama Pegasus dan Musalsalah. <b>ar-Rasyā’</b> = tali timba, dinamai demikian karena dekat al-Farghain dan al-Karab; baris tambahan «من النجوم النيرات الزهر / وهو من المرأة شكل الخصر», dikutip syarah, ada di riwayat 2 (bait 2) dan tidak di riwayat 1. <b>Bathn al-Hūt</b> = ar-Risyā’ (juga «Qalb al-Hūt»; manzilah terakhir). Menurut Ibn Qutaibah dan al-Marzūqī, as-Samakah/al-Hūt adalah banyak bintang, bukan satu; bintang terang di dalamnya = perut/jantung ikan. «Ikan Arab» menurut Ṣūfī = dua baris bintang berbentuk ikan besar, sebagian dari Musalsalah, sebagian dari ikan utara rasi Hūt. <b>al-‘Anāq</b> = anak kambing betina, sedangkan «‘Anāq al-Ardh» = karakal; keduanya bukan satu nama bagi satu bintang. Ṣūfī tidak menemukan penamaan ini dari orang Arab; Ibn Qutaibah dan al-Marzūqī menyebut ‘Anāq al-Ardh untuk dua bintang (satu di sini, satu di Ra’s al-Ghūl) dan berbeda dalam menentukannya; syarah menilai penyair keliru memahami ucapan Ṣūfī bila menjadikan keduanya dua nama bagi satu bintang. <b>Andrāmīdzā</b> = nama Yunani rasi ini, al-Musalsalah nama Arabnya. Rinci per bait di kotak catatan pensyarah.',
 tbl:[["الرشا / بطن الحوت","bintang terang pada tali al-Hūt = perut/jantung ikan (Bathn/Qalb al-Hūt), manzilah ke-28 (matan bait 4–5; syarah hal. 430–437); ≈ β And (Mirach) — identifikasi dari tabel lama, bukan dari syarah","Risyā’"],["عناق الأرض","bukan satu nama bagi satu bintang; Ibn Qutaibah/al-Marzūqī: dua bintang (satu di sini, satu di Ra’s al-Ghūl)","‘Unāq"],["أندراميذا","nama Yunani rasi ini (bait 8)","Andrāmīdzā"]],
 tr:[['Menyusulnya bintang-bintang al-Musalsalah (Perempuan Terantai)','semuanya bintang yang saling bersambung'],['Dengan al-Faras ats-Tsānī (Kuda Kedua), dan di antaranya sebuah bintang','bercahaya, dijuluki «ar-Risyā’» (tali timba)'],['Dari bintang-bintang yang terang lagi gemerlap','ia bagian dari bentuk pinggang sang perempuan'],['Ia, ketahuilah, adalah manzilah yang terakhir','demikian pula kami kabarkan dari para pendahulu'],['Dialah yang dinamai Bathn al-Hūt (Perut Ikan)','sebagai pengetahuan yang pasti, tanpa kusimpangkan'],['Ada pula sebuah bintang darinya di bawah betis','yang dikenal orang Arab dengan nama al-‘Anāq'],['Ia juga dinamai ‘Anāq al-Ardh','demikian diriwayatkan sebagian mereka dari sebagian lainnya'],['Dan Andrumīdā bagi rupa ini','adalah nama yang telah masyhur baginya']],
 ck:{1:'Syarah hal. 430: «الفرس الثاني» = Pegasus besar (bukan Qith‘at al-Faras); Farg al-Mu’akhkhar menjadi milik bersama Pegasus dan Musalsalah. «الرشا» = tali timba; dinamai demikian karena dekat al-Farghain dan al-Karab. Syarah mengutip baris tambahan «من النجوم النيرات الزهر / وهو من المرأة شكل الخصر» — baris ini ada di riwayat 2 (bait 2), tidak di riwayat 1.',4:'Syarah hal. 430–437 (dipindah dari riwayat 1): «بطن الحوت» = ar-Risyā’ (juga «قلب الحوت»). Menurut Ibn Qutaibah dan al-Marzūqī, as-Samakah/al-Hūt adalah banyak bintang, bukan satu; bintang terang di dalamnya itulah perut/jantung ikan. «Ikan Arab» menurut al-Ṣūfī = dua baris bintang berbentuk ikan besar, sebagian dari Musalsalah, sebagian dari ikan utara rasi Hūt.',6:'Syarah hal. 437–438 (dipindah dari riwayat 1): «العَناق» = anak kambing betina; «عناق الأرض» = karakal (hewan), dan keduanya bukan satu nama bagi satu bintang. Al-Ṣūfī tidak menemukan penamaan ini dari orang Arab; Ibn Qutaibah dan al-Marzūqī menyebut ‘Anāq al-Ardh untuk dua bintang (satu di sini, satu di Ra’s al-Ghūl) dan berbeda dalam menentukannya. Syarah menilai penyair keliru memahami ucapan al-Ṣūfī bila menjadikan keduanya dua nama bagi satu bintang.',7:'Syarah hal. 442 (dipindah dari riwayat 1): «أندروميدا» = nama Yunani bagi rasi ini; al-Musalsalah adalah nama Arabnya.'},

{g:'Utara',id:'r2_mth',ok:1,ar:'المثلث',idn:'al-Mutsallats (riwayat 2)',
 note:'Rasi Triangulum (segitiga), riwayat 2 (5 bait; syarah cetak 456–459 = PDF 486–489). Rasi kecil yang terbit tak lama setelah al-‘Anāq (‘Anāq al-Ardh), sejajar dengan al-Kabsy (Hamal/Aries; bait 1). Empat bintang: dua terang (an-nayyirān) disebut <b>al-Unaisān</b>, dua gelap; nama dua yang kecil tidak diketahui penyair. Naskah Istanbul membaca «الأبيسان» (tashhif), sedangkan Vatikan Ross 1033, Museum Seni Islam, dan Ibn Qutaibah «الأنيسان»; pensyarah menguatkan «الأنيسان» (bait 4). Menurut Ṣūfī, bangsa Arab menamai al-Unaisān dua bintang terang: yang pertama di atas kepala (segitiga) dan yang kedua di utaranya, dari tiga bintang pada alas. Dengan al-Mutsallats berakhirlah rasi-rasi utara — 21 rasi, dimulai dari ad-Dubb al-Ashghar. Rinci per bait di kotak catatan pensyarah.',
 tbl:[["الأنيسان","dua bintang terang: di atas kepala segitiga dan di utaranya (≈ α & β Tri, identifikasi lama)","Unaisān"]],
 tr:[['Sesudahnya kembalilah ke al-Mutsallats (Segitiga)','begitu al-‘Anāq terbit, ia tak berselang lama'],['Sejajar dengan bintang al-Kabsy (Domba), carilah tempat terbitnya','bintangnya, bila dihitung, ada empat'],['Dua bintang dari itu bercahaya terang','dan dua sisanya gelap'],['Maka al-Unaisān adalah nama bagi dua yang paling terang','dan aku tak tahu nama dua yang lebih kecil'],['Maka telah berlalu bintang-bintang utara','terurai dalam ucapan yang paling ringkas']],
 ck:{0:'Syarah hal. 456 (dipindah dari riwayat 1): al-Mutsallats rasi kecil yang terbit tak lama setelah al-‘Anāq (‘Anāq al-Ardh), sejajar dengan al-Kabsy, yaitu rasi Hamal (Aries).',3:'Syarah hal. 456–459 dan nota kaki 2: naskah Istanbul membaca «الأبيسان» (tashhif), sedangkan Vatikan Ross 1033, Museum Seni Islam, dan Ibn Qutaibah «الأنيسان»; pensyarah menguatkan «الأنيسان». Menurut al-Ṣūfī, bangsa Arab menamai al-Unaisān dua bintang terang: yang pertama di atas kepala (segitiga) dan yang kedua di utaranya, dari tiga bintang pada alas.',4:'Syarah hal. 459 (dipindah dari riwayat 1): dengan al-Mutsallats berakhirlah rasi-rasi utara — 21 rasi, dimulai dari ad-Dubb al-Ashghar.'},

{g:'Manāzil',id:'r2_akh',ok:1,ar:'كواكب الأخذ',idn:'Kawākib al-Akhdz — Manāzil al-Qamar (riwayat 2)',
 note:'Daftar <b>28 manzilah bulan</b> menurut urutan matan (bulan «mengambil» satu manzilah tiap malam — dari itu «al-Akhdz»; bersembunyi satu malam bila bulan 29 hari, dua malam bila 30): 1 asy-Syarathān, 2 al-Buthain, 3 ats-Tsurayyā, 4 ad-Dabarān, 5 al-Haq‘ah, 6 al-Han‘ah, 7 adz-Dzirā‘, 8 an-Natsrah, 9 ath-Tharf, 10 al-Jabhah, 11 az-Zubrah, 12 ash-Sharfah, 13 al-‘Awwā’, 14 as-Simāk (al-A‘zal), 15 al-Ghafr, 16 az-Zubānā, 17 al-Iklīl, 18 al-Qalb, 19 asy-Syaulah, 20 an-Na‘ā’im, 21 al-Baldah, 22 adz-Dzābih, 23 Bula‘, 24 Sa‘d as-Su‘ūd, 25 Sa‘d al-Akhbiyah, 26–27 al-Farghān (muqaddam dan mu’akhkhar), 28 ar-Risyā’. Syarah (hal. 466–467): bait manāzil ini ada di tujuh naskah (kelompok ke-3 dan ke-4, pemuat riwayat 2); penyair meniru ayahnya (aṣ-Ṣūfī) dalam Ṣuwar al-Kawākib setelah 21 rasi utara. Bait 13 «بالعشا» dipilih pensyarah (bukan «والشتا»): al-Farghān terbit petang di musim gugur. Identifikasi modern tiap manzilah ada di bagian rasi masing-masing (lihat tabel). Bait 4 dikoreksi menjadi «المحيّا» (bagaikan raja yang diberi salam penghormatan). Keraguan arti hanya tersisa pada bait 7 «قد أرن الجوا» (⚠ di terjemah; bacaan lafal sudah dicek pada matan cetak 90 dan syarah cetak 465).',
 tbl:[['1–4 الشرطان، البطين، الثريا، الدبران','lihat Hamal dan Tsaur','Syarathān … Dabarān'],['5–6 الهقعة، الهنعة','lihat Jabbār (Haq‘ah) dan Tau’amān (Han‘ah)','Haq‘ah, Han‘ah'],['7 الذراع','lihat Tau’amān (Dzirā‘ janūbiyyah)','Dzirā‘'],['8–9 النثرة، الطرف','lihat Saratān','Natsrah, Tharf'],['10–12 الجبهة، الزبرة، الصرفة','lihat Asad','Jabhah, Zubrah, Sharfah'],['13–15 العوّاء، السماك، الغفر','lihat ‘Adzrā’','‘Awwā’, Simāk, Ghafr'],['16–19 الزبانا، الإكليل، القلب، الشولة','lihat Mīzān dan Aqrab','Zubānā … Syaulah'],['20–21 النعائم، البلدة','lihat Qaws','Na‘ā’im, Baldah'],['22–25 الذابح، بلع، السعود، الأخبية','lihat Jadyy dan Dalw','Dzābiḥ … Akhbiyah'],['26–28 الفرغان، الرشاء','lihat Faras A‘ẓam dan Hūt','Farghān, Risyā’']],
 tr:[['Marilah sekarang kita sebutkan secara berurutan','bintang-bintang dari rupa-rupa buruj (zodiak)'],['Di dalamnya digiring bintang-bintang al-Akhdz','tanpa meninggalkan satu bintang pun atau membuangnya'],['Itulah yang disebut manzilah-manzilah bulan','yang pertama kali dicatat dan disebut di antaranya'],['asy-Syarath, al-Buthain, dan ats-Tsurayyā','yang di antara keduanya bagaikan raja yang diberi salam penghormatan (al-muḥayyā)'],['ad-Dabarān sesudahnya, lalu al-Haq‘ah','dan dua bintang yang dinamai al-Han‘ah'],['Kemudian adz-Dzirā‘ sesudahnya, an-Natsrah','ath-Tharf, al-Jabhah, lalu az-Zubrah'],['dan ash-Sharfah yang cemerlang, lalu al-‘Awwā’','yaitu bintang-bintang yang (tampaknya) menyemarakkan angkasa (⚠ «قد أرن الجوا», arti belum pasti; lihat catatan bacaan)'],['Menyusulnya al-A‘zal, kemudian al-Ghafr','bintang-bintang yang cahayanya kekuningan'],['Kemudian az-Zubānā, mendahului al-Iklīl','dan al-Qalb yang menyerupai pedang yang mengilap'],['Dan asy-Syaulah pada rupanya, dan an-Na‘ā’im','yang menyerupainya, an-Na‘ā’im, berupa kaki-kaki'],['Setelahnya al-Baldah, kemudian adz-Dzābih','dan Bula‘ tampak sesudah mereka'],['Setelahnya terbit Sa‘d as-Su‘ūd','dan Dzū al-Akhbiyah (Dzū al-Khibā’), bintang-bintang gemerlap'],['Dan bintang-bintang al-Farghain mendahului ar-Risyā’','terbit pada musim gugur di waktu petang'],['Telah berlalu (semuanya) tergambar keadaannya','dalam rupa-rupa utara yang telah lalu'],['Dan manzilah-manzilah sisanya ini','akan dijelaskan kemudian secara berurutan']],
 ck:{0:'Syarah hal. 467: setelah menjelaskan 21 rasi utara, penyair beralih ke kelompok bintang yang merupakan 12 rasi buruj, meniru ayahnya (aṣ-Ṣūfī) dalam kitab Ṣuwar al-Kawākib; bait-bait manāzil al-qamar ini ada di tujuh naskah (kelompok ke-3 dan ke-4, yang memuat riwayat 2), hal. 466.',1:'Syarah hal. 467–468: «nujūm al-akhdz» = manāzil al-qamar (28 manzilah; bulan turun satu manzilah tiap malam, bersembunyi satu malam bila bulan 29 hari, dua malam bila 30). Dinamai al-Akhdz karena bulan «mengambil» satu manzilah tiap malam (Ibn Qutaibah, al-Marzūqī, Abū ‘Ubaidah; Abū ‘Amr asy-Syaibānī: al-akhdz = nuzūl al-qamar). Orang Arab sering menyebut sebuah manzilah dengan kata «najm» tunggal (mis. najm al-‘awwā’, padahal lima bintang) karena ia satu manzilah.',12:'Syarah hal. 466: pensyarah memilih «بالعشا» (kelompok ke-4) dan bukan «والشتا» (kelompok ke-3): bintang al-Farghain terbit petang di musim gugur dan terbit fajar di musim semi, tidak terbit di musim dingin, baik fajar maupun petang; para penyalin menyalahbaca «العشا» menjadi «الشتا».'},

 gl:{0:'Cetak 465 (PDF 495, 100 dpi): syarah mencetak seluruh bait manāzil ini dengan urutan sama (16 baris; baris pertama «فقد مضت كواكب الشمال» = bait terakhir `r2_mth`).',3:'«ما بينهما كالملك المحيّا» — KOREKSI bacaan: lama «المحتيا» (salah baca); dicek 400–1200 dpi pada matan riwayat 2 (cetak 90 = PDF 120) dan matan yang dicetak syarah (cetak 465 = PDF 495): terbaca «المُحَيَّا» (yā’ bersyiddah, tanpa tā’), isim maf‘ūl dari ḥayyā («disambut dengan salam/tahiyyah»); «كالملك المحيّا» = bagaikan raja yang dihormati dengan salam. Syarah tidak menjelaskan kata ini (terjemah ini dari bacaan matan).',6:'«قد أرن الجوا» dicek 400–1200 dpi pada matan riwayat 2 (cetak 90 = PDF 120) dan matan cetak syarah (cetak 465): terbaca «أرن» (rā’ tanpa titik, bukan «أزن»); arti belum dijelaskan syarah — tanda ⚠ arti dipertahankan. Dugaan leksikal (BUKAN dari syarah, belum diverifikasi ke kamus): «أرِنَ» = bersemangat/riang, sehingga «أرن الجوّ» ≈ «meriangkan/menyemarakkan langit» (cocok dengan bait 12 «لوامع», 6 «الزهراء»); alternatif «أرَنَ/آرَنَ» belum bisa dikonfirmasi.'}},
{g:'Burūj',id:'r2_ham',ok:1,ar:'الحمل',idn:'Hamal (riwayat 2)',
 note:'Rasi Aries (Hamal) — burj pertama; terbit ketika bintang al-Ghafr (manzilah ke-15) terbenam; al-Ghafr adalah raqīb bagi asy-Syarathān. <b>13 bintang</b> («ثلاثة وعشره») membentuk gambar, ditambah 5 di luar gambar; domba digambarkan berlari sambil menoleh ke belakang. Bintang paling terang ditempatkan Hipparkhos di moncong (al-khathm). <b>asy-Syarathān</b> (manzilah ke-1; juga an-Nath‘, an-Nāthih, al-Asyrāṭ) — pensyarah menguatkan: an-Nāthih (bintang di luar gambar) dan bintang ke-2; al-Asyrāṭ terjadi dengan menambah bintang ke-1 (sejalan Ibn Qutaibah dan al-Marzūqī). Syarah mencetak bait 8 «بالشرطين», sedangkan semua naskah membaca «بإنسانين» (seperti riwayat 2): Ṣūfī tidak mengenal nama al-Insānān. <b>al-Buthain</b> (manzilah ke-2) = tiga bintang samar pada perut Hamal Arab (seperti titik huruf ثاء menurut al-Marzūqī, di antara asy-Syarathān dan ats-Tsurayyā); Ṣūfī menyalahkan penulis Anwā’ karena Hamal Yunani berbeda — Hamal Arab membentang dari asy-Syarathān di tanduk hingga ats-Tsurayyā di ekor, sedangkan Yunani menaruh Tsurayyā di punggung Tsaur. Bintang samar di luar gambar (empat bintang di belakang an-Nāthih; tiga terangnya = al-Buthain menurut Anwā’) dinamai matan «<b>Rijl al-Ghūl</b>»; nama itu tidak ditemukan dalam riwayat Arab maupun Ṣūfī dan dalam gambar Yunani al-Ghūl tidak berkaki (mungkin perajaz keliru). Rinci per bait di kotak catatan pensyarah.',
 tbl:[['الشرطان / الناطح / الأشراط','dua bintang di tanduk (α, β Ari); manzilah ke-1','Syarathān'],['البطين','tiga bintang samar di perut Hamal (ε, δ, ρ Ari menurut kebiasaan); manzilah ke-2','Buthain'],['رجل الغول','empat bintang di luar gambar di belakang an-Nāthih (nama dipertanyakan)','Rijl al-Ghūl']],
 tr:[['Maka kembalilah kita sekarang pada penyebutan al-Hamal,','bintang-bintang yang tampak apabila al-Ghafr telah terbenam'],['Seakan-akan sang penjual mengikuti jejaknya;','bintang-bintangnya ada tiga belas'],['Mengikutinya sebuah bintang berukuran besar','yang oleh Barkhus dijadikan (terletak) pada bentuk moncong'],['Ia menyusul sebuah bintang dari bintang-bintang al-Hamal','cahayanya di bawah cahaya yang pertama'],['Orang Arab menamai keduanya asy-Syarathān,','dan yang paling terang dari keduanya kadang dijuluki'],['dengan an-Nāthih; dan di antara mereka ada yang menyertakan','sebuah bintang pada kedua tanduk yang bersinar dari sisinya'],['pada asy-Syarathān, maka engkau menamai (ketiganya) ketika itu','an-Nath‘ dan al-Asyrāṭ juga — ketahuilah'],['Dan kadang dua yang paling terang darinya disebut','al-Insānain — maka ketahuilah, dan riwayatkanlah tentangnya'],['Mengikuti mereka bintang-bintang al-Buthain,','tiga bintang yang luput dari tangkapan mata'],['Samar mereka, di perut al-Hamal,','seakan bersembunyi karena malu'],['Dan di atas mereka bintang-bintang kecil','yang dikeluarkan dari bintang-bintang rasi ini'],['Disebut Rijl al-Ghūl (Kaki Hantu) di kalangan orang Arab,','dan mereka dekat dengan Birsyāwisy']],
 ck:{0:'Syarah hal. 480 mencetak pembuka yang berbeda («فلنذكر الآن على التدريج كواكب تعرف بالبروج»); yang dibahas ialah baris sesudahnya «أولها الكبش الذي يدعى الحمل / يبدو من الأفق إذا الغفر أفل». Al-Hamal adalah burj pertama; ia mulai terbit ketika bintang-bintang al-Ghafr (milik Sunbulah, manzilah ke-15) terbenam. Al-Ghafr adalah raqīb (pasangan yang terbenam saat ia terbit) bagi asy-Syarathān, dan terbitnya asy-Syarathān menjadi awal terbitnya al-Hamal. Pembuka riwayat 2 («فلنعد الآن إلى ذكر الحمل») diterjemah dari matan.',1:'Syarah hal. 483–484: «ثلاثة وعشره» = 13 bintang yang membentuk gambar al-Hamal; kelompok ini memuat pula 5 bintang di luar gambar. Domba digambarkan berlari sambil menoleh ke belakang, seakan penjualnya mengejar dari belakang.',2:'Syarah hal. 484 mencetak «بينها نجم عظيم الجرم» (bukan «يتبعها»): bintang besar itu ialah yang paling terang di antara bintang-bintang al-Hamal dan yang oleh Barkhus (Hipparkhos, ahli falak Yunani abad ke-2 SM) ditempatkan pada moncong (al-khathm = bagian depan hidung dan mulut hewan), sebagaimana diriwayatkan Ptolemeus darinya.',3:'Syarah hal. 484 mencetak «يتبع نجماً من نجوم الحمل» (sama dengan riwayat 2) dan menjelaskan bahwa bintang terang di luar gambar (an-Nāthih) disusul bintang kedua dari bintang-bintang al-Hamal yang lebih terang dari yang pertama; dua bintang terang inilah yang dinamai Arab asy-Syarathān.',4:'Syarah hal. 486–488: pendapat tentang asy-Syarathān dan al-Asyrāṭ berbeda. (1) an-Nāthih (bintang luar gambar) dan bintang ke-2 = asy-Syarathān, ditambah bintang ke-1 = al-Asyrāṭ; (2) bintang ke-2 dan ke-1 = asy-Syarathān, ditambah bintang ke-5 = al-Asyrāṭ. Pensyarah menguatkan pendapat pertama: an-Nāthih dan bintang ke-2 itulah asy-Syarathān (sejalan dengan Ibn Qutaibah dan al-Marzūqī), sedangkan al-Asyrāṭ terjadi dengan menambahkan bintang ke-1, karena jelas terlihat di langit dan letaknya hampir di kawasan yang sama dengan pendapat-pendapat lain. Ibn Qutaibah: asy-Syarathān dua bintang yang disebut juga an-Nath‘, an-Nāthih, an-Nathīh, berjarak sekitar sebusur (qāb qaws) menurut pandangan mata; al-Marzūqī: sekitar sehasta, dan ada bintang kecil di sisi utara salah satunya sehingga ia dinamai al-Asyrāṭ; kata al-Marzūqī, dari orang Arab diriwayatkan pula «شَرْط» (sukun).',7:'Syarah hal. 487 mencetak bait ini «وقد تسمي الأنورين منها / فاعلم بالشرطين فاحك عنها», tetapi menegaskan bahwa di semua naskah tertulis «بإنسانين» (seperti riwayat 2). Ṣūfī dan pengarang lain tidak mengetahui bahwa orang Arab menamai bintang-bintang ini al-Insānān; yang diriwayatkan Ṣūfī: dua bintang terang di tanduk disebut asy-Syarathān.',8:'Syarah hal. 489–492: al-Buthain = tiga bintang samar pada perut al-Hamal (manzilah ke-2). Ṣūfī memilih tiga bintang di paha dan ekor (al-alyah) al-Hamal Yunani dan menyalahkan penulis kitab-kitab Anwā’ yang menjadikan al-Buthain tiga bintang terang dari empat bintang di luar gambar di belakang an-Nāthih. Pensyarah: tuduhan itu keliru tempat, sebab al-Hamal Arab berbeda dengan al-Hamal Yunani: Hamal Arab membentang dari asy-Syarathān di tanduk hingga ats-Tsurayyā di ekor, sedangkan orang Yunani menaruh ats-Tsurayyā di punggung Tsaur. Tiga bintang samar yang dilukiskan al-Marzūqī seperti titik-titik huruf ثاء di tengah antara asy-Syarathān dan ats-Tsurayyā lebih mungkin benar, dan bintang-bintang pilihan Ṣūfī saling berjauhan.',10:'Syarah hal. 493: bintang-bintang samar ini bukan bagian gambar al-Hamal, melainkan empat bintang di belakang an-Nāthih (di luar gambar); tiga yang terang dari keempatnya adalah al-Buthain menurut kitab-kitab Anwā’.',11:'Syarah hal. 493: nama «Rijl al-Ghūl» tidak ditemukan dalam riwayat Arab dan tidak disebut Ṣūfī; dalam gambar Yunani al-Ghūl tidak berkaki, yang ada ialah Birsyāwisy pembawa kepala al-Ghūl yang terpenggal. Mungkin perajaz keliru, karena Ṣūfī mengatakan bintang-bintang ini dekat bahu ats-Tsurayyā, yaitu bintang pada kaki pemegang kepala al-Ghūl.'},

 gl:{2:'Syarah hal. 484 mencetak «بُرخسُ» (Hipparkhos), cocok dengan bacaan ini.',7:'Riwayat 1 membaca «وقد تسمي… واحك»; syarah hal. 487 menyebut «فاحك عنها» dan «بإنسانين» di semua naskah (sesuai riwayat 2).',11:'Riwayat 1 membaca «العزب» / «بالقرب»; riwayat 2 «العُرْب» / «بالقُرْب».'}},
{g:'Burūj',id:'r2_tsr',ok:1,ar:'الثور',idn:'Tsaur (riwayat 2)',
 note:'Rasi Taurus; 17 bait (4 di hal. 121, 13 di hal. 122). Gugusan di <i>ghārib</i> (bagian depan punuk, <i>sanām</i>) banteng. Bangsa Rum menjadikannya punuk Tsaur; orang Arab menempatkannya di <i>alyah</i> (ekor gemuk) Hamal Arab, berbeda dengan Yunani. <b>ats-Tsurayyā</b> (Pleiades; «an-Najm» tanpa sandaran; tashghīr dari tsarwah, kelimpahan; enam bintang tampak; Ṣūfī: bintang ke-29–32 rasi ini) = manzilah ke-3, awal manāzil karena terbit fajarnya menandai awal musim panas. <b>ad-Dabarān</b> (Aldebaran, α Tau; bintang ke-14 di mata selatan banteng; manzilah ke-4) — dari «dubūr»: membelakangi/mengikuti Tsurayyā; juga <b>al-Fanīq</b> (pejantan unta), <b>al-Mijdah</b> (tongkat bercabang tiga), <b>Tābi‘/Tālī an-Najm</b>, <b>al-Ḥādī</b> (penggiring unta), dan <b>at-Tawbī‘</b> (al-Azharī). <b>al-Qilāsh</b> = bintang-bintang kecil «unta betina muda» di antaranya dan Tsurayyā. <b>ad-Dayqah</b> = dua bintang berdekatan yang mendahului ad-Dabarān (jarak ≈ diameter Bulan); juga nama celah antara Tsurayyā dan Dabarān yang dihindari Bulan; Ṣūfī menyebut dua bintang di telinga utara banteng (ke-21, 22) al-Kalbān. Orang Arab jahiliah menganggap nau’ ad-Dabarān sial (tiga malam); Islam membatalkan khurafat itu. Rinci per bait di kotak catatan pensyarah. Riwayat 2 memuat baris tambahan (ad-Dayqah, al-Kalbān, al-Qilāsh) yang dikutip syarah hal. 503–514; teks matan menyebut ats-Tsurayyā sebagai «jubah/punuk» (sanām) pada gambar Romawi.',
 tbl:[['الثريا','Pleiades (M45); manzilah ke-3','Tsurayyā'],['الدبران','Aldebaran (α Tau); manzilah ke-4','Dabarān'],['الفنيق / المجدح / الهادي','nama lain ad-Dabarān','Fanīq / Mijdah / Hādī'],['القلاص','bintang kecil «unta betina muda» di antara Tsurayyā dan Dabarān','Qilāsh'],['الدايقة / الكلبان','dua bintang berdempet di telinga utara banteng','Dayqah / Kalbān']],
 tr:[['Mengikutinya al-Tsaur (Banteng), dan di antara bintang-bintangnya','ada bintang-bintang yang terbit di atas gārib-nya'],['Bangsa Rum menjadikannya punuk bagi banteng itu,','sedangkan orang Arab banyak bicara tentangnya'],['Di sisi mereka kelompok itu dinamai ats-Tsurayyā,','dan kadang mereka menamainya seluruhnya «an-Najm» (Bintang)'],['Dan ia juga termasuk manzilah-manzilah Bulan,','dikenal oleh penghuni gurun maupun kota'],['Dan di sekelilingnya bintang-bintang yang banyak,','semuanya termasuk bentuk rasi ini'],['Empat di antaranya terletak pada bagian yang terpotong','dari gambar al-Tsaur, bercahaya'],['Dan sebagian lainnya pada kedua tangan (banteng) itu,','dekat al-Fanīq, menyimpang darinya'],['Dan di antaranya sebuah bintang besar lagi cemerlang,','dihiasi cahaya dan warna merah'],['Menawan, berpemandangan elok,','dikenal dengan al-Mijdah dan al-Fanīq'],['Dan «Tābi‘ an-Najm» juga menjadi julukan baginya,','dan ad-Dabarān adalah namanya di kalangan Arab'],['Dan kadang engkau menamainya «Tālī an-Najm»,','dan kadang engkau menamainya Mujdah (dengan dhammah)'],['Dan kadang ia dinamai «al-Ḥādī», dan telah','disebutkannya dalam syairnya setiap orang'],['Di sisi mereka ia bintang pembawa sial,','dan nau’-nya dibenci lagi tercela'],['Mendahuluinya dua bintang cemerlang,','di antara keduanya sejengkal; keduanya dinamai'],['«ad-Dayqah» oleh orang-orang Arab dusun; dan engkau','akan melihat di sekitarnya bintang-bintang yang menyala'],['(bintang-bintang itu) dikenal sebagai al-Qilāsh di kalangan Badui;','aku tidak ragu akan apa yang kuceritakan'],['Dan orang Arab kadang menamai dua bintang yang saling berdempetan','dengan al-Kalbain']],
 ck:{0:'Syarah hal. 498: al-ghārib = bagian depan punuk (as-sanām). Gugusan itu digambarkan terletak di ghārib banteng. Baris-baris riwayat 2 pada bait 4–6 dan 10–11 dikutip syarah di hal. 503–509.',1:'Syarah hal. 498: bangsa Rum menjadikan gugusan ini punuk (sanām) di punggung banteng; orang Arab memberi perhatian besar dan banyak berbicara tentangnya, dan hampir tak ada bintang lain yang sebanyak itu disebut dalam syair dan kitab anwā’ (Ibn Qutaibah).',2:'Syarah hal. 498–503: «an-Najm» tanpa disandarkan kepada apa pun = ats-Tsurayyā (Ibn Qutaibah, al-Marzūqī; juga tafsir surah an-Najm menurut Ibn Katsir). Nama Tsurayyā adalah tashghīr dari tsarwah (kelimpahan) karena bintangnya rapat; enam bintang tampak jelas. Menurut Ṣūfī, bintang ke-29, 30, 31, dan 32 dari rasi ini dinamai Tsurayyā. Semua pengarang Arab menempatkannya di alyah (ekor gemuk) al-Hamal Arab, berbeda dengan Yunani.',3:'Syarah hal. 503: ats-Tsurayyā manzilah ke-3 Bulan; orang Arab menjadikannya awal manazil karena terbitnya di waktu fajar menandai awal musim panas (al-qaiz).',4:'Syarah hal. 503: bintang-bintang yang banyak di sekeliling ats-Tsurayyā ini terletak di dalam gambar al-Tsaur.',5:'Syarah hal. 504 (dengan gambar hal. 505): gambar al-Tsaur hanyalah setengah badan (terpotong), bukan banteng utuh. Empat bintang bercahaya pada potongan itu = bintang ke-1, 2, 3, dan 4 dari rasi ini. Dari ats-Tsurayyā, menurut orang Arab, terjulur dua baris bintang seperti tangan: yang panjang ke utara berakhir pada al-Kaff al-Khadhīb (di antaranya al-Minkab, as-Sā‘id, al-Mirfaq, al-Ma‘shām), dan yang pendek — keempat bintang ini — ke selatan berakhir pada al-Kaff al-Jadzmā’ (tangan yang terpotong), dinamai demikian karena pendeknya.',6:'Syarah hal. 504: bintang-bintang lain itu dekat kedua tangan banteng, dekat al-Fanīq (ad-Dabarān), menyimpang darinya. Tidak diriwayatkan dari orang Arab nama-nama untuk bintang ini, sebab bintang-bintang di sekitarnya (ad-Dabarān dan al-Qilāsh-nya, al-Kaff al-Jadzmā’, dan dzawā’ib al-Jawzā’) lebih masyhur.',7:'Syarah hal. 504 dan 511 (mengutip Ṣūfī): bintang besar yang bersinar ini termasuk bintang rasi Tsaur, tepat di mata banteng; ia bintang ke-14, merah terang, dan manzilah ke-4 Bulan.',8:'Syarah hal. 504, 507–508: al-Mijdah (dibaca juga al-Mujdah) = tongkat kayu bercabang tiga; jamaknya majādīh dipakai untuk anwā’ (istisqā’ Umar r.a.); dan sebagai tanda cap unta bentuknya seperti angka 8/huruf dāl. Al-Fanīq = pejantan unta yang dimuliakan; mungkin karena bintang di sekitarnya dinamai al-Qilāsh (unta betina muda).',9:'Syarah hal. 508–511: ad-Dabarān dari dubūr — ia «membelakangi»/mengikuti ats-Tsurayyā; karena itu juga Tābi‘ dan Tālī an-Najm, ada pula at-Tawbī‘ (riwayat al-Azharī, hal. 511).',10:'Syarah hal. 508: «Tālī an-Najm» (yang mengikuti an-Najm) karena ia menyusul ats-Tsurayyā; maknanya sama dengan Tābi‘ an-Najm dan ad-Dabarān. Syarah mencetak «وقد تسمي مُجدحاً بالضم»: dinamai al-Mujdah dengan dhammah pada mīm (al-Jawharī; hal. 509: al-Umawī pun membacanya demikian, dihikayatkan Abū ‘Ubaid).',11:'Syarah hal. 509: al-Ḥādī = penggiring unta; dinamai demikian mungkin karena ia di belakang al-Qilāsh (bintang-bintang «unta betina»), yang berada di antaranya dan ats-Tsurayyā; juga «Ḥādī an-Najm».',12:'Syarah hal. 511–512: orang Arab jahiliah menganggap ad-Dabarān pembawa sial dan membenci nau’-nya; nau’-nya tiga malam (ada yang berkata semalam), tidak terpuji. Pensyarah menyebut Islam datang membatalkan khurafat dan ketergantungan pada bintang.',13:'Syarah hal. 512: syarah mencetak «يقدمه نجمان أزهران» (mendahuluinya), sama dengan riwayat 2 (riwayat 1 «يتبعه»); menurut syarah kedua bintang itu terbit mendahului ad-Dabarān. Keduanya berdekatan (jarak antarkeduanya mendekati diameter Bulan) dan dinamai ad-Dayqah.',14:'Syarah hal. 512–514: «ad-Dayqah» juga nama celah antara ats-Tsurayyā dan ad-Dabarān yang dihindari Bulan (ia lebih suka singgah di celah antarmanzilah selain ini). Menurut Ṣūfī, dua bintang berdekatan di telinga utara banteng (bintang ke-21 dan ke-22) disebut al-Kalbain (anjing-anjing ad-Dabarān) dan banyak orang Arab menamainya ad-Dayqah.',16:'Syarah hal. 498, 513: Abū Ziyād: ad-Dayqah dua bintang berdempet, kecil, di antara an-Najm dan ad-Dabarān, dinamai juga al-Kalbain.'},

 note:'Rasi Gemini (PDF 122–123, cetak 92–93; 14 bait). Romawi menyerupakannya dengan <b>dua manusia kembar</b>; menurut Ṣūfī 18 bintang di dalam gambar dan 7 di luar, kepala di utara dan timur Majarrah, kaki ke selatan dan barat. Dua bintang di kepala = <b>adz-Dzirā‘</b> (Pollux &amp; Castor; adz-Dzirā‘ al-mabsūṭah menurut Ṣūfī), manzilah ke-7 — pensyarah menguatkan yang dimaksud manzilah ialah adz-Dzirā‘ <i>al-janūbiyyah</i> (al-maqbūḍah). Dua bintang yang menyusul di kaki kembaran = <b>al-Hanʿah</b> (manzilah ke-6; nama lain az-Zirr dan al-Mīsān); dua bintang di kaki kembaran terdahulu = <b>at-Tahābī</b> (at-Tahā’ī). Delapan bintang berbentuk busur (at-Tahābī, dua bintang al-Hanʿah, tiga bintang gelap) dinamai Arab <b>Qaws al-Jawzā’</b> (matan menyebut «Qaws al-Jabbār»; syarah hal. 545: nama Arabnya Qaws al-Jawzā’); bintang-bintang kecil di sekitar dzirā‘ = <b>al-Azhfār</b>. Nama «al-Jawzā’» membingungkan karena Orion (al-Jabbār) juga disebut demikian. Syarah mencetak bait pembuka dalam versi gabungan (baris «وبعدها كواكب الجوزاء…» tidak ada di riwayat 2). Jarak «lima jengkal» (Ṣūfī ≈ 5°50′; ukuran modern ≈ 4°40′) dan «dua jengkal» (dinilai tidak tepat; Ṣūfī: kurang dari 4°40′, modern ≈ 4°) tidak persis. Menurut riwayat yang dikutip syarah (hal. 545), al-Jawzā’ memanah dzirā‘ al-Asad dengan busur ini. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['الذراع','Pollux (β Gem) &amp; Castor (α Gem)','Dzirā‘'],['الهنعة','dua bintang terang pada kaki kembaran yang menyusul (bintang ke-17 & 18 menurut Ṣūfī); manzilah ke-6','Hanʿah'],['الزر / الميسان','nama lain al-Hanʿah','Zirr / Mīsān'],['التهابي','bintang di kaki kembaran terdahulu (syarah menulis «at-Tahābī/at-Tahā’ī»; ejaan Arabnya di sini belum dicek ke syarah hal. 541–545)','Tahābī'],['قوس الجوزاء','delapan bintang berbentuk busur','Qaws al-Jawzā’']],
 tr:[['Dan sesudahnya bintang-bintang yang bersinar redup,','cemerlang, melintang di Majarrah (Bimasakti)'],['Bangsa Rum menyerupakannya dengan dua anak kembar,','engkau lihat di kepala keduanya dua bintang'],['Keduanya dikenal sebagai adz-Dzirā‘,','dan yang paling terang lagi cemerlang, berpancar sinar,'],['dijuluki Muqaddam adz-Dzirā‘ayn; antara keduanya','dalam jarak, menurut penglihatan mata,'],['lima jengkal; dan andai kami cari','di hadapannya al-Hanʿah, niscaya kami temukan'],['dua bintang dari bintang-bintang rasi ini,','diikuti bintang-bintang yang bercahaya'],['dua di antaranya dinamai','az-Zirr, al-Hanʿah, dan al-Mīsān'],['keduanya adalah dua kaki bagi salah satu si kembar,','jarak keduanya, bila kauperkirakan, dua jengkal'],['Dan kaki kedua bentuk itu terdiri dari bintang-bintang','yang terang, bersinar dalam kegelapan'],['Mereka mendahului, pada saat terbitnya, bintang-bintang','yang tak kaulihat darinya kecuali yang gelap'],['Tiga (bintang gelap) itu bersama kaki-kaki (kembaran)','pada lengkungan seperti lengkungan busur sang pemanah'],['Orang Arab menamainya Qaws al-Jabbār (Busur al-Jabbār),','dan dikatakan dari sebagian periwayat berita'],['bahwa itu busur yang bertali baginya,','darinya ia memanah ke dzirā‘ al-Qaswarah (Singa)'],['Di sekitar adz-Dzirā‘ bintang-bintang kecil,','yang di kalangan mereka berjulukan al-Aẓfār']],
 ck:{0:'Syarah hal. 525–526 mencetak bait ini dalam versi gabungan («وبعدها كواكب الجوزاء / كواكب تشرق في الظلماء» + «وهي ترى كواكب مفترة / زاهرة تعترض المجرة»); riwayat 2 hanya memuat baris «مفترة … المجرة». Rasi ini at-Tau’amān; perajaz menyebutnya juga al-Jauzā’ (dan «jauzah» di nazham urutan burūj), nama yang membingungkan karena al-Jabbār (Orion) pun disebut al-Jauzā’; «gambar al-Jauzā’» menurut Arab mencakup bintang al-Jabbār serta al-Hanʿah di at-Tau’amān. Menurut Ṣūfī (hal. 526): 18 bintang dalam gambar dan 7 di luar; gambar dua manusia, kepala di utara dan timur Majarrah, kaki ke selatan dan barat pada Majarrah itu sendiri.',2:'Syarah hal. 528–535: adz-Dzirā‘ = dua lengan al-Asad (Singa) menurut Arab: al-maqbūḍah dan al-mabsūṭah. Dua bintang di kepala at-Tau’amān = adz-Dzirā‘ al-mabsūṭah (utara) menurut Ṣūfī dan al-Marzūqī; Ibn Qutaibah sebaliknya. Penentuan manzilah ke-7 pun diperselisihkan: Ṣūfī dan Ibn Qutaibah: yang utara; al-Marzūqī: yang selatan (asy-Syi‘rā al-Ghumaisā’ dan Marzamnya). Pensyarah menguatkan bahwa manzilah ialah adz-Dzirā‘ al-janūbiyyah (al-maqbūḍah), karena ia tidak mendahului terbit dan tidak sebegitu tinggi seperti yang utara, serta selisih terbitnya dengan al-Hanʿah (≈ 6 hari) lebih cocok dengan jarak antarmanzilah.',3:'Syarah hal. 536: Ṣūfī menyebut bintang yang lebih terang bernama Muqaddam adz-Dzirā‘ayn; pensyarah: yang lebih terang sebenarnya bintang yang satunya, dan andai separuh bait berbunyi «والأول الأزهر ذو الشعاع» maknanya lebih tepat, karena kedua bintang itu terang. «Muqaddam adz-Dzirā‘ayn» adalah nama bintang yang dipakai pada astrolab, bukan nama Arab.',4:'Syarah hal. 536–538: «lima jengkal» menurut Ṣūfī (satu jengkal = setengah dzirā‘; satu dzirā‘ ≈ 2°22′) ≈ 5°50′; ukuran modern antara dua bintang itu ≈ 4°40′ (sekitar dua dzirā‘). Naskah-naskah bervariasi «الهقعة»/«الهنعة»; yang dimaksud al-Hanʿah (manzilah ke-6), bukan al-Haq‘ah. Dua bintang al-Hanʿah mirip bintang adz-Dzirā‘ dalam arah miringnya, tetapi lebih redup.',6:'Syarah hal. 537–538: al-Hanʿah = dua bintang terang yang menyusul adz-Dzirā‘; nama lain az-Zirr dan al-Mīsān, namun tidak diriwayatkan dari Arab mana di antara dua bintang itu yang az-Zirr dan mana al-Mīsān. Menurut Ṣūfī: bintang ke-17 dan ke-18 pada kedua kaki si kembar yang menyusul. Ibn Qutaibah: dua bintang putih yang di belakang al-Haq‘ah di dalam Majarrah; Bulan singgah di at-Tahābī (tiga bintang di depan al-Hanʿah).',7:'Syarah hal. 537: jarak «dua jengkal» menurut perajaz tidak tepat; Ṣūfī menyebutnya kurang dari dua dzirā‘ (kurang dari empat jengkal), yaitu kurang dari 4°40′; menurut ukuran modern sekitar 4°.',8:'Syarah hal. 541–542: kaki kedua gambar kembaran adalah bintang-bintang terang yang jelas di malam gelap: empat bintang berjajar lurus. Dua yang di kaki si kembar yang menyusul = bintang-bintang al-Hanʿah; dua yang di kaki si kembar terdahulu bersama sebuah bintang miring di depannya = bintang-bintang at-Tahābī (at-Tahā’ī), yang menurut Ibn Qutaibah tiga bintang di belakang al-Hanʿah dan Bulan singgah padanya.',9:'Syarah hal. 545: bintang-bintang terang pada kaki kedua kembaran itu mendahului (dalam terbit) bintang-bintang yang gelap.',10:'Syarah hal. 545: tiga di antara bintang-bintang gelap itu, bersama kelima bintang terang yang telah disebut, membentuk satu baris melengkung seperti busur pemanah (delapan bintang; gambar hal. 543: at-Tahābī di satu ujung, dua bintang al-Hanʿah di tengah, tiga bintang gelap di ujung yang lain).',11:'Syarah hal. 545: orang Arab menamainya «Qaws al-Jawzā’», bukan «Qaws al-Jabbār»; al-Jabbār ialah kawakib Yunani yang padanannya al-Jawzā’ di kalangan Arab. Pensyarah tidak tahu mengapa perajaz berpaling dari nama yang tegas itu. Ibn Qutaibah dan Adham al-‘Abdī: al-Hanʿah = Qaws al-Jawzā’, delapan bintang berbentuk busur dengan dua bintang al-Hanʿah pada pegangannya.',12:'Syarah hal. 545: menurut riwayat itu, al-Jawzā’ memanah dzirā‘ al-Asad dengan busur ini (al-Qaswarah = singa).'},

 gl:{5:'Bait 1–6 ada di PDF 122 (bagian bawah); bait 7–14 di PDF 123. Kalimat bait 6→7 bersambung antar-halaman.',3:'Syarah hal. 525 mencetak «بينهما فاعلمه في رأي العين» (seperti riwayat 1); HTML riwayat 2 «بينهما في البعد في رأي العين».',7:'Syarah hal. 525 mencetak «هما لأحدى التوأمين رجلان» (hamzah di atas alif, dicek 250 dpi); HTML «لإحدى» — makna sama («bagi salah satu si kembar»), bacaan HTML dibiarkan.'}},
{g:'Burūj',id:'r2_srt',ok:1,ar:'السرطان',idn:'Saratān (riwayat 2)',
 note:'Rasi Cancer (PDF 123, cetak 93; 10 bait). Mengikuti al-Jawzā’ (di sini = at-Tau’amān, bukan Orion); menurut Ṣūfī 9 bintang di dalam gambar dan 4 di luar. Bintang-bintangnya <b>redup</b>. Di tengahnya sebuah sadīm (gugusan berkabut seperti awan tipis; Praesepe) bernama <b>al-Ma‘laf</b>, juga <b>an-Natsrah</b> (ujung hidung Singa; manzilah ke-8) dan <b>al-Lahāh</b> (langit-langit mulut Singa). Dua bintang gelap yang mengikutinya = <b>al-Himārān</b>; oleh Arab dinamai <b>al-Manākhir</b> («dua lubang hidung Singa»), berjarak ±3°20′. Nama al-Ma‘laf dan al-Himārān berasal dari Yunani (al-Majisṭī, Aratus), bukan sebutan Arab. <b>ath-Tharf</b> (dua mata Singa menurut Arab) sangat samar; pensyarah condong menempatkannya di dua bintang terang dekat al-Jabhah. <b>al-Asyfār</b> = bintang-bintang kecil di sekitar ath-Tharf, bagai bulu mata. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['المعلف','gugus Praesepe (M44), tampak seperti awan tipis','Ma‘laf / Natsrah'],['الحماران','dua bintang gelap yang mengikuti Ma‘laf (γ, δ Cnc)','Himārān / Manākhir'],['الطرف','dua bintang samar (dua mata Singa)','Tharf'],['الأشفار','bintang-bintang kecil di sekitar Tharf','Asyfār']],
 tr:[['As-Saratān mengikuti al-Jauzā’,','ia bintang-bintang yang kehilangan cahaya'],['Jumlahnya, bila engkau hitung, sembilan,','semuanya berkumpul dalam satu petak'],['di sekitar sebuah bintik awan yang dinamai al-Ma‘laf,','dan dengan nama al-Lahāh — ketahuilah — ia pun dikenal'],['Dialah yang dikenal dengan nama an-Natsrah','oleh semua orang Arab dan para ahli'],['Mengikutinya dua bintang gelap,','keduanya dinamai al-Himārān'],['Di antara keduanya lebih dari dua jengkal,','keduanya dijadikan dua lubang hidung bagi Singa'],['Ath-Tharf adalah dua bintang, bila dihitung,','keduanya bintang yang sangat samar'],['satu bintang di lubang hidung gambar Singa,','dan satu bintang lagi dijadikan oleh para pengamat'],['termasuk bintang-bintang yang tak punya gambar,','namun tercatat dan disebut dalam pengamatan'],['Keduanya bersambung dengan bintang-bintang kecil','yang oleh orang Arab dikenal sebagai al-Asyfār']],
 ck:{0:'Syarah hal. 554: «al-Jauzā’» di sini ialah nama lain kawkabah at-Tau’amān (bukan al-Jabbār/Orion). Rasi as-Saratān sendiri: 9 bintang di dalam gambar dan 4 di luar gambar (kutipan Ṣūfī, hal. 554 dan 562).',2:'Syarah hal. 554–557: «as-saḥābī» bukan bintang, melainkan sadīm (kabut/gugusan) yang tampak seperti awan putih tipis; ia dinamai al-Ma‘laf (tempat pakan ternak) karena dua bintang di sekelilingnya dinamai al-Himārān. Ṣūfī mengaku tak menemukan nama al-Ma‘laf/al-Himārān dalam kitab Anwā’ orang Arab; Ibn aṣ-Ṣalāḥ menjelaskan sebabnya: itu nama-nama Yunani (dari al-Majisṭī; juga ada dalam Ẓāhirāt karya Aratus), bukan sebutan Arab.',3:'Syarah hal. 557–561: an-Natsrah = ujung hidung Singa (nama Arab untuk bintik awan itu, sebab ia seperti pecahan awan yang terburai); al-Lahāh = langit-langit lunak di atap tenggorokan, mulut Singa. Ibn Qutaibah dan al-Marzūqī menyebut an-Natsrah tiga bintang berdekatan, salah satunya seperti bintik; Ṣūfī menyebutnya manzilah ke-8.',4:'Syarah hal. 558: yang oleh Arab dinamai al-Manākhir («dua lubang hidung Singa») ialah dua bintang gelap yang mengikuti an-Natsrah; jaraknya dari satu sama lain sekitar 3°20′ menurut ukuran modern. «al-Himārān» bukan sebutan Arab (nama dari Yunani; lihat catatan bait 3).',5:'Syarah hal. 554 dan 558 mencetak bait ini bersama bait 4 («يتبعه نجمان مظلمان / وبالحمارين يسميان / بينهما أكثر من شبرين / قد جعلا لليث منخرين»): kedua bintang gelap itu oleh Arab dinamai al-Manākhir, «dua lubang hidung Singa»; jarak keduanya lebih dari dua syibr — menurut ukuran modern ±3°20′, sedikit kurang dari tiga syibr.',6:'Syarah hal. 561–564: dua bintang ath-Tharf sangat samar. Menurut Arab ath-Tharf = «dua mata Singa»; Ṣūfī menunjuk satu di lubang hidung Singa dan satu di luar gambar (dari al-Majisṭī), lalu memilih dua bintang gelap di antara an-Natsrah dan al-Jabhah. Pensyarah menilai pilihan itu kemungkinan kesimpulan Ṣūfī sendiri, dan lebih condong bahwa ath-Tharf = dua bintang terang di dekat al-Jabhah, sesuai uraian Ibn Qutaibah dan al-Marzūqī («dua bintang di depan dahi»).',9:'Syarah hal. 564–565: al-Asyfār (jamak «syufr», bulu mata) = bintang-bintang kecil di sekitar ath-Tharf, bagai bulu mata di tepi kelopak. Ṣūfī: bintang kecil yang bertanda lingkaran; Ibn Qutaibah dan ats-Tsaqafī: bintang-bintang kecil di depan/di atas ath-Tharf yang terbit lebih dulu.'},

 gl:{2:'Syarah hal. 554 mencetak «حول سحابي قد يسمى المعلفُ / وباللهاة فاعلمنه يعرفُ» — «سحابي» cocok (⚠ dihapus); syatr 2 syarah «فاعلمنه», HTML «عندهم قد».',4:'Syarah hal. 554 dan 558 mencetak «يتبعه نجمان مظلمان» (HTML riwayat 2 «يتبعها»); makna sama.',6:'Syarah hal. 561 mencetak «والطرف نجمان إذا ماعدّا» (ditulis serangkai, bershaddah) — cocok (⚠ dihapus).'}},
{g:'Burūj',id:'r2_asd',ok:1,ar:'الأسد',idn:'Asad (riwayat 2)',
 note:'Rasi Leo (PDF 124, cetak 94; 12 bait). Bintang-bintangnya terang dan banyak; Arab menyebutnya <b>kawākib an-nuhūs</b> (bintang-bintang sial; dinginnya menyengat) dan membayangkan Singa di sarangnya (<i>al-khays</i>). <b>al-Malikī</b>/<b>Qalb al-Asad</b> (Regulus) adalah nama Yunani; di kalangan Arab ia hanya bintang keempat (paling selatan) dari <b>al-Jabhah</b> (manzilah ke-10; empat bintang sebaris agak melengkung, «sakhāb» = untaian kalung). «Jantung Singa» ialah penamaan gambar Singa Yunani; jangan dicampur dengan gambar Singa Arab. <b>az-Zubrah</b> (al-Kharatān; manzilah ke-11) = rambut tengkuk/pundak Singa yang berdiri ketika marah; bintang-bintang samar di sekelilingnya = «rambut yang berdiri». <b>aṣ-Ṣarfah</b> (manzilah ke-12; juga Qanab al-Asad atau wi‘ā’ al-qadhīb) satu bintang terang yang mengikuti az-Zubrah — dinamai demikian karena panas dan dingin «berbalik» ketika ia terbit/terbenam fajar. <b>al-Hulbah</b>/<b>adh-Dhafīrah</b> (Coma Berenices) = gugus kecil di ujung ekor, oleh orang awam disebut as-Sunbulah. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['الجبهة','empat bintang sebaris (Regulus + tiga lainnya); manzilah ke-10','Jabhah'],['الملكي / قلب الأسد','Regulus (α Leo); nama Yunani','Malikī'],['الزبرة','bintang di pundak/tengkuk Singa; manzilah ke-11','Zubrah / Kharatān'],['الصرفة','bintang terang yang mengikuti Zubrah; manzilah ke-12','Sharfah'],['الحلبة / الضفيرة','Coma Berenices','Hulbah / Dhafīrah']],
 tr:[['Sesudah as-Saratān datanglah rasi al-Asad,','bintang-bintang cemerlang yang jumlahnya banyak'],['Mereka menyerupakannya dengan singa jantan penghuni sarang rimbun,','dan ia dijuluki bintang-bintang kesialan'],['Di antaranya ada sebuah bintang yang dinamai al-Malikī,','engkau lihat ia termasuk bintang-bintang falak yang paling terang'],['Bangsa Rum menjadikannya jantung bagi Singa,','ia mengikuti bintang-bintang bagai mutiara yang menyala'],['tersusun beruntun seakan-akan seuntai kalung,','orang Arab menamainya al-Jabhah'],['Mengikutinya az-Zubrah, dua buah bintang,','yang di kalangan mereka dinamai al-Kharatān'],['Keduanya dihitung termasuk manzilah-manzilah,','dan termasuk bentuk Singa, (terletak) seperti pundak'],['Di sekeliling keduanya ada bintang-bintang samar,','tidak berpendar dan tidak jelas'],['yang oleh orang Arab dikenal sebagai Qanab al-Asad;','mengikutinya sebuah bintang terang yang dijadikan petunjuk'],['dengan cahayanya para musafir mendapat petunjuk, dan ia dinamai ash-Sharfah,','di atasnya bintang-bintang yang saling berlilitan'],['gelap, bendanya kecil-kecil,','dikenal dengan nama al-Hulbah dan adh-Dhafīrah'],['Dan bintang ash-Sharfah dinamai oleh orang Arab','seluruhnya dengan Nāb ad-Dahr (Taring Masa), benar, tanpa dusta']],
 ck:{1:'Syarah hal. 570: al-hazbar = Singa; al-khays = tempat pohon rimbun yang melilit, sarang Singa. Syarah mencetak bait ini dan baris sebelumnya «والسرطان بعده برج الأسد / كواكب زهرٌ كثيرات العدد». Menurut al-Marzūqī (hal. 570), Arab menamai bintang-bintang Singa «kawākib an-nuhūs» karena dinginnya yang menyengat; Ibn al-A‘rābī (hal. 572) mengaitkan sebabnya dengan dingin itu pula, dan orang Arab menganggap nahas Qalb al-‘Aqrab.',2:'Syarah hal. 572–575: «al-Malikī» dan «Qalb al-Asad» bukan nama Arab. Ibn aṣ-Ṣalāḥ: bintang ini dinamai al-Malikī dalam bahasa Yunani. Di kalangan Arab ia hanya bintang keempat (paling selatan) dari al-Jabhah.',3:'Syarah hal. 575–577: «jantung bagi Singa» adalah penamaan Yunani, dari letaknya pada gambar Singa Yunani; Arab membayangkan Singa yang lain (empat bintang ini berada di dahi/punggung, bukan di leher dan jantung). Karena itu pensyarah mengingatkan agar tidak mencampur gambar Singa Arab dengan gambar Singa Yunani.',4:'Syarah hal. 576–577: yang dimaksud bait ini empat bintang: al-Malikī + tiga bintang terang yang mengikutinya dalam satu garis agak melengkung; semuanya oleh Arab dinamai al-Jabhah, manzilah ke-10. «Sakhāb» = untaian kalung (bukan «saḥāb», awan).',5:'Syarah hal. 577–579: az-Zubrah = rambut tengkuk/pundak Singa yang berdiri ketika marah, dinamai juga al-Kharatān («dua lubang»); manzilah ke-11. al-Kāhil = bagian depan punggung. Pensyarah menolak pendapat yang mengaitkannya dengan pangkal belakang Singa («‘ajz al-asad»).',7:'Syarah hal. 579: bintang-bintang samar di sekeliling az-Zubrah, menurut Ibn Qutaibah, Ṣūfī dan al-Qalqasyandī, ialah «rambut yang berdiri» di pundak Singa.',8:'Syarah hal. 579–581: di sini Ṣūfī memakai «Qanab al-Asad» untuk bintang-bintang samar di sekitar az-Zubrah; padahal menurut Ibn Qutaibah dan al-Marzūqī «Qanab al-Asad» (juga «wi‘ā’ al-qadhīb») adalah nama lain ash-Sharfah, dan Ṣūfī sendiri di bagian al-Asad menyebutnya begitu.',9:'Syarah hal. 579–580: ash-Sharfah = satu bintang terang yang mengikuti az-Zubrah, manzilah ke-12. Dinamai demikian karena panas berbalik ketika ia terbit fajar dan dingin berbalik ketika ia terbenam. «as-Safr» = para musafir yang berpedoman pada cahayanya.',10:'Syarah hal. 581–583: al-Hulbah = adh-Dhafīrah (Ptolemeus: Coma Berenices), bintang-bintang kecil berkumpul seperti Tsurayyā, dinamai «hulbah» (rambut lebat di ujung ekor) karena letaknya di ujung ekor Singa. Orang awam menyebut gugus ini as-Sunbulah.'},

{g:'Burūj',id:'r2_adz',ok:1,ar:'العذراء (السنبلة)',idn:'‘Adzrā’ / Sunbulah (riwayat 2)',
 note:'Rasi Virgo (PDF 124–125, cetak 94–95; 11 bait). Mengikuti Asad; disebut <b>al-‘Adzrā’</b> atau <b>as-Sunbulah</b>. «As-Sunbulah» punya dua arti: bagi ahli hisab ia nama bintang Simāk al-A‘zal (bulir di tangan perempuan itu), bagi orang awam nama gugus kecil al-Hulbah di rasi Asad — keduanya istilah non-Arab. <b>al-‘Awwā’</b> di sini = 4–5 bintang berlengkung di rasi ‘Adzrā’ (manzilah ke-13), <u>bukan</u> rasi al-‘Awwā’ (Boötes) di utara; bentuknya seperti huruf lām (Ṣūfī), kāf (Ibn Qutaibah), atau alif melengkung. <b>as-Simāk al-A‘zal</b> (Spica; manzilah ke-14) = bintang ke-14 pada gambar, kelas pertama; «a‘zal» (tak bersenjata) karena tak ada bintang kecil di depannya, berbeda dengan <b>as-Simāk ar-Rāmiḥ</b> (Arcturus, rasi al-‘Awwā’ utara) yang punya rāyat as-simāk. Bagi Arab dua Simāk adalah dua betis Singa: al-A‘zal betis selatan, ar-Rāmiḥ betis utara. <b>al-Ghafr</b> (manzilah ke-15) = tiga bintang samar berbentuk busur, bintang ke-22, 23, dan 25 pada gambar, di antara al-A‘zal dan az-Zubānā; dinamai dari «ghafrah» (rambut di ujung ekor) atau «ghufira» (tertutup, karena redup). Rinci per bait di kotak catatan pensyarah.',
 tbl:[['العوّاء','4–5 bintang berlengkung di rasi ‘Adzrā’ (β, η, γ, δ, ε Vir); manzilah ke-13','‘Awwā’'],['السماك الأعزل','Spica (α Vir); manzilah ke-14','Simāk al-A‘zal'],['السماك الرامح','Arcturus (α Boo); di rasi ‘Awwā’ utara, bukan di rasi ini','Simāk ar-Rāmiḥ'],['الغفر','tiga bintang samar (ι, κ, λ Vir); manzilah ke-15','Ghafr']],
 tr:[['Mengikutinya al-‘Adzrā’, yakni as-Sunbulah,','bintang-bintangnya bertaut dengan rupa (Singa) itu'],['Di antaranya bintang-bintang yang penuh cahaya,','yang oleh orang-orang dahulu dijuluki al-‘Awwā’'],['Bentuknya seperti huruf lām,','bersinar bagi yang memandang dalam kegelapan'],['Mengikutinya sebuah bintang besar yang terang benderang,','yang mereka juluki as-Simāk al-A‘zal'],['ia berada di telapak tangan al-‘Adzrā’,','terbit setelah terbitnya al-‘Awwā’'],['Orang-orang dahulu menjadikannya manzilah,','dan ia dinamai al-A‘zal hanyalah karena'],['ia tanpa senjata, berbeda dengan bintang yang','dijadikan bertombak sebagai penandanya (ar-Rāmiḥ)'],['Orang Arab telah menjadikan kedua Simāk','sebagai dua betis bagi gambar Singa yang perkasa'],['Mengikutinya bintang-bintang yang tampak kecil,','di ujung-ujung pakaian perempuan ini'],['tiga jumlahnya, berbentuk busur,','bagaikan titik-titik hias pengantin'],['Semuanya mereka juluki al-Ghafr,','dan mereka jadikan manzilah bagi bulan purnama']],
 ck:{0:'Syarah hal. 592–595: as-Sunbulah punya dua arti. Bagi ahli hisab/astronom, as-Sunbulah adalah nama bintang Simāk al-A‘zal (bulir di tangan perempuan itu); bagi orang awam, as-Sunbulah adalah gugus kecil al-Hulbah di rasi Asad.',1:'Syarah hal. 595–598: «al-‘Awwā’» di sini = bintang-bintang di rasi al-‘Adzrā’ (manzilah ke-13), BUKAN rasi al-‘Awwā’ (Boötes) di bagian utara. Ibn Qutaibah menyebut empat bintang, al-Marzūqī: empat atau lima. Nama «‘awwā’» dari makna melengkung/melingkar; juga dinamai ‘awwā’ al-bard / ṭāridat al-bard («pengusir dingin»), dan sebagian menyebutnya anjing-anjing yang melolong di belakang Singa.',2:'Syarah hal. 595–598: bentuknya menurut Ṣūfī seperti huruf lām, menurut Ibn Qutaibah seperti kāf yang tak terbelah, sebagian lain seperti alif melengkung ke bawah; semua menunjuk satu lengkungan bintang-bintang.',3:'Syarah hal. 601–603: as-Simāk al-A‘zal = Spica, bintang ke-14 pada gambar al-‘Adzrā’, bintang bercahaya (kelas pertama), manzilah ke-14, dan «as-Sunbulah» juga nama untuknya di kalangan ahli hisab; ia terbit setelah al-‘Awwā’. Pensyarah: penamaan bintang ini «as-Sunbulah» ialah istilah ahli hisab dan astronom pengikut jalan Yunani, bukan nama Arab.',6:'Syarah hal. 601–602: «ar-Rāmiḥ» = as-Simāk ar-Rāmiḥ (Arcturus), bintang di rasi al-‘Awwā’ utara, bukan di rasi al-‘Adzrā’. Dinamai «bertombak» karena ada bintang kecil di depannya (rāyat as-simāk), sedangkan al-A‘zal tak punya apa-apa di depannya (Ibn Qutaibah, al-Marzūqī). Pensyarah menekankan agar rasi Yunani tidak dicampur dengan manzilah/bintang Arab.',7:'Syarah hal. 602: al-Marzūqī dan Ibn Qutaibah: dua Simāk adalah dua betis Singa menurut Arab; al-A‘zal betis selatan, ar-Rāmiḥ betis utara. Sebagian ahli hisab menyebut al-A‘zal «sāq al-asad».',8:'Syarah hal. 606 (PDF 636): mencetak baris ini «يتبعه كواكب مستصغرة / هن على أذيال هذه المرة» — «ه» kembali kepada as-Simāk al-A‘zal (syarah: «yang mengikuti as-Simāk al-A‘zal adalah bintang-bintang samar di ujung gaun perawan itu»). Naskah ini membaca «تتبعه … هذي»; maknanya sama.',9:'Syarah hal. 599 (keterangan gambar): al-Ghafr = tiga bintang samar yang berbentuk busur seperti bintang-bintang al-‘Awwā’ (Ibn Qutaibah, al-Marzūqī), manzilah ke-15.',10:'Syarah hal. 606–607: Ṣūfī: al-Ghafr (manzilah ke-15; menurut Arab konon yang terbaik di antara manzilah) = bintang ke-22, 23, dan 25 pada gambar al-‘Adzrā’ (dua di ujung ekor/kaki, satu di kaki kiri), dinamai dari «ghafrah» (rambut di ujung ekor Singa) atau dari «ghufira» (tertutup, karena cahayanya redup). Ibn Qutaibah: tiga bintang samar di antara as-Simāk al-A‘zal dan dua az-Zubānā, kira-kira berbentuk seperti lengkungan al-‘Awwā’; al-Marzūqī menambahkan bahwa keserupaan itu hanya dalam bentuk lengkung, tidak dalam ukuran.'},

 gl:{1:'Harakat «مُلِين» dicek 150 dpi pada PDF 124: terbaca jelas (tanda ⚠ dihapus). Syatr 2 bait 3 (syarah hal. 601): «قد لقبوه السماك الأعزل» tanpa «بـ».',6:'Bait 7–11 ada di PDF 125 (cetak 95); bait 1–6 di PDF 124.',8:'Syarah hal. 606: «يتبعه … هذه المرة» (naskah ini «تتبعه … هذي»).',10:'Syatr 2 bait 11 «للبدر» (د), dicek 150 dpi pada PDF 125 dan sama dengan cetakan syarah hal. 606 (PDF 636); riwayat 1 membaca «للبَذْر». Terjemah mengikuti naskah ini: «bulan purnama».'}},
{g:'Burūj',id:'r2_miz',ok:1,ar:'الميزان',idn:'Mīzān (riwayat 2)',
 note:'Rasi Libra (PDF 125–126, cetak 95–96; 16 bait). Dua bintang utamanya = <b>az-Zubānā</b> (az-Zubāniyān; dari «zabn», menolak, sebab keduanya saling menjauh): pada gambar Yunani keduanya <b>dua daun timbangan</b> (kiffatā al-mīzān), pada gambar Arab <b>dua capit Kalajengking</b> (yadā al-‘aqrab), manzilah ke-16; dinamai pula <b>Zubānā aṣ-Ṣayf</b> (terbenam di musim panas; bait ini khas riwayat 2). Rasi kalajengking Arab lebih luas dari Yunani: mencakup az-Zubānā, bintang-bintang al-Mīzān, dan al-‘Aqrab. Jarak kedua Zubānā ≈ 10° (kurang dari «qaid rumḥ» ≈ 14°). <b>al-Iklīl</b> (manzilah ke-17) = tiga bintang samar yang mengikuti keduanya: bintang pertama = bintang ke-8 gambar al-Mīzān, kedua di luar gambar (ke-6 di luar menurut al-Majisṭī), ketiga tak disebut Ptolemeus (≈ HR 5824). Perselisihan: Ṣūfī dan ayahnya menyalahkan yang menaruh al-Iklīl di jabhah al-‘aqrab (dahi Kalajengking); pensyarah (hal. 621, 638) menilai tuduhan itu tidak pada tempatnya — Arab badui memakai tanda yang jelas, dan perjalanan bulan (az-Zubānā → al-Iklīl → al-Qalb) menuntut al-Iklīl berada di tengah, dekat al-Qalb. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['الزبانا','dua bintang utama Libra (α, β Lib); manzilah ke-16','Zubānā / Zubāniyān'],['كفتا الميزان','dua daun timbangan (gambar Yunani)','Kiffatā al-Mīzān'],['الإكليل','tiga bintang samar yang mengikuti Zubānā; manzilah ke-17','Iklīl'],['القلب','Antares (α Sco)','Qalb']],
 tr:[['Mengikutinya bintang-bintang al-Mīzān,','di antaranya az-Zubānā, keduanya dua bintang,'],['keduanya berkilau dan berpendar,','jarak antara keduanya sepanjang jarak sebatang tombak'],['Keduanya sekaligus dua daun timbangan al-Mīzān,','dan keduanya dikenal sebagai dua capit kalajengking'],['Dan dengan nama Zubānā aṣ-Ṣayf pula keduanya dijuluki,','al-Buṭain tampak terbit bila (keduanya) terbenam'],['Mengikuti keduanya al-Iklīl, yaitu beberapa bintang,','tiga jumlahnya, semuanya gelap'],['Salah satunya termasuk bintang-bintang al-Mīzān,','jauh dari tempat tertanamnya lidah (timbangan)'],['Sebuah bintang lagi termasuk yang dikeluarkan','dari gambar al-Mīzān ketika diamati'],['dan sebuah bintang di bawah keduanya yang belum diamati,','tidak jauh dari dua bintang yang telah diamati itu'],['Para perawi berselisih tentang al-Iklīl,','dan kebanyakan mereka keliru dalam kesesatan,'],['karena mengira ia bintang-bintang yang','dikenal oleh sekelompok para perawi'],['sebagai al-Jabhah al-‘Aqrab, tiga bintang','bagai nyala api yang berkobar.'],['Bodohlah orang yang mengira hal itu jelas,','sebab az-Zubānā jauh dari bintang-bintang itu,'],['sedangkan al-Qalb dekat dengannya; maka bulan,','bila meninggalkan daun timbangan dalam perjalanannya, kurang'],['jalannya sehingga tak sampai singgah di al-Jabhah;','begitu pula bila ia berjalan dan memalingkan wajahnya'],['dari al-Jabhah al-‘Aqrab menuju jantungnya,','ia melewatinya, sebab ia lihat dekatnya'],['dari bintang al-Qalb yang telah kami sebut;','maka al-Iklīl bukanlah selain yang kami katakan']],
 ck:{0:'Syarah hal. 611–615: «az-Zubānā» (az-Zubāniyān) = dua «tanduk/capit» kalajengking menurut Arab; nama dari «az-zabn» (menolak), sebab keduanya saling menjauh. Rasi kalajengking Arab lebih luas dari Yunani: mencakup az-Zubānā, bintang-bintang al-Mīzān, dan al-‘Aqrab. Syarah mencetak lafal «az-Zubānī» (naskah ini «az-Zubānā»).',1:'Syarah hal. 612: «qaid rumḥ» sekitar 14° pada ukuran langit, sedangkan jarak sebenarnya kedua bintang itu ≈ 10° (kurang dari qaid rumḥ).',2:'Syarah hal. 612–615: pada gambar Yunani keduanya dua daun timbangan al-Mīzān; pada gambar Arab keduanya dua capit kalajengking (yadā al-‘aqrab), manzilah ke-16, dan dinamai pula Zubānā aṣ-Ṣayf karena terbenamnya di musim panas.',3:'Syarah hal. 611–615 (mencetak «وزباني الصيف أيضاً لقبا / يبدو البطين طالعاً إن غرّبا»; baris ini khas riwayat 2, tidak ada di riwayat 1): az-Zubānā juga dinamai Zubānā aṣ-Ṣayf karena terbenamnya di musim panas, dan al-Buṭain (Ibn Qutaibah, al-Marzūqī) disebut terbit ketika keduanya terbenam. Subjek «يبدو … طالعاً» tidak dijelaskan syarah; terjemah tentatif.',4:'Syarah hal. 616: al-Iklīl (manzilah ke-17) = tiga bintang samar yang mengikuti kedua Zubānā.',5:'Syarah hal. 616: bintang pertama = bintang ke-8 dalam gambar al-Mīzān (al-Majisṭī), di ujung penopang daun timbangan utara, jauh dari lidah timbangan.',6:'Syarah hal. 616: bintang kedua termasuk kawkabah al-Mīzān tetapi di luar gambar (bintang ke-6 di luar gambar menurut al-Majisṭī).',7:'Syarah hal. 616: bintang ketiga tidak disebut Ptolemeus («belum diamati»); ia setara HR 5824. Syarah mencetak «من تحتها», sama dengan naskah ini.',8:'Syarah hal. 619–620: perawi berselisih tentang al-Iklīl. Ṣūfī: yang menyebutnya tiga bintang di al-Jabhah al-‘Aqrab keliru dalam dua hal — al-Iklīl bukan di dahi tetapi di atas kepala (kalajengking), dan jarak/lintang bintang-bintangnya tidak cocok dengan perjalanan bulan. Pensyarah (hal. 621, juga hal. 638 di bagian Aqrab) menilai tuduhan Ṣūfī dan ayahnya itu tidak pada tempatnya: Ṣūfī ahli hisab yang menuntut ketepatan, sedangkan Arab badui memakai tanda-tanda yang jelas.',11:'Syarah hal. 619: alasan pensyarah/Ṣūfī: bulan melintasi az-Zubānā, lalu al-Iklīl, lalu al-Qalb. Az-Zubānā jauh dari al-Jabhah, sedangkan al-Qalb dekat dengannya; bila bulan meninggalkan dua daun timbangan, ia tak sampai ke al-Jabhah dalam sehari semalam, dan bila meninggalkan al-Jabhah menuju al-Qalb ia melewatinya. Karena itu al-Iklīl harus berada di tengah antara az-Zubānā dan al-Qalb, yakni tiga bintang samar yang dekat al-Qalb (bukan al-Jabhah). Ṣūfī mengikuti pendapat ayahnya.'},
