{g:'Janūb',id:'kb2',ok:1,ar:'الكلب الأصغر',idn:'Kalb Ashghar (Anjing Kecil / Canis Minor)',
 note:'Rasi Canis Minor (syarah cetak 793–798 = PDF 823–828; 5 bait). Dua bintang, satu redup dan satu terang; «yatba‘uhu» tidak berarti terbit sesudah al-Akbar — keduanya terbit hampir bersamaan, dan Ṣūfī menyebutnya «al-Kalb al-Muqaddam» dalam tabelnya. Yang terang (magnitudo 1) = <b>asy-Syi‘rā asy-Syāmiyah</b> (Procyon); yang satunya ±2 hasta di sebelah utaranya (magnitudo 4). «Adz-Dzirā‘» di sini = <b>adz-Dzirā‘ al-Maqbūḍah</b> (lengan Asad), sedangkan adz-Dzirā‘ al-Mabsūṭah = dua bintang di kepala Tau’amān; pensyarah menandai kerancuan letak utara/selatan di antara Ibn Qutaibah, ath-Thaqafī, dan al-Marzūqī, dan syarah mencetak matan dengan celah «[ ]» pada syatr ini. <b>al-Ghumaiṣā’</b> = al-Ghamūṣ = al-Ghamṣā’ (Abū ‘Amr) = Procyon, pasangan asy-Syi‘rā al-‘Abūr dengan Majarrah di antaranya; menurut riwayat Arab ia menangis kehilangan Suhail hingga matanya «ghamiṣat» (kabur). «Al-Mirzam» yang lebih redup = <b>Mirzam adz-Dzirā‘</b> (bintang merah kecil), berbeda dari Mirzam al-Jawzā’ dan Mirzam al-‘Abūr; ia kadang disinggahi bulan (al-Marzūqī), Mirzam al-‘Abūr tidak. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['الشعرى الشامية / الغميصاء','Procyon α CMi','Sya‘rā Syāmiyyah = Ghumayṣā’ (bait 3–5)'],['المرزم (مرزم الذراع)','≈ β CMi (identifikasi modern, bukan dari syarah)','Mirzam adz-Dzirā‘ — yang lebih redup (bait 4)']],
 tr:[['Mengikutinya seekor anjing yang disebut al-Aṣghar','sebuah bintang tanpa cahaya dan sebuah bintang yang gemilang'],['Keduanya dikenal sebagai adz-Dzirā‘','dan yang lebih bercahaya dan gemilang itu berpendar sinar'],['Dikenal sebagai al-Ghamūṣ dan al-Ghumaiṣā’','dan para penyusun kitab anwā’ mengira'],['bahwa namanya adalah al-Ghumaiṣā’, ketahuilah','dan bintang yang lebih redup dinamai al-Mirzam'],['Orang Arab menamai al-Ghumaiṣā’ asy-Syi‘rā','dan mengiranya bermata menangis (‘abrā)']],
ck:{0:'Syarah (cetak 794): al-Kalb al-Aṣghar terdiri dari dua bintang, satu redup dan satu terang. «Yatba‘uhu» tidak berarti terbit sesudah al-Akbar: keduanya terbit hampir bersamaan, dan Ṣūfī dalam tabelnya menyebutnya «al-Kalb al-Muqaddam». Ṣūfī: yang terang (magnitudo 1) = asy-Syi‘rā asy-Syāmiyah, yang satunya ±2 hasta di sebelah utaranya (magnitudo 4).',1:'Syarah (cetak 794–798): «adz-Dzirā‘» di sini = adz-Dzirā‘ al-Maqbūḍah (salah satu lengan Asad), sedangkan adz-Dzirā‘ al-Mabsūṭah = dua bintang di kepala Tau’amān. Pensyarah menandai kerancuan: Ibn Qutaibah menyebut al-Maqbūḍah ke utara, ath-Thaqafī dan al-Marzūqī menyebutnya selatan (tempat bulan turun) dan al-Mabsūṭah ke utara; yang cocok dengan kenyataan: al-Mabsūṭah lebih tinggi. Syarah mencetak matan dengan celah «[ ]» pada syatr ini.',2:'Syarah (cetak 797–798): al-Ghumaiṣā’ = al-Ghamūṣ = al-Ghamṣā’ (Abū ‘Amr), yaitu asy-Syi‘rā asy-Syāmiyah (Procyon); ia dipandang sebagai pasangan asy-Syi‘rā al-‘Abūr dengan Majarrah di antaranya.',3:'Syarah (cetak 797–798): «al-Mirzam» yang lebih redup = Mirzam adz-Dzirā‘ (bintang merah kecil), berbeda dari Mirzam al-Jawzā’ dan Mirzam al-‘Abūr; Mirzam adz-Dzirā‘ kadang disinggahi bulan (al-Marzūqī), Mirzam al-‘Abūr tidak.',4:'Syarah (cetak 783, 797): «‘abrā» = menangis; menurut riwayat Arab, al-Ghumaiṣā’ menangis karena kehilangan Suhail hingga matanya «ghamiṣat» (kabur), sedangkan al-‘Abūr menyeberangi Majarrah (lihat Kalb Akbar).'},

{g:'Janūb',id:'sfn',ok:1,ar:'السفينة',idn:'Safīnah (Kapal Argo)',
 note:'Rasi Argo Navis (syarah cetak 806–811 = PDF 836–841; 7 bait). Gambar kapal berisi 45 bintang; karena dekat kutub selatan, gerak hariannya hanya busur rendah yang tidak naik tinggi dari ufuk. Terbit sesudah «al-Furūd» di Kalb Akbar (syarah mencetak «الفرود», naskah ini «القرود»). <b>Suhail</b> (Canopus; «Suhail al-Yaman») = bintang merah-putih tunggal dekat ufuk; klaim bahwa sinarnya «melampaui cahaya Musytari» tidak tepat — Musytari lebih terang, hanya Zuhrah yang melebihinya, dan Suhail bintang tercerlang kedua setelah asy-Syi‘rā al-Yamāniyah. Ibn Qutaibah menyebut pula Suhail Bulqayn, Ḥaḍār, dan al-Wazn sebagai bintang lain bernama sama; Ṣūfī: riwayat Arab tentang nama bintang-bintang as-Safīnah beragam. «Madā’in al-Jibāl» = kota-kota di wilayah al-Jibāl (Irak ‘Ajam: Azerbaijan, Daylam, Qazwīn, dsb., menurut Abū al-Fidā’). Baris «Kaukab al-Khurqā’» dicetak syarah, bukan di riwayat ini. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['سهيل','Canopus α Car','Suhail']],
 tr:[['Sesudahnya bintang-bintang as-Safīnah','bintang-bintang gemilang lagi jelas'],['Mereka terbit setelah terbitnya al-Qurūd','dan mereka tak terlalu jauh darinya'],['Bintang-bintangnya banyak dan berjalinan rapat','geraknya mengitari kutub selatan'],['Di antaranya ada bintang yang indah kilauannya','sinarnya melampaui cahaya Musytari'],['Cahayanya menaklukkan malam','orang-orang Arab padang pasir menyebutnya Suhail'],['Ia tak terlihat di kawasan utara','dan di sebagian kota-kota pegunungan'],['Ia tampak jelas bagi penghuni selatan','karena dekatnya dari kutubnya yang tersembunyi']],
ck:{1:'Syarah (cetak 806): bintang-bintang as-Safīnah terbit sesudah «al-Furūd» di rasi Kalb Akbar; syarah mencetak «الفرود», sedangkan naskah ini «القرود» (lihat catatan Kalb Akbar bait 9).',2:'Syarah (cetak 806): rasi ini berisi 45 bintang; karena dekat kutub selatan, gerak hariannya hanya berupa busur rendah dan tidak naik tinggi di atas ufuk.',3:'Syarah (cetak 806): klaim bahwa sinar Suhail «melampaui cahaya Musytari» tidak tepat — Musytari lebih terang, hanya Zuhrah yang melebihinya; Suhail ialah bintang tercerlang kedua di langit setelah asy-Syi‘rā al-Yamāniyah.',4:'Syarah (cetak 806–809): «Suhail al-Yaman» adalah Canopus, bintang merah-putih tunggal di dekat ufuk; Ibn Qutaibah menyebut pula Suhail Bulqayn, Ḥaḍār, dan al-Wazn sebagai bintang-bintang lain yang bernama sama; Ṣūfī menyatakan riwayat Arab tentang nama bintang-bintang as-Safīnah beragam. Baris «وقد يسمى كوكب الخرقاء…» (Kaukab al-Khurqā’) dicetak syarah, bukan di riwayat ini.',5:'Syarah (cetak 810): «مدائن الجبال» = kota-kota di wilayah al-Jibāl (Irak ‘Ajam: Azerbaijan, Daylam, Qazwīn, dsb., menurut Abū al-Fidā’); syarah mencetak syatr 1 «في جهة الشمال» dan bait 7 «وينجلي», varian atas «في صقع» dan «ويجتلي» di naskah ini.'},

{g:'Janūb',id:'shj',ok:1,ar:'الشجاع',idn:'Syujā‘ (Ular Air / Hydra) + Sulahfāh',
 note:'Rasi Hydra (syarah cetak 824–834 = PDF 854–864; 13 bait). Empat bintang pembuka di kepala Syujā‘ berada antara Qalb al-Asad dan adz-Dzirā‘ al-Maqbūḍah, sejajar dengan bintang Saratān; sisanya di leher dan punggung, terbit ketika Qalb al-Asad terbit; Ṣūfī: 25 bintang, dua di luar gambar. Menurut Ṣūfī keempat bintang itu menyerupai wajah kuda (antara asy-Syi‘rā al-Ghumaiṣā’ dan Qalb al-Asad, agak ke selatan); al-Marzūqī menyebutnya «ra’s al-ḥayyah». <b>al-Fard</b> = bintang yang menyendiri (Alphard, α Hya); «al-haql» = burung unta jantan muda yang warnanya berubah antara hitam dan abu-abu. Nama «ra’s/badan/‘unuq/fiqār al-ḥayyah» (al-Marzūqī) BUKAN nama Arab asli, melainkan sebutan bagi gambar Yunani. Abū Ḥanīfah: lintasan al-Fard dekat garis pemisah bintang Syām dan Yaman. <b>al-Ḥubāb</b> = al-ḥayyah; <b>al-Khayl</b> = bintang agak terang dan <b>al-Aflā’</b> = bintang kecil di sela-selanya (anak kuda); Ṣūfī menempatkannya di antara Syujā‘, Asad, dan ‘Adzrā’, tetapi nas Ibn Qutaibah, Abū Ḥanīfah, dan ath-Thaqafī menempatkannya dekat Aqrab dan Majarrah (kawasan Qanthūrus–Sab‘–Syawlah) — menurut pensyarah penentuan Ṣūfī tidak cocok. <b>asy-Syarāsīf</b> = pangkal/ujung tulang rusuk (atau unta terikat), bintang memanjang seperti tali antara al-Fard dan al-Khabā’ (Ghurāb); al-Khabā’ ini berbeda dari al-Khabā’ di Hawdh Asad. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['الفرد','Alphard (α Hya), bintang yang menyendiri','Fard'],['الخيل / الأفلاء','bintang agak terang / bintang kecil di sela-selanya; menurut Arab dekat Aqrab–Majarrah','Khayl / Aflā’'],['الشراسيف','bintang Hya no. 13–23 dan β Crt (tabel pensyarah)','Syarāsīf']],
 tr:[['Mengikutinya bintang-bintang asy-Syujā‘','di antara Jantung Singa dan adz-Dzirā‘'],['Empat bintang yang bercahaya','diikuti bintang-bintang yang samar'],['Mereka berada di punggung dan leher Syujā‘','tampak bagi mata ketika al-Qalb terbit'],['Mengikutinya, dari bintang-bintang Syujā‘,','sebuah bintang besar yang bersinar'],['Ia berkilau di suatu bidang langit','yang di situ tak ada bintang lain yang tampak oleh pengamat'],['Seakan-akan ia al-Haql bila warnanya menggelap keabu-abuan','para ahli menamainya al-Fard'],['Bagi Ibn serta reputasinya ada kisah dalam hal ini','si malang menelan kepedihan darinya'],['Ketika ia hendak memerikan astrolabnya','kepada guru kami dan sekumpulan sahabatnya'],['dengan serpih-serpih bintang yang ada padanya','ia membuka bicara kepada kaum itu dengan menyebut al-Mirzam'],['lalu asy-Syi‘rayayn sesudahnya dan al-Malikī','kemudian ia mulai menghitung bintang-bintang sfera'],['Hingga ketika ia hendak menyebut al-Fard','ia salah membacanya karena kebodohannya tentang «al-Qird» (monyet)'],['Dan sisa bintang-bintang al-Ḥubāb','dikenal dengan nama al-Khayl di kalangan orang Arab'],['Orang Arab juga menamainya asy-Syarāsīf','tak sampai kepada kami tentangnya selain julukan ini']],
ck:{0:'Syarah (cetak 824–825): empat bintang pembuka di kepala Syujā‘ terletak di antara Qalb al-Asad dan adz-Dzirā‘ al-Maqbūḍah, sejajar dengan bintang-bintang Saratān; sisanya mengikuti di leher dan punggungnya, terbit ketika Qalb al-Asad terbit. Ṣūfī menghitung 25 bintang, dua di antaranya di luar gambar.',1:'Syarah (cetak 824, 826–827): menurut Ṣūfī, empat bintang ini menyerupai wajah kuda, berkumpul antara asy-Syi‘rā al-Ghumaisā’ dan Qalb al-Asad, agak condong ke selatan; al-Marzūqī menyebutnya «ra’s al-ḥayyah» (kepala ular).',5:'Syarah (cetak 826–828): al-Fard = bintang yang menyendiri (Alphard α Hya; cetak 834); «al-haql» = burung unta jantan muda yang warnanya berubah antara hitam dan abu-abu (Lisān al-‘Arab). Nama-nama «ra’s al-ḥayyah», «badan al-ḥayyah», «‘unuq al-ḥayyah», «fiqār al-ḥayyah» (al-Marzūqī) BUKAN nama Arab asli, melainkan sebutan bagi gambar Yunani. Abū Ḥanīfah: lintasan al-Fard dekat garis pemisah antara bintang-bintang Syām dan Yaman; syarah mencetak syatr 2 «القدماء» (naskah ini «العلماء»).',11:'Syarah (cetak 828–832): al-Ḥubāb = al-ḥayyah; al-Khayl = bintang-bintang yang agak terang, dan al-Aflā’ = bintang-bintang kecil di sela-selanya (anak-anak kuda). Ṣūfī menempatkannya di antara Syujā‘, Asad, dan ‘Adzrā’, tetapi nas Ibn Qutaibah, Abū Ḥanīfah, dan ath-Thaqafī menempatkannya dekat Aqrab dan al-Majarrah (kawasan Qanthūrus–Sab‘–Syawlah). Pensyarah: penentuan Ṣūfī tidak cocok dengan uraian Arab itu. Syarah mencetak «تعرف» dan satu bait tambahan sesudahnya.',12:'Syarah (cetak 833–834): asy-Syarāsīf = pangkal tulang rusuk/ujung rusuk (atau unta yang terikat), bintang-bintang memanjang seperti tali di antara al-Fard dan al-Khabā’ (Ghurāb); al-Khabā’ ini berbeda dari al-Khabā’ di Hawdh Asad (Ibn Qutaibah). Tabel (cetak 834): al-Fard = α Hya; asy-Syarāsīf = bintang-bintang Hya no. 13–23 dan β Crt.'},

{g:'Janūb',id:'btt',ok:1,ar:'الباطية',idn:'Bāthiyah (Cawan / Crater)',
 note:'Rasi Crater (syarah cetak 838–841 = PDF 868–871; 4 bait). «Maṭā al-ḥayyah» = punggung ular (Syujā‘); bintang-bintang samar tersusun melingkar di atasnya, di antara Syujā‘ dan al-‘Adzrā’. <b>al-Mi‘laf</b> (dari «‘alaf», tempat pakan ternak) = bintang-bintang melingkar yang menurut Ibn Qutaibah dan al-Marzūqī terletak antara asy-Syarāsīf dan al-Khabā’ al-Yamānī, tersebar tak beraturan — bukan al-Khabā’ itu sendiri; tabel pensyarah (cetak 841): γ, δ, η, θ, ζ, ε Crt (enam bintang). «Al-Bāthiyah» dan «al-Ka’s» adalah nama menurut ahli falak/nujum aliran Yunani, bukan nama Arab; al-Bāthiyah = bejana besar tempat menciduk minuman; letaknya tak jauh dari as-Simāk al-A‘zal. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['المعلف','enam bintang melingkar (γ, δ, η, θ, ζ, ε Crt)','Mi‘laf'],['الباطية / الكأس','nama Yunani (bukan nama Arab): bejana besar / piala','Bāthiyah / Ka’s']],
 tr:[['Mengikutinya bintang-bintang kecil','di atas punggung Ular, berbentuk melingkar'],['Orang Arab mengenalnya dengan nama al-Mi‘laf','yaitu yang diikuti oleh al-Ghurāb'],['Para ahli nujum menamainya al-Bāthiyah','dan ia dekat dengan bintang as-Simāk'],['Juga al-Ka’s (cawan) namanya di kalangan Romawi','dan di kalangan setiap ahli ilmu nujum']],
ck:{0:'Syarah (cetak 838–839): «maṭā al-ḥayyah» = punggung ular, yakni punggung Syujā‘; bintang-bintang samar ini tersusun melingkar di atasnya, terletak di antara Syujā‘ dan al-‘Adzrā’. Mi‘laf berasal dari «‘alaf» (tempat pakan ternak), sebagai perumpamaan.',1:'Syarah (cetak 838–841): al-Mi‘laf = bintang-bintang melingkar yang oleh Ibn Qutaibah dan al-Marzūqī dilukiskan terletak di antara asy-Syarāsīf dan al-Khabā’ al-Yamānī, tersebar tidak beraturan; bukan al-Khabā’ itu sendiri, hanya bintang-bintang di dekatnya. Tabel (cetak 841): al-Mi‘laf = γ, δ, η, θ, ζ, ε Crt (enam bintang). Syarah mencetak «المَعْلَف» dengan harakat.',2:'Syarah (cetak 841): «al-Bāthiyah» dan «al-Ka’s» adalah nama menurut ahli falak/ahli nujum aliran Yunani, bukan nama Arab; al-Bāthiyah = bejana besar tempat menciduk minuman. Bintang-bintangnya tidak jauh dari as-Simāk al-A‘zal.'},

{g:'Janūb',id:'ghr',ok:1,ar:'الغراب',idn:'Ghurāb (Gagak / Corvus)',
 note:'Rasi Corvus (syarah cetak 844–849 = PDF 874–879; 8 bait). Tujuh bintang, empat di antaranya terang, di atas punggung al-Ḥubāb (al-Ḥubāb dan Syujā‘ = satu ular). «Janāḥ al-Ghurāb» (sayap kanan) BUKAN nama Arab, melainkan dari tradisi astrolab Yunani; Ṣūfī: bintang ke-4 di sayap kanan yang paling terang (γ Crv). <b>al-Ajmāl</b> (jamak jamal; sebagian naskah «al-Aḥmāl») dinilai pensyarah lebih kuat karena bintang-bintang ini dekat al-Mi‘laf dan asy-Syarāsīf; syarah mencetak bait 5 dengan syatr 1 kosong «[ ]». <b>al-Khabā’ al-Yamāniyah</b> = bintang-bintang al-Ghurāb; ada «al-Khabā’» lain (asy-Syāmiyah) antara Hawdh, Jady, dan al-‘Ayyūq (lihat Mumsik al-A‘innah); menurut Ibn Qutaibah dan al-Marzūqī (Abū Ḥanīfah) «khabā’» = «‘arsy as-simāk». Dinamai <b>‘Arsy as-Simāk al-A‘zal</b> karena dekat dengannya dan berbentuk persegi empat; as-Simāk al-A‘zal termasuk rasi as-Sunbulah. <b>‘Ajz al-Asad</b> (pantat Singa) karena Singa Arab digambarkan memanjang hingga as-Simāk (betis Singa); Ibn Kunāsah: empat bintang antara kedua tangan as-Simāk, miring, bersegi empat seperti an-Na‘sy, kadang disinggahi bulan. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['جناح الغراب','γ Crv','Janāh']],
 tr:[['Mengikutinya bintang-bintang al-Ghurāb','bintang-bintang di atas punggung al-Ḥubāb'],['Empat di antaranya bercahaya','menerangi pengamat di kegelapan malam'],['Di antaranya ada bintang yang paling terang di antara mereka','hampir menyobek tirai-tirai kelam'],['Ia dinamai sayap kanan al-Ghurāb','dan para ahli riwayat telah meriwayatkan kepada kami'],['bahwa namanya di kalangan Arab ialah al-Ajmāl','dan mereka menetapkannya demikian dalam kitab-kitab'],['Dan suatu kaum — mereka tidak berdusta — berkata','bahwa orang-orang Badui menamainya al-Khabā’'],['Ia juga dinamai ‘Arsy al-A‘zal','karena dekatnya dari bintang-bintang as-Sunbul'],['Dan kadang dinamai ‘Ajz al-Asad','tak kuriwayatkan tentangnya selain ini dari siapa pun']],
ck:{0:'Syarah (cetak 844): rasi al-Ghurāb berisi tujuh bintang, empat di antaranya terang, terletak di atas punggung al-Ḥubāb; al-Ḥubāb dan Syujā‘ = ular (satu rasi).',3:'Syarah (cetak 844): «Janāḥ al-Ghurāb» (sayap kanan) BUKAN nama Arab, melainkan nama dari tradisi astrolab Yunani yang bertumpu pada tabel koordinat gambar Yunani; Ṣūfī menyebutnya bintang ke-4 di sayap kanan yang paling terang (γ Crv; pada zamannya bujur 26°12′ sesudah burj kelima [Asad], lintang 14°50′).',4:'Syarah (cetak 847): bait ini dicetak syarah dengan syatr 1 kosong «[ ]». Nama «al-Ajmāl» (jamak jamal) ditetapkan dalam kitab-kitab, sedangkan sebagian naskah menulis «al-Aḥmāl» (tanpa titik); pensyarah menilai «al-Ajmāl» lebih kuat karena bintang-bintang ini berdekatan dengan al-Mi‘laf dan asy-Syarāsīf (tempat pakan ternak dan unta terikat).',5:'Syarah (cetak 847–848): al-Khabā’ al-Yamāniyah = bintang-bintang al-Ghurāb; ada «al-Khabā’» lain (asy-Syāmiyah) di antara Hawdh, Jady, dan al-‘Ayyūq (dijelaskan pada Mumsik al-A‘innah). Ibn Qutaibah dan al-Marzūqī (Abū Ḥanīfah): «khabā’» = «‘arsy as-simāk»; bintang-bintang ini dekat as-Simāk al-A‘zal.',6:'Syarah (cetak 847–848): al-Ghurāb dinamai «‘Arsy as-Simāk al-A‘zal» karena dekat dengannya dan berbentuk persegi empat; as-Simāk al-A‘zal termasuk rasi as-Sunbulah (al-‘Adzrā’).',7:'Syarah (cetak 847–849): «‘Ajz al-Asad» (pantat Singa) karena Singa Arab digambarkan besar memanjang hingga as-Simāk; as-Simāk al-A‘zal = betis Singa, maka letak bintang-bintang ini = pantat di dekat betis. Ibn Kunāsah: empat bintang antara kedua tangan as-Simāk, miring, bersegi empat seperti an-Na‘sy; kadang bulan singgah di sini. Syarah mencetak «عجزاً للأسد» (naskah ini «عجز الأسد»).'},

{g:'Janūb',id:'qnt',ok:1,ar:'قنطورس والسبع',idn:'Qanthūrus wa-Sab‘ (Centaurus & Lupus)',
 note:'Dua rasi bertumpang tindih (syarah cetak 852–862 = PDF 882–892; 10 bait): Qanthūrus (manusia dari kepala hingga pinggang, belakangnya kuda; wajah menghadap timur menurut Ṣūfī) dan as-Sab‘ (binatang buas yang digenggamnya), di selatan al-‘Aqrab dan Syujā‘; Ṣūfī: 37 bintang Qanthūrus dan 18 bintang as-Sab‘. Nama-nama ini dari gambar Yunani, bukan penamaan Arab. <b>asy-Syamārīkh</b> = tandan kurma tempat buahnya (cahaya bintang-bintangnya berdekatan); letaknya jauh di selatan dekat kutub tersembunyi. Ibn Qutaibah/al-Marzūqī: bintang banyak di depan dan bawah al-‘Aqrab antara az-Zubānayayn dan ‘Arsy as-Simāk, sesudah al-Mi‘laf; Ṣūfī menjadikannya seluruh bintang kedua rasi — menurut pensyarah riwayat Arab hanya menunjuk sebagian. Dua bintang paling selatan, hampir tak terlihat dari lintang utara (Irak, al-Jabal), ialah <b>al-Muḥlifān/al-Muḥnithān</b> (kaki depan Qanthūrus), dinamai karena orang bersumpah mengira salah satunya Suhail lalu melanggar sumpah. Penentuan Ṣūfī (Ḥaḍār = β Cen, al-Wazn = α Cen) menurut pensyarah hanya ijtihad tanpa riwayat Arab; ath-Thaqafī menyebut Ḥaḍār terlihat di Andalusia, sehingga mungkin keduanya bintang lain (α Eri dan α Phe). Rinci per bait di kotak catatan pensyarah.',
 tbl:[['حضار / الوزن','β & α Cen menurut penentuan Ṣūfī (ijtihad, bukan riwayat Arab)','Hadār, Wazn'],['الشماريخ','tandan; bintang-bintang jauh di selatan dekat kutub tersembunyi','Syamārīkh'],['المحلفان / المحنشان','dua bintang paling selatan (kaki depan Qanthūrus)','Muḥlifān / Muḥnisyān']],
 tr:[['Mengikutinya bintang-bintang yang berkelindan','semuanya mengelilingi al-Muḥlifayn'],['Engkau melihatnya di selatan al-‘Aqrab','di antaranya dan ufuk barat'],['Kebanyakan dari mereka gemilang dan bercahaya','ia diserupakan dengan singa yang garang'],['dan makhluk yang separuhnya manusia','dan separuhnya lagi kuda yang lincah'],['Bintang-bintangnya termasuk yang tergemilang','ia disebut Qanthūrus di kalangan Romawi'],['Orang Arab menamainya asy-Syamārīkh','dan semuanya dekat dengan kutub'],['Di bawahnya ada dua bintang','bagian dari gambar itu, keduanya gemilang'],['Keduanya bagaikan api yang menyala','tidak tampak di Irak dan al-Jabal'],['Keduanya adalah kaki bagi kuda pelari berekor panjang','dan dijuluki Ḥaḍār dan al-Wazn'],['Al-Muḥlifān nama keduanya di kalangan Arab','dan al-Muḥnithān juga julukan bagi keduanya']],
ck:{0:'Syarah (cetak 852–853): gambar ini terdiri dari dua rasi yang bertumpang tindih: Qanthūrus (manusia separuh kuda) dan as-Sab‘ (binatang buas yang digenggamnya), di selatan al-‘Aqrab dan Syujā‘. Ṣūfī: 37 bintang Qanthūrus (Ptolemeus 37) dan 18 bintang as-Sab‘ (Ptolemeus 19). Dua bintang di antaranya disebut al-Muḥlifān.',2:'Syarah (cetak 852): «singa/binatang buas» di sini = as-Sab‘, gambar binatang buas yang dipegang oleh makhluk lain (Qanthūrus); nama-nama ini berasal dari gambar Yunani, bukan dari penamaan Arab.',3:'Syarah (cetak 852, 855): Qanthūrus = manusia dari kepala hingga pinggang, bagian belakang tubuh seperti kuda yang berakhir di ekor, terletak di selatan al-Mīzān dengan wajah menghadap timur (Ṣūfī). «Mī‘at al-ḥiṣān» = awal larinya dan kegesitannya.',5:'Syarah (cetak 855–857): asy-Syamārīkh (jamak syumrūkh/syimrākh) = tandan kurma tempat buahnya, dinamai demikian karena cahaya bintang-bintangnya saling berdekatan; letaknya jauh di selatan, dekat kutub selatan yang tersembunyi dan tidak naik tinggi dari ufuk. Ibn Qutaibah dan al-Marzūqī: bintang-bintang banyak berjalan di depan dan bawah al-‘Aqrab, antara az-Zubānayayn dan ‘Arsy as-Simāk, sesudah al-Mi‘laf; sedangkan Ṣūfī menjadikannya seluruh bintang kedua rasi. Pensyarah: riwayat Arab hanya menunjuk sebagian, bukan seluruh bintang Qanthūrus dan as-Sab‘.',7:'Syarah (cetak 859): dua bintang ini adalah yang paling selatan di antara bintang-bintang kedua rasi, hampir tak terlihat dari lintang utara seperti Irak dan al-Jabal (wilayah Qazwīn).',8:'Syarah (cetak 859): «asy-syawā» = kaki-kaki kuda; «as-sābiḥ ar-rafn» = kuda yang berekor panjang; al-Khayl = «sawābiḥ». Dalam gambar, kedua bintang ini ialah kaki depan Qanthūrus.',9:'Syarah (cetak 859–862): al-Muḥlifān/al-Muḥnithān dinamai begitu karena orang yang melihat salah satunya mengira itu Suhail lalu bersumpah, kemudian ketahuan keliru lalu melanggar sumpah. Menurut pensyarah, penentuan Ṣūfī (Ḥaḍār = β Cen, al-Wazn = α Cen) hanyalah ijtihad, tanpa riwayat Arab yang menentukan; Ṣūfī menolak pendapat yang menjadikan keduanya dua bintang terang di luar gambar Kalb Akbar, padahal dalil-dalil lain tidak memastikan; ath-Thaqafī menyebut Ḥaḍār terlihat di Andalusia, sehingga ada kemungkinan keduanya ialah bintang lain (α Eri dan α Phe).'},

{g:'Janūb',id:'mjm',ok:1,ar:'المجمرة',idn:'Mujmirah (Pedupaan / Ara)',
 note:'Rasi Ara (syarah cetak 871 = PDF 901; 2 bait). Setelah Qanthūrus wa-Sab‘ terbit sekumpulan bintang samar; Yunani menamainya <b>al-Mujmirah</b> (wadah tempat kayu gaharu diletakkan di atas bara untuk dibakar). Klaim «tak ada nama dalam kitab Anwā’» DIKOREKSI pensyarah: bintang-bintang al-Mujmirah termasuk yang oleh Arab disebut <b>al-Khayl</b> dan <b>Aflā’ al-Khayl</b>, hamparan dekat al-‘Aqrab dan asy-Syawlah ke arah kiblat Irak, di depan asy-Syawlah dan di atas al-Majarrah (kutipan al-Marzūqī); uraian al-Khayl ada pada bagian Syujā‘. Rinci per bait di kotak catatan pensyarah.',

 ck:{0:'Syarah (cetak 871): setelah Qanthūrus wa-Sab‘ terbit sekumpulan bintang samar; Yunani menamainya al-Mujmirah, yakni wadah tempat kayu gaharu (‘ūd) diletakkan di atas bara untuk dibakar.',1:'Syarah (cetak 871): klaim «tak ada nama dalam kitab Anwā’» dikoreksi — yang benar, bintang-bintang al-Mujmirah termasuk bintang yang oleh Arab disebut al-Khayl dan Aflā’ al-Khayl, hamparan dekat al-‘Aqrab dan asy-Syawlah ke arah kiblat Irak, di depan asy-Syawlah dan di atas al-Majarrah (kutipan al-Marzūqī). Uraian al-Khayl ada pada bagian Syujā‘.'},

{g:'Janūb',id:'ikj',ok:1,ar:'الإكليل الجنوبي',idn:'Iklīl Janūbī (Mahkota Selatan / Corona Australis)',
 note:'Rasi Corona Australis (syarah cetak 875–876 = PDF 905–906; 3 bait). Bintang-bintang kecil berbentuk buah pinus (ṣanawbarah). Yunani menamainya al-Iklīl al-Janūbī untuk membedakannya dari al-Iklīl asy-Syamālī (= al-Fakkah); letaknya dekat an-Na‘ām al-Wārid dan aṣ-Ṣādir, di bawah waẓīf ar-Rāmī (Sagittarius; waẓīf = bagian kaki antara pergelangan dan betis). Klaim «tak terdengar dari Arab» DIKOREKSI: syarah mencetak bait lain «خبّر عنها الثقة المرضيُّ / بأنها القبة والأدحيُّ» — Arab menamainya <b>al-Qubbah</b> dan <b>al-Udhiyy</b> (Ibn Qutaibah, cetak 875). Riwayat berbeda (cetak 876): «al-Qubbah» karena bentuknya melingkar, di bawah asy-Syawlah; di belakang al-Qubbah ada aṣ-Ṣardān; sebagian lain: al-Udhiyy an-Na‘ām (tempat bertelur burung unta) karena di selatan an-Na‘āmayn. Rinci per bait di kotak catatan pensyarah.',
 tbl:null,
 tr:[['Menyusulnya bintang-bintang kecil','engkau melihatnya berbentuk buah pinus'],['Disebut di kalangan Romawi “Iklīl” (mahkota), dan tak','terdengar dari orang Arab tentang bintang-bintang itu sepatah kata pun'],['Letaknya di dekat waẓīf (tulang kaki bawah) si Pemanah','dekat dengan bintang-bintang an-Na‘ām']],
 ck:{0:'Syarah (cetak 875): Yunani menamainya al-Iklīl al-Janūbī untuk membedakannya dari al-Iklīl asy-Syamālī (= al-Fakkah); letaknya dekat an-Na‘ām al-Wārid dan aṣ-Ṣādir, di bawah waẓīf ar-Rāmī (Sagittarius). Waẓīf = bagian kaki antara pergelangan dan betis.',1:'Syarah (cetak 875–876): klaim «tak terdengar dari Arab» dikoreksi. Syarah mencetak bait lain: «خبّر عنها الثقة المرضيُّ / بأنها القبة والأدحيُّ» — orang tepercaya mengabarkan bahwa Arab menamai bintang-bintang ini al-Qubbah dan al-Udhiyy (Ibn Qutaibah, cetak 875). Riwayat berbeda (cetak 876): ada yang menamai «al-Qubbah» karena bentuknya melingkar, di bawah asy-Syawlah; sebagian: di belakang al-Qubbah ada aṣ-Ṣardān; sebagian lain: al-Udhiyy an-Na‘ām (tempat bertelur burung unta) karena di selatan an-Na‘āmayn.'},

{g:'Janūb',id:'hwj',ok:1,ar:'الحوت الجنوبي',idn:'Hūt Janūbī (Ikan Selatan / Piscis Austrinus)',
 note:'Rasi Piscis Austrinus (syarah cetak 881–882 = PDF 911–912; 3 bait). Sebagian bintangnya bercahaya, sebagian gelap; Romawi menamainya al-Hūt. Klaim «tak ada penyebutan dari Arab» DIKOREKSI: syarah mencetak bait ketiga lain «وقد مضى من ذكرها فيما مضى…» (sudah lalu penyebutannya secara garis besar), dan tidak mencetak bait «لم يأتنا عن أحد من العرب…» milik naskah ini. <b>Fam al-Hūt</b> = adh-Dhifda‘ al-Awwal (Fomalhaut, α PsA), sudah disebut pada Dalw; bintang-bintang al-Qaṭā yang oleh Arab dinamai itu sudah dibahas pada Rāmī (empat bintang kecil di atasnya dst.). Rinci per bait di kotak catatan pensyarah.',
 tbl:[['فم الحوت','Fomalhaut α PsA','Fam Hūt']],
 tr:[['Menyusulnya di antara bintang-bintang sejumlah bintang','sebagian bercahaya dan sebagian gelap'],['yang telah dinamai “al-Hūt” (Ikan) di kalangan Romawi','dan di kalangan mereka yang dikaitkan dengan bintang-bintang'],['Tidak datang kepada kami dari seorang pun bangsa Arab','penyebutan tentangnya, dan tidak pula ada gelar baginya']],
 ck:{2:'Syarah (cetak 881–882): klaim «tak ada penyebutan dari Arab» dikoreksi. Syarah mencetak bait ketiga yang lain: «وقد مضى من ذكرها فيما مضى / جملته فيها لذي الفهم رضا» (sudah lalu penyebutannya secara garis besar). Fam al-Hūt = adh-Dhifda‘ al-Awwal, yang sudah disebut pada Dalw; dan bintang-bintang al-Qaṭā yang oleh Arab dinamai itu sudah dibahas pada Rāmī (empat bintang kecil di atasnya dan sebagainya).'},

{g:'Penutup',id:'kht',ok:1,ar:'الخاتمة',idn:'Khātimah',
 note:'Penutup matan riwayat 1 (6 bait; hlm. cetak 72–73 = PDF 102–103; syarah cetak 888–892 = PDF 918–922). Bintang-bintang yang disebut berasal dari kitab para perawi (Ibn Kunāsah, Ibn al-A‘rābī, dan yang menukil dari mereka seperti Abū Ḥanīfah ad-Dīnawarī dan Ibn Qutaibah), bersumber dari ulama Kufah, Syam, dan lainnya. Syarah mencetak dua baris tambahan sesudah bait 4 («قد لقبتها العلما الأعلاطا…») yang tak ada di riwayat 1: <b>al-A‘lāṭ</b> = bintang tanpa nama (seperti unta betina «‘uluṭ» yang tak bertanda dan tak berkekang). <b>al-Maskhūlah</b> (dibaca pula «al-Maḥsūlah») = bintang yang diabaikan/tak diketahui, majhūlah dan mardzūlah (Tāj al-‘Arūs). Bait 6: «wālidunā» = Abū al-Ḥusayn ‘Abd ar-Raḥmān b. ‘Umar ar-Rāzī aṣ-Ṣūfī, dalam <i>Ṣuwar al-Kawākib ath-Thābitah</i>; riwayat 2 membaca «شيخنا» — perbedaan antarriwayat, bukan salah baca. Syarah mencetak pula tiga bait doa penutup (shalawat) yang tidak ada di riwayat 1. Rinci per bait di kotak catatan pensyarah.',
 tbl:null,
 tr:[['Maka bintang-bintang ini, yang','kami temukan dalam kitab-kitab para perawi'],['tertulis nama-namanya, dikenal','diambil dari para ulama Kufah'],['dan sebagiannya dari para ulama Syam','serta dari selain mereka, orang-orang yang berpemahaman'],['Dan di langit ada bintang-bintang lain selain mereka','yang tak kudengar nama-namanya dari mereka'],['Orang Arab mengenalinya dengan sebutan al-Maskhūlah','maksud mereka: yang ditinggalkan lagi tercela'],['Ayah kami menyebutkannya dalam kitab-kitabnya','maka hendaklah mencarinya siapa pun yang berhajat kepadanya']],
 ck:{0:'Syarah (cetak 888): bintang-bintang yang disebut dalam arjuzah ini = yang namanya tercatat dalam kitab para perawi (Ibn Kunāsah, Ibn al-A‘rābī, dan yang menukil dari mereka seperti Abū Ḥanīfah ad-Dīnawarī dan Ibn Qutaibah), bersumber dari ulama Kufah, Syam, dan lainnya.',3:'Syarah (cetak 888–889): syarah mencetak dua baris tambahan setelah bait ini — «قد لقبتها العلما الأعلاطا / وأسقطتها جملة إسقاطا» — yang tak ada di riwayat 1. Al-A‘lāṭ = bintang-bintang tanpa nama (seperti unta betina «‘uluṭ» yang tak bertanda dan tak berkekang; az-Zamakhsyarī, az-Zabīdī).',4:'Syarah (cetak 889–890): al-Maskhūlah (juga dibaca «al-Maḥsūlah») = bintang-bintang yang diabaikan/tak diketahui, majhūlah dan mardzūlah (Tāj al-‘Arūs).',5:'Syarah (cetak 892): «wālidunā» = Abū al-Ḥusayn ‘Abd ar-Raḥmān b. ‘Umar ar-Rāzī aṣ-Ṣūfī, dalam kitabnya Ṣuwar al-Kawākib ath-Thābitah; siapa menginginkan ilmu lebih silakan merujuk ke sana. Syarah mencetak tiga bait doa penutup sesudahnya (shalawat atas Nabi, sahabat, dan keluarga), tidak ada di riwayat 1 (6 bait).'},

{g:'Utara',id:'r2_dakb',ok:1,ar:'الدب الأكبر',idn:'Dubb Akbar (riwayat 2)',
 note:'Rasi Ursa Major, riwayat 2 (34 bait; syarah cetak 152–175 = PDF 182–205). «Ar-Rūm» = Yunani, yang menamainya Dubb Akbar; tujuh bintang terangnya serupa Dubb Ashghar (tiga melengkung di ekor, empat berbentuk segi empat di badan); prosa Ṣūfī mencatat 27 bintang di dalam gambar + 8 di luar. <b>an-Na‘sy</b> (bait 4) hanya empat bintang persegi — dalam riwayat ini juga «Banū Na‘sy / Āl Na‘sy» (bait 6) dan «Banāt» (bait 7) untuk tiga bintang yang menyusulnya; tujuh bintang seluruhnya = Banāt Na‘sy al-Kubrā (4 Na‘sy + 3 Banāt). KOREKSI NAMA (bait 9): bintang ke-5 dari tujuh bernama <b>al-Jaun</b>, bukan «al-Ḥūr» (naskah Gotha, catatan pinggir Princeton, Lisān al-‘Arab/Jamharah) dan bukan «al-Jawzā’» (Anwā’ Ibn Qutaibah = tashhif «al-Jaun»); pelaut kemudian menamainya «al-Khāfī». Syarah mencetak bait 9 dengan redaksi riwayat 1, syatr 2 riwayat ini («فيه عن النعش إذا سيم زون») tidak dikutip. <b>al-‘Anāq</b> (fathah ‘ain; Mizar, bait 11) = bintang ke-6, tengah dari tiga Banāt, «memeluk» <b>as-Suhā</b> (bintang kecil redup tepat di atasnya; juga as-Sitā, an-Nu‘aisy, ash-Shaidaq — bait 12–14; Ptolemeus tidak menyebutnya); bait 15–16 memuat perumpamaan «أريها السها وتريني القمر». <b>al-Qā’id</b> (bait 17) = bintang ke-7, ujung ekor (ke-27 Dubb Akbar); Ibn Qutaibah menghitung Banāt dari ujung ekor sehingga nomornya terbalik, namanya sama. «Taḥta» (bait 18) menunjuk letak pada gambar Beruang, bukan di langit. <b>al-Qafazāt</b> (juga an-Nawāfiz, an-Nafazāt, al-Qahīzāt, ats-Tsu‘ailibāt; bait 18–23) = enam bintang yang berpasangan (al-qarā’in); Ibn Qutaibah menyebut empat; «mā’in» = pendusta. <b>al-Hawdh</b> (bait 26–27): dalam kenyataan tidak kecil (lebih besar dari segi empat Na‘sy) dan bukan «mengikuti» Na‘sy melainkan mendahuluinya saat terbit; lingkarannya kosong tak berbintang. Bait 28–34 (kisah kijang yang lari dari Singa lalu tiba di al-Hawdh; Kabid al-Layts) dicatat dari matan; syarahnya belum dibaca ulang untuk bagian ini. Rinci per bait di kotak catatan pensyarah.',
 tbl:[["النعش","4 bintang persegi (≈ α,β,γ,δ UMa); juga «بنو نعش / آل نعش» (bait 3–6)","Na‘sy"],["البنات","3 bintang berderet menyusul Na‘sy (bait 5–7)","Banāt"],["الجون","bintang di antara tiga bintang yang paling dekat dengan persegi (bait 8; ≈ Alioth ε UMa)","Jaun"],["العناق","bintang terang yang menyusul al-Jaun (bait 10; ≈ Mizar ζ)","‘Anaq"],["السها / الستا / نعيش / الصيدق","bintang kecil gelap di atas al-‘Anaq; dipakai menguji ketajaman mata (bait 11–15; ≈ Alcor)","Suhā"],["القائد","bintang tunggal terang di belakang as-Suhā (bait 17; ≈ Alkaid η UMa)","Qā’id"],["القفزات / النوافز / القحيزات / الثعيلبات","bintang-bintang kecil di bawah Na‘sy dan Banāt, «jejak kijang yang melompat» (bait 18–23, 32; ≈ ν,ξ · λ,μ · ι,κ UMa)","Qafazāt"],["الظباء","bintang-bintang kecil sangat samar di depan Qafazāt (bait 24–25; dari matan)","Zhibā’"],["الحوض","tempelan bundar kecil tanpa bintang di belakang Na‘sy (bait 26–27; dari matan)","Hawdh"],["كبد الليث","bintang terang dekat burj Asad (bait 33–34; ≈ Cor Caroli)","Kabid al-Layts"]],
 tr:[['Di dekatnya ada bintang-bintang yang banyak,','benda-bendanya tampak lagi bercahaya.'],['bangsa Rum menamainya Beruang yang Lebih Besar,','dan menyerupakannya dengan (rasi) yang telah disebut terdahulu.'],['Di antara bintang-bintang beruang itu ada empat bintang,','tertata dalam rupa segi empat.'],['Engkau melihatnya setiap saat tampak jelas,','orang-orang badui menamainya Na‘sy.'],['Diikuti tiga bintang yang berurutan,','tampak bagi mata bila malam menggelap.'],['berhadapan dengan bintang-bintang al-Waḥsy,','disebut Banū Na‘sy dan Āl Na‘sy.'],['Dan kadang dinamai Banāt,','dan lisan para perawi sepakat'],['bahwa yang paling dekat dengan yang persegi','dari ketiga bintang yang berhimpun itu'],['dikenal oleh seluruh orang Arab dengan nama al-Jaun,','padanya, dari Na‘sy, bila ditimbang, «zūn» (makna belum pasti).'],['Kemudian yang mengikuti bintang ini','adalah bintang gemilang yang cahayanya dinamai'],['di kalangan Badui ‘Anāq, ketahuilah;','sedikit di atasnya ada bintang kecil yang suram.'],['Sebagian orang Badui menamainya as-Suhā,','dan dalam sebagian riwayat (disebut) as-Sitā.'],['Dan sekelompok orang menamainya Nu‘aisy,','yang punya hubungan dengan ilmu bintang,'],['dan sekelompok lain mengenalnya sebagai ash-Shaidaq,','dan datang dari orang yang berpengalaman lagi terpercaya'],['bahwa dengannya penglihatan diuji,','dan padanya pula ada perumpamaan yang beredar:'],['ucapan orang yang berkata, “Kuperlihatkan padanya Suhā,','sedang ia memperlihatkan bulan purnama kepadaku” — karena kebodohan dan kebutaan.'],['Dan sesudah bintang ini ada satu bintang tunggal,','cemerlang, bercahaya, bernama al-Qā’id.'],['Di bawah bintang-bintang Na‘sy dan Banat','ada bintang-bintang yang dikenal dengan al-Qafazāt (“lompatan-lompatan”),'],['berada di ujung-ujung beruang ini,','dekat dengan Banat dan as-Suhā.'],['Dan telah datang tentang mereka (sebutan) al-Qarā’in (“pasangan-pasangan”)','dari seorang perawi Badui yang tidak berdusta,'],['dan kadang engkau menamainya an-Nawāfiz,','sebab ia jejak-jejak kijang-kijang yang melompat.'],['Dan an-Nafazāt adalah nama bagi bintang-bintang berkilat itu,','dan al-Qahīzāt adalah nama yang diberikan orang Arab kepadanya.'],['Dan menurut kebanyakan perawi,','ia juga dikenal dengan ats-Tsu‘ailibāt (“rubah-rubah kecil”).'],['Mendahuluinya bintang-bintang kecil,','banyak, tak berbentuk (tak membentuk gambar),'],['amat tersembunyi (sangat samar),','dikenal orang Arab dengan adh-Dzibā’ (“kijang-kijang”).'],['Mendahuluinya sebidang kecil (ruang),','mengikuti Na‘sy, berbentuk bundar,'],['kosong, tidak memuat satu bintang pun,','dinamai al-Hawdh oleh para ulama.'],['Itu karena para ulama menyebutkan','bahwa pada suatu hari kijang-kijang itu terkejut ketakutan'],['oleh serangan Singa yang berada di dekat','bintang-bintang Beruang yang telah kami sebut,'],['dan bahwa mereka, karena takut, melompat,','lalu «dikumpulkan» bagian keselamatan di dalamnya — «khuzina… khuzna» (bacaan ragu; r1: «فحُزنَ… فيا حُزنا»).'],['kemudian mereka mendatangi al-Hawdh dalam keadaan aman,','selamat dari kejahatan singa hutan.'],['Maka tinggallah jejak-jejaknya di atas tanah,','maka bintang-bintang itulah lompatan-lompatan kijang.'],['Dan mengikuti rupa (Singa itu) sebuah bintang bercahaya,','yang dalam gelap malam kaulihat berkedip,'],['yang oleh orang Arab dijadikan “hati” bagi Singa,','letaknya dekat dengan rasi Asad.']],
 ck:{1:'Pensyarah: «الروم» di sini = Yunani (Rum); mereka menamai rasi ini Dubb Akbar (Beruang Besar). Tujuh bintang terangnya serupa susunan Dubb Ashghar: tiga melengkung di ekor, empat berbentuk segi empat di badan. Prosa Ash-Shufi mencatat 27 bintang di dalam gambar + 8 di luar. Syarah hal. 153.',3:'Pensyarah: «النعش» di bait ini hanya empat bintang persegi; dalam prosa Ash-Shufi disebut juga «سرير بنات نعش». Tujuh bintang seluruhnya = Banat Na‘sy al-Kubra (4 Na‘sy + 3 Banat). Redaksi bait ini di riwayat 2 sendiri: «قد لقبتها النعش أهل البادية». Syarah hal. 153–154.',8:'Syarah mencetak bait ini dengan redaksi riwayat 1 («يعرف بالجون لدى الأعراب / كذاك يروى عن ذوي الألباب»; cetak 158); syatr 2 riwayat ini «فيه عن النعش إذا سيم زون» tidak dikutip. KOREKSI NAMA — Pensyarah: nama bintang ini «الجون» (bukan «الحور»). «الحور» muncul di naskah Gotha dan catatan pinggir naskah Princeton (juga di Lisan al-‘Arab/Jamharah), sedangkan «الجوزاء» dalam Al-Anwa’ Ibn Qutaibah adalah tashhif dari «الجون». Pensyarah menguatkan «الجون» karena dipakai kebanyakan naskah Urjuzah dan Shuwar al-Kawakib, serta Marzuqi dan al-Mahri; Ash-Shufi teliti memilih nama dan menimbang kitab-kitab Anwa’. Bintang ke-5 dari tujuh, paling dekat dengan segi empat; kemudian juga dinamai «الخافي» oleh pelaut. Syarah hal. 158–162.',10:'Pensyarah: «عناق» (dengan fathah ‘ain) = bintang ke-6, yang tengah dari tiga Banat (Mizar), bernama demikian karena “memeluk” as-Suhā. Syarah hal. 162–163.',11:'Pensyarah: as-Suhā = bintang kecil redup tepat di atas ‘Anāq; nama lain: as-Sitā, an-Nu‘aisy, ash-Shaidaq. Ptolemeus tidak menyebutnya. Syarah hal. 163–164.',15:'Pensyarah: ini bunyi perumpamaan «أريها السها وتريني القمر» — dipakai untuk orang yang menawarkan sesuatu tetapi dijawab dengan hal yang berlawanan dengan maksudnya. Syarah hal. 164.',16:'Pensyarah: al-Qā’id = bintang ke-7 (ujung ekor), bintang ke-27 Dubb Akbar; Ibn Qutaibah menghitung Banat dari ujung ekor sehingga urutan nomornya terbalik terhadap Ash-Shufi, namanya sama. Syarah hal. 165.',17:'Pensyarah: «تحت» di sini menunjuk letak pada gambar Beruang (di tangan kanan dan kedua kakinya), bukan letak di langit terhadap bintang-bintang Na‘sy dan Banat. Naskah menggambarnya secara beragam; yang dipentingkan hanya agar pembaca tahu bentuknya. Syarah hal. 169.',19:'Pensyarah: «القرائن» = pasangan: al-Qafazāt ada enam bintang, tiap dua berpasangan (muqtaranān); Ibn Qutaibah menyebutnya empat bintang. «مائن» = pendusta (al-main = dusta). Syarah hal. 169–171.',25:'Pensyarah: «بقيعة صغيرة تالية للنعش» — dalam kenyataan al-Hawdh tidak kecil (lebih besar dari segi empat Na‘sy) dan bukan «mengikuti» Na‘sy, melainkan mendahuluinya saat terbit. Lingkaran itu kosong tak berbintang. Syarah hal. 175.'},

{g:'Utara',id:'r2_tnn',ok:1,ar:'التنين',idn:'Tinnin (riwayat 2)',
 note:'Rasi Draco, riwayat 2 (21 bait; syarah cetak 184–197 = PDF 214–227). Bintang-bintang Tinnin seperti hati yang melingkari kutub (baris «وأنجم التنين مثل القلب / دائرة محتفة بالقطب» dikutip syarah pada awal uraian; tidak ada di riwayat 1/Istanbul). Bintang pertama yang redup di lidah = <b>ar-Rāqish</b> (unta yang berlari kencang; dikutip syair Hassān); «al-Ayyim» (bait 3) = ular (al-ḥayyah), yakni Tinnin sendiri. <b>ar-Rubba‘</b> (bait 6) = anak unta yang lahir di awal musim semi, bintang redup di tengah. Nama «ar-Rifd» tidak ditemukan pensyarah pada Ibn ash-Shufi (kitabnya), al-Marzūqī, maupun Ibn Qutaibah; arti «rifd» (mangkuk besar) tak cocok, mungkin tashhif penyalin. <b>al-‘Awā’idz</b> (bait 8) = unta betina yang baru melahirkan: empat bintang besar dibayangkan sebagai induk yang melindungi anaknya (ar-Rubba‘) dari serigala. «An-Nasr» (bait 12) = an-Nasr al-Wāqi‘ (Vega), dekat di antara al-Farqadān dan al-‘Awā’idz, ikut melindungi ar-Rubba‘. <b>adz-Dzi’bān</b> (bait 19): «al-Harrān» (al-Harr) = shaqr (elang) dan «al-‘Awhaqān» (al-‘Awhaq) = gagak hitam atau burung lain (nama al-akhayyil) — nama-nama bagi dua bintang yang sama. <b>adz-Dzīkh</b> (bait 20) = ḍab‘ jantan (hyena), bintang terang di dekat Dzi’bān yang bersama mereka «mengincar» ar-Rubba‘ tetapi dihalangi al-‘Awā’idz dan an-Nasr. Baris «وربما سمي بالضبع / وهو مع الذئبين مغرى بالربع» (bait 21), dikutip syarah, tidak ada di riwayat 1. Rinci per bait di kotak catatan pensyarah.',
 tbl:[["الراقص","≈ μ Dra (Alrakis); bintang di lidah Tinnin","Raqish"],["العوائذ","≈ ν, β, ξ, γ Dra (4 bintang)","‘Awā’idz"],["الربع","bintang kecil di tengah ‘Awā’idz (anak unta); juga disebut «ar-Rafd» (bait 6, 8) — kemungkinan tashhif","Rubba‘"],["الأثافي","3 bintang samar (≈ δ,ε,χ Dra)","Atsāfī"],["الذئبان / الحران / العوهقان","dua bintang yang sama; ≈ ζ & η Dra","Dzi’ban"],["أظفار الذئب","2 bintang gelap menyusul Atsāfī (≈ f & ω Dra)","Azhfār"],["الذيخ","hyena jantan; juga disebut adh-Dhab‘ (bait 21); bintang terang dekat Dzi’ban (≈ ι Dra, Edasich)","Dzikh"]],
 tr:[['Dan bintang-bintang Tinnin (Naga) itu bagaikan hati,','lingkaran yang mengelilingi kutub.'],['Yang pertama darinya sebuah bintang samar cahayanya,','tidak bersinar dan tidak pula besar.'],['Ia dikenal dengan ar-Rāqish di kalangan kaum itu,','dan ia berada di ujung lidah sang Ular (al-Ayyim).'],['Mengikutinya bintang-bintang yang berhimpun,','jumlahnya bila dihitung ada empat,'],['mengelilingi sebuah bintang samar','yang dapat dilihat oleh orang bermata tajam lagi cerdas.'],['Ia dikenal di kalangan ulama dengan nama ar-Rubba‘,','dan ar-Rifd pun tentangnya terdengar dari mereka.'],['Dan keempat bintang besar itu,','telah sampai kepada kami kabar dari mereka'],['bahwa mereka menyangkanya unta-unta betina yang baru beranak (‘awā’idz),','dan menyangka ar-Rifd berlindung kepada mereka,'],['karena takut pada sebuah bintang yang mereka namai adz-Dzi’b (serigala),','yang kaulihat letaknya dekat dengannya.'],['Mereka mengira ia mengincar ar-Rubba‘,','padahal dalam merampasnya tak ada harapan baginya,'],['sebab bintang-bintang yang terang itu','menolak gangguan darinya sekuat tenaga.'],['Dan an-Nasr (Burung Nasar) pun menaruh iba kepadanya,','maka sang serigala tak dapat mencapainya.'],['Mengikutinya tiga bintang samar,','bukan yang cemerlang dan bukan yang bersinar,'],['seperti bunga aqhuwan yang mulai mengering,','dikenal orang Arab dengan al-Atsāfī (“batu tungku”).'],['Sesudahnya dua bintang gelap,','keduanya berdekatan satu sama lain.'],['Keduanya, kata mereka, kuku-kuku sang serigala,','demikianlah kabar yang sampai dari mereka.'],['Dan serigala itu bintang yang telah kami sebut kabarnya,','seakan kuku-kuku itu menyusuri jejaknya.'],['Dan sesudah serigala ini ada pula serigala (lain),','wujudnya dekat dengan wujud (yang pertama).'],['Orang Arab menamai keduanya adz-Dzi’bān,','dan kadang keduanya disebut al-Harrān,'],['dan al-‘Awhaqān pula telah kami dengar tentang keduanya,','sedangkan adz-Dzikh adalah nama bintang yang menyusul keduanya.'],['Dan kadang ia dinamai adh-Dhab‘ (hyena),','ia bersama dua serigala itu mengincar ar-Rubba‘.']],
 ck:{0:'Syarah mengutip baris «وأنجم التنين مثل القلب / دائرة محتفة بالقطب» pada awal uraian Tinnin; baris ini tidak ada di riwayat 1 (Istanbul).',2:'Pensyarah: «الأيم» = ular (al-ḥayyah), yakni Tinnin sendiri; bintang ini terletak di lidah Tinnin. ar-Rāqish = unta yang berlari kencang (dikutip syair Hassān). Syarah hal. 187.',5:'Pensyarah: ar-Rubba‘ = anak unta yang lahir di awal musim semi. Nama «الرفد» tidak ia temukan pada Ibn ash-Shufi (kitabnya), al-Marzuqi, maupun Ibn Qutaibah; arti «rifd» (mangkuk besar) tak cocok dengan bintang ini, mungkin tashhif dari penyalin. Syarah hal. 188.',7:'Pensyarah: «العوائذ» = unta betina yang baru melahirkan; keempat bintang dibayangkan sebagai induk-induk unta yang melindungi anaknya (ar-Rubba‘, bintang kecil di tengahnya). Syarah hal. 188.',11:'Pensyarah: «النسر» yang dimaksud = an-Nasr al-Wāqi‘ (Vega), yang letaknya dekat di antara al-Farqadān dan al-‘Awā’idz; ia digambarkan ikut melindungi ar-Rubba‘ dari serigala. Syarah hal. 191.',18:'Pensyarah: «الحرين» (al-Harr) = shaqr (elang); «العوهقين» (al-‘Awhaq) = gagak hitam, atau burung lain (nama al-akhayyil). Nama-nama itu bagi dua bintang yang sama. Syarah hal. 195–196.',19:'Pensyarah: «الذيخ» = ḍab‘ jantan (hyena), bintang terang di dekat Dzi’bān; bersama mereka ia “mengincar” ar-Rubba‘, tetapi dihalangi oleh al-‘Awā’idz dan an-Nasr. Syarah hal. 197.',20:'Syarah mengutip baris «وربما سمي بالضبع / وهو مع الذئبين مغرى بالربع» setelah bait adz-Dzikh; baris ini tidak ada di riwayat 1. Dzikh = ḍab‘ jantan (hyena), lihat catatan bait 19.'},

{g:'Utara',id:'r2_qiq',ok:1,ar:'قيقاوس',idn:'Qiqawus (riwayat 2)',
 note:'Rasi Cepheus, riwayat 2 (20 bait; syarah cetak 203–215 = PDF 233–245). Nama benar menurut Ibn aṣ-Ṣalāḥ «قيفاوس» (Kepheus, raja Etiopia), bukan «قيقاوس» (tashhif yang masyhur). Orang Arab sebenarnya tidak menamai rasi ini «al-Multahib»; bagi mereka ia petak langit yang bintang-bintang sampingnya disebut <b>ash-Shā’</b> (bintang-bintang redup di badan Qiqāwus dan antaranya dengan al-Jady, bait 17); redaksi riwayat kedua dinilai lebih tepat. <b>ar-Rā‘ī</b> (si gembala) dan <b>Kalb ar-Rā‘ī</b> (bait 6) = bintang kecil menyendiri dekat kaki kiri, terpisah dari ar-Rā‘ī yang lebih terang (al-Marzūqī juga membedakannya). <b>Najmā al-Farq</b> (bait 13): bacaan yang benar «al-Farq» (belahan rambut di puncak kepala), bukan «al-Qarn» (tanduk) seperti pada sebagian perawi; Ibn ash-Shufi menolak «al-Qarn» karena jarak kedua bintang itu seperti belahan rambut. <b>al-Qarhah</b> (bait 15) = belang putih di dahi kuda di antara kedua telinga; bintangnya amat kecil, dekat dua bintang al-Farq. <b>al-Qidr</b> (bait 20) = gugus bintang kecil redup yang membentuk lingkaran, di atas dua bintang al-Farq. Penulis mencatat perbedaan riwayat para perawi soal bintang sisa (al-bawāqī) dan hanya memuat yang sahih menurutnya. Rinci per bait di kotak catatan pensyarah.',
 tbl:[["الراعي","bintang paling terang (≈ γ Cep, Errai)","Rā‘ī"],["كلب الراعي","bintang kecil menyendiri dekat kaki kiri (≈ ρ / π Cep, identifikasi lama)","Kalb ar-Rā‘ī"],["الشاء / الأغنام","bintang-bintang redup di bawah Kalb ar-Rā‘ī dan di badan Qiqāwus","Shā’"],["كوكبا الفرق","dua bintang berkilau (≈ β Alfirk, α Alderamin Cep); «belahan rambut»","Farq"],["القرحة","bintang amat kecil di atas Farq; belang putih di dahi kuda (≈ ξ Cep)","Qurhah"],["القدر","gugus kecil redup berbentuk lingkaran di atas Farq","Qidr"],["الأبيض","bintang di bahu rasi, disusul bintang-bintang kecil (bait 10); nama Arab menurut matan","Abyadh"]],
 tr:[['Menyusul bintang-bintang yang telah berlalu,','bintang-bintang yang dinamai oleh bangsa Rum'],['Qiqāwus, dan ia juga disebut al-Multahib,','sedangkan bintang-bintang itu dinamai orang Arab ash-Shā’ (domba).'],['Yang pertama darinya sebuah bintang kecil,','tak punya cahaya di antara bintang-bintang.'],['Menyusulnya bintang yang gemerlap sinarnya,','jarak antara keduanya sejarak satu depa.'],['Di antara keduanya ada bintang kecil rupanya,','hampir tak tampak oleh orang yang memandangnya.'],['Keduanya sejarak sehasta darinya,','orang Arab menamainya Kalb ar-Rā‘ī (anjing sang penggembala).'],['Kaulihat ia menyendiri dari yang serupa dengannya,','dan yang paling terang dikenal sebagai ar-Rā‘ī, dan'],['para perawi berselisih tentang bintang-bintang selebihnya,','sehingga mereka tak sepakat mengenainya.'],['Namun aku akan menyebut yang sahih','dan meninggalkan yang diperselisihkan lagi tertolak:'],['Kaulihat di bahu rupa ini','sebuah bintang yang diikuti bintang-bintang kecil,'],['ia menyingkap bagi yang memandang kabut (aẓ-ẓubāb),','orang Arab menamainya al-Abyadh (yang putih).'],['dan sebuah bintang gemilang di atas ikat pinggang,','didahului bintang-bintang yang tersusun rapi:'],['dua bintang berkilau lagi gemilang,','dijuluki dengan dua bintang al-Farq,'],['di atas keduanya sebuah bintang amat kecil,','yang terhitung dalam gambar bagaimanapun dihitung,'],['seakan-akan tertutup tirai,','orang Arab mengenalnya dengan al-Qurhah (“belang di dahi”).'],['Engkau melihat dalam keseluruhan rupa ini','bintang-bintang kecil lagi banyak,'],['samar, gelap wujudnya,','dikenal dengan ash-Shā’ dan al-Aghnām.'],['Dan pada lengan rupa al-Multahib','ada dua bintang berkilau seperti nyala api,'],['menyusul keduanya bintang-bintang kecil','dalam petak cekung yang bundar,'],['para ahli mengenalnya dengan al-Qidr,','dan sesudah kusebut apa yang telah kudengar.']],
 ck:{1:'Pensyarah: nama yang benar menurut Ibn aṣ-Ṣalāḥ ialah «قيفاوس» (Kepheus, raja Etiopia), bukan «قيقاوس» (tashhif yang masyhur). Orang Arab sebenarnya tidak menamai rasi ini «الملتهب»; bagi mereka ia petak langit yang bintang-bintang sampingnya disebut ash-Shā’; redaksi riwayat kedua dinilai lebih tepat. Syarah hal. 207–208.',5:'Pensyarah: Kalb ar-Rā‘ī = bintang kecil menyendiri dekat kaki kiri, terpisah dari ar-Rā‘ī yang lebih terang (al-Marzuqi juga membedakannya). Ia lebih condong pada bintang yang dilingkari di gambar. Syarah hal. 208–209, 214.',12:'Pensyarah: bacaan yang benar «الفرق» (belahan rambut di puncak kepala), bukan «القرن» (tanduk) seperti pada sebagian perawi; Ibn ash-Shufi menolak «القرن» karena jarak kedua bintang itu seperti belahan rambut. Syarah hal. 211–212.',14:'Pensyarah: «القرحة» = belang putih di dahi kuda di antara kedua telinga; bintangnya amat kecil, dekat dengan dua bintang al-Farq. Syarah hal. 212–213.',16:'Pensyarah: ash-Shā’ = bintang-bintang redup di badan Qiqāwus dan antaranya dengan al-Jady; ar-Rā‘ī berbeda darinya karena lebih terang. Syarah hal. 209.',19:'Pensyarah: al-Qidr = gugus bintang kecil redup yang membentuk lingkaran, di atas dua bintang al-Farq. Syarah hal. 215.'},

{g:'Utara',id:'r2_awa',ok:1,ar:'العوّاء',idn:'‘Awwā’ (riwayat 2)',
 note:'Rasi Bootes, riwayat 2 (16 bait; syarah cetak 224–236 = PDF 254–266). Bait pembuka beredar dalam tiga redaksi; pensyarah memilih «حارس السماء» (terjemah Yunani Arctophylax, “penjaga”), sedangkan «حارث السماء» dan «حارس السماك» = tashhif. <b>aṣ-Ṣannāj / an-Nā‘ir (an-Na‘‘ār) / aṣ-Ṣayyāḥ / al-Baqqār</b> (bait 4) adalah terjemah nama Yunani Boōtēs («yang berteriak», «penggiring sapi»), bukan nama Arab asli; al-Baqqār boleh jadi karena Dubb Akbar dahulu dibayangkan pedati sapi. <b>adh-Dhibā‘</b> (hyena; bait 5–6) = bintang-bintang samar di telapak tangan, bersama bintang kecil di kepala, bahu, dan tongkat (11 bintang); Ibn Qutaibah menempatkannya di bawah Banāt Na‘sy. <b>as-Simāk ar-Rāmih</b> (Arcturus; bait 7) = bintang ke-4 terterang di langit; «Rāmih» (penombak) membedakannya dari as-Simāk al-A‘zal (Spica) karena dua bintang di sekelilingnya bagaikan tombak baginya; bintang samar di sekitarnya = <b>as-Silāh</b> (bait 8–9); al-Marzūqī juga menyebutnya «ذو السلاح». <b>Rāyat as-Simāk</b> (bait 10–11) = dua bintang gelap di dekatnya, hanya terlihat oleh mata sangat tajam. <b>Rāyat al-Fakkah / Tābi‘ as-Simāk</b> (bait 12–14) = dua bintang di tumit bersama bintang ke-16 di ujung tombak; dalam Almagest termasuk gambar ‘Awwā’. Bait 15: dalam kutipan Ibn ash-Shufi bintang ke-20 di betis kiri = <b>ar-Rumh</b> dan dua bintang penyertanya = as-Silāh; «‘adzabah» = secarik kain yang diikat di kepala tombak, tiap pasang bintang samar di ujung tombak disebut ‘adzabah, dan dua yang terang = ramh as-Simāk. Bait 16 («أن الرقيب اسم السماك الرامح») adalah bait tambahan yang dikutip syarah, tidak ada di riwayat 1: ar-Raqīb = nama as-Simāk ar-Rāmih. Rinci per bait di kotak catatan pensyarah.',
 tbl:[["السماك الرامح","Arcturus (α Boo), bintang seperti obor; juga ar-Raqīb (bait 7, 16)","Simāk Rāmih"],["الضباع","bintang-bintang kecil redup di telapak rasi (bait 5–6; dari matan)","Dhibā‘"],["السلاح","bintang-bintang kecil gelap di sekitar dua bintang terang (bait 8–9; dari matan)","Silāh"],["راية السماك","dua bintang gelap dekat bintang terang, di sabuk ‘Awwā’ (bait 10–12)","Rāyat Simāk"],["رمح السماك","dua bintang terang (bait 15)","Rumh"],["راية الفكة","bintang-bintang yang dijadikan panji al-Fakkah (bait 14; dari matan)","Rāyat Fakkah"]],
 tr:[['Kami mulai membahas bintang-bintang al-‘Awwā’,','yang dinamai Hāris as-Samā’ (Penjaga Langit).'],['Dan Hāris as-Simāk serta (Hāris) asy-Syimāl,','telah dikabarkan kepada kami dengan ucapan-ucapan ini'],['oleh para terpercaya ahli ilmu bintang,','dari sekelompok cendekia bangsa Rum,'],['dan ia yang dikenal dengan an-Na‘‘ār,','ya, juga dengan aṣ-Ṣayyāḥ dan al-Baqqār.'],['Yang pertama darinya bintang-bintang kecil,','berada di telapak tangan rupa ini,'],['tanpa cahaya, tiada pula sinar,','dikenal orang Arab dengan adh-Dhibā‘ (“para hyena”).'],['Dan ada pula sebuah bintang bagaikan meteor yang berkilau,','mereka menamainya as-Simāk ar-Rāmih (si “penombak”),'],['bagi dua bintang di tengah rupa itu,','di sekeliling keduanya ada bintang-bintang kecil.'],['samar, gelap wujud-wujudnya,','dikenal orang Arab dengan as-Silāh (senjata).'],['Mendahuluinya sebuah bintang dari kedua itu,','dekat dengan dua bintang yang gelap;'],['Keduanya terlihat oleh yang berpandangan tajam,','dinamai Rāyat as-Simāk (bendera as-Simāk).'],['Mereka berada di ikat pinggang al-‘Awwā’,','dan sesudah bintang yang gemerlap ini'],['sebuah bintang, mengikutinya dua bintang,','keduanya digambarkan di tumit;'],['semuanya terhitung dalam as-Sabakah,','mereka menjadikannya bendera bagi al-Fakkah.'],['maka dua yang terang dijadikan di kalangan Arab','tombak as-Simāk, dan dua yang samar (disebut) ‘Adzab.'],['Dan berkata seorang yang berilmu dan unggul keutamaannya','bahwa ar-Raqīb adalah nama as-Simāk ar-Rāmih.']],
 ck:{0:'Pensyarah: bait pembuka ini punya tiga redaksi antarnaskah («حارس السماء» / «حارث السماء» dll.); ia memilih «حارس السماء» (terjemah Yunani Arctophylax, “penjaga”) dan menganggap «حارث» dan «حارس السماك» sebagai tashhif. Nama-nama ini terjemahan Yunani, bukan nama Arab asli. Syarah hal. 224–228.',3:'Pensyarah: aṣ-Ṣannāj, aṣ-Ṣayyāḥ, an-Na‘‘ār, dan al-Baqqār adalah terjemah dari nama Yunani Boōtēs (“yang berteriak”, “penggiring sapi”), bukan nama Arab asli; al-Baqqār boleh jadi karena Dubb Akbar dahulu dibayangkan sebagai pedati sapi. Syarah hal. 226–227.',5:'Pensyarah: adh-Dhibā‘ = hyena; tiga bintang samar di telapak tangan, bersama bintang-bintang kecil di kepala, bahu, dan tongkat (11 bintang). Ibn Qutaibah menempatkannya di bawah Banat Na‘sy. Syarah hal. 231–232.',6:'Pensyarah: as-Simāk ar-Rāmih = Arcturus, bintang ke-4 terterang di langit; disebut «Rāmih» (penombak) untuk membedakannya dari as-Simāk al-A‘zal (Spica), karena dua bintang di sekelilingnya bagaikan tombak baginya; bintang-bintang samar di sekitarnya = as-Silāh. Syarah hal. 228, 232.',10:'Pensyarah: dua bintang gelap di dekat bintang itu dinamai Rāyat as-Simāk (“bendera as-Simāk”), hanya terlihat oleh orang bermata sangat tajam; al-Marzuqi juga menyebut as-Simāk ar-Rāmih dengan nama «ذو السلاح». Syarah hal. 234.',12:'Pensyarah: dua bintang di tumit (bersama bintang ke-16 di ujung tombak) disebut Rāyat al-Fakkah (“bendera Fakkah”) dan Tābi‘ as-Simāk; dalam Almagest mereka termasuk bintang gambar ‘Awwā’. Syarah hal. 235.',14:'Pensyarah: dalam kutipan Ibn ash-Shufi, bintang ke-20 di betis kiri disebut ar-Rumh (tombak) dan dua bintang yang menyertainya as-Silāh; dua bintang berdekatan di ikat pinggang (ke-17 dan 18) diserupakan dengan tombak, sedangkan «‘adzabah» = secarik kain yang diikat di kepala tombak; tiap pasang bintang samar di ujung tombak itu disebut ‘adzabah, dan dua yang terang = ramh as-Simāk. Syarah hal. 233, 236.'},

{g:'Utara',id:'r2_fak',ok:1,ar:'الفكّة',idn:'al-Fakkah (riwayat 2)',
 note:'Rasi Corona Borealis, riwayat 2 (5 bait; syarah cetak 244–245 = PDF 274–275). Bintang-bintang tak bersinar terang di belakang ‘Awwā’. Bintang terang di dalamnya = Munīr al-Fakkah (Alphecca), bintang kedua dari al-Fakkah, magnitudo kedua; kata Ibn ash-Shufi, bentuk lingkarannya dikenal anak kecil dan orang dewasa (bait 2). <b>Qash‘at al-Aytām / al-Masākīn</b> (mangkuk anak yatim/orang miskin; bait 3) disebut demikian karena lingkaran bintang itu bercelah (gompal), seperti mangkuk pecah yang tak laku dijual. <b>al-Iklīl</b> (bait 4) di sini = al-Iklīl asy-Syamālī (Mahkota Utara), untuk membedakannya dari al-Iklīl al-Janūbī; Rum menamainya sama. Bait 5: meski Ibn ash-Shufi mengaku tak punya kabar dari Arab, Ibn Qutaibah dan al-Marzūqī menyebut al-Fakkah (di belakang as-Simāk ar-Rāmih) sebagai bintang melingkar bercelah. Rinci per bait di kotak catatan pensyarah.',
 tbl:[["منير الفكة","Alphecca α CrB; bintang kedua al-Fakkah, magnitudo 2","Munir"],["قصعة الأيتام / المساكين","lingkaran bintang bercelah (≈ Corona Borealis); nama awam; = al-Fakkah","Qash‘ah"]],
 tr:[['Dan kami sebut al-Fakkah setelah al-‘Awwā’,','yaitu bintang-bintang yang telah kehilangan sinar,'],['dikenal oleh yang kecil dan yang besar,','dan di antaranya ada satu bintang terang,'],['mereka dinamai oleh orang awam','di setiap negeri “Qash‘at al-Aytām” (mangkuk anak yatim),'],['sedang di kalangan ahli ilmu bintang','mereka dinamai al-Iklīl, begitu pula di kalangan bangsa Rum,'],['Dan tentang mereka tak ada kabar padaku','dari orang-orang Arab yang dapat kukabarkan tentangnya.']],
 ck:{1:'Pensyarah: bintang terang itu = Munir al-Fakkah (Alphecca), bintang kedua dari al-Fakkah, magnitudo kedua; kata Ibn ash-Shufi, bentuk lingkarannya dikenal anak kecil dan orang dewasa. Syarah hal. 244–245.',2:'Pensyarah: «قصعة الأيتام / المساكين» = mangkuk anak yatim/orang miskin; disebut demikian karena lingkaran bintang itu bercelah (gompal), seperti mangkuk yang pecah sehingga tak laku dijual. Syarah hal. 245.',3:'Pensyarah: «إكليل» di sini = al-Iklīl asy-Syamālī (Mahkota Utara), dinamai demikian untuk membedakannya dari al-Iklīl al-Janūbī. Syarah hal. 245.',4:'Pensyarah: meski Ibn ash-Shufi mengaku tak punya kabar dari Arab, Ibn Qutaibah dan al-Marzuqi menyebut al-Fakkah (di belakang as-Simāk ar-Rāmih) sebagai bintang melingkar bercelah. Syarah hal. 244.'},

{g:'Utara',id:'r2_jat',ok:1,ar:'الجاثي على ركبته',idn:'al-Jāts-ī ‘alā Rukbatih (riwayat 2)',
 note:'Rasi “yang berlutut” (Hercules). Bintang pertama di dahi/alis = <b>Kalb ar-Rā‘ī</b>, dekat bintang terang yang kelak disebut sebagai <b>ar-Rā‘ī</b>; penulis menunda ulasannya sampai rasi <b>al-Hawwā’</b> (Ophiuchus). Bintang-bintang di tangan dan kaki; di dekatnya <b>Qash‘at al-Aytām</b> (Fakkah). Kelompok redup di antara kaki dan sabuk = <b>adh-Dhibā‘</b> / <b>an-Nasaq asy-Syāmī</b>. Satu bintang berbentuk kaki-bawah (<i>ka‘b</i>); sekitarnya bintang-bintang menyala yang oleh Arab dikenal sebagai <b>at-Tamātsīl</b>. 13 bait.',
 tbl:[["كلب الراعي","≈ Rasalgethi α Her; bintang pertama di dahi/alis Jāthī","Kalb Rā‘ī"],["الراعي","bintang lebih terang; milik rasi al-Hawwā’, bukan Jāthī","Rā‘ī"],["النسق الشامي","deretan bintang redup dari tangan Jāthī melintasi dada ke tangan satunya (≈ τ Ser, β,γ,κ,δ,λ,μ,ο,ν,ξ Her)","Nasaq Syāmī"],["الضباع","bintang-bintang redup tersebar di antara bentuk kaki dan sabuk (bait 9–11; dari matan)","Dhibā‘"],["الكعب / النسق","bintang berbentuk tumit kaki kiri; kadang disebut nasaq (bait 11–12; dari matan)","Ka‘b"],["التماثيل","bintang-bintang menyala di sekitar Ka‘b (bait 13; dari matan)","Tamātsīl"]],
 tr:[['Kami sebutkan pula Jāthī yang bertumpu di atas lututnya','dan segala yang dihafal (dicatat) dalam rupanya'],['Yang pertama kami sebut dari bintang-bintangnya','ialah sebuah bintang di dahinya atau di alisnya'],['Orang Arab menjulukinya Kalb ar-Rā‘ī (Anjing Gembala)','di dekat sebuah bintang yang bersinar berkilau'],['(Bintang itu) dikenal dengan nama ar-Rā‘ī (Sang Gembala), dan ini lebih terang','letaknya di atas dahi al-Hawwā’'],['Penyebutannya akan datang nanti','apabila hitungan sampai kepada al-Hawwā’'],['Mengikutinya bintang-bintang yang berbaris','cahayanya sedikit dan redup'],['Dekat dengan Qash‘at al-Aytām,','dinamai an-Nasaq asy-Syāmī.'],['Bintang-bintang yang disebut ini','terletak pada kedua tangan dan kaki rupa ini,'],['dan berkata sebagian ahli ilmu ini','bahwa yang kaulihat dari bintang-bintang'],['di antara bentuk kakinya dan ikat pinggangnya','adalah bintang-bintang pudar yang terpencar,'],['dikenal dengan adh-Dhibā‘ di kalangan Arab,','diikuti sebuah bintang berupa bentuk tumit'],['dari kaki kirinya, dan kadang disebut an-Nasaq,','dan kitab-kitab Anwā’ semuanya bersepakat'],['bahwa di sekelilingnya ada bintang-bintang yang menyala,','orang Arab mengenalnya dengan at-Tamātsīl (rupa-rupa/patung-patung).']],
 ck:{3:'Syarah hal. 252: bintang kedua ini bernama ar-Rā‘ī, lebih terang daripada Kalb ar-Rā‘ī, tetapi termasuk rasi lain (al-Hawwā’) yang bersebelahan dengan Jāthī, di atas dahi al-Hawwā’; dibahas lagi pada rasi al-Hawwā’ karena bukan bagian bintang rasi ini.',6:'Syarah hal. 255: an-Nasaq asy-Syāmī = deretan bintang dari tangan Jāthī melintasi dadanya ke tangan satunya; disebut Syāmī karena terbenam di sisi Syam (utara), berbeda dari an-Nasaq al-Yamānī yang terbenam di sisi Yaman (selatan). Qash‘ah al-Aytām = al-Fakkah.'},

{g:'Utara',id:'r2_sal',ok:1,ar:'السلياق',idn:'Saliyāq (riwayat 2)',
 note:'Rasi Lyra, riwayat 2 (7 bait; syarah cetak 265–269 = PDF 295–299). Nama-nama (<b>as-Saliyāq, al-Awz, al-Mi‘zafah, ash-Shanj, as-Sulahfāh, al-Lūrā’</b>) bukan Arab dan tidak ada dalam kitab anwā’ Arab; semuanya dipinjam dari tradisi Yunani — Saliyāq dari sambuke (harpa), Lūrā dari Lyra, Sulahfāh (penyu) dari mitos cangkang penyu sebagai badan alat musik ini; asal nama al-Awz tidak diketahui pensyarah (rasi terdekat bergambar angsa/ayam, ath-Thā’ir). <b>an-Nasr al-Wāqi‘</b> (Vega; bait 6): disebut Wāqi‘ karena dua bintang di sisinya dan tiga bintang itu membentuk segitiga yang seakan dua sayapnya terlipat, berbeda dari an-Nasr ath-Thā’ir (Altair) yang sayapnya terbentang; orang awam menyebutnya al-Ātsāfī, para astronom Yunani al-Awzah. <b>al-Azhfār</b> (kuku) = bintang kecil yang mengikutinya (dari matan). Rinci per bait di kotak catatan pensyarah.',
 tbl:[["النسر الواقع","Vega α Lyr; segitiga dengan dua bintang di sisinya (sayap terlipat) — beda dengan Nasr Thā’ir/Altair yang sayapnya terbentang","Nasr Wāqi‘"],["السلياق / الأوز / المعزفة / الصنج / السلحفاة / اللوراء","nama-nama non-Arab, dipinjam dari tradisi Yunani","Saliyāq"],["الأظفار","bintang-bintang kecil yang diikuti an-Nasr (bait 7; dari matan)","Azhfār"]],
 tr:[['Kini kami sebutkan, dalam satu deretan,','bintang-bintang yang dikenal dengan nama as-Saliyāq'],['Juga dengan al-Awz — ketahuilah — dan al-Mi‘zafah','ia dikenal dengan ash-Shanj oleh ahli pengetahuan'],['Dan dengan as-Sulahfāh (penyu) dan dengan al-Lūrā’','demikianlah dikabarkan oleh kitab-kitab anwā’'],['Bintang-bintang yang kau lihat cemerlang','tiga di antaranya dinamai an-Nasr (Rajawali)'],['Di antaranya ada sebuah bintang bersinar, termasyhur','cahayanya gemilang dan terang'],['Ia menyambar mata dengan cahayanya yang berkilau','orang Arab mengenalnya dengan nama Nasr Wāqi‘ (Rajawali yang Jatuh)'],['Dan an-Nasr menyusul bintang-bintang kecil,','yang dinamai orang Arab al-Azhfār (kuku-kuku).']],
 ck:{0:'Syarah hal. 265–267: nama-nama ini (as-Saliyāq, al-Awz, al-Mi‘zafah, ash-Shanj, as-Sulahfāh, al-Lūrā’) bukan Arab dan tidak ada dalam kitab anwā’ Arab; semuanya dipinjam dari tradisi Yunani — Saliyāq dari sambuke (harpa), Lūrā dari Lyra, Sulahfāh (penyu) dari mitos cangkang penyu sebagai badan alat musik ini. Asal nama al-Awz tidak diketahui pensyarah; rasi terdekat bergambar angsa/ayam (ath-Thā’ir).',5:'Syarah hal. 268–269: disebut Nasr Wāqi‘ karena dua bintang di sisinya dan tiga bintang itu membentuk segitiga yang seakan dua sayapnya terlipat; berbeda dengan an-Nasr ath-Thā’ir (Altair) yang sayapnya terbentang. Orang awam menyebut Wāqi‘ ini al-Ātsāfī; para astronom Yunani menyebutnya al-Awzah.'},

{g:'Utara',id:'r2_daj',ok:1,ar:'الدجاجة',idn:'Dajājah (riwayat 2)',
 note:'Rasi Cygnus, riwayat 2 (6 bait; syarah cetak 276–278 = PDF 306–308). Dikenal sebagai <b>aṭ-Ṭā’ir</b> dan <b>ad-Dajājah</b>. Jumlah <b>al-Fawāris</b> (bait 3) berbeda antarsumber: Ibn Qutaibah menyebut lima bintang berbaris di belakang Nasr Wāqi‘ dengan ar-Radf di belakangnya; al-Marzūqī dan Ṣūfī (Suwar al-Kawākib) menyebut empat, dan sebagian menambahkan bintang ke-9 pada sayap kanan sehingga lima, dengan ar-Radf di belakang. Matan ini mengikuti hitungan empat dan menjadikan <b>ar-Radf</b> (Deneb; «pembonceng») yang kelima; tabel syarah (cetak 278) mencantumkan lima bintang Fawāris terpisah dari Radf. Terbit bersama <b>al-Majarrah</b> (Bimasakti), dekat Lūrā’ dan an-Nasr al-Wāqi‘. Rinci per bait di kotak catatan pensyarah.',
 tbl:[["الردف","bintang terang besar; kelima di belakang empat Fawāris menurut matan (≈ Deneb α Cyg)","Radf"],["الفوارس","4 bintang menurut matan (Ṣūfī, al-Marzūqī); 5 menurut Ibn Qutaibah dan tabel syarah (≈ γ,δ,ε,ζ,κ Cyg)","Fawāris"]],
 tr:[['Kami sebut setelah rasi al-Lūrā’','bintang-bintang yang berbaris lurus'],['dari sebuah rasi yang dikenal dengan nama ad-Dajājah (Ayam)','seakan-akan nyala api (syuhub) yang berpijar'],['Empat di antaranya adalah al-Fawāris (para penunggang kuda),','diikuti ar-Radf, yaitu yang kelima.'],['Ar-Radf adalah bintang yang cemerlang lagi besar,','didahului oleh keempat bintang itu.'],['Bila engkau ingin melihatnya sekali waktu','mereka terbit bersama Bima Sakti (al-Majarrah)'],['di dekat bintang-bintang al-Lūrā’','dan Nasr Wāqi‘-nya yang bercahaya gemilang']],
 ck:{2:'Syarah hal. 276–277: jumlah al-Fawāris berbeda antarsumber. Ibn Qutaibah menyebut lima bintang berbaris di belakang Nasr Wāqi‘ dengan ar-Radf di belakangnya; al-Marzūqī dan aṣ-Ṣūfī (Suwar al-Kawākib) menyebut empat, dan sebagian menambahkan bintang ke-9 pada sayap kanan sehingga lima, dengan ar-Radf di belakang. Matan ini mengikuti hitungan empat dan menjadikan ar-Radf yang kelima. Tabel syarah (hal. 278) mencantumkan lima bintang Fawāris terpisah dari Radf (Deneb).'},

{g:'Utara',id:'r2_krs',ok:1,ar:'ذات الكرسي',idn:'Dzāt al-Kursī (riwayat 2)',
 note:'Rasi Cassiopeia, riwayat 2 (13 bait; syarah cetak 281–299 = PDF 311–329). Diserupakan dengan unta betina (‘ans). Lima bintang terang dipakai bersama oleh dua gambaran Arab — punuk unta betina (<b>Sanām an-Nāqah</b>) dan telapak tangan berhenna Tsurayyā (<b>al-Kaff al-Khadhīb</b>); kata Ibn Qutaibah: bagi yang mau ia telapak Tsurayyā, bagi yang mau ia punuk unta (bait 4). Bintang lain di pelana (qatab), paha, dan ekor. Syarah mengutip baris «وهذه الأنجم عند القدما…» dan «بغادة يرفعها سرير» (bait 7–8; perempuan di atas singgasana), «وكوكبان اثنان من أنجمها…» (bait 12), dan «ولطخة تدعى السحابي مظلمة…» (bait 13: as-Sahābī); baris-baris ini tidak ada di riwayat 1 (9 bait). Bait 11: kelompok naskah keempat membaca «بالكف» (bukan «بالعنق») dan pensyarah menilainya lebih tepat — kepala unta betina adalah bintang yang bersambung dengan telapak (kaff) pada gambar al-Mar’ah al-Musalsalah; bintang-bintang itu lalu bersambung dengan leher unta. Rinci per bait di kotak catatan pensyarah.',
 tbl:[["الكف الخضيب / سنام الناقة","5 bintang terang (≈ β + α,γ,δ,ε Cas); dua gambaran Arab untuk bintang yang sama","Kaff Khadhīb"],["عنق الناقة","deretan bintang gelap yang bermula dari al-Kaff (≈ π,ο,ξ,σ,ρ Cas)","‘Unuq"],["المسلسلة","rasi berikutnya; kepala unta bersambung ke telapaknya pada gambar al-Mar’ah al-Musalsalah","Musalsalah"],["غادة يرفعها سرير","perempuan di atas singgasana — gambaran para ahli bintang (bait 7–8)","Ghādah"],["السحابي","noda gelap «لطخة» pada paha unta betina (bait 13)","Sahābī"]],
 tr:[['Setelahnya kami sebut Dzāt al-Kursī (Wanita Berkursi)','bintang-bintang yang diserupakan dengan seekor unta betina tangguh (‘ans)'],['Engkau melihatnya berkilau lagi gemerlap','salah satunya berada di punuk unta betina'],['dan ia besar tubuhnya, bercahaya putih bersih,','muncul dari ufuk apabila ar-Radf terbit.'],['Ia dikenal di kalangan Arab dengan al-Kaff al-Khadhīb,','disebut dalam syair mereka bila dicari.'],['Di bawahnya ada bintang-bintang yang bercahaya','semuanya berada dalam (bentuk) gambar itu'],['Sebagian jatuh pada al-Qatab (pelana unta)','sebagian lagi di kedua paha dan di ekor'],['Dan bintang-bintang ini menurut orang-orang terdahulu','telah diserupakan, juga menurut para astrolog,'],['dengan seorang wanita muda yang diangkat sebuah kursi (sarīr),','sebagaimana dikisahkan oleh perawi tepercaya lagi ahli.'],['Mulai dari al-Khadhīb ada bintang-bintang','pada suatu lengkungan, semuanya redup;'],['Bukan bintang gemerlap bila mereka terbit','mereka menjadikannya leher bagi unta betina'],['Dan kepalanya adalah bintang-bintang yang bersambung','dengan leher, dari rasi al-Musalsalah.'],['Dan dua bintang di antara bintang-bintangnya,','keduanya pada ‘ans (unta betina) di atas kukunya (mansim),'],['dan sebuah noda (laṭkhah) bernama as-Saḥābī, gelap,','dijadikan tanda (wasm) pada paha ‘ans.']],
 ck:{3:'Syarah hal. 285–287: lima bintang terang ini dipakai bersama oleh dua gambaran Arab — sebagai punuk unta betina (Sanām an-Nāqah) dan sebagai telapak tangan berhenna Tsurayyā (al-Kaff al-Khadhīb). Kata Ibn Qutaibah: bagi yang mau ia telapak Tsurayyā, bagi yang mau ia punuk unta.',6:'Syarah (cetak 281, 298–299) mengutip baris «وهذه الأنجم عند القدما…» dan «بغادة يرفعها سرير» (bait 7–8), «وكوكبان اثنان من أنجمها…» (bait 12) dan «ولطخة تدعى السحابي مظلمة…» (bait 13); baris-baris ini tidak ada di riwayat 1 (9 bait).',10:'Syarah hal. 299: kelompok naskah keempat membaca «بالكف» (bukan «بالعنق») dan pensyarah menilainya lebih tepat maknanya — kepala unta betina adalah bintang-bintang yang bersambung dengan telapak (kaff) pada gambar al-Mar’ah al-Musalsalah; bintang-bintang itu lalu bersambung dengan leher unta.'},

{g:'Utara',id:'r2_brs',ok:1,ar:'برشاوش حامل رأس الغول',idn:'Birsyāwisy, pembawa kepala Ghūl (riwayat 2)',
 note:'Rasi Perseus, riwayat 2 (22 bait; syarah cetak 311–320 = PDF 341–350): sosok jangkung memegang kepala Ghūl (<b>Ra’s al-Ghūl</b>, Algol). Birsyāwsy adalah nama dan gambar Yunani; orang Arab tidak mengenal rasi ini dan memakai sebagian bintangnya sebagai <b>Yad ats-Tsurayyā</b> yang terentang. Bintang pertama tak bercahaya = <b>as-Sahābī</b> (Rum); Arab: <b>Sāq an-Nāqah</b>, <b>as-Suwayy‘id</b>, <b>Wasm an-Nāqah</b>, <b>Ma‘shim ats-Tsurayyā</b> (pergelangan), <b>Mirfaq</b>, <b>Mankib</b>, <b>al-Ibrah</b>, <b>al-‘Adhd</b>, <b>‘Ātiq an-Najm</b>. As-Saḥābī / «al-laṭkhah as-saḥābiyyah» (bait 5) bukan bintang tunggal melainkan sadīm (nebula), yakni gugus ganda NGC 869 & 884 yang tampak seperti awan tipis; pada gambar Arab ia Ma‘shim ats-Tsurayyā sekaligus wasm an-nāqah (cap pada paha unta). Bintang terang yang dijadikan <b>Mirfaq ats-Tsurayyā</b> (siku; bait 12) = sendi antara lengan bawah dan atas (‘adhud), karena orang Arab tidak mengenal Birsyāwsy. <b>Ra’s al-Ghūl</b> (bait 13) adalah nama Yunani; pensyarah membedakannya dari <b>‘Unāq al-Ardh</b>, bintang lain antara Qalb al-Hūt dan Mirfaq ats-Tsurayyā; ahli terdahulu (Ibn Qutaibah, al-Marzūqī) berselisih apakah keduanya sama. «An-Najm» (bait 22) = Tsurayyā, jadi ‘ātiq an-najm = ‘ātiq Tsurayyā; ‘ātiq = bagian antara mankib (bahu) dan leher. Catatan kaki naskah (pada «نضّة»): «لم أعرف ما أصل هذه الكلمة». Rinci per bait di kotak catatan pensyarah.',
 tbl:[["المعصم (السحابي / ساق الناقة / السويعد / وسم الناقة)","NGC 869/884","Ma‘shim"],["المرفق","Mirphak α Per","Mirfaq"],["المأبض","σ Per","Ma’bidh"],["إبرة المرفق","ψ Per","Ibrah"],["العضد","δ,ν,ε Per","‘Adhud"],["المنكب","ξ Per","Mankib"],["العاتق","ο & ζ Per","‘Ātiq"],["رأس الغول","Algol (β Per); nama Yunani","Ra’s al-Ghūl"]],
 tr:[['Setelahnya (ada) Pembawa Kepala Ghul','gambar sesosok orang yang berdiri tegak lagi jangkung'],['menyerupai manusia yang tinggi perawakannya','di tangannya ada seekor ghul berkepala besar'],['Bintang-bintang ini di antara gugusan bintang','disebut Birsyāwisy oleh bangsa Rum (Yunani)'],['Yang pertama di antaranya sebuah bintang tanpa cahaya','luput dari pencarinya di angkasa'],['Ia dikenal pada bangsa Rum sebagai as-Saḥābī (Berawan)','dan itulah yang disebut oleh orang Arab'],['dengan nama Sāq an-Nāqah (Betis Unta Betina) dan as-Suwayyi‘d','ia bagian dari Birsyāwisy, berbentuk tangan'],['di atas bintang-bintang Nadhdhah yang berkibar','dan kadang dinamai Wasm an-Nāqah (Cap Unta Betina)'],['Kadang pula dinamai Mi‘shām (Pergelangan) ats-Tsurayyā','tak kuhafal apa pun tentangnya selain ini'],['Ia diikuti bintang-bintang yang terang','terhitung dari bentuk gambar ini'],['Di antaranya ada sebuah bintang gemilang berkilau','ia punya cahaya dan punya sinar'],['Ia berada pada lambung Birsyāwisy','tetapi bagi orang Arab ia dijadikan'],['diikuti sebuah bintang apabila ia terbit','sebagaimana kami dengar, siku bagi Tsurayyā'],['Menyamainya dalam tampak besar','bernama Ra’s al-Ghūl menurut bangsa Rum'],['Engkau lihat di bawah lambung dua bintang','condong darinya ke arah Ghul'],['Yang lebih atas dari keduanya ialah al-Ma’bidh, yang terdekat','dengan siku bintang yang terang lagi menyala'],['Bintang yang satunya dinamai al-Ibrah (Jarum)','keduanya berada di tengah Bima Sakti'],['Menyusul al-Ibrah dua bintang','dari bentuk Birsyāwisy, keduanya redup'],['Telah datang riwayat dari orang Arab dan ahli pengamatan','bahwa keduanya dinamai al-‘Adhud (Lengan Atas)'],['Engkau lihat setelah dua bintang itu sebuah bintang','yang mereka jadikan bahu (Mankib) bagi Tsurayyā'],['Setelah bintang ini ada dua bintang','keduanya bagian dari Ghul, saling berdekatan'],['Keduanya kaki bagi pembawa kepala itu','jarak antara keduanya sejengkal, bahkan lebih'],['Keduanya bintang besar lagi bersina  ck:{2:'Syarah hal. 311–312, 316–317: Birsyāwsy (Perseus) adalah nama dan gambar Yunani; orang Arab tidak mengenal rasi ini dan memakai sebagian bintangnya sebagai Yad ats-Tsurayyā (tangan Tsurayyā) yang terentang.',4:'Syarah hal. 315 (dipindah dari riwayat 1, bait paralel): as-Saḥābī / al-laṭkhah as-saḥābiyyah bukan bintang tunggal, melainkan sadīm (nebula), yakni gugus ganda NGC 869 & 884 yang tampak seperti awan tipis. Pada gambar Arab ia adalah Ma‘shim ats-Tsurayyā (pergelangan) sekaligus wasm an-nāqah (cap pada paha unta).',11:'Syarah hal. 316–317 (dipindah dari riwayat 1): karena orang Arab tidak mengenal Birsyāwsy, bintang terang ini mereka jadikan Mirfaq ats-Tsurayyā (siku); mirfaq = sendi antara lengan bawah dan lengan atas (‘adhud).',12:'Syarah hal. 317–318 (dipindah dari riwayat 1): Ra’s al-Ghūl (Algol) adalah nama Yunani; pensyarah membedakannya dari ‘Unāq al-Ardh, bintang lain di antara Qalb al-Hūt dan Mirfaq ats-Tsurayyā; ahli terdahulu berselisih apakah keduanya sama (Ibn Qutaibah, al-Marzūqī).',21:'Syarah hal. 320 (dipindah dari riwayat 1): «an-Najm» di sini ialah Tsurayyā, jadi ‘ātiq an-najm = ‘ātiq Tsurayyā; ‘ātiq = bagian antara mankib (bahu) dan leher.'},

{g:'Utara',id:'r2_ann',ok:1,ar:'العنّاز وهو ممسك الأعنة',idn:'al-‘Annāz / Mumsik al-A‘innah (riwayat 2)',
 note:'Rasi Auriga (si kusir), PDF 115 (17 bait): <b>al-‘Annāz</b> / <b>Mumsik al-A‘innah</b>. «Al-‘Innāz/al-‘Attāz» adalah sebutan para munajjim pengikut Yunani, bukan nama Arab asli: pria pemegang kambing dan dua anak kambing; «Mumsik al-A‘innah» = «qā’id», «al-Ghāyah» = panji. Bintang terang = <b>al-‘Ayyūq</b> (Capella; bintang keenam paling terang, di utara Jazirah Arab), terbit sebelum <b>al-Fanīq</b> (= ad-Dabarān) dan menjadi tanda terbitnya Tsurayyā; juga <b>Raqīb an-Najm</b> («an-Najm» = Tsurayyā; raqīb = bintang yang tenggelam ketika pasangannya terbit). Disebut penyair <b>Khuwaylid bin Khālid</b> (= Abū Dzu’ayb al-Hudzalī). Pada Arab ia terletak di bahu kiri sosok Mumsik al-A‘innah. <b>al-‘Anz</b> dan <b>al-Jadyān</b> (Capella dan Haedi) bukan nama Arab asli melainkan terjemah Yunani (Kunitzsch; Ibn aṣ-Ṣalāḥ). <b>al-A‘lām/at-Tawābi‘</b> = bintang-bintang pengikut (menurut Ibn Qutaibah tiga bintang di belakang al-‘Ayyūq). Bait pembuka dan baris al-Khibā’ khas riwayat 2. Rinci per bait di kotak catatan pensyarah.',
 tbl:[['العيوق','Capella (α Aur); terbit sebelum Dabarān','‘Ayyūq'],['رقيب النجم','nama lain al-‘Ayyūq (an-Najm = Tsurayyā)','Raqīb an-Najm'],['العنز / الجديان','Capella dan Haedi (terjemah Yunani)','‘Anz / Jadyān'],['الأعلام / التوابع','bintang-bintang pengikut al-‘Ayyūq','A‘lām / Tawābi‘']],
 tr:[['Timur menampakkan sesudah mereka bintang-bintang','yang dijuluki al-‘Innāz oleh para ahli bintang'],['Dengan (nama) Pemegang Panji dan Tali Kekang','mereka menyibak, dengan cahaya, tirai-tirai kegelapan'],['Engkau lihat pada kepalanya dua bintang','di antara keduanya sejarak dua jengkal, redup'],['Di sekeliling keduanya banyak bintang','yang tak disebut oleh ahli pengamatan'],['di sebuah petak langit yang kosong','dari bintang-bintang terang yang tampak'],['semuanya bersambung dengan aẓ-Ẓibā’ (kijang-kijang)','yang oleh orang Arab seluruhnya dikenal dengan al-Khabā’'],['Menyusul mereka sebuah bintang besar','bintang-bintang (lain) tampak kecil dibanding ukurannya'],['Ia terbit sebelum terbitnya al-Fanīq','orang Arab mengenalnya dengan nama al-‘Ayyūq'],['Ia juga kadang dinamai Raqīb an-Najm (Pengawas an-Najm)','demikian dikabarkan oleh ahli ilmu'],['Dialah yang telah kami dahului menyebutnya','Khuwailid bin Khālid dalam syairnya'],['Selain dia juga menyebutnya dalam perumpamaan-perumpamaan','dan ia berada pada bahu pemilik gambar ini'],['Menyusulnya sebuah bintang yang lebih kecil darinya dalam besarnya','tetapi ia tidak samar dan tidak gelap'],['Setelahnya ada dua bintang yang mengikutinya','dalam limpahan cahaya keduanya menyerupainya'],['Ketiganya membentuk segitiga yang panjang','terbit setelah terbitnya al-Ghūl'],['Yang tunggal di antaranya dikenal dengan nama al-‘Inz (kambing betina)','oleh penduduk pedalaman, dan aku pun mendengar tentangnya'],['bahwa kedua bintang itu dinamai','yang mengikuti al-‘Inz, dengan nama al-Jadyān (dua anak kambing)'],['Dan semua bintang cemerlang ini','dikenal dengan nama al-A‘lām (Panji-panji) dan at-Tawābi‘ (Pengikut)']],
 ck:{0:'Syarah hal. 329–333: «al-‘Innāz/al-‘Attāz» adalah sebutan para munajjim (ahli hisab yang mengikuti Yunani), bukan nama Arab asli; ia sosok pria pemegang kambing dan kambing kecil. «Mumsik al-A‘innah» (pemegang tali kekang) = «qā’id», dan «al-Ghāyah» = panji. Bait pembuka «والشرق يبدي بعدهن أنجما…» dan baris al-Khibā’ (bait 5) ini dikutip syarah dan ada di riwayat 2 (tidak di riwayat 1).',1:'Syarah hal. 333: «يفرين نوراً حجب الدجنة» = cahaya bintang-bintang ini menyingkap/merobek tirai kegelapan.',7:'Syarah hal. 337–338 (dipindah dari riwayat 1): al-Fanīq = ad-Dabarān. Al-‘Ayyūq bintang keenam paling terang, terbit sebelum Dabarān, dan menjadi tanda terbitnya Tsurayyā (Capella; di utara Jazirah Arab).',8:'Syarah hal. 338–339 (dipindah dari riwayat 1): «an-Najm» di sini ialah Tsurayyā (orang Arab menyebut Tsurayyā «an-Najm»). «Raqīb» adalah nama diri sekaligus sifat: dalam siklus manzilah, raqīb ialah bintang yang tenggelam ketika pasangannya terbit; as-Simāk ar-Rāmih juga disebut Raqīb.',9:'Syarah hal. 340–341 (dipindah dari riwayat 1): Khuwailid bin Khālid = Abū Dzu’ayb al-Hudzalī; yang dikutip ialah bait «فوردن والعيوق مقعد رابئ الضرباء…» (an-najm = Tsurayyā; riwayat «فوق النظم» dinilai lebih tepat karena sesuai pemandangan langit).',10:'Syarah hal. 341–342: syarah mencetak «ذا الشمال» (riwayat 2 naskah ini: «ذي التمثال») dan menafsirkannya: al-‘Ayyūq terletak pada bahu kiri sosok Mumsik al-A‘innah.',14:'Syarah hal. 342–343 (dipindah dari riwayat 1): «al-‘Inz» dan «al-Jadyān» bukan nama Arab asli melainkan terjemahan nama Yunani (Capella dan Haedi); Ibn Qutaibah dan al-Marzūqī tidak menyebutnya dari orang Arab (Paul Kunitzsch; Ibn ash-Shalāh). Gambar Yunani: pria memegang tali kekang, membawa seekor kambing dan dua anak kambing.',16:'Syarah hal. 344 (dipindah dari riwayat 1): al-A‘lām/at-Tawābi‘ = nama yang diberikan orang Arab pada bintang-bintang Mumsik al-A‘innah (menurut Ibn Qutaibah: tiga bintang di belakang al-‘Ayyūq). Syarah mengaitkan penamaan Yunani dengan Aratus (Phaenomena).'},
