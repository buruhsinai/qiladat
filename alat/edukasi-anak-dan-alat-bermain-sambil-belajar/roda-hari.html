<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roda Hari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf6e8;--card:#fff;--line:#f0e2c4;--ink:#3a3226;--dim:#7a6c52;--accent:#4f86c6;--accent-d:#2d4a6b;--soft:#e8f0fb;--ok:#3f9d62;--warn:#e0663a;--gold:#f2b632;--display:'Fredoka',sans-serif;--sans:'Quicksand',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55}
button,input{font-family:inherit}
button:focus-visible,svg:focus-visible,input:focus-visible{outline:3px solid var(--accent-d);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding:0 18px 56px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:22px 0 16px}
.top h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,36px);margin:0;color:var(--accent-d);line-height:1.1}
.top p{margin:4px 0 0;color:var(--dim);font-size:.95rem;max-width:640px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:6px;background:#dfe9f7;padding:5px;border-radius:16px;flex-wrap:wrap}
.tab{font-family:var(--display);font-weight:600;font-size:.95rem;border:none;background:transparent;color:var(--dim);padding:9px 14px;border-radius:12px;cursor:pointer}
.tab[aria-selected=true]{background:var(--accent);color:#fff}
.tg{font-family:var(--display);font-weight:600;font-size:.85rem;border:2px solid var(--line);background:#fff;color:var(--dim);padding:8px 12px;border-radius:12px;cursor:pointer}
.tg[aria-pressed=true]{border-color:var(--accent);background:var(--soft);color:var(--accent-d)}
.layout{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:920px){.layout{grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr);align-items:start}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 18px}
.card h2{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:0 0 8px;color:var(--accent-d)}
.guide{background:#fff3e6;border:2px dashed var(--warn)}
.guide .q{font-family:var(--display);font-weight:700;font-size:1.25rem;color:#a8421d;line-height:1.25}
.guide .s{font-size:.85rem;color:var(--dim);margin-top:4px}
#sv,#ls{width:100%;height:auto;display:block;user-select:none;-webkit-user-select:none;border-radius:14px}
#sv{touch-action:none;max-height:72vh}
#ls{margin-top:0}
.hint{font-size:.85rem;color:#a89b80;margin:6px 4px 0}
.fld{margin:8px 0 10px}
.fld label{display:flex;justify-content:space-between;font-family:var(--display);font-weight:600;font-size:.92rem;color:var(--dim);margin-bottom:6px}
.fld label b{color:var(--accent-d)}
.ends{display:flex;justify-content:space-between;font-size:.78rem;color:#a89b80;margin-top:2px}
input[type=range]{width:100%;height:6px;-webkit-appearance:none;appearance:none;background:var(--line);border-radius:6px;outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid #fff}
.evg{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.evg label{font-family:var(--display);font-weight:600;font-size:.85rem;color:var(--dim);display:block}
.evg input{width:100%;padding:8px 10px;border:2px solid var(--line);border-radius:10px;font-size:1rem;background:#fffdf8;color:var(--ink)}
.btn{font-family:var(--display);font-weight:600;font-size:.95rem;padding:11px 16px;border-radius:12px;border:none;cursor:pointer;background:var(--accent);color:#fff;margin:8px 8px 0 0}
.btn.o{background:#fff;border:2px solid var(--accent);color:var(--accent-d)}
.btn:disabled{opacity:.45;cursor:default}
.qt{margin:0 0 6px;font-size:1.02rem;font-weight:600}
.optv{display:block;width:100%;text-align:left;font-family:var(--display);font-weight:600;font-size:1.02rem;background:#fff;border:2px solid var(--accent);color:var(--accent-d);padding:12px 14px;border-radius:14px;cursor:pointer;margin-top:8px}
.optv:disabled{cursor:default}.optv.good{background:var(--ok);border-color:var(--ok);color:#fff}.optv.bad{background:#fbe3da;border-color:var(--warn);color:#a8421d}
.res{background:var(--soft);border-color:#c9daf0;text-align:center;min-height:96px}
.res .big{font-family:var(--display);font-weight:700;font-size:1.9rem;color:var(--accent-d);line-height:1.15}
.res .sm{font-size:.95rem;color:#3a5a7d;margin-top:4px}
.stars{font-size:1.6rem;letter-spacing:4px;color:var(--gold)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.pill{font-family:var(--display);font-weight:600;font-size:.9rem;padding:6px 12px;border-radius:16px;background:#f3f0e8;color:#a89b80}
.pill.on{background:var(--ok);color:#fff}
.meter{font-size:.85rem;color:var(--dim);margin:4px 0}
.concl{background:#e6f4ea;border:2px solid var(--ok);border-radius:14px;padding:10px 14px;font-weight:600;color:#25663f;margin:6px 0}
.note{font-size:.9rem;color:#3a5a7d;background:var(--soft);border-radius:14px;padding:10px 14px;margin-top:8px}
.note b{color:var(--accent-d)}
footer{text-align:center;padding-top:22px;color:#a89b80;font-size:.8rem}
body.rec .top p,body.rec .hint,body.rec .note,body.rec #info.nolog,body.rec .evg{display:none}
body.rec .app{max-width:1400px}
body.rec .guide .q{font-size:1.7rem}body.rec .optv{font-size:1.4rem;padding:16px}body.rec .qt{font-size:1.3rem}body.rec .res .big{font-size:2.6rem}body.rec .res .sm{font-size:1.2rem}body.rec .btn{font-size:1.2rem}body.rec .concl{font-size:1.15rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>🌗 Roda Hari</h1><p>Satu putaran penuh roda sama dengan satu hari: 24 jam. Putar rodanya dan lihat apa yang terjadi pada langit.</p></div>
    <div class="toolbar">
      <div class="tabs" role="tablist" id="tabs"></div>
      <button class="tg" id="tgRec" aria-pressed="false">🎬 Mode rekam</button>
      <button class="tg" id="tgFs">⛶ Layar penuh</button>
      <button class="tg" id="tgSnd" aria-pressed="true">🔊 Suara</button>
      <button class="tg" id="tgAuto" aria-pressed="false">🔁 Otomatis</button>
    </div>
  </div>
  <div class="layout">
    <div class="col">
      <div class="card">
        <svg id="sv" viewBox="0 0 480 480" tabindex="0" role="img" aria-label="Roda hari: seret Matahari atau Bulan mengelilingi roda"></svg>
        <div class="hint" id="hint"></div>
      </div>
      <div class="card"><svg id="ls" viewBox="0 0 400 170" role="img" aria-label="Pemandangan langit"></svg></div>
      <div class="card" id="info"></div>
    </div>
    <div class="col">
      <div class="card guide"><div class="q" id="gq"></div><div class="s" id="gs"></div></div>
      <div class="card" id="panel"></div>
      <div class="card res" id="res"></div>
    </div>
  </div>
  <footer>Gambar disederhanakan. Matahari tampak bergerak karena Bumi berputar.</footer>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const pad=n=>String(n).padStart(2,'0');
const W24=h=>((h%24)+24)%24;
const fh=h=>{h=W24(h);let H=Math.floor(h),M=Math.round((h-H)*60);if(M===60){H=(H+1)%24;M=0}return pad(H)+':'+pad(M)};
const bag=h=>{h=W24(h);return h>=5.5&&h<11?'Pagi':h>=11&&h<15?'Siang':h>=15&&h<18.5?'Sore':'Malam'};
const sdiff=(a,b)=>{let d=W24(a-b);return d>12?d-24:d};
const fn=n=>String(Math.round(n*10)/10).replace('.',',');
const MODES=[['bebas','🌗 Putar Bebas'],['tebak','🤔 Tebak Dulu'],['pasang','🎯 Pasang Matahari']];
const SEG=[['Pagi',5.5,11,'#f6c67a'],['Siang',11,15,'#8fd0f5'],['Sore',15,18.5,'#f0955a'],['Malam',18.5,29.5,'#2b3a7a']];
const EVN=[['Bangun','🛏️'],['Sekolah','🎒'],['Main','⚽'],['Tidur','🌙']];
const KF=[[0,'#0d1b3a','#16234a'],[4,'#16234a','#233064'],[5.5,'#3a3a6b','#c4703f'],[6.5,'#e8926b','#f6c67a'],[9,'#a8d4f0','#dff0fb'],[12,'#5fb8f5','#bfe6ff'],[15,'#6fc0f0','#f0d98f'],[17,'#e8a45a','#f4c98a'],[18.5,'#c9603f','#a85a6b'],[20,'#2a2a5a','#16234a'],[22,'#16234a','#0d1b3a'],[24,'#0d1b3a','#16234a']];
const rgb=x=>{const v=parseInt(x.slice(1),16);return[v>>16&255,v>>8&255,v&255]};
const mix=(a,b,t)=>{const p=rgb(a),q=rgb(b);return`rgb(${p.map((v,i)=>Math.round(v+(q[i]-v)*t)).join(',')})`};
function sky(h){h=W24(h);let i=0;while(i<KF.length-2&&h>KF[i+1][0])i++;const a=KF[i],b=KF[i+1],t=cl((h-a[0])/((b[0]-a[0])||1),0,1);return[mix(a[1],b[1],t),mix(a[2],b[2],t)]}
const night=h=>{h=W24(h);return h<5.5||h>19.5?1:h<6.5?6.5-h:h>18.5?h-18.5:0};

const S={mode:'bebas',rec:false,snd:true,auto:false,timers:[],raf:0,h:12,tot:0,seen:{},ev:[6,8,16,20],ik:'',
 q:0,stars:0,tries:0,answered:false,done:false,pt:0,pstars:0,ptries:0,pdone:false,pchk:false,hl:null,mh:null};
const clr=()=>{S.timers.forEach(clearTimeout);S.timers=[];cancelAnimationFrame(S.raf)};
const later=(f,ms)=>S.timers.push(setTimeout(f,ms));
function seq(steps){let t=0;steps.forEach(([d,f])=>{t+=d;later(f,t)});return t}
function tween(get,set,to,ms,cb){const from=get(),t0=performance.now();
  if(RM||ms<=0){set(to);cb&&cb();return}
  (function f(t){const p=Math.min(1,(t-t0)/ms),q=1-Math.pow(1-p,3);set(from+(to-from)*q);if(p<1)S.raf=requestAnimationFrame(f);else cb&&cb()})(t0)}
let AC;
function tone(f,d=.12,t='sine',v=.15){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const ok=()=>{tone(660,.12);setTimeout(()=>tone(880,.18),110)},bad=()=>tone(200,.25,'triangle');
const TP={Pagi:660,Siang:784,Sore:523,Malam:330};

/* ===== roda ===== */
const C=240,pt=(h,r)=>{const a=(h-12)/24*2*Math.PI;return[C+r*Math.sin(a),C-r*Math.cos(a)]};
const arcP=(h1,h2,r)=>{const[a,b]=pt(h1,r),[c,d]=pt(h2,r);return`M ${a.toFixed(1)} ${b.toFixed(1)} A ${r} ${r} 0 ${h2-h1>12?1:0} 1 ${c.toFixed(1)} ${d.toFixed(1)}`};
const tx=(x,y,t,c='#3a5a7d',s=16,a='middle',st='#fdf6e8')=>`<text x="${x}" y="${y}" text-anchor="${a}" font-family="Fredoka" font-weight="600" font-size="${s}" fill="${c}" stroke="${st}" stroke-width="4" stroke-linejoin="round" paint-order="stroke">${t}</text>`;
function sunG(x,y,r){let g='';for(let i=0;i<8;i++){const a=i*Math.PI/4;g+=`<line x1="${x+(r+4)*Math.cos(a)}" y1="${y+(r+4)*Math.sin(a)}" x2="${x+(r+10)*Math.cos(a)}" y2="${y+(r+10)*Math.sin(a)}" stroke="#f7b733" stroke-width="4" stroke-linecap="round"/>`}
  return g+`<circle cx="${x}" cy="${y}" r="${r}" fill="#f7b733" stroke="#e59a12" stroke-width="2"/>`}
const moonG=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#f3edd8" stroke="#cfc6a6" stroke-width="2"/><circle cx="${x+r*.35}" cy="${y-r*.2}" r="${r*.18}" fill="#ddd3b4"/><circle cx="${x-r*.3}" cy="${y+r*.3}" r="${r*.12}" fill="#ddd3b4"/>`;
function wheel(o){const{h,marker=true,digits=true,evs=S.ev.map((v,i)=>({h:v,i:EVN[i][1],l:EVN[i][0]})),hl}=o;let g='';const[t,b]=sky(h);
  g+=`<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${t}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs>`;
  g+=`<circle cx="${C}" cy="${C}" r="126" fill="url(#sg)" stroke="#fff" stroke-width="4"/>`;
  SEG.forEach(s=>g+=`<path d="${arcP(s[1],s[2],150)}" fill="none" stroke="${s[3]}" stroke-width="26"/>`);
  for(let i=0;i<24;i++){const[a,b2]=pt(i,138),[c,d]=pt(i,i%6?144:150);g+=`<line x1="${a}" y1="${b2}" x2="${c}" y2="${d}" stroke="#fff" stroke-width="${i%6?2:3.5}" opacity=".8"/>`}
  [[0,'00'],[6,'06'],[12,'12'],[18,'18']].forEach(([v,l])=>{const[x,y]=pt(v,104);g+=tx(x,y+6,l,'#fff',17,'middle','rgba(0,0,0,.35)')});
  if(night(h)>.5)for(let i=0;i<9;i++){const a=i*2.1+.6,r=30+i*9;g+=`<circle cx="${C+r*Math.cos(a)}" cy="${C+r*Math.sin(a)*.9}" r="1.6" fill="#fff" opacity="${.3+night(h)*.4}"/>`}
  if(hl){const[x1,y1]=[0,0];g+=`<path d="${arcP(hl[0],hl[1],176)}" fill="none" stroke="#e0663a" stroke-width="7" stroke-linecap="round"/>`;
    if(hl[2])g+=tx(...pt((hl[0]+hl[1])/2,198).map(v=>v),hl[2],'#a8421d',20)}
  evs.forEach(e=>{const[x,y]=pt(e.h,192),[x2,y2]=pt(e.h,218);g+=`<circle cx="${x}" cy="${y}" r="19" fill="#fff" stroke="#c9daf0" stroke-width="2"/><text x="${x}" y="${y+8}" text-anchor="middle" font-size="22">${e.i}</text>`+tx(x2,y2+5,e.l,'#2d4a6b',14)});
  if(marker){const[x,y]=pt(h,150),up=h>=6&&h<18;g+=`<circle cx="${x}" cy="${y}" r="26" fill="${up?'#f7b733':'#f3edd8'}" opacity=".3"/>`+(up?sunG(x,y,12):moonG(x,y,13))}
  g+=digits?tx(C,C+8,fh(h),'#fff',50,'middle','rgba(0,0,0,.4)')+tx(C,C+40,bag(h),'#fff',22,'middle','rgba(0,0,0,.4)'):tx(C,C+16,'?','#fff',64,'middle','rgba(0,0,0,.4)');
  return g}
function land(h){const[t,b]=sky(h),n=night(h),up=h>=6&&h<18,tt=up?(h-6)/12:W24(h-18)/12,x=40+320*tt,y=132-105*Math.sin(Math.PI*tt);let g=`<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${t}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="400" height="170" fill="url(#lg)"/>`;
  if(n>.3)for(let i=0;i<14;i++)g+=`<circle cx="${(i*83+20)%390+5}" cy="${(i*47+13)%100+8}" r="1.6" fill="#fff" opacity="${n*.7}"/>`;
  g+=up?sunG(x,y,16):moonG(x,y,15);
  g+=`<rect y="132" width="400" height="38" fill="#5a8a56"/><rect y="132" width="400" height="38" fill="#0b1020" opacity="${n*.5}"/>`;
  g+=`<rect x="270" y="104" width="46" height="30" fill="#e9d9b8"/><polygon points="264,106 293,84 322,106" fill="#b5654a"/><rect x="284" y="112" width="12" height="12" fill="${n>.5?'#ffd76a':'#9bcbe8'}"/><rect x="60" y="112" width="6" height="22" fill="#7a5a3a"/><circle cx="63" cy="106" r="15" fill="#3f7a46"/>`;
  g+=tx(12,162,'timur (terbit)','#fff',12,'start','rgba(0,0,0,.35)')+tx(388,162,'barat (tenggelam)','#fff',12,'end','rgba(0,0,0,.35)');return g}

function setH(v,drag){const p=S.h,b0=bag(p);S.h=W24(v);if(drag){S.tot+=Math.abs(sdiff(S.h,p))}
  const b=bag(S.h);if(S.mode==='bebas'){S.seen[b]=true;if(b!==b0)tone(TP[b],.12)}
  render();if(S.mode==='bebas'){resB();const k=Object.keys(S.seen).join()+(S.tot>=24);if(k!==S.ik){S.ik=k;info()}}}

/* ===== render ===== */
function render(){const m=S.mode;let w,l=S.h;
  if(m==='bebas')w=wheel({h:S.h});
  else if(m==='pasang')w=wheel({h:S.h,digits:S.pchk,hl:S.hl});
  else{const q=QS[S.q];if(!q||S.done)w=wheel({h:12});else if(q.ty==='s'){l=q.h;w=wheel({h:q.h,digits:S.answered})}
    else if(q.ty==='d'){l=q.f;w=wheel({h:q.f,marker:false,digits:false,evs:[{h:q.f,i:'🔔',l:fh(q.f)},{h:q.e,i:'🔔',l:fh(q.e)}],hl:S.answered?[q.f,q.e,(q.e-q.f)+' jam']:null})}
    else{const hh=S.answered?0:12;l=hh;w=wheel({h:hh,digits:S.answered,evs:[],hl:S.answered?[12,24,'12 jam']:null})}}
  $('sv').innerHTML=w;$('ls').innerHTML=land(l)}

const NOTES={bebas:'<b>Kenapa satu putaran = satu hari?</b> Bumi berputar pada porosnya satu kali dalam sekitar 24 jam. Karena itu Matahari tampak terbit di timur, naik, lalu tenggelam di barat, dan malam berganti pagi. Roda ini menggambarkan satu putaran itu, dengan jam 12 di atas.',
 tebak:'<b>Tebak dulu, lalu buktikan.</b> Tebakan yang meleset tidak apa-apa: roda akan menunjukkan jawabannya.',
 pasang:'<b>Pakai petunjuk di roda.</b> Angka 00, 06, 12, dan 18 membantumu. Searah jarum jam, jamnya bertambah. Jam 12 di atas, jam 00 di bawah.'};
const HINTS={bebas:'Seret Matahari atau Bulan di roda, pakai penggeser, atau tombol panah (Shift = 1 jam).',tebak:'Pilih satu jawaban.',pasang:'Seret di roda atau pakai penggeser, lalu tekan Periksa.'};
function setRes(b,s,x=''){$('res').innerHTML=`<div class="big">${b}</div><div class="sm">${s}</div>${x}`}
function guide(q,s){$('gq').textContent=q;$('gs').textContent=s||''}
function info(){const m=S.mode;let h='';
  if(m==='bebas'){const all=['Pagi','Siang','Sore','Malam'].every(b=>S.seen[b]);
    h+=`<h2>Catatan penemuan</h2><div class="pills">${['Pagi','Siang','Sore','Malam'].map(b=>`<span class="pill${S.seen[b]?' on':''}">${S.seen[b]?'✓ ':''}${b}</span>`).join('')}</div><p class="meter">Roda sudah berputar ${fn(S.tot/24)} putaran (${Math.round(S.tot)} jam).</p>`;
    h+=all&&S.tot>=24?`<div class="concl">💡 Satu putaran penuh = 24 jam = 1 hari. Tiap hari urutannya sama: pagi, siang, sore, malam, lalu pagi lagi.</div>`:`<div class="meter">Putar sampai melewati keempat bagian hari dan satu putaran penuh untuk menemukan aturannya.</div>`}
  h+=`<div class="note">${NOTES[m]}</div>`;$('info').className='card'+(m==='bebas'?'':' nolog');$('info').innerHTML=h}

/* ===== PUTAR BEBAS ===== */
function iBebas(){const E=S.ev;
  $('panel').innerHTML=`<h2>Putar roda</h2><div class="fld"><label for="rh">Jam <b id="vh"></b></label><input type="range" id="rh" min="0" max="24" step="0.25" value="${S.h}"><div class="ends"><span>00:00</span><span>24:00</span></div></div>
  <div class="evg">${EVN.map((e,i)=>`<div><label for="ev${i}">${e[1]} ${e[0]}</label><input type="time" id="ev${i}" value="${fh(E[i])}"></div>`).join('')}</div>
  <button class="btn" id="bD">▶ Putar sehari</button><button class="btn o" id="bR">↺ Ke jam 12</button>`;
  $('rh').oninput=e=>setH(+e.target.value,true);
  EVN.forEach((e,i)=>$('ev'+i).onchange=ev=>{const v=ev.target.value.split(':').map(Number);if(!isNaN(v[0])){S.ev[i]=v[0]+(v[1]||0)/60;render()}});
  $('bD').onclick=()=>demo.bebas();$('bR').onclick=()=>{clr();setH(12,false)};
  render();resB();info();if(S.auto)later(()=>demo.bebas(autoNext),600)}
function resB(){const s=$('rh');if(s)s.value=S.h;if($('vh'))$('vh').textContent=fh(S.h);const h=S.h,b=bag(h);
  setRes(fh(h)+' · '+b,'Satu putaran penuh roda = 24 jam = 1 hari. Roda ini baru berputar '+fn(S.tot/24)+' kali.');
  guide('Sekarang jam berapa, dan bagian hari apa?','Putar roda sampai ke pagi, siang, sore, dan malam.')}

/* ===== TEBAK DULU ===== */
const QS=[
 {ty:'s',h:6.5,t:'Matahari baru muncul di ufuk dan langit mulai terang. Ini bagian hari apa?',o:['Pagi','Siang','Malam'],a:()=>bag(6.5),hint:'Matahari masih rendah dan baru mulai naik. Kapan kamu biasanya bangun tidur?',why:()=>`Matahari terbit di timur lalu naik pelan-pelan. Pukul ${fh(6.5)} masih pagi.`},
 {ty:'s',h:12,t:'Matahari ada di titik paling tinggi di langit. Jam berapa ini?',o:['06:00','12:00','18:00'],a:()=>fh(12),hint:'Jam 06:00 Matahari baru terbit dan jam 18:00 hampir tenggelam. Yang paling tinggi ada di antaranya.',why:()=>'Matahari paling tinggi di tengah hari, yaitu pukul 12:00. Di roda, tempatnya di paling atas.'},
 {ty:'s',h:23,t:'Bulan dan bintang bersinar, langit gelap. Ini bagian hari apa?',o:['Pagi','Sore','Malam'],a:()=>bag(23),hint:'Matahari sudah tenggelam. Kapan biasanya kamu tidur?',why:()=>'Saat Matahari tidak terlihat dan langit gelap, itu malam hari.'},
 {ty:'d',f:6,e:8,t:`Adek bangun pukul ${fh(6)} dan berangkat sekolah pukul ${fh(8)}. Berapa jam dari bangun sampai berangkat sekolah?`,o:['3 jam','2 jam','1 jam'],a:()=>`${8-6} jam`,hint:'Hitung jarak dari angka 6 sampai angka 8 di roda: berapa jam yang dilewati?',why:()=>`Dari ${fh(6)} sampai ${fh(8)}: 8 − 6 = 2 jam. Garis oranye di roda menunjukkan jaraknya.`},
 {ty:'d',f:16,e:20,t:`Adek mulai main pukul ${fh(16)} dan tidur pukul ${fh(20)}. Berapa jam Adek punya untuk bermain dan bersiap tidur?`,o:['4 jam','8 jam','2 jam'],a:()=>`${20-16} jam`,hint:'Kurangkan jam tidur dengan jam mulai main. Atau hitung satu per satu di roda: 17, 18, 19, 20.',why:()=>`Dari ${fh(16)} sampai ${fh(20)}: 20 − 16 = 4 jam.`},
 {ty:'h',t:'Roda berputar setengah putaran, mulai dari jam 12:00 (Matahari paling tinggi). Sekarang jam berapa?',o:['06:00','18:00','00:00'],a:()=>fh(12+24/2),hint:'Satu putaran penuh = 24 jam. Berapa jam untuk setengah putaran?',why:()=>'Setengah dari 24 jam adalah 12 jam, jadi 12:00 + 12 jam = 24:00, yaitu 00:00, tengah malam. Matahari kini ada di sisi lain Bumi.'}];
function showQ(){if(S.q>=QS.length)return endQ();const q=QS[S.q];S.answered=false;S.tries=0;
  $('panel').innerHTML=`<h2>Soal ${S.q+1} dari ${QS.length}</h2><p class="qt">${q.t}</p><div>${q.o.map((o,i)=>`<button class="optv" data-i="${i}">${o}</button>`).join('')}</div>`;
  setRes('?',`Bintang: ${S.stars}`);$('panel').querySelectorAll('.optv').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  render();guide('Tebak dulu, lalu buktikan.','Pilih satu jawaban.');info();
  if(S.auto)later(()=>pick(q.o.findIndex(o=>o===q.a())),3800)}
function pick(i){const q=QS[S.q];if(S.answered)return;const bs=[...document.querySelectorAll('.optv')],cor=q.o.findIndex(o=>o===q.a()),good=i===cor;S.tries++;
  const fin=()=>{S.answered=true;bs.forEach(b=>b.disabled=true);bs[cor].classList.add('good');render();return`<button class="btn" id="nx">${S.q+1>=QS.length?'Lihat hasil ›':'Soal berikutnya ›'}</button>`};
  if(good){if(S.tries===1)S.stars++;const x=fin();ok();setRes(S.tries===1?'Tepat!':'Nah, benar!',q.why(),x);guide('Apakah tebakanmu cocok dengan roda?','Roda membuktikannya.')}
  else if(S.tries===1){bs[i].disabled=true;bs[i].classList.add('bad');bad();setRes('Belum tepat',`Petunjuk: ${q.hint} Coba sekali lagi.`);guide('Coba sekali lagi.','Perhatikan petunjuknya.');return}
  else{bs[i].classList.add('bad');const x=fin();bad();setRes('Jawabannya: '+q.o[cor],q.why(),x);guide('Apakah tebakanmu cocok dengan roda?','Roda membuktikannya.')}
  $('nx').onclick=()=>{S.q++;showQ()};if(S.auto)later(()=>$('nx')&&$('nx').click(),4200)}
function endQ(){S.done=true;$('panel').innerHTML=`<h2>Selesai!</h2><div class="stars">${'★'.repeat(S.stars)}${'☆'.repeat(QS.length-S.stars)}</div><button class="btn" id="again">Main lagi</button>`;
  setRes(`${S.stars} dari ${QS.length}`,'Satu putaran roda = 24 jam = 1 hari, dan tiap hari urutannya sama.');$('again').onclick=()=>{S.q=0;S.stars=0;S.done=false;showQ()};
  guide('Berapa bintang yang kamu dapat?','Satu putaran penuh adalah satu hari.');render();info();if(S.auto)autoNext()}

/* ===== PASANG MATAHARI ===== */
const PT=[{h:9,t:'pukul 09:00 (pagi)'},{h:12,t:'pukul 12:00 (siang)'},{h:15.5,t:'pukul 15:30 (sore)'},{h:19,t:'pukul 19:00 (malam)'},{h:2,t:'pukul 02:00 (dini hari, masih malam)'}];
function pLevel(){if(S.pt>=PT.length)return pEnd();S.pchk=false;S.ptries=0;S.hl=null;S.h=S.pt%2?6:18;
  $('panel').innerHTML=`<h2>Target ${S.pt+1} dari ${PT.length}</h2><p class="qt">Putar Matahari atau Bulan ke <b>${PT[S.pt].t}</b>.</p>
  <div class="fld"><label for="rh">Posisi di roda</label><input type="range" id="rh" min="0" max="24" step="0.25" value="${S.h}"><div class="ends"><span>00:00</span><span>24:00</span></div></div><button class="btn" id="bC">✔ Periksa</button>`;
  $('rh').oninput=e=>{if(!S.pchk){S.h=W24(+e.target.value);render()}};$('bC').onclick=chk;
  setRes('?',`Bintang: ${S.pstars}`);render();guide('Di mana Matahari harus berada?','Angka jam di roda disembunyikan. Pakai 00, 06, 12, 18 sebagai petunjuk.');info();
  if(S.auto)later(()=>{tween(()=>sdiff(S.h,PT[S.pt].h),v=>{S.h=W24(PT[S.pt].h+v);$('rh').value=S.h;render()},0,1600,()=>later(chk,500))},900)}
function chk(){if(S.pchk)return;const T=PT[S.pt].h,d=sdiff(S.h,T);S.ptries++;
  if(Math.abs(d)<=.5){S.pchk=true;const s=Math.max(1,4-S.ptries);S.pstars+=s;ok();$('rh').disabled=true;$('bC').disabled=true;render();
    setRes(`Tepat! ${'★'.repeat(s)}`,`Roda menunjukkan ${fh(S.h)}. Ingat: searah jarum jam, jamnya bertambah.`,`<button class="btn" id="bN">${S.pt+1>=PT.length?'Lihat hasil ›':'Target berikutnya ›'}</button>`);
    $('bN').onclick=()=>{S.pt++;pLevel()};guide('Kamu menemukannya!','Angka jam kini terlihat.');if(S.auto)later(()=>$('bN')&&$('bN').click(),3200)}
  else if(S.ptries>=3){S.pchk=true;bad();$('rh').disabled=true;$('bC').disabled=true;S.h=T;render();
    setRes('Jawabannya di sini',`${PT[S.pt].t} ada di posisi ini di roda.`,`<button class="btn" id="bN">${S.pt+1>=PT.length?'Lihat hasil ›':'Target berikutnya ›'}</button>`);$('bN').onclick=()=>{S.pt++;pLevel()}}
  else{bad();const maju=d<0;setRes('Belum tepat',S.ptries===1?`Matahari kamu ${maju?'terlalu awal':'terlalu lambat'}. Putar ${maju?'searah':'berlawanan arah'} jarum jam.`:`Masih meleset sekitar ${fn(Math.abs(d))} jam. Putar ${maju?'searah':'berlawanan arah'} jarum jam.`);guide('Ke arah mana harus diputar?','Searah jarum jam = jam bertambah.')}}
function pEnd(){S.pdone=true;$('panel').innerHTML=`<h2>Selesai!</h2><div class="stars">${S.pstars} ★</div><button class="btn" id="again">Main lagi</button>`;
  setRes(`${S.pstars} dari ${PT.length*3}`,'Kamu sudah bisa membaca roda hari: jam 12 di atas, jam 00 di bawah, searah jarum jam jamnya bertambah.');
  $('again').onclick=()=>{S.pt=0;S.pstars=0;S.pdone=false;pLevel()};guide('Berapa bintang yang kamu dapat?','');S.hl=null;render();info();if(S.auto)autoNext()}

/* ===== peragaan & otomatis ===== */
const demo={bebas(done){iBebasSoft();S.tot=0;S.seen={};S.ik='';let last=0;S.h=0;
  tween(()=>0,v=>{setH(v,false);S.tot+=Math.abs(v-last);last=v;resB()},24,RM?0:13000,()=>{setH(12,false);later(()=>done&&done(),3500)})}};
function iBebasSoft(){const a=S.auto;S.auto=false;iBebas();S.auto=a}
function autoNext(){if(!S.auto)return;later(()=>{if(!S.auto)return;const i=MODES.findIndex(x=>x[0]===S.mode);go(MODES[(i+1)%MODES.length][0])},4000)}

/* ===== pointer / keyboard ===== */
const sv=$('sv');let dr=false;
function aim(e){const r=sv.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;let h=12+Math.atan2(x,-y)*180/Math.PI/15;
  if(S.mode==='bebas'){setH(h,true)}else if(S.mode==='pasang'&&!S.pchk){S.h=W24(h);$('rh').value=S.h;render()}}
const canAim=()=>S.mode==='bebas'||(S.mode==='pasang'&&!S.pchk);
sv.addEventListener('pointerdown',e=>{if(!canAim())return;clr();dr=true;sv.setPointerCapture(e.pointerId);aim(e)});
sv.addEventListener('pointermove',e=>{if(dr)aim(e)});sv.addEventListener('pointerup',()=>dr=false);sv.addEventListener('pointercancel',()=>dr=false);
sv.addEventListener('keydown',e=>{const d=e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:0;if(!d||!canAim())return;e.preventDefault();const st=e.shiftKey?1:.25;
  if(S.mode==='bebas')setH(S.h+d*st,true);else{S.h=W24(S.h+d*st);$('rh').value=S.h;render()}});

function go(m){clr();S.mode=m;S.q=0;S.stars=0;S.tries=0;S.answered=false;S.done=false;S.pt=0;S.pstars=0;S.pdone=false;S.pchk=false;S.hl=null;dr=false;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.m===m));
  $('hint').textContent=HINTS[m];sv.style.touchAction=(m==='tebak')?'auto':'none';
  ({bebas:iBebas,tebak:showQ,pasang:pLevel})[m]()}
$('tabs').innerHTML=MODES.map(([k,l])=>`<button class="tab" role="tab" data-m="${k}" aria-selected="${k==='bebas'}">${l}</button>`).join('');
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(t.dataset.m));
$('tgRec').onclick=e=>{S.rec=!S.rec;document.body.classList.toggle('rec',S.rec);e.currentTarget.setAttribute('aria-pressed',S.rec)};
$('tgSnd').onclick=e=>{S.snd=!S.snd;e.currentTarget.setAttribute('aria-pressed',S.snd)};
$('tgAuto').onclick=e=>{S.auto=!S.auto;e.currentTarget.setAttribute('aria-pressed',S.auto);go(S.mode)};
$('tgFs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};
go('bebas');
})();
</script>
<script src="../alat-nav-kembali.js" defer></script>
</body>
</html>
