<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenapa Segini?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf6e8;--card:#fff;--line:#f0e2c4;--ink:#3a3226;--dim:#7a6c52;--accent:#c9784f;--accent-d:#8a4a2a;--soft:#f7e9df;--ok:#3f9d62;--warn:#e0663a;--gold:#f2b632;--blue:#4f86c6;--display:'Fredoka',sans-serif;--sans:'Quicksand',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55}
button{font-family:inherit}
button:focus-visible,svg:focus-visible,input:focus-visible{outline:3px solid var(--accent-d);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding:0 18px 56px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:22px 0 16px}
.top h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,36px);margin:0;color:var(--accent-d);line-height:1.1}
.top p{margin:4px 0 0;color:var(--dim);font-size:.95rem}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:6px;background:#f6e6d6;padding:5px;border-radius:16px;flex-wrap:wrap}
.tab{font-family:var(--display);font-weight:600;font-size:.95rem;border:none;background:transparent;color:var(--dim);padding:9px 14px;border-radius:12px;cursor:pointer}
.tab[aria-selected=true]{background:var(--accent);color:#fff}
.tg{font-family:var(--display);font-weight:600;font-size:.85rem;border:2px solid var(--line);background:#fff;color:var(--dim);padding:8px 12px;border-radius:12px;cursor:pointer}
.tg[aria-pressed=true]{border-color:var(--accent);background:var(--soft);color:var(--accent-d)}
.layout{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:920px){.layout{grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);align-items:start}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 18px}
.card h2{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:0 0 8px;color:var(--accent-d)}
.guide{background:#fff3e6;border:2px dashed var(--warn)}
.guide .q{font-family:var(--display);font-weight:700;font-size:1.25rem;color:#a8421d;line-height:1.25}
.guide .s{font-size:.85rem;color:var(--dim);margin-top:4px}
#sv{width:100%;height:auto;display:block}
.hint{font-size:.85rem;color:#a89b80;margin:6px 4px 0}
.range{display:block;margin:10px 0;font-size:.95rem}.range b{font-family:var(--display);color:var(--accent-d);font-size:1.1rem}.range input{width:100%;accent-color:var(--accent)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.opt{font-family:var(--display);font-weight:700;font-size:1.15rem;background:#fff;border:2px solid var(--accent);color:var(--accent-d);padding:14px 6px;border-radius:14px;cursor:pointer}
.opt:disabled{cursor:default}.opt.good{background:var(--ok);border-color:var(--ok);color:#fff}.opt.bad{background:#fbe3da;border-color:var(--warn);color:#a8421d}
.btn{font-family:var(--display);font-weight:600;font-size:.95rem;padding:11px 16px;border-radius:12px;border:none;cursor:pointer;background:var(--accent);color:#fff;margin:8px 8px 0 0}
.res{background:var(--soft);border-color:#ecd0bd;text-align:center;min-height:120px}
.res .big{font-family:var(--display);font-weight:700;font-size:1.8rem;color:var(--accent-d);line-height:1.15}
.res .sm{font-size:.95rem;color:#6b4a30;margin-top:4px}
.stars{font-size:1.5rem;letter-spacing:2px;color:var(--gold)}
.dot{display:inline-block;width:26px;height:26px;border-radius:50%;background:var(--accent);vertical-align:middle;margin-left:8px;animation:bt 1s infinite}
@keyframes bt{50%{transform:scale(1.5);opacity:.45}}
.note{font-size:.85rem;color:var(--dim);background:#fffdf8;border:2px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
body.rec .top p,body.rec .hint,body.rec .note{display:none}
body.rec .app{max-width:1400px}
body.rec .guide .q{font-size:1.7rem}body.rec .opt{font-size:1.6rem;padding:20px 6px}body.rec .res .big{font-size:2.5rem}body.rec .res .sm{font-size:1.2rem}body.rec .btn{font-size:1.2rem}body.rec .range{font-size:1.2rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>⏱️📏 Kenapa Segini?</h1><p>Detik dan meter lahir dari membagi sesuatu yang tetap: satu hari dan ukuran Bumi.</p></div>
    <div class="toolbar">
      <div class="tabs" role="tablist" id="tabs"></div>
      <button class="tg" id="tgRec" aria-pressed="false">🎬 Mode rekam</button>
      <button class="tg" id="tgFs">⛶ Layar penuh</button>
      <button class="tg" id="tgSnd" aria-pressed="true">🔊 Suara</button>
      <button class="tg" id="tgAuto" aria-pressed="false">🔁 Otomatis</button>
    </div>
  </div>
  <div class="layout">
    <div class="col">
      <div class="card">
        <svg id="sv" viewBox="0 0 1000 540" role="img" aria-label="Gambar pembagian hari atau jarak Bumi."></svg>
        <div class="hint" id="hint"></div>
      </div>
    </div>
    <div class="col">
      <div class="card guide"><div class="q" id="gq"></div><div class="s" id="gs"></div></div>
      <div class="card" id="panel"></div>
      <div class="card res" id="res"></div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const fm=n=>n.toLocaleString('id-ID',{maximumFractionDigits:3});
const MODES=[['detik','⏱️ Bagi Hari'],['meter','📏 Bagi Bumi'],['tebak','🤔 Tebak Dulu']];
const S={mode:'detik',J:24,M:60,D:60,km:10000,B:10,rec:false,snd:true,auto:false,q:0,stars:0,tries:0,answered:false,done:false,timers:[]};
const clr=()=>{S.timers.forEach(clearTimeout);S.timers=[]};
const later=(f,ms)=>S.timers.push(setTimeout(f,ms));

/* suara */
let AC;
function tone(f,d=.12,t='sine',v=.15){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const ok=()=>{tone(660,.12);setTimeout(()=>tone(880,.18),110)},bad=()=>tone(200,.25,'triangle'),tick=()=>tone(520,.06,'triangle',.1);

/* rumus */
const total=(J,M,D)=>J*M*D, perDetik=(J,M,D)=>86400/total(J,M,D), perBagian=(km,B)=>km*1000/(B*1e6);

/* gambar */
const seg=(x,y,w,h,n,fill)=>{let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fffdf8" stroke="#3a3226" stroke-width="3"/><rect x="${x}" y="${y}" width="${w/n}" height="${h}" fill="${fill}"/>`;
  for(let i=1;i<n;i++)s+=`<line x1="${x+w*i/n}" y1="${y}" x2="${x+w*i/n}" y2="${y+h}" stroke="#3a3226" stroke-width="${n>60?1:2}" opacity=".7"/>`;return s};
const lbl=(x,y,t,c='#8a4a2a')=>`<text x="${x}" y="${y}" font-family="Fredoka" font-weight="600" font-size="30" fill="${c}">${t}</text>`;
function drawD(J,M,D){const X=50,W=900,f='#f2b632';
  let h=lbl(X,40,`1 hari dibagi jadi ${J} jam`)+seg(X,55,W,80,J,f);
  h+=`<path d="M${X} 135 L${X} 205 M${X+W/J} 135 L${X+W} 205" stroke="#c9784f" stroke-width="3" stroke-dasharray="8 6" fill="none"/>`;
  h+=lbl(X,200-0,'')+lbl(X,245,`1 jam dibagi jadi ${M} menit`)+seg(X,260,W,80,M,'#8cc7a1');
  h+=`<path d="M${X} 340 L${X} 400 M${X+W/M} 340 L${X+W} 400" stroke="#c9784f" stroke-width="3" stroke-dasharray="8 6" fill="none"/>`;
  h+=lbl(X,440,`1 menit dibagi jadi ${D} detik`)+seg(X,455,W,70,D,'#7fb7d9');
  $('sv').setAttribute('viewBox','0 0 1000 540');$('sv').innerHTML=h}
function drawM(km,B){const len=perBagian(km,B),w=Math.min(900,400*len),cut=400*len>900;let h='';
  h+=`<path d="M130 50 A240 240 0 0 1 370 290" fill="none" stroke="#c9784f" stroke-width="7" stroke-linecap="round"/>`;
  for(let i=0;i<=10;i++){const t=i*Math.PI/20;h+=`<circle cx="${130+240*Math.sin(t)}" cy="${290-240*Math.cos(t)}" r="6" fill="#3a3226"/>`}
  h+=lbl(60,38,'Kutub Utara','#3a3226')+lbl(280,330,'Khatulistiwa','#3a3226');
  h+=lbl(470,120,`Jarak: ${km.toLocaleString('id-ID')} km`)+lbl(470,170,`dibagi ${B} juta bagian sama`)+lbl(470,220,`1 bagian = ? meter`,'#e0663a');
  h+=lbl(50,385,'1 meter yang kita pakai')+`<rect x="50" y="395" width="400" height="36" rx="6" fill="#8cc7a1" stroke="#3a3226" stroke-width="3"/>`;
  h+=lbl(50,475,'1 bagian versi ini')+`<rect x="50" y="485" width="${w}" height="36" rx="6" fill="#f2b632" stroke="#3a3226" stroke-width="3"/>${cut?`<text x="${50+w+6}" y="513" font-size="30">›</text>`:''}`;
  $('sv').setAttribute('viewBox','0 0 1000 540');$('sv').innerHTML=h}

function setGuide(){let q='',s='';
  if(S.mode==='detik'){const p=perDetik(S.J,S.M,S.D);q=p===1?'Sehari dibagi 24 × 60 × 60. Kenapa angka itu?':p<1?'Hari dibagi lebih banyak: detiknya jadi lebih panjang atau pendek?':'Hari dibagi lebih sedikit: detiknya jadi lebih panjang atau pendek?';s='Geser pembagi, lihat panjang 1 detik versi ini.'}
  else if(S.mode==='meter'){const l=perBagian(S.km,S.B);q=l===1?'Satu meter = jarak Kutub–Khatulistiwa ÷ 10 juta.':l<1?'Satu bagian jadi lebih pendek dari 1 meter. Kenapa?':'Satu bagian jadi lebih panjang dari 1 meter. Kenapa?';s='Ubah jarak atau jumlah bagian, bandingkan dengan 1 meter.'}
  else{q=S.done?'Berapa bintang yang kamu dapat?':S.answered?'Kenapa jawabannya begitu?':'Pikirkan: yang dibagi tetap, jumlah bagian berubah.';s=S.answered?'Satuan = yang dibagi ÷ jumlah bagian.':'Tebak dulu, baru dibuktikan.'}
  $('gq').textContent=q;$('gs').textContent=s}

/* ===== Mode 1 & 2: slider ===== */
const R=(id,lab,min,max,step,val,unit)=>`<label class="range">${lab} <b id="v${id}">${val.toLocaleString('id-ID')}${unit||''}</b><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></label>`;
function resD(){const t=total(S.J,S.M,S.D),p=perDetik(S.J,S.M,S.D),per=Math.min(8,Math.max(.15,p));
  $('res').innerHTML=`<div class="big">${t.toLocaleString('id-ID')} detik</div><div class="sm">${t===86400?'Persis detik yang kita pakai sehari-hari!':`1 detik versi ini = <b>${fm(p)} detik biasa</b> (${p<1?'lebih pendek':'lebih panjang'}).`} <span class="dot" style="animation-duration:${per}s"></span></div>`}
function detik(){clr();drawD(S.J,S.M,S.D);
  $('panel').innerHTML=`<h2>Ubah pembagian sehari</h2>${R('J','Sehari dibagi jadi berapa jam?',4,48,1,S.J)}${R('M','Satu jam dibagi jadi berapa menit?',10,120,5,S.M)}${R('D','Satu menit dibagi jadi berapa detik?',10,120,5,S.D)}<div class="note">24, 60, dan 60 bukan aturan alam. Orang Babilonia kuno suka kelipatan 60 karena mudah dibagi (2, 3, 4, 5, 6, 10, 12...). Sejak 1967, detik didefinisikan lewat getaran atom, tetapi panjangnya sengaja dibuat sama dengan detik lama.</div>`;
  ['J','M','D'].forEach(k=>$(k).oninput=e=>{S[k]=+e.target.value;$('v'+k).textContent=S[k];tick();drawD(S.J,S.M,S.D);resD();setGuide()});
  $('hint').textContent='Rasakan nadi di pergelangan tanganmu: kira-kira sekali per detik. Titik di kanan berdenyut sesuai 1 detik versi ini.';
  resD();setGuide();if(S.auto)autoRun([[24,60,60],[12,60,60],[24,100,100],[10,100,100]],([a,b,c])=>{S.J=a;S.M=b;S.D=c;detik()})}
function resM(){const l=perBagian(S.km,S.B);
  $('res').innerHTML=`<div class="big">${fm(l)} meter</div><div class="sm">${l===1?'Persis 1 meter yang kita pakai!':`1 bagian versi ini ${l<1?'lebih pendek':'lebih panjang'} dari 1 meter. ${fm(S.km*1000)} m ÷ ${S.B} juta = ${fm(l)} m.`}</div>`}
function meter(){clr();drawM(S.km,S.B);
  $('panel').innerHTML=`<h2>Ubah ukuran dan pembagian</h2>${R('km','Jarak Kutub–Khatulistiwa (km)',5000,20000,500,S.km)}${R('B','Dibagi jadi berapa juta bagian?',1,30,1,S.B)}<div class="note">Tahun 1793 para ilmuwan Prancis memilih satuan yang tidak berubah-ubah: jarak Kutub Utara ke Khatulistiwa dibagi 10 juta. Setelah diukur lebih teliti, hasilnya meleset sedikit, tetapi meteran sudah terlanjur dipakai dunia. Sejak 1983, meter didefinisikan lewat kecepatan cahaya, dengan panjang yang sengaja dibuat sama.</div>`;
  ['km','B'].forEach(k=>$(k).oninput=e=>{S[k]=+e.target.value;$('v'+k).textContent=S[k].toLocaleString('id-ID');tick();drawM(S.km,S.B);resM();setGuide()});
  $('hint').textContent='Satu meter sekarang selalu digambar sama panjang (batang hijau) sebagai pembanding.';
  resM();setGuide();if(S.auto)autoRun([[10000,10],[10000,5],[5000,10],[20000,20]],([a,b])=>{S.km=a;S.B=b;meter()})}
function autoRun(list,fn){const cur=list.findIndex(x=>S.mode==='detik'?x[0]===S.J&&x[1]===S.M&&x[2]===S.D:x[0]===S.km&&x[1]===S.B);later(()=>fn(list[(cur+1)%list.length]),4000)}

/* ===== Mode 3: Tebak Dulu ===== */
const T3=['Lebih pendek','Sama panjang','Lebih panjang'];
const TQ=[
 {k:'d',p:[12,60,60],q:'Sehari dibagi 12 jam, tiap jam 60 menit, tiap menit 60 detik. Berapa detik dalam sehari?',o:['43.200','86.400','21.600'],a:0,i:'Hari yang sama dibagi lebih sedikit bagian, jadi tiap detik lebih panjang.'},
 {k:'d',p:[24,100,100],q:'Sehari 24 jam, tiap jam 100 menit, tiap menit 100 detik. Detik versi ini dibanding detik biasa?',o:T3,a:0,i:'Dibagi lebih banyak bagian, tiap bagian lebih pendek.'},
 {k:'d',p:[10,100,100],q:'Sehari 10 jam, tiap jam 100 menit, tiap menit 100 detik. 1 detik versi ini sama dengan berapa detik biasa?',o:['0,864','1','8,64'],a:0,i:'Yang dibagi tetap satu hari (86.400 detik biasa).'},
 {k:'m',p:[10000,5],q:'Jarak Kutub–Khatulistiwa 10.000 km dibagi 5 juta bagian. Satu bagian dibanding 1 meter sekarang?',o:T3,a:2,i:'Yang dibagi tetap, bagiannya lebih sedikit, jadi tiap bagian lebih panjang.'},
 {k:'m',p:[5000,10],q:'Bumi andai lebih kecil: jaraknya 5.000 km, dibagi 10 juta bagian. Berapa panjang satu bagian?',o:['0,5 meter','1 meter','2 meter'],a:0,i:'Satuan ikut menyesuaikan dengan ukuran yang dibagi.'},
 {k:'m',p:[20000,20],q:'Bumi andai lebih besar: jaraknya 20.000 km, dibagi 20 juta bagian. Berapa panjang satu bagian?',o:['0,5 meter','1 meter','2 meter'],a:1,i:'Yang dibagi dua kali lebih besar dan jumlah bagian dua kali lebih banyak, hasilnya tetap. Yang menentukan adalah perbandingannya.'}];
function tebak(){clr();
  if(S.q>=TQ.length){S.done=true;$('panel').innerHTML=`<h2>Selesai!</h2><div class="stars">★ ${S.stars} / ${TQ.length}</div><button class="btn" id="again">Main lagi</button>`;
    $('res').innerHTML=`<div class="big">Satuan = yang dibagi ÷ jumlah bagian</div><div class="sm">Angka 24, 60, dan 10 juta adalah kesepakatan. Yang dibagi (sehari, Bumi) tetap, sehingga semua orang bisa memakai satuan yang sama.</div>`;
    $('again').onclick=()=>{S.q=0;S.stars=0;S.done=false;tebak()};setGuide();return}
  const Q=TQ[S.q];S.tries=0;S.answered=false;S.done=false;
  Q.k==='d'?drawD(...Q.p):drawM(...Q.p);
  const idx=[0,1,2],r=S.q%3,ord=idx.slice(r).concat(idx.slice(0,r));
  $('panel').innerHTML=`<h2>Soal ${S.q+1} dari ${TQ.length}</h2><p style="margin:0 0 6px">${Q.q}</p><div class="opts">${ord.map(i=>`<button class="opt" data-i="${i}">${Q.o[i]}</button>`).join('')}</div>`;
  $('hint').textContent='Tebak dulu sebelum melihat hitungannya.';
  $('res').innerHTML=`<div class="big">?</div><div class="sm">Bintang: ${S.stars}</div>`;
  const all=()=>$('panel').querySelectorAll('.opt');
  const reveal=()=>{S.answered=true;all().forEach(x=>{x.disabled=true;if(+x.dataset.i===Q.a)x.classList.add('good')});
    const calc=Q.k==='d'?`${Q.p[0]} × ${Q.p[1]} × ${Q.p[2]} = ${total(...Q.p).toLocaleString('id-ID')} detik. 1 detik versi ini = 86.400 ÷ ${total(...Q.p).toLocaleString('id-ID')} = ${fm(perDetik(...Q.p))} detik biasa.`:`${Q.p[0].toLocaleString('id-ID')} km = ${(Q.p[0]*1000).toLocaleString('id-ID')} m ÷ ${Q.p[1]} juta = ${fm(perBagian(...Q.p))} meter.`;
    $('res').innerHTML=`<div class="big">${Q.o[Q.a]}</div><div class="sm">${calc} ${Q.i}</div><button class="btn" id="nx">Soal berikutnya ›</button>`;
    $('nx').onclick=()=>{S.q++;tebak()};if(S.auto)later(()=>$('nx')&&$('nx').click(),4500);setGuide()};
  all().forEach(b=>b.onclick=()=>{if(S.answered)return;const i=+b.dataset.i;
    if(i===Q.a){if(!S.tries)S.stars++;ok();reveal()}
    else{S.tries++;bad();b.disabled=true;b.classList.add('bad');
      if(S.tries>=2)reveal();else $('res').innerHTML=`<div class="big">Coba lagi</div><div class="sm">${Q.k==='d'?'Tiap detik = satu hari ÷ jumlah detik. Dibagi lebih banyak, bagian jadi lebih pendek.':'Satu bagian = jarak ÷ jumlah bagian. Bagian lebih banyak berarti lebih pendek.'}</div>`}});
  setGuide();
  if(S.auto)later(()=>{if(!S.answered)all().forEach(x=>{if(+x.dataset.i===Q.a)x.click()})},4000)}

/* mode dan alat */
function go(m){clr();S.mode=m;S.q=0;S.stars=0;S.done=false;S.answered=false;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.m===m));
  if(m==='detik')detik();else if(m==='meter')meter();else tebak()}
$('tabs').innerHTML=MODES.map(([k,l])=>`<button class="tab" role="tab" data-m="${k}" aria-selected="${k==='detik'}">${l}</button>`).join('');
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(t.dataset.m));
$('tgRec').onclick=e=>{S.rec=!S.rec;document.body.classList.toggle('rec',S.rec);e.currentTarget.setAttribute('aria-pressed',S.rec)};
$('tgSnd').onclick=e=>{S.snd=!S.snd;e.currentTarget.setAttribute('aria-pressed',S.snd)};
$('tgAuto').onclick=e=>{S.auto=!S.auto;e.currentTarget.setAttribute('aria-pressed',S.auto);go(S.mode)};
$('tgFs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};
go('detik');
</script>
<script src="../alat-nav-kembali.js" defer></script>
</body>
</html>
