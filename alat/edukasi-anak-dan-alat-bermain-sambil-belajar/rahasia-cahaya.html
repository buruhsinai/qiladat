<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rahasia Cahaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf6e8;--card:#fff;--line:#f0e2c4;--ink:#3a3226;--dim:#7a6c52;--accent:#c9784f;--accent-d:#8a4a2a;--soft:#f7e9df;--ok:#3f9d62;--warn:#e0663a;--gold:#f2b632;--display:'Fredoka',sans-serif;--sans:'Quicksand',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55}
button{font-family:inherit}
button:focus-visible,svg:focus-visible,input:focus-visible{outline:3px solid var(--accent-d);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding:0 18px 56px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:22px 0 16px}
.top h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,36px);margin:0;color:var(--accent-d);line-height:1.1}
.top p{margin:4px 0 0;color:var(--dim);font-size:.95rem;max-width:640px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:6px;background:#f6e6d6;padding:5px;border-radius:16px;flex-wrap:wrap}
.tab{font-family:var(--display);font-weight:600;font-size:.95rem;border:none;background:transparent;color:var(--dim);padding:9px 14px;border-radius:12px;cursor:pointer}
.tab[aria-selected=true]{background:var(--accent);color:#fff}
.tg{font-family:var(--display);font-weight:600;font-size:.85rem;border:2px solid var(--line);background:#fff;color:var(--dim);padding:8px 12px;border-radius:12px;cursor:pointer}
.tg[aria-pressed=true]{border-color:var(--accent);background:var(--soft);color:var(--accent-d)}
.layout{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:920px){.layout{grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);align-items:start}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 18px}
.card h2{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:0 0 8px;color:var(--accent-d)}
.guide{background:#fff3e6;border:2px dashed var(--warn)}
.guide .q{font-family:var(--display);font-weight:700;font-size:1.25rem;color:#a8421d;line-height:1.25}
.guide .s{font-size:.85rem;color:var(--dim);margin-top:4px}
#sv{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none;background:#fffdf8;border-radius:14px}
.hint{font-size:.85rem;color:#a89b80;margin:6px 4px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip{font-family:var(--display);font-weight:600;font-size:.9rem;background:#fffdf8;border:2px solid var(--line);color:var(--dim);padding:8px 13px;border-radius:20px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.fld{margin:8px 0 10px}
.fld label{display:flex;justify-content:space-between;font-family:var(--display);font-weight:600;font-size:.92rem;color:var(--dim);margin-bottom:6px}
.fld label b{color:var(--accent-d)}
.ends{display:flex;justify-content:space-between;font-size:.78rem;color:#a89b80;margin-top:2px}
input[type=range]{width:100%;height:6px;-webkit-appearance:none;appearance:none;background:var(--line);border-radius:6px;outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid #fff}
input[type=range]:disabled{opacity:.4}
.btn{font-family:var(--display);font-weight:600;font-size:.95rem;padding:11px 16px;border-radius:12px;border:none;cursor:pointer;background:var(--accent);color:#fff;margin:8px 8px 0 0}
.btn.o{background:#fff;border:2px solid var(--accent);color:var(--accent-d)}
.btn:disabled{opacity:.45;cursor:default}
.qt{margin:0 0 6px;font-size:1.02rem;font-weight:600}
.optv{display:block;width:100%;text-align:left;font-family:var(--display);font-weight:600;font-size:1.02rem;background:#fff;border:2px solid var(--accent);color:var(--accent-d);padding:12px 14px;border-radius:14px;cursor:pointer;margin-top:8px}
.optv:disabled{cursor:default}.optv.good{background:var(--ok);border-color:var(--ok);color:#fff}.optv.bad{background:#fbe3da;border-color:var(--warn);color:#a8421d}
.res{background:var(--soft);border-color:#ecd0bd;text-align:center;min-height:96px}
.res .big{font-family:var(--display);font-weight:700;font-size:1.9rem;color:var(--accent-d);line-height:1.15}
.res .sm{font-size:.95rem;color:#6b4a30;margin-top:4px}
.stars{font-size:1.6rem;letter-spacing:4px;color:var(--gold)}
table.lg{width:100%;border-collapse:collapse;font-size:.92rem;margin:4px 0 8px}
table.lg th{font-family:var(--display);font-weight:600;text-align:left;color:var(--dim);padding:4px 6px;border-bottom:2px solid var(--line)}
table.lg td{padding:5px 6px;border-bottom:1px solid var(--line)}
.meter{font-size:.85rem;color:var(--dim);margin:4px 0}
.concl{background:#e6f4ea;border:2px solid var(--ok);border-radius:14px;padding:10px 14px;font-weight:600;color:#25663f;margin:6px 0}
.note{font-size:.9rem;color:#6b4a30;background:var(--soft);border-radius:14px;padding:10px 14px;margin-top:8px}
.note b{color:#4a2e18}
footer{text-align:center;padding-top:22px;color:#a89b80;font-size:.8rem}
body.rec .top p,body.rec .hint,body.rec .note,body.rec #info.nolog{display:none}
body.rec .app{max-width:1400px}
body.rec .guide .q{font-size:1.7rem}body.rec .optv{font-size:1.4rem;padding:16px}body.rec .qt{font-size:1.3rem}body.rec .res .big{font-size:2.6rem}body.rec .res .sm{font-size:1.2rem}body.rec .btn,body.rec .chip{font-size:1.2rem}body.rec .concl{font-size:1.15rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body.dark{--bg:#0a0f1f;--card:#141a30;--line:#2a3354;--ink:#e8ecf8;--dim:#9aa6c4;--accent:#e8a33d;--accent-d:#ffd27a;--soft:#1d2440;--ok:#3fbf7a}
body.dark .tabs{background:#1d2440}body.dark .tab[aria-selected=true]{color:#1a1204}
body.dark .tg,body.dark .chip,body.dark .btn.o,body.dark .optv{background:#1d2440}
body.dark .tg[aria-pressed=true],body.dark .chip[aria-pressed=true],body.dark .btn,body.dark .tab[aria-selected=true]{color:#1a1204}
body.dark .guide{background:#2a2236;border-color:#ff9a6b}body.dark .guide .q{color:#ffb199}
body.dark #sv{background:radial-gradient(ellipse at 30% 40%,#141c38,#070a15 75%)}
body.dark .res .sm,body.dark .note{color:#c9d3ee}body.dark .note b{color:#ffd27a}body.dark .res{border-color:#2a3354}
body.dark .concl{background:#12301f;color:#9ff0bf}body.dark .optv.bad{background:#3a2020;color:#ffb199}
body.dark .hint,body.dark .ends,body.dark footer{color:#8693b3}
body.dark .btn,body.dark .chip[aria-pressed=true]{color:#1a1204}
body.dark .tg[aria-pressed=true]{color:#ffd27a;border-color:#e8a33d}body.dark .chip[aria-pressed=true]{background:#e8a33d;border-color:#e8a33d;color:#1a1204}
#sv{transition:background .6s}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>💡 Rahasia Cahaya</h1><p>Cahaya merambat lurus. Ia hanya berubah arah bila bertemu sesuatu: cermin, air atau kaca, benda penghalang, atau lensa.</p></div>
    <div class="toolbar">
      <div class="tabs" role="tablist" id="tabs"></div>
      <button class="tg" id="tgRec" aria-pressed="false">🎬 Mode rekam</button>
      <button class="tg" id="tgDark" aria-pressed="false">🌙 Ruang Gelap</button>
      <button class="tg" id="tgFs">⛶ Layar penuh</button>
      <button class="tg" id="tgSnd" aria-pressed="true">🔊 Suara</button>
      <button class="tg" id="tgAuto" aria-pressed="false">🔁 Otomatis</button>
    </div>
  </div>

  <div class="layout" id="main">
    <div class="col">
      <div class="card">
        <svg id="sv" viewBox="0 0 1000 420" tabindex="0" role="img" aria-label="Panggung percobaan cahaya"></svg>
        <div class="hint" id="hint"></div>
      </div>
      <div class="card" id="info"></div>
    </div>
    <div class="col">
      <div class="card guide"><div class="q" id="gq"></div><div class="s" id="gs"></div></div>
      <div class="card" id="panel"></div>
      <div class="card res" id="res"></div>
    </div>
  </div>
  <footer>Gambar disederhanakan: garis berpanah hanyalah cara kita menggambar jalan cahaya.</footer>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const fm=(n,k=1)=>Number(n).toFixed(k).replace('.',',');
const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const snell=(th,n)=>deg(Math.asin(Math.sin(rad(th))/n));
const shd=(Hl,Ho,d)=>d*Ho/(Hl-Ho);
const foc=(R,n)=>R/(2*(n-1));
const fd=v=>Math.abs(v-Math.round(v))<.05?String(Math.round(v)):fm(v);
const OR='#c9784f',TL='#2f8f6b',DK='#3a3226';

const MODES=[['pantul','🪞 Pantulan'],['bias','🌈 Pembiasan'],['bayang','🕯️ Bayangan'],['lensa','🔍 Lensa'],['tebak','🤔 Tebak Dulu'],['bidik','🎯 Bidik Cermin']];
const BHN=[{n:'Udara',i:1.00,c:'#fffdf4'},{n:'Air',i:1.33,c:'#cfe8f5'},{n:'Kaca',i:1.50,c:'#d3ebdf'},{n:'Berlian',i:2.42,c:'#e6dcf7'}];
const LB=[{n:'Air',i:1.33},{n:'Kaca',i:1.50},{n:'Kaca timbal',i:1.70}];

const S={mode:'pantul',rec:false,snd:true,auto:false,timers:[],raf:0,tf:{tx:0,k:1},vb:[0,0,1000,420],
  th:40,rough:false,show:false,dark:false,
  bs:1,bt:50,
  Hl:200,Ho:60,d:120,
  R:60,ln:1,
  q:0,stars:0,tries:0,answered:false,done:false,
  bl:0,bx:180,bshot:false,bhit:false,btries:0,bstars:0,
  logs:{pantul:[],bias:[],bayang:[],lensa:[]}};
const clr=()=>{S.timers.forEach(clearTimeout);S.timers=[];cancelAnimationFrame(S.raf)};
const later=(f,ms)=>S.timers.push(setTimeout(f,ms));
function seq(steps){let t=0;steps.forEach(([d,f])=>{t+=d;later(f,t)});return t}
function tween(get,set,to,ms,cb){const from=get(),t0=performance.now();
  if(RM||ms<=0){set(to);cb&&cb();return}
  (function f(t){const p=Math.min(1,(t-t0)/ms),q=1-Math.pow(1-p,3);set(from+(to-from)*q);if(p<1)S.raf=requestAnimationFrame(f);else cb&&cb()})(t0)}

/* suara */
let AC;
function tone(f,d=.12,t='sine',v=.15){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const ok=()=>{tone(660,.12);setTimeout(()=>tone(880,.18),110)},bad=()=>tone(200,.25,'triangle');

/* ===== gambar dasar ===== */
const DEFS=`<defs><marker id="aho" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="${OR}"/></marker><marker id="aht" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="${TL}"/></marker></defs>`;
const ray=(x1,y1,x2,y2,c,w=4,dash)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"${dash?` stroke-dasharray="${dash}"`:''}${c===OR?' marker-end="url(#aho)"':c===TL?' marker-end="url(#aht)"':''}/>`;
const DM={'#c9784f':'#ffe27a','#2f8f6b':'#6ff0c8','#fffdf8':'#0b1020','#fffdf4':'#0d1428','#cfe8f5':'#16466b','#d3ebdf':'#1f6b55','#e6dcf7':'#3b2d66','#6b4a30':'#cdd7ee','#8a4a2a':'#ffd9a8','#8a7c62':'#8a96b8','#a89b80':'#8693b3','#5a7a70':'#8fe0c8','#a8421d':'#ffb199','#3d6459':'#a8e0cf','#3a3226':'#aab4d0','#efe4c8':'#1a2036','#e9dcc0':'#1a2036','#e2d5b5':'#2a3252','#7a6240':'#aab4d0','#f0e2c4':'#2a3354','#b9ad94':'#6b7799','#c9c0a4':'#4a5578','#8a4a2a':'#ffd9a8'};
function fl(x,y,a,w=1,bl=1){const hh=17*w,bh=11*Math.pow(w,.6);
return `<g transform="translate(${x},${y}) rotate(${a})"><rect x="${-20-76*bl}" y="${-bh}" width="${76*bl}" height="${2*bh}" rx="9" fill="#46527a" stroke="#aab4d0" stroke-width="2.5"/><rect x="${-20-60*bl}" y="${-bh}" width="8" height="${2*bh}" fill="#2c3556" opacity=".6"/><rect x="${-20-42*bl}" y="${-bh-6}" width="16" height="7" rx="3" fill="#f2b632"/><path d="M -22 ${-bh-2} L 0 ${-hh} L 0 ${hh} L -22 ${bh+2} Z" fill="#5b6894" stroke="#aab4d0" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="0" cy="0" rx="${Math.max(5,hh*.28)}" ry="${hh}" fill="#fff6c4" stroke="#ffe27a" stroke-width="2"/><ellipse cx="2" cy="0" rx="26" ry="${hh+14}" fill="#ffe27a" opacity=".5" filter="url(#gl)"/></g>`}
function dk(str){let sd=7;const rnd=()=>(sd=(sd*9301+49297)%233280)/233280;let st='';for(let i=0;i<18;i++)st+=`<circle cx="${(rnd()*1000).toFixed(0)}" cy="${(rnd()*420).toFixed(0)}" r="${(1+rnd()*1.6).toFixed(1)}" fill="#fff" opacity="${(.15+rnd()*.35).toFixed(2)}"/>`;
 str=str.replace(/<line [^>]*stroke="(#c9784f|#2f8f6b)"[^>]*\/>/g,m=>m.includes('stroke-dasharray')?m:m.replace(/ marker-end="[^"]*"/,'').replace(/stroke-width="([\d.]+)"/,(q,w)=>`stroke-width="${w*5}" filter="url(#gl)"`).replace(/\/>$/,' opacity=".5"/>')+m);
 str=str.replace(/#[0-9a-f]{6}/g,c=>DM[c]||c);
 return `<defs><filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter></defs><g>${st}</g>`+str}
const lamp=(x,y,a,bl)=>S.dark&&a!==undefined?fl(x,y,a,1,bl):`<circle cx="${x}" cy="${y}" r="20" fill="#f2b632" opacity=".25"/><circle cx="${x}" cy="${y}" r="12" fill="#f2b632" stroke="#b8860b" stroke-width="2"/><circle cx="${x}" cy="${y}" r="5" fill="#fff"/>`;
const tx=(x,y,t,c='#6b4a30',s=17,a='middle')=>`<text x="${x}" y="${y}" text-anchor="${a}" font-family="Fredoka" font-weight="600" font-size="${s}" fill="${c}" stroke="#fffdf8" stroke-width="4" stroke-linejoin="round" paint-order="stroke">${t}</text>`;
const arc=(x1,y1,r,x2,y2,sw,c)=>`<path d="M ${x1} ${y1} A ${r} ${r} 0 0 ${sw} ${x2} ${y2}" fill="none" stroke="${c}" stroke-width="5" opacity=".85"/>`;
const NARROW=()=>innerWidth<700;
const sc1=inner=>{const k=1.3,t=(1000-500*k)/2;S.tf={tx:t,k};S.vb=NARROW()?[t,0,500*k,420]:[0,0,1000,420];return `<g transform="translate(${t},0) scale(${k})">${inner}</g>`};
const sc2=(a,b,la,lb)=>{const k=.95;S.tf={tx:0,k:1};
  if(NARROW()){S.vb=[0,0,500,700];return `${tx(250,26,la,'#8a4a2a',20)}<g transform="translate(12,34) scale(${k})">${a}</g><line x1="20" y1="350" x2="480" y2="350" stroke="#f0e2c4" stroke-width="3" stroke-dasharray="6 8"/>${tx(250,378,lb,'#8a4a2a',20)}<g transform="translate(12,386) scale(${k})">${b}</g>`}
  S.vb=[0,0,1000,420];return `<line x1="500" y1="20" x2="500" y2="400" stroke="#f0e2c4" stroke-width="3" stroke-dasharray="6 8"/>${tx(250,32,la,'#8a4a2a',22)}${tx(750,32,lb,'#8a4a2a',22)}<g transform="translate(12,56) scale(${k})">${a}</g><g transform="translate(512,56) scale(${k})">${b}</g>`};

/* pantulan */
function scPantul(o){const{th,show,rough,hide,surf}=o,hx=250,hy=250,L=170,r=rad(th),sx=hx-L*Math.sin(r),sy=hy-L*Math.cos(r);let h='';
  if(rough){let p='';for(let i=0;i<=40;i++)p+=`${50+i*10},${250+(i%2?-6:6)} `;
    h+=`<rect x="50" y="256" width="400" height="22" fill="#e2d5b5"/><polyline points="${p}" fill="none" stroke="#7a6240" stroke-width="4" stroke-linejoin="round"/>`;
    if(!hide)[-65,-38,-12,22,48,70].forEach(a=>{const q=rad(a);h+=ray(hx,hy,hx+110*Math.sin(q),hy-110*Math.cos(q),TL,3)});}
  else h+=`<rect x="50" y="250" width="400" height="16" rx="4" fill="#bfe3f0" stroke="${DK}" stroke-width="3"/><line x1="60" y1="255" x2="440" y2="255" stroke="#fff" stroke-width="3" opacity=".8"/>`;
  h+=`<line x1="${hx}" y1="${hy}" x2="${hx}" y2="70" stroke="#8a7c62" stroke-width="2" stroke-dasharray="6 6"/>${tx(hx+8,84,'garis normal','#8a7c62',15,'start')}`;
  h+=ray(sx,sy,hx,hy,OR,5)+lamp(sx,sy,deg(Math.atan2(hy-sy,hx-sx)));
  if(!hide&&!rough)h+=ray(hx,hy,hx+L*Math.sin(r),hy-L*Math.cos(r),TL,5);
  const lab=v=>show?`${v}°`:'?';
  if(!surf||show){
    h+=arc(hx,hy-55,55,hx-55*Math.sin(r),hy-55*Math.cos(r),0,OR);
    h+=tx(hx-88*Math.sin(r/2),hy-88*Math.cos(r/2)+6,lab(th),OR,22);
    if(!hide&&!rough){h+=arc(hx,hy-55,55,hx+55*Math.sin(r),hy-55*Math.cos(r),1,TL);
      h+=tx(hx+88*Math.sin(r/2),hy-88*Math.cos(r/2)+6,lab(th),TL,22)}}
  if(surf){const a=90-th,m=rad(a/2);
    h+=`<path d="M ${hx-45} ${hy} A 45 45 0 0 1 ${hx-45*Math.sin(r)} ${hy-45*Math.cos(r)}" fill="none" stroke="#8a4a2a" stroke-width="4" stroke-dasharray="5 4"/>`;
    h+=tx(hx-75*Math.cos(m),hy-75*Math.sin(m)+4,`${surf}°`,'#8a4a2a',20)}
  h+=tx(clamp(sx,60,440),sy-24,'sinar datang',OR,15);
  if(!hide&&!rough)h+=tx(clamp(hx+L*Math.sin(r),60,440),hy-L*Math.cos(r)-14,'sinar pantul',TL,15);
  if(rough&&!hide)h+=tx(hx+150,hy-70,'tersebar ke mana-mana',TL,15,'middle');
  return h}
function clamp(v,a,b){return cl(v,a,b)}

/* pembiasan */
function scBias(o){const{th,n,show,hide,c,nm}=o,hx=250,hy=150,L=125,r1=rad(th),r2=Math.asin(Math.sin(r1)/n),t2=deg(r2);let h='';
  h+=`<rect x="20" y="20" width="460" height="130" fill="#fffdf4"/><rect x="20" y="150" width="460" height="150" fill="${c}"/><line x1="20" y1="150" x2="480" y2="150" stroke="${DK}" stroke-width="3"/>`;
  h+=tx(30,46,'udara','#8a7c62',16,'start')+tx(30,286,`${nm.toLowerCase()} (angka bias ${fm(n,2)})`,'#5a7a70',16,'start');
  h+=`<line x1="${hx}" y1="20" x2="${hx}" y2="300" stroke="#8a7c62" stroke-width="2" stroke-dasharray="6 6"/>${tx(hx+8,292,'garis normal','#8a7c62',15,'start')}`;
  const sx=hx-L*Math.sin(r1),sy=hy-L*Math.cos(r1);
  h+=ray(sx,sy,hx,hy,OR,5)+lamp(sx,sy,deg(Math.atan2(hy-sy,hx-sx)));
  if(!hide){if(n>1.001&&th>=1)h+=ray(hx,hy,hx+L*Math.sin(r1),hy+L*Math.cos(r1),'#b9ad94',3,'6 6')+tx(hx+L*Math.sin(r1)+6,hy+L*Math.cos(r1)+4,'kalau tidak membelok','#a89b80',13,'start');
    h+=ray(hx,hy,hx+L*Math.sin(r2),hy+L*Math.cos(r2),TL,5)}
  const lab=(v)=>show?`${fd(v)}°`:'?';
  if(th>=1){
    h+=`<path d="M ${hx} ${hy-50} A 50 50 0 0 0 ${hx-50*Math.sin(r1)} ${hy-50*Math.cos(r1)}" fill="none" stroke="${OR}" stroke-width="5" opacity=".85"/>`;
    h+=tx(hx-82*Math.sin(r1/2),hy-82*Math.cos(r1/2)+6,lab(th),OR,21);
    if(!hide){h+=`<path d="M ${hx} ${hy+50} A 50 50 0 0 0 ${hx+50*Math.sin(r2)} ${hy+50*Math.cos(r2)}" fill="none" stroke="${TL}" stroke-width="5" opacity=".85"/>`;
      h+=tx(hx+78*Math.sin(r2)+38,hy+78*Math.cos(r2)+6,lab(t2),TL,21)}}
  return h}
const bz=p=>({th:p.th,n:BHN[p.bi].i,c:BHN[p.bi].c,nm:BHN[p.bi].n});

/* bayangan */
const bsc=(Hl,Ho,d)=>Math.min(430/(d+shd(Hl,Ho,d)),240/Hl);
function scBayang(o){const{Hl,Ho,d,show,hide}=o,s=shd(Hl,Ho,d),gy=(S.dark&&!o.sc)?305:270,lx=36,k=o.sc||bsc(Hl,Ho,d);
  const ox=lx+d*k,ot=gy-Ho*k,lt=gy-Hl*k,tp=lx+(d+s)*k;let h='';
  h+=`<rect x="10" y="${gy}" width="480" height="40" fill="#efe4c8"/><line x1="10" y1="${gy}" x2="490" y2="${gy}" stroke="#8a7c62" stroke-width="4"/>`;
  if(S.dark){h+=`<polygon points="${lx},${lt} ${lx},${gy} 490,${gy}" fill="#ffe27a" opacity=".17"/>`;if(!hide)h+=`<polygon points="${ox},${ot} ${tp},${gy} ${ox},${gy}" fill="#070a15" opacity=".93"/>`}
  h+=`<line x1="${lx}" y1="${gy}" x2="${lx}" y2="${lt}" stroke="${DK}" stroke-width="5"/>`;
  if(!hide){h+=ray(lx,lt,tp,gy,OR,2.5,'7 6').replace(' marker-end="url(#aho)"','');
    h+=`<rect x="${ox}" y="${gy-4}" width="${Math.max(2,tp-ox)}" height="12" rx="6" fill="${DK}" opacity=".55"/>`}
  h+=`<rect x="${ox-8}" y="${ot}" width="16" height="${gy-ot}" rx="6" fill="#5a8a7c" stroke="#3d6459" stroke-width="2"/>`;
  h+=lamp(lx,lt,deg(Math.atan2(ot-lt,ox-lx)),.4)+tx(lx+20,lt-16,'lampu','#8a7c62',15,'start')+tx(ox,ot-10,'benda','#3d6459',15);
  if(!hide){const y=gy+26;h+=`<line x1="${ox}" y1="${y}" x2="${tp}" y2="${y}" stroke="#8a4a2a" stroke-width="3"/><line x1="${ox}" y1="${y-6}" x2="${ox}" y2="${y+6}" stroke="#8a4a2a" stroke-width="3"/><line x1="${tp}" y1="${y-6}" x2="${tp}" y2="${y+6}" stroke="#8a4a2a" stroke-width="3"/>`;
    h+=tx((ox+tp)/2,y+22,show?`${fm(s)} cm`:'bayangan: ?','#8a4a2a',19)}
  return h}

/* lensa */
function scLensa(o){const{R,n,show,hide}=o,f=foc(R,n),lx=200,ay=160,k=1.4,Fx=Math.min(lx+f*k,470),w=Math.max(6,Math.min(32,640/R));let h='';
  h+=`<line x1="10" y1="${ay}" x2="490" y2="${ay}" stroke="#c9c0a4" stroke-width="2" stroke-dasharray="6 6"/>`;
  const ys=[-62,-36,0,36,62];
  if(S.dark)h+=fl(15,ay,0,4);
  ys.forEach(y=>h+=`<line x1="15" y1="${ay+y}" x2="${lx}" y2="${ay+y}" stroke="${OR}" stroke-width="3.5" stroke-linecap="round"/>`);
  h+=tx(18,ay-82,'cahaya sejajar',OR,15,'start');
  h+=`<path d="M ${lx} 80 Q ${lx+2*w} 160 ${lx} 240 Q ${lx-2*w} 160 ${lx} 80 Z" fill="#d3ebdf" stroke="#5a7a70" stroke-width="3"/>`;
  if(!hide){ys.forEach(y=>{const ex=Fx+.2*(Fx-lx),ey=ay-.2*y;h+=`<line x1="${lx}" y1="${ay+y}" x2="${ex}" y2="${ey}" stroke="${TL}" stroke-width="3.5" stroke-linecap="round"/>`});
    h+=`<circle cx="${Fx}" cy="${ay}" r="16" fill="#f2b632" opacity=".3"/><circle cx="${Fx}" cy="${ay}" r="7" fill="#f2b632" stroke="#b8860b" stroke-width="2"/>`+tx(Fx,ay-22,'F','#8a4a2a',15);
    const y=272;h+=`<line x1="${lx}" y1="${y}" x2="${Fx}" y2="${y}" stroke="#8a4a2a" stroke-width="3"/><line x1="${lx}" y1="${y-6}" x2="${lx}" y2="${y+6}" stroke="#8a4a2a" stroke-width="3"/><line x1="${Fx}" y1="${y-6}" x2="${Fx}" y2="${y+6}" stroke="#8a4a2a" stroke-width="3"/>`;
    h+=tx((lx+Fx)/2,y+24,show?`jarak fokus ${fm(f)} cm`:'jarak fokus: ?','#8a4a2a',18)}
  return h}

const scn=(k,p,hide,show,sc)=>k==='pantul'?scPantul({th:p.th,show,hide,surf:p.surf}):k==='bias'?scBias({...bz(p),show,hide}):k==='bayang'?scBayang({...p,show,hide,sc}):scLensa({R:p.R,n:p.n,show,hide});

/* ===== bidik cermin ===== */
const BM=250;
const BL=[{l:[60,100],t:[430,150]},{l:[60,80],t:[440,200]},{l:[60,150],t:[420,90]},{l:[70,60],t:[440,120]},{l:[60,120],t:[450,210]}];
const BSTART=[180,200,350,150,200];
const bstar=L=>{const[xl,yl]=L.l,[xt,yt]=L.t,t=(BM-yl)/(2*BM-yl-yt);return xl+t*(xt-xl)};
function bgeo(){const L=BL[S.bl],[xl,yl]=L.l,[xt,yt]=L.t,hx=S.bx,vx=hx-xl,vy=BM-yl;
  const dist=Math.abs(vx*(yt-BM)+vy*(xt-hx))/Math.hypot(vx,vy),yr=BM-(vy/vx)*(xt-hx),th=deg(Math.atan(vx/vy));
  return{L,xl,yl,xt,yt,hx,vx,vy,dist,yr,th,hit:dist<=22}}
function scBidik(){const g=bgeo(),{xl,yl,xt,yt,hx,vx,vy}=g;let h='';
  h+=`<rect x="20" y="256" width="460" height="30" fill="#e9dcc0"/><line x1="20" y1="256" x2="480" y2="256" stroke="#8a7c62" stroke-width="3"/>`;
  h+=`<rect x="${hx-45}" y="244" width="90" height="12" rx="4" fill="#bfe3f0" stroke="${DK}" stroke-width="3"/>`;
  h+=`<line x1="${hx}" y1="${BM}" x2="${hx}" y2="${BM-120}" stroke="#8a7c62" stroke-width="2" stroke-dasharray="6 6"/>`;
  const glow=S.bshot&&g.hit;
  h+=(glow?`<circle cx="${xt}" cy="${yt}" r="38" fill="#3f9d62" opacity=".3"/>`:'')+`<circle cx="${xt}" cy="${yt}" r="24" fill="#e0663a"/><circle cx="${xt}" cy="${yt}" r="16" fill="#fff"/><circle cx="${xt}" cy="${yt}" r="9" fill="#e0663a"/><circle cx="${xt}" cy="${yt}" r="3.5" fill="#f2b632"/>`+tx(xt,yt-32,'bintang','#a8421d',15);
  h+=ray(xl,yl,hx,BM,OR,5)+lamp(xl,yl,deg(Math.atan2(BM-yl,hx-xl)));
  if(S.bshot){const s=(490-hx)/vx;h+=ray(hx,BM,hx+s*vx,BM-s*vy,TL,5);
    const r=Math.atan(vx/vy);
    h+=`<path d="M ${hx} ${BM-50} A 50 50 0 0 0 ${hx-50*Math.sin(r)} ${BM-50*Math.cos(r)}" fill="none" stroke="${OR}" stroke-width="5" opacity=".85"/><path d="M ${hx} ${BM-50} A 50 50 0 0 1 ${hx+50*Math.sin(r)} ${BM-50*Math.cos(r)}" fill="none" stroke="${TL}" stroke-width="5" opacity=".85"/>`;
    h+=tx(hx-80*Math.sin(r/2),BM-80*Math.cos(r/2)+6,`${Math.round(g.th)}°`,OR,21)+tx(hx+80*Math.sin(r/2),BM-80*Math.cos(r/2)+6,`${Math.round(g.th)}°`,TL,21)}
  return h}

function addLog(m,grp,cells){const L=S.logs[m];if(L.some(r=>r.grp===grp))return;L.push({grp,cells});tone(500+L.length*120,.1)}
function info(){const m=S.mode,C=LOGCFG[m];let h='';
  if(C){const L=S.logs[m],n=new Set(L.map(r=>r.grp)).size;
    h+=`<h2>Catatan penemuan</h2>`;
    h+=L.length?`<table class="lg"><tr>${C.cols.map(c=>`<th>${c}</th>`).join('')}</tr>${L.slice(-6).map(r=>`<tr>${r.cells.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`:`<p class="meter">Belum ada catatan. Tebak, lalu tekan tombol Ukur.</p>`;
    h+=n>=3?`<div class="concl">💡 ${C.concl}</div>`:`<div class="meter">Temuan ${n} dari 3. Ukur 3 kali dengan pengaturan berbeda untuk menemukan aturannya.</div>`}
  h+=`<div class="note">${NOTES[m]}</div>`;$('info').className='card'+(C?'':' nolog');$('info').innerHTML=h}
function setRes(b,s,x=''){$('res').innerHTML=`<div class="big">${b}</div><div class="sm">${s}</div>${x}`}
function guide(q,s){$('gq').textContent=q;$('gs').textContent=s||''}

/* ===== render panggung ===== */
function render(){const m=S.mode;let g='';
  if(m==='pantul')g=sc1(scPantul({th:Math.round(S.th),show:S.show,rough:S.rough}));
  else if(m==='bias'){const b=BHN[S.bs];g=sc1(scBias({th:Math.round(S.bt),n:b.i,c:b.c,nm:b.n,show:S.show}))}
  else if(m==='bayang')g=sc1(scBayang({Hl:S.Hl,Ho:S.Ho,d:S.d,show:S.show}));
  else if(m==='lensa')g=sc1(scLensa({R:S.R,n:LB[S.ln].i,show:S.show}));
  else if(m==='tebak')g=S.done?sc1(scPantul({th:40,show:true})):qScene();
  else g=sc1(scBidik());
  $('sv').setAttribute('viewBox',S.vb.join(' '));$('sv').innerHTML=S.dark?dk(DEFS+g):DEFS+g}
function qScene(){const q=Q[S.q],a=S.answered,hide=!a;
  if(!q.B)return sc1(scn(q.k,q.A,hide,a));
  let sc;if(q.k==='bayang')sc=Math.min(bsc(q.A.Hl,q.A.Ho,q.A.d),bsc(q.B.Hl,q.B.Ho,q.B.d));
  return sc2(scn(q.k,q.A,hide,a,sc),scn(q.k,q.B,hide,a,sc),q.capA,q.capB)}

/* ===== PANTULAN ===== */
function iPantul(){
  $('panel').innerHTML=`<h2>Putar senter</h2>
  <div class="fld"><label for="rs">Arah senter</label><input type="range" id="rs" min="5" max="80" value="${Math.round(S.th)}"><div class="ends"><span>tegak</span><span>miring</span></div></div>
  <div class="chips"><button class="chip" data-r="0" aria-pressed="${!S.rough}">🪞 Cermin</button><button class="chip" data-r="1" aria-pressed="${S.rough}">📄 Kertas kasar</button></div>
  <button class="btn" id="bU">📐 Ukur sudut</button><button class="btn o" id="bD">▶ Peragakan</button>`;
  $('rs').oninput=e=>setTh(+e.target.value);
  $('panel').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{S.rough=c.dataset.r==='1';S.show=false;$('panel').querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c));render();resP()});
  $('bU').onclick=ukurP;$('bD').onclick=()=>demo.pantul();
  render();resP();info();
  if(S.auto)later(()=>demo.pantul(autoNext),600)}
function setTh(v){S.th=cl(v,5,80);S.show=false;if($('rs'))$('rs').value=Math.round(S.th);render();resP()}
function ukurP(){S.th=Math.round(S.th);S.show=true;render();resP();
  if(!S.rough){addLog('pantul',S.th,[S.th+'°',S.th+'°']);info()}tone(400+S.th*6,.2)}
function resP(){
  if(!S.show){setRes('?','Tebak dulu: berapa sudut pantulnya? Lalu tekan Ukur sudut.');guide(S.rough?'Ke mana cahaya akan terpantul dari kertas?':'Menurutmu, berapa sudut pantulnya?','Putar senter, tebak dulu, lalu ukur.');return}
  if(S.rough){setRes('Menyebar','Permukaan kasar memantulkan cahaya ke banyak arah, jadi kita tidak melihat bayangan di kertas. Aturan yang sama berlaku di tiap titik kecilnya, tetapi tiap titik miring ke arah berbeda.');guide('Mengapa kertas tidak seperti cermin?','Permukaannya kasar, jadi cahaya terpantul ke banyak arah.');return}
  const t=Math.round(S.th);setRes(`${t}° = ${t}°`,'Sudut datang sama dengan sudut pantul.');guide('Apakah dua sudut itu sama?','Putar senter ke arah lain dan ukur lagi.')}

/* ===== PEMBIASAN ===== */
function iBias(){
  $('panel').innerHTML=`<h2>Cahaya masuk ke...</h2>
  <div class="chips">${BHN.map((b,i)=>`<button class="chip" data-i="${i}" aria-pressed="${i===S.bs}">${b.n} (${fm(b.i,2)})</button>`).join('')}</div>
  <div class="fld"><label for="bsl">Arah cahaya</label><input type="range" id="bsl" min="0" max="80" value="${Math.round(S.bt)}"><div class="ends"><span>tegak</span><span>miring</span></div></div>
  <button class="btn" id="bU">📐 Ukur sudut</button><button class="btn o" id="bD">▶ Peragakan</button>`;
  $('panel').querySelectorAll('.chip').forEach(c=>c.onclick=()=>setBhn(+c.dataset.i));
  $('bsl').oninput=e=>setBt(+e.target.value);
  $('bU').onclick=ukurB;$('bD').onclick=()=>demo.bias();
  render();resB();info();
  if(S.auto)later(()=>demo.bias(autoNext),600)}
function setBhn(i){S.bs=i;S.show=false;$('panel').querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',+c.dataset.i===i));render();resB()}
function setBt(v){S.bt=cl(v,0,80);S.show=false;if($('bsl'))$('bsl').value=Math.round(S.bt);render();resB()}
function ukurB(){S.bt=Math.round(S.bt);S.show=true;const b=BHN[S.bs],t2=snell(S.bt,b.i);render();resB();
  addLog('bias',b.n+S.bt,[b.n,S.bt+'°',fd(t2)+'°']);info();tone(900-b.i*180,.2)}
function resB(){const b=BHN[S.bs],t=Math.round(S.bt);
  if(!S.show){setRes('?',`Tebak dulu: di dalam ${b.n.toLowerCase()}, cahaya membelok ke mana? Lalu tekan Ukur sudut.`);
    guide(b.i===1?'Kalau bahannya sama, apa yang terjadi?':`Ke mana cahaya akan membelok di dalam ${b.n.toLowerCase()}?`,'Tebak: mendekati atau menjauhi garis putus-putus?');return}
  const t2=snell(t,b.i);
  if(b.i===1)setRes(`${t}° → ${t}°`,'Udara ke udara: bahannya sama, jadi cahaya tidak membelok.');
  else setRes(`${t}° → ${fd(t2)}°`,`Di ${b.n.toLowerCase()} cahaya melambat jadi ${Math.round(100/b.i)}% dari kecepatannya di udara, ${t>0?`jadi membelok mendekati garis normal (${fm(t-t2)}° ke dalam).`:'tetapi karena datang tegak lurus, arahnya tidak berubah.'}`);
  guide('Seberapa besar belokannya?','Ganti bahan dengan sudut yang sama, lalu bandingkan.')}

/* ===== BAYANGAN ===== */
function iBayang(){
  $('panel').innerHTML=`<h2>Atur lampu dan benda</h2>
  <div class="fld"><label for="sHl">Tinggi lampu <b id="vHl"></b></label><input type="range" id="sHl" min="150" max="300" step="10" value="${S.Hl}"></div>
  <div class="fld"><label for="sHo">Tinggi benda <b id="vHo"></b></label><input type="range" id="sHo" min="20" max="120" step="5" value="${S.Ho}"></div>
  <div class="fld"><label for="sD">Jarak benda dari lampu <b id="vD"></b></label><input type="range" id="sD" min="20" max="200" step="10" value="${S.d}"></div>
  <button class="btn" id="bU">📏 Ukur bayangan</button><button class="btn o" id="bD">▶ Peragakan</button>`;
  $('sHl').oninput=e=>setBy({Hl:+e.target.value});$('sHo').oninput=e=>setBy({Ho:+e.target.value});$('sD').oninput=e=>setBy({d:+e.target.value});
  $('bU').onclick=ukurBy;$('bD').onclick=()=>demo.bayang();
  syncBy();render();resBy();info();
  if(S.auto)later(()=>demo.bayang(autoNext),600)}
function syncBy(){S.Ho=Math.min(S.Ho,S.Hl-40);$('sHo').max=Math.min(120,S.Hl-40);$('sHo').value=S.Ho;$('sHl').value=S.Hl;$('sD').value=S.d;$('vHl').textContent=S.Hl+' cm';$('vHo').textContent=S.Ho+' cm';$('vD').textContent=S.d+' cm'}
function setBy(o){Object.assign(S,o);S.show=false;syncBy();render();resBy()}
function ukurBy(){S.show=true;const s=shd(S.Hl,S.Ho,S.d);render();resBy();addLog('bayang',`${S.Hl}-${S.Ho}-${S.d}`,[S.Hl+' cm',S.Ho+' cm',S.d+' cm',fm(s)+' cm']);info();tone(300+s,.2)}
function resBy(){
  if(!S.show){setRes('?','Tebak dulu: seberapa panjang bayangan di lantai? Lalu tekan Ukur bayangan.');guide('Seberapa panjang bayangannya?','Tebak dulu, lalu ukur.');return}
  const s=shd(S.Hl,S.Ho,S.d);setRes(`${fm(s)} cm`,`${S.d} × ${S.Ho} ÷ (${S.Hl} − ${S.Ho}) = ${fm(s)} cm`);
  guide('Apa yang membuat bayangan lebih panjang?','Coba turunkan lampu atau geser bendanya, lalu ukur lagi.')}

/* ===== LENSA ===== */
function iLensa(){
  $('panel').innerHTML=`<h2>Atur lensa</h2>
  <div class="fld"><label for="sR">Jari-jari kelengkungan <b id="vR"></b></label><input type="range" id="sR" min="20" max="100" step="5" value="${S.R}"><div class="ends"><span>makin melengkung</span><span>makin pipih</span></div></div>
  <div class="chips">${LB.map((b,i)=>`<button class="chip" data-i="${i}" aria-pressed="${i===S.ln}">${b.n} (${fm(b.i,2)})</button>`).join('')}</div>
  <button class="btn" id="bU">📏 Ukur fokus</button><button class="btn o" id="bD">▶ Peragakan</button>`;
  $('sR').oninput=e=>setLn({R:+e.target.value});
  $('panel').querySelectorAll('.chip').forEach(c=>c.onclick=()=>setLn({ln:+c.dataset.i}));
  $('bU').onclick=ukurL;$('bD').onclick=()=>demo.lensa();
  syncL();render();resL();info();
  if(S.auto)later(()=>demo.lensa(autoNext),600)}
function syncL(){$('sR').value=S.R;$('vR').textContent=S.R+' cm';$('panel').querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',+c.dataset.i===S.ln))}
function setLn(o){Object.assign(S,o);S.show=false;syncL();render();resL()}
function ukurL(){S.show=true;const n=LB[S.ln],f=foc(S.R,n.i);render();resL();addLog('lensa',`${S.R}-${S.ln}`,[S.R+' cm',n.n,fm(f)+' cm']);info();tone(1200-f*3,.2)}
function resL(){
  if(!S.show){setRes('?','Tebak dulu: seberapa jauh titik fokusnya dari lensa? Lalu tekan Ukur fokus.');guide('Seberapa jauh titik fokusnya?','Tebak dulu, lalu ukur.');return}
  const n=LB[S.ln],f=foc(S.R,n.i);setRes(`f = ${fm(f)} cm`,`${S.R} ÷ (2 × (${fm(n.i,2)} − 1)) = ${fm(f)} cm. Kekuatan lensa ${fm(100/f,2)} dioptri.`);
  guide('Apa yang membuat fokus makin dekat?','Ubah kelengkungan atau bahan, lalu ukur lagi.')}

/* ===== TEBAK DULU ===== */
function showQ(){
  if(S.q>=Q.length)return endQ();
  const q=Q[S.q];S.answered=false;S.tries=0;
  $('panel').innerHTML=`<h2>Soal ${S.q+1} dari ${Q.length}</h2><p class="qt">${q.t}</p><div id="opts">${q.opts.map((o,i)=>`<button class="optv" data-i="${i}">${o.t}</button>`).join('')}</div>`;
  setRes('?',`Bintang: ${S.stars}`);
  $('panel').querySelectorAll('.optv').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  render();guide('Tebak dulu, ke mana cahaya akan pergi?','Pilih satu jawaban.');info();
  if(S.auto)later(()=>{const i=q.opts.findIndex(o=>o.k===q.calc());pick(i)},3800)}
function pick(i){const q=Q[S.q];if(S.answered)return;
  const bs=[...document.querySelectorAll('.optv')],good=q.opts[i].k===q.calc(),cor=q.opts.findIndex(o=>o.k===q.calc());S.tries++;
  const finish=()=>{S.answered=true;bs.forEach(b=>b.disabled=true);bs[cor].classList.add('good');render();
    const x=`<button class="btn" id="nx">${S.q+1>=Q.length?'Lihat hasil ›':'Soal berikutnya ›'}</button>`;return x};
  if(good){if(S.tries===1)S.stars++;const x=finish();ok();setRes(S.tries===1?'Tepat!':'Nah, benar!',q.why(),x);
    guide('Apakah tebakanmu cocok dengan gambar?','Gambar membuktikannya.')}
  else if(S.tries===1){bs[i].disabled=true;bs[i].classList.add('bad');bad();setRes('Belum tepat',`Petunjuk: ${q.hint} Coba sekali lagi.`);guide('Coba sekali lagi.','Perhatikan petunjuknya.');return}
  else{bs[i].classList.add('bad');const x=finish();bad();setRes('Jawabannya: '+q.opts[cor].t,q.why(),x);guide('Apakah tebakanmu cocok dengan gambar?','Gambar membuktikannya.')}
  $('nx').onclick=()=>{S.q++;showQ()};
  if(S.auto)later(()=>$('nx')&&$('nx').click(),4200)}
function endQ(){S.done=true;
  $('panel').innerHTML=`<h2>Selesai!</h2><div class="stars">${'★'.repeat(S.stars)}${'☆'.repeat(Q.length-S.stars)}</div><button class="btn" id="again">Main lagi</button>`;
  setRes(`${S.stars} dari ${Q.length}`,'Tebakan makin jitu kalau sering menguji dengan percobaan. Cahaya selalu mengikuti aturan yang sama.');
  $('again').onclick=()=>{S.q=0;S.stars=0;S.done=false;showQ()};
  guide('Berapa bintang yang kamu dapat?','Cahaya selalu mengikuti aturan yang sama.');render();info();
  if(S.auto)autoNext()}

/* ===== BIDIK CERMIN ===== */
function bLevel(){
  if(S.bl>=BL.length)return bEnd();
  S.bshot=false;S.bhit=false;S.btries=0;S.bx=BSTART[S.bl];
  $('panel').innerHTML=`<h2>Level ${S.bl+1} dari ${BL.length}</h2><p class="qt">Sinari bintang lewat cermin kecil. Geser cermin, lalu pantulkan.</p>
  <div class="fld"><label for="bsl">Posisi cermin</label><input type="range" id="bsl" min="120" max="400" value="${S.bx}"><div class="ends"><span>kiri</span><span>kanan</span></div></div>
  <button class="btn" id="bFire">✨ Pantulkan!</button>`;
  $('bsl').oninput=e=>moveB(+e.target.value);$('bFire').onclick=fireB;
  setRes('?',`Bintang: ${S.bstars}`);
  render();guide('Di mana cermin harus diletakkan?','Sinar datang dan sinar pantul harus membentuk sudut yang sama.');info();
  if(S.auto){const hs=bstar(BL[S.bl]),st=[];
    if(S.bl===0)st.push([900,()=>bmove(hs-95)],[1500,fireB],[1600,()=>bmove(hs)],[1400,fireB]);else st.push([900,()=>bmove(hs)],[1400,fireB]);
    st.push([3200,()=>$('bNx')&&$('bNx').click()]);seq(st)}}
function moveB(x){if(S.bhit)return;S.bx=cl(x,120,400);S.bshot=false;const s=$('bsl');if(s)s.value=Math.round(S.bx);render()}
function bmove(x){tween(()=>S.bx,v=>moveB(v),x,900)}
function fireB(){if(S.bhit)return;S.btries++;S.bshot=true;const g=bgeo();render();
  if(g.hit){S.bhit=true;const s=Math.max(1,4-S.btries);S.bstars+=s;ok();$('bsl').disabled=true;$('bFire').disabled=true;
    setRes(`Kena! ${'★'.repeat(s)}`,`Sudut datang ${Math.round(g.th)}° = sudut pantul ${Math.round(g.th)}°. Cermin ada di titik yang tepat.`,`<button class="btn" id="bNx">${S.bl+1>=BL.length?'Lihat hasil ›':'Level berikutnya ›'}</button>`);
    $('bNx').onclick=()=>{S.bl++;bLevel()};guide('Mengapa cahaya mengenai bintang?','Karena sudut datang dan sudut pantulnya sama.')}
  else{bad();const above=g.yr<g.yt,right=g.hx<bstar(g.L);
    setRes('Meleset',S.btries===1?`Sinar lewat di ${above?'atas':'bawah'} bintang. Sudut datang dan pantul tetap sama, jadi geser cermin lalu coba lagi.`:`Sinar masih lewat di ${above?'atas':'bawah'} bintang. Coba geser cermin sedikit ke ${right?'kanan':'kiri'}.`);
    guide('Ke mana cermin harus digeser?','Perhatikan di mana sinar pantul lewat.')}}
function bEnd(){S.done=true;S.bl=BL.length-1;S.bx=bstar(BL[S.bl]);S.bshot=true;S.bhit=true;
  $('panel').innerHTML=`<h2>Selesai!</h2><div class="stars">${S.bstars} ★</div><button class="btn" id="again">Main lagi</button>`;
  setRes(`${S.bstars} dari ${BL.length*3}`,'Kamu memakai hukum pemantulan: sudut datang sama dengan sudut pantul.');
  $('again').onclick=()=>{S.bl=0;S.bstars=0;S.done=false;bLevel()};guide('Berapa bintang yang kamu dapat?','');render();info();
  if(S.auto)autoNext()}

/* ===== peragaan (juga dipakai mode Otomatis) ===== */
const demo={
 pantul(done){S.rough=false;iPantulSoft();const sw=t=>tween(()=>S.th,v=>{S.th=v;S.show=false;$('rs').value=Math.round(v);render()},t,900,()=>{S.th=Math.round(S.th)});
   seq([[300,()=>sw(20)],[1300,ukurP],[1800,()=>sw(45)],[1300,ukurP],[1800,()=>sw(70)],[1300,ukurP],[2500,()=>{S.rough=true;S.th=45;S.show=false;iPantulSoft();render();resP()}],[1500,ukurP],[3500,()=>done&&done()]])},
 bias(done){S.bt=50;iBiasSoft();seq([[300,()=>setBhn(0)],[900,ukurB],[1800,()=>setBhn(1)],[900,ukurB],[1800,()=>setBhn(2)],[900,ukurB],[1800,()=>setBhn(3)],[900,ukurB],[4500,()=>done&&done()]])},
 bayang(done){iBayangSoft();seq([[300,()=>setBy({Hl:200,Ho:60,d:120})],[900,ukurBy],[1800,()=>setBy({Hl:130,Ho:60,d:120})],[900,ukurBy],[1800,()=>setBy({Hl:200,Ho:60,d:50})],[900,ukurBy],[4500,()=>done&&done()]])},
 lensa(done){iLensaSoft();seq([[300,()=>setLn({R:100,ln:1})],[900,ukurL],[1800,()=>setLn({R:40,ln:1})],[900,ukurL],[1800,()=>setLn({R:40,ln:2})],[900,ukurL],[4500,()=>done&&done()]])}};
/* penyegar panel tanpa memulai peragaan otomatis */
function iPantulSoft(){const a=S.auto;S.auto=false;iPantul();S.auto=a}
function iBiasSoft(){const a=S.auto;S.auto=false;iBias();S.auto=a}
function iBayangSoft(){const a=S.auto;S.auto=false;iBayang();S.auto=a}
function iLensaSoft(){const a=S.auto;S.auto=false;iLensa();S.auto=a}
function autoNext(){if(!S.auto)return;later(()=>{if(!S.auto)return;const i=MODES.findIndex(x=>x[0]===S.mode);go(MODES[(i+1)%MODES.length][0])},5000)}

/* ===== pointer / keyboard ===== */
const sv=$('sv');let dr=false;
function loc(e){const r=sv.getBoundingClientRect(),v=S.vb,X=v[0]+(e.clientX-r.left)*v[2]/r.width,Y=v[1]+(e.clientY-r.top)*v[3]/r.height;return[(X-S.tf.tx)/S.tf.k,Y/S.tf.k]}
function aim(e){const[x,y]=loc(e),m=S.mode;
  if(m==='pantul'){if(y>235)return;setTh(deg(Math.atan2(250-x,250-y)))}
  else if(m==='bias'){if(y>140)return;setBt(deg(Math.atan2(250-x,150-y)))}
  else if(m==='bidik'){moveB(x)}}
sv.addEventListener('pointerdown',e=>{if(!['pantul','bias','bidik'].includes(S.mode))return;dr=true;sv.setPointerCapture(e.pointerId);aim(e)});
sv.addEventListener('pointermove',e=>{if(dr)aim(e)});
sv.addEventListener('pointerup',()=>dr=false);sv.addEventListener('pointercancel',()=>dr=false);
sv.addEventListener('keydown',e=>{const d=e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:0;if(!d)return;const st=e.shiftKey?5:1;
  if(S.mode==='pantul'){e.preventDefault();setTh(S.th+d*st)}else if(S.mode==='bias'){e.preventDefault();setBt(S.bt+d*st)}else if(S.mode==='bidik'){e.preventDefault();moveB(S.bx+d*st*5)}});

/* ===== mode & tombol ===== */
function go(m){clr();S.mode=m;S.show=false;S.q=0;S.stars=0;S.tries=0;S.answered=false;S.done=false;S.bl=0;S.bstars=0;dr=false;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.m===m));
  $('sv').style.touchAction=['pantul','bias','bidik'].includes(m)?'none':'auto';
  $('hint').textContent=(S.dark?'🔦 Ruangan gelap, hanya senter yang menyala. ':'')+HINTS[m];
  ({pantul:iPantul,bias:iBias,bayang:iBayang,lensa:iLensa,tebak:showQ,bidik:bLevel})[m]()}
$('tabs').innerHTML=MODES.map(([k,l])=>`<button class="tab" role="tab" data-m="${k}" aria-selected="${k==='pantul'}">${l}</button>`).join('');
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(t.dataset.m));
$('tgRec').onclick=e=>{S.rec=!S.rec;document.body.classList.toggle('rec',S.rec);e.currentTarget.setAttribute('aria-pressed',S.rec)};
$('tgDark').onclick=e=>{S.dark=!S.dark;document.body.classList.toggle('dark',S.dark);e.currentTarget.setAttribute('aria-pressed',S.dark);
  $('hint').textContent=(S.dark?'🔦 Ruangan gelap, hanya senter yang menyala. ':'')+HINTS[S.mode];render();tone(S.dark?220:520,.06,'square',.08);setTimeout(()=>tone(S.dark?700:300,.1,'square',.06),70)};
$('tgSnd').onclick=e=>{S.snd=!S.snd;e.currentTarget.setAttribute('aria-pressed',S.snd)};
$('tgAuto').onclick=e=>{S.auto=!S.auto;e.currentTarget.setAttribute('aria-pressed',S.auto);go(S.mode)};
$('tgFs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};
let wasN=NARROW();addEventListener('resize',()=>{if(NARROW()!==wasN){wasN=NARROW();render()}});
go('pantul');
})();
</script>
<script src="../alat-nav-kembali.js" defer></script>
