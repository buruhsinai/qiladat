<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suhu Raba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf6e8;--card:#fff;--line:#f0e2c4;--ink:#3a3226;--dim:#7a6c52;--accent:#c1705a;--accent-d:#8a3f2c;--soft:#f9e8e1;--ok:#3f9d62;--warn:#e0663a;--gold:#f2b632;--display:'Fredoka',sans-serif;--sans:'Quicksand',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55}
button{font-family:inherit}
button:focus-visible,svg:focus-visible{outline:3px solid var(--accent-d);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding:0 18px 56px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:22px 0 16px}
.top h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,36px);margin:0;color:var(--accent-d);line-height:1.1}
.top p{margin:4px 0 0;color:var(--dim);font-size:.95rem}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:6px;background:#f6e3da;padding:5px;border-radius:16px;flex-wrap:wrap}
.tab{font-family:var(--display);font-weight:600;font-size:.95rem;border:none;background:transparent;color:var(--dim);padding:9px 14px;border-radius:12px;cursor:pointer}
.tab[aria-selected=true]{background:var(--accent);color:#fff}
.tg{font-family:var(--display);font-weight:600;font-size:.85rem;border:2px solid var(--line);background:#fff;color:var(--dim);padding:8px 12px;border-radius:12px;cursor:pointer}
.tg[aria-pressed=true]{border-color:var(--accent);background:var(--soft);color:var(--accent-d)}
.layout{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:920px){.layout{grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);align-items:start}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 18px}
.card h2{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:0 0 8px;color:var(--accent-d)}
.guide{background:#fff3e6;border:2px dashed var(--warn)}
.guide .q{font-family:var(--display);font-weight:700;font-size:1.25rem;color:#a8421d;line-height:1.25}
.guide .s{font-size:.85rem;color:var(--dim);margin-top:4px}
#sv{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:ns-resize}
.hint{font-size:.85rem;color:#a89b80;margin:6px 4px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--display);font-weight:600;font-size:.9rem;background:#fffdf8;border:2px solid var(--line);color:var(--dim);padding:8px 13px;border-radius:20px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.seen{border-color:var(--ok);color:#2d7a4b}
.chip:disabled{opacity:.55;cursor:default}
.btn{font-family:var(--display);font-weight:600;font-size:.95rem;padding:11px 16px;border-radius:12px;border:none;cursor:pointer;background:var(--accent);color:#fff;margin:8px 8px 0 0}
.btn.o{background:#fff;border:2px solid var(--accent);color:var(--accent-d)}
.res{background:var(--soft);border-color:#eccfc4;text-align:center;min-height:96px}
.res .big{font-family:var(--display);font-weight:700;font-size:1.9rem;color:var(--accent-d);line-height:1.15}
.res .sm{font-size:.95rem;color:#6b4a30;margin-top:4px}
.stars{font-size:1.6rem;letter-spacing:4px;color:var(--gold)}
body.rec .top p,body.rec .hint{display:none}
body.rec .app{max-width:1400px}
body.rec .guide .q{font-size:1.7rem}body.rec .res .big{font-size:2.6rem}body.rec .res .sm{font-size:1.2rem}body.rec .btn,body.rec .chip{font-size:1.2rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>🌡️ Suhu Raba</h1><p>Termometer mengukur panas dan dingin: makin panas, cairannya makin naik.</p></div>
    <div class="toolbar">
      <div class="tabs" role="tablist" id="tabs"></div>
      <button class="tg" id="tgRec" aria-pressed="false">🎬 Mode rekam</button>
      <button class="tg" id="tgFs">⛶ Layar penuh</button>
      <button class="tg" id="tgSnd" aria-pressed="true">🔊 Suara</button>
      <button class="tg" id="tgAuto" aria-pressed="false">🔁 Otomatis</button>
    </div>
  </div>
  <div class="layout">
    <div class="col">
      <div class="card">
        <svg id="sv" viewBox="0 0 1000 500" tabindex="0" role="img" aria-label="Termometer. Seret, ketuk, atau tekan panah atas dan bawah untuk mengubah suhu."></svg>
        <div class="hint" id="hint"></div>
      </div>
    </div>
    <div class="col">
      <div class="card guide"><div class="q" id="gq"></div><div class="s" id="gs"></div></div>
      <div class="card" id="panel"></div>
      <div class="card res" id="res"></div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const MIN=-10,MAX=110,RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const SK=[
 {c:-10,e:'❄️',n:'Freezer sangat dingin',h:'Freezer jauh di bawah 0°C, jadi es batu keras.'},
 {c:0,e:'🧊',n:'Es mencair, air membeku',h:'Air membeku dan es mencair tepat di 0°C.'},
 {c:4,e:'🥛',n:'Dalam kulkas',h:'Kulkas dibuat dingin, tapi sedikit di atas 0°C supaya makanan tidak membeku.'},
 {c:20,e:'🏠',n:'Ruangan yang sejuk',h:'Ruangan yang sejuk sekitar 20°C.'},
 {c:30,e:'☀️',n:'Cuaca hangat',h:'Hari yang hangat sekitar 30°C.'},
 {c:37,e:'🧒',n:'Tubuh manusia sehat',h:'Tubuh sehat sekitar 37°C, hampir sama di mana pun cuacanya.'},
 {c:40,e:'🛁',n:'Air hangat untuk mandi',h:'Air mandi yang hangat sedikit lebih panas dari tubuh.'},
 {c:60,e:'🍵',n:'Air panas seduh teh',h:'Air sepanas ini sudah bisa menyakiti kulit.'},
 {c:100,e:'♨️',n:'Air mendidih',h:'Air mendidih di 100°C (di tepi laut). Jangan disentuh!'}];
const S={mode:'jelajah',T:20,num:true,show:true,drag:true,rec:false,snd:true,auto:false,seen:new Set(),q:0,stars:0,done:false,answered:false,timers:[],ord:[],err:0};
const clr=()=>{S.timers.forEach(clearTimeout);S.timers=[]},later=(f,ms)=>S.timers.push(setTimeout(f,ms));
const Y=T=>420-(T-MIN)/(MAX-MIN)*390;
function col(T){const t=Math.max(0,Math.min(1,(T-MIN)/(MAX-MIN))),a=[79,134,198],b=[200,80,60];return`rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*t))})`}
function near(T){return SK.reduce((a,b)=>Math.abs(b.c-T)<Math.abs(a.c-T)?b:a)}
function rasa(T){return T<0?'Beku! Sangat dingin.':T<10?'Dingin sekali.':T<25?'Sejuk.':T<35?'Hangat.':T<45?'Hangat, nyaman untuk mandi.':T<60?'Panas, hati-hati.':'Sangat panas! Jangan disentuh.'}

/* suara */
let AC,lastT=0;
function tone(f,d=.12,t='sine',v=.12){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const pitch=T=>tone(220+(T-MIN)*4,.09,'sine',.07),ok=()=>{tone(660,.12);setTimeout(()=>tone(880,.18),110)},bad=()=>tone(200,.25,'triangle');

function draw(){
  const T=S.T,c=col(T),n=near(T);let h='';
  for(let t=-10;t<=110;t+=10){const y=Y(t);h+=`<line x1="${t%50===0?116:128}" y1="${y}" x2="146" y2="${y}" stroke="#8a7c62" stroke-width="2"/>`;
    if(S.num&&t%20===0)h+=`<text x="108" y="${y+6}" text-anchor="end" font-family="Fredoka" font-size="18" fill="#7a6c52">${t}</text>`}
  h+=`<rect x="148" y="20" width="44" height="420" rx="22" fill="#fff" stroke="#8a7c62" stroke-width="3"/><circle cx="170" cy="456" r="38" fill="#fff" stroke="#8a7c62" stroke-width="3"/>`;
  h+=`<circle cx="170" cy="456" r="32" fill="${c}"/><rect x="159" y="${Y(T)}" width="22" height="${450-Y(T)}" fill="${c}"/>`;
  h+=`<circle cx="170" cy="${Y(T)}" r="16" fill="#fff" stroke="${c}" stroke-width="5"/>`;
  if(S.show)SK.forEach(s=>{h+=`<circle cx="214" cy="${Y(s.c)}" r="${s===n?9:6}" fill="${S.seen.has(s.c)||s===n?col(s.c):'#e6dcc6'}" stroke="#fff" stroke-width="2"/>`});
  h+=`<text x="620" y="110" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="92" fill="${S.num?c:'#b9ad94'}">${S.num?Math.round(T)+'°C':'?'}</text>`;
  if(S.show){h+=`<text x="620" y="290" text-anchor="middle" font-size="140">${n.e}</text><text x="620" y="350" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="36" fill="#3a3226">${Math.abs(T-n.c)<=4?'Seperti: ':'Mendekati: '}${n.n}</text><text x="620" y="400" text-anchor="middle" font-family="Quicksand" font-weight="600" font-size="28" fill="${c}">${rasa(T)}</text>`}
  else h+=`<text x="620" y="280" text-anchor="middle" font-size="130">🤔</text>`;
  $('sv').innerHTML=h}

function slide(to,cb){clr();if(RM){S.T=to;draw();cb&&cb();return}
  const f=S.T,t0=performance.now();(function g(t){const p=Math.min(1,(t-t0)/800),q=1-Math.pow(1-p,3);S.T=f+(to-f)*q;draw();p<1?requestAnimationFrame(g):cb&&cb()})(t0)}

const sv=$('sv');let dr=false;
function setY(e){const r=sv.getBoundingClientRect(),y=(e.clientY-r.top)*500/r.height;setT(MIN+(420-y)/390*(MAX-MIN))}
function setT(T){T=Math.max(MIN,Math.min(MAX,T));if(Math.abs(T-lastT)>=2){pitch(T);lastT=T}S.T=T;
  if(S.mode==='jelajah'){const n=near(T);if(Math.abs(T-n.c)<=1.5&&!S.seen.has(n.c)){S.seen.add(n.c);tone(880,.1);jelRes();jelPanel()}}
  draw();setGuide()}
sv.addEventListener('pointerdown',e=>{if(!S.drag)return;dr=true;sv.setPointerCapture(e.pointerId);setY(e)});
sv.addEventListener('pointermove',e=>{if(dr)setY(e)});
sv.addEventListener('pointerup',()=>dr=false);
sv.addEventListener('keydown',e=>{if(!S.drag)return;const d=e.key==='ArrowUp'?1:e.key==='ArrowDown'?-1:0;if(d){e.preventDefault();setT(S.T+d*(e.shiftKey?10:1))}});

function setGuide(){let q='',s='';
  if(S.mode==='jelajah'){q=S.seen.size>=SK.length?'Mengapa cairan di termometer bisa naik?':'Suhu berapa yang cocok dengan benda ini?';s=S.seen.size>=SK.length?'Cairannya memuai kalau panas.':`Temukan semua titik: ${S.seen.size} dari ${SK.length}.`}
  else if(S.mode==='tebak'){q=S.done?'Berapa bintang yang kamu dapat?':S.answered?'Seberapa dekat tebakanmu?':'Menurutmu, berapa suhunya?';s=S.answered?'Termometer menunjukkan suhu sebenarnya.':'Geser cairan, lalu periksa.'}
  else{q=S.done?'Sudah urut dari dingin ke panas?':'Mana yang paling dingin?';s='Ketuk benda dari yang paling dingin.'}
  $('gq').textContent=q;$('gs').textContent=s}

/* ===== Jelajah ===== */
function jelRes(){const n=near(S.T);
  $('res').innerHTML=S.seen.size>=SK.length?`<div class="big">Makin panas, makin naik</div><div class="sm">Cairan di dalam termometer memuai kalau panas dan menyusut kalau dingin. Air membeku di 0°C, mendidih di 100°C, dan tubuh sehat sekitar 37°C.</div>`:`<div class="big">${Math.round(S.T)}°C</div><div class="sm">${Math.abs(S.T-n.c)<=4?n.h:rasa(S.T)}</div>`}
function jelPanel(){$('panel').innerHTML=`<h2>Titik suhu (${S.seen.size}/${SK.length})</h2><div class="chips">${SK.map(s=>`<button class="chip${S.seen.has(s.c)?' seen':''}" data-c="${s.c}">${S.seen.has(s.c)?'✓ ':''}${s.e} ${s.c}°C</button>`).join('')}</div><button class="btn o" id="sw">▶ Naik otomatis</button>`;
  $('panel').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{clr();slide(+b.dataset.c,()=>{setT(S.T)})});
  $('sw').onclick=sweep}
function sweep(){clr();SK.forEach((s,i)=>later(()=>slide(s.c,()=>{setT(s.c)}),i*2600))}
function jelajah(){S.num=true;S.show=true;S.drag=true;$('hint').textContent='Seret, ketuk, atau tekan panah atas/bawah (Shift = 10°C). Titik di samping termometer adalah benda nyata.';
  jelPanel();jelRes();draw();setGuide();if(S.auto&&S.seen.size<SK.length)later(sweep,800)}

/* ===== Tebak ===== */
const TQ=[1,5,3,6,7,8];
function tebak(){
  if(S.q>=TQ.length){S.done=true;S.num=true;S.show=false;S.drag=false;draw();
    $('panel').innerHTML=`<h2>Selesai!</h2><div class="stars">${'★'.repeat(S.stars)}${'☆'.repeat(TQ.length*3-S.stars)}</div><button class="btn" id="again">Main lagi</button>`;
    $('res').innerHTML=`<div class="big">${S.stars} dari ${TQ.length*3}</div><div class="sm">Tanganmu hanya bisa merasa hangat atau dingin. Untuk angka yang pasti, pakailah termometer.</div>`;
    $('again').onclick=()=>{S.q=0;S.stars=0;S.done=false;tebak()};setGuide();return}
  const it=SK[TQ[S.q]];S.done=false;S.answered=false;S.num=false;S.show=false;S.drag=true;S.T=20;
  $('panel').innerHTML=`<h2>Soal ${S.q+1} dari ${TQ.length}</h2><p style="margin:0 0 4px;font-size:2rem;text-align:center">${it.e}</p><p style="margin:0;text-align:center;font-family:var(--display);font-weight:600;font-size:1.2rem">${it.n}</p><button class="btn" id="chk">Periksa tebakanku</button>`;
  $('hint').textContent='Angka disembunyikan. Geser cairan sampai kamu kira cocok.';
  $('res').innerHTML=`<div class="big">?</div><div class="sm">Bintang: ${S.stars}</div>`;
  const check=()=>{if(S.answered)return;S.answered=true;S.drag=false;const g=S.T,d=Math.abs(g-it.c),st=d<=5?3:d<=15?2:1;S.stars+=st;st===3?ok():bad();
    $('chk').style.display='none';S.num=true;slide(it.c,()=>{S.show=false;draw();
      $('res').innerHTML=`<div class="big">${it.c}°C ${'★'.repeat(st)}</div><div class="sm">${st===3?'Tebakanmu hampir tepat! ':`Tebakanmu ${Math.round(g)}°C, ${g>it.c?'terlalu panas':'terlalu dingin'}. `}${it.h}</div><button class="btn" id="nx">Soal berikutnya ›</button>`;
      $('nx').onclick=()=>{S.q++;tebak()};if(S.auto)later(()=>$('nx')&&$('nx').click(),3800)});
    draw();setGuide()};
  $('chk').onclick=check;
  draw();setGuide();
  if(S.auto)later(()=>{if(S.answered)return;slide(Math.max(MIN,Math.min(MAX,it.c+(S.q%2?-9:12))),()=>later(check,1200))},3500)}

/* ===== Urutkan ===== */
const RD=[[1,3,8],[7,2,5,3],[6,5,4,3]];
function urut(){
  if(S.q>=RD.length){S.done=true;S.num=true;S.show=false;S.drag=false;draw();
    $('panel').innerHTML=`<h2>Selesai!</h2><div class="stars">${'★'.repeat(S.stars)}${'☆'.repeat(RD.length*3-S.stars)}</div><button class="btn" id="again">Main lagi</button>`;
    $('res').innerHTML=`<div class="big">${S.stars} dari ${RD.length*3}</div><div class="sm">Urutan dari dingin ke panas sama dengan urutan dari rendah ke tinggi di termometer.</div>`;
    $('again').onclick=()=>{S.q=0;S.stars=0;S.done=false;urut()};setGuide();return}
  S.done=false;S.num=false;S.show=false;S.drag=false;S.err=0;S.ord=[];S.T=20;
  const ids=RD[S.q],sorted=ids.slice().sort((a,b)=>SK[a].c-SK[b].c),shuf=ids.slice(S.q+1).concat(ids.slice(0,S.q+1));
  $('panel').innerHTML=`<h2>Putaran ${S.q+1} dari ${RD.length}</h2><div class="chips">${shuf.map(i=>`<button class="chip" data-i="${i}">${SK[i].e} ${SK[i].n}</button>`).join('')}</div>`;
  $('hint').textContent='Ketuk dari yang paling dingin ke yang paling panas.';
  $('res').innerHTML=`<div class="big">?</div><div class="sm">Ketuk benda yang paling dingin dulu.</div>`;
  $('panel').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(b.disabled)return;
    if(i===sorted[S.ord.length]){S.ord.push(i);b.disabled=true;b.setAttribute('aria-pressed','true');ok();S.num=true;slide(SK[i].c,()=>{
      if(S.ord.length===ids.length){const st=S.err===0?3:S.err===1?2:1;S.stars+=st;
        $('res').innerHTML=`<div class="big">${'★'.repeat(st)}</div><div class="sm">${S.ord.map(j=>`${SK[j].e} ${SK[j].c}°C`).join(' < ')}</div><button class="btn" id="nx">Putaran berikutnya ›</button>`;
        $('nx').onclick=()=>{S.q++;urut()};if(S.auto)later(()=>$('nx')&&$('nx').click(),3800)}
      else $('res').innerHTML=`<div class="big">${SK[i].c}°C</div><div class="sm">Betul. Sekarang cari yang lebih panas dari ini.</div>`});
      if(S.auto&&S.ord.length<ids.length)later(()=>{const nx=sorted[S.ord.length],bt=[...document.querySelectorAll('.chip')].find(x=>+x.dataset.i===nx);bt&&bt.click()},2800)}
    else{S.err++;bad();$('res').innerHTML=`<div class="big">Belum</div><div class="sm">Masih ada yang lebih dingin dari ${SK[i].n.toLowerCase()}. Coba lagi.</div>`}});
  draw();setGuide();
  if(S.auto)later(()=>{const bt=[...document.querySelectorAll('.chip')].find(x=>+x.dataset.i===sorted[0]);bt&&bt.click()},3000)}

const MODES=[['jelajah','🔍 Jelajah Suhu'],['tebak','🤔 Tebak Dulu'],['urut','↕️ Urutkan']];
function go(m){clr();S.mode=m;S.q=0;S.stars=0;S.done=false;S.answered=false;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.m===m));
  m==='jelajah'?jelajah():m==='tebak'?tebak():urut()}
$('tabs').innerHTML=MODES.map(([k,l])=>`<button class="tab" role="tab" data-m="${k}" aria-selected="${k==='jelajah'}">${l}</button>`).join('');
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(t.dataset.m));
$('tgRec').onclick=e=>{S.rec=!S.rec;document.body.classList.toggle('rec',S.rec);e.currentTarget.setAttribute('aria-pressed',S.rec)};
$('tgSnd').onclick=e=>{S.snd=!S.snd;e.currentTarget.setAttribute('aria-pressed',S.snd)};
$('tgAuto').onclick=e=>{S.auto=!S.auto;e.currentTarget.setAttribute('aria-pressed',S.auto);go(S.mode)};
$('tgFs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};
go('jelajah');
</script>
<script src="../alat-nav-kembali.js" defer></script>
</body>
</html>
