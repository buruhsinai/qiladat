<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ubin Ajaib</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf6e8;--card:#fff;--line:#f0e2c4;--ink:#3a3226;--dim:#7a6c52;--accent:#c9784f;--accent-d:#8a4a2a;--soft:#f7e9df;--ok:#3f9d62;--warn:#e0663a;--gold:#f2b632;--display:'Fredoka',sans-serif;--sans:'Quicksand',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55}
button{font-family:inherit}
button:focus-visible,svg:focus-visible{outline:3px solid var(--accent-d);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding:0 18px 56px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:22px 0 16px}
.top h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,36px);margin:0;color:var(--accent-d);line-height:1.1}
.top p{margin:4px 0 0;color:var(--dim);font-size:.95rem}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:6px;background:#f6e6d6;padding:5px;border-radius:16px;flex-wrap:wrap}
.tab{font-family:var(--display);font-weight:600;font-size:.95rem;border:none;background:transparent;color:var(--dim);padding:9px 14px;border-radius:12px;cursor:pointer}
.tab[aria-selected=true]{background:var(--accent);color:#fff}
.tg{font-family:var(--display);font-weight:600;font-size:.85rem;border:2px solid var(--line);background:#fff;color:var(--dim);padding:8px 12px;border-radius:12px;cursor:pointer}
.tg[aria-pressed=true]{border-color:var(--accent);background:var(--soft);color:var(--accent-d)}
.layout{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:920px){.layout{grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);align-items:start}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 18px}
.card h2{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:0 0 8px;color:var(--accent-d)}
.guide{background:#fff3e6;border:2px dashed var(--warn)}
.guide .q{font-family:var(--display);font-weight:700;font-size:1.25rem;color:#a8421d;line-height:1.25}
.guide .s{font-size:.85rem;color:var(--dim);margin-top:4px}
#sv{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.hint{font-size:.85rem;color:#a89b80;margin:6px 4px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--display);font-weight:600;font-size:.9rem;background:#fffdf8;border:2px solid var(--line);color:var(--dim);padding:8px 13px;border-radius:20px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.opt{font-family:var(--display);font-weight:700;font-size:1.3rem;background:#fff;border:2px solid var(--accent);color:var(--accent-d);padding:14px 6px;border-radius:14px;cursor:pointer}
.opt:disabled{cursor:default}.opt.good{background:var(--ok);border-color:var(--ok);color:#fff}.opt.bad{background:#fbe3da;border-color:var(--warn);color:#a8421d}
.btn{font-family:var(--display);font-weight:600;font-size:.95rem;padding:11px 16px;border-radius:12px;border:none;cursor:pointer;background:var(--accent);color:#fff;margin:8px 8px 0 0}
.btn.o{background:#fff;border:2px solid var(--accent);color:var(--accent-d)}
.res{background:var(--soft);border-color:#ecd0bd;text-align:center;min-height:110px}
.res .big{font-family:var(--display);font-weight:700;font-size:1.9rem;color:var(--accent-d);line-height:1.15}
.res .sm{font-size:.95rem;color:#6b4a30;margin-top:4px}
.stars{font-size:1.6rem;letter-spacing:2px;color:var(--gold)}
body.rec .top p,body.rec .hint{display:none}
body.rec .app{max-width:1400px}
body.rec .guide .q{font-size:1.7rem}body.rec .opt{font-size:1.8rem;padding:20px 6px}body.rec .res .big{font-size:2.6rem}body.rec .res .sm{font-size:1.2rem}body.rec .btn,body.rec .chip{font-size:1.2rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>◻️ Ubin Ajaib</h1><p>Jarak dan luas dihitung dari ubin: ubin berjajar jadi jarak, ubin yang menutupi jadi luas.</p></div>
    <div class="toolbar">
      <div class="tabs" role="tablist" id="tabs"></div>
      <button class="tg" id="tgRec" aria-pressed="false">🎬 Mode rekam</button>
      <button class="tg" id="tgFs">⛶ Layar penuh</button>
      <button class="tg" id="tgSnd" aria-pressed="true">🔊 Suara</button>
      <button class="tg" id="tgAuto" aria-pressed="false">🔁 Otomatis</button>
    </div>
  </div>
  <div class="layout">
    <div class="col">
      <div class="card">
        <svg id="sv" viewBox="0 0 1000 600" role="img" aria-label="Lantai berubin. Seret atau ketuk ubin untuk mengukur."></svg>
        <div class="hint" id="hint"></div>
      </div>
    </div>
    <div class="col">
      <div class="card guide"><div class="q" id="gq"></div><div class="s" id="gs"></div></div>
      <div class="card" id="panel"></div>
      <div class="card res" id="res"></div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const fm=n=>n.toLocaleString('id-ID',{maximumFractionDigits:2});
const COLS=10,ROWS=6,C=100,SIZES=[20,30,40,60];
const MODES=[['bebas','📐 Ukur Bebas'],['tebak','🤔 Tebak Dulu'],['susun','🧩 Susun Luas']];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const S={mode:'bebas',sub:'jarak',size:30,ord:[],lock:false,rec:false,snd:true,auto:false,q:0,stars:0,tries:0,answered:false,done:false,timers:[]};
const clr=()=>{S.timers.forEach(clearTimeout);S.timers=[]};
const later=(f,ms)=>S.timers.push(setTimeout(f,ms));

/* suara */
let AC;
function tone(f,d=.12,t='sine',v=.15){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const ok=()=>{tone(660,.12);setTimeout(()=>tone(880,.18),110)},bad=()=>tone(200,.25,'triangle'),tick=n=>tone(300+Math.min(n,30)*25,.08,'triangle',.1);

/* gambar lantai berpetak (Ukur Bebas dan Susun Luas) */
function draw(){
  const nums=S.mode!=='susun';let h='';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const k=r*COLS+c,i=S.ord.indexOf(k),on=i>=0;
    h+=`<rect x="${c*C+3}" y="${r*C+3}" width="94" height="94" rx="9" fill="${on?'#c9784f':(r+c)%2?'#f5ecd8':'#fffdf8'}" stroke="#e8d9b8" stroke-width="2"/>`;
    if(on&&nums)h+=`<text x="${c*C+50}" y="${r*C+63}" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="34" fill="#fff">${i+1}</text>`}
  $('sv').setAttribute('viewBox','0 0 1000 600');$('sv').innerHTML=h}

/* gambar lantai nyata untuk Tebak Dulu: 240 x 120 cm, 4 px per cm */
const FW=240,FH=120;
function floor(t,upto,J,over){
  const k=4,cols=FW/t,rows=J?1:FH/t,H=rows*t*k;let h=`<rect x="20" y="20" width="${FW*k}" height="${H}" fill="#fffdf8" stroke="#3a3226" stroke-width="3"/>`,n=0;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){n++;const on=n<=upto;
    h+=`<rect x="${20+c*t*k+2}" y="${20+r*t*k+2}" width="${t*k-4}" height="${t*k-4}" rx="6" fill="${on?'#c9784f':(r+c)%2?'#f5ecd8':'#fffdf8'}" stroke="#e8d9b8" stroke-width="2"/>`;
    if(on)h+=`<text x="${20+c*t*k+t*k/2}" y="${20+r*t*k+t*k/2+8}" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="${t>=40?28:22}" fill="#fff">${n}</text>`}
  if(over){for(let x=over;x<FW;x+=over)h+=`<line x1="${20+x*k}" y1="20" x2="${20+x*k}" y2="${20+H}" stroke="#8a4a2a" stroke-width="2.5" stroke-dasharray="7 6" opacity=".6"/>`;
    for(let y=over;y<H/k;y+=over)h+=`<line x1="20" y1="${20+y*k}" x2="${20+FW*k}" y2="${20+y*k}" stroke="#8a4a2a" stroke-width="2.5" stroke-dasharray="7 6" opacity=".6"/>`}
  h+=`<text x="500" y="${H+58}" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="24" fill="#8a4a2a">${J?'Panjang lorong 240 cm':'Lantai 240 cm × 120 cm'} · ubin ${t} cm</text>`;
  $('sv').setAttribute('viewBox','0 0 1000 '+(H+80));$('sv').innerHTML=h}

/* interaksi seret/ketuk */
const sv=$('sv');let dr=false,dv=true,p0=null;
const free=()=>S.mode!=='tebak';
function cell(e){const r=sv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*1000,y=(e.clientY-r.top)/r.height*600,c=Math.floor(x/C),rw=Math.floor(y/C);
  return c<0||c>=COLS||rw<0||rw>=ROWS?null:{r:rw,c,k:rw*COLS+c}}
function line(q){const dR=q.r-p0.r,dC=q.c-p0.c,h=Math.abs(dC)>=Math.abs(dR),n=h?Math.abs(dC):Math.abs(dR),sg=Math.sign(h?dC:dR)||1;S.ord=[];
  for(let i=0;i<=n;i++)S.ord.push(h?p0.r*COLS+p0.c+i*sg:(p0.r+i*sg)*COLS+p0.c);tick(S.ord.length);draw();changed()}
function put(k,v){const i=S.ord.indexOf(k);if(v&&i<0)S.ord.push(k);else if(!v&&i>=0)S.ord.splice(i,1);else return;tick(S.ord.length);draw();changed()}
const jar=()=>S.mode==='bebas'&&S.sub==='jarak';
sv.addEventListener('pointerdown',e=>{if(!free()||S.lock)return;const q=cell(e);if(!q)return;dr=true;sv.setPointerCapture(e.pointerId);
  if(jar()){p0=q;line(q)}else{dv=!S.ord.includes(q.k);put(q.k,dv)}});
sv.addEventListener('pointermove',e=>{if(!dr)return;const q=cell(e);if(!q)return;if(jar())line(q);else if(S.ord.includes(q.k)!==dv)put(q.k,dv)});
sv.addEventListener('pointerup',()=>dr=false);
function changed(){if(S.mode==='bebas')readBebas();setGuide()}

/* panduan untuk narator */
function setGuide(){let q='',s='';const n=S.ord.length;
  if(S.mode==='bebas'){
    if(S.sub==='jarak'){q=n?'Jarak = banyak ubin × panjang 1 ubin.':'Berapa ubin yang bisa kamu langkahi lurus?';s=n?`Hitung ubinnya, lalu kalikan ${S.size} cm.`:'Seret dari ubin pertama sampai ubin terakhir.'}
    else{q=n?'Berapa ubin yang menutupi lantai?':'Bagian mana yang mau kamu tutup ubin?';s=n?'Kalau bentuknya persegi panjang: baris × ubin tiap baris.':'Ketuk atau seret untuk mengisi.'}}
  else if(S.mode==='tebak'){q=S.done?'Berapa bintang yang kamu dapat?':S.answered?'Kenapa jumlah ubinnya berubah?':'Kalau ubinnya diganti, jumlahnya naik atau turun?';s=S.answered?'Garis putus-putus: satu ubin besar memuat beberapa ubin kecil.':'Tebak dulu, baru dihitung.'}
  else{q=S.done?'Berapa bintang yang kamu dapat?':S.answered?'Bentuknya beda, luasnya sama?':`Bisakah kamu membuat bentuk dari ${SU[S.q]} ubin?`;s=S.answered?'Luas hanya menghitung ubin, bukan bentuk.':'Angka tidak ditampilkan. Hitung sendiri dulu.'}
  $('gq').textContent=q;$('gs').textContent=s}

/* ===== Mode 1: Ukur Bebas ===== */
const bJ=m=>m<1.5?'kira-kira sepanjang tempat tidur bayi':m<3?'kira-kira sepanjang tempat tidurmu':m<6?'kira-kira sepanjang mobil':'kira-kira sepanjang bus sekolah';
const bL=a=>a<4?'kira-kira seluas kasur':a<12?'kira-kira seluas kamar tidur kecil':a<30?'kira-kira seluas ruang tamu':'kira-kira seluas rumah kecil';
function readBebas(){const n=S.ord.length,z=S.size;
  if(!n){$('res').innerHTML=`<div class="big">0 ubin</div><div class="sm">${S.sub==='jarak'?'Seret jarimu di atas ubin untuk mulai mengukur.':'Ketuk ubin satu per satu untuk mengisi luasnya.'}</div>`;return}
  if(S.sub==='jarak'){const cm=n*z;$('res').innerHTML=`<div class="big">${n} ubin</div><div class="sm">${n} × ${z} cm = <b>${cm} cm</b> = ${fm(cm/100)} meter, ${bJ(cm/100)}. Jarak itu ubin yang berjajar.</div>`}
  else{const rs=S.ord.map(k=>Math.floor(k/COLS)),cs=S.ord.map(k=>k%COLS),R=Math.max(...rs)-Math.min(...rs)+1,Cc=Math.max(...cs)-Math.min(...cs)+1,rect=R*Cc===n,m2=n*z*z/10000;
    $('res').innerHTML=`<div class="big">${n} ubin</div><div class="sm">${rect?`${R} baris × ${Cc} ubin = ${n} ubin. `:''}Luasnya ${n} × ${z}×${z} cm = <b>${fm(m2)} m²</b>, ${bL(m2)}.</div>`}}
function panelBebas(){
  $('panel').innerHTML=`<h2>Yang diukur</h2><div class="chips">${[['jarak','📏 Jarak'],['luas','◻️ Luas']].map(([k,l])=>`<button class="chip" data-s="${k}" aria-pressed="${S.sub===k}">${l}</button>`).join('')}</div><h2 style="margin-top:12px">Ukuran 1 ubin</h2><div class="chips">${SIZES.map(z=>`<button class="chip" data-z="${z}" aria-pressed="${S.size===z}">${z} cm</button>`).join('')}</div><button class="btn o" id="bClr">🔁 Kosongkan</button><button class="btn o" id="bDemo">▶ Contoh otomatis</button>`;
  $('panel').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.sub=b.dataset.s;bebas()});
  $('panel').querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{S.size=+b.dataset.z;panelBebas();readBebas();setGuide()});
  $('bClr').onclick=()=>{clr();S.ord=[];draw();readBebas();setGuide()};$('bDemo').onclick=demo}
function bebas(){clr();S.ord=[];S.lock=false;S.mode='bebas';panelBebas();
  $('hint').textContent=S.sub==='jarak'?'Seret lurus ke samping atau ke bawah. Ubin makin besar, jarak makin panjang.':'Ketuk atau seret untuk mengisi; ketuk ubin terisi untuk menghapus.';
  draw();readBebas();setGuide();if(S.auto)later(demo,700)}
function demo(){clr();S.ord=[];draw();readBebas();const J=S.sub==='jarak',dt=J?450:200,seq=[];
  if(J){const r=2+(S.size/10)%3;for(let i=0;i<7;i++)seq.push(r*COLS+1+i)}else for(let r=1;r<4;r++)for(let c=2;c<7;c++)seq.push(r*COLS+c);
  seq.forEach((k,i)=>later(()=>{S.ord.push(k);tick(i+1);draw();readBebas();setGuide()},i*dt));
  if(S.auto)later(()=>{if(S.sub==='jarak')S.sub='luas';else{S.sub='jarak';S.size=SIZES[(SIZES.indexOf(S.size)+1)%4]}bebas()},seq.length*dt+3500)}

/* ===== Mode 2: Tebak Dulu ===== */
const TQ=[['j',30,60],['j',40,20],['l',30,60],['l',40,20],['l',20,40],['j',20,60]];
function tebak(){clr();S.mode='tebak';S.lock=true;S.ord=[];
  if(S.q>=TQ.length){S.done=true;floor(30,0,false);$('panel').innerHTML=`<h2>Selesai!</h2><div class="stars">★ ${S.stars} / ${TQ.length}</div><button class="btn" id="again">Main lagi</button>`;
    $('res').innerHTML=`<div class="big">Ubin besar, jumlah sedikit</div><div class="sm">Ukuran lantai tetap sama. Yang berubah hanya satuannya: ubin dua kali lebih lebar membuat luas jadi 4 kali lebih sedikit ubin.</div>`;
    $('again').onclick=()=>{S.q=0;S.stars=0;S.done=false;tebak()};setGuide();return}
  const [ty,a,b]=TQ[S.q],J=ty==='j';S.tries=0;S.answered=false;S.done=false;
  const cnt=t=>J?FW/t:(FW/t)*(FH/t),na=cnt(a),nb=cnt(b),m=Math.max(a,b)/Math.min(a,b),up=b>a;
  const part=J?na:(up?na/m:na*m),third=J?(up?na*m:na/m):(up?na*m:na/m),correctAlso=nb;
  const opts=[nb,J?na:part,third],k=S.q%3,arr=opts.slice(k).concat(opts.slice(0,k));
  floor(a,0,J);
  $('panel').innerHTML=`<h2>Soal ${S.q+1} dari ${TQ.length}</h2><p style="margin:0 0 6px">${J?'Lorong sepanjang 240 cm':'Lantai 240 × 120 cm'} pas ditutup <b>${na} ubin</b> berukuran ${a} cm. Kalau diganti ubin <b>${b} cm</b>, berapa ubin yang dibutuhkan?</p><div class="opts">${arr.map(v=>`<button class="opt" data-v="${v}">${v}</button>`).join('')}</div>`;
  $('hint').textContent='Ubin makin besar, jumlahnya makin sedikit. Tapi seberapa sedikit?';
  $('res').innerHTML=`<div class="big">?</div><div class="sm">Bintang: ${S.stars}</div>`;
  const all=()=>$('panel').querySelectorAll('.opt');
  const reveal=()=>{S.answered=true;all().forEach(x=>{x.disabled=true;if(+x.dataset.v===nb)x.classList.add('good')});setGuide();
    let i=0;const step=Math.max(1,Math.ceil(nb/36)),fin=()=>{floor(b,nb,J,a);
      $('res').innerHTML=`<div class="big">${nb} ubin</div><div class="sm">${J?`${nb} × ${b} cm = ${nb*b} cm, sama dengan ${na} × ${a} cm = ${na*a} cm. Satu ubin ${Math.max(a,b)} cm sama dengan ${m} ubin ${Math.min(a,b)} cm yang berjajar.`:`${FH/b} baris × ${FW/b} ubin = ${nb} ubin. Satu ubin ${Math.max(a,b)} cm memuat ${m} × ${m} = ${m*m} ubin ${Math.min(a,b)} cm, jadi jumlahnya berubah ${m*m} kali, bukan ${m} kali.`}</div><button class="btn" id="nx">Soal berikutnya ›</button>`;
      $('nx').onclick=()=>{S.q++;tebak()};if(S.auto)later(()=>$('nx')&&$('nx').click(),4500)};
    const go=()=>{i=Math.min(nb,i+step);floor(b,i,J);tick(i);i<nb?later(go,50):fin()};
    RM?fin():go()};
  all().forEach(btn=>btn.onclick=()=>{if(S.answered)return;const v=+btn.dataset.v;
    if(v===nb){if(!S.tries)S.stars++;ok();reveal()}
    else{S.tries++;bad();btn.disabled=true;btn.classList.add('bad');
      if(S.tries>=2)reveal();
      else $('res').innerHTML=`<div class="big">Coba lagi</div><div class="sm">${J?`Pikirkan: satu ubin besar sama dengan berapa ubin kecil yang berjajar?`:(v===part?`Ubin melebar ke samping DAN ke atas. Satu ubin besar memuat ${m} × ${m} ubin kecil, bukan hanya ${m}.`:'Ubin besar muat lebih sedikit, ubin kecil lebih banyak. Coba arah yang lain.')}</div>`}});
  setGuide();
  if(S.auto)later(()=>{if(!S.answered)all().forEach(x=>{if(+x.dataset.v===nb)x.click()})},4000)}

/* ===== Mode 3: Susun Luas ===== */
const SU=[6,12,9,16,20];
function susun(){clr();S.mode='susun';S.ord=[];S.lock=false;S.tries=0;S.answered=false;S.done=false;S.size=30;
  if(S.q>=SU.length){S.done=true;S.lock=true;draw();$('panel').innerHTML=`<h2>Selesai!</h2><div class="stars">★ ${S.stars} / ${SU.length*3}</div><button class="btn" id="again">Main lagi</button>`;
    $('res').innerHTML=`<div class="big">Luas = banyak ubin</div><div class="sm">Bentuknya boleh berbeda-beda. Selama jumlah ubinnya sama, luasnya sama.</div>`;
    $('again').onclick=()=>{S.q=0;S.stars=0;susun()};setGuide();return}
  const N=SU[S.q];
  $('panel').innerHTML=`<h2>Soal ${S.q+1} dari ${SU.length}</h2><p style="margin:0 0 6px">Tutup lantai dengan tepat <b>${N} ubin</b> (1 ubin = 30 × 30 cm). Bentuknya bebas!</p><button class="btn" id="chk">✔ Periksa</button><button class="btn o" id="cl">🔁 Kosongkan</button>`;
  $('hint').textContent='Ketuk atau seret untuk mengisi. Jumlah ubin tidak ditampilkan: hitung sendiri.';
  $('res').innerHTML=`<div class="big">? ubin</div><div class="sm">Bintang: ${S.stars}</div>`;
  $('cl').onclick=()=>{if(S.lock)return;S.ord=[];draw()};
  $('chk').onclick=()=>{if(S.answered)return;const n=S.ord.length;
    if(n===N){S.answered=true;S.lock=true;const st=S.tries===0?3:S.tries===1?2:1;S.stars+=st;ok();
      const rs=S.ord.map(k=>Math.floor(k/COLS)),cs=S.ord.map(k=>k%COLS),R=Math.max(...rs)-Math.min(...rs)+1,Cc=Math.max(...cs)-Math.min(...cs)+1;
      $('res').innerHTML=`<div class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div><div class="big">${N} ubin</div><div class="sm">${R*Cc===N?`${R} baris × ${Cc} ubin = ${N} ubin. `:'Bentukmu tidak persegi panjang, tapi tetap '+N+' ubin. '}Luasnya ${fm(N*.09)} m². Bentuk lain juga bisa, asal ubinnya ${N}.</div><button class="btn" id="nx">Soal berikutnya ›</button>`;
      $('nx').onclick=()=>{S.q++;susun()};if(S.auto)later(()=>$('nx')&&$('nx').click(),3500);setGuide()}
    else{S.tries++;bad();$('res').innerHTML=`<div class="big">Belum pas</div><div class="sm">${S.tries===1?(n<N?'Ubinmu masih kurang. Tambah lagi.':'Ubinmu kebanyakan. Kurangi sedikit.'):`Kamu memakai ${n} ubin: ${n<N?'kurang '+(N-n):'lebih '+(n-N)} ubin dari ${N}.`}</div>`}};
  draw();setGuide();
  if(S.auto){const w=[[1,1],[1,2],[1,3],[2,3],[2,4]],seq=[];const R=[2,3,3,4,4][S.q],Cc=N/R;
    /* contoh otomatis: susun persegi panjang yang pas */
    const dims=N===6?[2,3]:N===12?[3,4]:N===9?[3,3]:N===16?[4,4]:[4,5];
    for(let r=0;r<dims[0];r++)for(let c=0;c<dims[1];c++)seq.push((r+1)*COLS+c+2);
    seq.forEach((k,i)=>later(()=>{S.ord.push(k);tick(i+1);draw()},800+i*180));
    later(()=>$('chk')&&$('chk').click(),800+seq.length*180+1200)}}

/* mode dan alat */
function go(m){clr();S.mode=m;S.q=0;S.stars=0;S.done=false;S.answered=false;S.lock=false;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.m===m));
  if(m==='bebas')bebas();else if(m==='tebak')tebak();else susun()}
$('tabs').innerHTML=MODES.map(([k,l])=>`<button class="tab" role="tab" data-m="${k}" aria-selected="${k==='bebas'}">${l}</button>`).join('');
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(t.dataset.m));
$('tgRec').onclick=e=>{S.rec=!S.rec;document.body.classList.toggle('rec',S.rec);e.currentTarget.setAttribute('aria-pressed',S.rec)};
$('tgSnd').onclick=e=>{S.snd=!S.snd;e.currentTarget.setAttribute('aria-pressed',S.snd)};
$('tgAuto').onclick=e=>{S.auto=!S.auto;e.currentTarget.setAttribute('aria-pressed',S.auto);go(S.mode)};
$('tgFs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};
go('bebas');
</script>
<script src="../alat-nav-kembali.js" defer></script>
