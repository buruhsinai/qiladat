<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roda Musim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf6e8;--card:#fff;--line:#f0e2c4;--ink:#3a3226;--dim:#7a6c52;--accent:#4f86c6;--accent-d:#2d4a6b;--soft:#e8f0fb;--ok:#3f9d62;--warn:#e0663a;--gold:#f2b632;--display:'Fredoka',sans-serif;--sans:'Quicksand',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55}
button,input{font-family:inherit}
button:focus-visible,svg:focus-visible,input:focus-visible{outline:3px solid var(--accent-d);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding:0 18px 56px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:22px 0 16px}
.top h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,36px);margin:0;color:var(--accent-d);line-height:1.1}
.top p{margin:4px 0 0;color:var(--dim);font-size:.95rem;max-width:640px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:6px;background:#dfe9f7;padding:5px;border-radius:16px;flex-wrap:wrap}
.tab{font-family:var(--display);font-weight:600;font-size:.95rem;border:none;background:transparent;color:var(--dim);padding:9px 14px;border-radius:12px;cursor:pointer}
.tab[aria-selected=true]{background:var(--accent);color:#fff}
.tg{font-family:var(--display);font-weight:600;font-size:.85rem;border:2px solid var(--line);background:#fff;color:var(--dim);padding:8px 12px;border-radius:12px;cursor:pointer}
.tg[aria-pressed=true]{border-color:var(--accent);background:var(--soft);color:var(--accent-d)}
.layout{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:920px){.layout{grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr);align-items:start}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 18px}
.card h2{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:0 0 8px;color:var(--accent-d)}
.guide{background:#fff3e6;border:2px dashed var(--warn)}
.guide .q{font-family:var(--display);font-weight:700;font-size:1.25rem;color:#a8421d;line-height:1.25}
.guide .s{font-size:.85rem;color:var(--dim);margin-top:4px}
#sv,#ls{width:100%;height:auto;display:block;user-select:none;-webkit-user-select:none;border-radius:14px}
#sv{touch-action:none;max-height:72vh}
#ls{margin-top:0}
.hint{font-size:.85rem;color:#a89b80;margin:6px 4px 0}
.fld{margin:8px 0 10px}
.fld label{display:flex;justify-content:space-between;font-family:var(--display);font-weight:600;font-size:.92rem;color:var(--dim);margin-bottom:6px}
.fld label b{color:var(--accent-d)}
.ends{display:flex;justify-content:space-between;font-size:.78rem;color:#a89b80;margin-top:2px}
input[type=range]{width:100%;height:6px;-webkit-appearance:none;appearance:none;background:var(--line);border-radius:6px;outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid #fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}.chip{font-family:var(--display);font-weight:600;font-size:.9rem;background:#fffdf8;border:2px solid var(--line);color:var(--dim);padding:8px 13px;border-radius:20px;cursor:pointer}.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}body.rec .chip{font-size:1.2rem}.evg{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.evg label{font-family:var(--display);font-weight:600;font-size:.85rem;color:var(--dim);display:block}
.evg input{width:100%;padding:8px 10px;border:2px solid var(--line);border-radius:10px;font-size:1rem;background:#fffdf8;color:var(--ink)}
.btn{font-family:var(--display);font-weight:600;font-size:.95rem;padding:11px 16px;border-radius:12px;border:none;cursor:pointer;background:var(--accent);color:#fff;margin:8px 8px 0 0}
.btn.o{background:#fff;border:2px solid var(--accent);color:var(--accent-d)}
.btn:disabled{opacity:.45;cursor:default}
.qt{margin:0 0 6px;font-size:1.02rem;font-weight:600}
.optv{display:block;width:100%;text-align:left;font-family:var(--display);font-weight:600;font-size:1.02rem;background:#fff;border:2px solid var(--accent);color:var(--accent-d);padding:12px 14px;border-radius:14px;cursor:pointer;margin-top:8px}
.optv:disabled{cursor:default}.optv.good{background:var(--ok);border-color:var(--ok);color:#fff}.optv.bad{background:#fbe3da;border-color:var(--warn);color:#a8421d}
.res{background:var(--soft);border-color:#c9daf0;text-align:center;min-height:96px}
.res .big{font-family:var(--display);font-weight:700;font-size:1.9rem;color:var(--accent-d);line-height:1.15}
.res .sm{font-size:.95rem;color:#3a5a7d;margin-top:4px}
.stars{font-size:1.6rem;letter-spacing:4px;color:var(--gold)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.pill{font-family:var(--display);font-weight:600;font-size:.82rem;padding:5px 10px;border-radius:16px;background:#f3f0e8;color:#a89b80}
.pill.on{background:var(--ok);color:#fff}
.meter{font-size:.85rem;color:var(--dim);margin:4px 0}
.concl{background:#e6f4ea;border:2px solid var(--ok);border-radius:14px;padding:10px 14px;font-weight:600;color:#25663f;margin:6px 0}
.note{font-size:.9rem;color:#3a5a7d;background:var(--soft);border-radius:14px;padding:10px 14px;margin-top:8px}
.note b{color:var(--accent-d)}
footer{text-align:center;padding-top:22px;color:#a89b80;font-size:.8rem}
body.rec .top p,body.rec .hint,body.rec .note,body.rec #info.nolog,body.rec .chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}.chip{font-family:var(--display);font-weight:600;font-size:.9rem;background:#fffdf8;border:2px solid var(--line);color:var(--dim);padding:8px 13px;border-radius:20px;cursor:pointer}.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}body.rec .chip{font-size:1.2rem}.evg{display:none}
body.rec .app{max-width:1400px}
body.rec .guide .q{font-size:1.7rem}body.rec .optv{font-size:1.4rem;padding:16px}body.rec .qt{font-size:1.3rem}body.rec .res .big{font-size:2.6rem}body.rec .res .sm{font-size:1.2rem}body.rec .btn{font-size:1.2rem}body.rec .concl{font-size:1.15rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>🌙 Roda Musim</h1><p>Satu putaran roda adalah satu tahun dengan 12 bulan. Putar rodanya dan lihat apa yang berubah: musim di Indonesia, atau wajah Bulan.</p></div>
    <div class="toolbar">
      <div class="tabs" role="tablist" id="tabs"></div>
      <button class="tg" id="tgRec" aria-pressed="false">🎬 Mode rekam</button>
      <button class="tg" id="tgFs">⛶ Layar penuh</button>
      <button class="tg" id="tgSnd" aria-pressed="true">🔊 Suara</button>
      <button class="tg" id="tgAuto" aria-pressed="false">🔁 Otomatis</button>
    </div>
  </div>
  <div class="layout">
    <div class="col">
      <div class="card">
        <svg id="sv" viewBox="0 0 480 480" tabindex="0" role="img" aria-label="Roda musim: seret penanda mengelilingi 12 bulan"></svg>
        <div class="hint" id="hint"></div>
      </div>
      <div class="card"><svg id="ls" viewBox="0 0 400 170" role="img" aria-label="Pemandangan musim atau fase Bulan"></svg></div>
      <div class="card" id="info"></div>
    </div>
    <div class="col">
      <div class="card guide"><div class="q" id="gq"></div><div class="s" id="gs"></div></div>
      <div class="card" id="panel"></div>
      <div class="card res" id="res"></div>
    </div>
  </div>
  <footer>Gambar disederhanakan. Pembagian musim adalah perkiraan umum dan bisa berbeda tiap tahun dan tiap daerah.</footer>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const W360=a=>((a%360)+360)%360;
const fn=n=>String(Math.round(n*10)/10).replace('.',',');
const MODES=[['bebas','🌙 Putar Bebas'],['tebak','🤔 Tebak Dulu'],['pasang','🎯 Pasang Penanda']];
const HJ=[{n:'Muharram',s:'Muh',i:'⭐',x:'Ada hari Asyura.'},{n:'Safar',s:'Saf'},{n:'Rabiul Awal',s:'R.Awl',i:'🌟',x:'Bulan kelahiran Nabi ﷺ.'},{n:'Rabiul Akhir',s:'R.Akh'},{n:'Jumadil Awal',s:'J.Awl'},{n:'Jumadil Akhir',s:'J.Akh'},{n:'Rajab',s:'Raj'},{n:"Sya'ban",s:'Sya'},{n:'Ramadan',s:'Ram',i:'🏮',x:'Bulan puasa.'},{n:'Syawal',s:'Syw',i:'🎉',x:'Ada Idul Fitri.'},{n:"Dzulqa'dah",s:'Dzq'},{n:'Dzulhijjah',s:'Dzh',i:'🕋',x:'Ada Idul Adha dan musim Haji.'}];
const MS=[['Januari','Jan','hujan'],['Februari','Feb','hujan'],['Maret','Mar','hujan'],['April','Apr','kemarau'],['Mei','Mei','kemarau'],['Juni','Jun','kemarau'],['Juli','Jul','kemarau'],['Agustus','Agu','kemarau'],['September','Sep','kemarau'],['Oktober','Okt','hujan'],['November','Nov','hujan'],['Desember','Des','hujan']].map(a=>({n:a[0],s:a[1],m:a[2]}));
const SM=m=>m==='hujan'?'Musim hujan':'Musim kemarau';
const KH=['#5a6a85','#8296b3'],KK=['#6fc0f0','#f0d98f'];
const rgb=x=>{const v=parseInt(x.slice(1),16);return[v>>16&255,v>>8&255,v&255]};
const mix=(a,b,t)=>{const p=rgb(a),q=rgb(b);return`rgb(${p.map((v,i)=>Math.round(v+(q[i]-v)*t)).join(',')})`};
const skyM=(mi,t)=>{const a=MS[mi].m==='hujan'?KH:KK,b=MS[(mi+1)%12].m==='hujan'?KH:KK;return[mix(a[0],b[0],t),mix(a[1],b[1],t)]};
const idx=A=>Math.floor(W360(A)/30)%12,tin=A=>(W360(A)%30)/30;
const runs=m=>{const r=[];MS.forEach((x,i)=>{if(x.m===m){if(r.length&&r[r.length-1][1]===i)r[r.length-1][1]=i+1;else r.push([i,i+1])}});return r};
const phase=t=>{const a=t*29.5;return a<2?'Bulan baru (hilal)':a<6?'Sabit':a<9?'Separuh, makin besar':a<13?'Cembung, makin besar':a<16.5?'Purnama':a<20?'Cembung, makin kecil':a<23?'Separuh, makin kecil':a<27?'Sabit tua':'Menjelang bulan baru'};

const S={mode:'bebas',cal:'m',rec:false,snd:true,auto:false,timers:[],raf:0,A:15,tot:0,seen:{h:{},m:{}},ik:'',
 q:0,stars:0,tries:0,answered:false,done:false,pt:0,pstars:0,ptries:0,pdone:false,pchk:false};
const clr=()=>{S.timers.forEach(clearTimeout);S.timers=[];cancelAnimationFrame(S.raf)};
const later=(f,ms)=>S.timers.push(setTimeout(f,ms));
function seq(steps){let t=0;steps.forEach(([d,f])=>{t+=d;later(f,t)});return t}
function tween(get,set,to,ms,cb){const from=get(),t0=performance.now();
  if(RM||ms<=0){set(to);cb&&cb();return}
  (function f(t){const p=Math.min(1,(t-t0)/ms),q=1-Math.pow(1-p,3);set(from+(to-from)*q);if(p<1)S.raf=requestAnimationFrame(f);else cb&&cb()})(t0)}
let AC;
function tone(f,d=.12,t='sine',v=.15){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const ok=()=>{tone(660,.12);setTimeout(()=>tone(880,.18),110)},bad=()=>tone(200,.25,'triangle');

/* ===== gambar ===== */
const C=240,pt=(a,r)=>{const q=a*Math.PI/180;return[C+r*Math.sin(q),C-r*Math.cos(q)]};
const arcP=(a1,a2,r)=>{const[x1,y1]=pt(a1,r),[x2,y2]=pt(a2,r);return`M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${a2-a1>180?1:0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`};
const tx=(x,y,t,c='#3a5a7d',s=16,a='middle',st='#fdf6e8')=>`<text x="${x}" y="${y}" text-anchor="${a}" font-family="Fredoka" font-weight="600" font-size="${s}" fill="${c}" stroke="${st}" stroke-width="4" stroke-linejoin="round" paint-order="stroke">${t}</text>`;
function moonP(x,y,r,t){const c=Math.cos(2*Math.PI*t),w=t<.5,rx=Math.max(.5,r*Math.abs(c)),sw=w?(c>0?0:1):(c>0?1:0);
  const d=w?`M ${x} ${y-r} A ${r} ${r} 0 0 1 ${x} ${y+r} A ${rx} ${r} 0 0 ${sw} ${x} ${y-r} Z`:`M ${x} ${y-r} A ${r} ${r} 0 0 0 ${x} ${y+r} A ${rx} ${r} 0 0 ${sw} ${x} ${y-r} Z`;
  return`<circle cx="${x}" cy="${y}" r="${r}" fill="#2a3358" stroke="#8a96b8" stroke-width="2"/><path d="${d}" fill="#f3edd8"/>`}
function wheel(o){const{cal,A=null,hl=null,rev=true}=o,D=cal==='h'?HJ:MS;let g='';const ix=A==null?0:idx(A);
  const[t1,b1]=cal==='h'?['#1b2340','#2a355c']:rev&&A!=null?skyM(ix,tin(A)):['#9aa6c4','#cfd6e2'];
  g+=`<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${t1}"/><stop offset="1" stop-color="${b1}"/></linearGradient></defs><circle cx="${C}" cy="${C}" r="124" fill="url(#sg)" stroke="#fff" stroke-width="4"/>`;
  for(let i=0;i<12;i++){const col=cal==='h'?(i%2?'#aab8ea':'#c4cef4'):rev?(D[i].m==='hujan'?'#8fb4e0':'#f2c768'):'#ddd6c2';
    g+=`<path d="${arcP(30*i+1.2,30*i+28.8,150)}" fill="none" stroke="${col}" stroke-width="30"/>`;
    const ic=cal==='h'?D[i].i:rev?(D[i].m==='hujan'?'💧':'☀️'):'';const[x,y]=pt(30*i+15,150);
    if(ic)g+=`<text x="${x}" y="${y+7}" text-anchor="middle" font-size="19">${ic}</text>`;
    const[lx,ly]=pt(30*i+15,190);g+=tx(lx,ly+5,D[i].s,'#2d4a6b',14)}
  if(hl)hl.forEach(r=>g+=`<path d="${arcP(r[0]*30+1,r[1]*30-1,177)}" fill="none" stroke="#e0663a" stroke-width="7" stroke-linecap="round"/>`);
  if(A!=null){const[x,y]=pt(A,150);g+=`<circle cx="${x}" cy="${y}" r="24" fill="#fff" opacity=".55"/>`+(cal==='h'?moonP(x,y,15,tin(A)):`<circle cx="${x}" cy="${y}" r="17" fill="#fff" stroke="#4f86c6" stroke-width="3"/><text x="${x}" y="${y+7}" text-anchor="middle" font-size="19">${rev?(MS[ix].m==='hujan'?'🌧️':'☀️'):'📍'}</text>`)}
  const nm=A!=null&&rev?D[ix].n:'?';
  g+=tx(C,C-2,nm,'#fff',nm.length>9?28:36,'middle','rgba(0,0,0,.4)')+(A!=null&&rev?tx(C,C+34,cal==='h'?'Bulan ke-'+(ix+1):SM(MS[ix].m),'#fff',20,'middle','rgba(0,0,0,.4)'):'');
  return g}
function land(o){const{k,mi=0,t=.5,show=false}=o;let g='';
  if(k==='blank')return`<rect width="400" height="170" fill="#e4e9f3"/>`+tx(200,112,'?','#8a96b8',80,'middle','#e4e9f3');
  if(k==='h'){g+=`<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1b3a"/><stop offset="1" stop-color="#2a355c"/></linearGradient></defs><rect width="400" height="170" fill="url(#lg)"/>`;
    for(let i=0;i<16;i++)g+=`<circle cx="${(i*83+20)%390+5}" cy="${(i*47+13)%150+8}" r="1.6" fill="#fff" opacity=".6"/>`;
    return g+moonP(200,78,52,t)+tx(200,160,phase(t)+' · hari ke-'+Math.max(1,Math.ceil(t*29.5)),'#fff',16,'middle','rgba(0,0,0,.5)')}
  if(k==='b'){const w1=340,w2=340*354/365;g+=`<rect width="400" height="170" fill="#f4f1e8"/>`;
    g+=`<rect x="30" y="34" width="${w1}" height="30" rx="8" fill="#f2c768"/><rect x="30" y="100" width="${w2}" height="30" rx="8" fill="#9aa6e0"/>`+tx(30,26,'1 tahun Masehi (Matahari)','#2d4a6b',14,'start')+tx(30,92,'1 tahun Hijriah (Bulan)','#2d4a6b',14,'start');
    if(show)g+=`<rect x="${30+w2}" y="100" width="${w1-w2}" height="30" rx="6" fill="#e0663a"/>`+tx(30+w1/2,56,'365 hari','#2d4a6b',16)+tx(30+w2/2,122,'354 hari','#2d4a6b',16)+tx(370,152,'selisih 11 hari','#a8421d',15,'end');return g}
  const h=MS[mi].m==='hujan',sk=h?['#6a7a95','#a9b8cf']:['#7cc8f2','#f6e7b0'];
  g+=`<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sk[0]}"/><stop offset="1" stop-color="${sk[1]}"/></linearGradient></defs><rect width="400" height="170" fill="url(#lg)"/>`;
  if(h){[[70,36,40],[200,26,50],[320,40,38]].forEach(c=>g+=`<ellipse cx="${c[0]}" cy="${c[1]}" rx="${c[2]+14}" ry="${c[2]*.42}" fill="#cfd6e2"/><ellipse cx="${c[0]+18}" cy="${c[1]-8}" rx="${c[2]*.7}" ry="${c[2]*.4}" fill="#dde3ee"/>`);
    for(let i=0;i<30;i++){const x=(i*37)%400,y=(i*53)%80+52;g+=`<line x1="${x}" y1="${y}" x2="${x-5}" y2="${y+14}" stroke="#4f86c6" stroke-width="2.2" stroke-linecap="round"/>`}}
  else{g+=`<circle cx="330" cy="40" r="22" fill="#f7b733"/>`;for(let i=0;i<8;i++){const a=i*Math.PI/4;g+=`<line x1="${330+28*Math.cos(a)}" y1="${40+28*Math.sin(a)}" x2="${330+38*Math.cos(a)}" y2="${40+38*Math.sin(a)}" stroke="#f7b733" stroke-width="4" stroke-linecap="round"/>`}}
  g+=`<rect y="130" width="400" height="40" fill="${h?'#4f8a4f':'#d9b56a'}"/>`;
  if(h)g+=`<ellipse cx="120" cy="150" rx="34" ry="6" fill="#7fb0dc"/><ellipse cx="290" cy="154" rx="26" ry="5" fill="#7fb0dc"/>`;else g+=`<path d="M40 150 l18 -6 l12 8 l16 -6 M230 148 l16 6 l14 -8 l18 6 M330 156 l14 -5 l12 6" fill="none" stroke="#a8824a" stroke-width="2.5"/>`;
  g+=`<rect x="196" y="98" width="8" height="34" fill="#7a5a3a"/><circle cx="200" cy="90" r="${h?24:20}" fill="${h?'#3f7a46':'#b0a45a'}"/>`;
  return g+tx(12,162,SM(MS[mi].m),'#fff',14,'start','rgba(0,0,0,.4)')}

/* ===== keadaan & render ===== */
function setA(v,drag){const p=S.A;S.A=W360(v);const i0=idx(p),i1=idx(S.A);
  if(drag){let d=S.A-p;if(d>180)d-=360;if(d<-180)d+=360;S.tot+=Math.abs(d)}
  if(S.mode==='bebas'){S.seen[S.cal][i1]=true;if(i0!==i1)tone(380+i1*45,.1)}
  render();if(S.mode==='bebas'){resB();const k=S.cal+Object.keys(S.seen[S.cal]).length;if(k!==S.ik){S.ik=k;info()}}}
function render(){const m=S.mode;let w,l;
  if(m==='bebas'){w=wheel({cal:S.cal,A:S.A});l=land({k:S.cal,mi:idx(S.A),t:tin(S.A)})}
  else if(m==='pasang'){const T=PT[Math.min(S.pt,PT.length-1)],c=T.cal;w=wheel({cal:c,A:S.A,rev:c==='h'||S.pchk});l=c==='h'?land({k:'h',t:tin(S.A)}):S.pchk?land({k:'m',mi:idx(S.A),t:tin(S.A)}):land({k:'blank'})}
  else{const q=QS[S.q];if(!q||S.done){w=wheel({cal:'m',A:null});l=land({k:'blank'})}
    else if(q.ty==='m'){w=wheel({cal:'m',A:q.mi*30+15,rev:S.answered});l=S.answered?land({k:'m',mi:q.mi}):land({k:'blank'})}
    else if(q.ty==='n'){w=wheel({cal:'m',A:null,rev:S.answered,hl:S.answered?q.hl():null});l=land({k:'blank'})}
    else if(q.ty==='h'){w=wheel({cal:'h',A:null,hl:S.answered?[[q.mi,q.mi+1]]:null});l=land({k:'blank'})}
    else{w=wheel({cal:'h',A:null});l=land({k:'b',show:S.answered})}}
  $('sv').innerHTML=w;$('ls').innerHTML=l}
const NOTES={bebas:'<b>Dua cara menghitung tahun.</b> Kalender Masehi mengikuti Matahari: 365 hari, dan musim di Indonesia ada dua, hujan (kira-kira Oktober sampai Maret) dan kemarau (kira-kira April sampai September). Kalender Hijriah mengikuti Bulan: satu bulan = satu putaran fase Bulan, sekitar 29 atau 30 hari, jadi setahun sekitar 354 hari. Itu sebabnya Ramadan bergeser kira-kira 11 hari lebih awal tiap tahun.',
 tebak:'<b>Tebak dulu, lalu buktikan.</b> Tebakan yang meleset tidak apa-apa: roda akan menunjukkan jawabannya.',
 pasang:'<b>Baca nama bulan di roda.</b> Roda Masehi mulai dari Januari di atas. Roda Hijriah mulai dari Muharram. Searah jarum jam, bulannya bertambah.'};
const HINTS={bebas:'Seret penanda di roda, pakai penggeser, atau tombol panah (Shift = 1 bulan).',tebak:'Pilih satu jawaban.',pasang:'Seret di roda atau pakai penggeser, lalu tekan Periksa.'};
function setRes(b,s,x=''){$('res').innerHTML=`<div class="big">${b}</div><div class="sm">${s}</div>${x}`}
function guide(q,s){$('gq').textContent=q;$('gs').textContent=s||''}
function info(){const m=S.mode;let h='';
  if(m==='bebas'){const D=S.cal==='h'?HJ:MS,n=Object.keys(S.seen[S.cal]).length;
    h+=`<h2>Catatan penemuan</h2><div class="pills">${D.map((d,i)=>`<span class="pill${S.seen[S.cal][i]?' on':''}">${S.seen[S.cal][i]?'✓ ':''}${d.s}</span>`).join('')}</div><p class="meter">Bulan yang sudah dilewati: ${n} dari 12.</p>`;
    h+=n>=12?(S.cal==='m'?`<div class="concl">💡 Di Indonesia ada dua musim: hujan (${runs('hujan').length?'Okt sampai Mar':''}, ${MS.filter(x=>x.m==='hujan').length} bulan) dan kemarau (Apr sampai Sep, ${MS.filter(x=>x.m==='kemarau').length} bulan). Satu putaran = 12 bulan = 1 tahun.`+`</div>`:`<div class="concl">💡 Bulan Hijriah mengikuti Bulan: 12 bulan ≈ 354 hari, sekitar 11 hari lebih pendek dari tahun Masehi, jadi Ramadan terus bergeser melintasi musim.</div>`):`<div class="meter">Putar melewati ke-12 bulan untuk menemukan aturannya.</div>`}
  h+=`<div class="note">${NOTES[m]}</div>`;$('info').className='card'+(m==='bebas'?'':' nolog');$('info').innerHTML=h}

/* ===== PUTAR BEBAS ===== */
function iBebas(){
  $('panel').innerHTML=`<h2>Putar roda</h2><div class="chips"><button class="chip" data-c="m" aria-pressed="${S.cal==='m'}">☀️ Masehi (Matahari)</button><button class="chip" data-c="h" aria-pressed="${S.cal==='h'}">🌙 Hijriah (Bulan)</button></div>
  <div class="fld"><label for="rh">Posisi <b id="vh"></b></label><input type="range" id="rh" min="0" max="12" step="0.1" value="${S.A/30}"><div class="ends"><span>awal tahun</span><span>akhir tahun</span></div></div>
  <button class="btn" id="bD">▶ Putar setahun</button><button class="btn o" id="bR">↺ Ke awal</button>`;
  $('rh').oninput=e=>setA(+e.target.value*30,true);
  $('panel').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{S.cal=c.dataset.c;S.ik='';$('panel').querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c));render();resB();info()});
  $('bD').onclick=()=>demo.bebas();$('bR').onclick=()=>{clr();setA(15,false)};
  S.seen[S.cal][idx(S.A)]=true;render();resB();info();if(S.auto)later(()=>demo.bebas(autoNext),600)}
function resB(){const s=$('rh');if(s)s.value=Math.min(12,S.A/30);const i=idx(S.A),D=S.cal==='h'?HJ:MS;if($('vh'))$('vh').textContent=D[i].n;
  if(S.cal==='m')setRes(MS[i].n,`${SM(MS[i].m)} (perkiraan umum di Indonesia). Bulan ke-${i+1} dari 12.`);
  else setRes(HJ[i].n,`${HJ[i].x||'Bulan ke-'+(i+1)+' dari 12.'} Bulan sedang ${phase(tin(S.A)).toLowerCase()}.`);
  guide(S.cal==='m'?'Bulan ini musim apa?':'Bagaimana wajah Bulan di bulan ini?','Putar roda ke bulan lain dan bandingkan.')}

/* ===== TEBAK DULU ===== */
const QS=[
 {ty:'m',mi:6,t:'Menurut perkiraan umum di Indonesia, bulan Juli termasuk musim apa?',o:['Musim kemarau','Musim hujan','Musim salju'],a:()=>SM(MS[6].m),hint:'Indonesia tidak punya musim salju. Coba ingat: Juli sampai September biasanya langit cerah dan tanah kering atau basah?',why:()=>'Juli ada di musim kemarau (kira-kira April sampai September). Di roda, bulan kemarau berwarna kuning.'},
 {ty:'n',t:'Satu putaran penuh roda berisi berapa bulan?',o:['10 bulan','12 bulan','24 bulan'],a:()=>`${MS.length} bulan`,hint:'Hitung nama bulan yang mengelilingi roda, dari Januari sampai Desember.',why:()=>'Satu putaran = 12 bulan = 1 tahun. Roda Hijriah juga punya 12 bulan.',hl:()=>[[0,12]]},
 {ty:'n',t:'Musim hujan (kira-kira Oktober sampai Maret) berlangsung berapa bulan?',o:['3 bulan','9 bulan','6 bulan'],a:()=>`${MS.filter(x=>x.m==='hujan').length} bulan`,hint:'Sebutkan satu per satu: Oktober, November, ... sampai Maret.',why:()=>`${MS.filter(x=>x.m==='hujan').map(x=>x.n).join(', ')}: ${MS.filter(x=>x.m==='hujan').length} bulan. Musim hujan melewati pergantian tahun.`,hl:()=>runs('hujan')},
 {ty:'h',mi:8,t:'Bulan puasa adalah bulan ke berapa dalam kalender Hijriah?',o:['Bulan ke-8','Bulan ke-9','Bulan ke-10'],a:()=>`Bulan ke-${HJ.findIndex(x=>x.n==='Ramadan')+1}`,hint:'Urutannya: Muharram, Safar, Rabiul Awal, Rabiul Akhir, ... Hitung sampai Ramadan.',why:()=>'Ramadan adalah bulan ke-9 Hijriah, tepat sebelum Syawal (Idul Fitri).'},
 {ty:'h',mi:11,t:'Idul Adha dan musim Haji jatuh pada bulan Hijriah apa?',o:['Dzulhijjah','Syawal','Muharram'],a:()=>'Dzulhijjah',hint:'Idul Fitri ada di Syawal. Idul Adha ada di bulan terakhir tahun Hijriah.',why:()=>'Dzulhijjah adalah bulan ke-12 dan terakhir, bulan Idul Adha dan musim Haji.'},
 {ty:'b',t:'Tahun Hijriah sekitar 354 hari, tahun Masehi 365 hari. Tahun ini Ramadan dimulai pada tanggal tertentu di kalender Masehi. Tahun depan, Ramadan dimulai...',o:['sekitar 11 hari lebih lambat','di tanggal yang persis sama','sekitar 11 hari lebih awal'],a:()=>`sekitar ${365-354} hari lebih awal`,hint:'Tahun Hijriah lebih pendek. Jadi tahun Hijriah berikutnya sudah mulai sebelum tanggal yang sama di kalender Masehi.',why:()=>'365 − 354 = 11 hari. Tahun Hijriah lebih pendek, jadi Ramadan maju sekitar 11 hari tiap tahun dan lama-lama melewati semua musim.'}];
function showQ(){if(S.q>=QS.length)return endQ();const q=QS[S.q];S.answered=false;S.tries=0;
  $('panel').innerHTML=`<h2>Soal ${S.q+1} dari ${QS.length}</h2><p class="qt">${q.t}</p><div>${q.o.map((o,i)=>`<button class="optv" data-i="${i}">${o}</button>`).join('')}</div>`;
  setRes('?',`Bintang: ${S.stars}`);$('panel').querySelectorAll('.optv').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  render();guide('Tebak dulu, lalu buktikan.','Pilih satu jawaban.');info();
  if(S.auto)later(()=>pick(q.o.findIndex(o=>o===q.a())),3800)}
function pick(i){const q=QS[S.q];if(S.answered)return;const bs=[...document.querySelectorAll('.optv')],cor=q.o.findIndex(o=>o===q.a()),good=i===cor;S.tries++;
  const fin=()=>{S.answered=true;bs.forEach(b=>b.disabled=true);bs[cor].classList.add('good');render();return`<button class="btn" id="nx">${S.q+1>=QS.length?'Lihat hasil ›':'Soal berikutnya ›'}</button>`};
  if(good){if(S.tries===1)S.stars++;const x=fin();ok();setRes(S.tries===1?'Tepat!':'Nah, benar!',q.why(),x);guide('Apakah tebakanmu cocok dengan roda?','Roda membuktikannya.')}
  else if(S.tries===1){bs[i].disabled=true;bs[i].classList.add('bad');bad();setRes('Belum tepat',`Petunjuk: ${q.hint} Coba sekali lagi.`);guide('Coba sekali lagi.','Perhatikan petunjuknya.');return}
  else{bs[i].classList.add('bad');const x=fin();bad();setRes('Jawabannya: '+q.o[cor],q.why(),x);guide('Apakah tebakanmu cocok dengan roda?','Roda membuktikannya.')}
  $('nx').onclick=()=>{S.q++;showQ()};if(S.auto)later(()=>$('nx')&&$('nx').click(),4200)}
function endQ(){S.done=true;$('panel').innerHTML=`<h2>Selesai!</h2><div class="stars">${'★'.repeat(S.stars)}${'☆'.repeat(QS.length-S.stars)}</div><button class="btn" id="again">Main lagi</button>`;
  setRes(`${S.stars} dari ${QS.length}`,'Satu putaran = 12 bulan. Masehi mengikuti Matahari, Hijriah mengikuti Bulan, dan keduanya tidak persis sama panjangnya.');$('again').onclick=()=>{S.q=0;S.stars=0;S.done=false;showQ()};
  guide('Berapa bintang yang kamu dapat?','Tahun Hijriah sedikit lebih pendek.');render();info();if(S.auto)autoNext()}

/* ===== PASANG PENANDA ===== */
const PT=[{cal:'h',t:'bulan puasa (Ramadan)',mi:()=>HJ.findIndex(x=>x.n==='Ramadan')},{cal:'m',t:'bulan pertama musim hujan setelah kemarau',mi:()=>MS.findIndex((x,i)=>x.m==='hujan'&&MS[(i+11)%12].m==='kemarau')},{cal:'h',t:'bulan Idul Fitri (Syawal)',mi:()=>HJ.findIndex(x=>x.n==='Syawal')},{cal:'m',t:'bulan terakhir musim kemarau',mi:()=>MS.findIndex((x,i)=>x.m==='kemarau'&&MS[(i+1)%12].m==='hujan')},{cal:'h',t:'bulan Idul Adha dan musim Haji (Dzulhijjah)',mi:()=>HJ.findIndex(x=>x.n==='Dzulhijjah')}];
function pLevel(){if(S.pt>=PT.length)return pEnd();const T=PT[S.pt];S.pchk=false;S.ptries=0;S.A=W360(T.mi()*30+195);
  $('panel').innerHTML=`<h2>Target ${S.pt+1} dari ${PT.length}</h2><p class="qt">Putar penanda ke <b>${T.t}</b> di roda ${T.cal==='h'?'Hijriah':'Masehi'}.</p>
  <div class="fld"><label for="rh">Posisi di roda</label><input type="range" id="rh" min="0" max="12" step="0.1" value="${S.A/30}"><div class="ends"><span>awal tahun</span><span>akhir tahun</span></div></div><button class="btn" id="bC">✔ Periksa</button>`;
  $('rh').oninput=e=>{if(!S.pchk){S.A=W360(+e.target.value*30);render()}};$('bC').onclick=chk;
  setRes('?',`Bintang: ${S.pstars}`);render();guide('Di bulan mana penanda harus berada?',T.cal==='m'?'Warna musim di roda disembunyikan sampai kamu memeriksa.':'Hitung urutan bulan Hijriah dari Muharram.');info();
  if(S.auto)later(()=>tween(()=>0,v=>{S.A=W360(T.mi()*30+195-v*180);$('rh').value=S.A/30;render()},1,1600,()=>later(()=>{S.A=T.mi()*30+15;render();chk()},500)),900)}
function chk(){if(S.pchk)return;const T=PT[S.pt],mi=T.mi(),i=idx(S.A),d=((i-mi+18)%12)-6,D=T.cal==='h'?HJ:MS;S.ptries++;
  const nxt=`<button class="btn" id="bN">${S.pt+1>=PT.length?'Lihat hasil ›':'Target berikutnya ›'}</button>`;
  if(i===mi){S.pchk=true;const s=Math.max(1,4-S.ptries);S.pstars+=s;ok();$('rh').disabled=true;$('bC').disabled=true;render();
    setRes(`Tepat! ${'★'.repeat(s)}`,`${D[mi].n} adalah ${T.t}.`,nxt);$('bN').onclick=()=>{S.pt++;pLevel()};guide('Kamu menemukannya!','Nama bulan kini terlihat.');if(S.auto)later(()=>$('bN')&&$('bN').click(),3200)}
  else if(S.ptries>=3){S.pchk=true;bad();$('rh').disabled=true;$('bC').disabled=true;S.A=mi*30+15;render();setRes('Jawabannya di sini',`${D[mi].n}: ${T.t}.`,nxt);$('bN').onclick=()=>{S.pt++;pLevel()}}
  else{bad();const maju=d<0;setRes('Belum tepat',S.ptries===1?`Penandamu ${maju?'terlalu awal':'terlalu jauh ke depan'}. Putar ${maju?'searah':'berlawanan arah'} jarum jam.`:`Masih meleset ${Math.abs(d)} bulan. Putar ${maju?'searah':'berlawanan arah'} jarum jam.`);guide('Ke arah mana harus diputar?','Searah jarum jam, bulannya bertambah.')}}
function pEnd(){S.pdone=true;$('panel').innerHTML=`<h2>Selesai!</h2><div class="stars">${S.pstars} ★</div><button class="btn" id="again">Main lagi</button>`;
  setRes(`${S.pstars} dari ${PT.length*3}`,'Kamu sudah bisa membaca roda tahun: 12 bulan, searah jarum jam, dengan musim di Masehi dan peristiwa di Hijriah.');
  $('again').onclick=()=>{S.pt=0;S.pstars=0;S.pdone=false;pLevel()};guide('Berapa bintang yang kamu dapat?','');render();info();if(S.auto)autoNext()}

/* ===== peragaan & otomatis ===== */
const demo={bebas(done){S.cal=S.cal==='m'?'h':'m';S.seen[S.cal]={};S.ik='';iBebasSoft();S.A=0;
  if(RM){seq([...Array(12)].map((_,i)=>[i?300:100,()=>setA(i*30+15,false)]).concat([[3000,()=>done&&done()]]))}
  else tween(()=>0,v=>setA(v,false),359.9,14000,()=>later(()=>done&&done(),3500))}};
function iBebasSoft(){const a=S.auto;S.auto=false;iBebas();S.auto=a}
function autoNext(){if(!S.auto)return;later(()=>{if(!S.auto)return;const i=MODES.findIndex(x=>x[0]===S.mode);go(MODES[(i+1)%MODES.length][0])},4000)}

/* ===== pointer / keyboard ===== */
const sv=$('sv');let dr=false;
function aim(e){const r=sv.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,a=W360(Math.atan2(x,-y)*180/Math.PI);
  if(S.mode==='bebas')setA(a,true);else if(S.mode==='pasang'&&!S.pchk){S.A=a;$('rh').value=a/30;render()}}
const canAim=()=>S.mode==='bebas'||(S.mode==='pasang'&&!S.pchk);
sv.addEventListener('pointerdown',e=>{if(!canAim())return;clr();dr=true;sv.setPointerCapture(e.pointerId);aim(e)});
sv.addEventListener('pointermove',e=>{if(dr)aim(e)});sv.addEventListener('pointerup',()=>dr=false);sv.addEventListener('pointercancel',()=>dr=false);
sv.addEventListener('keydown',e=>{const d=e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:0;if(!d||!canAim())return;e.preventDefault();const st=e.shiftKey?30:5;
  if(S.mode==='bebas')setA(S.A+d*st,true);else{S.A=W360(S.A+d*st);$('rh').value=S.A/30;render()}});
function go(m){clr();S.mode=m;S.q=0;S.stars=0;S.tries=0;S.answered=false;S.done=false;S.pt=0;S.pstars=0;S.pdone=false;S.pchk=false;dr=false;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.m===m));
  $('hint').textContent=HINTS[m];sv.style.touchAction=(m==='tebak')?'auto':'none';
  ({bebas:iBebas,tebak:showQ,pasang:pLevel})[m]()}
$('tabs').innerHTML=MODES.map(([k,l])=>`<button class="tab" role="tab" data-m="${k}" aria-selected="${k==='bebas'}">${l}</button>`).join('');
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(t.dataset.m));
$('tgRec').onclick=e=>{S.rec=!S.rec;document.body.classList.toggle('rec',S.rec);e.currentTarget.setAttribute('aria-pressed',S.rec)};
$('tgSnd').onclick=e=>{S.snd=!S.snd;e.currentTarget.setAttribute('aria-pressed',S.snd)};
$('tgAuto').onclick=e=>{S.auto=!S.auto;e.currentTarget.setAttribute('aria-pressed',S.auto);go(S.mode)};
$('tgFs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};
go('bebas');
})();
</script>
<script src="../alat-nav-kembali.js" defer></script>
</body>
</html>
