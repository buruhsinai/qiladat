<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roda Musim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf6e8; --card:#ffffff; --line:#f0e2c4;
    --ink:#3a3226; --dim:#8a7c62;
    --accent:#4f86c6; --accent-soft:#e8f0fb;
    --display:'Fredoka',sans-serif; --sans:'Quicksand',sans-serif; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;}
  .wrap{max-width:460px;margin:0 auto;padding:0 18px 60px;}

  .hero{padding:36px 10px 18px;text-align:center;}
  .hero h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,7vw,32px);margin:0 0 8px;color:#2d4a6b;}
  .hero p{color:var(--dim);font-size:14px;margin:0;}

  .tab-nav{display:flex;gap:8px;margin-bottom:18px;}
  .tab-btn{flex:1;font-family:var(--display);font-weight:600;font-size:13.5px;background:#fff;border:2px solid var(--line);
    color:var(--dim);padding:12px 6px;border-radius:14px;cursor:pointer;text-align:center;}
  .tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .roda-card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px 18px;text-align:center;}
  .roda-sub{font-size:12.5px;color:var(--dim);margin-bottom:16px;}

  .sky-outer{position:relative;width:290px;height:290px;margin:0 auto;touch-action:none;user-select:none;}
  .sky-circle{position:absolute;inset:0;border-radius:50%;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(255,255,255,.5), 0 6px 16px rgba(0,0,0,.12);transition:background 0.15s linear;}
  .track{position:absolute;inset:16px;border-radius:50%;border:2px dashed rgba(255,255,255,.5);}
  .marker{position:absolute;width:36px;height:36px;margin-left:-18px;margin-top:-18px;cursor:grab;z-index:5;}
  .marker:active{cursor:grabbing;}
  .icon-mark{position:absolute;width:34px;margin-left:-17px;margin-top:-17px;text-align:center;}
  .icon-mark .lbl{font-family:var(--mono);font-size:7.5px;color:#3a3226;background:rgba(255,255,255,.88);border-radius:5px;padding:1px 3px;margin-top:1px;display:inline-block;white-space:nowrap;}
  .drop{position:absolute;width:3px;height:9px;background:#bcdcf5;border-radius:2px;opacity:.85;}

  .readout{margin-top:16px;}
  .bulan-besar{font-family:var(--display);font-weight:700;font-size:20px;color:var(--ink);}
  .sub-info{font-family:var(--sans);font-size:13px;color:#4f6b8a;margin-top:3px;min-height:18px;}

  .btn-row{display:flex;gap:10px;margin-top:16px;}
  .btn-secondary{flex:1;font-family:var(--display);font-weight:600;font-size:13px;padding:11px;border-radius:12px;
    border:2px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;}

  .putaran-stat{margin-top:14px;background:var(--accent-soft);border-radius:12px;padding:10px;font-family:var(--display);
    font-size:13.5px;color:#2d4a6b;}

  .note-card{background:var(--accent-soft);border-radius:14px;padding:16px 18px;margin-top:18px;font-size:13.5px;color:#3a5a7d;text-align:left;}
  .note-card strong{color:#2d4a6b;}

  footer{text-align:center;padding-top:26px;color:#b9ad94;font-size:11.5px;font-family:var(--mono);}
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <h1>🌙 Roda Musim</h1>
    <p>Satu putaran penuh roda ini sama dengan satu tahun.</p>
  </div>

  <div class="tab-nav">
    <button class="tab-btn active" data-tab="hijri">🌙 Bulan Hijriah</button>
    <button class="tab-btn" data-tab="masehi">☀️ Bulan Masehi &amp; Musim</button>
  </div>

  <div class="roda-card">
    <div class="roda-sub">Seret penanda mengelilingi lingkaran</div>

    <div class="sky-outer" id="skyOuter">
      <div class="sky-circle" id="skyCircle"></div>
      <div id="dropsLayer"></div>
      <div class="track"></div>
      <div id="iconsLayer"></div>
      <div class="marker" id="marker"></div>
    </div>

    <div class="readout">
      <div class="bulan-besar" id="bulanBesar">Muharram</div>
      <div class="sub-info" id="subInfo"></div>
    </div>

    <div class="btn-row">
      <button class="btn-secondary" id="autoBtn" onclick="toggleAuto()">▶️ Putar Otomatis</button>
      <button class="btn-secondary" onclick="resetPutaran()">🔁 Ulang Hitungan</button>
    </div>

    <div class="putaran-stat" id="putaranStat">Sudah berputar 0 tahun penuh</div>

    <div class="note-card" id="noteCard"></div>
  </div>

  <footer>Laboratorium Pendidikan Anak — Bank Alat JAZMI/Qiladat</footer>
</div>

<script>
  const HIJRI = [
    { nama:'Muharram', tipe:'star', highlight:'Ada hari Asyura' },
    { nama:'Safar', tipe:'dot' },
    { nama:'Rabiul Awal', tipe:'dot', highlight:'Bulan kelahiran Nabi ﷺ' },
    { nama:'Rabiul Akhir', tipe:'dot' },
    { nama:'Jumadil Awal', tipe:'dot' },
    { nama:'Jumadil Akhir', tipe:'dot' },
    { nama:'Rajab', tipe:'dot' },
    { nama:"Sya'ban", tipe:'dot' },
    { nama:'Ramadan', tipe:'lantern', highlight:'Bulan puasa' },
    { nama:'Syawal', tipe:'ketupat', highlight:'Idul Fitri' },
    { nama:"Dzulqa'dah", tipe:'dot' },
    { nama:'Dzulhijjah', tipe:'kaabah', highlight:'Idul Adha & musim Haji' }
  ];

  const MASEHI = [
    { nama:'Januari', musim:'hujan' }, { nama:'Februari', musim:'hujan' }, { nama:'Maret', musim:'hujan' },
    { nama:'April', musim:'kemarau' }, { nama:'Mei', musim:'kemarau' }, { nama:'Juni', musim:'kemarau' },
    { nama:'Juli', musim:'kemarau' }, { nama:'Agustus', musim:'kemarau' }, { nama:'September', musim:'kemarau' },
    { nama:'Oktober', musim:'hujan' }, { nama:'November', musim:'hujan' }, { nama:'Desember', musim:'hujan' }
  ];

  let tabAktif = 'hijri';
  let currentAngle = 0;
  let totalAngleTravelled = 0;
  let dragging = false;
  let autoPlaying = false;
  let autoRaf = null;

  function dataAktif(){ return tabAktif === 'hijri' ? HIJRI : MASEHI; }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      tabAktif = btn.dataset.tab;
      totalAngleTravelled = 0;
      currentAngle = 0;
      renderIcons();
      updateAll(0, true);
    });
  });

  function renderIcons(){
    const layer = document.getElementById('iconsLayer');
    layer.innerHTML = '';
    const data = dataAktif();
    data.forEach((m, i) => {
      const angle = i * 30 + 15;
      const rad = angle * Math.PI/180;
      const R = 129;
      const x = 145 + R*Math.sin(rad), y = 145 - R*Math.cos(rad);
      const el = document.createElement('div');
      el.className = 'icon-mark';
      el.style.left = x+'px'; el.style.top = y+'px';
      el.innerHTML = `${iconFor(m)}<br><span class="lbl">${m.nama.slice(0,4)}</span>`;
      layer.appendChild(el);
    });
  }

  function iconFor(m){
    if(tabAktif === 'hijri'){
      switch(m.tipe){
        case 'star': return svgStar();
        case 'lantern': return svgLantern();
        case 'ketupat': return svgKetupat();
        case 'kaabah': return svgKaabah();
        default: return svgDot();
      }
    } else {
      return m.musim === 'hujan' ? svgDropIcon() : svgSunIcon();
    }
  }

  function svgDot(){ return `<svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="4" fill="#c9b48a"/></svg>`; }
  function svgStar(){ return `<svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 1 L11 7 L17 7 L12 11 L14 17 L9 13 L4 17 L6 11 L1 7 L7 7 Z" fill="#e0a83f"/></svg>`; }
  function svgLantern(){ return `<svg width="18" height="18" viewBox="0 0 18 18"><rect x="6" y="2" width="6" height="2" fill="#8a6a2a"/><ellipse cx="9" cy="9" rx="5" ry="6" fill="#e0a83f"/><rect x="7" y="15" width="4" height="2" fill="#8a6a2a"/></svg>`; }
  function svgKetupat(){ return `<svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 1 L17 9 L9 17 L1 9 Z" fill="#5cb87a" stroke="#3a7a4a" stroke-width="1"/></svg>`; }
  function svgKaabah(){ return `<svg width="18" height="18" viewBox="0 0 18 18"><rect x="3" y="4" width="12" height="12" fill="#1a1a1a"/><rect x="3" y="8" width="12" height="2.4" fill="#c9963f"/></svg>`; }
  function svgDropIcon(){ return `<svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 1 C9 1 3 9 3 12.5 C3 15.5 6 17 9 17 C12 17 15 15.5 15 12.5 C15 9 9 1 9 1 Z" fill="#4f86c6"/></svg>`; }
  function svgSunIcon(){
    let rays='';
    [0,45,90,135,180,225,270,315].forEach(a=>{
      const rad=a*Math.PI/180, x1=9+5*Math.cos(rad), y1=9+5*Math.sin(rad), x2=9+8*Math.cos(rad), y2=9+8*Math.sin(rad);
      rays+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#e0a83f" stroke-width="1.6" stroke-linecap="round"/>`;
    });
    return `<svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="4" fill="#e0a83f"/>${rays}</svg>`;
  }

  function currentIndex(angle){
    return Math.floor(((angle%360)+360)%360 / 30);
  }

  function setAngle(angle, fromDrag){
    const prev = currentAngle;
    currentAngle = ((angle % 360) + 360) % 360;

    if(fromDrag){
      let delta = currentAngle - prev;
      if(delta > 180) delta -= 360;
      if(delta < -180) delta += 360;
      totalAngleTravelled += Math.abs(delta);
    }
    updateAll(currentAngle, true);
  }

  function updateAll(angle, moveMarker){
    const data = dataAktif();
    const idx = currentIndex(angle);
    const m = data[idx];

    if(moveMarker) updateMarker(angle);
    document.getElementById('bulanBesar').textContent = m.nama;

    if(tabAktif === 'hijri'){
      document.getElementById('subInfo').textContent = m.highlight || '';
      document.getElementById('skyCircle').style.background = 'linear-gradient(180deg,#1b2340,#2a355c)';
      document.getElementById('noteCard').innerHTML = `<strong>Kenapa langitnya tidak berubah warna?</strong> Kalender Hijriah mengikuti perjalanan Bulan, bukan Matahari — jadi bulan-bulannya tidak terikat musim tertentu. Ramadan bisa jatuh di musim panas atau musim hujan tergantung tahunnya, karena satu tahun Hijriah sedikit lebih pendek dari satu tahun Masehi.`;
      setRain(false);
    } else {
      document.getElementById('subInfo').textContent = m.musim === 'hujan' ? 'Musim Hujan' : 'Musim Kemarau';
      updateMusimSky(angle);
      document.getElementById('noteCard').innerHTML = `<strong>Kenapa langitnya berubah?</strong> Di Indonesia kita tidak punya 4 musim seperti negara lain — kita punya 2: musim hujan (kira-kira Oktober–Maret) dan musim kemarau (kira-kira April–September). Pembagian ini perkiraan umum saja — bisa sedikit berbeda tiap tahun dan tiap daerah.`;
      setRain(m.musim === 'hujan');
    }
    updatePutaran();
  }

  function updateMarker(angle){
    const rad = angle * Math.PI/180;
    const R = 129, cx=145, cy=145;
    const x = cx + R*Math.sin(rad), y = cy - R*Math.cos(rad);
    const marker = document.getElementById('marker');
    marker.style.left = x+'px'; marker.style.top = y+'px';
    marker.innerHTML = moonMarkerSVG();
  }
  function moonMarkerSVG(){
    return `<svg viewBox="0 0 36 36" width="36" height="36">
      <mask id="mm"><rect width="36" height="36" fill="#fff"/><circle cx="22" cy="13" r="9.5" fill="#000"/></mask>
      <circle cx="18" cy="18" r="10.5" fill="#f3edd8" mask="url(#mm)"/>
    </svg>`;
  }

  const keyHujan = ['#5a6a85','#8296b3'];
  const keyKemarau = ['#6fc0f0','#f0d98f'];
  function updateMusimSky(angle){
    const data = MASEHI;
    const idx = currentIndex(angle);
    const posInSeg = (((angle%360)+360)%360 % 30) / 30;
    const nextIdx = (idx+1) % 12;
    const a = data[idx].musim, b = data[nextIdx].musim;
    const t = posInSeg;
    const colA = a === 'hujan' ? keyHujan : keyKemarau;
    const colB = b === 'hujan' ? keyHujan : keyKemarau;
    const top = lerpColor(colA[0], colB[0], t);
    const bot = lerpColor(colA[1], colB[1], t);
    document.getElementById('skyCircle').style.background = `linear-gradient(180deg, ${top}, ${bot})`;
  }
  function lerpColor(c1,c2,t){
    const p1=hexToRgb(c1), p2=hexToRgb(c2);
    const r=Math.round(p1[0]+(p2[0]-p1[0])*t), g=Math.round(p1[1]+(p2[1]-p1[1])*t), b=Math.round(p1[2]+(p2[2]-p1[2])*t);
    return `rgb(${r},${g},${b})`;
  }
  function hexToRgb(hex){ const v=parseInt(hex.slice(1),16); return [(v>>16)&255,(v>>8)&255,v&255]; }

  let rainInterval = null;
  function setRain(on){
    if(on && !rainInterval){
      rainInterval = setInterval(spawnDrop, 220);
    } else if(!on && rainInterval){
      clearInterval(rainInterval);
      rainInterval = null;
      document.getElementById('dropsLayer').innerHTML = '';
    }
  }
  function spawnDrop(){
    const layer = document.getElementById('dropsLayer');
    const d = document.createElement('div');
    d.className = 'drop';
    const x = 40 + Math.random()*210;
    d.style.left = x+'px'; d.style.top = '20px';
    layer.appendChild(d);
    let y = 20;
    const fall = setInterval(() => {
      y += 8;
      d.style.top = y+'px';
      if(y > 250){ clearInterval(fall); d.remove(); }
    }, 30);
  }

  function updatePutaran(){
    const putaran = Math.floor(totalAngleTravelled / 360);
    document.getElementById('putaranStat').textContent = `Sudah berputar ${putaran} tahun penuh`;
  }
  function resetPutaran(){ totalAngleTravelled = 0; updatePutaran(); }

  function attachDrag(){
    const outer = document.getElementById('skyOuter');
    function posFromEvent(e){
      const rect = outer.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const x = clientX - rect.left - rect.width/2;
      const y = clientY - rect.top - rect.height/2;
      let angle = Math.atan2(x, -y) * 180/Math.PI;
      if(angle < 0) angle += 360;
      return angle;
    }
    function start(e){ dragging = true; stopAuto(); move(e); e.preventDefault(); }
    function move(e){ if(!dragging) return; setAngle(posFromEvent(e), true); e.preventDefault(); }
    function end(){ dragging = false; }

    outer.addEventListener('mousedown', start);
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    outer.addEventListener('touchstart', start, {passive:false});
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', end);
  }

  function toggleAuto(){
    autoPlaying = !autoPlaying;
    document.getElementById('autoBtn').textContent = autoPlaying ? '⏸️ Berhenti' : '▶️ Putar Otomatis';
    if(autoPlaying) runAuto(); else stopAuto();
  }
  function stopAuto(){
    autoPlaying = false;
    document.getElementById('autoBtn').textContent = '▶️ Putar Otomatis';
    if(autoRaf) cancelAnimationFrame(autoRaf);
  }
  function runAuto(){
    let last = performance.now();
    function loop(ts){
      if(!autoPlaying) return;
      const dt = (ts-last)/1000; last = ts;
      const degPerSecond = 360/22;
      setAngle(currentAngle + dt*degPerSecond, true);
      autoRaf = requestAnimationFrame(loop);
    }
    autoRaf = requestAnimationFrame(loop);
  }

  renderIcons();
  attachDrag();
  updateAll(0, true);
</script>

<script src="../alat-nav-kembali.js" defer></script>
</body>
</html>
